<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notas Fiscais — ALMOX PRO</title>
<style>
/* ============================================================
   NOTAS_FISCAIS · nf.css · 08/11/2026 · versão final
   ------------------------------------------------------------
   Reconstruído sobre a imagem de referência aprovada.
   Azul-marinho no cabeçalho do painel, azul forte nos botões
   principais, fundo branco e cinza muito claro, cartões com
   borda discreta, sombra suave. Nada decorativo.
   ============================================================ */
:root{
  --marinho:#0A2A54; --marinho-2:#06203F;
  --azul:#1565D8; --azul-2:#0E4FAE; --azul-f:#EBF3FE; --azul-b:#BFD9FA;
  --fundo:#F1F4F9; --papel:#FFF; --borda:#DEE4EC; --borda-2:#EDF1F6;
  --texto:#11253C; --texto-2:#51637A; --texto-3:#8694A8;
  --bom:#16803C; --bom-f:#E8F6ED; --bom-b:#B4E0C4;
  --at:#8A5A14; --at-f:#FFF7E6; --at-b:#F0D194;
  --erro:#A62B22; --erro-f:#FDEDEB; --erro-b:#EFB6AE;
  --sombra:0 1px 2px rgba(10,42,84,.05),0 2px 6px rgba(10,42,84,.045);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--fundo);color:var(--texto);
  font:13.5px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.pagina{min-height:100vh;display:flex;flex-direction:column}
.conteudo{flex:1;padding:0 22px 22px}

/* ---------- trilha e título ---------- */
.trilha{padding:10px 22px;background:var(--papel);border-bottom:1px solid var(--borda);
  font-size:12.5px;color:var(--texto-3);display:flex;gap:7px;align-items:center}
.trilha b{color:var(--texto);font-weight:600}
.cab{display:flex;gap:15px;align-items:flex-start;padding:20px 0 16px}
.cab .fig{width:46px;height:46px;border-radius:11px;background:var(--azul-f);
  color:var(--azul);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.cab h1{margin:0;font-size:27px;font-weight:700;color:var(--marinho);letter-spacing:-.5px}
.cab p{margin:4px 0 0;font-size:13.5px;color:var(--texto-2);max-width:760px}

/* ---------- cartão de importação ---------- */
.importa{background:var(--papel);border:1px solid var(--borda);border-radius:12px;
  box-shadow:var(--sombra);padding:15px 17px;display:flex;gap:15px;align-items:center;
  flex-wrap:wrap;margin-bottom:16px}
.importa .fig{width:46px;height:46px;border-radius:11px;background:var(--azul-f);
  color:var(--azul);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.importa .txt{min-width:170px}
.importa .txt b{display:block;font-size:14.5px;color:var(--marinho)}
.importa .txt span{font-size:12.5px;color:var(--texto-2);line-height:1.4;display:block}
.chave-caixa{flex:1;min-width:270px;position:relative;display:flex;align-items:center}
.chave-caixa .ico{position:absolute;left:12px;color:var(--texto-3);font-size:13px;
  letter-spacing:-1px}
#nfChave{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--borda);
  border-radius:9px;font:inherit;font-size:13.5px;background:#FBFCFE;
  font-family:ui-monospace,Consolas,monospace}
#nfChave:focus{outline:none;border-color:var(--azul);background:#fff;
  box-shadow:0 0 0 3px rgba(21,101,216,.13)}
#nfChave.ruim{border-color:var(--at);background:var(--at-f)}
#nfChave.boa{border-color:var(--bom);background:var(--bom-f)}

/* ---------- botões ---------- */
.btn{background:var(--papel);border:1px solid var(--borda);border-radius:9px;
  padding:10px 15px;font:inherit;font-size:13px;color:var(--texto);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn.primario{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:500}
.btn.primario:hover{background:var(--azul-2);color:#fff}
.btn.coluna{flex-direction:column;gap:3px;padding:9px 16px;font-size:12.5px}
.btn.coluna .i{font-size:16px}
.btn.peq{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--borda);color:var(--texto)}
.btn[disabled].primario:hover{background:var(--azul);color:#fff}
.btn-ic{background:transparent;border:0;padding:4px 6px;cursor:pointer;
  color:var(--texto-3);font-size:15px;border-radius:5px;line-height:1}
.btn-ic:hover{background:var(--azul-f);color:var(--azul)}
.btn-ic.lixo:hover{background:var(--erro-f);color:var(--erro)}
.btn-ic[disabled]{opacity:.3;cursor:not-allowed}
.btn-ic[disabled]:hover{background:transparent;color:var(--texto-3)}

/* ---------- abas com contagem ---------- */
.abas{display:flex;gap:4px;flex-wrap:wrap;background:var(--papel);
  border:1px solid var(--borda);border-radius:12px 12px 0 0;border-bottom:0;
  padding:4px 6px 0;box-shadow:var(--sombra)}
.aba{background:transparent;border:0;border-bottom:3px solid transparent;
  padding:11px 15px;font:inherit;font-size:13px;color:var(--texto-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;border-radius:7px 7px 0 0}
.aba:hover{background:var(--azul-f);color:var(--azul)}
.aba.on{color:var(--marinho);font-weight:600;border-bottom-color:var(--azul)}
.aba .q{font-weight:700;font-size:14.5px;color:var(--marinho)}
.aba.on .q{color:var(--azul)}
.aba.alerta{color:var(--at)} .aba.alerta .q{color:var(--at)}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  background:var(--papel);border:1px solid var(--borda);border-top:0;border-bottom:0;
  padding:12px 14px}
.busca{flex:1;min-width:240px;position:relative;display:flex;align-items:center}
.busca .ico{position:absolute;left:11px;color:var(--texto-3);font-size:13px}
.busca input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--borda);
  border-radius:9px;font:inherit;font-size:13px;background:#FBFCFE}
.busca input:focus{outline:none;border-color:var(--azul);background:#fff;
  box-shadow:0 0 0 3px rgba(21,101,216,.13)}
.periodo{display:flex;align-items:center;gap:7px;background:#FBFCFE;
  border:1px solid var(--borda);border-radius:9px;padding:6px 11px;font-size:12.5px}
.periodo input{border:0;padding:3px 1px;font:inherit;font-size:12.5px;background:transparent;
  color:var(--texto)}
.periodo input:focus{outline:none}
.periodo span{color:var(--texto-3)}

/* ---------- tabela ---------- */
.cartao{background:var(--papel);border:1px solid var(--borda);
  border-radius:0 0 12px 12px;box-shadow:var(--sombra);overflow:hidden}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;font-size:11.5px;color:var(--texto-2);font-weight:600;
  padding:11px 13px;border-bottom:1px solid var(--borda);background:#F7F9FC;white-space:nowrap}
.tabela td{padding:11px 13px;border-bottom:1px solid var(--borda-2);vertical-align:middle}
.tabela tbody tr:hover{background:#F8FBFF}
.tabela tbody tr.escolhida{background:var(--azul-f)}
.tabela tbody tr.escolhida td:nth-child(2){font-weight:700;color:var(--azul)}
.tabela tbody tr.escolhida td:nth-child(4){font-weight:600;color:var(--azul)}
.tabela .num{text-align:right;white-space:nowrap}
.tabela.densa td,.tabela.densa th{padding:8px 9px;font-size:12.5px}
td.vazio{text-align:center;color:var(--texto-3);padding:36px}
.rodape-tab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border-top:1px solid var(--borda-2);background:#FBFCFE;font-size:12.5px}
.paginas{display:flex;gap:4px;margin-left:auto}
.paginas button{min-width:31px;height:31px;border:1px solid var(--borda);background:var(--papel);
  border-radius:7px;font:inherit;font-size:12.5px;color:var(--texto-2);cursor:pointer}
.paginas button:hover{border-color:var(--azul);color:var(--azul)}
.paginas button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
.paginas button[disabled]{opacity:.35;cursor:not-allowed}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.mudo{color:var(--texto-3)} .peq{font-size:11.5px}
.faltando{color:var(--at);font-weight:600}

/* ---------- selos ---------- */
.selo{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  padding:4px 10px;border-radius:7px;border:1px solid;white-space:nowrap;font-weight:500}
.selo-confirmada{color:var(--bom);background:var(--bom-f);border-color:var(--bom-b)}
.selo-conferencia{color:var(--at);background:var(--at-f);border-color:var(--at-b)}
.selo-rascunho{color:var(--azul-2);background:var(--azul-f);border-color:var(--azul-b)}
.selo-cancelada{color:var(--erro);background:var(--erro-f);border-color:var(--erro-b)}
.selo-outra{color:var(--at);background:var(--at-f);border-color:var(--at-b)}
.elo{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--azul);
  font-family:ui-monospace,Consolas,monospace}

/* ---------- painel ---------- */
#nfPainel{display:none;position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);
  background:var(--papel);border-left:1px solid var(--borda);
  box-shadow:-14px 0 40px rgba(10,42,84,.14);overflow:auto;z-index:60}
#nfPainel.on{display:block}
@media (min-width:1320px){
  body.com-painel .pagina{padding-right:620px}
  body.com-painel #nfPainel{box-shadow:none}
}
.painel-topo{position:sticky;top:0;z-index:2;background:var(--marinho);color:#fff;
  padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.painel-topo b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.painel-topo .x{background:transparent;border:0;color:#9FBBDC;font-size:21px;
  cursor:pointer;line-height:1;padding:2px 8px;border-radius:6px}
.painel-topo .x:hover{background:#143A66;color:#fff}
.painel-abas{display:flex;border-bottom:1px solid var(--borda);background:#F7F9FC}
.painel-abas button{flex:1;background:transparent;border:0;border-bottom:3px solid transparent;
  padding:13px 8px;font:inherit;font-size:13px;color:var(--texto-2);cursor:pointer}
.painel-abas button:hover{background:var(--azul-f)}
.painel-abas button.on{background:var(--papel);color:var(--marinho);font-weight:600;
  border-bottom-color:var(--azul)}
.painel-corpo{padding:15px 18px}
.linhas .linha{display:flex;justify-content:space-between;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--borda-2);font-size:13px}
.linhas .linha span{color:var(--texto-2)}
.linhas .linha b{text-align:right}
.bloco{border:1px solid var(--borda);border-radius:11px;padding:14px;margin:14px 0;
  background:#FBFCFE}
.bloco-tit{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
  color:var(--marinho);margin-bottom:11px}
.celula{width:82px;padding:5px 8px;border:1px solid var(--borda);border-radius:7px;
  font:inherit;font-size:12.5px;text-align:right;background:#fff;color:var(--texto-2)}
.ficha{display:inline-flex;align-items:center;gap:8px;background:var(--azul-f);
  border:1px solid var(--azul-b);border-radius:8px;padding:6px 11px;font-size:12.5px;
  color:var(--azul-2);font-weight:500;margin-top:9px}
.ficha button{background:transparent;border:0;color:var(--azul);cursor:pointer;
  font-size:14px;line-height:1;padding:0 2px}
.resumo{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin-top:14px}
.resumo .lista{flex:1;min-width:200px;font-size:13px}
.resumo .lista .linha{display:flex;justify-content:space-between;padding:4px 0}
.total-grande{background:var(--azul-f);border:1px solid var(--azul-b);border-radius:11px;
  padding:14px 22px;text-align:center;min-width:215px;display:grid;align-content:center}
.total-grande span{font-size:12.5px;color:var(--azul-2);font-weight:600}
.total-grande b{font-size:26px;color:var(--marinho);letter-spacing:-.6px}
.rodape-painel{position:sticky;bottom:0;background:var(--papel);
  border-top:1px solid var(--borda);padding:13px 18px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- avisos ---------- */
.aviso{background:var(--at-f);border:1px solid var(--at-b);color:var(--at);
  border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin:12px 0}
.aviso.bom{background:var(--bom-f);border-color:var(--bom-b);color:var(--bom)}
.aviso.erro{background:var(--erro-f);border-color:var(--erro-b);color:var(--erro)}
.aviso.leve{background:var(--azul-f);border-color:var(--azul-b);color:var(--marinho)}

/* ---------- rodapé de integração ---------- */
.rodape{background:var(--papel);border-top:1px solid var(--borda);
  padding:13px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;font-size:12.5px}
.rodape b{color:var(--marinho);display:flex;align-items:center;gap:9px;font-size:13px}
.rodape .sep{width:1px;height:17px;background:var(--borda)}
.rodape .item{display:flex;align-items:center;gap:7px;color:var(--texto-2)}
.pt{width:15px;height:15px;border-radius:50%;flex-shrink:0;display:grid;
  place-items:center;font-size:9px;color:#fff;font-weight:700}
.pt.v{background:#18A452}.pt.a{background:#E0A32E}.pt.x{background:#C2342A}
.pt.c{background:#C3CBD6}

@media (max-width:900px){
  .cab h1{font-size:22px}
  .conteudo{padding:0 14px 16px}
  .trilha{padding:9px 14px}
  .tabela th:nth-child(3),.tabela td:nth-child(3){display:none}
  #nfPainel{width:100%}
  .resumo .lista{min-width:100%}
}
@media (max-width:620px){
  .tabela th:nth-child(5),.tabela td:nth-child(5){display:none}
  .importa{padding:12px}
}

/* ------------------------------------------------------------
   O PDF DE CONFERÊNCIA · 09/11
   Fica à ESQUERDA do painel da nota, para o Ismael comparar
   item por item sem trocar de tela. É o trabalho dele.
   ------------------------------------------------------------ */
#nfPdf{display:none;position:fixed;top:0;bottom:0;right:0;width:min(620px,100%);
  background:var(--papel);border-left:1px solid var(--borda);
  box-shadow:-14px 0 40px rgba(10,42,84,.14);z-index:55;
  flex-direction:column}
#nfPdf.on{display:flex}
body.com-painel #nfPdf{right:620px;box-shadow:-10px 0 28px rgba(10,42,84,.10)}
.pdf-aviso{background:var(--at-f);border-bottom:1px solid var(--at-b);
  color:var(--at);padding:9px 14px;font-size:12px;line-height:1.45}
.pdf-quadro{flex:1;width:100%;border:0;display:block;min-height:0}
@media (min-width:1960px){
  body.com-painel.com-pdf .pagina{padding-right:1240px}
}
@media (max-width:1320px){
  #nfPdf, body.com-painel #nfPdf{right:0;width:100%;z-index:65}
}

</style>
</head>
<body>
<!-- Sem cabeçalho global e sem menu lateral: os dois são do ALMOX
     PRO, e a seção 2 manda não repetir o que já é do sistema. -->
<div class="pagina">
  <div class="trilha" id="nfTrilha">ALMOX PRO / Operações / <b>Notas Fiscais</b></div>
  <div class="cab">
    <div class="fig">🧾</div>
    <div>
      <h1>Notas Fiscais</h1>
      <p>Entrada e conferência de NF-e, importação por chave, XML ou PDF, com integração ao estoque, compras e reservas.</p>
    </div>
  </div>
  <div class="area"><div id="nfCorpo"></div></div>
  <div class="rodape" id="nfRodape"></div>
</div>

<div id="nfPdf"></div>
<div id="nfPainel"></div>
<input type="file" id="nfArquivo" accept=".xml,text/xml,application/xml" style="display:none">
<input type="file" id="nfPdfArquivo" accept=".pdf,application/pdf" style="display:none">

<script>
/* ========== nfauto.js ========== */
/* ============================================================
   NOTAS_FISCAIS · nfauto.js · 09/11/2026
   ------------------------------------------------------------
   A PONTE DAS AUTOMAÇÕES.

   O Ismael pediu: "pega as funções da versão antiga, dá um pente
   fino, traz todas as automações para cá". O pente fino achou
   33 funções NF_* e 11 janelas no sistema principal.

   E a resposta certa NÃO é trazer: é CHAMAR.

   Por quê. Dentro daquelas funções mora conhecimento que custou
   caro. O NF_SALVAR_EDICAO, por exemplo, tem este aviso escrito
   no corpo, datado de v163:

     "AQUI HAVIA UM PLANO B QUE ESTRAGAVA A NOTA. Ele tentava
      gravar a correção com nf.salvar. Esse módulo ACRESCENTA
      linha — nunca substitui. Resultado: a correção entrava
      como um segundo lançamento inteiro e a nota dobrava de
      valor e de itens. Foi o que aconteceu com a 53072."

   Uma cópia minha não teria essa cicatriz. Teria o código, não
   a lição — e repetiria a 53072 no primeiro caso de borda que
   eu não previsse. Eu mesmo quase propus isso ontem à noite.

   Então o módulo roda no mesmo endereço do sistema, enxerga o
   window.parent, e usa AS FUNÇÕES DELE. Uma versão só de cada
   cálculo. Quando o Ismael melhorar o NF_SALDO lá, o módulo
   melhora junto, sem eu encostar aqui.

   Sem o sistema do lado, nada disso existe — e aí cada função
   devolve "não disponível" em vez de um número inventado.
   ============================================================ */
(function (raiz) {
  'use strict';

  var A = { nome: 'NFAUTO', versao: '09/11' };

  /* as automações do sistema que este módulo usa, com o que cada
     uma faz. Nome que não estiver nesta lista, o módulo não chama:
     a regra dele é não inventar função. */
  A.CATALOGO = {
    NF_AGRUPAR:        'junta os lançamentos da mesma nota num registro só',
    NF_SALDO:          'declarado × lançado: o "falta lançar R$ X"',
    NF_VALE:           'a nota conta, ou foi excluída',
    NF_SOMA_ITENS:     'soma dos itens com arredondamento fiscal',
    NF_IDENTIDADE:     'a identidade de uma nota',
    NF_IDENTIDADES:    'as identidades possíveis, com e sem CNPJ',
    NF_MESMA_NOTA:     'duas notas são a mesma?',
    NF_JA_EXISTE:      'esta nota já foi lançada?',
    NF_DAS_ENTRADAS:   'entradas de estoque sem nota lançada',
    NF_FORNECEDOR_LIMPO: 'tira "não informado" e o nome da própria empresa',
    NF_EH_MINHA_EMPRESA: 'o fornecedor é a própria COESA?',
    NF_ITENS_REPETIDOS:  'itens repetidos dentro da nota',
    NF_PISTAS_DA_DIFERENCA: 'por que a soma não fecha',
    NF_SO_NUMEROS:     'deixa só os dígitos',
    NF_NORMAL:         'normaliza texto para comparar',
    NF_NUMERO_DO_DOC:  'o número do documento, limpo',
    NF_LINHAS_DA_NOTA: 'quantas linhas a nota ocupa na planilha',
    NF_QUEM_ESTA:      'quem está operando agora',
    quantosItensNaNota: 'conta os itens, em qualquer formato',
    avisoDeFornecedorSuspeito: 'fornecedor estranho para esta nota'
  };

  /* as janelas do sistema. Abrem no DOM do ALMOX PRO, por cima de
     tudo — que é melhor do que espremidas dentro do quadro. */
  A.JANELAS = {
    modalDetalheNF:      'o detalhe completo da nota',
    modalEditarNota:     'a edição, com gravação conferida',
    modalExcluirNota:    'excluir com registro',
    modalConferenciaNF:  'a conferência item a item',
    modalItensNovosNF:   'itens que não estão no catálogo',
    modalFornecedorDaNota: 'acertar o fornecedor',
    modalRestaurarNota:  'trazer de volta uma excluída',
    modalPatrimonioDaNota: 'patrimônio a partir da nota',
    modalNotaLancada:    'o recibo do lançamento',
    modalItemAvulsoNF:   'item fora da nota',
    modalLimparNotas:    'recomeçar do zero',
    modalOCR:            'lê PDF ou foto da nota e preenche os campos',
    modalXML:            'lê o XML e preenche os campos'
  };

  /* ------------------------------------------------------------
     IR PARA UMA TELA DO SISTEMA

     O lançamento manual mora na aba "Importar" do ALMOX PRO, com
     formulário e tudo. Em vez de eu desenhar outro formulário
     aqui — que seria um segundo jeito de lançar a mesma nota —
     o módulo leva o Ismael até lá.
     ------------------------------------------------------------ */
  A.ROTAS = {
    'nf-importar':   'lançar manual, por XML ou por OCR',
    'nf-conferencia':'conferência item a item',
    'nf-divergencias':'as divergências',
    'nf-historico':  'o histórico',
    'nf-confronte':  'o confronte com o pedido'

<script>
/* ========== nfdados.js ========== */
/* ============================================================
   NOTAS_FISCAIS · nfdados.js · 08/11/2026
   ------------------------------------------------------------
   As contas da Central de Notas. Matemática e texto, nenhuma
   linha de tela e nenhuma chamada ao Core — para ter prova
   rodando sem navegador, que é a parte que eu consigo garantir.

   O formato da nota NÃO foi inventado: saiu da auditoria de
   08/11, lendo o que o próprio ALMOX PRO já usa da resposta do
   nf.listar:

     numero · serie · chave · fornecedor · cnpj
     emissao · valor · status · origem · itens

   Campo que o Core não devolver fica vazio na tela. Não se
   preenche buraco com chute.
   ============================================================ */
(function (raiz) {
  'use strict';

  var D = { nome: 'NFDADOS', versao: '08/11' };

  function texto(v) { return String(v === null || v === undefined ? '' : v).trim(); }
  function semAcento(s) {
    return texto(s).toLowerCase()
      .replace(/[áàâã]/g, 'a').replace(/[éê]/g, 'e').replace(/í/g, 'i')
      .replace(/[óôõ]/g, 'o').replace(/ú/g, 'u').replace(/ç/g, 'c');
  }
  D.semAcento = semAcento;

  /* ------------------------------------------------------------
     SITUAÇÃO · as cinco abas da seção 5A
     ------------------------------------------------------------ */
  D.SITUACOES = [
    { id: 'todas',       nome: 'Todas' },
    { id: 'rascunho',    nome: 'Rascunhos' },
    { id: 'conferencia', nome: 'Em conferência' },
    { id: 'confirmada',  nome: 'Confirmadas' },
    { id: 'cancelada',   nome: 'Canceladas' }
  ];

  /** o status que o Core mandou, traduzido para uma das abas.
      O que não se reconhece vira 'outra' e APARECE — nunca some. */
  D.situacaoDe = function (nota) {
    var s = semAcento((nota && (nota.status || nota.situacao)) || '');
    if (!s) return 'outra';
    if (/rascunho|digitando|aberta/.test(s)) return 'rascunho';
    if (/conferenc|pendente|aguardand|divergenc/.test(s)) return 'conferencia';
    if (/confirmad|lancad|finalizad|recebid|concluid/.test(s)) return 'confirmada';
    if (/cancelad|estornad|anulad/.test(s)) return 'cancelada';
    return 'outra';
  };

  /* ------------------------------------------------------------
     PROCURAR · número, chave, fornecedor, CNPJ
     ------------------------------------------------------------ */
  D.combina = function (nota, procura) {
    var q = semAcento(procura);
    if (!q) return true;
    var n = nota || {};
    /* a chave e o CNPJ a pessoa digita só com números */
    var soNumeros = q.replace(/\D/g, '');
    var alvos = [n.numero, n.serie, n.fornecedor, n.cnpj, n.chave, n.origem];
    for (var i = 0; i < alvos.length; i++) {
      if (semAcento(alvos[i]).indexOf(q) > -1) return true;
    }
    if (soNumeros.length >= 3) {
      var chave = texto(n.chave).replace(/\D/g, '');
      var cnpj = texto(n.cnpj).replace(/\D/g, '');
      if (chave.indexOf(soNumeros) > -1) return true;
      if (cnpj.indexOf(soNumeros) > -1) return true;
      if (texto(n.numero).replace(/\D/g, '') === soNumeros) return true;
    }

  };

  /* ------------------------------------------------------------
     DATA · do jeito que a nota vier
     ------------------------------------------------------------ */
  D.dataISO = function (v) {
    var s = texto(v);
    if (!s) return '';
    var br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (br) return br[3] + '-' + br[2] + '-' + br[1];
    var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];
    return '';

  D.dataBR = function (v) {
    var i = D.dataISO(v);
    if (!i) return texto(v);

  D.noPeriodo = function (nota, de, ate) {

    var d = D.dataISO(nota && nota.emissao);

       aparece e fica visível que a data está faltando. Sumir
       com registro é como se perde nota no almoxarifado. */
    if (!d) return true;

    if (ate && d > ate) return false;

     FILTRAR E CONTAR
     ------------------------------------------------------------ */
  D.filtrar = function (notas, filtro) {
    var lista = Object.prototype.toString.call(notas) === '[object Array]' ? notas : [];
    var f = filtro || {};
    return lista.filter(function (n) {
      if (!n) return false;
      if (f.situacao && f.situacao !== 'todas' && D.situacaoDe(n) !== f.situacao) return false;
      if (!D.noPeriodo(n, f.de, f.ate)) return false;
      if (!D.combina(n, f.procura)) return false;
      return true;
    });
  };

  D.contarPorSituacao = function (notas) {
    var lista = Object.prototype.toString.call(notas) === '[object Array]' ? notas : [];
    var c = { todas: lista.length, rascunho: 0, conferencia: 0,
              confirmada: 0, cancelada: 0, outra: 0 };
    for (var i = 0; i < lista.length; i++) {
      var s = D.situacaoDe(lista[i]);
      c[s] = (c[s] || 0) + 1;
    }
    return c;
  };

  D.somar = function (notas) {
    var lista = Object.prototype.toString.call(notas) === '[object Array]' ? notas : [];
    var cent = 0, semValor = 0;
    for (var i = 0; i < lista.length; i++) {
      var v = D.valorDe(lista[i] && lista[i].valor);
      if (v === null) { semValor++; continue; }
      cent += Math.round(v * 100);
    }
    /* quantas notas NÃO entraram na soma é dito junto com o total.
       Total que esconde omissão é total errado com cara de certo. */
    return { total: cent / 100, notas: lista.length - semValor, semValor: semValor };
  };

  /* ------------------------------------------------------------
     ORDENAR · a mais nova primeiro, sem data por último
     ------------------------------------------------------------ */
  D.ordenar = function (notas) {
    var lista = (Object.prototype.toString.call(notas) === '[object Array]' ? notas : []).slice();
    return lista.sort(function (a, b) {
      var da = D.dataISO(a && a.emissao), db = D.dataISO(b && b.emissao);
      if (da && db && da !== db) return da < db ? 1 : -1;
      if (da && !db) return -1;
      if (!da && db) return 1;
      var na = Number(texto(a && a.numero).replace(/\D/g, '')) || 0;
      var nb = Number(texto(b && b.numero).replace(/\D/g, '')) || 0;

    });

  /* ------------------------------------------------------------
     A CHAVE · 44 dígitos, e o que dá para ler deles
     ------------------------------------------------------------ */
  D.chaveValida = function (v) {
    return texto(v).replace(/\D/g, '').length === 44;
  };

  /** a chave carrega o CNPJ do emitente, o modelo, a série e o
      número. Ler isso é conferência, não consulta: não vai à
      SEFAZ, não promete nada, só lê o que já está na mão. */
  D.lerChave = function (v) {
    var c = texto(v).replace(/\D/g, '');
    if (c.length !== 44) return null;
    return {
      uf: c.slice(0, 2),
      anoMes: c.slice(4, 6) + '/' + c.slice(2, 4),
      cnpj: c.slice(6, 20),
      modelo: c.slice(20, 22),
      serie: String(Number(c.slice(22, 25))),
      numero: String(Number(c.slice(25, 34)))

  };

  D.cnpjBonito = function (v) {
    var c = texto(v).replace(/\D/g, '');
    if (c.length !== 14) return texto(v);
    return c.slice(0, 2) + '.' + c.slice(2, 5) + '.' + c.slice(5, 8) +

  };

  D.chaveBonita = function (v) {
    var c = texto(v).replace(/\D/g, '');
    if (c.length !== 44) return texto(v);
    return c.match(/.{1,4}/g).join(' ');
  };


  /* ------------------------------------------------------------
     O MÊS · para o quadro "Valor de Entradas (Mês)"

     O desenho dele traz esse número. O número é real: sai das
     notas que o Core devolveu, no mês pedido. Quando não há
     nota no mês, é zero — e zero se mostra como zero, não se
     enfeita com o total do ano.
     ------------------------------------------------------------ */
  D.mesDeHoje = function (agora) {

    var m = String(d.getMonth() + 1);
    if (m.length < 2) m = '0' + m;
    return d.getFullYear() + '-' + m;
  };

  D.doMes = function (notas, anoMes) {
    var lista = Object.prototype.toString.call(notas) === '[object Array]' ? notas : [];
    var alvo = texto(anoMes) || D.mesDeHoje();
    var dentro = lista.filter(function (n) {
      var i = D.dataISO(n && n.emissao);
      return i && i.slice(0, 7) === alvo;
    });
    var s = D.somar(dentro);
    return { mes: alvo, notas: dentro.length, total: s.total, semValor: s.semValor };
  };

  /* o que a nota traz de vínculo com reserva ou compra. Campo que
     o Core não devolver fica nulo — não se inventa RES-00125. */
  D.vinculoDe = function (nota) {
    var n = nota || {};
    var cands = [
      ['reserva', n.reserva], ['reserva', n.reservaVinculada], ['reserva', n.res],
      ['compra', n.pedido], ['compra', n.pedidoCompra], ['compra', n.compra],
      ['requisicao', n.requisicao]
    ];
    for (var i = 0; i < cands.length; i++) {
      var v = texto(cands[i][1]);
      if (v) return { tipo: cands[i][0], codigo: v };
    }
    return null;
  };


  /* ------------------------------------------------------------
     O DÍGITO VERIFICADOR DA CHAVE · seção 5.1

     Os 44 dígitos terminam num dígito calculado sobre os 43
     primeiros (módulo 11, pesos de 2 a 9). Conferir isso pega
     chave digitada errada ANTES de alguém sair procurando nota
     que não existe.

     E tem um limite que precisa estar escrito: conferir o
     dígito NÃO é consultar a nota. A chave pode estar
     perfeitamente formada e a nota não existir, ou estar
     cancelada. A seção 5 proíbe afirmar que a chave foi
     consultada quando o sistema só leu os dígitos — então esta
     função devolve "o número é bem formado", e nada além.
     ------------------------------------------------------------ */
  D.digitoDaChave = function (quarentaETres) {
    var c = texto(quarentaETres).replace(/\D/g, '').slice(0, 43);
    if (c.length !== 43) return null;

    for (var i = 42; i >= 0; i--) {

  D.conferirChave = function (v) {
    var c = texto(v).replace(/\D/g, '');
    if (!c) return { ok: false, motivo: 'vazia', texto: 'Digite ou cole a chave de acesso.' };
    if (c.length < 44) return { ok: false, motivo: 'curta', faltam: 44 - c.length,
      texto: 'Faltam ' + (44 - c.length) + ' dígito(s) — a chave tem 44.' };
    if (c.length > 44) return { ok: false, motivo: 'longa', sobram: c.length - 44,
      texto: 'Sobram ' + (c.length - 44) + ' dígito(s) — a chave tem 44.' };

    var esperado = D.digitoDaChave(c);
    var veio = Number(c.charAt(43));
    if (esperado !== veio) {
      return { ok: false, motivo: 'digito', esperado: esperado, veio: veio,
        texto: 'Os 44 dígitos estão aí, mas o dígito verificador não bate ' +
               '(a conta dá ' + esperado + ' e veio ' + veio + '). ' +
               'Quase sempre é erro de digitação em algum dígito do meio.' };
    }

    return { ok: true, chave: c, partes: l,

<script>
/* ========== nfporta.js ========== */
/* ============================================================
   NOTAS_FISCAIS · nfporta.js · 08/11/2026
   ------------------------------------------------------------
   A PORTA. Como este módulo fala com o Core.

   Isto é cópia de arquitetura, não de código: é o mesmo caminho
   que o módulo 3D usou hoje, depois de três recusas seguidas do
   Core — chave, sessão, e o que viria depois.

   A lição daquelas três recusas: montar envelope por fora é
   construir uma SEGUNDA porta de entrada, e a regra dele é não
   duplicar autenticação, sessão, usuários nem permissões. O
   ALMOX PRO já tem uma porta que funciona, com a sessão dele,
   o perfil, a obra, a chave e o prazo. Este módulo bate NAQUELA
   porta.

   Resultado prático: aqui não há login, não há token, não há
   chave, não há nada guardado. Se a porta não estiver ao
   alcance, ele DIZ, e não finge ter dados.
   ============================================================ */
(function (raiz) {
  'use strict';

  var P = {
    nome: 'NFPORTA',
    versao: '08/11',
    chamadas: 0,
    falhas: 0,
    origemDaPorta: 'nenhuma',
    ultima: null
  };

  /* as ações que o frontend do ALMOX PRO JÁ chama hoje. Nenhuma
     foi inventada: saíram da auditoria de 08/11, lendo o próprio
     v23. Ação que não está nesta lista, este módulo não chama. */
  P.ACOES = {
    listar:              ['nf', 'listar'],

    /* ---- os motores centrais, para o rodapé de integração ----
       A seção 4I pede o estado REAL de cada um, e a seção 3 diz:
       "não basta mostrar indicadores verdes na tela; cada
       indicador deverá refletir o resultado de uma verificação
       real". Então o rodapé CHAMA cada motor e mostra o que
       voltou. Verde só depois de resposta.

       As quatro abaixo saíram da auditoria do v23 — são as que o
       próprio ALMOX PRO já usa. Auditoria não entrou: eu não
       encontrei a ação dela, e o rodapé vai dizer isso em vez de
       pintar de verde. */
    produtos:            ['itens', 'listar'],
    compras:             ['compras', 'listar'],
    reservas:            ['reservas', 'listar'],
    estoque:             ['estoque', 'listar'],
    obter:               ['nf', 'obter'],
    itens:               ['nf', 'itens'],
    pendentes:           ['nf', 'pendentes'],
    divergencias:        ['nf', 'divergencias'],
    registrarDivergencia:['nf', 'registrarDivergencia'],
    decidirDivergencia:  ['nf', 'decidirDivergencia']
  };

  /* ------------------------------------------------------------
     ACHAR A PORTA · só no mesmo endereço, e só do sistema
     ------------------------------------------------------------ */
  P.portaDoSistema = function () {
    var janelas = [];
    try { if (raiz.parent && raiz.parent !== raiz) janelas.push(raiz.parent); } catch (e) {}
    try { if (raiz.opener) janelas.push(raiz.opener); } catch (e) {}

    for (var i = 0; i < janelas.length; i++) {
      try {
        var j = janelas[i];
        if (j && j.API && typeof j.API.call === 'function') {
          P.origemDaPorta = i === 0 ? 'o sistema, pelo quadro' : 'o sistema, pela aba de origem';
          return function (modulo, acao, payload) { return j.API.call(modulo, acao, payload); };
        }
      } catch (e) { /* outra origem: o navegador barra, e está certo */ }
    }
    P.origemDaPorta = 'nenhuma';
    return null;
  };

  P.temPorta = function () { return !!P.portaDoSistema(); };

  /* dentro do /exec, o caminho é o do próprio Apps Script */
  P.ambiente = function () {
    if (P.temPorta()) return 'PELO_SISTEMA';
    try {
      if (typeof google !== 'undefined' && google.script && google.script.run) return 'APPS_SCRIPT';
    } catch (e) {}
    return 'SOZINHO';
  };

  /* ------------------------------------------------------------
     CHAMAR
     ------------------------------------------------------------ */
  P.chamar = function (nomeDaAcao, payload) {
    var par = P.ACOES[nomeDaAcao];
    if (!par) {
      /* a regra dele: "não invente endpoints, nomes de ações,
         campos ou respostas que não estejam implementados". */
      return Promise.resolve({ ok: false, codigo: 'ACAO_DESCONHECIDA',
        mensagem: 'A ação "' + nomeDaAcao + '" não está na lista verificada deste módulo.' });
    }

    P.chamadas++;
    var comecou = Date.now();
    var porta = P.portaDoSistema();

    function fim(r) {
      P.ultima = { acao: nomeDaAcao, ms: Date.now() - comecou, ok: !!(r && r.ok) };
      if (!r || !r.ok) P.falhas++;
      return r;
    }

    if (porta) {
      return Promise.resolve()
        .then(function () { return porta(par[0], par[1], payload || {}); })
        .then(function (r) { return fim(P.entender(r)); })
        .catch(function (e) {
          return fim({ ok: false, codigo: 'ERRO_SISTEMA',
            mensagem: 'A porta do sistema recusou: ' + ((e && e.message) || e) });
        });
    }

    if (P.ambiente() === 'APPS_SCRIPT') {
      return new Promise(function (resolve) {
        try {
          google.script.run
            .withSuccessHandler(function (r) { resolve(fim(P.entender(r))); })
            .withFailureHandler(function (e) {
              resolve(fim({ ok: false, codigo: 'ERRO_GAS',
                mensagem: (e && e.message) || String(e) }));
            })
            .APIX_atender_({ ponte: 'ALMOXA', modulo: par[0], acao: par[1],
                             payload: payload || {}, origem: 'NOTAS_FISCAIS' });
        } catch (e) {
          resolve(fim({ ok: false, codigo: 'ERRO_GAS', mensagem: String(e) }));
        }
      });
    }

    /* Sozinho não há sessão, e sessão não se copia nem se inventa. */
    return Promise.resolve(fim({ ok: false, codigo: 'SEM_PORTA',
      mensagem: 'Este módulo não está falando pela porta do ALMOX PRO. ' +
        'Abra pelo menu Notas Fiscais, de dentro do sistema e já identificado.' }));
  };

  /* ------------------------------------------------------------
     ENTENDER A RESPOSTA · sem adivinhar formato
     ------------------------------------------------------------ */
  P.entender = function (r) {
    if (!r) return { ok: false, codigo: 'VAZIO', mensagem: 'O Core não respondeu nada.' };
    if (typeof r === 'string') {
      try { r = JSON.parse(r); }
      catch (e) { return { ok: false, codigo: 'RESPOSTA_ESTRANHA',
        mensagem: 'O Core respondeu algo que não é JSON.' }; }
    }
    if (r.ok === false) {
      return { ok: false, codigo: r.codigo || 'RECUSADO',
               mensagem: r.mensagem || 'O Core recusou, sem dizer o motivo.' };
    }
    var dados = r.dados;
    if (dados === undefined) dados = r.lista !== undefined ? r.lista : r;
    return { ok: true, dados: dados, bruto: r };
  };

  P.estado = function () {
    return { ambiente: P.ambiente(), porSistema: P.temPorta(),
             origemDaPorta: P.origemDaPorta,
             chamadas: P.chamadas, falhas: P.falhas, ultima: P.ultima };
  };

  raiz.NFPORTA = P;
  if (typeof module !== 'undefined' && module.exports) module.exports = P;

})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ========== nfapp.js ========== */
/* ============================================================
   NOTAS_FISCAIS · nfapp.js · 08/11/2026 · terceira versão
   ------------------------------------------------------------
   Agora com a referência visual e o documento de reformulação.

   O QUE SAIU, e por quê (seção 2 e 3C):
     · a barra lateral do módulo — o menu é do ALMOX PRO
     · os sete quadros de número — "não exagerar nos indicadores"

(function (raiz) {
  'use strict';

  /* ------------------------------------------------------------ */
  A.carregar = function () {

      if (!r.ok) { A.erro = r; A.notas = []; }
      else {

        A.notas = Object.prototype.toString.call(d) === '[object Array]' ? d : [];
      }
      A.pintar(); A.pintarRodape();
      A.carregarDivergencias();
      return r;
    });
  };

  /* nf.divergencias é ação verificada; o número da aba sai dela */
  A.carregarDivergencias = function () {
    return P.chamar('divergencias', {}).then(function (r) {
      A.divergencias = (r.ok && Object.prototype.toString.call(r.dados) === '[object Array]')
        ? r.dados : [];
      A.erroDiverg = r.ok ? null : r.mensagem;
      A.pintar();

    });
  };

  A.visiveis = function () {

      return D.ordenar(D.filtrar(lista, {

    }
    return D.ordenar(D.filtrar(A.notas, A.filtro));
  };
  A.daPagina = function () {
    var v = A.visiveis();
    var i = (A.pagina - 1) * A.porPagina;
    return v.slice(i, i + A.porPagina);
  };

  /* ------------------------------------------------------------
     A ÁREA DE IMPORTAÇÃO · seção 3B

  A.htmlImporta = function () {

      '<div class="chave-caixa"><span class="ico">▌▌▌</span>' +

    '</div>' +
    '<div id="nfChaveAviso"></div>';
  };

  /* ------------------------------------------------------------
     ABAS COM CONTAGEM DENTRO
     ------------------------------------------------------------ */
  A.htmlAbas = function () {
    var c = D.contarPorSituacao(A.notas);
    var fig = { todas: '▦', conferencia: '◷', rascunho: '📄',
                confirmada: '✓', cancelada: '⊗' };
    var ordem = ['todas', 'conferencia', 'rascunho', 'confirmada', 'cancelada'];

  /* ------------------------------------------------------------
     A TABELA · a área de trabalho
     ------------------------------------------------------------ */
  A.htmlTabela = function () {
    var todas = A.visiveis();
    var lista = A.daPagina();
    var corpo;

    if (!lista.length) {
      corpo = '<tr><td colspan="9" class="vazio">' +
        (A.notas.length
          ? 'Nenhuma nota com esse filtro. As outras ' + A.notas.length + ' continuam aí.'
          : 'O Core não devolveu nenhuma nota.') + '</td></tr>';
    } else {
      var base = (A.pagina - 1) * A.porPagina;
      corpo = lista.map(function (n, k) {
        var i = base + k;
        var sit = D.situacaoDe(n);
        var semData = !D.dataISO(n.emissao);
        var v = D.vinculoDe(n);
        return '<tr data-linha="' + i + '"' +
            (A.selecionada === n ? ' class="escolhida"' : '') + '>' +
          '<td style="width:30px"><input type="checkbox" disabled ' +

          '<td>' + esc(n.serie || '—') + '</td>' +
          '<td>' + esc(n.fornecedor || '—') +

          '</td>' +
          '<td>' + (semData ? '<span class="faltando">sem data</span>'

          '<td><span class="selo selo-' + sit + '">' + A.figSituacao(sit) + ' ' +

          '<td>' + (v ? '<span class="elo">🔗 ' + esc(v.codigo) + '</span>'
                      : '<span class="mudo">—</span>') + '</td>' +
          '<td style="white-space:nowrap;width:92px">' +
            '<button class="btn-ic" data-ver="' + i + '" title="Ver a nota">👁</button>' +
            '<button class="btn-ic" data-lapis="' + i + '" ' +
              'title="Abre a janela de edição do ALMOX PRO — a mesma da tela antiga, ' +
              'que exige crachá e confere se a nota não duplicou">✎</button>' +
            '<button class="btn-ic" disabled title="Mais ações entram com a gravação">⋯</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    var s = D.somar(todas);
    return '<div class="cartao">' +
      '<table class="tabela"><thead><tr>' +
        '<th style="width:30px"><input type="checkbox" disabled ' +
          'title="Seleção em lote depende de gravação"></th>' +
        '<th>NF nº</th><th>Série</th><th>Fornecedor</th><th>Emissão</th>' +
        '<th class="num">Valor (R$)</th><th>Situação</th>' +
        '<th>Vínculo</th><th>Ações</th>' +
      '</tr></thead><tbody>' + corpo + '</tbody></table>' +
      A.htmlRodapeTabela(todas, s) +
    '</div>';
  };

  A.htmlRodapeTabela = function (todas, s) {
    var total = todas.length;
    var paginas = Math.max(1, Math.ceil(total / A.porPagina));
    if (A.pagina > paginas) A.pagina = paginas;
    var de = total ? (A.pagina - 1) * A.porPagina + 1 : 0;
    var ate = Math.min(A.pagina * A.porPagina, total);

    var bts = '';
    if (paginas > 1) {
      bts += '<button data-pg="1"' + (A.pagina === 1 ? ' disabled' : '') + '>«</button>';
      bts += '<button data-pg="' + (A.pagina - 1) + '"' +
        (A.pagina === 1 ? ' disabled' : '') + '>‹</button>';
      var ini = Math.max(1, A.pagina - 2), fim = Math.min(paginas, ini + 4);
      for (var i = ini; i <= fim; i++) {
        bts += '<button data-pg="' + i + '"' + (i === A.pagina ? ' class="on"' : '') +
          '>' + i + '</button>';
      }
      if (fim < paginas) bts += '<button disabled>…</button>' +
        '<button data-pg="' + paginas + '">' + paginas + '</button>';
      bts += '<button data-pg="' + (A.pagina + 1) + '"' +
        (A.pagina === paginas ? ' disabled' : '') + '>›</button>';
      bts += '<button data-pg="' + paginas + '"' +
        (A.pagina === paginas ? ' disabled' : '') + '>»</button>';
    }

    return '<div class="rodape-tab">' +
      '<span class="mudo">Exibindo ' + de + ' a ' + ate + ' de ' + total +
        ' ' + plural(total, 'registro', 'registros') + '</span>' +
      '<span class="sep"></span>' +
      '<span class="mudo">Somam</span>&nbsp;<b>' + D.moeda(s.total) + '</b>' +
      (s.semValor ? '&nbsp;<span class="faltando peq">(' + s.semValor +
        ' sem valor, fora da soma)</span>' : '') +
      (bts ? '<div class="paginas">' + bts + '</div>' : '') +
    '</div>';
  };

  A.figSituacao = function (s) {
    return { rascunho: '📄', conferencia: '◷', confirmada: '✓',
             cancelada: '⊗', outra: '!' }[s] || '';
  };

  A.nomeSituacao = function (s) {
    return { rascunho: 'Rascunho', conferencia: 'Em conferência',
             confirmada: 'Confirmada', cancelada: 'Cancelada',
             outra: 'Não reconhecida' }[s] || s;
  };

  /* ------------------------------------------------------------ */
  A.pintar = function () {
    var alvo = $('nfCorpo');
    if (!alvo) return;

    if (A.carregando) {
      alvo.innerHTML = A.htmlImporta() +
        '<div class="cartao"><div class="painel-corpo">' +
        '<div class="aviso leve">Procurando as notas no Core…</div></div></div>';
      A.ligar(); return;
    }

    if (A.erro) {
      var est = P.estado();
      alvo.innerHTML = A.htmlImporta() +
        '<div class="cartao"><div class="painel-corpo">' +

          esc(A.erro.mensagem) + '</div>' +
        '<div class="peq mudo" style="line-height:1.5">' +
          (est.porSistema
            ? 'O módulo falou pela porta do ALMOX PRO (' + esc(est.origemDaPorta) +
              '), com a sessão que o sistema está usando. Quem recusou foi o Core.'
            : '<b>Este módulo não está falando pela porta do sistema.</b> ' +
              'Sozinho ele não tem sessão, e sessão não se copia nem se inventa. ' +
              'Abra pelo menu <b>Notas Fiscais → Central (novo)</b>, de dentro do ALMOX PRO.') +
        '</div></div></div>';
      A.ligar(); return;
    }

    alvo.innerHTML = A.htmlImporta() + A.htmlAbas() + A.htmlFiltros() + A.htmlTabela();
    A.ligar();
  };

  /* ------------------------------------------------------------
     O RODAPÉ DE INTEGRAÇÃO · seção 4I

     "Não basta mostrar indicadores verdes na tela. Cada indicador
      deverá refletir o resultado de uma verificação real."

     Então cada bolinha aqui é o resultado de uma CHAMADA. Antes
     da resposta ela é cinza e diz "verificando". Se a chamada
     falhar, fica vermelha com o motivo. Verde só depois que o
     motor respondeu.

     Auditoria fica cinza e escrito: eu não encontrei a ação dela
     na varredura de hoje, e pintar de verde o que eu não medi
     seria exatamente o que a seção 8 proíbe.
     ------------------------------------------------------------ */
  A.verificarMotores = function () {
    var quais = ['produtos', 'compras', 'reservas', 'estoque'];
    quais.forEach(function (m) { A.motores[m] = 'verificando'; });
    A.pintarRodape();

    quais.forEach(function (m) {
      P.chamar(m, {}).then(function (r) {
        A.motores[m] = r.ok ? 'ok' : ('falhou: ' + (r.mensagem || 'sem motivo'));
        A.pintarRodape();
      });
    });
  };

  A.pintarRodape = function () {
    var r = $('nfRodape');
    if (!r) return;
    var est = P.estado();

    function item(estado, nome) {
      var cor = estado === 'ok' ? 'v'
              : estado === 'verificando' ? 'c'
              : estado === null ? 'c'
              : /^falhou/.test(String(estado)) ? 'x' : 'c';
      var marca = cor === 'v' ? '✓' : cor === 'x' ? '✕' : '';
      var titulo = estado === 'ok' ? nome + ': o motor respondeu'
                 : estado === 'verificando' ? nome + ': perguntando agora'
                 : estado === null ? nome + ': ainda não verificado'
                 : nome + ' — ' + estado;
      return '<span class="item" title="' + esc(titulo) + '">' +
        '<span class="pt ' + cor + '">' + marca + '</span>' + nome +
        (cor === 'x' ? ' <span class="faltando peq">(falhou)</span>' : '') +
        (estado === 'verificando' ? ' <span class="mudo peq">…</span>' : '') +
        '</span>';
    }

    var agora = new Date();
    var hh = ('0' + agora.getHours()).slice(-2) + ':' + ('0' + agora.getMinutes()).slice(-2);

    r.innerHTML =
      '<b>📦 Integração ALMOX PRO</b><span class="sep"></span>' +
      item(est.porSistema ? 'ok' : 'falhou: sem a porta do sistema', 'Core') +
      item(A.motores.produtos, 'Produtos') +
      item(A.motores.compras, 'Compras') +
      item(A.motores.reservas, 'Reservas') +
      item(A.motores.estoque, 'Estoque') +
      '<span class="item" title="Não encontrei a ação de auditoria na varredura do Core. ' +
        'Pintar de verde o que não foi medido seria mentir.">' +
        '<span class="pt c"></span>Auditoria ' +
        '<span class="mudo peq">(sem ação verificada)</span></span>' +
      '<span class="sep"></span>' +
      '<span class="mudo">Última atualização: ' + hh + '</span>' +
      '<span class="sep"></span>' +
      '<b class="mono" style="font-size:11.5px;color:var(--azul)" id="nfCarimbo">' +
        CARIMBO + '</b>';
  };

  /* ------------------------------------------------------------
     LIGAR OS CONTROLES
     ------------------------------------------------------------ */
  A.ligar = function () {
    var p = $('nfProcura');
    if (p) p.addEventListener('input', function () {
      A.filtro.procura = p.value; A.pagina = 1; A.pintar();
      var novo = $('nfProcura');
      if (novo) { novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
    });
    ['nfDe', 'nfAte'].forEach(function (id) {
      var el = $(id);
      if (el) el.addEventListener('change', function () {
        A.filtro[id === 'nfDe' ? 'de' : 'ate'] = el.value; A.pagina = 1; A.pintar();
      });
    });
    var lim = $('nfLimpar');
    if (lim) lim.addEventListener('click', function () {
      A.filtro = { situacao: 'todas', procura: '', de: '', ate: '' };
      A.pagina = 1; A.pintar();
    });
    var imp = $('nfImportar');
    if (imp) imp.addEventListener('click', function () {
      var c = $('nfArquivo'); if (c) c.click();
    });
    var ocr = $('nfOcr');
    if (ocr) ocr.addEventListener('click', function () {
      var r = raiz.NFAUTO.abrirJanela('modalOCR');
      if (!r.ok) A.recadoDeJanela(r.motivo, 'ler a nota por OCR');
    });
    var nova = $('nfNova');
    if (nova) nova.addEventListener('click', function () {
      var r = raiz.NFAUTO.irPara('nf-importar');
      if (!r.ok) A.recadoDeJanela(r.motivo, 'lançar uma nota nova');
    });
    var pdf = $('nfAnexar');
    if (pdf) pdf.addEventListener('click', function () {
      var c = $('nfPdfArquivo'); if (c) c.click();
    });
    var cons = $('nfConsultar');
    if (cons) cons.addEventListener('click', A.consultarChave);
    var ch = $('nfChave');
    if (ch) {
      ch.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') A.consultarChave();
      });
      ch.addEventListener('input', function () {
        if (A.chaveConferida) { A.chaveConferida = null; A.pintarChave(); }
      });
      if (A.chaveConferida) A.pintarChave();
    }
    ['aba', 'pg', 'ver', 'lapis'].forEach(function (chaveAttr) {
      Array.prototype.forEach.call(
        document.querySelectorAll('[data-' + chaveAttr + ']'), function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-' + chaveAttr);
          if (chaveAttr === 'aba') { A.filtro.situacao = v; A.pagina = 1; A.pintar(); }
          else if (chaveAttr === 'pg') { A.pagina = Number(v); A.pintar(); }
          else if (chaveAttr === 'lapis') { A.editar(A.visiveis()[Number(v)]); }
          else { A.abrir(A.visiveis()[Number(v)]); }   /* o olho fica no painel daqui */
        });
      });
    });
  };

  /* ------------------------------------------------------------

  A.consultarChave = function () {
    var ch = $('nfChave');
    if (!ch) return;
    A.chaveConferida = D.conferirChave(ch.value);
    A.pintarChave();
    return A.chaveConferida;
  };

    if (!r.ok) {

      return;
    }
    var k = r.partes;
    cx.innerHTML = '<div class="aviso leve">' +

          (k.modelo === '55' ? '55 (NF-e)' : esc(k.modelo)) + '</b></div>' +
        '<div class="linha"><span>Emissão</span><b>' + esc(k.anoMes) + '</b></div>' +
      '</div>' +
      '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px">' +
        '<button class="btn peq primario" id="nfIrSite">🔎 Procurar no consultadanfe</button>' +
        '<button class="btn peq" id="nfCopiarChave">⎘ Copiar a chave</button>' +
        '<span class="peq" id="nfSiteRecado"></span>' +
      '</div>' +
      '<div style="margin-top:9px">O botão abre o site <b>numa aba nova</b> e deixa a ' +
      'chave copiada — é só colar lá. Baixando o PDF ou o XML, volte aqui e use ' +
      '<b>Ler por OCR</b> ou <b>Importar XML</b>.</div>' +
    '</div>';

    var irSite = $('nfIrSite');
    if (irSite) irSite.addEventListener('click', function () { A.irAoSite(r.chave); });
    var copiar = $('nfCopiarChave');
    if (copiar) copiar.addEventListener('click', function () { A.copiarChave(r.chave); });

    /* usar o que a chave diz para achar a nota na lista: isso é
       trabalho de verdade, feito com o que já está na mão */
    var proc = $('nfProcura');
    if (proc) { A.filtro.procura = k.numero; A.pagina = 1; }
  };

  /* ------------------------------------------------------------
     O SITE DE CONSULTA · 09/11

     Ele usa o consultadanfe.com. Eu NÃO sei como aquele site
     recebe a chave pelo endereço, e chutar um formato que não
     funciona seria pior do que não ter botão: ele clicaria,
     cairia numa página errada e perderia a viagem.

     Então o botão faz o que é certo sem adivinhar: abre o site
     numa aba nova e deixa a chave na área de transferência.
     Ele cola e pronto. O pior pedaço — digitar 44 dígitos sem
     errar — fica resolvido de qualquer jeito.
     ------------------------------------------------------------ */
  A.SITE = 'https://consultadanfe.com/';

  A.copiarChave = function (chave) {
    var txt = String(chave || '').replace(/\D/g, '');
    var recado = $('nfSiteRecado');
    function avisar(bom, oQue) {
      if (!recado) return;
      recado.innerHTML = bom
        ? '<b style="color:var(--bom)">✓ chave copiada</b>'
        : '<b class="faltando">' + esc(oQue) + '</b>';
    }
    if (!txt) { avisar(false, 'sem chave para copiar'); return false; }

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt)
          .then(function () { avisar(true); })
          .catch(function () { avisar(false, 'o navegador não deixou copiar — ' +
            'selecione a chave no campo acima'); });
        return true;
      }
    } catch (e) {}
    /* navegador antigo: seleciona o campo, que dá no mesmo */
    try {
      var c = $('nfChave');
      if (c) { c.focus(); c.select(); avisar(true); return true; }
    } catch (e) {}
    avisar(false, 'não consegui copiar');
    return false;
  };

  A.irAoSite = function (chave) {
    A.copiarChave(chave);
    try { window.open(A.SITE, '_blank', 'noopener'); }
    catch (e) {
      var recado = $('nfSiteRecado');
      if (recado) recado.innerHTML = '<b class="faltando">o navegador bloqueou a ' +
        'aba nova — libere o bloqueio de pop-up</b>';
    }
  };

  /* ------------------------------------------------------------
     ABRIR / FECHAR O PAINEL
     ------------------------------------------------------------ */
  A.abrir = function (nota, peloLapis) {
    if (!nota) return;
    A.selecionada = nota; A.itens = null; A.importada = null; A.recado = null;
    A.abaPainel = peloLapis ? 'itens' : 'dados';
    A.pintarPainel(); A.pintar();

    var jaTem = nota.itens || nota.listaItens;
    if (Object.prototype.toString.call(jaTem) === '[object Array]' && jaTem.length) {
      A.itens = jaTem; return A.pintarPainel();
    }
    P.chamar('itens', { numero: nota.numero, chave: nota.chave }).then(function (r) {
      A.itens = (r.ok && Object.prototype.toString.call(r.dados) === '[object Array]')
        ? r.dados : [];
      A.recado = r.ok ? null : r.mensagem;
      A.pintarPainel();
    });
  };

  /* ------------------------------------------------------------
     EDITAR · chama a janela do sistema, não reescreve nada

     Eu quase construí uma edição própria aqui. Teria sido o erro
     mais caro do projeto: a janela do ALMOX PRO exige crachá,
     grava pelo caminho de alteração (e não pelo que ACRESCENTA
     linha, que dobrou a nota 53072) e confere depois se a nota
     continua com os itens certos. Nada disso eu teria de graça
     numa versão minha.
     ------------------------------------------------------------ */
  A.editar = function (nota) {
    if (!nota) return;

    /* A NOTA VAI INTEIRA, COM OS ITENS. Mandar a casca abriu a
       janela com "a nota ficou sem nenhum item" e um clique em
       salvar teria zerado a 10410. Agora, se não der para montar
       a nota com os itens, a janela não abre. */
    var m = raiz.NFAUTO.notaInteira(nota, A.itens, A.notas);
    if (!m.ok) { A.recadoDeJanela(m.motivo, 'editar esta nota com segurança'); return m; }

    var quantosAqui = (A.itens || []).length;
    var quantosLa = ((m.nota && m.nota.listaItens) || []).length;
    if (quantosAqui > 0 && quantosLa === 0) {
      A.recadoDeJanela('Esta tela mostra ' + quantosAqui + ' item(ns), mas a nota ' +
        'montada para a edição veio sem nenhum. Não vou abrir: salvar assim ' +
        'apagaria os itens que existem.', 'editar esta nota com segurança');
      return { ok: false, motivo: 'itens sumiriam' };
    }

    var r = raiz.NFAUTO.abrirJanela('modalEditarNota', m.nota, function () {
      /* terminou a edição lá: relê aqui, para a lista não mentir */
      A.carregar();
    });
    if (!r.ok) A.recadoDeJanela(r.motivo, 'editar esta nota');
    return r;
  };

  A.verDetalhe = function (nota) {
    if (!nota) return;
    var id = raiz.NFAUTO.valor('NF_IDENTIDADE', null, nota);
    var r = raiz.NFAUTO.abrirJanela('modalDetalheNF', id || nota);
    if (!r.ok) { A.abrir(nota); return r; }   /* sem sistema: o painel daqui serve */
    return r;
  };

  /** quando a janela do sistema não está ao alcance, dizer por quê */
  A.recadoDeJanela = function (motivo, oQue) {
    var cx = $('nfPainel');
    if (!cx) return;
    cx.classList.add('on');
    document.body.classList.add('com-painel');
    cx.innerHTML =
      '<div class="painel-topo"><b>Não consegui abrir</b>' +
        '<button class="x" id="nfFechar">✕</button></div>' +
      '<div class="painel-corpo"><div class="aviso">' +
        '<b>Para ' + esc(oQue) + ', este módulo usa a janela do ALMOX PRO.</b><br>' +
        esc(motivo) +
      '</div>' +
      '<div class="peq mudo" style="line-height:1.5">' +
        'Isso é de propósito. A janela do sistema exige crachá, grava pelo caminho ' +

        'verdade, na nota 53072. Uma edição escrita só para este módulo não teria ' +
        'nada disso.</div></div>';

    if (f) f.addEventListener('click', A.fechar);
  };

  A.fechar = function () {

    if (A.importada) return A.pintarImportada();

    var qtdItens = A.itens === null ? '' : ' (' + A.itens.length + ')';

    Array.prototype.forEach.call(

    var vin = D.vinculoDe(n);

                   Isso é leitura. Não grava nada, não precisa do
                   Core, e é o que resolve o trabalho dele hoje.

       ANEXAR    · guardar o arquivo preso à nota, para quem abrir
                   amanhã encontrar. Isso é gravação no Drive, e
                   depende de uma ação que o Core não tem.

     O que entra agora é o CONFERIR, com esse nome. Chamar de
     "anexar" uma coisa que não guarda nada seria enganar o
     usuário no dia em que ele mais precisa do arquivo.

     O navegador já sabe desenhar PDF — não entra biblioteca
     nenhuma, e o arquivo não sai do computador dele.
     ------------------------------------------------------------ */
  A.abrirPdf = function (arquivo) {
    try { if (A.pdfUrl) URL.revokeObjectURL(A.pdfUrl); } catch (e) {}
    A.pdfUrl = URL.createObjectURL(arquivo);
    A.pdfNome = arquivo.name;
    A.pdfTamanho = arquivo.size;
    A.pintarPdf();
    return A.pdfUrl;
  };

  A.fecharPdf = function () {
    try { if (A.pdfUrl) URL.revokeObjectURL(A.pdfUrl); } catch (e) {}
    A.pdfUrl = null; A.pdfNome = null;
    var cx = $('nfPdf');
    if (cx) { cx.classList.remove('on'); cx.innerHTML = ''; }
    document.body.classList.remove('com-pdf');
  };

  A.pintarPdf = function () {
    var cx = $('nfPdf');
    if (!cx || !A.pdfUrl) return;
    cx.classList.add('on');
    document.body.classList.add('com-pdf');
    var kb = Math.round((A.pdfTamanho || 0) / 1024);
    cx.innerHTML =
      '<div class="painel-topo">' +
        '<b>📄 ' + esc(A.pdfNome || 'documento') + '</b>' +
        '<button class="x" id="nfPdfFechar" title="Fechar">✕</button>' +
      '</div>' +
      '<div class="pdf-aviso">' +
        '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
          '<button class="btn peq primario" id="nfPdfLer">⎙ Ler esta nota</button>' +
          '<span>Puxa os dados do PDF e preenche os campos, pelo leitor do ' +
            'ALMOX PRO.</span>' +
        '</div>' +
        '<div style="margin-top:7px">Por enquanto o arquivo está só aberto do seu ' +
          'computador e <b>não foi guardado</b> no sistema — guardar depende de uma ' +
          'ação que o Core ainda não tem. ' + kb + ' KB.</div>' +
      '</div>' +
      '<object data="' + esc(A.pdfUrl) + '" type="application/pdf" class="pdf-quadro">' +
        '<div class="painel-corpo"><div class="aviso">' +
          'Este navegador não desenha PDF aqui dentro. ' +
          '<a href="' + esc(A.pdfUrl) + '" target="_blank" rel="noopener">' +
          'Abrir numa aba</a>.</div></div>' +
      '</object>';
    var f = $('nfPdfFechar');
    if (f) f.addEventListener('click', A.fecharPdf);
    var ler = $('nfPdfLer');
    if (ler) ler.addEventListener('click', function () {
      var r = raiz.NFAUTO.abrirJanela('modalOCR');
      if (!r.ok) A.recadoDeJanela(r.motivo, 'ler este PDF');
    });
  };

  /* ------------------------------------------------------------
     IMPORTAR XML
     ------------------------------------------------------------ */
  A.importarArquivo = function (arquivo) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onload = function () {
        var r = raiz.XMLEXATO.decodificar(String(fr.result));
        if (!r.ok) {
          A.selecionada = null;
          A.importada = { erro: 'Não consegui abrir o arquivo (' + r.como + ').' };
          A.pintarPainel(); return resolve(A.importada);
        }
        var nota = raiz.XMLEXATO.lerTexto(r.texto);
        nota.codificacao = r.como;
        nota.arquivo = arquivo.name;
        if (!nota.ok) nota.erro = 'Este arquivo não parece ser o XML de uma NF-e: ' +
          'não achei nem o número da nota nem os itens. ' +
          'Confira se não é o recibo de entrega.';
        A.selecionada = null;
        A.importada = nota;
        A.pintarPainel();
        resolve(nota);
      };
      fr.onerror = function () {
        A.selecionada = null;
        A.importada = { erro: 'O navegador não conseguiu ler o arquivo.' };
        A.pintarPainel(); resolve(A.importada);
      };
      fr.readAsDataURL(arquivo);
    });
  };

  A.pintarImportada = function () {
    var cx = $('nfPainel'), n = A.importada;
    cx.classList.add('on');
    document.body.classList.add('com-painel');

    function topo(t) {
      return '<div class="painel-topo"><b>' + t + '</b>' +
        '<button class="x" id="nfFechar" title="Fechar">✕</button></div>';
    }
    function ligarFechar() {
      var f = $('nfFechar'); if (f) f.addEventListener('click', A.fechar);
    }

    if (n.erro) {
      cx.innerHTML = topo('⤒ Importar XML') +
        '<div class="painel-corpo"><div class="aviso erro">' + esc(n.erro) + '</div></div>';
      return ligarFechar();
    }

    var s = n.soma;
    cx.innerHTML = topo('⤒ XML lido · nota ' + esc(n.numero || '—')) +
      '<div class="painel-corpo">' +
      '<div class="peq mudo" style="margin-bottom:10px">' + esc(n.arquivo || '') +
        ' · arquivo em ' + esc(n.codificacao) +
        ' · lido por <b>' + esc(n.como || 'leitura direta') + '</b></div>' +

      '<div class="linhas">' +
        linha('Número', esc(n.numero || '—')) +
        linha('Série', esc(n.serie || '—')) +
        linha('Emissão', esc(n.emissao ? D.dataBR(n.emissao.slice(0, 10)) : '—')) +
        (n.fornecedor ? linha('Fornecedor', esc(n.fornecedor)) : '') +
        (n.cnpj ? linha('CNPJ', '<span class="mono">' + esc(D.cnpjBonito(n.cnpj)) +
          '</span>') : '') +
      '</div>' +

      (n.chave ? '<div class="bloco"><div class="bloco-tit">🔗 Chave</div>' +
        '<div class="mono peq" style="word-break:break-all">' +
        esc(D.chaveBonita(n.chave)) + '</div></div>' : '') +

      (n.recusados && n.recusados.length
        ? '<div class="aviso"><b>' + n.recusados.length +
          ' bloco(s) do XML não viraram item.</b><br>' +
          n.recusados.map(function (x) {
            return 'posição ' + x.posicao + ': ' + esc(x.motivo); }).join('<br>') +
          '<br>Estão aqui para o senhor saber que existiam. ' +
          'Nada foi descartado em silêncio.</div>' : '') +

      '<table class="tabela densa"><thead><tr><th>#</th><th>Código</th><th>Descrição</th>' +
        '<th class="num">Qtd.</th><th class="num">V. unit.</th>' +
        '<th class="num">Total</th></tr></thead><tbody>' +
      n.itens.map(function (i, k) {
        return '<tr><td class="mudo">' + (k + 1) + '</td>' +
          '<td class="mono peq">' + (i.codigo ? esc(i.codigo) : '—') + '</td>' +
          '<td>' + esc(i.nome || '—') +
            '<div class="mono mudo peq">' +
              (i.ncm ? 'NCM ' + esc(i.ncm) : '') +
              (i.cfop ? ' · CFOP ' + esc(i.cfop) : '') +
              (i.desconto ? ' · desc. ' + D.moeda(i.desconto) : '') +
              (i.totalVeioDaNota ? '' : ' · <b>total calculado, a nota não trouxe</b>') +
            '</div></td>' +
          '<td class="num">' + esc(i.qtd) + ' ' + esc(i.unidade) + '</td>' +
          '<td class="num">' + D.moeda(i.preco).replace('R$ ', '') + '</td>' +
          '<td class="num"><b>' + D.moeda(i.valorTotal).replace('R$ ', '') + '</b></td></tr>';
      }).join('') + '</tbody></table>' +

      '<div class="totais"><div class="lista">' +
        '<div class="linha"><span>Total de itens</span><b>' + n.itens.length + '</b></div>' +
        '<div class="linha"><span>Soma dos itens</span><b>' +
          D.moeda(s.somaItens) + '</b></div>' +
        (s.descontos ? '<div class="linha"><span>Desconto</span><b>− ' +
          D.moeda(s.descontos) + '</b></div>' : '') +
      '</div>' +
      '<div class="total-grande"><span>Valor total da nota</span><b>' +
        (s.total ? D.moeda(s.total) : '—') + '</b></div></div>' +

      (s.confere === true ? '<div class="aviso bom">' + esc(s.motivo) + '</div>'
        : s.confere === null ? '<div class="aviso leve">' + esc(s.motivo) + '</div>'
        : '<div class="aviso"><b>A soma não fecha.</b><br>' + esc(s.motivo) + '</div>') +
      '</div>' +

      '<div class="rodape-painel">' +
        '<button class="btn" id="nfCancelarPainel">Fechar</button>' +
        '<button class="btn primario" disabled title="Gravação é a etapa 2">' +
          '✓ Lançar esta nota</button>' +
      '</div>' +
      '<div class="painel-corpo peq mudo" style="padding-top:0;line-height:1.5">' +
        'Lançar grava no Core, e a auditoria de hoje não encontrou ação de escrita ' +
        'no módulo <span class="mono">nf</span>. Pela seção 8, a lacuna é apresentada, ' +
        'não simulada.</div>';

    ligarFechar();
    var c = $('nfCancelarPainel'); if (c) c.addEventListener('click', A.fechar);
  };

  /* ------------------------------------------------------------ */
  A.iniciar = function () {
    D = raiz.NFDADOS; P = raiz.NFPORTA;
    var campo = $('nfArquivo');
    if (campo) campo.addEventListener('change', function () {
      if (campo.files && campo.files[0]) A.importarArquivo(campo.files[0]);
      campo.value = '';
    });

    var campoPdf = $('nfPdfArquivo');
    if (campoPdf) campoPdf.addEventListener('change', function () {
      if (campoPdf.files && campoPdf.files[0]) A.abrirPdf(campoPdf.files[0]);
      campoPdf.value = '';
    });
    A.pintarRodape();
    A.carregar();
    A.verificarMotores();
  };

  raiz.NFAPP = A;
  if (typeof module !== 'undefined' && module.exports) module.exports = A;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
  (function comecar() {
    if (document.readyState === 'loading')
      return document.addEventListener('DOMContentLoaded', comecar);
    window.NFAPP.iniciar();
  })();
</script>
</body>
</html>
