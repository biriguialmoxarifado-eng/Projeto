<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALMOXA PRO · Estoque 3D</title>

<!--
  ============================================================
  ALMOXA PRO — ESTOQUE 3D
  Aplicação independente do sistema principal.
  ------------------------------------------------------------
  POR QUE SEPARADA

  O Babylon.js pesa alguns megabytes. Dentro do Apps Script, que
  já é lento, isso seria um retrocesso. Aqui ela roda sozinha e
  conversa com o sistema pela API quando precisar.

  A estrutura NASCE DOS DADOS. Ninguém desenha um almoxarifado
  aqui: você diz "rua 01, 4 níveis, 5 posições" e o motor monta.
  ============================================================
-->

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<style>
:root{
  --navy:#0B2A55;
  --navy-2:#123A6E;
  --azul:#0B5FFF;
  --laranja:#FF7A00;
  --verde:#1E9E5A;
  --amarelo:#FF9F1C;
  --vermelho:#C0392B;
  --cinza:#8E969F;
  --fundo:#F4F7FB;
  --card:#FFFFFF;
  --linha:#E3E9F0;
  --texto:#1A2634;
  --texto-2:#4A5866;
  --texto-3:#8A96A3;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--fundo);color:var(--texto);font-size:14px;line-height:1.5;
}

/* ---------- CABEÇALHO ---------- */
.topo{
  height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;
  padding:0 16px;gap:16px;flex-shrink:0;
}
.marca{display:flex;align-items:center;gap:10px}
.marca .ico{
  width:34px;height:34px;border-radius:9px;background:var(--laranja);
  display:grid;place-items:center;font-size:17px;
}
.marca b{font-size:16px;letter-spacing:-.3px;display:block;line-height:1.1}
.marca b i{color:var(--laranja);font-style:normal}
.marca small{font-size:10px;opacity:.7;display:block}

.modos{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;margin-left:auto}
.modos button{
  padding:7px 15px;border:0;background:transparent;color:rgba(255,255,255,.75);
  border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
}
.modos button.on{background:#fff;color:var(--navy)}

.topo-acoes{display:flex;gap:7px}
.bt-topo{
  width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.12);
  color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;
}
.bt-topo:hover{background:rgba(255,255,255,.22)}

/* ---------- CORPO ---------- */
.corpo{display:flex;height:calc(100% - 56px)}

/* ---------- ÁRVORE ---------- */
.lateral{
  width:270px;background:var(--card);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;flex-shrink:0;
}
.lateral-topo{padding:13px 15px;border-bottom:1px solid var(--linha)}
.lateral-topo h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--texto-3)}
.busca{position:relative;margin-top:9px}
.busca input{
  width:100%;padding:9px 11px 9px 32px;border:1px solid var(--linha);
  border-radius:9px;font-family:inherit;font-size:13px;
}
.busca span{position:absolute;left:11px;top:9px;color:var(--texto-3);font-size:13px}

.arvore{flex:1;overflow-y:auto;padding:9px}
.no{
  display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;
  cursor:pointer;font-size:13px;user-select:none;
}
.no:hover{background:var(--fundo)}
.no.sel{background:#EAF2FF;color:var(--azul);font-weight:600}
.no .seta{width:13px;font-size:10px;color:var(--texto-3);flex-shrink:0}
.no .cor{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.no .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no .qtd{font-size:11px;color:var(--texto-3)}
.filhos{margin-left:15px;border-left:1px solid var(--linha);padding-left:5px}
.filhos.fechado{display:none}

/* ---------- PALCO ---------- */
.palco{flex:1;position:relative;background:#0A1929;min-width:0}
#cena{width:100%;height:100%;display:block;outline:none;touch-action:none}

.carregando{
  position:absolute;inset:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;
}
.carregando .cubo{
  width:56px;height:56px;border-radius:14px;background:var(--azul);
  display:grid;place-items:center;font-size:26px;
  animation:pulsa 1.4s ease-in-out infinite;
}
@keyframes pulsa{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.7}}
.carregando .barra{width:220px;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.carregando .barra i{display:block;height:100%;background:var(--azul);width:0;transition:width .3s}

.ferramentas{
  position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:10;
}
.ferramentas button{
  width:38px;height:38px;border-radius:9px;border:0;background:rgba(255,255,255,.92);
  cursor:pointer;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.18);
  display:grid;place-items:center;
}
.ferramentas button:hover{background:#fff}

.legenda{
  position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);
  border-radius:10px;padding:9px 13px;display:flex;gap:14px;flex-wrap:wrap;
  font-size:11.5px;box-shadow:0 2px 10px rgba(0,0,0,.14);z-index:10;
}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.dica{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  background:rgba(11,42,85,.86);color:#fff;padding:7px 15px;border-radius:20px;
  font-size:11.5px;z-index:10;pointer-events:none;
}

/* ---------- PLANTA 2D ---------- */
.planta{
  position:absolute;inset:0;background:var(--fundo);display:none;overflow:auto;padding:26px;z-index:5;
}
.planta.on{display:block}
.planta-rua{
  background:var(--card);border:1px solid var(--linha);border-radius:12px;
  padding:15px;margin-bottom:15px;
}
.planta-rua h4{font-size:14px;color:var(--navy);margin-bottom:3px}
.planta-rua .sub{font-size:11.5px;color:var(--texto-3);margin-bottom:11px}
.planta-nivel{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.planta-nivel .rot{
  width:64px;font-size:11px;color:var(--texto-3);text-align:right;flex-shrink:0;
}
.planta-pos{display:flex;gap:5px;flex-wrap:wrap}
.pos-2d{
  width:42px;height:34px;border-radius:6px;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent;
}
.pos-2d:hover{transform:translateY(-2px)}
.pos-2d.sel{border-color:var(--laranja);box-shadow:0 0 0 3px rgba(255,122,0,.25)}

/* ---------- PAINEL ---------- */
.painel{
  width:300px;background:var(--card);border-left:1px solid var(--linha);
  display:flex;flex-direction:column;flex-shrink:0;
}
.painel-topo{padding:15px;border-bottom:1px solid var(--linha)}
.painel-topo h3{font-size:15px;color:var(--navy)}
.painel-topo p{font-size:11.5px;color:var(--texto-3)}
.painel-corpo{flex:1;overflow-y:auto;padding:15px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.kpi{background:var(--fundo);border-radius:10px;padding:11px}
.kpi b{font-size:20px;color:var(--navy);display:block;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--texto-3)}

.linha-info{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--linha);font-size:13px;gap:10px;
}
.linha-info:last-child{border:0}
.linha-info span{color:var(--texto-3)}
.linha-info b{text-align:right}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.selo{
  display:inline-block;padding:3px 9px;border-radius:11px;
  font-size:11px;font-weight:700;color:#fff;
}

.vazio{text-align:center;padding:36px 18px;color:var(--texto-3)}
.vazio .ico{font-size:34px;margin-bottom:11px;opacity:.35}
.vazio h4{font-size:14px;color:var(--texto-2);margin-bottom:5px}
.vazio p{font-size:12.5px}

.bt{
  width:100%;padding:11px;border-radius:9px;border:0;font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;margin-top:9px;
}
.bt-azul{background:var(--azul);color:#fff}
.bt-linha{background:var(--card);color:var(--texto-2);border:1px solid var(--linha)}
.bt-laranja{background:var(--laranja);color:#fff}

/* ---------- MODAL ---------- */
.fundo-modal{
  position:fixed;inset:0;background:rgba(11,42,85,.5);z-index:100;
  display:none;align-items:center;justify-content:center;padding:18px;
}
.fundo-modal.on{display:flex}
.modal{
  background:var(--card);border-radius:15px;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;
}
.modal-topo{padding:18px 20px;border-bottom:1px solid var(--linha)}
.modal-topo h3{font-size:17px;color:var(--navy)}
.modal-topo p{font-size:12.5px;color:var(--texto-3)}
.modal-corpo{padding:20px}
.modal-rodape{
  padding:15px 20px;border-top:1px solid var(--linha);
  display:flex;gap:9px;justify-content:flex-end;
}
.modal-rodape .bt{width:auto;margin:0;padding:10px 18px}

.campo{margin-bottom:13px}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--texto-2);margin-bottom:5px}
.campo input,.campo select{
  width:100%;padding:10px 11px;border:1px solid var(--linha);
  border-radius:9px;font-family:inherit;font-size:14px;
}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.aviso{
  border-radius:9px;padding:11px 13px;font-size:12.5px;margin-bottom:13px;
}
.aviso.azul{background:#EAF2FF;color:#0B3D91}
.aviso.amarelo{background:#FEF6E7;color:#8A5A00}

/* ---------- CELULAR ---------- */
@media(max-width:900px){
  .lateral{display:none}
  .painel{
    position:fixed;left:0;right:0;bottom:0;width:auto;max-height:52vh;
    border-left:0;border-top:1px solid var(--linha);
    border-radius:16px 16px 0 0;transform:translateY(100%);
    transition:transform .25s;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.14);
  }
  .painel.aberto{transform:translateY(0)}
  .modos button{padding:7px 11px;font-size:12px}
  .marca small{display:none}
  .legenda{font-size:10.5px;gap:9px;padding:7px 10px}
}
</style>
</head>
<body>

<div class="topo">
  <div class="marca">
    <span class="ico">📦</span>
    <span>
      <b>ALMOXA <i>PRO</i></b>
      <small>Estoque 3D · Mapa operacional</small>
    </span>
  </div>

  <div class="modos">
    <button id="btn3d" class="on">3D</button>
    <button id="btn2d">Planta 2D</button>
  </div>

  <div class="topo-acoes">
    <button class="bt-topo" id="btNovaRua" title="Nova rua">➕</button>
    <button class="bt-topo" id="btTela" title="Tela cheia">⛶</button>
  </div>
</div>

<div class="corpo">

  <aside class="lateral">
    <div class="lateral-topo">
      <h3>Estrutura</h3>
      <div class="busca">
        <span>🔍</span>
        <input id="busca" placeholder="Buscar posição (ex.: R01-N02-P03)">
      </div>
    </div>
    <div class="arvore" id="arvore"></div>
  </aside>

  <main class="palco">
    <canvas id="cena"></canvas>

    <div class="planta" id="planta"></div>

    <div class="carregando" id="carregando">
      <div class="cubo">📦</div>
      <div>
        <div style="font-size:15px;font-weight:600;text-align:center">Montando o almoxarifado</div>
        <div style="font-size:12px;opacity:.7;text-align:center;margin-top:4px" id="passo">Iniciando…</div>
      </div>
      <div class="barra"><i id="progresso"></i></div>
    </div>

    <div class="ferramentas">
      <button id="btZoomMais" title="Aproximar">＋</button>
      <button id="btZoomMenos" title="Afastar">－</button>
      <button id="btTopo" title="Vista de cima">⬇</button>
      <button id="btReset" title="Voltar ao início">⟲</button>
    </div>

    <div class="legenda" id="legenda"></div>
    <div class="dica" id="dica">arraste para girar · role para aproximar · clique numa posição</div>
  </main>

  <aside class="painel" id="painel">
    <div class="painel-topo">
      <h3 id="painelTitulo">Almoxarifado</h3>
      <p id="painelSub">Clique numa posição para ver os detalhes</p>
    </div>
    <div class="painel-corpo" id="painelCorpo"></div>
  </aside>

</div>

<div class="fundo-modal" id="fundoModal">
  <div class="modal" id="modal"></div>
</div>


<script>
/* ============================================================
   AP3D — DADOS
   ------------------------------------------------------------
   Camada única de acesso aos dados. Hoje guarda em memória e no
   navegador; amanhã troca para o Core sem mexer no resto.

   Nenhum componente visual fala com o Core diretamente.
   ============================================================ */

var AP3D_Dados = (function () {

  /* estrutura em memória durante a sessão */
  var projeto = {
    nome: 'Almoxarifado',
    almoxarifado: 'A01',
    ruas: [],
    versao: 1,
    alteradoEm: null
  };

  var CHAVE = 'ap3d_projeto';

  /* ---------- CÓDIGOS ---------- */

  function dois(n) {
    var s = String(n).replace(/\D/g, '');
    return s.length >= 2 ? s : ('0' + s).slice(-2);
  }

  /** R01-N02-P03 */
  function codigoPosicao(rua, nivel, posicao) {
    return 'R' + dois(rua) + '-N' + dois(nivel) + '-P' + dois(posicao);
  }

  function codigoRua(rua) { return 'R' + dois(rua); }

  /* ---------- CRIAR ---------- */

  /**
   * Cria uma rua com seus níveis e posições.
   *
   * Ninguém digita posição por posição: informa 4 níveis e 5
   * posições, e as 20 nascem com código próprio.
   */
  function criarRua(dados) {
    var numero = Number(dados.numero);
    var niveis = Number(dados.niveis) || 4;
    var posicoes = Number(dados.posicoes) || 5;

    if (!numero) return { ok: false, motivo: 'Informe o número da rua.' };
    if (niveis < 1 || posicoes < 1) {
      return { ok: false, motivo: 'A rua precisa de pelo menos um nível e uma posição.' };
    }
    if (niveis > 12 || posicoes > 30) {
      return { ok: false, motivo: 'Limite: 12 níveis e 30 posições por nível.' };
    }
    if (projeto.ruas.some(function (r) { return r.numero === numero; })) {
      return { ok: false, motivo: 'A rua ' + dois(numero) + ' já existe.' };
    }

    var rua = {
      codigo: codigoRua(numero),
      numero: numero,
      nome: dados.nome || ('Rua ' + dois(numero)),
      categoria: dados.categoria || '',
      niveis: []
    };

    for (var n = 1; n <= niveis; n++) {
      var nivel = { numero: n, codigo: 'N' + dois(n), posicoes: [] };
      for (var p = 1; p <= posicoes; p++) {
        nivel.posicoes.push({
          codigo: codigoPosicao(numero, n, p),
          numero: p,
          rua: numero,
          nivel: n,
          status: 'DISPONIVEL',
          itens: 0,
          capacidade: dados.capacidade || null
        });
      }
      rua.niveis.push(nivel);
    }

    projeto.ruas.push(rua);
    projeto.ruas.sort(function (a, b) { return a.numero - b.numero; });
    marcarAlteracao();

    return { ok: true, rua: rua, posicoesCriadas: niveis * posicoes };
  }

  /**
   * Muda o tamanho de uma rua.
   *
   * Acrescenta o que falta e remove o que sobra — mas nunca
   * remove posição com material dentro.
   */
  function ajustarRua(numero, niveis, posicoes) {
    var rua = projeto.ruas.filter(function (r) { return r.numero === Number(numero); })[0];
    if (!rua) return { ok: false, motivo: 'Rua não encontrada.' };

    var comMaterial = [];
    rua.niveis.forEach(function (nv) {
      nv.posicoes.forEach(function (p) {
        if ((nv.numero > niveis || p.numero > posicoes) && p.itens > 0) {
          comMaterial.push(p.codigo);
        }
      });
    });

    if (comMaterial.length) {
      return {
        ok: false,
        motivo: comMaterial.length + ' posição(ões) que seriam removidas têm material: ' +
          comMaterial.slice(0, 3).join(', ') + (comMaterial.length > 3 ? '…' : '')
      };
    }

    var antesNiveis = rua.niveis.length;
    var antesPosicoes = rua.niveis[0] ? rua.niveis[0].posicoes.length : 0;

    /* remove o que sobra */
    rua.niveis = rua.niveis.filter(function (nv) { return nv.numero <= niveis; });
    rua.niveis.forEach(function (nv) {
      nv.posicoes = nv.posicoes.filter(function (p) { return p.numero <= posicoes; });
    });

    /* acrescenta o que falta, preservando o que já existe */
    for (var n = 1; n <= niveis; n++) {
      var nivel = rua.niveis.filter(function (nv) { return nv.numero === n; })[0];
      if (!nivel) {
        nivel = { numero: n, codigo: 'N' + dois(n), posicoes: [] };
        rua.niveis.push(nivel);
      }
      for (var p = 1; p <= posicoes; p++) {
        if (nivel.posicoes.some(function (x) { return x.numero === p; })) continue;
        nivel.posicoes.push({
          codigo: codigoPosicao(rua.numero, n, p),
          numero: p, rua: rua.numero, nivel: n,
          status: 'DISPONIVEL', itens: 0, capacidade: null
        });
      }
      nivel.posicoes.sort(function (a, b) { return a.numero - b.numero; });
    }

    rua.niveis.sort(function (a, b) { return a.numero - b.numero; });
    marcarAlteracao();

    return {
      ok: true,
      antes: { niveis: antesNiveis, posicoes: antesPosicoes },
      depois: { niveis: niveis, posicoes: posicoes }
    };
  }

  function removerRua(numero) {
    var rua = projeto.ruas.filter(function (r) { return r.numero === Number(numero); })[0];
    if (!rua) return { ok: false, motivo: 'Rua não encontrada.' };

    var ocupadas = 0;
    rua.niveis.forEach(function (nv) {
      nv.posicoes.forEach(function (p) { if (p.itens > 0) ocupadas++; });
    });

    if (ocupadas) {
      return { ok: false, motivo: 'A rua tem ' + ocupadas + ' posição(ões) com material.' };
    }

    projeto.ruas = projeto.ruas.filter(function (r) { return r.numero !== Number(numero); });
    marcarAlteracao();
    return { ok: true };
  }

  /* ---------- CONSULTAR ---------- */

  function posicao(codigo) {
    var achada = null;
    projeto.ruas.forEach(function (r) {
      r.niveis.forEach(function (nv) {
        nv.posicoes.forEach(function (p) {
          if (p.codigo === codigo) achada = p;
        });
      });
    });
    return achada;
  }

  function todasPosicoes() {
    var todas = [];
    projeto.ruas.forEach(function (r) {
      r.niveis.forEach(function (nv) {
        nv.posicoes.forEach(function (p) { todas.push(p); });
      });
    });
    return todas;
  }

  function resumo() {
    var todas = todasPosicoes();
    function conta(st) {
      return todas.filter(function (p) { return p.status === st; }).length;
    }
    return {
      ruas: projeto.ruas.length,
      posicoes: todas.length,
      disponiveis: conta('DISPONIVEL'),
      ocupadas: conta('OCUPADA'),
      reservadas: conta('RESERVADA'),
      bloqueadas: conta('BLOQUEADA'),
      ocupacao: todas.length ? Math.round((conta('OCUPADA') / todas.length) * 100) : 0
    };
  }

  /** Procura por código de posição ou nome de rua */
  function buscar(termo) {
    var t = String(termo || '').toUpperCase().trim();
    if (!t) return [];

    var achados = [];
    projeto.ruas.forEach(function (r) {
      if (r.nome.toUpperCase().indexOf(t) > -1 || r.codigo.indexOf(t) > -1) {
        achados.push({ tipo: 'RUA', codigo: r.codigo, nome: r.nome, rua: r.numero });
      }
      r.niveis.forEach(function (nv) {
        nv.posicoes.forEach(function (p) {
          if (p.codigo.indexOf(t) > -1) {
            achados.push({ tipo: 'POSICAO', codigo: p.codigo, posicao: p });
          }
        });
      });
    });
    return achados.slice(0, 20);
  }

  function definirStatus(codigo, status) {
    var p = posicao(codigo);
    if (!p) return { ok: false, motivo: 'Posição não encontrada.' };
    p.status = status;
    marcarAlteracao();
    return { ok: true, posicao: p };
  }

  /* ---------- GUARDAR ---------- */

  function marcarAlteracao() {
    projeto.alteradoEm = new Date().toISOString();
    projeto.versao++;
    guardar();
  }

  function guardar() {
    try {
      /* o navegador guarda entre visitas; o Core assume depois */
      if (typeof sessionStorage !== 'undefined') {
        sessionStorage.setItem(CHAVE, JSON.stringify(projeto));
      }
    } catch (e) { }
  }

  function recuperar() {
    try {
      if (typeof sessionStorage === 'undefined') return false;
      var texto = sessionStorage.getItem(CHAVE);
      if (!texto) return false;
      var salvo = JSON.parse(texto);
      if (salvo && Array.isArray(salvo.ruas)) { projeto = salvo; return true; }
    } catch (e) { }
    return false;
  }

  /**
   * Estrutura de demonstração — o teste da seção 49.
   * Sempre identificada como DEMO, nunca confundida com real.
   */
  function demonstracao() {
    projeto = {
      nome: 'Almoxarifado DEMO',
      almoxarifado: 'A01',
      demo: true,
      ruas: [], versao: 1, alteradoEm: null
    };

    criarRua({ numero: 1, nome: 'Rua 01 — Hidráulica', categoria: 'Hidráulica', niveis: 4, posicoes: 5 });
    criarRua({ numero: 2, nome: 'Rua 02 — Elétrica', categoria: 'Elétrica', niveis: 3, posicoes: 6 });
    criarRua({ numero: 3, nome: 'Rua 03 — Ferramentas', categoria: 'Ferramentas', niveis: 5, posicoes: 4 });

    return projeto;
  }

  return {
    projeto: function () { return projeto; },
    criarRua: criarRua,
    ajustarRua: ajustarRua,
    removerRua: removerRua,
    posicao: posicao,
    todasPosicoes: todasPosicoes,
    resumo: resumo,
    buscar: buscar,
    definirStatus: definirStatus,
    demonstracao: demonstracao,
    recuperar: recuperar,
    guardar: guardar,
    codigoPosicao: codigoPosicao
  };
})();

/* ============================================================
   AP3D — PONTE COM O ALMOXA PRO
   ------------------------------------------------------------
   Ainda não conectada. Quando for, é só este arquivo que muda:
   nenhum componente visual sabe de onde os dados vêm.
   ============================================================ */

var AP3D_Ponte = (function () {

  var config = {
    urlCore: '',        /* o /exec do Apps Script */
    sessao: '',
    ligada: false,
    /* o sistema entregou a configuração ao abrir o módulo? */
    automatica: false
  };

  /**
   * Quando o módulo é aberto pelo próprio sistema, ele chega com a
   * configuração pronta — o usuário não precisa colar endereço
   * nenhum. A demonstração só aparece se não houver isso.
   */
  (function () {
    try {
      if (typeof window === 'undefined' || !window.AP3D_CONFIG) return;
      var c = window.AP3D_CONFIG;
      if (!c.urlCore) return;

      config.urlCore = c.urlCore;
      config.sessao = c.sessao || '';
      config.ligada = true;
      config.automatica = true;
    } catch (e) { }
  })();

  function configurar(urlCore, sessao) {
    config.urlCore = urlCore || '';
    config.sessao = sessao || '';
    config.ligada = !!urlCore;
    return config;
  }

  function chamar(modulo, acao, payload) {
    if (!config.ligada) {
      return Promise.resolve({
        ok: false,
        codigo: 'PONTE_DESLIGADA',
        mensagem: 'Este mapa ainda não está ligado ao ALMOXA PRO. ' +
          'A estrutura mostrada é de demonstração.'
      });
    }

    return fetch(config.urlCore, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        modulo: modulo, acao: acao,
        payload: payload || {}, sessao: config.sessao
      })
    }).then(function (r) { return r.json(); })
      .catch(function (e) {
        return { ok: false, codigo: 'SEM_CONEXAO', mensagem: e.message };
      });
  }

  /**
   * Traz a estrutura real do sistema.
   *
   * Converte o formato do Core para o formato daqui — é o único
   * ponto onde os dois vocabulários se encontram.
   */
  function carregarDoCore() {
    return chamar('localizacao', 'estrutura', {}).then(function (r) {
      if (!r.ok) return r;

      var d = r.dados;
      if (!d.configurado) {
        return {
          ok: false, codigo: 'SEM_ESTRUTURA',
          mensagem: 'O almoxarifado ainda não tem estrutura cadastrada no sistema.'
        };
      }

      return { ok: true, dados: d };
    });
  }

  return {
    configurar: configurar,
    chamar: chamar,
    carregarDoCore: carregarDoCore,
    ligada: function () { return config.ligada; },
    automatica: function () { return config.automatica; },
    config: function () { return config; }
  };
})();

/* ============================================================
   AP3D — CENA
   ------------------------------------------------------------
   Constrói o almoxarifado a partir da estrutura de dados.

   Um rack de verdade tem PILARES nas pontas, TRAVESSAS ligando
   os pilares e PRATELEIRAS apoiadas nas travessas. Desenhar só
   caixinhas soltas não parece um almoxarifado — parece um
   gráfico de barras.
   ============================================================ */

var AP3D_Cena = (function () {

  var motor = null, cena = null, camera = null;
  var raiz = null;
  var meshPorPosicao = {};
  var materiais = {};
  var selecionada = null;
  var aoSelecionar = null;

  /* medidas em metros — proporções de um porta-palete real */
  var M = {
    larguraPosicao: 1.3,
    alturaNivel: 1.6,
    profundidade: 1.1,
    larguraPilar: 0.09,
    espessuraPrateleira: 0.06,
    corredor: 2.8,
    alturaPredio: 9
  };

  var CORES = {
    DISPONIVEL: '#1E9E5A',
    OCUPADA: '#0B5FFF',
    RESERVADA: '#FF9F1C',
    BLOQUEADA: '#8E969F',
    CRITICA: '#C0392B',
    BUSCA: '#FFD400'
  };

  function hex(c) { return BABYLON.Color3.FromHexString(c); }

  /* ---------- INÍCIO ---------- */

  /** A biblioteca 3D está disponível? */
  function disponivel() {
    return typeof BABYLON !== 'undefined' && !!BABYLON.Engine;
  }

  function iniciar(canvas) {
    if (!disponivel()) return null;
    motor = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    cena = new BABYLON.Scene(motor);
    cena.clearColor = new BABYLON.Color4(0.04, 0.10, 0.16, 1);

    /* névoa dá profundidade e esconde o fim do galpão */
    cena.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
    cena.fogColor = new BABYLON.Color3(0.04, 0.10, 0.16);
    cena.fogStart = 34;
    cena.fogEnd = 95;

    camera = new BABYLON.ArcRotateCamera('cam',
      -Math.PI / 2.4, Math.PI / 2.9, 30,
      new BABYLON.Vector3(0, 3, 0), cena);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 6;
    camera.upperRadiusLimit = 90;
    /* trava para não olhar de baixo do chão */
    camera.upperBetaLimit = Math.PI / 2.05;
    camera.wheelPrecision = 18;
    camera.pinchPrecision = 90;
    camera.panningSensibility = 90;

    /* luz ambiente + duas direcionais: sem isso tudo fica chapado */
    var ambiente = new BABYLON.HemisphericLight('amb', new BABYLON.Vector3(0, 1, 0), cena);
    ambiente.intensity = 0.72;
    ambiente.groundColor = new BABYLON.Color3(0.16, 0.20, 0.26);

    var principal = new BABYLON.DirectionalLight('sol', new BABYLON.Vector3(-0.5, -1, -0.4), cena);
    principal.intensity = 0.55;
    principal.position = new BABYLON.Vector3(24, 30, 24);

    var apoio = new BABYLON.DirectionalLight('apoio', new BABYLON.Vector3(0.6, -0.5, 0.5), cena);
    apoio.intensity = 0.22;

    criarMateriais();

    raiz = new BABYLON.TransformNode('raiz', cena);

    motor.runRenderLoop(function () { if (cena) cena.render(); });
    window.addEventListener('resize', function () { if (motor) motor.resize(); });

    ligarSelecao();

    return { motor: motor, cena: cena, camera: camera };
  }

  function criarMateriais() {
    if (!disponivel()) return;

    /* estrutura do rack: laranja industrial, como na vida real */
    materiais.estrutura = new BABYLON.StandardMaterial('m_estrutura', cena);
    materiais.estrutura.diffuseColor = hex('#E8641A');
    materiais.estrutura.specularColor = new BABYLON.Color3(0.12, 0.12, 0.12);

    materiais.travessa = new BABYLON.StandardMaterial('m_travessa', cena);
    materiais.travessa.diffuseColor = hex('#1E5AA8');
    materiais.travessa.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

    materiais.prateleira = new BABYLON.StandardMaterial('m_prateleira', cena);
    materiais.prateleira.diffuseColor = hex('#9AA5B1');
    materiais.prateleira.specularColor = new BABYLON.Color3(0.06, 0.06, 0.06);

    materiais.chao = new BABYLON.StandardMaterial('m_chao', cena);
    materiais.chao.diffuseColor = hex('#2A3542');
    materiais.chao.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);

    materiais.faixa = new BABYLON.StandardMaterial('m_faixa', cena);
    materiais.faixa.diffuseColor = hex('#E8B21A');
    materiais.faixa.emissiveColor = hex('#3A2C00');

    materiais.placa = new BABYLON.StandardMaterial('m_placa', cena);
    materiais.placa.diffuseColor = hex('#0B2A55');
    materiais.placa.emissiveColor = hex('#081C39');

    /* um material por estado, criado uma vez só */
    Object.keys(CORES).forEach(function (st) {
      var m = new BABYLON.StandardMaterial('m_' + st, cena);
      m.diffuseColor = hex(CORES[st]);
      m.emissiveColor = hex(CORES[st]).scale(0.22);
      m.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      materiais[st] = m;
    });
  }

  /* ---------- CONSTRUÇÃO ---------- */

  function limpar() {
    if (!disponivel() || !cena) return;

    if (raiz) raiz.dispose(false, false);
    raiz = new BABYLON.TransformNode('raiz', cena);
    meshPorPosicao = {};
    selecionada = null;
  }

  /**
   * Monta o almoxarifado inteiro.
   * Chamada sempre que a estrutura muda.
   */
  function construir(projeto, aoProgredir) {
    /* sem 3D, a planta 2D assume: o cadastro não pode parar */
    if (!disponivel() || !cena) {
      return { posicoes: 0, sem3d: true };
    }

    limpar();

    var ruas = projeto.ruas || [];
    if (!ruas.length) {
      construirGalpao(12, 10);
      return { posicoes: 0, vazio: true };
    }

    /* tamanho do galpão vem das ruas, não é fixo */
    var maiorRua = 0;
    ruas.forEach(function (r) {
      var largura = (r.niveis[0] ? r.niveis[0].posicoes.length : 0) * M.larguraPosicao;
      if (largura > maiorRua) maiorRua = largura;
    });

    var profundidadeTotal = ruas.length * (M.profundidade + M.corredor) + M.corredor;
    construirGalpao(maiorRua + 8, profundidadeTotal + 4);

    var z = -(profundidadeTotal / 2) + M.corredor;
    var totalPosicoes = 0;

    ruas.forEach(function (rua, i) {
      construirRua(rua, z);
      totalPosicoes += rua.niveis.reduce(function (s, nv) { return s + nv.posicoes.length; }, 0);
      z += M.profundidade + M.corredor;

      if (aoProgredir) aoProgredir(Math.round(((i + 1) / ruas.length) * 100));
    });

    enquadrar();
    return { posicoes: totalPosicoes, ruas: ruas.length };
  }

  /** Chão, faixas de corredor e paredes */
  function construirGalpao(largura, profundidade) {
    var chao = BABYLON.MeshBuilder.CreateGround('chao',
      { width: largura + 6, height: profundidade + 6 }, cena);
    chao.material = materiais.chao;
    chao.parent = raiz;
    chao.receiveShadows = true;

    /* faixas amarelas: dão a escala e parecem almoxarifado */
    for (var f = -1; f <= 1; f += 2) {
      var faixa = BABYLON.MeshBuilder.CreateGround('faixa',
        { width: largura, height: 0.12 }, cena);
      faixa.material = materiais.faixa;
      faixa.position.y = 0.01;
      faixa.position.z = f * (profundidade / 2 - 1.2);
      faixa.parent = raiz;
    }

    /* paredes ao fundo, discretas */
    var parede = BABYLON.MeshBuilder.CreateBox('parede',
      { width: largura + 6, height: M.alturaPredio, depth: 0.2 }, cena);
    parede.position.y = M.alturaPredio / 2;
    parede.position.z = -(profundidade / 2 + 3);
    var mParede = new BABYLON.StandardMaterial('m_parede', cena);
    mParede.diffuseColor = hex('#1A2634');
    mParede.specularColor = new BABYLON.Color3(0, 0, 0);
    parede.material = mParede;
    parede.parent = raiz;
  }

  /**
   * Uma rua: dois racks de costas um para o outro, como num
   * almoxarifado de verdade, com a placa da rua no topo.
   */
  function construirRua(rua, z) {
    var no = new BABYLON.TransformNode('rua_' + rua.codigo, cena);
    no.parent = raiz;
    no.position.z = z;

    var quantasPosicoes = rua.niveis[0] ? rua.niveis[0].posicoes.length : 0;
    var larguraRua = quantasPosicoes * M.larguraPosicao;
    var xInicial = -larguraRua / 2;
    var alturaRack = rua.niveis.length * M.alturaNivel + 0.4;

    /* PILARES — nas pontas e entre cada posição */
    for (var i = 0; i <= quantasPosicoes; i++) {
      var x = xInicial + i * M.larguraPosicao;

      [-M.profundidade / 2, M.profundidade / 2].forEach(function (dz) {
        var pilar = BABYLON.MeshBuilder.CreateBox('pilar', {
          width: M.larguraPilar, height: alturaRack, depth: M.larguraPilar
        }, cena);
        pilar.position.set(x, alturaRack / 2, dz);
        pilar.material = materiais.estrutura;
        pilar.parent = no;
        pilar.isPickable = false;
      });
    }

    /* NÍVEIS: travessas + prateleira + posições */
    rua.niveis.forEach(function (nivel) {
      var y = nivel.numero * M.alturaNivel;

      /* travessas ligando os pilares, frente e fundo */
      [-M.profundidade / 2, M.profundidade / 2].forEach(function (dz) {
        var travessa = BABYLON.MeshBuilder.CreateBox('travessa', {
          width: larguraRua + M.larguraPilar, height: 0.1, depth: 0.07
        }, cena);
        travessa.position.set(0, y, dz);
        travessa.material = materiais.travessa;
        travessa.parent = no;
        travessa.isPickable = false;
      });

      /* a prateleira em si */
      var prateleira = BABYLON.MeshBuilder.CreateBox('prateleira', {
        width: larguraRua, height: M.espessuraPrateleira, depth: M.profundidade
      }, cena);
      prateleira.position.set(0, y - 0.06, 0);
      prateleira.material = materiais.prateleira;
      prateleira.parent = no;
      prateleira.isPickable = false;

      /* as posições, que são o que a pessoa clica */
      nivel.posicoes.forEach(function (pos) {
        var caixa = BABYLON.MeshBuilder.CreateBox(pos.codigo, {
          width: M.larguraPosicao * 0.82,
          height: M.alturaNivel * 0.6,
          depth: M.profundidade * 0.78
        }, cena);

        caixa.position.set(
          xInicial + (pos.numero - 0.5) * M.larguraPosicao,
          y + M.alturaNivel * 0.3 - 0.06,
          0
        );
        caixa.material = materiais[pos.status] || materiais.DISPONIVEL;
        caixa.parent = no;
        caixa.metadata = { codigo: pos.codigo, tipo: 'POSICAO' };

        meshPorPosicao[pos.codigo] = caixa;
      });
    });

    /* PLACA DA RUA, no alto */
    var placa = BABYLON.MeshBuilder.CreateBox('placa_' + rua.codigo, {
      width: 2.3, height: 0.62, depth: 0.07
    }, cena);
    placa.position.set(0, alturaRack + 0.7, M.profundidade / 2 + 0.2);
    placa.material = materiais.placa;
    placa.parent = no;
    placa.isPickable = false;

    escreverNaPlaca(placa, rua.nome || rua.codigo);
  }

  /** Texto na placa, desenhado numa textura */
  function escreverNaPlaca(placa, texto) {
    try {
      var tex = new BABYLON.DynamicTexture('t_' + placa.name,
        { width: 460, height: 124 }, cena, true);
      var ctx = tex.getContext();

      ctx.fillStyle = '#0B2A55';
      ctx.fillRect(0, 0, 460, 124);
      ctx.fillStyle = '#FF7A00';
      ctx.fillRect(0, 108, 460, 16);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 52px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      var t = String(texto).length > 20 ? String(texto).slice(0, 19) + '…' : texto;
      ctx.fillText(t, 230, 56);
      tex.update();

      var m = new BABYLON.StandardMaterial('mp_' + placa.name, cena);
      m.diffuseTexture = tex;
      m.emissiveColor = new BABYLON.Color3(0.55, 0.55, 0.55);
      m.specularColor = new BABYLON.Color3(0, 0, 0);
      placa.material = m;
    } catch (e) { /* sem texto na placa: a cena continua */ }
  }

  /* ---------- INTERAÇÃO ---------- */

  function ligarSelecao() {
    if (!disponivel() || !cena) return;

    cena.onPointerObservable.add(function (info) {
      if (info.type !== BABYLON.PointerEventTypes.POINTERPICK) return;

      var alvo = info.pickInfo && info.pickInfo.pickedMesh;
      if (!alvo || !alvo.metadata || alvo.metadata.tipo !== 'POSICAO') return;

      selecionar(alvo.metadata.codigo);
    });
  }

  function selecionar(codigo) {
    if (!disponivel() || !cena) {
      if (aoSelecionar) aoSelecionar(codigo, AP3D_Dados.posicao(codigo));
      return;
    }

    /* devolve a anterior à cor do estado */
    if (selecionada && meshPorPosicao[selecionada]) {
      var anterior = AP3D_Dados.posicao(selecionada);
      meshPorPosicao[selecionada].material =
        materiais[anterior ? anterior.status : 'DISPONIVEL'];
      meshPorPosicao[selecionada].scaling.setAll(1);
    }

    selecionada = codigo;
    var mesh = meshPorPosicao[codigo];
    if (mesh) {
      mesh.material = materiais.BUSCA;
      mesh.scaling.setAll(1.12);
      /* a câmera vai até a posição, sem cortar o caminho */
      irPara(mesh.getAbsolutePosition());
    }

    if (aoSelecionar) aoSelecionar(codigo, AP3D_Dados.posicao(codigo));
  }

  function irPara(alvo) {
    if (!camera) return;
    BABYLON.Animation.CreateAndStartAnimation('irPara', camera, 'target',
      60, 22, camera.target.clone(), alvo.clone(),
      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
  }

  function destacarBusca(codigos) {
    if (!disponivel() || !cena) return;

    Object.keys(meshPorPosicao).forEach(function (cod) {
      var p = AP3D_Dados.posicao(cod);
      meshPorPosicao[cod].material = materiais[p ? p.status : 'DISPONIVEL'];
      meshPorPosicao[cod].scaling.setAll(1);
    });

    (codigos || []).forEach(function (cod) {
      if (!meshPorPosicao[cod]) return;
      meshPorPosicao[cod].material = materiais.BUSCA;
      meshPorPosicao[cod].scaling.setAll(1.15);
    });

    if (codigos && codigos.length && meshPorPosicao[codigos[0]]) {
      irPara(meshPorPosicao[codigos[0]].getAbsolutePosition());
    }
  }

  function atualizarStatus(codigo, status) {
    if (!disponivel() || !cena) return;

    if (!meshPorPosicao[codigo]) return;
    meshPorPosicao[codigo].material = materiais[status] || materiais.DISPONIVEL;
  }

  /* ---------- CÂMERA ---------- */

  function enquadrar() {
    if (!disponivel()) return;

    if (!camera) return;
    camera.alpha = -Math.PI / 2.4;
    camera.beta = Math.PI / 2.9;
    camera.radius = 30;
    camera.target = new BABYLON.Vector3(0, 3, 0);
  }

  function vistaDeCima() {
    if (!disponivel()) return;

    if (!camera) return;
    BABYLON.Animation.CreateAndStartAnimation('cima', camera, 'beta',
      60, 22, camera.beta, 0.06, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
  }

  function zoom(fator) {
    if (!disponivel()) return;

    if (!camera) return;
    camera.radius = Math.max(camera.lowerRadiusLimit,
      Math.min(camera.upperRadiusLimit, camera.radius * fator));
  }

  return {
    iniciar: iniciar,
    construir: construir,
    selecionar: selecionar,
    destacarBusca: destacarBusca,
    atualizarStatus: atualizarStatus,
    enquadrar: enquadrar,
    vistaDeCima: vistaDeCima,
    zoom: zoom,
    cores: CORES,
    aoSelecionar: function (fn) { aoSelecionar = fn; },
    pronta: function () { return !!cena; },
    disponivel: disponivel
  };
})();

/* ============================================================
   AP3D — INTERFACE
   ------------------------------------------------------------
   Árvore, painel lateral, planta 2D e os controles.
   Nenhuma decisão de dado acontece aqui: a interface pergunta
   ao AP3D_Dados e mostra o que ele responde.
   ============================================================ */

var AP3D_UI = (function () {

  var abertos = {};       /* quais ruas estão expandidas */
  var modo = '3d';

  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function el(id) { return document.getElementById(id); }

  /* ============================================================
     ÁRVORE
     ============================================================ */

  function pintarArvore() {
    var projeto = AP3D_Dados.projeto();
    var alvo = el('arvore');

    if (!projeto.ruas.length) {
      alvo.innerHTML =
        '<div class="vazio">' +
        '<div class="ico">🏗️</div>' +
        '<h4>Sem estrutura</h4>' +
        '<p>Crie a primeira rua para o mapa aparecer.</p>' +
        '<button class="bt bt-laranja" onclick="AP3D_UI.abrirNovaRua()">Criar rua</button>' +
        '</div>';
      return;
    }

    var html = '';

    projeto.ruas.forEach(function (rua) {
      var aberta = abertos[rua.codigo] !== false;
      var posicoes = rua.niveis.reduce(function (s, nv) { return s + nv.posicoes.length; }, 0);
      var ocupadas = 0;
      rua.niveis.forEach(function (nv) {
        nv.posicoes.forEach(function (p) { if (p.status === 'OCUPADA') ocupadas++; });
      });

      html += '<div class="no" onclick="AP3D_UI.alternar(\'' + rua.codigo + '\')">' +
        '<span class="seta">' + (aberta ? '▾' : '▸') + '</span>' +
        '<span class="cor" style="background:' +
        (ocupadas ? AP3D_Cena.cores.OCUPADA : AP3D_Cena.cores.DISPONIVEL) + '"></span>' +
        '<span class="txt">' + esc(rua.nome) + '</span>' +
        '<span class="qtd">' + ocupadas + '/' + posicoes + '</span>' +
        '</div>';

      html += '<div class="filhos' + (aberta ? '' : ' fechado') + '">';

      rua.niveis.forEach(function (nivel) {
        html += '<div class="no" style="font-size:12px;color:var(--texto-3)">' +
          '<span class="seta"></span>' +
          '<span class="txt">Nível ' + nivel.numero + '</span>' +
          '<span class="qtd">' + nivel.posicoes.length + '</span>' +
          '</div>';

        html += '<div class="filhos">';
        nivel.posicoes.forEach(function (pos) {
          html += '<div class="no" data-pos="' + pos.codigo + '" ' +
            'onclick="AP3D_UI.irParaPosicao(\'' + pos.codigo + '\')">' +
            '<span class="seta"></span>' +
            '<span class="cor" style="background:' + AP3D_Cena.cores[pos.status] + '"></span>' +
            '<span class="txt mono">' + pos.codigo + '</span>' +
            (pos.itens ? '<span class="qtd">' + pos.itens + '</span>' : '') +
            '</div>';
        });
        html += '</div>';
      });

      html += '</div>';
    });

    alvo.innerHTML = html;
  }

  function alternar(codigoRua) {
    abertos[codigoRua] = abertos[codigoRua] === false;
    pintarArvore();
  }

  function irParaPosicao(codigo) {
    if (modo === '2d') {
      mostrarPosicao(codigo);
      pintarPlanta();
      return;
    }
    AP3D_Cena.selecionar(codigo);
  }

  /* ============================================================
     PAINEL
     ============================================================ */

  function pintarResumo() {
    var r = AP3D_Dados.resumo();
    var projeto = AP3D_Dados.projeto();

    el('painelTitulo').textContent = projeto.nome;
    el('painelSub').textContent = projeto.demo
      ? 'Estrutura de demonstração'
      : 'Clique numa posição para ver os detalhes';

    var html =
      (projeto.demo
        ? '<div class="aviso amarelo">Esta é uma estrutura de <b>demonstração</b>. ' +
          'Os dados não são do seu almoxarifado.</div>'
        : '') +

      '<div class="kpis">' +
      '<div class="kpi"><b>' + r.posicoes + '</b><span>posições</span></div>' +
      '<div class="kpi"><b>' + r.ruas + '</b><span>ruas</span></div>' +
      '<div class="kpi"><b>' + r.ocupadas + '</b><span>ocupadas</span></div>' +
      '<div class="kpi"><b>' + r.ocupacao + '%</b><span>ocupação</span></div>' +
      '</div>' +

      '<div class="linha-info"><span>Disponíveis</span><b>' + r.disponiveis + '</b></div>' +
      '<div class="linha-info"><span>Reservadas</span><b>' + r.reservadas + '</b></div>' +
      '<div class="linha-info"><span>Bloqueadas</span><b>' + r.bloqueadas + '</b></div>' +

      '<button class="bt bt-laranja" onclick="AP3D_UI.abrirNovaRua()">➕ Nova rua</button>' +
      (AP3D_Ponte.ligada()
        ? '<button class="bt bt-linha" onclick="AP3D_UI.sincronizar()">🔄 Buscar do sistema</button>' +
          (AP3D_Ponte.automatica()
            ? '<p style="font-size:11.5px;color:var(--texto-3);text-align:center;margin-top:10px">' +
              'Ligado ao ALMOXA PRO · dados do seu almoxarifado</p>'
            : '')
        : '<button class="bt bt-linha" onclick="AP3D_UI.abrirConexao()">🔗 Ligar ao ALMOXA PRO</button>');

    el('painelCorpo').innerHTML = html;
  }

  function mostrarPosicao(codigo) {
    var pos = AP3D_Dados.posicao(codigo);
    if (!pos) return;

    var projeto = AP3D_Dados.projeto();
    var rua = projeto.ruas.filter(function (r) { return r.numero === pos.rua; })[0];

    el('painelTitulo').textContent = codigo;
    el('painelSub').textContent = rua ? rua.nome : '';

    var rotulos = {
      DISPONIVEL: 'Disponível', OCUPADA: 'Ocupada',
      RESERVADA: 'Reservada', BLOQUEADA: 'Bloqueada', CRITICA: 'Crítica'
    };

    el('painelCorpo').innerHTML =
      '<div style="margin-bottom:14px">' +
      '<span class="selo" style="background:' + AP3D_Cena.cores[pos.status] + '">' +
      rotulos[pos.status] + '</span></div>' +

      '<div class="linha-info"><span>Endereço</span><b class="mono">' + codigo + '</b></div>' +
      '<div class="linha-info"><span>Rua</span><b>' + (rua ? esc(rua.nome) : pos.rua) + '</b></div>' +
      '<div class="linha-info"><span>Nível</span><b>' + pos.nivel + '</b></div>' +
      '<div class="linha-info"><span>Posição</span><b>' + pos.numero + '</b></div>' +
      (rua && rua.categoria
        ? '<div class="linha-info"><span>Categoria</span><b>' + esc(rua.categoria) + '</b></div>' : '') +
      '<div class="linha-info"><span>Itens guardados</span><b>' + (pos.itens || 0) + '</b></div>' +

      (pos.itens
        ? ''
        : '<div class="aviso azul" style="margin-top:14px">' +
          'Esta posição está vazia. O conteúdo aparece aqui quando o mapa ' +
          'estiver ligado ao sistema.</div>') +

      '<div class="campo" style="margin-top:16px">' +
      '<label>Situação da posição</label>' +
      '<select id="selStatus" onchange="AP3D_UI.mudarStatus(\'' + codigo + '\', this.value)">' +
      Object.keys(rotulos).map(function (st) {
        return '<option value="' + st + '"' + (pos.status === st ? ' selected' : '') + '>' +
          rotulos[st] + '</option>';
      }).join('') +
      '</select></div>' +

      '<button class="bt bt-linha" onclick="AP3D_UI.pintarResumo()">← Voltar ao resumo</button>';

    /* no celular, o painel sobe */
    var painel = el('painel');
    if (painel) painel.classList.add('aberto');
  }

  function mudarStatus(codigo, status) {
    AP3D_Dados.definirStatus(codigo, status);
    AP3D_Cena.atualizarStatus(codigo, status);
    pintarArvore();
    if (modo === '2d') pintarPlanta();
  }

  /* ============================================================
     PLANTA 2D
     ============================================================ */

  function pintarPlanta() {
    var projeto = AP3D_Dados.projeto();
    var alvo = el('planta');

    if (!projeto.ruas.length) {
      alvo.innerHTML = '<div class="vazio"><div class="ico">📐</div>' +
        '<h4>Sem estrutura</h4><p>Crie uma rua para ver a planta.</p></div>';
      return;
    }

    alvo.innerHTML = projeto.ruas.map(function (rua) {
      return '<div class="planta-rua">' +
        '<h4>' + esc(rua.nome) + '</h4>' +
        '<div class="sub">' + rua.niveis.length + ' níveis · ' +
        (rua.niveis[0] ? rua.niveis[0].posicoes.length : 0) + ' posições por nível' +
        (rua.categoria ? ' · ' + esc(rua.categoria) : '') + '</div>' +

        /* nível mais alto em cima, como se olhasse a estante de frente */
        rua.niveis.slice().reverse().map(function (nivel) {
          return '<div class="planta-nivel">' +
            '<div class="rot">Nível ' + nivel.numero + '</div>' +
            '<div class="planta-pos">' +
            nivel.posicoes.map(function (pos) {
              return '<div class="pos-2d" style="background:' + AP3D_Cena.cores[pos.status] + '" ' +
                'title="' + pos.codigo + '" ' +
                'onclick="AP3D_UI.irParaPosicao(\'' + pos.codigo + '\')">' +
                pos.numero + '</div>';
            }).join('') +
            '</div></div>';
        }).join('') +
        '</div>';
    }).join('');
  }

  /* ============================================================
     MODAIS
     ============================================================ */

  function abrirModal(titulo, sub, corpo, rodape) {
    el('modal').innerHTML =
      '<div class="modal-topo"><h3>' + titulo + '</h3>' +
      (sub ? '<p>' + sub + '</p>' : '') + '</div>' +
      '<div class="modal-corpo">' + corpo + '</div>' +
      '<div class="modal-rodape">' + rodape + '</div>';
    el('fundoModal').classList.add('on');
  }

  function fecharModal() {
    el('fundoModal').classList.remove('on');
  }

  function abrirNovaRua() {
    var projeto = AP3D_Dados.projeto();
    var proximo = projeto.ruas.length
      ? Math.max.apply(null, projeto.ruas.map(function (r) { return r.numero; })) + 1
      : 1;

    abrirModal('Nova rua', 'A estrutura é criada a partir destes números',
      '<div class="dupla">' +
      '<div class="campo"><label>Número da rua</label>' +
      '<input id="nrNumero" type="number" min="1" value="' + proximo + '"></div>' +
      '<div class="campo"><label>Categoria</label>' +
      '<input id="nrCategoria" placeholder="Hidráulica, Elétrica…"></div>' +
      '</div>' +

      '<div class="campo"><label>Nome</label>' +
      '<input id="nrNome" placeholder="Rua ' + (proximo < 10 ? '0' : '') + proximo + '"></div>' +

      '<div class="dupla">' +
      '<div class="campo"><label>Níveis (altura)</label>' +
      '<input id="nrNiveis" type="number" min="1" max="12" value="4"></div>' +
      '<div class="campo"><label>Posições por nível</label>' +
      '<input id="nrPosicoes" type="number" min="1" max="30" value="5"></div>' +
      '</div>' +

      '<div class="aviso azul">Serão criadas <b id="nrTotal">20</b> posições, ' +
      'cada uma com seu endereço.</div>' +
      '<div id="nrErro"></div>',

      '<button class="bt bt-linha" onclick="AP3D_UI.fecharModal()">Cancelar</button>' +
      '<button class="bt bt-azul" onclick="AP3D_UI.salvarNovaRua()">Criar rua</button>');

    /* o total se atualiza enquanto a pessoa digita */
    function recalcular() {
      var n = Number(el('nrNiveis').value) || 0;
      var p = Number(el('nrPosicoes').value) || 0;
      el('nrTotal').textContent = n * p;
    }
    el('nrNiveis').addEventListener('input', recalcular);
    el('nrPosicoes').addEventListener('input', recalcular);
  }

  function salvarNovaRua() {
    var r = AP3D_Dados.criarRua({
      numero: el('nrNumero').value,
      nome: el('nrNome').value,
      categoria: el('nrCategoria').value,
      niveis: el('nrNiveis').value,
      posicoes: el('nrPosicoes').value
    });

    if (!r.ok) {
      el('nrErro').innerHTML = '<div class="aviso amarelo">' + esc(r.motivo) + '</div>';
      return;
    }

    fecharModal();
    reconstruir();
  }

  function abrirConexao() {
    abrirModal('Ligar ao ALMOXA PRO',
      'O mapa passa a mostrar o almoxarifado de verdade',

      '<div class="aviso azul">Cole o endereço que termina em <b>/exec</b>, ' +
      'o mesmo que você usa para abrir o sistema.</div>' +

      '<div class="campo"><label>Endereço do sistema</label>' +
      '<input id="cxUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>' +

      '<div class="campo"><label>Sessão (opcional)</label>' +
      '<input id="cxSessao" placeholder="deixe vazio para consulta pública"></div>' +

      '<div id="cxResultado"></div>',

      '<button class="bt bt-linha" onclick="AP3D_UI.fecharModal()">Cancelar</button>' +
      '<button class="bt bt-azul" onclick="AP3D_UI.testarConexao()">Conectar</button>');
  }

  function testarConexao() {
    var url = el('cxUrl').value.trim();
    if (!url) {
      el('cxResultado').innerHTML = '<div class="aviso amarelo">Informe o endereço.</div>';
      return;
    }

    el('cxResultado').innerHTML = '<div class="aviso azul">Conectando…</div>';
    AP3D_Ponte.configurar(url, el('cxSessao').value.trim());

    AP3D_Ponte.carregarDoCore().then(function (r) {
      if (!r.ok) {
        el('cxResultado').innerHTML =
          '<div class="aviso amarelo"><b>Não deu certo</b><br>' + esc(r.mensagem || '') +
          '<br><br>O mapa continua com a estrutura atual.</div>';
        return;
      }

      el('cxResultado').innerHTML =
        '<div class="aviso azul"><b>Conectado</b><br>' +
        r.dados.resumo.totalPosicoes + ' posições encontradas no sistema.</div>';

      setTimeout(function () { fecharModal(); importarDoCore(r.dados); }, 1200);
    });
  }

  /** Converte a estrutura do Core para o formato daqui */
  function importarDoCore(dados) {
    var projeto = AP3D_Dados.projeto();
    projeto.ruas = [];
    projeto.demo = false;
    projeto.nome = 'Almoxarifado';

    (dados.almoxarifados || []).forEach(function (a) {
      (a.ruas || []).forEach(function (r) {
        var rua = {
          codigo: r.codigo, numero: r.numero,
          nome: r.nome, categoria: r.categoria || '', niveis: []
        };

        (r.niveis || []).forEach(function (n) {
          rua.niveis.push({
            numero: n.numero, codigo: n.codigo,
            posicoes: (n.posicoes || []).map(function (p) {
              return {
                codigo: p.codigo, numero: p.numero,
                rua: r.numero, nivel: n.numero,
                status: p.status || 'DISPONIVEL',
                itens: p.itens || 0, capacidade: null
              };
            })
          });
        });

        projeto.ruas.push(rua);
      });
    });

    AP3D_Dados.guardar();
    reconstruir();
  }

  function sincronizar() {
    el('painelCorpo').innerHTML = '<div class="vazio"><div class="ico">🔄</div>' +
      '<h4>Buscando…</h4><p>Lendo a estrutura do sistema.</p></div>';

    AP3D_Ponte.carregarDoCore().then(function (r) {
      if (!r.ok) {
        pintarResumo();
        alert('Não foi possível buscar: ' + (r.mensagem || ''));
        return;
      }
      importarDoCore(r.dados);
    });
  }

  /* ============================================================
     MODO E BUSCA
     ============================================================ */

  function trocarModo(novo) {
    modo = novo;
    el('btn3d').classList.toggle('on', novo === '3d');
    el('btn2d').classList.toggle('on', novo === '2d');
    el('planta').classList.toggle('on', novo === '2d');

    if (novo === '2d') pintarPlanta();
  }

  function buscar(termo) {
    var achados = AP3D_Dados.buscar(termo);

    if (!termo.trim()) {
      AP3D_Cena.destacarBusca([]);
      pintarArvore();
      return;
    }

    var codigos = achados.filter(function (a) { return a.tipo === 'POSICAO'; })
      .map(function (a) { return a.codigo; });

    AP3D_Cena.destacarBusca(codigos);

    if (codigos.length === 1) mostrarPosicao(codigos[0]);
  }

  /* ============================================================
     CICLO
     ============================================================ */

  function reconstruir() {
    var projeto = AP3D_Dados.projeto();
    AP3D_Cena.construir(projeto);
    pintarArvore();
    pintarResumo();
    if (modo === '2d') pintarPlanta();
    pintarLegenda();
  }

  function pintarLegenda() {
    var rotulos = {
      DISPONIVEL: 'Disponível', OCUPADA: 'Ocupada',
      RESERVADA: 'Reservada', BLOQUEADA: 'Bloqueada'
    };
    el('legenda').innerHTML = Object.keys(rotulos).map(function (st) {
      return '<span><i style="background:' + AP3D_Cena.cores[st] + '"></i>' + rotulos[st] + '</span>';
    }).join('');
  }

  /**
   * Sem estrutura no sistema.
   *
   * Mostrar um almoxarifado inventado aqui seria pior que mostrar
   * nada: a pessoa acharia que o mapa está errado.
   */
  function semEstrutura(motivo) {
    var projeto = AP3D_Dados.projeto();
    projeto.ruas = [];
    projeto.demo = false;
    projeto.nome = 'Almoxarifado';

    AP3D_Cena.construir(projeto);
    pintarArvore();
    pintarLegenda();
    if (modo === '2d') pintarPlanta();

    el('painelTitulo').textContent = 'Sem estrutura';
    el('painelSub').textContent = 'Nada cadastrado ainda';

    el('painelCorpo').innerHTML =
      '<div class="aviso amarelo"><b>O almoxarifado ainda não tem estrutura</b><br>' +
      esc(motivo || 'Nenhuma localização foi encontrada no sistema.') + '</div>' +

      '<p style="font-size:13px;color:var(--texto-2);line-height:1.6;margin:14px 0">' +
      'O mapa nasce das localizações cadastradas. Cadastre as ruas e prateleiras ' +
      'em <b>Estoque → Localização física</b>, ou crie a estrutura aqui mesmo.</p>' +

      '<button class="bt bt-laranja" onclick="AP3D_UI.abrirNovaRua()">Criar rua aqui</button>' +
      '<button class="bt bt-linha" onclick="AP3D_UI.sincronizar()">Buscar de novo</button>';
  }

  return {
    semEstrutura: semEstrutura,
    importarDoCore: importarDoCore,
    pintarArvore: pintarArvore,
    pintarResumo: pintarResumo,
    pintarPlanta: pintarPlanta,
    pintarLegenda: pintarLegenda,
    mostrarPosicao: mostrarPosicao,
    mudarStatus: mudarStatus,
    alternar: alternar,
    irParaPosicao: irParaPosicao,
    abrirNovaRua: abrirNovaRua,
    salvarNovaRua: salvarNovaRua,
    abrirConexao: abrirConexao,
    testarConexao: testarConexao,
    sincronizar: sincronizar,
    fecharModal: fecharModal,
    trocarModo: trocarModo,
    buscar: buscar,
    reconstruir: reconstruir,
    modo: function () { return modo; }
  };
})();

/* ============================================================
   AP3D — INÍCIO
   ============================================================ */

(function () {
  function passo(texto, porcento) {
    var p = document.getElementById('passo');
    var b = document.getElementById('progresso');
    if (p) p.textContent = texto;
    if (b) b.style.width = porcento + '%';
  }

  function esconderCarregamento() {
    setTimeout(function () {
      var c = document.getElementById('carregando');
      if (c) c.style.display = 'none';
    }, 300);
  }

  function comecar() {
    passo('Preparando a cena…', 20);

    var canvas = document.getElementById('cena');

    /**
     * Sem a biblioteca 3D, a aplicação NÃO para.
     *
     * Ela vem da internet; numa obra com sinal ruim isso acontece.
     * Cadastrar ruas e usar a planta 2D continua funcionando —
     * prometer isso e travar seria pior que não prometer.
     */
    var tem3D = AP3D_Cena.disponivel();

    if (!tem3D) {
      if (AP3D_Ponte.automatica()) {
        AP3D_Ponte.carregarDoCore().then(function (r) {
          if (r.ok) AP3D_UI.importarDoCore(r.dados);
          else AP3D_UI.semEstrutura(r.mensagem);
        });
      } else if (!AP3D_Dados.recuperar()) {
        AP3D_Dados.demonstracao();
      }

      AP3D_UI.trocarModo('2d');
      AP3D_UI.pintarArvore();
      AP3D_UI.pintarResumo();
      AP3D_UI.pintarPlanta();
      AP3D_UI.pintarLegenda();

      var c = document.getElementById('carregando');
      if (c) c.style.display = 'none';

      var btn3d = document.getElementById('btn3d');
      if (btn3d) {
        btn3d.disabled = true;
        btn3d.title = 'A biblioteca 3D não carregou';
        btn3d.style.opacity = '.45';
      }

      var dica = document.getElementById('dica');
      if (dica) {
        dica.textContent = 'A biblioteca 3D não carregou — a planta 2D está ativa';
        dica.style.background = 'rgba(255,159,28,.92)';
      }
      return;
    }

    AP3D_Cena.iniciar(canvas);

    AP3D_Cena.aoSelecionar(function (codigo) {
      AP3D_UI.mostrarPosicao(codigo);
    });

    /**
     * Aberto pelo sistema: lê o almoxarifado de verdade.
     * Nenhuma estrutura inventada aparece quando há dados reais.
     */
    if (AP3D_Ponte.automatica()) {
      passo('Lendo o seu almoxarifado…', 45);

      AP3D_Ponte.carregarDoCore().then(function (r) {
        if (r.ok) {
          AP3D_UI.importarDoCore(r.dados);
          passo('Pronto', 100);
          esconderCarregamento();
          return;
        }

        /* sem estrutura no sistema: diz isso, não inventa */
        passo('', 100);
        esconderCarregamento();
        AP3D_UI.semEstrutura(r.mensagem);
      });
      return;
    }

    passo('Lendo a estrutura…', 45);

    /* estrutura guardada, ou a de demonstração */
    if (!AP3D_Dados.recuperar()) AP3D_Dados.demonstracao();

    passo('Montando os racks…', 70);

    setTimeout(function () {
      AP3D_UI.reconstruir();
      passo('Pronto', 100);
      esconderCarregamento();
    }, 120);
  }

  function ligarControles() {
    document.getElementById('btn3d').onclick = function () { AP3D_UI.trocarModo('3d'); };
    document.getElementById('btn2d').onclick = function () { AP3D_UI.trocarModo('2d'); };
    document.getElementById('btNovaRua').onclick = function () { AP3D_UI.abrirNovaRua(); };

    document.getElementById('btZoomMais').onclick = function () { AP3D_Cena.zoom(0.82); };
    document.getElementById('btZoomMenos').onclick = function () { AP3D_Cena.zoom(1.22); };
    document.getElementById('btTopo').onclick = function () { AP3D_Cena.vistaDeCima(); };
    document.getElementById('btReset').onclick = function () { AP3D_Cena.enquadrar(); };

    document.getElementById('btTela').onclick = function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    };

    var busca = document.getElementById('busca');
    var timer = null;
    busca.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { AP3D_UI.buscar(busca.value); }, 280);
    });

    document.getElementById('fundoModal').addEventListener('click', function (e) {
      if (e.target.id === 'fundoModal') AP3D_UI.fecharModal();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { ligarControles(); comecar(); });
  } else {
    ligarControles(); comecar();
  }
})();

</script>
</body>
</html>
