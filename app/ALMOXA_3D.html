<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALMOX PRO 3D</title>
<style>
/* ALMOXA 3D · almoxa3d.css · 08/11/2026
   Responsivo de verdade (seção 11): no celular o painel vira
   gaveta de baixo, e a tela 3D fica inteira para o dedo. */
:root{
  --fundo:#EEF1F5; --papel:#FFFFFF; --texto:#1B2430; --texto2:#5A6472;
  --texto3:#8A93A0; --borda:#DDE2E8; --azul:#2F7BE8; --azulEscuro:#1E3A5F;
  --verde:#2E9E5B; --cinza:#9AA3AE; --amarelo:#E8A33D; --vermelho:#D2443B;
  --sombra:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);
  color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
#app{display:flex;height:100%;width:100%}

/* ---------- a cena ---------- */
#cena{position:relative;flex:1;min-width:0}
#tela3d{width:100%;height:100%;display:block;outline:none;touch-action:none}

#barra{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;
  gap:8px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(238,241,245,.96),rgba(238,241,245,0));
  pointer-events:none}
#barra>*{pointer-events:auto}
.marca{font-weight:700;letter-spacing:.02em;color:var(--azulEscuro);margin-right:4px}
.marca small{font-weight:500;color:var(--texto3);display:block;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase}

.btn{border:1px solid var(--borda);background:var(--papel);color:var(--texto2);
  border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;
  box-shadow:var(--sombra);white-space:nowrap}
.btn:hover{border-color:#C3CBD5;color:var(--texto)}
.btn[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:active{transform:translateY(1px)}

/* ---------- legenda ---------- */
#legenda{position:absolute;left:12px;bottom:12px;background:var(--papel);
  border:1px solid var(--borda);border-radius:11px;padding:9px 11px;
  box-shadow:var(--sombra);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--texto2)}
.bolinha{width:11px;height:11px;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- painel ---------- */
#painel{width:330px;flex:none;background:var(--papel);border-left:1px solid var(--borda);
  display:flex;flex-direction:column;overflow:hidden}
#painel h2{margin:0;padding:14px 16px 10px;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--texto3);border-bottom:1px solid var(--borda)}
#corpoPainel{padding:14px 16px;overflow:auto;flex:1}

.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cartao{border:1px solid var(--borda);border-radius:10px;padding:9px 11px}
.cartao b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.cartao span{font-size:11px;color:var(--texto3)}

.barraOcup{height:8px;border-radius:99px;background:#EDF0F4;overflow:hidden;margin:4px 0 14px}
.barraOcup i{display:block;height:100%;background:var(--verde);border-radius:99px}

.linha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px dashed var(--borda);font-size:13px}
.linha:last-child{border-bottom:0}
.linha span{color:var(--texto3)}
.linha b{font-weight:600;text-align:right;word-break:break-word}

.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:700;letter-spacing:.03em;color:#fff}
.vazio{text-align:center;color:var(--texto3);padding:26px 10px;font-size:13px;line-height:1.6}
.aviso{border:1px solid #F0D8A8;background:#FEF8EC;color:#7A5B18;border-radius:10px;
  padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.erro{border-color:#F2C3BF;background:#FDF1F0;color:#8A2B23}

/* ---------- celular e tablet (seção 11) ---------- */
@media (max-width:860px){
  #app{flex-direction:column}
  #painel{width:100%;height:46vh;border-left:0;border-top:1px solid var(--borda);
    border-radius:16px 16px 0 0;margin-top:-16px;box-shadow:0 -6px 24px rgba(16,24,40,.08)}
  #painel h2{padding:12px 16px 8px}
  #legenda{bottom:auto;top:56px;left:12px;right:12px;justify-content:center}
  .numeros{grid-template-columns:repeat(4,1fr)}
  .cartao b{font-size:16px}
}
@media (max-width:420px){
  .numeros{grid-template-columns:repeat(2,1fr)}
  #barra{padding:8px}
  .btn{padding:6px 9px;font-size:12px}
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fundo:#141922; --papel:#1C222C; --texto:#E8ECF1; --texto2:#AEB7C3;
    --texto3:#7C8694; --borda:#2B333F; --azulEscuro:#9BC2F5;
    --sombra:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}

/* ============================================================
   CONSTRUTOR DE ESTANTE · 08/11
   ============================================================ */
.construtor .campo { margin-bottom: 10px; }
.construtor label {
  display: block; font-size: 11px; letter-spacing: .3px;
  text-transform: uppercase; color: var(--texto-3); margin-bottom: 4px;
}
.construtor input {
  width: 100%; box-sizing: border-box;
  padding: 8px 10px; font-size: 14px; font-family: inherit;
  color: var(--texto-1); background: #fff;
  border: 1px solid var(--borda); border-radius: 6px;
}
.construtor input:focus {
  outline: none; border-color: #2F7BE8;
  box-shadow: 0 0 0 3px rgba(47,123,232,.14);
}
.construtor .campo2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.construtor .campo3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.construtor .sep { height: 1px; background: var(--borda); margin: 14px 0; }
.construtor .codigos { display: flex; flex-wrap: wrap; gap: 4px; }
.construtor .cod {
  font-family: ui-monospace, Consolas, monospace; font-size: 11px;
  padding: 2px 6px; border-radius: 4px;
  background: #E6F4EC; color: #24824A; border: 1px solid #BFE3CD;
}
.construtor .cod.mais { background: var(--fundo-2); color: var(--texto-3); border-color: var(--borda); }
.construtor button[disabled] { opacity: .5; cursor: not-allowed; }

</style>
<!--
  ALMOXA 3D · index.html · 08/11/2026

  Esta página roda nos DOIS ambientes (seção 5 do adendo):

   · GitHub Pages — os arquivos ficam lado a lado, como estão aqui;
   · Apps Script  — o HtmlService não serve arquivo .js solto, então
     na hora de publicar no /exec os quatro scripts entram no lugar
     das quatro linhas marcadas lá embaixo. A documentação em
     IMPLANTACAO.md explica, e NENHUMA linha de lógica muda.

  O endereço do Core NÃO está escrito aqui. Ele é informado em
  tempo de execução (ver o bloco de configuração no fim). Seção 3:
  nada de credencial em código público.
-->
</head>
<body>

<div id="app">

  <div id="cena">
    <canvas id="tela3d" touch-action="none"></canvas>

    <div id="barra">
      <div class="marca">ALMOX PRO 3D<small>Mapa do almoxarifado</small></div>
      <button class="btn" id="v_perspectiva" aria-pressed="true">Perspectiva</button>
      <button class="btn" id="v_superior" aria-pressed="false">De cima</button>
      <button class="btn" id="v_frontal" aria-pressed="false">De frente</button>
      <button class="btn" id="v_lateral" aria-pressed="false">De lado</button>
      <button class="btn" id="v_recarregar">Atualizar</button>
      <button class="btn" id="v_construir">Construir estante</button>
    </div>

    <div id="legenda">
      <div class="leg"><i class="bolinha" style="background:#9AA3AE"></i>vazia</div>
      <div class="leg"><i class="bolinha" style="background:#2E9E5B"></i>com material</div>
      <div class="leg"><i class="bolinha" style="background:#E8A33D"></i>lotada</div>
      <div class="leg"><i class="bolinha" style="background:#D2443B"></i>bloqueada</div>
      <div class="leg"><i class="bolinha" style="background:#2F7BE8"></i>selecionada</div>
    </div>
  </div>

  <aside id="painel">
    <h2 id="tituloPainel">O galpão</h2>
    <div id="corpoPainel">
      <div class="vazio">Carregando o motor 3D…</div>
    </div>
  </aside>

</div>

<!-- ===== Babylon.js · versão fixa, nunca "latest" ============
     Versão travada de propósito: biblioteca que se atualiza
     sozinha quebra sistema em produção sem ninguém ter mexido.
     ========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>

<!-- ===== os quatro arquivos do módulo ======================
     No Apps Script, estas quatro linhas viram o conteúdo dos
     arquivos, colado aqui dentro. Nada mais muda.
     ========================================================= -->
<script>
/* ===== layout3d.js ===== */
/* ============================================================
   ALMOXA 3D · layout3d.js  ·  08/11/2026
   ------------------------------------------------------------
   A MATEMÁTICA DO GALPÃO. Aqui não entra Babylon.

   Esta camada pega as localizações do ALMOX PRO — as mesmas da
   aba ALMOXA_LOCALIZACOES, com rua, estante, prateleira e
   posição — e devolve uma lista de PEÇAS com medida e lugar em
   metros:

       { tipo:'montante', x, y, z, lx, ly, lz, cor, ... }

   O motor 3D só traduz essa lista em malhas. Separar assim tem
   dois motivos concretos:

     1. a conta pode ser testada sem placa de vídeo e sem CDN —
        e foi: a suíte prova_layout3d.js roda em Node;
     2. no dia em que o Babylon for trocado, ou aparecer uma
        visão 2D de impressão, a geometria continua valendo.

   AS MEDIDAS SÃO DE ESTANTE DE VERDADE, em metros. Não é
   quadradinho em tela: é uma estante porta-palete com montante,
   longarina, prateleira e vão de corredor por onde cabe gente.
   ============================================================ */
(function (raiz) {
  'use strict';

  /* ----------------------------------------------------------
     MEDIDAS PADRÃO · metros
     Vieram de estante de almoxarifado comum. Dá para trocar
     passando outras em LAYOUT.montar(locais, { medidas }).
     ---------------------------------------------------------- */
  var MEDIDAS = {
    larguraPosicao: 1.00,   /* frente de uma posição */
    alturaNivel: 0.55,      /* de uma prateleira à outra */
    profundidade: 0.60,     /* o quanto a estante entra */
    montante: 0.06,         /* a coluna de ferro */
    longarina: 0.05,        /* a viga horizontal */
    prateleira: 0.03,       /* a chapa onde o material apoia */
    corredor: 2.40,         /* entre uma rua e outra: cabe empilhadeira */
    vaoEstantes: 0.30,      /* respiro entre estantes da mesma rua */
    peDireito: 0.00,        /* altura livre do chão até a 1ª prateleira */
    folgaPiso: 2.00         /* sobra do piso além das estantes */
  };

  /* ----------------------------------------------------------
     AS CORES · seção 8 da especificação
     Elas NÃO são escolha de gosto: saem do dado oficial. Quem
     pinta de verde é a ocupação, não o programador.
     ---------------------------------------------------------- */
  var CORES = {
    vazia:       '#9AA3AE',   /* cinza  · posição livre */
    ocupada:     '#2E9E5B',   /* verde  · tem material */
    atencao:     '#E8A33D',   /* amarelo· cheia ou quase */
    problema:    '#D2443B',   /* vermelho· bloqueada ou divergente */
    selecionada: '#2F7BE8',   /* azul   · o que o usuário clicou */
    estrutura:   '#5A6472',   /* o ferro da estante */
    piso:        '#E7E9EC',
    faixa:       '#C9CDD3'    /* a pintura do corredor */
  };

  function lp(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }
  function cima(v) { return lp(v).toUpperCase(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /* ----------------------------------------------------------
     A COR DE UMA POSIÇÃO
     ------------------------------------------------------------
     Ordem importa: bloqueio manda sobre lotação, que manda sobre
     ocupação. Uma posição bloqueada com material continua
     vermelha — senão o vermelho some justamente onde ele serve.
     ---------------------------------------------------------- */
  /* ------------------------------------------------------------
     [12/11] DOIS ERROS QUE DEIXAVAM O MAPA MENTIR

     1. Eu lia loc.status. A rota locais.listar não devolve
        "status": devolve "situacao". Então a leitura dava sempre
        vazia e NENHUMA posição ficava vermelha, nunca.

     2. Eu comparava loc.itens com a capacidade. Mas "itens" é a
        CONTAGEM DE SKUs DIFERENTES guardados ali, e capacidade é
        de quantidade. Quem mede quantidade é "ocupacao" — a soma
        do saldo —, e o próprio sistema já entrega "percentual"
        calculado. Comparar contagem de SKU com capacidade de
        quantidade pintava de amarelo posição vazia e deixava
        verde posição lotada.

     Agora: o bloqueio sai de qualquer um dos dois campos, e a
     lotação sai do percentual do sistema quando ele vem. Onde o
     dado não vier, a conta antiga continua valendo — por isso as
     provas de 08/11 seguem passando.
     ------------------------------------------------------------ */
  var BLOQUEIO = /^(BLOQUEAD|DIVERG|INTERDIT|INATIV|DESATIV)/;

  function corDaPosicao(loc) {
    if (!loc) return CORES.vazia;

    /* os DOIS campos, cada um por si. Escrever
       (loc.status || loc.situacao) deixava um "status" qualquer
       — um 'DISPONIVEL' velho, por exemplo — tapar a situacao
       de verdade, que era onde o bloqueio estava escrito. */
    if (BLOQUEIO.test(cima(loc.status))) return CORES.problema;
    if (BLOQUEIO.test(cima(loc.situacao))) return CORES.problema;
    if (loc.bloqueada === true || loc.ativo === false) return CORES.problema;

    var cap = num(loc.capacidade);

    /* quanto material está guardado ali */
    var qtd = (loc.ocupacao !== undefined && loc.ocupacao !== null)
      ? num(loc.ocupacao)
      : num(loc.itens);

    /* quantos SKUs diferentes — serve só para saber se está vazia */
    var skus = (loc.itens !== undefined && loc.itens !== null)
      ? num(loc.itens) : qtd;

    if (qtd <= 0 && skus <= 0) return CORES.vazia;

    /* o sistema já calcula o percentual: quando vier, mando nele */
    var pct = (loc.percentual !== undefined && loc.percentual !== null)
      ? num(loc.percentual)
      : (cap > 0 ? (qtd / cap) * 100 : 0);

    if (cap > 0 && pct >= 100) return CORES.atencao;   /* lotada */
    return CORES.ocupada;
  }

  function situacaoDaPosicao(loc) {
    var c = corDaPosicao(loc);
    if (c === CORES.problema) return 'BLOQUEADA';
    if (c === CORES.atencao) return 'LOTADA';
    if (c === CORES.ocupada) return 'OCUPADA';
    return 'VAZIA';
  }

  /* ----------------------------------------------------------
     ORGANIZAR: a lista plana vira árvore rua → estante →
     prateleira → posição. Ordenada, para o galpão não mudar de
     forma a cada carregamento.
     ---------------------------------------------------------- */
  function organizar(locais) {
    var ruas = {};
    var lista = Object.prototype.toString.call(locais) === '[object Array]' ? locais : [];

    for (var i = 0; i < lista.length; i++) {
      var l = lista[i];
      if (!l) continue;
      var nRua = cima(l.rua);
      if (!nRua) continue;
      var nEst = cima(l.estante) || '(sem estante)';
      var nPra = cima(l.prateleira) || '(sem prateleira)';

      if (!ruas[nRua]) ruas[nRua] = { nome: nRua, estantes: {} };
      var R = ruas[nRua];
      if (!R.estantes[nEst]) R.estantes[nEst] = { nome: nEst, prateleiras: {} };
      var E = R.estantes[nEst];
      if (!E.prateleiras[nPra]) E.prateleiras[nPra] = { nome: nPra, posicoes: [] };
      E.prateleiras[nPra].posicoes.push(l);
    }

    function chaves(o) { var a = []; for (var k in o) if (o.hasOwnProperty(k)) a.push(k); a.sort(); return a; }

    return chaves(ruas).map(function (nr) {
      var R = ruas[nr];
      return {
        nome: R.nome,
        estantes: chaves(R.estantes).map(function (ne) {
          var E = R.estantes[ne];
          return {
            nome: E.nome,
            prateleiras: chaves(E.prateleiras).map(function (np) {
              var P = E.prateleiras[np];
              P.posicoes.sort(function (a, b) {
                return cima(a.posicao) < cima(b.posicao) ? -1 : 1;
              });
              return P;
            })
          };
        })
      };
    });
  }

  /* ----------------------------------------------------------
     MONTAR: a árvore vira peças com medida e lugar
     ---------------------------------------------------------- */
  function montar(locais, opcoes) {
    opcoes = opcoes || {};
    var M = {};
    for (var k in MEDIDAS) M[k] = MEDIDAS[k];
    if (opcoes.medidas) for (var k2 in opcoes.medidas) M[k2] = opcoes.medidas[k2];

    var ruas = organizar(locais);
    var pecas = [];
    var indice = {};          /* codigo -> peça da posição, para o clique achar */
    var contagem = { ruas: 0, estantes: 0, prateleiras: 0, posicoes: 0 };
    var maxX = 0, maxZ = 0, maxY = 0;

    var x = M.folgaPiso;      /* caminha pelo eixo X, uma rua depois da outra */

    for (var r = 0; r < ruas.length; r++) {
      var rua = ruas[r];
      contagem.ruas++;
      var xRua = x;
      var larguraRua = M.profundidade;
      var z = M.folgaPiso;    /* dentro da rua, as estantes caminham no Z */

      for (var e = 0; e < rua.estantes.length; e++) {
        var est = rua.estantes[e];
        contagem.estantes++;

        /* quantas posições tem a prateleira mais larga manda na estante */
        var maiorLinha = 1;
        for (var p0 = 0; p0 < est.prateleiras.length; p0++) {
          maiorLinha = Math.max(maiorLinha, est.prateleiras[p0].posicoes.length);
        }
        var compEstante = maiorLinha * M.larguraPosicao;
        var niveis = est.prateleiras.length;
        var alturaEstante = M.peDireito + niveis * M.alturaNivel + M.alturaNivel * 0.4;

        /* --- os montantes: quatro colunas de ferro --- */
        var cantos = [
          [xRua, z], [xRua + M.profundidade, z],
          [xRua, z + compEstante], [xRua + M.profundidade, z + compEstante]
        ];
        for (var c = 0; c < cantos.length; c++) {
          pecas.push({
            tipo: 'montante', id: 'MONT-' + rua.nome + '-' + est.nome + '-' + c,
            x: cantos[c][0], y: alturaEstante / 2, z: cantos[c][1],
            lx: M.montante, ly: alturaEstante, lz: M.montante,
            cor: CORES.estrutura, clicavel: false
          });
        }

        /* --- cada prateleira: chapa + longarinas + posições --- */
        for (var pr = 0; pr < est.prateleiras.length; pr++) {
          var prat = est.prateleiras[pr];
          contagem.prateleiras++;
          var yNivel = M.peDireito + (pr + 1) * M.alturaNivel;

          pecas.push({
            tipo: 'prateleira', id: 'PRAT-' + rua.nome + '-' + est.nome + '-' + prat.nome,
            rotulo: prat.nome,
            x: xRua + M.profundidade / 2, y: yNivel, z: z + compEstante / 2,
            lx: M.profundidade, ly: M.prateleira, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* as duas longarinas da frente e do fundo */
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-F',
            x: xRua, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-T',
            x: xRua + M.profundidade, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* --- as posições: o que o usuário clica --- */
          for (var po = 0; po < prat.posicoes.length; po++) {
            var loc = prat.posicoes[po];
            contagem.posicoes++;
            var zPos = z + po * M.larguraPosicao + M.larguraPosicao / 2;
            var alturaCaixa = M.alturaNivel * 0.66;

            var peca = {
              tipo: 'posicao',
              id: lp(loc.codigo) || (rua.nome + '-' + est.nome + '-' + prat.nome + '-' + cima(loc.posicao)),
              codigo: lp(loc.codigo),
              rua: rua.nome, estante: est.nome,
              prateleira: prat.nome, posicao: cima(loc.posicao),
              x: xRua + M.profundidade / 2,
              y: yNivel + alturaCaixa / 2 + M.prateleira,
              z: zPos,
              lx: M.profundidade * 0.86,
              ly: alturaCaixa,
              lz: M.larguraPosicao * 0.88,
              cor: corDaPosicao(loc),
              situacao: situacaoDaPosicao(loc),
              capacidade: num(loc.capacidade),
              itens: num(loc.itens !== undefined ? loc.itens : loc.ocupacao),
              status: lp(loc.status),
              clicavel: true,
              dado: loc
            };
            pecas.push(peca);
            if (peca.codigo) indice[peca.codigo] = peca;
            maxY = Math.max(maxY, peca.y + peca.ly);
          }
        }

        maxY = Math.max(maxY, alturaEstante);
        z += compEstante + M.vaoEstantes;
      }

      /* a plaquinha da rua, no começo dela */
      pecas.push({
        tipo: 'placaRua', id: 'RUA-' + rua.nome, rotulo: rua.nome,
        x: xRua + M.profundidade / 2, y: 2.4, z: M.folgaPiso / 2,
        lx: 0.6, ly: 0.35, lz: 0.04, cor: CORES.faixa, clicavel: false
      });

      maxZ = Math.max(maxZ, z);
      x += larguraRua + M.corredor;
      maxX = Math.max(maxX, x);
    }

    /* o piso, dimensionado pelo que foi montado */
    var compX = Math.max(6, maxX - M.corredor + M.folgaPiso);
    var compZ = Math.max(6, maxZ + M.folgaPiso);
    pecas.unshift({
      tipo: 'piso', id: 'PISO',
      x: compX / 2, y: 0, z: compZ / 2,
      lx: compX, ly: 0.02, lz: compZ,
      cor: CORES.piso, clicavel: false
    });

    return {
      pecas: pecas,
      indice: indice,
      contagem: contagem,
      galpao: { largura: compX, profundidade: compZ, altura: Math.max(3, maxY + 0.8) },
      medidas: M,
      cores: CORES
    };
  }

  /* ----------------------------------------------------------
     RESUMO: os números do painel, calculados do mesmo dado que
     pinta as cores — para o texto nunca discordar da imagem.
     ---------------------------------------------------------- */
  function resumo(montagem) {
    var r = { total: 0, vazias: 0, ocupadas: 0, lotadas: 0, bloqueadas: 0, ocupacaoPct: 0 };
    if (!montagem || !montagem.pecas) return r;
    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo !== 'posicao') continue;
      r.total++;
      if (p.situacao === 'VAZIA') r.vazias++;
      else if (p.situacao === 'OCUPADA') r.ocupadas++;
      else if (p.situacao === 'LOTADA') r.lotadas++;
      else if (p.situacao === 'BLOQUEADA') r.bloqueadas++;
    }
    var usadas = r.ocupadas + r.lotadas;
    r.ocupacaoPct = r.total ? Math.round(usadas / r.total * 100) : 0;
    return r;
  }

  /* ============================================================
     ENQUADRAMENTO · 08/11, à noite

     A primeira vez que o galpão do Ismael apareceu na tela, ele
     apareceu minúsculo e fora de centro. A câmera mirava no meio
     de um galpão de 20×20 metros que NÃO existe: o cadastro de
     localizações dele tem uma estante. A mira era um palpite.

     Agora a conta sai do que foi realmente montado. É matemática
     pura — nenhuma linha de Babylon — justamente para poder ser
     provada sem placa de vídeo, com 2 posições e com 2.000.
     ============================================================ */

  /** a caixa que contém as peças. O piso fica de fora: ele é
      grande por definição e puxaria a câmera para longe. */
  function caixaDe(montagem, incluirPiso) {
    var pecas = (montagem && montagem.pecas) || [];
    var min = null, max = null;

    for (var i = 0; i < pecas.length; i++) {
      var p = pecas[i];
      if (!incluirPiso && p.tipo === 'piso') continue;
      if (typeof p.x !== 'number' || typeof p.y !== 'number' || typeof p.z !== 'number') continue;

      var hx = Math.abs(p.lx || 0) / 2,
          hy = Math.abs(p.ly || 0) / 2,
          hz = Math.abs(p.lz || 0) / 2;

      if (!min) {
        min = { x: p.x - hx, y: p.y - hy, z: p.z - hz };
        max = { x: p.x + hx, y: p.y + hy, z: p.z + hz };
        continue;
      }
      if (p.x - hx < min.x) min.x = p.x - hx;
      if (p.y - hy < min.y) min.y = p.y - hy;
      if (p.z - hz < min.z) min.z = p.z - hz;
      if (p.x + hx > max.x) max.x = p.x + hx;
      if (p.y + hy > max.y) max.y = p.y + hy;
      if (p.z + hz > max.z) max.z = p.z + hz;
    }

    if (!min) return { vazia: true, min: null, max: null,
                       centro: { x: 0, y: 0, z: 0 },
                       tamanho: { x: 0, y: 0, z: 0 } };

    return {
      vazia: false, min: min, max: max,
      centro: { x: (min.x + max.x) / 2, y: (min.y + max.y) / 2, z: (min.z + max.z) / 2 },
      tamanho: { x: max.x - min.x, y: max.y - min.y, z: max.z - min.z }
    };
  }

  /**
   * Onde a câmera deve mirar e a que distância, para caber tudo.
   *
   *   montagem  o que montar() devolveu
   *   opcoes    { fov, aspecto, folga, minimo, maximo, piso }
   *
   * Devolve { alvo:{x,y,z}, raio, caixa, vazio }.
   *
   * A distância sai da trigonometria do campo de visão, não de
   * um número escolhido no olho: metade da altura dividida pela
   * tangente de meio-fov é a distância em que aquela altura ocupa
   * a tela inteira. A largura entra dividida pela proporção da
   * tela, porque numa tela deitada quem aperta é a altura.
   */
  function enquadramento(montagem, opcoes) {
    opcoes = opcoes || {};
    var fov     = opcoes.fov > 0 ? opcoes.fov : 0.8;     /* o padrão do Babylon */
    var aspecto = opcoes.aspecto > 0 ? opcoes.aspecto : 1.6;
    var folga   = opcoes.folga > 0 ? opcoes.folga : 1.25;
    var minimo  = opcoes.minimo > 0 ? opcoes.minimo : 6;
    var maximo  = opcoes.maximo > 0 ? opcoes.maximo : 220;

    var cx = caixaDe(montagem, !!opcoes.piso);

    /* nada montado: mira no chão, perto. Não inventa galpão. */
    if (cx.vazia) {
      return { alvo: { x: 0, y: 1, z: 0 }, raio: minimo * 2, caixa: cx, vazio: true };
    }

    var meiaAltura = cx.tamanho.y / 2;
    var meiaLargura = Math.max(cx.tamanho.x, cx.tamanho.z) / 2;
    var t = Math.tan(fov / 2);

    var porAltura  = meiaAltura / t;
    var porLargura = meiaLargura / (t * aspecto);
    var raio = Math.max(porAltura, porLargura) * folga;

    /* uma estante sozinha é baixa e estreita: sem um mínimo, a
       câmera entraria dentro dela. */
    if (raio < minimo) raio = minimo;
    if (raio > maximo) raio = maximo;

    return {
      /* mira um pouco acima do meio: o olho procura a prateleira,
         não o pé da estante */
      alvo: { x: cx.centro.x, y: cx.centro.y + cx.tamanho.y * 0.08, z: cx.centro.z },
      raio: raio,
      caixa: cx,
      vazio: false
    };
  }

  /* ============================================================
     CONFERIR · o que está torto no cadastro de localizações

     Três regras que valem aqui e não se negociam:

       1. NADA é corrigido. Dado histórico não se mexe sozinho —
          é regra dele, e é a regra certa. Aqui só se mostra.
       2. Só se confere o que o Core DEVOLVEU. O mapa não lê a
          planilha e não inventa consulta que não existe. A
          varredura completa da ALMOXA_OCUPACAO é do lado de lá,
          no ENDERECO_CONFERIR.
       3. Linha torta aparece na tela. Hoje a linha sem rua é
          descartada em silêncio pelo organizar() — ela some do
          mapa e ninguém fica sabendo. Isso acaba aqui.
     ============================================================ */
  function conferir(locais) {
    var lista = Object.prototype.toString.call(locais) === '[object Array]' ? locais : [];
    var avisos = [];
    var vistos = {};        /* código -> quantas vezes */
    var prateleirasComPosicao = {};
    var usadasComoEndereco = [];

    function anotar(tipo, titulo, detalhe, linha) {
      avisos.push({ tipo: tipo, titulo: titulo, detalhe: detalhe, linha: linha });
    }

    for (var i = 0; i < lista.length; i++) {
      var l = lista[i] || {};
      var cod = lp(l.codigo);
      var rua = cima(l.rua), est = cima(l.estante),
          pra = cima(l.prateleira), pos = cima(l.posicao);

      /* 1 · sem rua, o organizar() joga fora sem dizer nada */
      if (!rua) {
        anotar('SUMIU',
          'Localização sem rua não aparece no mapa',
          'O desenho é organizado por rua. Sem ela, esta linha é ' +
          'descartada — e até agora isso acontecia em silêncio.',
          l);
        continue;
      }

      /* 2 · código repetido: duas posições disputando o mesmo QR */
      if (cod) {
        vistos[cod] = (vistos[cod] || 0) + 1;
        if (vistos[cod] === 2) {
          anotar('REPETIDO',
            'Código repetido: ' + cod,
            'Duas localizações com o mesmo código. O QR levaria a ' +
            'uma delas, e não há como saber a qual.',
            l);
        }
      } else {
        anotar('SEM_CODIGO',
          'Posição sem código',
          'Sem código não há etiqueta nem QR: ' +
          [rua, est, pra, pos].filter(Boolean).join(' · '),
          l);
      }

      /* 3 · o código não bate com os campos (desalinhamento) */
      if (cod && rua && est) {
        var partes = cod.split('-');
        if (partes.length >= 2 && cima(partes[0]) !== rua) {
          anotar('DESALINHADO',
            'O código não combina com a rua: ' + cod,
            'O código começa com "' + partes[0] + '" mas a linha diz ' +
            'que a rua é "' + rua + '". Um dos dois está errado — e eu ' +
            'não sei qual, então não mexo em nenhum.',
            l);
        }
      }

      /* 4 · prateleira e posição disputando o mesmo endereço */
      var chavePra = [rua, est, pra].join('|');
      if (pos) prateleirasComPosicao[chavePra] = true;
      else usadasComoEndereco.push({ chave: chavePra, linha: l, codigo: cod });
    }

    /* 5 · a prateleira virou endereço E tem posições embaixo dela.
       É o caso do A-A01-1 x A-A01-1-A: material guardado em dois
       níveis do mesmo lugar, e o saldo some entre eles. */
    for (var u = 0; u < usadasComoEndereco.length; u++) {
      var uu = usadasComoEndereco[u];
      if (prateleirasComPosicao[uu.chave]) {
        anotar('DOIS_NIVEIS',
          'Prateleira e posição são endereço ao mesmo tempo' +
            (uu.codigo ? ': ' + uu.codigo : ''),
          'Esta prateleira guarda material direto, mas também tem ' +
          'posições cadastradas dentro dela. Guardar nos dois níveis ' +
          'faz o saldo se perder entre eles. Confira no almoxarifado ' +
          'qual é o nível real antes de mudar qualquer coisa.',
          uu.linha);
      }
    }

    return {
      total: lista.length,
      avisos: avisos,
      quantos: avisos.length,
      porTipo: (function () {
        var c = {};
        for (var k = 0; k < avisos.length; k++) c[avisos[k].tipo] = (c[avisos[k].tipo] || 0) + 1;
        return c;
      })()
    };
  }

  /* ============================================================
     COMO SE CHAMAM AS DIVISÕES · decidido pelo Ismael em 08/11

       até 26 divisões  →  A, B, C … Z
       mais que isso    →  01, 02, 03 … NN

     A regra é por PRATELEIRA inteira, não por divisão. Uma
     prateleira de 30 não vira "A…Z, 27, 28, 29, 30": vira
     01…30, tudo igual. Metade com letra e metade com número é
     o tipo de coisa que ninguém lê certo no rádio às 7 da manhã.

     E isto aqui é definitivo na prática: depois que a etiqueta
     está colada na estante, mudar a numeração é reetiquetar o
     galpão inteiro. Por isso a conta mora aqui, com prova, e
     não espalhada dentro de uma tela.
     ============================================================ */
  var LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function nomesDePosicao(quantas) {
    var n = Math.floor(Number(quantas) || 0);
    if (n < 1) return [];
    var fora = [];
    if (n <= LETRAS.length) {
      for (var i = 0; i < n; i++) fora.push(LETRAS.charAt(i));
      return fora;
    }
    /* passou de 26: número em TODAS, com zero à esquerda para
       ordenar direito em qualquer lugar que ordene como texto */
    var casas = String(n).length;
    for (var k = 1; k <= n; k++) {
      var s = String(k);
      while (s.length < casas) s = '0' + s;
      fora.push(s);
    }
    return fora;
  }

  /* ============================================================
     PROJETAR · o que o construtor vai criar, antes de criar

     Recebe o que a pessoa digitou e devolve a LISTA de posições
     que sairiam disso — no mesmo formato que o Core devolve, de
     propósito: assim o mesmo montar() desenha o projeto e o
     galpão real, e o que ela vê na tela é o que vai ser gravado.

     Nada aqui grava. Nada aqui fala com o Core. É papel e lápis.
     ============================================================ */
  function projetar(pedido) {
    pedido = pedido || {};
    var rua  = cima(pedido.rua);
    var est  = cima(pedido.estante);
    var nPra = Math.floor(Number(pedido.prateleiras) || 0);
    var nPos = Math.floor(Number(pedido.divisoes) || 0);

    var erros = [];
    if (!rua) erros.push('Falta o nome da rua.');
    if (!est) erros.push('Falta o nome da estante.');
    if (nPra < 1) erros.push('A estante precisa de pelo menos uma prateleira.');
    if (nPos < 1) erros.push('A prateleira precisa de pelo menos uma divisão.');
    if (nPra > 20) erros.push('Mais de 20 prateleiras numa estante só: confira se não é outra estante.');
    if (nPos > 200) erros.push('Mais de 200 divisões numa prateleira só: confira a conta.');
    if (erros.length) return { ok: false, erros: erros, locais: [], contagem: { posicoes: 0 } };

    /* o primeiro nível de prateleira é o 1, como ele já usa */
    var primeira = Math.floor(Number(pedido.primeiraPrateleira) || 1);
    var nomes = nomesDePosicao(nPos);
    var locais = [];

    for (var p = 0; p < nPra; p++) {
      var nomePra = String(primeira + p);
      for (var d = 0; d < nPos; d++) {
        locais.push({
          rua: rua,
          estante: est,
          prateleira: nomePra,
          posicao: nomes[d],
          codigo: [rua, est, nomePra, nomes[d]].join('-'),
          /* um SKU por divisão — decisão dele, 08/11 */
          capacidade: 1,
          ocupacao: [],
          status: 'DISPONIVEL',
          /* marca de projeto: nada disto existe no Core ainda */
          __projeto: true
        });
      }
    }

    return {
      ok: true,
      erros: [],
      locais: locais,
      nomes: nomes,
      porLetra: nPos <= LETRAS.length,
      contagem: { prateleiras: nPra, divisoes: nPos, posicoes: locais.length },
      medidas: medidasDe(pedido)
    };
  }

  /** as medidas em metros, a partir do que foi digitado em cm */
  function medidasDe(pedido) {
    function cm(v, padrao) {
      var n = Number(v);
      return (isFinite(n) && n > 0) ? n / 100 : padrao;
    }
    return {
      larguraPosicao: cm(pedido && pedido.larguraCm, MEDIDAS.larguraPosicao),
      profundidade:   cm(pedido && pedido.profundidadeCm, MEDIDAS.profundidade),
      alturaNivel:    cm(pedido && pedido.alturaCm, MEDIDAS.alturaNivel)
    };
  }

  raiz.LAYOUT3D = {
    MEDIDAS: MEDIDAS,
    CORES: CORES,
    organizar: organizar,
    montar: montar,
    resumo: resumo,
    corDaPosicao: corDaPosicao,
    situacaoDaPosicao: situacaoDaPosicao,
    caixaDe: caixaDe,
    enquadramento: enquadramento,
    conferir: conferir,
    nomesDePosicao: nomesDePosicao,
    projetar: projetar
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = raiz.LAYOUT3D;

})(typeof window !== 'undefined' ? window : globalThis);

/* ===== adaptador.js ===== */
/* ============================================================
   ALMOXA 3D · adaptador.js  ·  08/11/2026
   ------------------------------------------------------------
   O ADAPTADOR MULTIAMBIENTE · seção 5 do adendo.

   Uma aplicação só, dois lugares para rodar:

     · servida pelo Apps Script (/exec) → google.script.run
     · servida pelo GitHub Pages       → HTTPS no /exec

   O resto do módulo 3D não sabe em qual dos dois está. Ele

   a regra de negócio não se duplica entre ambientes, que é o
   que a seção 5 pede.

   inventei endpoint nenhum:

       { ponte:'ALMOXA', chave:'', modulo, acao, payload,

   não é segredo — ela é endereço, e quem decide o que pode ser
   feito é o Core, do lado de lá. Identidade e permissão

   A CHAVE DE APLICATIVO · 08/11, à tarde

   Como o mapa passou a conseguir a chave, e o que foi recusado:

     RECUSADO · escrever a chave aqui no arquivo. Isto vai para
       um GitHub público. Seção 3 proíbe, e com razão.
     RECUSADO · mandar a chave no endereço (?chave=…). Ficaria
       na barra, no histórico do navegador e em todo link que
       alguém copiasse. Endereço é endereço; chave não é.
     RECUSADO · mexer no Core para ele parar de exigir chave.
       Afrouxar a tranca para a minha peça caber é o contrário
       de consertar.

     FEITO · o mapa é servido pelo MESMO endereço do sistema
       (biriguialmoxarifado-eng.github.io). Mesma origem quer
       dizer que o mapa pode perguntar ao próprio sistema qual
       é a chave que ele está usando AGORA — pelo window.parent
       quando está no quadro, e pelo armazenamento que o próprio
       ALMOX PRO já mantém quando está em tela cheia.

   A chave fica só na memória, enquanto a página está aberta.
   Este módulo NÃO cria depósito de chave, NÃO grava a chave em

   ============================================================ */
(function (raiz) {

    nome: 'API3D',
    versao: '08/11',

    chave: '',            /* SÓ na memória. Nunca escrita, nunca gravada. */
    origemDaChave: 'nenhuma (fase 1)',
    origemDaPorta: 'própria',

    ultima: null

  /* ----------------------------------------------------------
     ONDE ESTOU
     ------------------------------------------------------------

           navegador. Só leitura: este módulo nunca escreve aqui. */
    try {
      var g = String(localStorage.getItem('almoxa_app_chave_digitada') || '').trim();
      if (g) return { chave: g, origem: 'a que foi digitada neste navegador' };
    } catch (e) {}

    return { chave: '', origem: 'nenhuma (fase 1)' };

  /* ------------------------------------------------------------
     A PORTA DO SISTEMA

     Devolve a função de chamada do ALMOX PRO, quando o mapa está
     rodando dentro dele e no mesmo endereço. Devolve nada quando
     não está — e aí o mapa usa o caminho próprio, que é o de
     sempre e continua valendo para o Apps Script.

     Note que NÃO se copia sessão, perfil nem obra para cá. Não
     se lê token nenhum. Pede-se ao sistema que faça a chamada
     dele; o que trafega é o resultado.

  A.portaDoSistema = function () {

    try { if (window.parent && window.parent !== window) janelas.push(window.parent); } catch (e) {}
    try { if (window.opener) janelas.push(window.opener); } catch (e) {}

    for (var i = 0; i < janelas.length; i++) {
      try {
        var j = janelas[i];
        if (j && j.API && typeof j.API.call === 'function') {
          A.origemDaPorta = i === 0 ? 'o sistema, pelo quadro' : 'o sistema, pela aba de origem';
          return function (modulo, acao, payload) {
            return j.API.call(modulo, acao, payload);
          };

      } catch (e) { /* origem diferente: o navegador barra, e está certo */ }

  A.temPortaDoSistema = function () { return !!A.portaDoSistema(); };

  /** pega a chave do sistema e passa a usá-la. Devolve só se achou. */
  A.herdarChave = function () {

  function envelope(modulo, acao, payload) {
    return {
      ponte: 'ALMOXA',
      /* a chave vem do sistema, em tempo de execução. Vazia é
         fase 1 — e fase 1 não pode bloquear a comunicação. */
      chave: A.chave || '',

      acao: acao,
      payload: payload || {},

  /* ----------------------------------------------------------

     ---------------------------------------------------------- */

    opcoes = opcoes || {};
    var amb = A.ambiente();
    A.chamadas++;
    var comecou = Date.now();

    function fim(r) {
      A.ultima = { modulo: modulo, acao: acao, ambiente: amb,
                   ms: Date.now() - comecou, ok: !!(r && r.ok) };
      if (!r || !r.ok) A.falhas++;

    }

    /* ----------------------------------------------------------
       PELA PORTA DO SISTEMA · o jeito certo, e o primeiro a tentar

       Eu estava montando um envelope por fora e preenchendo campo
       por campo: chave, depois sessão, depois perfil, depois obra.
       Cada recusa do Core me fazia copiar mais um pedaço do
       sistema para cá. Isso é construir uma SEGUNDA porta de
       entrada — e a regra dele é clara: não duplicar
       autenticação, sessão, usuários nem permissões.

       O ALMOX PRO já tem uma porta que funciona, com a sessão do
       Ismael, o perfil, a obra, a chave e o prazo dele. O mapa é
       servido pelo mesmo endereço, então pode simplesmente BATER
       NAQUELA PORTA em vez de abrir uma ao lado.

       Assim não existe segunda sessão para ficar fora de sincronia,
       e quem continua decidendo tudo é o Core.
       ---------------------------------------------------------- */
    var doSistema = A.portaDoSistema();
    if (doSistema && !opcoes.semSistema) {
      return Promise.resolve()
        .then(function () { return doSistema(modulo, acao, payload || {}); })
        .then(function (r) { return fim(A.entender(r)); })
        .catch(function (e) {
          return fim({ ok: false, codigo: 'ERRO_SISTEMA',
            mensagem: 'A porta do sistema recusou: ' + ((e && e.message) || e) });
        });
    }

    if (amb === 'APPS_SCRIPT') {
      return new Promise(function (resolve) {
        var respondeu = false;
        var relogio = setTimeout(function () {
          if (respondeu) return;
          respondeu = true;
          resolve(fim({ ok: false, codigo: 'TEMPO',
            mensagem: 'O Core não respondeu em ' +
              Math.round((opcoes.tempoLimite || A.tempoLimite) / 1000) +
              ' segundos (' + modulo + '.' + acao + ').' }));
        }, opcoes.tempoLimite || A.tempoLimite);

        try {
          google.script.run
            .withSuccessHandler(function (t) {
              if (respondeu) return; respondeu = true; clearTimeout(relogio);
              resolve(fim(A.entender(t)));
            })
            .withFailureHandler(function (e) {
              if (respondeu) return; respondeu = true; clearTimeout(relogio);
              resolve(fim({ ok: false, codigo: 'ERRO_GAS',
                mensagem: (e && e.message) || 'o Apps Script recusou a chamada' }));
            })
            .APIX_atender_(JSON.stringify(envelope(modulo, acao, payload)));
        } catch (e) {
          respondeu = true; clearTimeout(relogio);
          resolve(fim({ ok: false, codigo: 'ERRO_GAS', mensagem: String(e && e.message) }));
        }
      });
    }

    /* fora do Apps Script: HTTPS no mesmo /exec */
    if (!A.url) {
      return Promise.resolve(fim({ ok: false, codigo: 'SEM_URL',
        mensagem: 'O endereço do Core não foi configurado. ' +
          'Chame API3D.configurar({ url: "...". }) antes de usar.' }));
    }

    var corta = null;
    var prazo = new Promise(function (resolve) {
      corta = setTimeout(function () {
        resolve(fim({ ok: false, codigo: 'TEMPO',
          mensagem: 'O Core não respondeu em ' +
            Math.round((opcoes.tempoLimite || A.tempoLimite) / 1000) + ' segundos.' }));
      }, opcoes.tempoLimite || A.tempoLimite);
    });

    var ida = fetch(A.url, {
      method: 'POST',
      /* text/plain evita o pedido de verificação prévia do CORS,
         que o Apps Script não responde. É o mesmo caminho que o
         ALMOX PRO já usa hoje no GitHub Pages. */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(envelope(modulo, acao, payload))
    }).then(function (res) {
      return res.text();
    }).then(function (txt) {
      clearTimeout(corta);
      return fim(A.entender(txt));
    }).catch(function (e) {
      clearTimeout(corta);
      return fim({ ok: false, codigo: 'REDE',
        mensagem: (e && e.message) || 'não consegui falar com o Core' });
    });

    return Promise.race([ida, prazo]);
  };

  /** a resposta pode vir como texto ou como objeto; entendo as duas */
  A.entender = function (t) {
    if (t === null || t === undefined) {
      return { ok: false, codigo: 'VAZIO', mensagem: 'o Core respondeu nada' };
    }
    if (typeof t === 'object') return t;
    try {
      var o = JSON.parse(t);
      return (o && typeof o === 'object') ? o
        : { ok: false, codigo: 'FORMATO', mensagem: 'resposta em formato inesperado' };
    } catch (e) {
      return { ok: false, codigo: 'FORMATO',
        mensagem: 'não entendi a resposta do Core',
        bruto: String(t).slice(0, 300) };
    }
  };

  /* ----------------------------------------------------------
     OS PEDIDOS QUE O 3D FAZ
     ------------------------------------------------------------
     Só ações que eu confirmei existirem no Core em 08/11, lendo
     o código do AP_Modulo_locais. Não invento ação.
     ---------------------------------------------------------- */
  A.localizacoes = function () { return A.chamar('locais', 'listar'); };
  A.semLocalizacao = function () { return A.chamar('locais', 'semLocalizacao'); };

  /* ------------------------------------------------------------
     [12/11] VINCULAR ESTAVA APAGANDO O ENDEREÇO

     Eu mandava { sku, codigo }. A rota lê { sku, localId } e
     grava assim:

         item.localId = p.localId || null;
         item.localizacao = local ? localTexto(local) : "";

     Com "codigo" no lugar de "localId", o localId chegava
     indefinido, virava null — e a rota respondia ok:true tendo
     APAGADO o endereço do item. Falha que responde "deu certo" é
     pior do que falha que responde erro.

     Agora: só localId, e vazio é RECUSADO aqui mesmo. Desfazer o
     vínculo passou a ter função própria, para nunca acontecer
     por descuido.

     O código ("A-A01-1-B") não vira localId por adivinhação: quem
     tem a lista de locais é o app, e é lá que a tradução é feita.
     ------------------------------------------------------------ */
  A.vincular = function (sku, localId) {
    var s = String(sku || '').trim();
    var l = String(localId || '').trim();
    if (!s) {
      return Promise.resolve({ ok: false, codigo: 'SEM_SKU',
        mensagem: 'Vincular sem o código do item não é possível.' });
    }
    if (!l) {
      return Promise.resolve({ ok: false, codigo: 'SEM_LOCAL',
        mensagem: 'Vincular sem o identificador da localização apagaria o ' +
          'endereço do item. Se a intenção é tirar o item do endereço, ' +
          'use API3D.desvincular(sku).' });

    return A.chamar('locais', 'vincular', { sku: s, localId: l });
  };

  /** tirar o item do endereço — de propósito, nunca por descuido */
  A.desvincular = function (sku) {
    var s = String(sku || '').trim();
    if (!s) {
      return Promise.resolve({ ok: false, codigo: 'SEM_SKU',
        mensagem: 'Desvincular sem o código do item não é possível.' });
    }
    return A.chamar('locais', 'vincular', { sku: s, localId: null });
  };

  /* ------------------------------------------------------------
     [12/11] estoque.item LÊ "id", NÃO "sku"

     A rota procura por x.id === p.id, x.codigo === p.id ou
     x.sku === p.id. Mandando { sku } o p.id ficava indefinido e
     a resposta era sempre ITEM_NAO_ENCONTRADO.

     Mando os dois nomes: id é o que esta rota lê, sku é o nome
     do campo. Nenhum dos dois é inventado.
     ------------------------------------------------------------ */
  A.item = function (sku) {
    return A.chamar('itens', 'obter', { id: sku, sku: sku });
  };
  A.estoqueDoItem = function (sku) {
    return A.chamar('estoque', 'item', { id: sku, sku: sku });
  };

  /* ------------------------------------------------------------
     [12/11] criarFaixa SAIU

     Eu oferecia A.criarFaixa('locais','criarFaixa'). Fui procurar
     essa ação no sistema e ela não existe: nem nas chamadas do
     HTML, nem na camada de simulação. Ninguém chamava, e oferecer
     uma porta que não abre só faz alguém bater nela um dia.

     As ações de locais que eu CONFIRMEI: listar, salvar, excluir,
     vincular, semLocalizacao. Criar faixa de endereços, quando a
     gente for fazer, sai de locais.salvar em sequência — ou de
     uma ação nova que o Core precise ganhar, e aí eu peço antes.
     ------------------------------------------------------------ */

  raiz.API3D = A;
  if (typeof module !== 'undefined' && module.exports) module.exports = A;
