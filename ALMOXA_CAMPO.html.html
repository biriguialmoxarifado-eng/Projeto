  var saida = [];

  function um(k){
    if(k >= MODULOS_PARA_TESTAR.length) return Promise.resolve();
    var t = MODULOS_PARA_TESTAR[k];
    return api(t.m, t.a, t.p).then(function(r){
      saida.push({t:t, j:julgarResposta(r), bruto:r});
      return um(k+1);
    }, function(e){
      saida.push({t:t, j:{estado:"mudo", texto:String(e&&e.message||e)}, bruto:null});
      return um(k+1);
    });
  }

  um(0).then(function(){
    var faltando = saida.filter(function(x){ return x.j.estado==="falta"; });
    var porta = saida.filter(function(x){ return x.j.estado==="porta" || x.j.estado==="mudo"; });
    var chave = saida.filter(function(x){ return x.j.estado==="chave"; });
    var ocr = saida.filter(function(x){ return x.t.m==="ocr"; })[0];

    pintar(
      '<div class="cartao">'+
        '<h2>O que o servidor atende</h2>'+
        '<p class="ajuda">Cada linha é uma pergunta de leitura ao seu Apps Script. '+
        'Nenhuma grava nada.</p>'+

        (porta.length
          ? '<div class="aviso vermelho"><b>A porta não está respondendo</b>'+
            'Não adianta olhar módulo por módulo enquanto isto não resolve: '+
            esc(porta[0].j.texto)+'</div>'
          : chave.length
          ? '<div class="aviso vermelho"><b>A porta responde, mas recusa por chave</b>'+
            'Ler passa e gravar não — é isto que faz a nota "ler e não salvar". '+
            'Confira a chave do aplicativo na tela de conexão.</div>'
          : ocr && ocr.j.estado==="falta"
          ? '<div class="aviso vermelho"><b>Achei: o módulo <span class="mono">ocr</span> '+
            'não está no servidor</b>É ele que lê a nota por foto. Sem ele, nem o '+
            'celular nem o computador reconhecem a nota — e é o mesmo sintoma nos dois, '+
            'que foi o que você notou. '+
            '<br><br>O <b>XML</b> continua funcionando, porque o XML é lido aqui no '+
            'aparelho e não passa por esse módulo.</div>'
          : faltando.length
          ? '<div class="aviso amarelo"><b>'+faltando.length+' módulo(s) o servidor não conhece</b>'+
            'Eles estão marcados abaixo. Cada um precisa estar no mapa do '+
            '<span class="mono">almoxaApi</span> e a implantação precisa ser republicada.</div>'
          : '<div class="aviso verde"><b>Todos os módulos responderam</b>'+
            'Se a nota ainda não lê, o problema está dentro do módulo '+
            '<span class="mono">ocr</span>, não na conexão.</div>')+

        saida.map(function(x){
          var cor = x.j.estado==="ok" ? "sim" : "nao";
          return '<div class="id-linha">'+
            '<div class="id-esq">'+
              '<b class="small mono">'+esc(x.t.m)+'.'+esc(x.t.a)+'</b>'+
              '<div class="id-estado '+cor+'"><span class="id-bola"></span>'+
              esc(x.j.texto)+'</div>'+
              '<div class="pequeno">serve para '+esc(x.t.para)+'</div>'+
            '</div></div>';
        }).join("")+

        '<div class="aviso cinza"><b>O que fazer com isto</b>'+
        'Módulo marcado em vermelho com "não conhece" precisa de duas coisas no '+
        'Apps Script: estar no mapa de módulos do <span class="mono">almoxaApi</span>, '+
        'e a implantação ser <b>republicada</b> depois. Rodar a função no editor '+
        'não publica.</div>'+

        '<button class="bt vazio" id="mdCopiar">Copiar este diagnóstico</button>'+
      '</div>');

    var bc = document.getElementById("mdCopiar");
    if(bc) bc.addEventListener("click", function(){
      var txt = "ALMOXA CAMPO "+VERSAO+" — diagnostico de modulos\n"+
        saida.map(function(x){
          return x.t.m+"."+x.t.a+": "+x.j.estado+" — "+x.j.texto;
        }).join("\n");
      try{
        navigator.clipboard.writeText(txt);
        bc.textContent = "Copiado — cole na conversa";
      }catch(e){
        bc.textContent = "Não consegui copiar";
      }
    });
  });
};

/* ============================================================
 * TELA — LANÇAR NOTA FISCAL PELO CELULAR
 * ------------------------------------------------------------
 * CONTRATOS: todos já existem no computador. Nenhum inventado.
 *
 *   XML da NF-e  → lido AQUI no aparelho, sem servidor nenhum.
 *                  O computador faz igual: regex sobre <det>, nNF,
 *                  vUnCom. É exato, é leve e funciona com 4G ruim.
 *   PDF / foto   → ocr.ler {paginas:[{nome,tipo,tamanho,base64}]}
 *   item novo    → itens.salvar {...confirmadoNovo:true} → {sku}
 *   entrada      → estoque.entrada {sku,qtd,documento,valorUnitario}
 *   já lançada?  → nf.obter {numero}
 *
 * POR QUE O XML VEM PRIMEIRO NA TELA
 * A foto de uma DANFE pelo celular são alguns MB de base64 subindo
 * por 4G, com 120 s de prazo. Às vezes não chega. O XML são alguns
 * KB, é lido no próprio aparelho e sai EXATO — não tem leitura
 * errada de letra miúda. Quando existe XML, usar foto é escolher o
 * caminho pior. Por isso ele é o primeiro botão e diz isso.
 *
 * O QUE ESTA TELA NÃO FAZ
 *  · não descarta linha calada: o que o leitor devolveu aparece,
 *    e o que entra no estoque é o que está marcado na conferência;
 *  · não lança nota repetida sem avisar: pergunta ao servidor pelo
 *    número antes;
 *  · não diz "lançado" sem o servidor ter confirmado item a item;
 *  · não guarda nota em banco próprio: grava nas ações de sempre.
 * ============================================================ */
TELAS.nota = function(){
  document.getElementById("subTopo").textContent = "nota fiscal";
  var N = CAMPO.nota;
  if(!N) return escolher();
  if(N.lancando) return;
  conferir();

  function escolher(){
    pintar(
      '<div class="cartao">'+
        '<h2>De onde vem a nota</h2>'+
        '<div class="aviso azul"><b>Se você tem o XML, use o XML.</b>'+
        'Ele é lido aqui mesmo no aparelho, sai exato e não depende da '+
        'internet aguentar a foto. A foto é o caminho de quando não há XML.</div>'+
        '<input type="file" id="nfArq" accept=".xml,application/xml,text/xml,application/pdf,image/*" hidden>'+
        '<input type="file" id="nfCam" accept="image/*" capture="environment" hidden multiple>'+
        '<button class="bt verde" id="nfEscolher">Escolher XML ou PDF</button>'+
        '<button class="bt vazio" id="nfFoto">Fotografar a nota</button>'+
        '<button class="bt vazio" id="nfMao">Digitar a nota à mão</button>'+
        '<p class="pequeno">Quando a foto não lê — e às vezes não lê mesmo — '+
        'digitar é o caminho. A nota digitada passa pela mesma conferência e '+
        'entra no estoque pela mesma porta das outras.</p>'+
        '<div id="nfAviso"></div>'+
      '</div>');
    var arq = document.getElementById("nfArq");
    var cam = document.getElementById("nfCam");
    document.getElementById("nfEscolher").addEventListener("click", function(){ arq.click(); });
    document.getElementById("nfFoto").addEventListener("click", function(){
      if(!camTemPonte_()){ cam.click(); return; }
      var av = document.getElementById("nfAviso");
      if(av) av.innerHTML = '<div class="aviso cinza">Abrindo a câmera do aparelho…</div>';
      camFotoPronta({maxLargura:1600, qualidade:80}).then(function(f){
        receberFotos_([{nome:"nota-"+Date.now()+".jpg", tipo:"image/jpeg",
          tamanho:(f.bytes||0), dataURL:f.base64}]);
      }, function(e){
        if(av) av.innerHTML = '<div class="aviso amarelo"><b>A câmera do aplicativo não deu</b>'+
          esc(String(e&&e.message||e))+'<br>Vou abrir a câmera do aparelho pelo caminho antigo.</div>';
        cam.click();
      });
    });
    document.getElementById("nfMao").addEventListener("click", function(){
      CAMPO.nota = {
        origem: "MANUAL",
        campos: {numero:"", serie:"", chave:"", cnpj:"", fornecedor:"",
          emissao:"", valor:""},
        itens: [], paginas: [], lancando: false
      };
      ir("nota");
    });
    arq.addEventListener("change", function(){ receber(arq.files); });
    cam.addEventListener("change", function(){ receber(cam.files); });
  }

  function receberFotos_(prontas){
    if(!prontas || !prontas.length) return;
    terminar(prontas);
  }

  function receber(arquivos){
    var lista = Array.prototype.slice.call(arquivos || []);
    if(!lista.length) return;
    var aviso = document.getElementById("nfAviso");
    if(aviso) aviso.innerHTML = '<div class="aviso cinza">Lendo o arquivo…</div>';
    var prontos = [];
    function um(k){
      if(k >= lista.length) return terminar(prontos);
      var f = lista[k];
      var fr = new FileReader();
      fr.onload = function(){
        prontos.push({nome: f.name, tipo: f.type || "", tamanho: f.size,
          dataURL: String(fr.result||"")});
        um(k+1);
      };
      fr.onerror = function(){ um(k+1); };
      fr.readAsDataURL(f);
    }
    um(0);
  }

  function terminar(arqs){
    if(!arqs.length) return;
    var ehXml = arqs.length===1 &&
      (/xml/i.test(arqs[0].tipo) || /\.xml$/i.test(arqs[0].nome));
    if(ehXml) return lerXmlAqui(arqs[0]);
    return lerPeloServidor(arqs);
  }

  /* ============================================================
     [campo 19] A LEITURA DO XML, COMPLETA — §5.1 do pedido
     ------------------------------------------------------------
     O que mudou em relação ao campo 16:

       · <det> é lido pelo nItem, e NUNCA por posição na lista. Um
         <det> fora de ordem não troca de produto.
       · emitente e destinatário são separados de verdade: antes eu
         pegava o PRIMEIRO <CNPJ> do arquivo e o PRIMEIRO <xNome>,
         que em muitas notas é o destinatário. Agora cada um sai de
         dentro do seu próprio bloco.
       · entram NCM, CEST, CFOP, CST/CSOSN, EAN, frete, desconto,
         seguro, outras despesas, ICMS, IPI, PIS, COFINS e o total.
       · os números brasileiros do XML já vêm com ponto decimal —
         mas o arquivo pode vir com vírgula, e eu trato os dois.
       · a estrutura é VALIDADA antes de aceitar: sem infNFe e sem
         <det> não é NF-e, e eu digo o que faltou.

     Nenhum campo é inventado. O que não existir no arquivo fica
     vazio, e a conferência mostra como vazio.
     ============================================================ */
  function numBR(v){
    var t = lim(v);
    if(!t) return 0;
    /* 1.234,56 (brasileiro) vira 1234.56; 1234.56 fica como está */
    if(/,/.test(t)) t = t.replace(/\./g,"").replace(",",".");
    var n = Number(t);
    return isFinite(n) ? n : 0;
  }

  function dentroDe(texto, tag){
    var m = texto.match(new RegExp("<"+tag+"\\b[^>]*>([\\s\\S]*?)<\\/"+tag+">"));
    return m ? m[1] : "";
  }
  function campoDe(bloco, tag){
    if(!bloco) return "";
    var m = bloco.match(new RegExp("<"+tag+"\\b[^>]*>([^<]*)<\\/"+tag+">"));
    return m ? lim(m[1]) : "";
  }

  function lerNFe(texto){
    var inf = dentroDe(texto, "infNFe");
    if(!inf) return {ok:false, porque:"não achei o bloco <infNFe>: este arquivo não é uma NF-e."};

    var emit = dentroDe(inf, "emit");
    var dest = dentroDe(inf, "dest");
    var ide  = dentroDe(inf, "ide");
    var total = dentroDe(inf, "total");
    var icmsTot = dentroDe(total, "ICMSTot");
    var transp = dentroDe(inf, "transp");

    var blocos = inf.match(/<det\b[^>]*>[\s\S]*?<\/det>/g) || [];
    if(!blocos.length) return {ok:false, porque:"o arquivo tem <infNFe> mas nenhum <det>: "+
      "não há produto nenhum para lançar."};

    var itens = blocos.map(function(b){
      var prod = dentroDe(b, "prod");
      var imposto = dentroDe(b, "imposto");
      /* o numero do item vem do ATRIBUTO nItem, nao da posicao */
      var nItem = (b.match(/<det\b[^>]*nItem="(\d+)"/) || [])[1] || "";
      var q = numBR(campoDe(prod,"qCom"));
      var v = numBR(campoDe(prod,"vUnCom"));
      var t = numBR(campoDe(prod,"vProd"));
      var ean = campoDe(prod,"cEAN");
      return {
        nItem: nItem,
        codigo: campoDe(prod,"cProd"),
        descricao: campoDe(prod,"xProd"),
        unidade: lim(campoDe(prod,"uCom") || campoDe(prod,"uTrib") || "un").toLowerCase(),
        ncm: campoDe(prod,"NCM"),
        cest: campoDe(prod,"CEST"),
        cfop: campoDe(prod,"CFOP"),
        cst: campoDe(imposto,"CST") || campoDe(imposto,"CSOSN"),
        codigoBarras: (ean && ean.toUpperCase() !== "SEM GTIN") ? ean : "",
        qtd: q, valorUnitario: v,
        /* vProd do arquivo manda; so calculo quando ele nao existe */
        valorTotal: t || Math.round(q*v*100)/100,
        totalVeioDoArquivo: !!t,
        desconto: numBR(campoDe(prod,"vDesc")),
        frete: numBR(campoDe(prod,"vFrete")),
        seguro: numBR(campoDe(prod,"vSeg")),
        outras: numBR(campoDe(prod,"vOutro")),
        icms: numBR(campoDe(dentroDe(imposto,"ICMS"),"vICMS")),
        ipi: numBR(campoDe(dentroDe(imposto,"IPI"),"vIPI")),
        sku: null, usar: true, pagina: 1
      };
    });

    var chave = (texto.match(/Id="NFe(\d{44})"/) || [])[1] ||
                campoDe(dentroDe(texto,"protNFe"), "chNFe") || "";
    var emissao = campoDe(ide,"dhEmi") || campoDe(ide,"dEmi");

    return {
      ok:true,
      campos: {
        numero: campoDe(ide,"nNF"),
        serie: campoDe(ide,"serie"),
        chave: chave,
        emissao: emissao ? emissao.slice(0,10).split("-").reverse().join("/") : "",
        entrada: (function(){ var d = campoDe(ide,"dhSaiEnt")||campoDe(ide,"dSaiEnt");
          return d ? d.slice(0,10).split("-").reverse().join("/") : ""; })(),
        naturezaOperacao: campoDe(ide,"natOp"),
        /* EMITENTE = fornecedor. Sai de dentro de <emit>, nunca do
           primeiro CNPJ do arquivo — esse costuma ser o destinatario. */
        fornecedor: campoDe(emit,"xNome"),
        fantasia: campoDe(emit,"xFant"),
        cnpj: campoDe(emit,"CNPJ") || campoDe(emit,"CPF"),
        ie: campoDe(emit,"IE"),
        uf: campoDe(dentroDe(emit,"enderEmit"),"UF"),
        municipio: campoDe(dentroDe(emit,"enderEmit"),"xMun"),
        destinatario: campoDe(dest,"xNome"),
        cnpjDestinatario: campoDe(dest,"CNPJ") || campoDe(dest,"CPF"),
        transportador: campoDe(dentroDe(transp,"transporta"),"xNome"),
        valor: campoDe(icmsTot,"vNF"),
        valorProdutos: campoDe(icmsTot,"vProd"),
        valorFrete: campoDe(icmsTot,"vFrete"),
        valorDesconto: campoDe(icmsTot,"vDesc"),
        valorSeguro: campoDe(icmsTot,"vSeg"),
        valorOutras: campoDe(icmsTot,"vOutro"),
        valorIcms: campoDe(icmsTot,"vICMS"),
        valorIpi: campoDe(icmsTot,"vIPI"),
        valorPis: campoDe(icmsTot,"vPIS"),
        valorCofins: campoDe(icmsTot,"vCOFINS")
      },
      itens: itens
    };
  }

  /* ---------- XML: lido no aparelho, do mesmo jeito do computador ---------- */
  function lerXmlAqui(arq){
    var aviso = document.getElementById("nfAviso");
    var texto = "";
    try{
      var b64 = String(arq.dataURL).split(",")[1] || "";
      texto = decodeURIComponent(escape(atob(b64)));
    }catch(e){ texto = ""; }

    var lido = lerNFe(texto);
    if(!lido.ok){
      if(aviso) aviso.innerHTML = '<div class="aviso vermelho"><b>Não consegui ler este XML</b>'+
        esc(lido.porque)+'<br>Confira se é o XML da nota, e não o recibo de entrega.</div>';
      return;
    }
    CAMPO.nota = {
      origem: "XML",
      campos: lido.campos,
      itens: lido.itens,
      paginas: [], lancando: false
    };
    ir("nota");
  }

  /* ============================================================
     [campo 21] O REGISTRO DE PÁGINA  ·  §5 do pedido
     ------------------------------------------------------------
     Uma página existe porque foi IMPORTADA, não porque alguém
     reconheceu produto nela. Cada documento que entra vira um
     registro com identificador próprio, e cada item passa a
     apontar para esse identificador.

     Isto é o que faz a folha que falhou continuar na tela — é
     justamente ela que precisa ser olhada e reprocessada.
     ============================================================ */
  function novaPagina(arq, indice){
    return {
      id: "P" + (indice+1) + "-" + Date.now().toString(36) +
          Math.random().toString(36).slice(2,6),
      nome: lim(arq && arq.nome) || ("página " + (indice+1)),
      indiceEntrada: indice,          /* a ordem em que o arquivo chegou */
      numero: indice + 1,             /* o número lógico, que ele pode corrigir */
      tipo: lim(arq && arq.tipo) || "",
      dataURL: lim(arq && arq.dataURL),
      estado: "aguardando",           /* aguardando | lida | sem_itens | falhou */
      itensEncontrados: 0,
      aviso: "",
      etapa: ""
    };
  }

  /* quantos itens cada página rendeu, contados AGORA e não guardados
     em dois lugares — contagem duplicada é contagem que diverge */
  /* [campo 21] ESTAS DUAS OLHAM CAMPO.nota, NAO O "N" DE CIMA.
     O N e capturado no topo de TELAS.nota e e null enquanto a nota
     ainda nao existe — e e exatamente nesse momento que a leitura
     por foto termina e precisa contar as paginas. */
  function contarPorPagina(){
    var nota = CAMPO.nota || {};
    var porId = {};
    (nota.paginas||[]).forEach(function(p){ porId[p.id] = 0; });
    (nota.itens||[]).forEach(function(i){
      if(i.paginaId && porId[i.paginaId] !== undefined) porId[i.paginaId]++;
    });
    (nota.paginas||[]).forEach(function(p){
      p.itensEncontrados = porId[p.id] || 0;
      if(p.estado === "lida" && !p.itensEncontrados) p.estado = "sem_itens";
    });
    return porId;
  }

  function paginaPorNumero(n){
    var nota = CAMPO.nota || {};
    return (nota.paginas||[]).filter(function(p){
      return p.numero === Number(n); })[0] || null;
  }

  /* ---------- foto / PDF: o mesmo ocr.ler do computador ---------- */
  function lerPeloServidor(arqs, N0){
    N0 = N0 || {};
    var aviso = document.getElementById("nfAviso");
    var kb = Math.round(arqs.reduce(function(t,a){ return t + (a.tamanho||0); },0)/1024);
    if(aviso) aviso.innerHTML = '<div class="aviso cinza"><b>Mandando '+arqs.length+
      ' página(s) ao leitor…</b>São '+kb+' KB subindo. Em internet fraca isto demora '+
      'ou não chega — se falhar, eu digo que falhou em vez de mostrar nota vazia.</div>';

    api("ocr","ler",{paginas: arqs.map(function(a){
      return {nome:a.nome, tipo:a.tipo, tamanho:a.tamanho,
        base64: String(a.dataURL||"").split(",")[1] || ""};
    })}).then(function(r){
      var d = r && r.dados;
      if(!r || !r.ok || !d){
        var faltaOModulo = semModuloIdentidade(r);
        if(aviso) aviso.innerHTML = '<div class="aviso vermelho"><b>'+
          (faltaOModulo
            ? 'O servidor não conhece o módulo <span class="mono">ocr</span>'
            : 'O leitor não respondeu')+'</b>'+
          esc(lim(r && r.mensagem) || "sem mensagem do servidor")+
          (faltaOModulo
            ? '<br><br>É esse módulo que lê a nota por foto — e é por isso que o '+
              'computador falha do mesmo jeito. O <b>XML funciona</b> mesmo assim, '+
              'porque é lido aqui no aparelho.'
            : '<br>Nada foi lançado. Se houver o XML da nota, ele é o caminho mais seguro.')+
          '<button class="bt vazio pequeno" id="nfVerModulos" style="margin-top:8px">'+
          'Ver o que o servidor atende</button></div>';
        var bvm = document.getElementById("nfVerModulos");
        if(bvm) bvm.addEventListener("click", function(){ ir("modulos"); });
        return;
      }
      /* [campo 21] AS PÁGINAS NASCEM DOS ARQUIVOS, sempre.
         Antes a nota só era criada quando havia item, e a folha que
         falhou sumia da tela — justamente a que precisava ser olhada. */
      var paginas = (N0.paginas && N0.paginas.length)
        ? N0.paginas
        : arqs.map(function(a, k){ return novaPagina(a, k); });

      /* [campo 21] UM ARQUIVO PODE TER VÁRIAS PÁGINAS.
         Um PDF de três folhas é UM arquivo. Se o leitor diz que há
         item na página 3, essa página existe — e tem de aparecer no
         seletor, mesmo vindo de dentro do mesmo arquivo. Crio o
         registro que falta e digo de qual arquivo ele saiu, em vez
         de jogar o item na primeira página e fingir que é dela. */
      (function(){
        var maior = 0;
        comoListaCore(d.itens).forEach(function(i){
          var n = Number(i.pagina) || 1;
          if(n > maior) maior = n;
        });
        var doServidor = Number(d.paginas) || 0;
        if(doServidor > maior) maior = doServidor;
        while(paginas.length < maior){
          var k = paginas.length;
          var dona = arqs.length === 1 ? arqs[0] : null;
          var nova = novaPagina(dona, k);
          nova.nome = dona
            ? lim(dona.nome) + " · página " + (k+1)
            : "página " + (k+1);
          /* a imagem do arquivo inteiro não é a imagem DESTA folha;
             guardar ela aqui mostraria a folha errada na conferência */
          if(dona && /pdf/i.test(lim(dona.tipo))) nova.dataURL = "";
          nova.veioDeDentroDoArquivo = !!dona;
          paginas.push(nova);
        }
      })();

      var itens = comoListaCore(d.itens).map(function(i){
        var num = Number(i.pagina) || 1;
        /* o item aponta para o ID da página, não para um número solto.
           Reordenar as folhas depois não embaralha mais nada. */
        var p = paginas.filter(function(x){ return x.numero === num; })[0] || paginas[0];
        return {
          /* identificação estável dentro desta leitura — §8 */
          lid: lim(i.id) || ("I" + Math.random().toString(36).slice(2,9)),
          codigo: lim(i.codigo||i.produto), descricao: lim(i.descricao),
          unidade: lim(i.unidade||"un").toLowerCase(),
          ncm: lim(i.ncm), cfop: lim(i.cfop), cst: lim(i.cst),
          qtd: Number(i.qtd||i.quantidade||0),
          valorUnitario: Number(i.valorUnitario||0),
          valorTotal: Number(i.valorTotal||0),
          sku: lim(i.sku)||null, usar: true,
          pagina: p ? p.numero : num,
          paginaId: p ? p.id : null,
          duvida: !lim(i.descricao) || !Number(i.qtd||i.quantidade||0) ||
                  !Number(i.valorUnitario||0)
        };
      });

      /* o servidor PODE mandar metadados por página (§8). Se mandar,
         eu uso; se não mandar, eu não invento — fica o que o
         aplicativo conseguiu saber sozinho. */
      var metaDoServidor = d.porPagina && (d.porPagina.lista || d.porPagina);
      paginas.forEach(function(p, k){
        var m = Array.isArray(metaDoServidor) ? metaDoServidor[k] : null;
        p.estado = "lida";
        p.etapa = lim(d.etapa) || lim(m && m.etapa) || "";
        if(m){
          if(lim(m.erro)) { p.estado = "falhou"; p.aviso = lim(m.erro); }
        }
      });

      /* [campo 21] §7 — QUAL ETAPA FALHOU.
         "O leitor respondeu, mas não achou item nenhum" não deixa
         saber se o OCR não extraiu texto ou se extraiu e o parser
         não soube interpretar. São problemas em arquivos
         diferentes, e o conserto de cada um é em lugar diferente.
         O que eu sei dizer, eu digo; o que o servidor não contou,
         eu declaro como não informado em vez de deduzir. */
      var texto = lim(d.textoOcr || d.texto);
      var quantoTexto = Number(d.caracteresLidos) || texto.length || 0;
      var temCabecalho = !!(d.campos && Object.keys(d.campos).filter(function(k){
        return lim(d.campos[k]); }).length);

      if(!itens.length){
        var etapa, explica, oQueFazer;
        if(!quantoTexto && !lim(d.textoOcr) && d.textoOcr === undefined){
          etapa = "o servidor não informou quanto texto leu";
          explica = "Não consigo dizer se o problema foi na leitura da imagem ou na "+
            "interpretação dela — o módulo <span class=\"mono\">ocr</span> não "+
            "devolveu essa informação.";
          oQueFazer = "Para separar os dois, o módulo precisa devolver "+
            "<span class=\"mono\">textoOcr</span> junto com os itens.";
        } else if(!quantoTexto){
          etapa = "o OCR não extraiu texto nenhum";
          explica = "A imagem chegou ao leitor e voltou sem uma letra. Isso é falha "+
            "de LEITURA, não de interpretação: foto fora de foco, muito escura, "+
            "muito pequena ou tremida.";
          oQueFazer = "Tire outra foto mais perto da tabela de produtos, com a folha "+
            "plana e boa luz — ou use o XML, que não depende de foto.";
        } else if(temCabecalho){
          etapa = "o cabeçalho foi reconhecido, a tabela de produtos não";
          explica = "O leitor leu <b>"+quantoTexto+" caracteres</b> e achou os dados da "+
            "nota, mas não conseguiu transformar as linhas em produtos. Isso é falha de "+
            "INTERPRETAÇÃO, não de leitura — está no parser do módulo "+
            "<span class=\"mono\">ocr</span>, não na sua foto.";
          oQueFazer = "Tirar outra foto provavelmente não resolve. Dá para digitar a "+
            "nota à mão agora, e o parser ser corrigido depois.";
        } else {
          etapa = "o OCR leu texto, mas nada virou produto";
          explica = "O leitor devolveu <b>"+quantoTexto+" caracteres</b> e nenhuma linha "+
            "virou item. Falha de INTERPRETAÇÃO, não de leitura.";
          oQueFazer = "Digitar a nota à mão resolve agora. O parser precisa ser "+
            "corrigido para resolver de vez.";
        }
        if(aviso) aviso.innerHTML = '<div class="aviso amarelo">'+
          '<b>Nenhum produto foi reconhecido — '+etapa+'</b>'+
          explica+'<br><br>'+oQueFazer+
          '<br><br><b>Nada foi lançado.</b> As '+paginas.length+' folha(s) ficam '+
          'guardadas para você olhar e mandar ler de novo.'+
          '<div class="fl" style="gap:6px;margin-top:8px;flex-wrap:wrap">'+
          '<button class="bt vazio pequeno" id="nfVerFolhas">Ver as folhas</button>'+
          '<button class="bt vazio pequeno" id="nfIrMao">Digitar à mão</button>'+
          '</div></div>';
      }

      CAMPO.nota = {
        origem: "OCR",
        campos: (d.campos||{}),
        itens: itens,
        paginas: paginas,
        /* o que o servidor contou sobre a leitura, sem enfeite */
        diagnostico: {
          etapa: lim(d.etapa),
          textoLido: Number(d.caracteresLidos || (lim(d.textoOcr).length)) || 0,
          avisos: Array.isArray(d.avisos) ? d.avisos : [],
          servico: lim(d.servico)
        },
        lancando: false
      };
      contarPorPagina();

      /* sem item nenhum eu NÃO empurro para a conferência: a folha
         fica aqui, com a explicação e os dois caminhos. Mas a nota
         existe, e os botões levam a ela. */
      if(!itens.length){
        var bvf = document.getElementById("nfVerFolhas");
        if(bvf) bvf.addEventListener("click", function(){ ir("nota"); });
        var bim = document.getElementById("nfIrMao");
        if(bim) bim.addEventListener("click", function(){
          CAMPO.nota.origem = "MANUAL";
          ir("nota");
        });
        return;
      }
      ir("nota");
    });
  }

  /* ============================================================
     [campo 23] AS CONTAS DA NOTA, EM UM LUGAR SÓ
     Antes o total da linha não era mostrado em parte alguma e a soma
     do pé só era calculada quando a tela inteira era repintada. Agora
     as três contas — linha, soma dos marcados, e soma contra o total
     declarado — saem destas funções, e tanto a pintura quanto a
     digitação chamam as mesmas.
     ============================================================ */
  function rs(n){
    n = Number(n)||0;
    return "R$ "+n.toFixed(2).replace(".",",");
  }
  /* quantidade sem zeros à direita inúteis: 5, 2,5, 0,75 */
  function qtdTexto(q){
    q = Number(q)||0;
    var t = (Math.round(q*1000)/1000).toString();
    return t.replace(".",",");
  }
  function contaDaLinha(i){
    var q = Number(i.qtd)||0, v = Number(i.valorUnitario)||0;
    var t = Number(i.valorTotal)||0;
    if(!q && !v && !t) return '<span style="opacity:.6">sem quantidade e sem valor</span>';
    var conta = qtdTexto(q)+' × '+rs(v)+' = <b>'+rs(t)+'</b>';
    /* O arquivo manda no valor da linha. Mas se o vProd do XML não
       for igual a qtd × unitário, ele tem de VER a diferença, não
       receber um número silencioso. Nada é corrigido por conta
       própria. */
    var calc = Math.round(q*v*100)/100;
    if(i.totalVeioDoArquivo && Math.abs(calc - t) > 0.01){
      conta = qtdTexto(q)+' × '+rs(v)+' daria '+rs(calc)+
        ' · <b>o arquivo diz '+rs(t)+'</b>'+
        '<br><span style="opacity:.75">pode ser desconto ou arredondamento na '+
        'nota; mantive o valor do arquivo</span>';
    }
    return conta;
  }
  function somaDosMarcados(){
    return (N.itens||[]).reduce(function(t,i){
      return i.usar ? t + (Number(i.valorTotal)||0) : t;
    },0);
  }
  function resumoDaSoma(){
    var itens = N.itens||[];
    var marcados = itens.filter(function(i){ return i.usar; });
    var soma = somaDosMarcados();
    return marcados.length+' de '+itens.length+' item(ns) · '+rs(soma)+
      (numBR(N.campos.valor)
        ? '</b><div class="pequeno">a nota declara '+rs(numBR(N.campos.valor))+'</div><b>'
        : '');
  }
  /* os dois avisos que dependem de valor; recalculados a cada tecla */
  function recadosDeValor(){
    var itens = N.itens||[];
    var soma = somaDosMarcados();
    var out = "";

    var semNada = itens.filter(function(i){
      return i.usar && (!lim(i.descricao) || !Number(i.qtd) || !Number(i.valorUnitario));
    });
    if(semNada.length){
      out += '<div class="aviso amarelo"><b>'+semNada.length+
        ' item(ns) marcados estão sem descrição, quantidade ou valor</b>'+
        'Preencha nos campos acima. Lançar assim grava item incompleto no '+
        'estoque.</div>';
    }

    var declarado = numBR(N.campos.valor);
    if(declarado && soma){
      var falta = declarado - soma;
      if(Math.abs(falta) > Math.max(0.05, declarado*0.02)){
        out += '<div class="aviso amarelo"><b>A soma dos itens não bate com '+
          'o total da nota</b>'+
          'Os itens marcados somam <b>'+rs(soma)+'</b> e a nota declara <b>'+
          rs(declarado)+'</b> — '+(falta>0?'faltam ':'sobram ')+'<b>'+
          rs(Math.abs(falta))+'</b>. Pode ser frete, desconto, imposto, '+
          'item desmarcado ou linha que o leitor não pegou. '+
          '<b>Nenhum valor foi alterado.</b></div>';
      }
    }
    return out;
  }
  /* reescreve só o que mudou: a linha k, o pé e os avisos de valor */
  function atualizarSomas(k){
    if(k !== undefined && N.itens && N.itens[k]){
      var el = document.querySelector('[data-tot="'+k+'"]');
      if(el) el.innerHTML = contaDaLinha(N.itens[k]);
    }
    var pe = document.getElementById("nfSomaItens");
    if(pe) pe.innerHTML = resumoDaSoma();
    var c = document.getElementById("nfContas");
    if(c) c.innerHTML = recadosDeValor();
  }

  /* ---------- a conferência ---------- */
  function conferir(filtroPagina){
    var itens = N.itens;
    /* [campo 21] §5 — AS FOLHAS SAEM DOS DOCUMENTOS IMPORTADOS.
       Antes esta lista era montada a partir dos ITENS, e o resultado
       era o que ele descreveu: sem item reconhecido o seletor sumia,
       e a folha que falhou — justamente a que precisa ser olhada —
       desaparecia da tela. Agora a página existe porque foi
       importada. */
    N.paginas = N.paginas || [];
    contarPorPagina();
    var folhasReg = N.paginas.slice().sort(function(a,b){ return a.numero - b.numero; });
    var folhas = folhasReg.map(function(p){ return p.numero; });
    var pag = filtroPagina === undefined ? (N.folhaVendo||0) : filtroPagina;
    N.folhaVendo = pag;
    var mostrar = pag ? itens.filter(function(i){ return (i.pagina||1)===pag; }) : itens;
    var marcados = itens.filter(function(i){ return i.usar; });
    var soma = marcados.reduce(function(t,i){ return t + (Number(i.valorTotal)||0); },0);
    var comDuvida = itens.filter(function(i){ return i.duvida; }).length;
    var imagem = pag && N.paginas[pag-1] ? N.paginas[pag-1].dataURL : null;

    pintar(
      /* [campo 25] a marca do salvamento vem primeiro: é a pergunta
         que ele faz antes de sair da tela */
      barraDoSalvamento()+

      /* [campo 20] O CABEÇALHO É EDITÁVEL.
         Serve para a nota digitada, que nasce vazia, e serve para
         corrigir o que a foto leu errado — que é o §7 do pedido:
         "corrigir ou preencher campos que não foram reconhecidos".
         Campo que o leitor não achou fica vazio, nunca chutado. */
      '<div class="cartao">'+
        '<b class="small">DADOS DA NOTA</b>'+
        '<div class="pequeno" style="margin-bottom:8px">'+
        (N.origem==="MANUAL"
          ? 'Digitada por você. Preencha pelo menos o número e o fornecedor.'
          : N.origem==="OCR"
          ? 'Leitura por foto: confira estes campos, eles erram mais que os itens.'
          : 'Leitura por XML: estes valores vieram exatos do arquivo.')+
        '</div>'+
        '<div class="fl" style="gap:8px">'+
          '<div class="campo" style="margin:0;flex:2"><label>Número *</label>'+
          '<input id="nfNumero" inputmode="numeric" value="'+esc(N.campos.numero)+'"></div>'+
          '<div class="campo" style="margin:0;flex:1"><label>Série</label>'+
          '<input id="nfSerie" inputmode="numeric" value="'+esc(N.campos.serie)+'"></div>'+
        '</div>'+
        '<div class="campo" style="margin-top:8px"><label>Fornecedor</label>'+
        '<input id="nfForn" value="'+esc(N.campos.fornecedor)+'"></div>'+
        '<div class="fl" style="gap:8px;margin-top:8px">'+
          '<div class="campo" style="margin:0;flex:1"><label>CNPJ</label>'+
          '<input id="nfCnpj" inputmode="numeric" value="'+esc(N.campos.cnpj)+'"></div>'+
          '<div class="campo" style="margin:0;flex:1"><label>Emissão</label>'+
          '<input id="nfData" placeholder="dd/mm/aaaa" value="'+esc(N.campos.emissao)+'"></div>'+
        '</div>'+
        '<div class="campo" style="margin-top:8px"><label>Valor total da nota</label>'+
        '<input id="nfValor" inputmode="decimal" placeholder="opcional — serve para conferir a soma" '+
        'value="'+esc(N.campos.valor)+'"></div>'+
        '<div class="pequeno" style="margin-top:6px">origem: <b>'+esc(N.origem)+'</b>'+
        (lim(N.campos.chave)?' · chave '+esc(String(N.campos.chave).slice(0,8))+'…':'')+'</div>'+
        /* [campo 24] NOTA QUE VOLTOU DO RASCUNHO.
           O painel de folhas só existe quando há mais de uma folha, e
           está certo assim — mas sem este aviso ele procuraria "ler
           esta folha de novo", não acharia o botão, e não saberia por
           quê. Aqui ele sabe. */
        (N.restaurado
          ? '<div class="aviso cinza" style="margin-top:8px">'+
            '<b>Esta nota voltou do rascunho</b>'+
            'Salvei sozinho quando o aplicativo saiu da frente, e <b>nada foi '+
            'lançado</b>. As fotos das folhas não cabem no aparelho, então elas não '+
            'voltaram — por isso não há "ler esta folha de novo". Os itens lidos e '+
            'as correções estão todos aqui.</div>'
          : '')+
      '</div>'+

      (folhasReg.length>1
        ? '<div class="cartao"><b class="small">FOLHAS IMPORTADAS ('+folhasReg.length+')</b>'+
          '<p class="pequeno">Cada folha que você mandou está aqui, tenha ela rendido '+
          'produto ou não. Folha sem item continua disponível para olhar e mandar ler '+
          'de novo.</p>'+
          '<div class="fl" style="gap:6px;flex-wrap:wrap;margin-top:8px">'+
          '<button class="bt '+(!pag?"verde":"vazio")+' pequeno" data-fl="0">'+
          'Todas ('+itens.length+')</button>'+
          folhasReg.map(function(p){
            var selo = p.estado==="falhou" ? "✕"
                     : p.itensEncontrados ? p.itensEncontrados
                     : p.estado==="aguardando" ? "…" : "0";
            return '<button class="bt '+(pag===p.numero?"verde":"vazio")+' pequeno" '+
              'data-fl="'+p.numero+'" title="'+esc(p.nome)+'">'+
              'Folha '+p.numero+' ('+selo+')</button>';
          }).join("")+'</div>'+

          /* a folha aberta, com estado, nome do arquivo e o que fazer */
          (pag && paginaPorNumero(pag)
            ? (function(){
                var p = paginaPorNumero(pag);
                return '<div style="margin-top:10px">'+
                  '<div class="pequeno"><b>'+esc(p.nome)+'</b> · entrou em '+
                  (p.indiceEntrada+1)+'º · '+
                  (p.estado==="falhou" ? 'leitura <b>falhou</b>'
                   : p.estado==="sem_itens" ? '<b>nenhum produto</b> reconhecido'
                   : p.estado==="aguardando" ? 'ainda não lida'
                   : p.itensEncontrados+' produto(s) reconhecido(s)')+
                  (lim(p.aviso)?' · '+esc(p.aviso):'')+'</div>'+
                  (p.dataURL
                    ? '<img src="'+esc(p.dataURL)+'" alt="" style="width:100%;margin-top:8px;'+
                      'border:1px solid var(--linha);border-radius:8px;background:#fff">'
                    : '<div class="pequeno">sem imagem guardada desta folha</div>')+
                  '<div class="fl" style="gap:6px;margin-top:8px;flex-wrap:wrap">'+
                  (p.dataURL
                    ? '<button class="bt vazio pequeno" data-reler="'+esc(p.id)+'">'+
                      'Ler esta folha de novo</button>' : '')+
                  (p.numero > 1
                    ? '<button class="bt vazio pequeno" data-mover="'+esc(p.id)+':-1">'+
                      '← é mais cedo</button>' : '')+
                  (p.numero < folhasReg.length
                    ? '<button class="bt vazio pequeno" data-mover="'+esc(p.id)+':1">'+
                      'é mais tarde →</button>' : '')+
                  '</div></div>';
              })()
            : (!pag && folhasReg.some(function(p){ return !p.itensEncontrados; })
                ? '<div class="aviso amarelo" style="margin-top:10px">'+
                  '<b>'+folhasReg.filter(function(p){return !p.itensEncontrados;}).length+
                  ' folha(s) sem produto reconhecido</b>'+
                  'Abra cada uma acima para ver a imagem e mandar ler de novo. '+
                  'A nota não está lida inteira enquanto isso.</div>'
                : ''))+
          '</div>'
        : '')+

      '<div class="cartao">'+
        '<b class="small">PRODUTOS — desmarque o que NÃO deve entrar</b>'+
        '<button class="bt vazio" id="nfAddItem" style="margin-top:8px">'+
        '+ Acrescentar item</button>'+
        (!itens.length
          ? '<p class="pequeno">Nenhum produto ainda. Use <b>Acrescentar item</b> '+
            'para procurar no cadastro ou digitar um novo.</p>'
          : '')+
        (comDuvida
          ? '<div class="aviso amarelo">'+comDuvida+' linha(s) vieram com campo faltando. '+
            'Elas estão marcadas e <b>continuam na lista</b> — corrija antes de lançar, '+
            'em vez de sumirem.</div>'
          : '')+
        mostrar.map(function(i){
          var k = itens.indexOf(i);
          return '<div class="item-linha'+(i.duvida?" item-nota":"")+'">'+
            '<div class="item-txt">'+
              '<label class="fl" style="gap:8px;align-items:center">'+
              '<input type="checkbox" data-usar="'+k+'"'+(i.usar?" checked":"")+'>'+
              '<b>'+esc(i.descricao||"(sem descrição)")+'</b></label>'+
              '<div class="pequeno">'+esc(i.codigo||"sem código")+
              (folhas.length>1?' · folha '+(i.pagina||1):'')+
              (i.sku?' · <b>'+esc(i.sku)+'</b>':' · <b>vai ser cadastrado novo</b>')+
              '</div>'+
              '<div class="fl" style="gap:6px;margin-top:6px">'+
              '<button class="bt vazio pequeno" data-vincular="'+k+'">'+
              (i.sku?'Trocar o item':'Procurar no cadastro')+'</button>'+
              '<button class="bt vazio pequeno" data-tirar="'+k+'">Tirar</button>'+
              '</div>'+
              '<div class="fl" style="gap:6px;margin-top:6px">'+
              '<input class="campo" style="margin:0" data-q="'+k+'" inputmode="decimal" '+
                'value="'+esc(i.qtd)+'" placeholder="qtd">'+
              '<input class="campo" style="margin:0" data-v="'+k+'" inputmode="decimal" '+
                'value="'+esc(i.valorUnitario)+'" placeholder="valor unit.">'+
              '</div>'+
              /* [campo 23] O TOTAL DA LINHA, QUE NAO EXISTIA.
                 "cinco itens valem R$ 10, somar o valor na frente".
                 Fica ao lado da conta que o gerou, para ele ver de
                 onde saiu o numero em vez de confiar. */
              '<div class="pequeno" data-tot="'+k+'">'+contaDaLinha(i)+'</div>'+
            '</div></div>';
        }).join("")+
      '</div>'+

      /* [campo 19] §7 — o que a conferência tem de MOSTRAR, sem
         ajustar nada por conta própria */
      (function(){
        var recados = "";

        /* item repetido DENTRO da mesma importação */
        var vistos = {}, repetidos = [];
        itens.forEach(function(i){
          var k = (lim(i.codigo) || lim(i.descricao)).toUpperCase();
          if(!k) return;
          if(vistos[k] && repetidos.indexOf(k) === -1) repetidos.push(k);
          vistos[k] = (vistos[k]||0)+1;
        });
        if(repetidos.length){
          recados += '<div class="aviso amarelo"><b>'+repetidos.length+
            ' produto(s) aparecem mais de uma vez nesta nota</b>'+
            'Pode ser a nota repetindo mesmo — acontece — ou leitura dobrada. '+
            'Confira antes de lançar: '+esc(repetidos.slice(0,4).join(", "))+
            '. <b>Não juntei nem apaguei nada.</b></div>';
        }

        /* campo obrigatório faltando */
        var semNada = itens.filter(function(i){
          return i.usar && (!lim(i.descricao) || !i.qtd || !i.valorUnitario);
        });
        if(semNada.length){
          recados += '<div class="aviso amarelo"><b>'+semNada.length+
            ' item(ns) marcados estão sem descrição, quantidade ou valor</b>'+
            'Preencha nos campos acima. Lançar assim grava item incompleto no '+
            'estoque.</div>';
        }

        return recados;
      })()+

      /* [campo 23] a conferência de valores mora num bloco próprio,
         porque ela muda a cada tecla e precisa ser reescrita sozinha,
         sem repintar a lista e sem tirar o cursor do campo. */
      '<div id="nfContas">'+recadosDeValor()+'</div>'+

      '<div class="cartao">'+
        '<b class="small" id="nfSomaItens">'+resumoDaSoma()+'</b>'+
        '<div id="nfAvisoC"></div>'+
        '<button class="bt verde" id="nfLancar"'+(marcados.length?"":" disabled")+'>'+
          'Lançar a entrada no estoque</button>'+
        '<button class="bt vazio" id="nfTrocar">Trocar de arquivo</button>'+
      '</div>');

    ligarBotaoDeSalvarAgora();

    [["nfNumero","numero"],["nfSerie","serie"],["nfForn","fornecedor"],
     ["nfCnpj","cnpj"],["nfData","emissao"],["nfValor","valor"]]
    .forEach(function(par){
      var el = document.getElementById(par[0]);
      if(el) el.addEventListener("input", function(){
        N.campos[par[1]] = lim(el.value);
        N.cabecalhoCorrigido = true;
      });
    });

    var btAdd = document.getElementById("nfAddItem");
    if(btAdd) btAdd.addEventListener("click", function(){ escolherItem(null); });

    document.querySelectorAll("[data-vincular]").forEach(function(b){
      b.addEventListener("click", function(){
        escolherItem(Number(b.getAttribute("data-vincular")));
      });
    });
    document.querySelectorAll("[data-tirar]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = Number(b.getAttribute("data-tirar"));
        var i = itens[k];
        if(!i) return;
        /* [campo 25] TIRAR NAO E APAGAR NO COMPUTADOR — mas tirar é
           rotina, então sai na hora e a explicação vem depois, com
           desfazer. Pedir confirmação em toda remoção seria cobrar um
           toque a mais justamente na correção mais comum da leitura
           por foto. */
        var jaFoi = !!(N.lancado || i.entrou);
        itens.splice(k, 1);
        N.tirados = N.tirados || [];
        N.tirados.push({ item: i, onde: k, jaFoi: jaFoi });
        conferir(N.folhaVendo);
        var caixa = document.getElementById("nfAvisoC");
        if(caixa){
          caixa.innerHTML = '<div class="aviso '+(jaFoi?"vermelho":"cinza")+'">'+
            '<b>“'+esc(i.descricao||"item")+'” saiu desta conferência</b>'+
            (jaFoi
              ? 'Atenção: este item <b>já entrou no estoque</b>. Tirar aqui não '+
                'apaga no computador — a entrada precisa ser estornada no '+
                'ALMOX-PRO. Eu não tenho como fazer essa baixa daqui.'
              : 'Esta nota ainda não foi lançada, então <b>não havia nada no '+
                'computador</b> para apagar. Ele não vai entrar no estoque.')+
            '<div class="fl" style="gap:6px;margin-top:8px">'+
            '<button class="bt vazio pequeno" id="nfDesfazerTirar">Desfazer</button>'+
            '</div></div>';
          var des = document.getElementById("nfDesfazerTirar");
          if(des) des.addEventListener("click", function(){
            var v = (N.tirados||[]).pop();
            if(!v) return;
            itens.splice(Math.min(v.onde, itens.length), 0, v.item);
            conferir(N.folhaVendo);
          });
        }
      });
    });

    document.querySelectorAll("[data-fl]").forEach(function(b){
      b.addEventListener("click", function(){
        conferir(Number(b.getAttribute("data-fl")));
      });
    });

    /* [campo 21] RELER SÓ UMA FOLHA, sem refazer a nota inteira */
    document.querySelectorAll("[data-reler]").forEach(function(b){
      b.addEventListener("click", function(){
        var p = (N.paginas||[]).filter(function(x){
          return x.id === b.getAttribute("data-reler"); })[0];
        if(!p || !p.dataURL) return;
        b.disabled = true; b.textContent = "Lendo esta folha…";
        api("ocr","ler",{paginas:[{nome:p.nome, tipo:p.tipo, tamanho:0,
          base64: String(p.dataURL).split(",")[1] || ""}]}).then(function(r){
          var d = r && r.dados;
          b.disabled = false; b.textContent = "Ler esta folha de novo";
          if(!r || !r.ok || !d){
            p.estado = "falhou";
            p.aviso = lim(r && r.mensagem) || "o leitor não respondeu";
            conferir(N.folhaVendo);
            return;
          }
          /* os itens ANTIGOS desta folha saem; os das outras ficam */
          N.itens = N.itens.filter(function(i){ return i.paginaId !== p.id; });
          var novos = comoListaCore(d.itens).map(function(i){
            return {
              lid: "I"+Math.random().toString(36).slice(2,9),
              codigo: lim(i.codigo||i.produto), descricao: lim(i.descricao),
              unidade: lim(i.unidade||"un").toLowerCase(),
              ncm: lim(i.ncm), qtd: Number(i.qtd||i.quantidade||0),
              valorUnitario: Number(i.valorUnitario||0),
              valorTotal: Number(i.valorTotal||0),
              sku: lim(i.sku)||null, usar: true,
              pagina: p.numero, paginaId: p.id,
              duvida: !lim(i.descricao) || !Number(i.qtd||i.quantidade||0)
            };
          });
          N.itens = N.itens.concat(novos);
          p.estado = novos.length ? "lida" : "sem_itens";
          p.aviso = novos.length ? "" : "o leitor respondeu e não achou produto nesta folha";
          conferir(N.folhaVendo);
        });
      });
    });

    /* [campo 21] CORRIGIR A ORDEM das folhas.
       Os itens apontam para o ID da página, não para o número — então
       mudar a ordem renumera as folhas e os itens acompanham sozinhos,
       sem nada se embaralhar. */
    document.querySelectorAll("[data-mover]").forEach(function(b){
      b.addEventListener("click", function(){
        var par = String(b.getAttribute("data-mover")).split(":");
        var p = (N.paginas||[]).filter(function(x){ return x.id === par[0]; })[0];
        if(!p) return;
        var ordenadas = N.paginas.slice().sort(function(a,c){ return a.numero - c.numero; });
        var de = ordenadas.indexOf(p);
        var para = de + Number(par[1]);
        if(para < 0 || para >= ordenadas.length) return;
        ordenadas.splice(para, 0, ordenadas.splice(de,1)[0]);
        ordenadas.forEach(function(x, k){ x.numero = k+1; });
        N.itens.forEach(function(i){
          var dona = N.paginas.filter(function(x){ return x.id === i.paginaId; })[0];
          if(dona) i.pagina = dona.numero;
        });
        N.ordemCorrigidaAMao = true;
        conferir(p.numero);
      });
    });
    document.querySelectorAll("[data-usar]").forEach(function(c){
      c.addEventListener("change", function(){
        itens[Number(c.getAttribute("data-usar"))].usar = c.checked;
        conferir(N.folhaVendo);
      });
    });
    /* [campo 23] mexer no total declarado refaz a comparação na hora */
    var elVal = document.getElementById("nfValor");
    if(elVal) elVal.addEventListener("input", function(){ atualizarSomas(); });
    /* [campo 23] EDITAR QUANTIDADE OU VALOR AGORA REFAZ AS CONTAS.
       Antes estes dois ouvintes gravavam o valor e não avisavam
       ninguém: o total do pé da nota e o aviso de divergência ficavam
       com o número velho. E o pior: a conversão era
       Number(texto.replace(",",".")), que em "1.234,56" produz
       "1.234.56" → NaN → zero. Corrigir um valor acima de mil zerava
       a linha em silêncio. numBR() entende formato brasileiro e já
       existia neste mesmo arquivo. Não repinto a tela inteira porque
       isso tiraria o cursor do campo no meio da digitação. */
    document.querySelectorAll("[data-q]").forEach(function(c){
      c.addEventListener("input", function(){
        var k = Number(c.getAttribute("data-q"));
        var i = itens[k];
        i.qtd = numBR(c.value);
        i.valorTotal = Math.round(i.qtd*i.valorUnitario*100)/100;
        i.totalVeioDoArquivo = false;   /* a conta agora é dele, não do arquivo */
        atualizarSomas(k);
      });
    });
    document.querySelectorAll("[data-v]").forEach(function(c){
      c.addEventListener("input", function(){
        var k = Number(c.getAttribute("data-v"));
        var i = itens[k];
        i.valorUnitario = numBR(c.value);
        i.valorTotal = Math.round(i.qtd*i.valorUnitario*100)/100;
        i.totalVeioDoArquivo = false;
        atualizarSomas(k);
      });
    });
    document.getElementById("nfTrocar").addEventListener("click", function(){
      CAMPO.nota = null; ir("nota");
    });
    document.getElementById("nfLancar").addEventListener("click", function(){
      conferirRepetida(this);
    });
  }

  /* ============================================================
     [campo 20] PROCURAR O ITEM NO CADASTRO, OU DIGITAR UM NOVO
     ------------------------------------------------------------
     Chamada com um índice: troca/vincula AQUELA linha.
     Chamada com null: acrescenta uma linha nova.

     Por que a pesquisa vem primeiro e o "digitar novo" depois: o
     item que já existe no cadastro TEM de ser reaproveitado. Se
     cada nota criar produto novo, o mesmo cimento vira cinco SKUs
     e o saldo deixa de significar coisa alguma. O botão de
     cadastrar novo existe — fica embaixo, depois da busca, e diz
     o que vai fazer.
     ============================================================ */
  function escolherItem(indice){
    var voltarPara = N.folhaVendo;
    document.getElementById("subTopo").textContent =
      indice === null ? "acrescentar item" : "procurar no cadastro";

    if(!CAMPO.catalogoNF){
      carregando("Lendo o cadastro de itens…");
      api("estoque","listar",{}).then(function(r){
        if(!r || !r.ok){
          /* sem o cadastro ainda da para digitar um item novo —
             o que nao da e fingir que procurou */
          CAMPO.catalogoNF = [];
          CAMPO.catalogoFalhou = lim(r && r.mensagem) || "o servidor não respondeu";
        } else {
          CAMPO.catalogoFalhou = "";
          CAMPO.catalogoNF = comoListaCore(r.dados).map(function(i){
            return {sku: lim(i.sku||i.codigo||i.id),
              item: lim(i.descricao||i.item||i.nome),
              unidade: lim(i.unidade)||"un",
              saldo: Number(i.estoqueAtual!==undefined?i.estoqueAtual:(i.saldo||0))||0};
          }).filter(function(i){ return i.sku && i.item; });
        }
        desenharBusca("");
      });
      return;
    }
    desenharBusca("");

    function aplicar(escolhido, novo){
      var base = indice === null ? null : N.itens[indice];
      var linha = base || {codigo:"", descricao:"", unidade:"un", ncm:"",
        qtd:0, valorUnitario:0, valorTotal:0, sku:null, usar:true, pagina:1};
      if(escolhido){
        linha.sku = escolhido.sku;
        /* a descricao do CADASTRO manda: e ela que o estoque conhece.
           A da nota fica guardada, para conferencia. */
        linha.descricaoDaNota = linha.descricaoDaNota || linha.descricao;
        linha.descricao = escolhido.item;
        linha.unidade = escolhido.unidade || linha.unidade;
        linha.vinculadoAMao = true;
      } else if(novo){
        linha.sku = null;
        linha.descricao = novo.descricao;
        linha.unidade = novo.unidade || "un";
        linha.codigo = novo.codigo || linha.codigo;
        linha.digitadoAMao = true;
      }
      if(indice === null){
        linha.usar = true;
        N.itens.push(linha);
      }
      document.getElementById("subTopo").textContent = "nota fiscal";
      conferir(voltarPara);
    }

    function desenharBusca(filtro){
      var f = lim(filtro).toUpperCase();
      var cat = CAMPO.catalogoNF || [];
      var fila = f
        ? cat.filter(function(i){
            return (i.item+" "+i.sku).toUpperCase().indexOf(f) > -1;
          }).slice(0,40)
        : cat.slice(0,25);
      var daLinha = indice === null ? null : N.itens[indice];

      pintar(
        (daLinha
          ? '<div class="cartao"><b class="small">LINHA DA NOTA</b>'+
            '<div class="pequeno">'+esc(lim(daLinha.descricao)||"(sem descrição)")+
            (lim(daLinha.codigo)?' · código '+esc(daLinha.codigo):'')+'</div>'+
            '<p class="ajuda">Procure o mesmo produto no cadastro. O saldo vai '+
            'entrar no item que você escolher aqui.</p></div>'
          : '')+

        '<div class="cartao">'+
          '<div class="campo" style="margin:0"><label>Procurar no cadastro</label>'+
          '<input type="search" id="eiBusca" placeholder="nome ou SKU" value="'+esc(filtro||"")+'"></div>'+
          (CAMPO.catalogoFalhou
            ? '<div class="aviso amarelo">Não consegui ler o cadastro de itens: '+
              esc(CAMPO.catalogoFalhou)+'. Dá para digitar um item novo abaixo, '+
              'mas eu não consigo dizer se ele já existe.</div>'
            : '')+
          '<div id="eiLista" style="margin-top:8px">'+
            (fila.length
              ? fila.map(function(i,k){
                  return '<div class="item-linha"><div class="item-txt">'+
                    '<b>'+esc(i.item)+'</b>'+
                    '<div class="pequeno">'+esc(i.sku)+' · saldo '+i.saldo+
                    ' '+esc(i.unidade)+'</div></div>'+
                    '<button class="bt verde pequeno" data-ei="'+k+'">Usar este</button>'+
                    '</div>';
                }).join("")
              : '<div class="pequeno">'+
                (f ? "Nada com esse texto no cadastro." :
                     "O cadastro voltou vazio.")+'</div>')+
          '</div>'+
        '</div>'+

        '<div class="cartao">'+
          '<b class="small">NÃO ESTÁ NO CADASTRO?</b>'+
          '<p class="ajuda">O item será <b>cadastrado novo</b> na hora de lançar a '+
          'nota. Use só quando tiver certeza de que ele não existe — procure antes.</p>'+
          '<div class="campo"><label>Descrição *</label>'+
          '<input id="eiDesc" value="'+esc(daLinha?lim(daLinha.descricao):"")+'"></div>'+
          '<div class="fl" style="gap:8px">'+
            '<div class="campo" style="margin:0;flex:1"><label>Unidade</label>'+
            '<input id="eiUn" value="'+esc(daLinha?lim(daLinha.unidade):"un")+'"></div>'+
            '<div class="campo" style="margin:0;flex:1"><label>Código do fornecedor</label>'+
            '<input id="eiCod" value="'+esc(daLinha?lim(daLinha.codigo):"")+'"></div>'+
          '</div>'+
          '<div id="eiAviso"></div>'+
          '<button class="bt vazio" id="eiNovo">Usar como item novo</button>'+
          '<button class="bt vazio" id="eiVoltar">Voltar sem mudar nada</button>'+
        '</div>');

      var busca = document.getElementById("eiBusca");
      if(busca) busca.addEventListener("input", function(){ desenharBusca(busca.value); });

      document.querySelectorAll("[data-ei]").forEach(function(b){
        b.addEventListener("click", function(){
          aplicar(fila[Number(b.getAttribute("data-ei"))], null);
        });
      });
      document.getElementById("eiNovo").addEventListener("click", function(){
        var d = lim(document.getElementById("eiDesc").value);
        if(!d){
          document.getElementById("eiAviso").innerHTML =
            '<div class="aviso amarelo">Sem descrição eu não cadastro nada — '+
            'item sem nome no estoque não serve para ninguém.</div>';
          return;
        }
        aplicar(null, {descricao:d,
          unidade: lim(document.getElementById("eiUn").value),
          codigo: lim(document.getElementById("eiCod").value)});
      });
      document.getElementById("eiVoltar").addEventListener("click", function(){
        document.getElementById("subTopo").textContent = "nota fiscal";
        conferir(voltarPara);
      });
    }
  }

  /* ============================================================
     [campo 22] A IDENTIDADE DO DOCUMENTO  ·  §11
     ------------------------------------------------------------
     "Número de nota isolado pode não identificar unicamente um
      documento."  Está certo, e o caso é comum: dois fornecedores
     diferentes emitem a nota 1234 no mesmo mês. Perguntar só pelo
     número dá falso positivo num caso e deixa passar no outro.

     A ordem é:
       1. a CHAVE de acesso, quando houver — ela é única por lei;
       2. sem chave: número + série + CNPJ do emitente;
       3. sem CNPJ: número + série, e a tela DIZ que a identificação
          é fraca, em vez de fingir certeza.
     ============================================================ */
  function identidadeDaNota(){
    var chave = lim(N.campos.chave).replace(/\D/g,"");
    if(chave.length === 44){
      return {tipo:"chave", valor:chave, forte:true,
        comoDizer:"chave de acesso"};
    }
    var num = lim(N.campos.numero);
    var serie = lim(N.campos.serie);
    var cnpj = lim(N.campos.cnpj).replace(/\D/g,"");
    if(num && cnpj){
      return {tipo:"numero+cnpj", valor:num+"|"+serie+"|"+cnpj, forte:true,
        numero:num, serie:serie, cnpj:cnpj,
        comoDizer:"número "+num+(serie?" série "+serie:"")+" do CNPJ "+cnpj};
    }
    if(num){
      return {tipo:"numero", valor:num+"|"+serie, forte:false,
        numero:num, serie:serie,
        comoDizer:"número "+num+(serie?" série "+serie:"")};
    }
    return {tipo:"nenhuma", valor:"", forte:false, comoDizer:""};
  }

  /* [campo 22] §12 — O LOG DA OPERAÇÃO.
     Id, etapa, duração e contagens. Nada de token, nada de imagem,
     nada de dado fiscal além do que a própria tela já mostra. */
  function novoLog(oQue){
    return {
      id: "OP-" + Date.now().toString(36) + "-" +
          Math.random().toString(36).slice(2,6),
      oQue: oQue,
      comecou: new Date().toISOString(),
      etapas: [],
      marcar: function(etapa, extra){
        this.etapas.push(Object.assign({
          etapa: etapa,
          ms: Date.now() - new Date(this.comecou).getTime()
        }, extra||{}));
      }
    };
  }

  /* ---------- nota repetida: perguntar ANTES ---------- */
  function conferirRepetida(botao){
    var num = lim(N.campos.numero);
    var aviso = document.getElementById("nfAvisoC");

    /* [campo 20] LINHA INCOMPLETA NAO ENTRA NO ESTOQUE.
       Com a nota digitada a mao, linha em branco deixa de ser
       hipotese: e o estado normal de uma nota que acabou de nascer
       vazia. Entrada com quantidade zero suja o historico e nao
       mexe em saldo nenhum — melhor barrar e dizer qual linha e. */
    var incompletos = N.itens.filter(function(i){
      return i.usar && (!lim(i.descricao) || !(Number(i.qtd) > 0));
    });
    if(incompletos.length){
      aviso.innerHTML = '<div class="aviso vermelho"><b>'+incompletos.length+
        ' linha(s) marcadas estão sem descrição ou sem quantidade</b>'+
        incompletos.slice(0,4).map(function(i){
          return esc(lim(i.descricao)||"(sem descrição)")+
            (Number(i.qtd)>0?"":" — quantidade zerada");
        }).join("<br>")+
        '<br>Preencha, ou desmarque a linha. Entrada com quantidade zero não '+
        'mexe no saldo e só suja o histórico.</div>';
      return;
    }

    var ident = identidadeDaNota();
    if(ident.tipo === "nenhuma"){
      aviso.innerHTML = '<div class="aviso amarelo"><b>Esta nota está sem número</b>'+
        'Sem número nem chave eu não consigo perguntar ao servidor se ela já foi '+
        'lançada, e lançar duas vezes soma o estoque em dobro. Preencha o número '+
        'acima, ou use o XML, que traz a chave de acesso.</div>';
      return;
    }

    /* a trava do toque duplo mora AQUI, antes de qualquer pedido */
    if(N.lancando) return;

    botao.disabled = true;
    botao.textContent = "Vendo se esta nota já foi lançada…";
    N.log = novoLog("lancar nota");
    N.log.marcar("identificar", {por: ident.tipo});

    /* mando a chave quando tenho; o Core antigo que só entende
       "numero" continua funcionando, porque ele vai junto */
    api("nf","obter", ident.tipo === "chave"
      ? {chave: ident.valor, numero: lim(N.campos.numero)}
      : {numero: ident.numero, serie: ident.serie, cnpj: ident.cnpj||""}
    ).then(function(r){
      N.log.marcar("conferir repetida", {ok: !!(r&&r.ok)});
      var achado = r && r.ok && r.dados;
      var lista = Array.isArray(achado) ? achado : (achado ? [achado] : []);
      /* só é a MESMA nota se a identidade bater — o servidor pode
         devolver qualquer coisa parecida, e parecida não basta */
      /* SÓ RECUSO COM PROVA POSITIVA DE DIFERENÇA.
         Se eu perguntei pela chave e o servidor devolveu um registro,
         esse registro É a resposta — ainda que ele não repita a chave
         no corpo. O que me faz dizer "não é a mesma" é o registro
         trazer uma chave DIFERENTE, ou um CNPJ diferente. Ausência
         de campo não é prova de nada. */
      var jaTem = lista.some(function(x){
        if(!x) return false;
        var ch = lim(x.chave).replace(/\D/g,"");
        if(ident.tipo === "chave") return ch ? (ch === ident.valor) : true;
        if(lim(x.numero) && lim(x.numero) !== ident.numero) return false;
        if(ident.tipo === "numero+cnpj"){
          var c = lim(x.cnpj).replace(/\D/g,"");
          if(c && c !== ident.cnpj) return false;
        }
        return true;
      });

      /* [campo 26] NOTA LANCADA EM PARTE — duas pessoas, a mesma nota.
         Se o registro que voltou diz PARCIAL, isto não é lançamento em
         dobro: é a segunda metade de um trabalho repartido. Tratar
         como engano faria ele insistir contra um alarme falso, e
         insistir contra alarme é como se aprende a ignorar alarme. */
      var oQueAchei = lista.filter(function(x){
        if(!x) return false;
        var ch = lim(x.chave).replace(/\D/g,"");
        if(ident.tipo === "chave") return ch ? (ch === ident.valor) : true;
        if(lim(x.numero) && lim(x.numero) !== ident.numero) return false;
        return true;
      })[0] || null;
      var ehParcial = oQueAchei && /PARCIAL/i.test(lim(oQueAchei.status));

      if(jaTem && ehParcial && !N.mesmoAssim){
        botao.disabled = false;
        botao.textContent = "Lançar o restante no estoque";
        N.continuacao = true;
        var quemFoi = lim(oQueAchei.origem) || lim(oQueAchei.usuario) || "";
        var jaEntraram = Number(oQueAchei.itensLancados || 0) || 0;
        aviso.innerHTML = '<div class="aviso amarelo">'+
          '<b>Esta nota já está sendo lançada em partes</b>'+
          'Encontrei pela '+esc(ident.comoDizer)+' e o registro está marcado como '+
          '<b>parcial</b>'+(quemFoi?' (origem: '+esc(quemFoi)+')':'')+'. '+
          (jaEntraram ? '<b>'+jaEntraram+' item(ns)</b> já entraram no estoque. ' : '')+
          'Os itens desta tela vão <b>somar</b> ao que já foi lançado, não substituir.'+
          '<br><br><b>Confira antes:</b> se algum item desta tela já foi lançado pela '+
          'outra pessoa, ele vai entrar duas vezes. Eu não tenho como saber quais '+
          'itens o outro celular lançou — o servidor não me conta isso item por '+
          'item ainda.'+
          '<div class="fl" style="gap:6px;margin-top:8px;flex-wrap:wrap">'+
          '<button class="bt verde pequeno" id="nfSeguirParcial">'+
          'Conferi, lançar o restante</button>'+
          '<button class="bt vazio pequeno" id="nfPararParcial">Parar e conferir</button>'+
          '</div></div>';
        var bp = document.getElementById("nfSeguirParcial");
        if(bp) bp.addEventListener("click", function(){
          N.mesmoAssim = true; conferirRepetida(botao);
        });
        var bpn = document.getElementById("nfPararParcial");
        if(bpn) bpn.addEventListener("click", function(){
          var c = document.getElementById("nfAvisoC");
          if(c) c.innerHTML = '<div class="aviso cinza">Nada foi lançado. '+
            'O trabalho está salvo no aparelho e espera você.</div>';
          salvarRascunho();
        });
        return;
      }

      if(jaTem && !N.mesmoAssim){
        botao.disabled = false;
        botao.textContent = "Lançar a entrada no estoque";
        aviso.innerHTML = '<div class="aviso vermelho"><b>Esta nota já existe no sistema</b>'+
          'Encontrei pela <b>'+esc(ident.comoDizer)+'</b>. Lançar de novo soma o '+
          'estoque duas vezes. Confira no computador antes.'+
          (ident.forte ? '' :
            '<br><br><b>Atenção:</b> esta nota não tem chave de acesso nem CNPJ do '+
            'fornecedor, então eu identifiquei só pelo número. Duas notas de '+
            'fornecedores diferentes podem ter o mesmo número — confira se é mesmo '+
            'a mesma nota antes de decidir.')+
          '<button class="bt vazio pequeno" id="nfInsistir" style="margin-top:8px">'+
          'Já conferi, lançar assim mesmo</button></div>';
        var bi = document.getElementById("nfInsistir");
        if(bi) bi.addEventListener("click", function(){
          N.mesmoAssim = true; conferirRepetida(botao);
        });
        return;
      }
      /* [campo 22b] O AVISO DE IDENTIFICAÇÃO FRACA NÃO BARRA.
         Eu tinha posto um pedágio no primeiro toque de toda nota sem
         chave e sem CNPJ. Na obra, nota digitada à mão é quase sempre
         assim — então isso viraria um obstáculo justamente no caminho
         que criei para quando a foto falha. O aviso fica, mas junto
         da duplicata, que é onde o risco mora. */
      lancar(botao, aviso);
    });
  }

  /* ---------- a gravação ---------- */
  function lancar(botao, aviso){
    /* [campo 22] §11 — A TRAVA DO TOQUE DUPLO.
       "A nota não deve ser gravada duas vezes porque o usuário tocou
        no botão novamente." Antes o botão só ficava disabled, e
       disabled não impede uma segunda chamada vinda de outro
       caminho. A trava agora está no estado da nota. */
    if(N.lancando) return;
    N.lancando = true;

    var escolhidos = N.itens.filter(function(i){ return i.usar; });
    var doc = "NF " + (lim(N.campos.numero)||"sem número");
    var entraram = [], semCadastro = [], semEntrada = [];
    var t0 = Date.now();
    /* [campo 27] O SALDO DE ANTES.
       Sem ele não há como provar que a entrada moveu alguma coisa.
       É uma leitura só, da lista inteira, antes de gravar nada. */
    var saldoAntes = {};
    var saldoDepois = {};
    N.log = N.log || novoLog("lancar nota");
    N.log.marcar("comecar gravacao", {itens: escolhidos.length});

    /* a chave de operação de cada item: estável e repetível. Se o
       Core souber lê-la, uma segunda tentativa não duplica; se não
       souber, ela viaja sem atrapalhar. */
    var idDaNota = identidadeDaNota().valor || ("SEMID-" + N.log.id);
    escolhidos.forEach(function(i){
      i.opchave = i.opchave || ("ENT:" + idDaNota + ":" + (i.lid || i.sku || i.descricao));
    });

    function umItem(k){
      if(k >= escolhidos.length) return Promise.resolve();
      var i = escolhidos[k];
      var ms = k ? (Date.now()-t0)/k : 0;
      botao.textContent = "Lançando "+(k+1)+" de "+escolhidos.length+
        (ms ? " · faltam uns "+Math.round((escolhidos.length-k)*ms/1000)+" s" : "")+"…";

      var antes = i.sku
        ? Promise.resolve({ok:true, dados:{sku:i.sku}})
        /* item novo entra no catálogo: o guardado também envelhece,
           e a entrada logo abaixo confirma isso de novo */
        : api("itens","salvar",{
            descricao: i.descricao, unidade: i.unidade,
            valorUnitario: i.valorUnitario, ncm: i.ncm,
            codigoFornecedor: i.codigo,
            fornecedor: lim(N.campos.fornecedor),
            confirmadoNovo: true
          });

      return antes.then(function(rc){
        var sku = rc && rc.ok && rc.dados && lim(rc.dados.sku);
        if(!sku){
          semCadastro.push({descricao:i.descricao,
            motivo: lim(rc && rc.mensagem) || "o Core não devolveu SKU"});
          return null;
        }
        i.sku = sku;
        return api("estoque","entrada",{
          sku: sku, qtd: i.qtd, documento: doc, valorUnitario: i.valorUnitario,
          /* §11: a mesma tentativa repetida carrega a mesma chave */
          opchave: i.opchave,
          chaveNota: lim(N.campos.chave)
        }).then(function(re){
          /* [campo 25] o saldo mudou agora: o catálogo guardado
             envelheceu neste instante */
          if(re && re.ok) estoqueMudou();
          if(re && re.ok) entraram.push(i);
          else semEntrada.push({descricao:i.descricao, qtd:i.qtd,
            motivo: lim(re && re.mensagem) || "o estoque recusou"});
        });
      }).then(function(){ return umItem(k+1); });
    }

    function lerSaldos(para){
      return api("estoque","listar",{}).then(function(r){
        if(!r || !r.ok) return false;
        comoListaCore(r.dados).forEach(function(x){
          var sku = lim(x.sku||x.codigo||x.id);
          if(!sku) return;
          para[sku] = Number(x.estoqueAtual!==undefined ? x.estoqueAtual : (x.saldo||0)) || 0;
        });
        return true;
      }, function(){ return false; });
    }

    botao.textContent = "Lendo o saldo de antes…";
    lerSaldos(saldoAntes).then(function(leu){
      N.saldoAntesLido = !!leu;
      return umItem(0);
    }).then(function(){
      N.lancando = false;
      N.log.marcar("gravacao terminada", {
        entraram: entraram.length,
        semCadastro: semCadastro.length,
        semEntrada: semEntrada.length
      });
      /* [campo 27] CONFERIR O SALDO DEPOIS.
         O "ok" da entrada diz que o pedido foi aceito. Ele não diz
         que o saldo andou. Quem declara sucesso sem olhar o saldo
         está adivinhando. */
      if(!entraram.length) return mostrarResultado(entraram, semCadastro, semEntrada, null);
      botao.textContent = "Conferindo o saldo…";
      return lerSaldos(saldoDepois).then(function(leu){
        N.saldoDepoisLido = !!leu;
        entraram.forEach(function(i){
          i.saldoAntes  = (saldoAntes[i.sku]  === undefined) ? null : saldoAntes[i.sku];
          i.saldoDepois = (saldoDepois[i.sku] === undefined) ? null : saldoDepois[i.sku];
          i.saldoAndou  = (i.saldoAntes !== null && i.saldoDepois !== null)
            ? (i.saldoDepois > i.saldoAntes) : null;
          /* o item foi criado agora? então ele não existia na lista de
             antes — e é por isso que o saldo da bota ANTIGA não mudou */
          i.skuNasceuAgora = (saldoAntes[i.sku] === undefined) &&
                             (saldoDepois[i.sku] !== undefined);
        });
        return true;
      }).then(function(){
      return api("nf","salvar",{
        numero: lim(N.campos.numero), serie: lim(N.campos.serie),
        chave: lim(N.campos.chave), cnpj: lim(N.campos.cnpj),
        fornecedor: lim(N.campos.fornecedor), emissao: lim(N.campos.emissao),
        valor: lim(N.campos.valor),
        status: (semCadastro.length || semEntrada.length) ? "LANCADA_PARCIAL" : "LANCADA",
        origem: "ALMOXA_CAMPO",
        listaItens: entraram.map(function(i){
          return {sku:i.sku, descricao:i.descricao, unidade:i.unidade,
            qtd:i.qtd, recebido:i.qtd, valorUnitario:i.valorUnitario};
        })
      }).then(function(rn){
        mostrarResultado(entraram, semCadastro, semEntrada, rn);
      });
      });
    });
  }

  function mostrarResultado(entraram, semCadastro, semEntrada, rn){
    var deuTudo = entraram.length && !semCadastro.length && !semEntrada.length;
    /* [campo 24] o rascunho sai de cena quando o estoque ANDOU. Se
       nada entrou, ele fica — é trabalho que ainda precisa ser feito,
       e nada foi gravado para se perder.
       A marca em N.lancado é o que impede o relógio de gravar tudo
       de novo nos próximos 4 segundos. */
    if(entraram.length){
      N.lancado = true;
      N.lancadoEm = new Date().toISOString();
      limparRascunho();
    }
    pintar('<div class="cartao">'+
      (deuTudo
        ? '<div class="aviso verde"><b>Entrada lançada</b>'+entraram.length+
          ' item(ns) entraram no estoque. Já aparece no computador — é o mesmo servidor.</div>'
        : '<div class="aviso '+(entraram.length?"amarelo":"vermelho")+'"><b>'+
          (entraram.length ? "Entrada lançada EM PARTE" : "NADA entrou no estoque")+'</b>'+
          'Veja abaixo o que não entrou e por quê.</div>')+
      (entraram.length
        ? '<b class="small">ENTROU NO ESTOQUE</b>'+entraram.map(function(i){
            /* [campo 27] O SALDO ANTES E DEPOIS, por item.
               É a única forma de ele saber, sem abrir o computador,
               se a entrada moveu o estoque ou só gerou movimento. */
            var conta = "";
            if(i.saldoAntes !== null && i.saldoAntes !== undefined &&
               i.saldoDepois !== null && i.saldoDepois !== undefined){
              conta = ' · saldo <b>'+i.saldoAntes+' → '+i.saldoDepois+'</b>'+
                (i.saldoAndou ? ' ✓' : '');
            } else if(i.skuNasceuAgora && i.saldoDepois !== null &&
                      i.saldoDepois !== undefined){
              conta = ' · saldo <b>'+i.saldoDepois+'</b> (item novo)';
            }
            return '<div class="item-linha'+(i.saldoAndou===false?" item-nota":"")+'">'+
              '<div class="item-txt"><b>'+esc(i.descricao)+'</b>'+
              '<div class="pequeno">'+esc(i.sku)+' · '+i.qtd+' '+esc(i.unidade)+conta+'</div>'+
              (i.skuNasceuAgora
                ? '<div class="pequeno" style="margin-top:4px"><b>Este item foi '+
                  'cadastrado agora</b>, com o código '+esc(i.sku)+'. Se a bota já '+
                  'existia no estoque com outro código, o saldo que subiu foi o '+
                  'deste código novo — e o do item antigo continua igual. '+
                  'No computador, junte os dois.</div>'
                : '')+
              (i.saldoAndou === false
                ? '<div class="pequeno" style="margin-top:4px;color:var(--vermelho,#c1121f)">'+
                  '<b>O servidor aceitou a entrada mas o saldo deste item não '+
                  'mudou</b> (continua '+i.saldoDepois+'). A movimentação deve '+
                  'estar registrada, só o saldo não foi recalculado. Isso é do '+
                  'servidor, não do aplicativo — mostre este número para quem '+
                  'cuida do Core.</div>'
                : '')+
              '</div></div>';
          }).join("")+
          /* um resumo em cima, para ele não precisar ler item por item */
          (function(){
            var paradas = entraram.filter(function(i){ return i.saldoAndou === false; });
            var novos   = entraram.filter(function(i){ return i.skuNasceuAgora; });
            var r = "";
            if(paradas.length){
              r += '<div class="aviso vermelho" style="margin-top:8px">'+
                '<b>'+paradas.length+' item(ns) entraram mas o saldo não subiu</b>'+
                'A entrada foi aceita e aparece nas movimentações, e o saldo ficou '+
                'igual. Quem recalcula o saldo é o servidor — eu mando a entrada e '+
                'leio o que ele responde. <b>Não vou dizer que subiu.</b></div>';
            }
            if(novos.length){
              r += '<div class="aviso amarelo" style="margin-top:8px">'+
                '<b>'+novos.length+' item(ns) foram cadastrados agora</b>'+
                'Eles não existiam no estoque antes deste lançamento, então o saldo '+
                'que subiu foi o <b>deles</b>. Se o material já existia com outro '+
                'código, o saldo daquele código não mudou — e é esse que você vê '+
                'quando procura pelo nome antigo. Junte os dois no computador.</div>';
            }
            if(!N.saldoAntesLido || !N.saldoDepoisLido){
              r += '<div class="aviso cinza" style="margin-top:8px">'+
                'Não consegui ler o saldo '+
                (!N.saldoAntesLido ? 'de antes' : 'de depois')+
                ' para comparar, então não afirmo nada sobre ele aqui.</div>';
            }
            return r;
          })()
        : '')+
      (semCadastro.length
        ? '<b class="small">NÃO FOI CADASTRADO — e por isso não entrou</b>'+
          semCadastro.map(function(f){
            return '<div class="item-linha"><div class="item-txt"><b>'+esc(f.descricao)+'</b>'+
              '<div class="pequeno">'+esc(f.motivo)+'</div></div></div>';
          }).join("")
        : '')+
      (semEntrada.length
        ? '<div class="aviso vermelho"><b>Cadastrado, mas a entrada NÃO foi gravada</b>'+
          semEntrada.map(function(f){
            return esc(f.descricao)+' ('+f.qtd+'): '+esc(f.motivo);
          }).join("<br>")+
          '<br>O item existe no cadastro e o saldo não subiu. Lance só esses no computador.</div>'
        : '')+
      (rn && !rn.ok
        ? '<div class="aviso amarelo"><b>O estoque entrou, mas a nota não foi registrada</b>'+
          esc(lim(rn.mensagem))+'<br>O saldo já subiu. Registre a nota no computador '+
          '— NÃO lance a entrada de novo.</div>'
        : '')+
      '<button class="bt verde" id="nfOutra">Lançar outra nota</button>'+
      '</div>');
    document.getElementById("nfOutra").addEventListener("click", function(){
      CAMPO.nota = null; ir("nota");
    });
  }
};

/* ============================================================
 * TELA — LANÇAR A ENTREGA DE EPI PELO CELULAR
 * ------------------------------------------------------------
 * O Campo sabia CONFERIR uma entrega que já tinha sido lançada no
 * computador. Lançar, não sabia — e é no campo que a entrega
 * acontece, com a pessoa na frente.
 *
 * A REGRA QUE EU COPIEI, E POR QUE
 * O computador faz assim, e o comentário de lá conta o motivo:
 * a baixa do estoque era disparada sem esperar, e se falhasse a
 * ficha nascia do mesmo jeito. Ficha sem baixa: o estoque passa a
 * mentir e ninguém fica sabendo.
 *
 *     1º  estoque.saida  — é o material que é escasso
 *     2º  epi.salvar     — SÓ se a baixa aconteceu
 *
 * É a mesma ordem aqui. Item que não teve baixa não vira ficha, e
 * a tela diz qual foi e por quê. Não existe "entrega registrada"
 * sem o servidor ter confirmado as duas pontas.
 *
