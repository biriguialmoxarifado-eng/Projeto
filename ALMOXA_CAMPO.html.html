 * O QUE ESTA TELA NÃO FAZ
 *  · não cria banco nem aba própria: escreve nas ações que já existem;
 *  · não guarda cópia da assinatura: valida a do cadastro na hora;
 *  · não cadastra colaborador: a pessoa vem da lista do Core;
 *  · não inventa saldo: o que ela mostra é o que o estoque devolveu.
 * ============================================================ */
TELAS.entregar = function(){
  var c = CAMPO.pessoa || {};
  var nome = lim(c.colaborador||c.nome);
  var mat = lim(c.matricula);
  CAMPO.carrinho = CAMPO.carrinho || {};
  CAMPO.catalogo = CAMPO.catalogo || null;
  document.getElementById("subTopo").textContent = "lançar entrega de EPI";

  if(!CAMPO.catalogo){
    carregando("Lendo o estoque…");
    api("estoque","listar",{}).then(function(r){
      if(!r || !r.ok){
        pintar('<div class="cartao">'+avisoErro(r)+'</div>');
        return;
      }
      CAMPO.catalogoEm = Date.now();
      CAMPO.catalogo = comoListaCore(r.dados).map(function(i){
        return {
          sku: lim(i.sku||i.codigo||i.id),
          item: lim(i.descricao||i.item||i.nome),
          unidade: lim(i.unidade)||"un",
          saldo: Number(i.estoqueAtual!==undefined ? i.estoqueAtual : (i.saldo||0)) || 0,
          ca: lim(i.ca)
        };
      }).filter(function(i){ return i.sku && i.item; });
      desenhar();
    });
    return;
  }
  desenhar();

  function noCarrinho(){
    return Object.keys(CAMPO.carrinho)
      .map(function(k){ return CAMPO.carrinho[k]; })
      .filter(function(e){ return e && e.qtd > 0; });
  }

  function desenhar(filtro){
    var busca = lim(filtro).toUpperCase();
    var lista = CAMPO.catalogo.filter(function(i){
      if(!busca) return true;
      return (i.item+" "+i.sku+" "+i.ca).toUpperCase().indexOf(busca) > -1;
    }).slice(0, 60);
    var escolhidos = noCarrinho();

    pintar(
      '<div class="cartao">'+
        '<b>'+esc(nome||"colaborador")+'</b>'+
        '<div class="pequeno">matrícula '+esc(mat||"—")+'</div>'+
        '<div id="enIdent" class="pequeno">conferindo foto e assinatura…</div>'+
      '</div>'+

      '<div class="cartao">'+
        '<b class="small">O QUE VAI SER ENTREGUE</b>'+
        '<div id="enCarrinho">'+
          (escolhidos.length
            ? escolhidos.map(function(e){
                return '<div class="item-linha">'+
                  '<div class="item-txt"><b>'+esc(e.item)+'</b>'+
                  '<div class="pequeno">'+esc(e.sku)+' · saldo '+e.saldo+'</div></div>'+
                  '<div class="fl">'+
                  '<button class="bt vazio pequeno" data-menos="'+esc(e.sku)+'">−</button>'+
                  '<b style="padding:0 10px">'+e.qtd+'</b>'+
                  '<button class="bt vazio pequeno" data-mais="'+esc(e.sku)+'">+</button>'+
                  '</div></div>';
              }).join("")
            : '<div class="pequeno">Nada escolhido ainda.</div>')+
        '</div>'+
        '<div id="enAvisoE"></div>'+
        '<button class="bt verde" id="enLancar"'+(escolhidos.length?"":" disabled")+'>'+
          'Lançar a entrega'+(escolhidos.length?' ('+escolhidos.length+' item(ns))':'')+
        '</button>'+
      '</div>'+

      '<div class="cartao">'+
        '<div class="fl" style="display:flex;justify-content:space-between;'+
        'align-items:center;gap:8px;flex-wrap:wrap">'+
          '<b class="small">ESCOLHER DO ESTOQUE</b>'+
          '<button class="bt vazio pequeno" id="enAtualizar">Atualizar saldo</button>'+
        '</div>'+
        /* [campo 25] DE QUANDO É ESTE SALDO.
           O número do estoque estraga rápido: alguém lança uma nota no
           computador e o que está nesta tela fica velho sem avisar.
           Com a hora à vista ele sabe se vale confiar ou atualizar. */
        '<div class="pequeno" style="margin:2px 0 6px">saldo lido '+
          esc(faz(new Date(CAMPO.catalogoEm||Date.now()).toISOString()))+
          ' · o estoque muda quando alguém lança</div>'+
        '<input class="campo" id="enBusca" placeholder="buscar por nome, SKU ou CA" value="'+esc(filtro||"")+'">'+
        '<div id="enLista">'+
          (lista.length
            ? lista.map(function(i){
                var jaTem = (CAMPO.carrinho[i.sku]||{}).qtd || 0;
                return '<div class="item-linha">'+
                  '<div class="item-txt"><b>'+esc(i.item)+'</b>'+
                  '<div class="pequeno">'+esc(i.sku)+
                    (i.ca?' · CA '+esc(i.ca):'')+' · saldo <b>'+i.saldo+'</b> '+esc(i.unidade)+
                  '</div></div>'+
                  (i.saldo > 0
                    ? '<button class="bt '+(jaTem?"vazio":"verde")+' pequeno" data-mais="'+esc(i.sku)+'">'+
                      (jaTem? jaTem+" escolhido" : "Escolher")+'</button>'
                    : '<span class="item-sem pequeno">sem saldo</span>')+
                  '</div>';
              }).join("")
            : '<div class="pequeno">Nada encontrado com esse texto.</div>')+
        '</div>'+
      '</div>');

    var busq = document.getElementById("enBusca");
    if(busq) busq.addEventListener("input", function(){ desenhar(busq.value); });

    /* [campo 25] pedir o saldo de novo, sem sair da tela e sem perder
       o que já está no carrinho */
    var btAt = document.getElementById("enAtualizar");
    if(btAt) btAt.addEventListener("click", function(){
      btAt.disabled = true; btAt.textContent = "Lendo…";
      api("estoque","listar",{}).then(function(r){
        if(!r || !r.ok){
          btAt.disabled = false; btAt.textContent = "Atualizar saldo";
          var av = document.getElementById("enAvisoE");
          if(av) av.innerHTML = avisoErro(r);
          return;
        }
        CAMPO.catalogoEm = Date.now();
        CAMPO.catalogo = comoListaCore(r.dados).map(function(i){
          return {
            sku: lim(i.sku||i.codigo||i.id),
            item: lim(i.descricao||i.item||i.nome),
            unidade: lim(i.unidade)||"un",
            saldo: Number(i.estoqueAtual!==undefined ? i.estoqueAtual : (i.saldo||0)) || 0,
            ca: lim(i.ca)
          };
        }).filter(function(i){ return i.sku && i.item; });
        /* o carrinho fica, mas o saldo de cada linha dele é o de agora */
        Object.keys(CAMPO.carrinho||{}).forEach(function(sku){
          var novo = CAMPO.catalogo.filter(function(x){ return x.sku===sku; })[0];
          if(novo) CAMPO.carrinho[sku].saldo = novo.saldo;
        });
        desenhar(busq ? busq.value : "");
      });
    });

    document.querySelectorAll("[data-mais]").forEach(function(b){
      b.addEventListener("click", function(){
        var sku = b.getAttribute("data-mais");
        var doEstoque = CAMPO.catalogo.filter(function(x){ return x.sku===sku; })[0];
        if(!doEstoque) return;
        var atual = CAMPO.carrinho[sku] || Object.assign({}, doEstoque, {qtd:0});
        /* NÃO deixo escolher mais do que o estoque tem. O saldo é o
           que o servidor devolveu; passar disso é prometer material
           que não existe. */
        if(atual.qtd >= doEstoque.saldo){
          var av = document.getElementById("enAvisoE");
          if(av) av.innerHTML = '<div class="aviso amarelo">O estoque tem '+
            doEstoque.saldo+' de '+esc(doEstoque.item)+'. Não dá para entregar mais que isso.</div>';
          return;
        }
        atual.qtd += 1;
        CAMPO.carrinho[sku] = atual;
        desenhar(busq ? busq.value : "");
      });
    });
    document.querySelectorAll("[data-menos]").forEach(function(b){
      b.addEventListener("click", function(){
        var sku = b.getAttribute("data-menos");
        var e = CAMPO.carrinho[sku];
        if(!e) return;
        e.qtd -= 1;
        if(e.qtd <= 0) delete CAMPO.carrinho[sku];
        desenhar(busq ? busq.value : "");
      });
    });

    conferirIdentidade();
    var lan = document.getElementById("enLancar");
    if(lan) lan.addEventListener("click", function(){ lancar(lan); });
  }

  /* a foto e a assinatura são do CADASTRO; aqui eu só mostro o que há
     e ofereço o caminho que já existe para cadastrar o que falta */
  function conferirIdentidade(){
    var alvo = document.getElementById("enIdent");
    if(!alvo) return;
    lerAssinaturaCadastrada(CAMPO.pessoa).then(function(r){
      var temAss = r && r.ok && r.tem && lim(r.dados.imagem);
      var temFoto = !!lim(c.foto);
      CAMPO.assNaEntrega = temAss ? r : null;
      alvo.innerHTML =
        '<span class="id-estado '+(temFoto?"sim":"nao")+'"><span class="id-bola"></span>'+
        (temFoto?"com foto":"sem foto")+'</span> '+
        '<span class="id-estado '+(temAss?"sim":"nao")+'"><span class="id-bola"></span>'+
        (temAss?"com assinatura":"sem assinatura")+'</span>'+
        ((!temFoto || !temAss)
          ? '<div class="fl" style="margin-top:8px;gap:8px">'+
            (!temFoto?'<button class="bt vazio pequeno" id="enIrFoto">Tirar foto</button>':'')+
            (!temAss?'<button class="bt vazio pequeno" id="enIrAss">Capturar assinatura</button>':'')+
            '</div>'+
            '<div class="pequeno">A entrega pode ser lançada assim mesmo. O que falta fica '+
            'escrito na ficha, em vez de a ficha dizer que teve o que não teve.</div>'
          : '');
      var bf = document.getElementById("enIrFoto");
      if(bf) bf.addEventListener("click", function(){ ir("foto"); });
      var ba = document.getElementById("enIrAss");
      if(ba) ba.addEventListener("click", function(){ ir("cadastrarAss"); });
    });
  }

  function lancar(botao){
    var escolhidos = noCarrinho();
    var aviso = document.getElementById("enAvisoE");
    if(!escolhidos.length) return;
    if(!mat){
      aviso.innerHTML = '<div class="aviso vermelho">Esta pessoa está sem matrícula no '+
        'cadastro. A ficha de EPI é achada pela matrícula — cadastre antes de entregar.</div>';
      return;
    }
    botao.disabled = true;
    aviso.innerHTML = '<div class="aviso cinza">Conferindo a assinatura no servidor antes de '+
      'tirar o material do estoque.</div>';

    /* a assinatura é revalidada AGORA, como na confirmação de entrega:
       o que fica registrado é a versão de agora, não a de quando a
       tela abriu */
    lerAssinaturaCadastrada(CAMPO.pessoa).then(function(cad){
      var temAss = cad && cad.ok && cad.tem && lim(cad.dados.imagem);
      var comoAssinou = temAss
        ? "assinatura do cadastro, validada no servidor em "+new Date().toISOString()
        : "sem assinatura cadastrada no momento da entrega";
      var entregues = [], semBaixa = [], semFicha = [];
      var t0 = Date.now();

      function umItem(k){
        if(k >= escolhidos.length) return Promise.resolve();
        var e = escolhidos[k];
        var feitos = k;
        var ms = feitos ? (Date.now()-t0)/feitos : 0;
        botao.textContent = "Lançando "+(k+1)+" de "+escolhidos.length+
          (ms ? " · faltam uns "+Math.round((escolhidos.length-k)*ms/1000)+" s" : "")+"…";

        /* 1º O ESTOQUE. É ele que é escasso. */
        return api("estoque","saida",{
          sku: e.sku, qtd: e.qtd, documento: "EPI "+mat
        }).then(function(rs){
          /* [campo 25] mesma regra da entrada */
          if(rs && rs.ok) estoqueMudou();
          if(!rs || !rs.ok){
            semBaixa.push({item:e.item, motivo: lim(rs && rs.mensagem) || "o Core não explicou"});
            return null;
          }
          /* 2º A FICHA, só depois que o material saiu de verdade. */
          return api("epi","salvar",{
            colaborador: nome,
            matricula: mat,
            cargo: lim(c.cargo),
            setor: lim(c.setor),
            sku: e.sku,
            item: e.item,
            qtd: e.qtd,
            entrega: new Date().toISOString().slice(0,10),
            status: "ENTREGUE",
            assinatura: comoAssinou,
            origem: "ALMOXA_CAMPO"
          }).then(function(rf){
            if(rf && rf.ok) entregues.push(e);
            else semFicha.push({item:e.item, qtd:e.qtd,
              motivo: lim(rf && rf.mensagem) || "o Core não explicou"});
          });
        }).then(function(){ return umItem(k+1); });
      }

      umItem(0).then(function(){
        botao.disabled = false;
        botao.textContent = "Lançar a entrega";
        escolhidos.forEach(function(e){
          if(entregues.indexOf(e) > -1) delete CAMPO.carrinho[e.sku];
        });
        /* o estoque mudou: a próxima tela não pode mostrar saldo velho */
        CAMPO.catalogo = null;
        mostrarResultado(entregues, semBaixa, semFicha, temAss);
      });
    });
  }

  function mostrarResultado(entregues, semBaixa, semFicha, temAss){
    var deuTudo = entregues.length && !semBaixa.length && !semFicha.length;
    /* [campo 24] mesma regra da nota: o rascunho sai quando o material
       saiu do estoque de verdade. */
    if(entregues.length) limparRascunho();
    pintar(
      '<div class="cartao">'+
      (deuTudo
        ? '<div class="aviso verde"><b>Entrega lançada</b>'+
          entregues.length+' EPI(s) para '+esc(nome)+'. O material saiu do estoque e a '+
          'ficha foi gravada — já aparece no computador, é o mesmo servidor.</div>'
        : '<div class="aviso '+(entregues.length?"amarelo":"vermelho")+'"><b>'+
          (entregues.length ? "Entrega lançada EM PARTE" : "NADA foi lançado")+'</b>'+
          (entregues.length ? entregues.length+' item(ns) entraram na ficha. ' : '')+
          'Veja abaixo o que não entrou e por quê.</div>')+

      (entregues.length
        ? '<b class="small">ENTROU NA FICHA</b>'+
          entregues.map(function(e){
            return '<div class="item-linha"><div class="item-txt"><b>'+esc(e.item)+'</b>'+
              '<div class="pequeno">'+esc(e.sku)+' · '+e.qtd+' un.</div></div></div>';
          }).join("")
        : '')+

      (semBaixa.length
        ? '<b class="small">NÃO SAIU DO ESTOQUE — e por isso NÃO virou ficha</b>'+
          semBaixa.map(function(f){
            return '<div class="item-linha"><div class="item-txt"><b>'+esc(f.item)+'</b>'+
              '<div class="pequeno">'+esc(f.motivo)+'</div></div></div>';
          }).join("")+
          '<div class="pequeno">Isto é de propósito: ficha sem baixa faz o estoque mentir.</div>'
        : '')+

      (semFicha.length
        ? '<div class="aviso vermelho"><b>ATENÇÃO — saiu do estoque e a ficha NÃO gravou</b>'+
          semFicha.map(function(f){
            return esc(f.item)+' ('+f.qtd+' un.): '+esc(f.motivo);
          }).join("<br>")+
          '<br>O material já saiu do saldo. Resolva no computador antes de entregar de novo, '+
          'senão a baixa acontece duas vezes.</div>'
        : '')+

      (!temAss
        ? '<div class="aviso amarelo">A ficha foi gravada com <b>sem assinatura cadastrada</b> '+
          'escrito nela. Capture a assinatura e a próxima entrega já sai com ela.</div>'
        : '')+

      '<button class="bt verde" id="enVerFicha">Ver a ficha de EPI</button>'+
      '<button class="bt vazio" id="enOutra">Lançar outra entrega</button>'+
      '</div>');
    document.getElementById("enVerFicha").addEventListener("click", function(){ ir("ficha"); });
    document.getElementById("enOutra").addEventListener("click", function(){ ir("entregar"); });
  }
};
</script>

<script>
/**
 * A FOLHA QUE VIRA PDF.
 * A assinatura do colaborador vem do CADASTRO dele — a ficha não tem
 * cópia própria. Quem não tem assinatura cadastrada sai com a linha
 * em branco e "Assinatura pendente" escrito embaixo, para assinar à
 * mão: a ficha nunca deixa de sair por falta de assinatura.
 */
function gerarFolha(f, cadastro, entrega, pessoa){
  var agora = new Date().toLocaleString("pt-BR");
  var itens = f.itens || [];
  var foto = lim(f.foto) || lim(pessoa && pessoa.foto);
  var numero = "EPI-" + chaveDaFicha(f).split(":").pop();
  var temAss = cadastro && cadastro.tem && lim(cadastro.dados.imagem);

  function cel(rot, val){
    return '<div class="fl-cel"><small>'+esc(rot)+'</small><b>'+esc(lim(val)||"—")+'</b></div>';
  }
  function bloco(titulo, numeroBloco, nome, imagem, nota){
    return '<div class="fl-bloco">'+
      (imagem ? '<img class="fl-img" src="'+esc(imagem)+'" alt="">' : '')+
      '<div class="fl-linha"><b>'+esc(lim(nome)||"—")+'</b>'+
      '<small>'+esc(numeroBloco+" · "+titulo)+'</small>'+
      '<div class="fl-nota">'+nota+'</div>'+
      '</div></div>';
  }

  var notaColab = temAss
    ? "Assinatura cadastrada em "+esc(quando(cadastro.dados.cadastradaEm))+
      (comoEmPalavras(cadastro.dados.comoIdentificou) ? "<br>"+esc(comoEmPalavras(cadastro.dados.comoIdentificou)) : "")+
      "<br>assinatura desenhada em tela, não biométrica"
    : "Assinatura pendente — assinar à mão";

  var notaEntrega = entrega
    ? "Entrega confirmada em "+esc(quando(entrega.quando))+
      (lim(entrega.confirmadaPor) ? " por "+esc(entrega.confirmadaPor) : "")
    : "Entrega ainda não confirmada no sistema";

  document.getElementById("folha").innerHTML =
    '<div class="fl">'+
      '<div class="fl-topo">'+
        (foto ? '<img class="fl-foto" src="'+esc(foto)+'" alt="">' : '<div class="fl-foto"></div>')+
        '<div style="flex:1">'+
          '<h1>COMPROVANTE DE ENTREGA DE EPI</h1>'+
          '<div class="em">COESA ENGENHARIA · documento gerado pelo ALMOXA CAMPO</div>'+
          '<div class="em">Ficha '+esc(numero)+' · emitido em '+esc(agora)+'</div>'+
        '</div>'+
      '</div>'+

      '<div class="fl-grade">'+
        cel("Colaborador", lim(f.nome||f.colaborador))+
        cel("Matrícula", lim(f.matricula))+
        cel("Função", lim(f.cargo))+
        cel("Setor / frente", lim(f.setor))+
        cel("Crachá", lim(pessoa && pessoa.codigo))+
        cel("Itens entregues", itens.length)+
      '</div>'+

      /* A COLUNA RECEBIMENTO, ITEM POR ITEM.
         A data e a rubrica ficam na linha do próprio EPI — é ali que
         o fiscal olha. O bloco 07, embaixo, continua existindo: um
         não substitui o outro. */
      '<div class="fl-tit">01 · ITENS DE EPI ENTREGUES</div>'+
      '<table class="fl-tab"><thead><tr>'+
        '<th style="width:22px">#</th><th>DESCRIÇÃO DO EPI</th><th style="width:64px">CÓDIGO</th>'+
        '<th style="width:48px">CA</th><th style="width:30px">QTD</th><th style="width:58px">ENTREGA</th>'+
        '<th style="width:88px">RECEBIMENTO</th>'+
      '</tr></thead><tbody>'+
      (itens.length
        ? itens.map(function(i,k){
            var antes = temAss && ehAntesDaAssinatura(i, cadastro);
            return '<tr><td>'+(k+1)+'</td><td>'+esc(lim(i.epi||i.descricao))+'</td>'+

          }).join("")

        bloco("APROVAÇÃO DO GESTOR","06", entrega && entrega.gestor, "", "")+

          : 'Colaborador sem assinatura cadastrada: assinar à mão.')+'</span>'+
      '</div>'+
    '</div>';
}


/* ============================================================
 * [campo 14] ENTREGA E BAIXA DE EQUIPAMENTOS — TI
 * ------------------------------------------------------------
 * O QUE ESTA PARTE FAZ E O QUE ELA NAO FAZ
 *
 * FAZ: pede a senha de novo, manda o servidor conferir quem e a
 * pessoa, qual a sessao, qual o perfil e se ela tem a permissao de
 * dar baixa. Le o QR, o codigo de barras ou o serial. Mostra o
 * equipamento, o patrimonio, a cautela e a assinatura, e diz, uma
 * por uma, quais condicoes da entrega ja estao cumpridas.
 *
 * NAO FAZ: a baixa. De proposito, e esta versao nao tem o botao
 * ligado. Hoje a RESERVA guarda  {sku, qtd}  e nunca o numero de
 * patrimonio da unidade — entao o servidor nao tem como responder
 * "esta unidade e a que esta reservada para o Joao", so "existe uma
 * reserva de 1 notebook para o Joao". Dar baixa em cima disso seria
 * um selo verde que nao prova nada, e o item 18.3 proibe baixa sem
 * validacao da reserva. O botao so vai ser ligado depois que a
 * reserva passar a apontar para a unidade (item 10 do projeto).
 *
 * NAO TEM SENHA NENHUMA AQUI DENTRO. Quem autoriza e o servidor.
 * Um botao escondido nao e seguranca; a conferencia e no Core, e
 * toda tentativa — certa ou errada — fica gravada la.
 * ============================================================ */

var TI = {
  ticket: null,      /* o comprovante da reautorizacao, dado pelo servidor */
  ate: 0,            /* ate quando ele vale, em milissegundos */
  achado: null,      /* o que o servidor devolveu sobre o equipamento */
  leitor: null       /* a camera do leitor de codigo, quando ligada */
};

function tiAutorizado(){
  return !!(TI.ticket && TI.ate && Date.now() < TI.ate);
}

function tiSair(motivo){
  TI.ticket = null; TI.ate = 0; TI.achado = null;
  tiPararLeitor();
  if(motivo) CAMPO.recadoTI = motivo;
}

function tiPararLeitor(){
  try{
    if(TI.leitor && TI.leitor.getTracks){
      TI.leitor.getTracks().forEach(function(t){ t.stop(); });
    }
  }catch(e){}
  TI.leitor = null;
  if(TI.laco){ clearInterval(TI.laco); TI.laco = null; }
}

/* ============================================================
 * TELA — REAUTENTICAR
 * ============================================================ */
TELAS.tiEntrar = function(){
  var recado = CAMPO.recadoTI; CAMPO.recadoTI = null;
  var quem = (CAMPO.usuario && (CAMPO.usuario.nome || CAMPO.usuario.usuario)) || "";
  var login = lim(lerGuardado("user"));

  pintar(
    (recado ? '<div class="aviso '+esc(recado.tipo||"amarelo")+'"><b>'+esc(recado.titulo||"")+'</b>'+
       esc(recado.texto||"")+'</div>' : '')+
    '<div class="cartao">'+
      '<h2>Entrega e Baixa — TI</h2>'+
      '<p class="ajuda">Esta area e restrita. Confirme a sua senha: quem autoriza e o '+
        'servidor, e toda tentativa fica registrada.</p>'+
      (quem ? '<div class="aviso cinza"><b>'+esc(quem)+'</b>'+
        'Entrando como voce ja esta logado. Se nao for voce, saia do aplicativo.</div>' : '')+
      '<div class="campo"><label>Usuario</label>'+
        '<input type="text" id="tiUser" autocomplete="username" value="'+esc(login)+'"></div>'+
      '<div class="campo"><label>Senha</label>'+
        '<input type="password" id="tiSenha" autocomplete="current-password"></div>'+
      '<button class="bt laranja" id="tiEntrarBt">Entrar na area de TI</button>'+
      '<button class="bt vazio" id="tiVoltarBt">Voltar</button>'+
      '<div id="tiAviso"></div>'+
    '</div>', "entrega e baixa");

  function entrar(){
    var b = document.getElementById("tiEntrarBt");
    var aviso = document.getElementById("tiAviso");
    var u = lim(document.getElementById("tiUser").value);
    var s = document.getElementById("tiSenha").value || "";
    if(!u || !s){
      aviso.innerHTML = '<div class="aviso amarelo">Informe o usuario e a senha.</div>';
      return;
    }
    b.disabled = true; b.textContent = "Conferindo…";
    api("entrega","autorizar",{usuario:u, senha:s}).then(function(r){
      b.disabled = false; b.textContent = "Entrar na area de TI";
      document.getElementById("tiSenha").value = "";
      if(!r || !r.ok){
        if(/MODULO|nao existe|não existe|desconhecid/i.test(String((r&&r.codigo)||"")+" "+String((r&&r.mensagem)||""))){
          aviso.innerHTML = '<div class="aviso amarelo"><b>Area de TI ainda nao instalada</b>'+
            'O servidor ainda nao tem o modulo de entrega. Cole o arquivo '+
            'ALMOXA_PRO_Modulo_Entrega.gs no projeto da planilha e publique uma nova versao. '+
            'O resto do aplicativo continua funcionando normalmente.</div>';
          return;
        }
        aviso.innerHTML = avisoErro(r);
        return;
      }
      var d = r.dados || {};
      if(!lim(d.ticket)){
        aviso.innerHTML = '<div class="aviso vermelho"><b>Autorizou sem comprovante</b>'+
          'O servidor disse que sim mas nao devolveu o comprovante da autorizacao. '+
          'Sem ele eu nao sigo — seria confiar na palavra da tela.</div>';
        return;
      }
      TI.ticket = lim(d.ticket);
      TI.ate = Date.now() + (Number(d.valePorSegundos) || 600) * 1000;
      ir("tiBuscar");
    });
  }

  document.getElementById("tiEntrarBt").addEventListener("click", entrar);
  document.getElementById("tiVoltarBt").addEventListener("click", function(){ ir("inicio"); });
  document.getElementById("tiSenha").addEventListener("keydown", function(e){
    if(e.key === "Enter") entrar();
  });
};


/* ============================================================
 * TELA — LER O EQUIPAMENTO
 * ============================================================ */
TELAS.tiBuscar = function(){
  if(!tiAutorizado()){
    tiSair({tipo:"amarelo", titulo:"A autorizacao venceu", texto:"Confirme a senha de novo."});
    ir("tiEntrar");
    return;
  }

  pintar(
    '<div class="cartao">'+
      '<h2>Buscar equipamento</h2>'+
      '<p class="ajuda">Leia o QR Code da etiqueta, o codigo de barras, ou digite o '+
        'numero de patrimonio ou o numero de serie.</p>'+
      '<div class="linha">'+
        '<button class="bt vazio pequeno" id="tiQR">Ler codigo</button>'+
        '<button class="bt vazio pequeno" id="tiDigitar">Digitar</button>'+
      '</div>'+
      '<div id="tiPalco"></div>'+
      '<input type="file" id="tiCam" accept="image/*" capture="environment" hidden>'+
      '<div class="campo" id="tiCaixa" style="display:none">'+
        '<label>Patrimonio ou numero de serie</label>'+
        '<input type="text" id="tiCodigo" autocomplete="off" inputmode="text">'+
      '</div>'+
      '<button class="bt laranja" id="tiBuscarBt">Buscar</button>'+
      '<button class="bt vazio" id="tiSairBt">Sair da area de TI</button>'+
      '<div id="tiAviso2"></div>'+
    '</div>'+
    /* [39] O QUE JA ESTA CAUTELADO, pronto para escolher.
       Digitar patrimonio de cabeca e o jeito mais lento e o mais
       facil de errar. A lista sai das cautelas do servidor. */
    '<div class="cartao" id="tiCautelados">'+
      '<b class="small">EQUIPAMENTOS CAUTELADOS</b>'+
      '<div class="carregando" style="padding:14px"><div class="giro"></div>'+
      'Buscando o que já está cautelado…</div>'+
    '</div>', "entrega e baixa");

  var palco = document.getElementById("tiPalco");
  var caixa = document.getElementById("tiCaixa");
  var aviso = document.getElementById("tiAviso2");
  /* [39] a lista do que ja esta cautelado */
  pintarCautelados_(function(codigo){ buscar(codigo); });

  var tiCam = document.getElementById("tiCam");
  if(tiCam) tiCam.addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f){
      /* a pessoa abriu a camera e voltou sem tirar foto */
      palco.innerHTML = "";
      mostrarCaixa();
      return;
    }
    lerFotoDoArquivo_(f);
  });

  function mostrarCaixa(){
    tiPararLeitor();
    palco.innerHTML = "";
    caixa.style.display = "";
    document.getElementById("tiCodigo").focus();
  }

  /* O LEITOR DE CODIGO DE VERDADE.
     Uso o BarcodeDetector do proprio navegador. Se o aparelho nao
     tiver, eu DIGO que nao tem e abro a digitacao — nao finjo um
     leitor que nao existe. */
  function lerCodigo(){
    caixa.style.display = "none";

    /* [36] TRES CAMINHOS, do mais provavel para o menos.
       O "Permission denied" que ele viu e a camera AO VIVO sendo
       bloqueada pelo WebView. Mas a camera do SELETOR DE ARQUIVO
       abre normal nesse mesmo aparelho — e a prova e a tela da nota
       fiscal, que ele disse que abriu sem problema. Entao agora:
         1. a ponte do aplicativo, se existir;
         2. o seletor de arquivo com camera — o caminho da nota;
         3. a camera ao vivo, como antes.
       E sempre sobra digitar. */
    if(camTemPonte_()){
      aviso.innerHTML = "";
      palco.innerHTML = '<div class="carregando"><div class="giro"></div>'+
        'Abrindo a camera do aparelho…</div>';
      lerCodigoPelaFoto_().then(function(valor){
        palco.innerHTML = '<div class="aviso verde"><b>Codigo lido</b>'+esc(valor)+'</div>';
        buscar(valor);
      }, function(e){
        palco.innerHTML = "";
        aviso.innerHTML = '<div class="aviso amarelo"><b>Nao consegui ler pela foto</b>'+
          esc(String(e&&e.message||e))+
          '<br>Vou tentar pela camera do proprio aparelho.</div>';
        abrirCameraDoAparelho_();
      });
      return;
    }

    /* [36] o caminho da nota fiscal: abre a camera do Android pelo
       seletor. Nao depende de permissao de camera no WebView. */
    abrirCameraDoAparelho_();
  }

  function abrirCameraDoAparelho_(){
    var cam = document.getElementById("tiCam");
    if(!cam){ lerPelaCameraAoVivo_(); return; }
    palco.innerHTML = '<div class="aviso cinza" style="margin:0">'+
      'Abrindo a camera… tire a foto da etiqueta, bem de frente e com luz.</div>';
    cam.value = "";
    cam.click();
  }

  function lerFotoDoArquivo_(arquivo){
    if(!arquivo) return;
    palco.innerHTML = '<div class="carregando"><div class="giro"></div>'+
      'Procurando o codigo na foto…</div>';
    if(typeof window.BarcodeDetector !== "function"){
      palco.innerHTML = "";
      aviso.innerHTML = '<div class="aviso amarelo"><b>Este aparelho nao le codigo pela foto</b>'+
        'O navegador deste celular nao tem o leitor embutido. A foto saiu, mas quem le o '+
        'codigo nao existe aqui. Digite o patrimonio ou o numero de serie — da no mesmo.</div>';
      mostrarCaixa();
      return;
    }
    var detector;
    try{
      detector = new window.BarcodeDetector({
        formats:["qr_code","code_128","code_39","ean_13","ean_8","itf","codabar"]
      });
    }catch(e){
      palco.innerHTML = "";
      aviso.innerHTML = '<div class="aviso amarelo"><b>O leitor nao abriu</b>'+
        esc(String(e&&e.message||e))+'<br>Digite o codigo.</div>';
      mostrarCaixa();
      return;
    }
    createImageBitmap(arquivo).then(function(img){
      return detector.detect(img);
    }).then(function(achados){
      var valor = lim(achados && achados[0] && achados[0].rawValue);
      if(!valor){
        palco.innerHTML = "";
        aviso.innerHTML = '<div class="aviso amarelo"><b>Nao achei codigo nesta foto</b>'+
          'Chegue mais perto da etiqueta, de frente, com luz. Ou digite o codigo.</div>';
        mostrarCaixa();
        return;
      }
      palco.innerHTML = '<div class="aviso verde"><b>Codigo lido</b>'+esc(valor)+'</div>';
      buscar(valor);
    }, function(e){
      palco.innerHTML = "";
      aviso.innerHTML = '<div class="aviso amarelo"><b>Nao consegui abrir a foto</b>'+
        esc(String(e&&e.message||e))+'<br>Digite o codigo.</div>';
      mostrarCaixa();
    });
  }

  function lerPelaCameraAoVivo_(){
    if(typeof window.BarcodeDetector !== "function"){
      aviso.innerHTML = '<div class="aviso amarelo"><b>Este aparelho nao le codigo pela camera</b>'+
        'O navegador deste celular nao tem o leitor embutido. Digite o patrimonio ou o '+
        'numero de serie — da no mesmo.</div>';
      mostrarCaixa();
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      aviso.innerHTML = '<div class="aviso amarelo"><b>A camera nao esta disponivel</b>'+
        'Digite o patrimonio ou o numero de serie.</div>';
      mostrarCaixa();
      return;
    }

    aviso.innerHTML = "";
    palco.innerHTML = '<div class="carregando"><div class="giro"></div>Ligando a camera…</div>';

    var detector;
    try{
      detector = new window.BarcodeDetector({
        formats:["qr_code","code_128","code_39","ean_13","ean_8","itf","codabar"]
      });
    }catch(e){
      palco.innerHTML = "";
      aviso.innerHTML = '<div class="aviso amarelo"><b>O leitor nao abriu</b>'+
        esc(String(e&&e.message||e))+'<br>Digite o codigo.</div>';
      mostrarCaixa();
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}, width:{ideal:1280}}, audio:false
    }).then(function(fluxo){
      /* [36] a camera ao vivo e o ultimo recurso; quando ela abre,
         continua funcionando como sempre funcionou */
      TI.leitor = fluxo;
      palco.innerHTML = '<video id="tiVideo" playsinline autoplay muted '+
        'style="width:100%;border-radius:12px;background:#000"></video>'+
        '<p class="ajuda" style="margin-top:6px">Aponte para a etiqueta.</p>';
      var v = document.getElementById("tiVideo");
      v.srcObject = fluxo;
      TI.laco = setInterval(function(){
        if(!TI.leitor) return;
        detector.detect(v).then(function(achados){
          if(!achados || !achados.length) return;
          var valor = lim(achados[0].rawValue);
          if(!valor) return;
          tiPararLeitor();
          palco.innerHTML = '<div class="aviso verde"><b>Codigo lido</b>'+esc(valor)+'</div>';
          buscar(valor);
        }, function(){});
      }, 400);
    }, function(e){
      palco.innerHTML = "";
      aviso.innerHTML = '<div class="aviso amarelo"><b>A camera ao vivo nao abriu</b>'+
        esc(String(e&&e.message||e))+
        '<br>Isso e comum dentro do aplicativo. Use <b>Ler codigo</b> de novo para '+
        'tirar uma foto da etiqueta, ou digite o patrimonio.</div>';
      mostrarCaixa();
    });
  }

  /* [34] tira a foto pela ponte e procura o codigo dentro dela */
  function lerCodigoPelaFoto_(){
    return camTirarFoto({}).then(function(f){
      if(typeof window.BarcodeDetector !== "function"){
        throw new Error("este aparelho nao tem leitor de codigo embutido no navegador");
      }
      var detector = new window.BarcodeDetector({
        formats:["qr_code","code_128","code_39","ean_13","ean_8","itf","codabar"]
      });
      return fetch(f.base64).then(function(r){ return r.blob(); })
        .then(function(b){ return createImageBitmap(b); })
        .then(function(img){ return detector.detect(img); })
        .then(function(achados){
          var valor = lim(achados && achados[0] && achados[0].rawValue);
          if(!valor) throw new Error("nenhum codigo reconhecido nesta foto");
          return valor;
        });
    });
  }

  function buscar(codigo){
    codigo = lim(codigo || (document.getElementById("tiCodigo")||{}).value);
    if(!codigo){
      aviso.innerHTML = '<div class="aviso amarelo">Leia ou digite o codigo do equipamento.</div>';
      mostrarCaixa();
      return;
    }
    tiPararLeitor();
    carregando("Procurando o equipamento…");
    api("entrega","conferir",{ticket:TI.ticket, codigo:codigo}).then(function(r){
      if(!r || !r.ok){
        if(/TICKET/i.test(String((r&&r.codigo)||""))){
          tiSair({tipo:"amarelo", titulo:"A autorizacao venceu",
            texto:"Confirme a senha de novo para continuar."});
          ir("tiEntrar");
          return;
        }
        TELAS.tiBuscar();
        document.getElementById("tiAviso2").innerHTML = avisoErro(r);
        return;
      }
      TI.achado = r.dados || {};
      ir("tiEquipamento");
    });
  }

  document.getElementById("tiQR").addEventListener("click", lerCodigo);
  document.getElementById("tiDigitar").addEventListener("click", function(){
    aviso.innerHTML = "";
    mostrarCaixa();
  });
  document.getElementById("tiBuscarBt").addEventListener("click", function(){ buscar(); });
  document.getElementById("tiSairBt").addEventListener("click", function(){
    tiSair(null);
    ir("pessoas");
  });
  document.getElementById("tiCodigo").addEventListener("keydown", function(e){
    if(e.key === "Enter") buscar();
  });
};


/* ============================================================
 * TELA — O EQUIPAMENTO E AS CONDICOES DA ENTREGA

        : '<div class="aviso amarelo"><b>Sem destinatario identificado</b>'+

    /* [41] OS DOCUMENTOS DESTE EQUIPAMENTO, AQUI MESMO.

/* ============================================================

(function cautelasNoCampo() {

  var CT_LINHAS_FOLHA_1 = 14;

  /* ============================================================
     4. O DOCUMENTO — HTML
     Cada quadro e uma celula de tabela de verdade. Nada de texto
     solto por cima da folha: era exatamente isso que o modelo antigo
     fazia de errado.

  function ctPaginar(itens) {
    var folhas = [];
    var resto = itens.slice();
    folhas.push(resto.splice(0, CT_LINHAS_FOLHA_1));
    while (resto.length) folhas.push(resto.splice(0, CT_LINHAS_FOLHA_N));
    return folhas;
  }

  function CT_DOCUMENTO(c, pessoa, rubrica, empresa) {
    c = c || {};
    pessoa = pessoa || {};
    empresa = empresa || {};

    var itens = lista_(c.itens);
    var folhas = ctPaginar(itens);

    function campo(rot, val) {

    function tabelaDeItens(doFolha, deslocamento, linhasEmBranco) {

        '<div class="ct-risco"></div>' +

    }).join("");

  function CT_IMPRIMIR(c, pessoa, rubrica, empresa) {

    caixa.id = "ctImpressao";

    setTimeout(function () { window.print(); }, 120);

  /* ============================================================

     a mesma construção e mando o resto para a folha complementar,
     que é o que o item 3 do projeto permite.
