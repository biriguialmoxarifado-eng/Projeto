/* limpar o que está na barra do celular */
function limparAvisosDoCelular_() {
  if (!ANDROID.tem) return;
  try {
    if (typeof window.AndroidAPI.cancelAllNotifications === "function") {
      window.AndroidAPI.cancelAllNotifications();
    } else if (typeof window.AndroidAPI.cancelNotification === "function") {
      ANDROID.ids.forEach(function (id) {
        try { window.AndroidAPI.cancelNotification(id); } catch (e) {}
      });
    }
    ANDROID.ids = [];
    try { guardar("avisosIds", "[]"); } catch (e) {}
  } catch (e) { /* limpar nunca pode quebrar a tela */ }
}


/* ============================================================
 * [campo 30] AS NOTAS JÁ LANÇADAS, E O VÍNCULO COM A APROVAÇÃO
 * ------------------------------------------------------------
 *  1. AS NOTAS      nf.listar — as mesmas notas que o ALMOX-PRO do
 *                   computador mostra. Abrir uma nota busca os
 *                   produtos dela em nfed.itens e, se esse arquivo
 *                   não estiver instalado, em nf.itens.
 *
 *  2. A APROVAÇÃO   O pedido e a aprovação se ligam pelo PROTOCOLO:
 *                   é por ele que o Centro de Aprovações do
 *                   computador decide (aprovacoes.decidir {protocolo}).
 *                   Então, depois de enviar, eu PROCURO o protocolo
 *                   em aprovacoes.pendentes e digo se ele chegou lá.
 *                   Sem essa conferência, "foi para aprovação" seria
 *                   suposição minha — e suposição não vale.
 * ============================================================ */

var NOTASC = { lista: null, quando: 0, erro: "" };

/* ---------- as notas que já foram lançadas ---------- */
TELAS.notas = function () {
  CAMPO.abaAtual = "notas";
  carregando("Lendo as notas lançadas…");
  api("nf", "listar", {}).then(function (r) {
    if (!r || !r.ok) {
      pintar('<div class="cartao"><h2>Notas lançadas</h2>' + avisoErro(r) +
        '<p class="ajuda">As notas são lidas pela ação ' +
        '<span class="mono">nf.listar</span> — a mesma do computador.</p></div>', "notas");
      return;
    }
    NOTASC.lista = comoListaCore(r.dados);
    NOTASC.quando = Date.now();
    var lista = NOTASC.lista.slice().sort(function (a, b) {
      return String(b.entrada || b.emissao || "").localeCompare(
             String(a.entrada || a.emissao || ""));
    });
    var valem = lista.filter(function (n) {
      return lim(n.status).toUpperCase() !== "EXCLUIDA"; });
    var total = valem.reduce(function (s, n) { return s + (Number(n.valor) || 0); }, 0);

    pintar(
      '<div class="cartao">' +
        '<h2>Notas lançadas</h2>' +
        '<p class="ajuda">' + valem.length + ' nota(s) · ' + moedaBR(total) + '</p>' +
        '<input type="search" class="campo" id="nlBusca" ' +
        'placeholder="Buscar por número, fornecedor ou chave…">' +
      '</div>' +
      '<div id="nlLista">' + (lista.length
        ? lista.slice(0, 50).map(cartaoDaNota_).join("")
        : '<div class="cartao"><b>Nenhuma nota ainda</b>' +
          '<p class="ajuda">O servidor respondeu, mas a lista veio vazia.</p></div>') +
      '</div>', "notas");

    function redesenhar(t) {
      var f = !t ? lista : lista.filter(function (n) {
        var alvo = [n.numero, n.fornecedor, n.chave, n.cnpj, n.status].join(" ").toLowerCase();
        return alvo.indexOf(t.toLowerCase()) > -1;
      });
      document.getElementById("nlLista").innerHTML = f.length
        ? f.slice(0, 50).map(cartaoDaNota_).join("")
        : '<div class="cartao"><b>Nenhuma nota com esse texto</b></div>';
      ligarLinhasDeNota_();
    }
    var busca = document.getElementById("nlBusca");
    var tmp = null;
    busca.addEventListener("input", function () {
      clearTimeout(tmp);
      tmp = setTimeout(function () { redesenhar(lim(busca.value)); }, 240);
    });
    ligarLinhasDeNota_();
  });
};

function quantosItensDaNota_(n) {
  if (Array.isArray(n.listaItens) && n.listaItens.length) return n.listaItens.length;
  if (typeof n.itens === "number") return n.itens;
  if (Array.isArray(n.itens)) return n.itens.length;
  if (typeof n.itens === "string" && /^\d+$/.test(n.itens.trim())) return Number(n.itens.trim());
  return null;
}

function cartaoDaNota_(n) {
  var st = lim(n.status).toUpperCase();
  var cor = st === "EXCLUIDA" ? "nao" : "sim";
  var q = quantosItensDaNota_(n);
  return '<button class="pessoa" data-nota="' + esc(lim(n.numero)) + '" ' +
    'data-serie="' + esc(lim(n.serie)) + '">' +
    '<div class="retrato">&#9783;</div>' +
    '<div class="item-txt"><span class="nome">' +
      esc(lim(n.fornecedor) || "(sem fornecedor)") + '</span>' +
    '<span class="det mono">NF ' + esc(lim(n.numero)) +
      (lim(n.serie) ? ' · série ' + esc(lim(n.serie)) : '') + '</span>' +
    '<span class="det">' + moedaBR(n.valor) +
      (q === null ? '' : ' · ' + q + ' item(ns)') + '</span>' +
    '</div>' +
    '<span class="selo ' + cor + '">' +
      esc(st.replace(/_/g, " ").toLowerCase() || "sem status") + '</span>' +
    '</button>';
}

function ligarLinhasDeNota_() {
  document.querySelectorAll("[data-nota]").forEach(function (b) {
    b.addEventListener("click", function () {
      ir("notaDet", { numero: b.getAttribute("data-nota"),
                      serie: b.getAttribute("data-serie") });
    });
  });
}

/* ---------- uma nota, com os produtos dela ---------- */
TELAS.notaDet = function (ident) {
  ident = ident || {};
  var n = (NOTASC.lista || []).filter(function (x) {
    return lim(x.numero) === lim(ident.numero); })[0] || { numero: ident.numero };
  carregando("Buscando os produtos da nota…");

  /* o arquivo de edição primeiro: ele conhece a aba de itens e sabe
     o que foi retirado da nota. Sem ele, o caminho antigo. */
  api("nfed", "itens", { numero: ident.numero, serie: ident.serie })
    .then(function (r) {
      if (r && r.ok && (comoListaCore(r.dados).length || lim(r.codigo) === "SEM_ITENS_VALIDOS")) {
        return { r: r, via: "nfed.itens" };
      }
      return api("nf", "itens", { numero: ident.numero, serie: ident.serie })
        .then(function (r2) { return { r: r2, via: "nf.itens" }; });
    })
    .then(function (res) {
      var r = res.r;
      var itens = itensDaRespostaCampo_(r);
      var soma = itens.reduce(function (s, i) {
        return s + (Number(i.valorTotal) ||
                   (Number(i.qtd) || 0) * (Number(i.valorUnitario) || 0)); }, 0);
      soma = Math.round(soma * 100) / 100;
      var declarado = Number(n.valor) || 0;

      pintar(
        '<div class="cartao">' +
          '<h2>NF ' + esc(lim(n.numero)) + '</h2>' +
          '<p class="ajuda">' + esc(lim(n.fornecedor) || "(sem fornecedor)") +
            (lim(n.serie) ? ' · série ' + esc(lim(n.serie)) : '') + '</p>' +
          '<div class="det-linhas">' +
            linhaDet_("Valor da nota", moedaBR(declarado)) +
            linhaDet_("Emissão", lim(n.emissao) || "—") +
            linhaDet_("Entrada", lim(n.entrada) || "—") +
            linhaDet_("Situação", lim(n.status) || "—") +
          '</div>' +
        '</div>' +
        (itens.length
          ? '<div class="cartao">' +
              '<b class="small">PRODUTOS (' + itens.length + ')</b>' +
              itens.map(function (i) {
                return '<div class="car-linha">' +
                  '<div class="car-txt"><b>' +
                    esc(lim(i.descricao) || "(sem descrição)") + '</b>' +
                  '<small class="mono">' + esc(lim(i.sku || i.codigo)) + '</small></div>' +
                  '<div class="pequeno" style="text-align:right">' +
                    (Number(i.qtd) || 0) + ' ' + esc(lim(i.unidade) || "un") +
                    '<br>' + moedaBR(i.valorTotal ||
                      (Number(i.qtd) || 0) * (Number(i.valorUnitario) || 0)) +
                  '</div></div>';
              }).join("") +
              '<div class="det-linha" style="margin-top:6px">' +
                '<span>Soma dos produtos</span><b>' + moedaBR(soma) + '</b></div>' +
              (declarado && Math.abs(declarado - soma) > 0.02
                ? '<div class="aviso amarelo"><b>A soma não bate com a nota</b>' +
                  'A nota diz ' + moedaBR(declarado) + ' e os produtos somam ' +
                  moedaBR(soma) + '. Diferença de ' +
                  moedaBR(Math.abs(declarado - soma)) + '.</div>'
                : '') +
              '<p class="pequeno">lido de <span class="mono">' + esc(res.via) + '</span></p>' +
            '</div>'
          : '<div class="cartao"><b>Esta nota voltou sem produtos</b>' +
            '<p class="ajuda">' +
            esc(lim(r && r.mensagem) || "O servidor não devolveu os itens desta nota.") +
            ' Tentei por <span class="mono">' + esc(res.via) + '</span>.</p></div>'),
        "nota " + lim(n.numero));
    });
};

/* a resposta dos itens pode vir solta ou dentro de dados.itens, e os
   nomes dos campos variam — o mesmo cuidado que o computador faz */
function itensDaRespostaCampo_(r) {
  if (!r) return [];
  var d = (r.dados !== undefined) ? r.dados : r;
  var bruto = [];
  if (Array.isArray(d)) bruto = d;
  else if (d && typeof d === "object") {
    var nomes = ["itens", "listaItens", "lista", "produtos", "registros", "linhas"];
    for (var k = 0; k < nomes.length; k++) {
      if (Array.isArray(d[nomes[k]])) { bruto = d[nomes[k]]; break; }
    }
  }
  return bruto.filter(function (i) {
    /* produto retirado da nota não volta para a tela */
    var st = "";
    try {
      Object.keys(i || {}).forEach(function (c) {
        var ch = String(c).toLowerCase().replace(/[^a-z0-9]/g, "");
        if (ch === "status" || ch === "situacao") st = String(i[c] || "");
      });
    } catch (e) {}
    st = st.trim().toUpperCase();
    return st !== "EXCLUIDA" && st !== "EXCLUIDO" && st !== "INATIVO";
  }).map(function (i) {
    function pega(nomes) {
      var mapa = {};
      try {
        Object.keys(i).forEach(function (c) {
          mapa[String(c).toLowerCase().replace(/[^a-z0-9]/g, "")] = i[c];
        });
      } catch (e) {}
      for (var k = 0; k < nomes.length; k++) {
        var chave = nomes[k].toLowerCase().replace(/[^a-z0-9]/g, "");
        var v = mapa[chave];
        if (v !== undefined && v !== null && String(v) !== "") return v;
      }
      return "";
    }
    var qtd = Number(pega(["qtd", "quantidade", "qtde", "quant"])) || 0;
    var vu = Number(pega(["valorUnitario", "valorunitario", "vlrUnitario", "unitario"])) || 0;
    var vt = Number(pega(["valorTotal", "valortotal", "total"])) || 0;
    return {
      sku: lim(pega(["sku"])), codigo: lim(pega(["codigo", "cod"])),
      descricao: lim(pega(["descricao", "produto", "item", "nome"])),
      unidade: lim(pega(["unidade", "und", "um"])) || "un",
      qtd: qtd,
      valorUnitario: vu || (qtd ? Math.round(vt / qtd * 100) / 100 : 0),
      valorTotal: vt || Math.round(qtd * vu * 100) / 100
    };
  });
}

/* ============================================================
 * [30] O VÍNCULO COM A APROVAÇÃO, CONFERIDO
 * ------------------------------------------------------------
 * O Centro de Aprovações do computador decide pelo PROTOCOLO
 * (aprovacoes.decidir {protocolo}). Então procurar o protocolo em
 * aprovacoes.pendentes é a prova de que o pedido chegou lá.
 * ============================================================ */
function conferirNaAprovacao(protocolo) {
  if (!lim(protocolo)) {
    return Promise.resolve({ sei: false,
      texto: "o servidor não devolveu protocolo, então não tenho como procurar" });
  }
  return api("aprovacoes", "pendentes", {}).then(function (r) {
    if (!r || !r.ok) {
      return { sei: false,
        texto: lim(r && r.mensagem) || "a central de aprovações não respondeu" };
    }
    var pend = comoListaCore(r.dados);
    var achou = pend.filter(function (x) {
      return lim(x.protocolo || x.id || x.numero).toUpperCase() ===
             lim(protocolo).toUpperCase(); })[0];
    return { sei: true, achou: !!achou, quantas: pend.length };
  }, function (e) {
    return { sei: false, texto: String(e && e.message || e) };
  });
}

function avisoDaAprovacao_(protocolo, onde) {
  var caixa = document.getElementById(onde);
  if (!caixa) return;
  caixa.innerHTML = '<div class="aviso cinza">Conferindo se o pedido chegou na ' +
    'central de aprovação…</div>';
  conferirNaAprovacao(protocolo).then(function (v) {
    var c = document.getElementById(onde);
    if (!c) return;
    if (!v.sei) {
      c.innerHTML = '<div class="aviso amarelo"><b>Não consegui conferir a aprovação</b>' +
        esc(v.texto) + '<br>O pedido foi gravado — o que eu não sei dizer é se ele ' +
        'já apareceu na fila de aprovação.</div>';
      return;
    }
    if (v.achou) {
      c.innerHTML = '<div class="aviso verde"><b>Está na fila de aprovação</b>' +
        'O protocolo <span class="mono">' + esc(protocolo) + '</span> aparece no ' +
        'Centro de Aprovações do ALMOX-PRO, junto com outros ' + (v.quantas - 1) +
        ' pedido(s).</div>';
      return;
    }
    c.innerHTML = '<div class="aviso amarelo"><b>Gravado, mas ainda não vi na aprovação</b>' +
      'O protocolo <span class="mono">' + esc(protocolo) + '</span> não apareceu na ' +
      'lista de pendentes (que tem ' + v.quantas + ' pedido(s) agora). ' +
      'Pode ser que o seu fluxo só mande para aprovação em outro momento. ' +
      'Confira no computador antes de contar com ele.</div>';
  });
}


/* ============================================================
 * [campo 29] FOTOS DOS ITENS, FERRAMENTAS DE VERDADE,
 *            COLABORADOR CADASTRADO E A REGRA DO EPI
 * ------------------------------------------------------------
 * Quatro coisas que ele pediu, e de onde cada uma sai:
 *
 *  1. A FOTO do item        imagens.buscar {tipo:"item", chaves:[sku]}
 *                           — a MESMA porta que a Loja do computador
 *                             usa. Sem foto cadastrada, fica o
 *                             marcador neutro. Nada é inventado.
 *
 *  2. AS FERRAMENTAS        o Core tem TRÊS portas para isso, e qual
 *                           delas tem o cadastro dele eu não tenho
 *                           como adivinhar daqui:
 *                             ferramentas.listar
 *                             ferramentaria.listar
 *                             patrimonio.listar
 *                           Então pergunto às três, junto o que vier
 *                           pelo número de patrimônio, e DIGO na tela
 *                           o que cada uma respondeu. Lista vazia sem
 *                           explicação foi o que ele viu.
 *
 *  3. QUEM VAI RECEBER      usuarios.listar + cracha.listar, o mesmo
 *                           cadastro da tela de colaboradores. O nome
 *                           repetido com matrícula diferente é um
 *                           problema REAL do cadastro dele, então a
 *                           lista mostra a matrícula do lado e avisa
 *                           quando há dois cadastros com o mesmo nome.
 *
 *  4. A REGRA DO EPI        epi.fichas. Se a pessoa já tem aquele EPI
 *                           dentro da validade, o item fica BLOQUEADO
 *                           e só sai com LIBERAÇÃO de outra pessoa,
 *                           que entra com o usuário dela (auth.login).
 *                           Quem liberou fica gravado no pedido.
 * ============================================================ */

/* ---------- 1. AS FOTOS DOS ITENS ---------- */
var FOTOS = { memoria: {}, buscando: {}, fila: [], timer: null, porLote: 12, erro: "" };

function fotoPedir_(sku) {
  if (!sku) return;
  if (FOTOS.memoria.hasOwnProperty(sku) || FOTOS.buscando[sku]) return;
  if (FOTOS.fila.indexOf(sku) > -1) return;
  FOTOS.fila.push(sku);
  clearTimeout(FOTOS.timer);
  FOTOS.timer = setTimeout(fotoDespachar_, 120);
}

function fotoDespachar_() {
  if (!FOTOS.fila.length) return;
  var lote = FOTOS.fila.splice(0, FOTOS.porLote);
  lote.forEach(function (s) { FOTOS.buscando[s] = true; });
  api("imagens", "buscar", { tipo: "item", chaves: lote }).then(function (r) {
    lote.forEach(function (s) { delete FOTOS.buscando[s]; });
    if (!r || !r.ok) {
      /* o Core não tem a porta de imagens, ou recusou: os itens
         ficam com o marcador neutro e eu digo o porquê uma vez só */
      FOTOS.erro = (r && r.mensagem) || "o servidor não respondeu as imagens";
      lote.forEach(function (s) { FOTOS.memoria[s] = null; });
      fotoPintarAviso_();
      return;
    }
    var d = r.dados || {};
    Object.keys(d).forEach(function (sku) {
      FOTOS.memoria[sku] = d[sku] || null;
      fotoPintar_(sku, d[sku]);
    });
    comoListaCore(r.semFoto).forEach(function (sku) { FOTOS.memoria[sku] = null; });
    lote.forEach(function (s) {
      if (!FOTOS.memoria.hasOwnProperty(s)) FOTOS.memoria[s] = null;
    });
    if (FOTOS.fila.length) setTimeout(fotoDespachar_, 60);
  }, function () {
    lote.forEach(function (s) { delete FOTOS.buscando[s]; FOTOS.memoria[s] = null; });
  });
}

function fotoPintar_(sku, dados) {
  if (!dados) return;
  var alvos = document.querySelectorAll('[data-foto="' + sku + '"]');
  Array.prototype.forEach.call(alvos, function (el) {
    el.innerHTML = '<img src="' + esc(dados) + '" alt="">';
    el.removeAttribute("data-foto");
  });
}
function fotoPintarAviso_() {
  var el = document.getElementById("fotoAviso");
  if (!el || !FOTOS.erro) return;
  el.innerHTML = '<div class="aviso cinza"><b>As fotos não vieram</b>' +
    'O servidor respondeu: ' + esc(FOTOS.erro) + '. Os itens aparecem com o ' +
    'marcador cinza — o cadastro deles não mudou.</div>';
}
/* chamado depois de desenhar os cards: pede a foto do que está na tela */
function fotosDaTela_() {
  var pendentes = document.querySelectorAll("[data-foto]");
  Array.prototype.forEach.call(pendentes, function (el) {
    fotoPedir_(el.getAttribute("data-foto"));
  });
}

/* ---------- 2. AS FERRAMENTAS, DAS TRÊS PORTAS ---------- */
function ferramentaNormal_(f, origem) {
  if (!f || typeof f !== "object") return null;
  function pega(nomes) {
    for (var i = 0; i < nomes.length; i++) {
      var v = f[nomes[i]];
      if (v !== undefined && v !== null && String(v) !== "") return v;
    }
    return "";
  }
  var pat = lim(pega(["patrimonio", "numeroPatrimonio", "numero", "etiqueta", "codigo", "id"]));
  var nome = lim(pega(["nome", "descricao", "equipamento", "item", "modelo"]));
  if (!pat && !nome) return null;
  return {
    patrimonio: pat || nome,
    nome: nome || "(sem descrição)",
    status: lim(pega(["status", "situacao", "estado"])).toUpperCase(),
    com: lim(pega(["com", "responsavel", "portador", "usuario"])),
    obra: lim(pega(["obra", "local", "centro"])),
    condicao: lim(pega(["condicao", "conservacao"])),
    sku: lim(pega(["sku", "codigoItem"])),
    origem: origem
  };
}

function carregarFerramentas() {
  var portas = [
    { m: "ferramentas", a: "listar" },
    { m: "ferramentaria", a: "listar" },
    { m: "patrimonio", a: "listar" }
  ];
  return Promise.all(portas.map(function (p) {
    return api(p.m, p.a, {}).then(function (r) {
      return { porta: p.m + "." + p.a, ok: !!(r && r.ok),
               mensagem: lim(r && r.mensagem),
               lista: (r && r.ok) ? comoListaCore(r.dados) : [] };
    }, function (e) {
      return { porta: p.m + "." + p.a, ok: false,
               mensagem: String(e && e.message || e), lista: [] };
    });
  })).then(function (res) {
    var porPat = {}, ordem = [];
    res.forEach(function (x) {
      x.lista.forEach(function (bruto) {
        var f = ferramentaNormal_(bruto, x.porta);
        if (!f) return;
        var k = f.patrimonio.toUpperCase();
        if (porPat[k]) {
          /* a mesma ferramenta em duas portas: completa o que faltar */
          var tem = porPat[k];
          if (!tem.status && f.status) tem.status = f.status;
          if (!tem.com && f.com) tem.com = f.com;
          if (!tem.obra && f.obra) tem.obra = f.obra;
          if (tem.origem.indexOf(f.origem) < 0) tem.origem += " + " + f.origem;
          return;
        }
        porPat[k] = f; ordem.push(k);
      });
    });
    FERR.lista = ordem.map(function (k) { return porPat[k]; });
    FERR.portas = res;
    FERR.quando = Date.now();
    return FERR.lista;
  });
}

/* ---------- 3. OS COLABORADORES CADASTRADOS ---------- */
var GENTE = { lista: null, quando: 0, erro: "" };

function carregarGente(forcar) {
  if (GENTE.lista && !forcar && (Date.now() - GENTE.quando) < 300000) {
    return Promise.resolve(GENTE.lista);
  }
  return Promise.all([
    api("usuarios", "listar", {}),
    api("cracha", "listar", {}).then(function (x) { return x; }, function () { return { ok: false }; })
  ]).then(function (rs) {
    var rU = rs[0], rC = rs[1];
    if (!rU || !rU.ok) {
      GENTE.erro = (rU && rU.mensagem) || "o servidor não devolveu o cadastro.";
      GENTE.lista = [];
      return GENTE.lista;
    }
    var usuarios = comoListaCore(rU.dados);
    var crachas = (rC && rC.ok) ? comoListaCore(rC.dados) : [];
    var porMat = {};
    crachas.forEach(function (c) {
      var m = chaveMat(c.matricula || c.codigo);
      if (!m) return;
      if (!porMat[m] || (!lim(porMat[m].foto) && lim(c.foto))) porMat[m] = c;
    });
    var lista = usuarios.map(function (u) {
      var m = chaveMat(u.matricula || u.login || u.id);
      var c = porMat[m];
      return {
        id: lim(u.id) || ("MAT:" + m),
        nome: lim(u.nome || u.colaborador || u.login),
        matricula: lim(u.matricula || u.login),
        cargo: lim(u.cargo || u.funcao),
        perfil: lim(u.perfil),
        foto: c ? lim(c.foto) : "",
        /* matrícula de gente, ou código que o sistema gerou? isso
           decide qual cadastro fica na frente quando há dois */
        temMatriculaDeVerdade: /^\d{3,}$/.test(chaveMat(u.matricula || ""))
      };
    }).filter(function (p) { return !!p.nome; });

    /* DOIS CADASTROS COM O MESMO NOME — o caso que ele descreveu.
       Não apago nenhum: marco os dois, deixo na frente o que tem
       matrícula de verdade, e a tela avisa que são dois. */
    var porNome = {};
    lista.forEach(function (p) {
      var k = chaveNomeLimpo(p.nome);
      (porNome[k] = porNome[k] || []).push(p);
    });
    lista.forEach(function (p) {
      var iguais = porNome[chaveNomeLimpo(p.nome)] || [];
      p.repetido = iguais.length > 1;
    });
    lista.sort(function (a, b) {
      if (a.nome !== b.nome) return a.nome.localeCompare(b.nome);
      return (b.temMatriculaDeVerdade ? 1 : 0) - (a.temMatriculaDeVerdade ? 1 : 0);
    });
    GENTE.lista = lista;
    GENTE.quando = Date.now();
    GENTE.erro = "";
    return lista;
  });
}

/* ---------- 4. A REGRA DO EPI ---------- */
/* o que a pessoa já recebeu, pela ficha oficial */
function epiDaPessoa(pessoa) {
  return api("epi", "fichas", {}).then(function (r) {
    if (!r || !r.ok) return { ok: false, mensagem: lim(r && r.mensagem), itens: [] };
    var todas = comoListaCore(r.dados);
    var agrupada = todas.length && Array.isArray(todas[0] && todas[0].itens);
    var meus = [];
    var alvoMat = chaveMat(pessoa.matricula);
    var alvoNome = chaveNomeLimpo(pessoa.nome);
    if (agrupada) {
      todas.forEach(function (f) {
        var bate = (alvoMat && chaveMat(f.matricula) === alvoMat) ||
                   (alvoNome && chaveNomeLimpo(f.nome || f.colaborador) === alvoNome);
        if (bate) comoListaCore(f.itens).forEach(function (i) { meus.push(i); });
      });
    } else {
      todas.forEach(function (l) {
        var bate = (alvoMat && chaveMat(l.matricula) === alvoMat) ||
                   (alvoNome && chaveNomeLimpo(l.colaborador || l.nome) === alvoNome);
        if (bate) meus.push({
          epi: lim(l.item || l.epi || l.descricao), sku: lim(l.sku), ca: lim(l.ca),
          qtd: l.qtd, entrega: l.entrega, validade: l.validade, status: lim(l.status)
        });
      });
    }
    return { ok: true, itens: meus };
  }, function (e) {
    return { ok: false, mensagem: String(e && e.message || e), itens: [] };
  });
}

function mesmoProduto_(a, b) {
  var sa = lim(a).toUpperCase(), sb = lim(b).toUpperCase();
  if (!sa || !sb) return false;
  if (sa === sb) return true;
  /* "BOTA DE SEGURANÇA N37" e "BOTA DE SEGURANCA 37": o mesmo par de
     botas escrito de dois jeitos. Comparo só letras e números. */
  function limpo(x) {
    return x.normalize ? x.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Z0-9]/g, "")
                       : x.replace(/[^A-Z0-9]/g, "");
  }
  return limpo(sa) === limpo(sb);
}

function dataDoCore_(v) {
  if (!v) return null;
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

/* O item do carrinho esbarra em algo que a pessoa já tem?
   Devolve a lista do que está travado, com o porquê. */
function travasDoEpi_(itensDaFicha, carrinho) {
  var hoje = new Date();
  var travados = [];
  carrinho.forEach(function (c) {
    var jaTem = itensDaFicha.filter(function (i) {
      if (lim(i.status).toUpperCase() === "DEVOLVIDO") return false;
      return (lim(i.sku) && lim(c.id) && lim(i.sku).toUpperCase() === lim(c.id).toUpperCase()) ||
             (lim(i.sku) && lim(c.codigo) && lim(i.sku).toUpperCase() === lim(c.codigo).toUpperCase()) ||
             mesmoProduto_(i.epi, c.nome);
    });
    if (!jaTem.length) return;
    /* o mais recente manda */
    var ultimo = jaTem.sort(function (a, b) {
      return (dataDoCore_(b.entrega) || 0) - (dataDoCore_(a.entrega) || 0);
    })[0];
    var val = dataDoCore_(ultimo.validade);
    var ent = dataDoCore_(ultimo.entrega);
    if (val && val < hoje) return;   /* venceu: pode pegar outro */
    travados.push({
      id: c.id, nome: c.nome,
      entrega: ent ? ent.toLocaleDateString("pt-BR") : lim(ultimo.entrega),
      validade: val ? val.toLocaleDateString("pt-BR") : "",
      porque: val
        ? "já recebeu em " + (ent ? ent.toLocaleDateString("pt-BR") : "—") +
          " e vale até " + val.toLocaleDateString("pt-BR")
        : "já recebeu em " + (ent ? ent.toLocaleDateString("pt-BR") : "—") +
          " e a ficha não traz validade"
    });
  });
  return travados;
}

/* a liberação: outra pessoa entra com o usuário dela e assume */
var LIBERACAO = null;

function telaDeLiberacao_(travados, aoLiberar) {
  var html =
    '<div class="cartao">' +
      '<h2>Precisa de liberação</h2>' +
      '<p class="ajuda">Este pedido tem EPI que a pessoa já recebeu e ainda está valendo.</p>' +
      travados.map(function (t) {
        return '<div class="aviso amarelo"><b>' + esc(t.nome) + '</b>' + esc(t.porque) + '</div>';
      }).join("") +
      '<div class="aviso cinza"><b>Quem libera assume o pedido</b>' +
      'O técnico de segurança ou o responsável entra com o usuário dele aqui. ' +
      'O nome de quem liberou vai gravado junto com a solicitação. ' +
      'Quem pode liberar é o servidor que decide — eu não escondo botão para ' +
      'fingir permissão.</div>' +
      '<div class="campo"><label>Usuário de quem libera</label>' +
      '<input type="text" class="campo" id="libUser" autocomplete="off"></div>' +
      '<div class="campo"><label>Senha</label>' +
      '<input type="password" class="campo" id="libSenha" autocomplete="off"></div>' +
      '<div class="campo"><label>Por que está liberando</label>' +
      '<input type="text" class="campo" id="libMotivo" ' +
      'placeholder="ex.: a bota rasgou no serviço"></div>' +
      '<button class="bt laranja" id="libOk">Liberar e continuar</button>' +
      '<button class="bt vazio" id="libNao">Cancelar</button>' +
      '<div id="libAviso"></div>' +
    '</div>';
  pintar(html, "liberação");

  document.getElementById("libNao").addEventListener("click", function () { ir("carrinho"); });
  document.getElementById("libOk").addEventListener("click", function () {
    var b = this;
    var u = lim(document.getElementById("libUser").value);
    var s = document.getElementById("libSenha").value || "";
    var motivo = lim(document.getElementById("libMotivo").value);
    var aviso = document.getElementById("libAviso");
    if (!u || motivo.length < 4) {
      aviso.innerHTML = '<div class="aviso amarelo">Falta o usuário de quem libera ' +
        'e o motivo da liberação.</div>';
      return;
    }
    b.disabled = true; b.textContent = "Conferindo com o servidor…";
    api("auth", "login", { usuario: u, senha: s, metodo: "senha" }).then(function (r) {
      b.disabled = false; b.textContent = "Liberar e continuar";
      document.getElementById("libSenha").value = "";
      if (!r || !r.ok || !(r.dados && r.dados.sessao && r.dados.sessao.token)) {
        aviso.innerHTML = '<div class="aviso vermelho"><b>Não liberou</b>' +
          esc((r && r.mensagem) || "O servidor não aceitou este usuário.") +
          '<br>Nada foi enviado.</div>';
        return;
      }
      var quem = (r.dados.usuario || r.dados.user || {});
      LIBERACAO = {
        por: lim(quem.nome) || u,
        matricula: lim(quem.matricula),
        motivo: motivo,
        quando: new Date().toISOString(),
        itens: travados.map(function (t) { return t.nome; })
      };
      aoLiberar();
    });
  });
}


/* ============================================================
 * [campo 28] CATÁLOGO, CARRINHO, FERRAMENTAS, PEDIDOS E AVISOS
 * ------------------------------------------------------------
 * Tudo aqui conversa pela MESMA porta do ALMOX-PRO, com as MESMAS
 * ações que o sistema do computador já usa. Nenhuma rota foi
 * inventada: cada uma foi lida do próprio index.html do ALMOX-PRO.
 *
 *   lojinha.catalogo      o catálogo (o mesmo da Loja no computador)
 *   itens.listar          plano B, quando a lojinha não responde
 *   categorias.listar     as categorias cadastradas (opcional)
 *   obras.listar          as obras (opcional)
 *   reservas.criar        É ESTA que grava a solicitação do carrinho
 *   reservas.listar       os meus pedidos
 *   ferramentas.listar    a ferramentaria, patrimônio por patrimônio
 *   ferramentas.movimentar  retirada e devolução de ferramenta
 *
 * O QUE AINDA NÃO EXISTE NO SERVIDOR: uma central de notificações.
 * Não há rota de notificações em lugar nenhum do ALMOX-PRO — o
 * computador monta os avisos dele na memória da própria tela. Então
 * aqui os avisos são MONTADOS a partir dos seus pedidos reais, e a
 * tela diz isso com todas as letras. Não inventei um sino que pisca
 * sozinho.
 * ============================================================ */

var LOJA = { itens: null, categoria: "Todos", busca: "", quando: 0, origem: "", erro: "" };
var CARRINHO = [];
var FERR = { lista: null, quando: 0, erro: "" };
var PEDIDOS = { lista: null, quando: 0, erro: "" };
var AVISOS = { lista: [], quando: 0, erro: "" };

/* ---------- o carrinho sobrevive a fechar o aplicativo ---------- */
function carrinhoGravar() {
  try { guardar("carrinho", JSON.stringify(CARRINHO)); } catch (e) {}
}
function carrinhoLer() {
  try {
    var l = JSON.parse(lerGuardado("carrinho") || "[]");
    CARRINHO = Array.isArray(l) ? l : [];
  } catch (e) { CARRINHO = []; }
}
function carrinhoQtd() {
  return CARRINHO.reduce(function (s, i) { return s + (Number(i.qtd) || 0); }, 0);
}
function carrinhoTotal() {
  return Math.round(CARRINHO.reduce(function (s, i) {
    return s + (Number(i.preco) || 0) * (Number(i.qtd) || 0);
  }, 0) * 100) / 100;
}
function carrinhoAdd(p, q) {
  q = Number(q) || 1;
  var ex = CARRINHO.filter(function (c) { return String(c.id) === String(p.id); })[0];
  if (ex) ex.qtd = (Number(ex.qtd) || 0) + q;
  else CARRINHO.push({ id: p.id, nome: p.nome, codigo: p.codigo, preco: p.preco,
    emoji: p.emoji, qtd: q, categoria: p.categoria, unidade: p.unidade });
  carrinhoGravar();
  toast(lim(p.nome) + " — " + carrinhoQtd() + " item(ns) no carrinho");
}
function carrinhoTirar(id) {
  CARRINHO = CARRINHO.filter(function (c) { return String(c.id) !== String(id); });
  carrinhoGravar();
}
function carrinhoMudar(id, delta) {
  CARRINHO.forEach(function (c) {
    if (String(c.id) !== String(id)) return;
    c.qtd = Math.max(0, (Number(c.qtd) || 0) + delta);
  });
  CARRINHO = CARRINHO.filter(function (c) { return (Number(c.qtd) || 0) > 0; });
  carrinhoGravar();
}

function moedaBR(v) {
  var n = Number(v) || 0;
  return "R$ " + n.toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

/* ---------- um item do catálogo, venha de onde vier ----------
   A lojinha e o cadastro de itens usam nomes diferentes para a
   mesma coisa. Aqui os dois viram o mesmo formato — e o que não
   vier, não é inventado: fica vazio e a tela mostra isso. */
function itemDoCatalogo_(p) {
  if (!p || typeof p !== "object") return null;
  function pega(nomes) {
    for (var i = 0; i < nomes.length; i++) {
      var v = p[nomes[i]];
      if (v !== undefined && v !== null && String(v) !== "") return v;
    }
    return undefined;
  }
  var nome = lim(pega(["nome", "descricao", "produto", "item", "titulo"]));
  if (!nome) return null;
  var estoque = Number(pega(["estoque", "saldo", "quantidade", "qtd", "disponivel"]));
  var reservado = Number(pega(["reservado", "reserva"])) || 0;
  if (!isFinite(estoque)) estoque = null;
  return {
    id: lim(pega(["id", "sku", "codigo", "cod"])) || nome,
    nome: nome,
    codigo: lim(pega(["codigo", "sku", "cod", "sap"])),
    sku: lim(pega(["sku", "codigo"])),
    categoria: lim(pega(["categoria", "grupo", "familia"])) || "Sem categoria",
    unidade: lim(pega(["unidade", "und", "um"])) || "un",
    estoque: estoque,
    reservado: reservado,
    disponivel: estoque === null ? null : Math.max(0, estoque - reservado),
    preco: Number(pega(["preco", "valorUnitario", "valor"])) || 0,
    emoji: lim(pega(["emoji"])),
    foto: lim(pega(["foto", "imagem"])),
    ca: lim(pega(["ca", "CA"])),
    patrimonio: lim(pega(["patrimonio"]))
  };
}

/* ---------- buscar o catálogo no servidor ---------- */
function carregarCatalogo(forcar) {
  if (LOJA.itens && !forcar && (Date.now() - LOJA.quando) < 120000) {
    return Promise.resolve(LOJA.itens);
  }
  LOJA.erro = "";
  return api("lojinha", "catalogo", {}).then(function (r) {
    var lista = (r && r.ok) ? comoListaCore(r.dados) : [];
    if (lista.length) { LOJA.origem = "lojinha.catalogo"; return lista; }
    /* a lojinha não respondeu ou veio vazia: o cadastro de itens é
       a outra porta oficial, e é a mesma Central de Itens */
    return api("itens", "listar", {}).then(function (r2) {
      if (r2 && r2.ok) { LOJA.origem = "itens.listar"; return comoListaCore(r2.dados); }
      LOJA.erro = (r2 && r2.mensagem) || (r && r.mensagem) || "O servidor não devolveu o catálogo.";
      LOJA.origem = "";
      return [];
    });
  }, function (e) {
    LOJA.erro = String(e && e.message || e);
    return [];
  }).then(function (lista) {
    LOJA.itens = lista.map(itemDoCatalogo_).filter(Boolean);
    LOJA.quando = Date.now();
    return LOJA.itens;
  });
}

function categoriasDoCatalogo_(itens) {
  var vistas = {}, ordem = [];
  itens.forEach(function (p) {
    if (vistas[p.categoria]) { vistas[p.categoria]++; return; }
    vistas[p.categoria] = 1; ordem.push(p.categoria);
  });
  return [{ nome: "Todos", n: itens.length }].concat(ordem.sort().map(function (c) {
    return { nome: c, n: vistas[c] };
  }));
}

function cartaoDoItem_(p) {
  var semSaldo = p.disponivel === 0;
  var noCarrinho = (CARRINHO.filter(function (c) {
    return String(c.id) === String(p.id); })[0] || {}).qtd || 0;
  return '<div class="prod' + (noCarrinho ? ' tem' : '') + '" data-abrir="' + esc(p.id) + '">' +
    '<div class="prod-img"' +
      (p.foto ? '>' + '<img src="' + esc(p.foto) + '" alt="">'
              : (p.sku || p.codigo)
                ? ' data-foto="' + esc(p.sku || p.codigo) + '">' +
                  '<span>' + (p.emoji ? esc(p.emoji) : '&#9707;') + '</span>'
                : '>' + '<span>' + (p.emoji ? esc(p.emoji) : '&#9707;') + '</span>') +
    '</div>' +
    '<b>' + esc(p.nome) + '</b>' +
    '<div class="prod-cod mono">' + esc(p.codigo || p.sku || "") + '</div>' +
    '<div class="prod-est ' + (p.disponivel === null ? 'nd' : semSaldo ? 'zero' : 'ok') + '">' +
      (p.disponivel === null
        ? 'saldo não informado'
        : (semSaldo ? 'sem saldo' : 'Disponível: ' + p.disponivel + ' ' + esc(p.unidade))) +
    '</div>' +
    '<div class="prod-pe">' +
      (noCarrinho ? '<span class="selo sim">' + noCarrinho + ' no carrinho</span>' : '<span></span>') +
      '<button class="mais" data-add="' + esc(p.id) + '"' + (semSaldo ? ' disabled' : '') +
      ' aria-label="Adicionar">+</button>' +
    '</div></div>';
}

/* ============================================================
 * TELA — CATÁLOGO EM CARDS
 * ============================================================ */
TELAS.catalogo = function () {
  CAMPO.abaAtual = "catalogo";
  carregando("Buscando o catálogo no servidor…");
  carregarCatalogo(false).then(function (itens) {
    if (!itens.length) {
      pintar('<div class="cartao"><h2>Catálogo</h2>' +
        '<div class="aviso vermelho"><b>O servidor não devolveu itens</b>' +
        esc(LOJA.erro || "A Central de Itens respondeu vazia.") +
        '</div>' +
        '<button class="bt vazio" id="catDeNovo">Tentar de novo</button></div>', "catálogo");
      var bd = document.getElementById("catDeNovo");
      if (bd) bd.addEventListener("click", function () { LOJA.itens = null; TELAS.catalogo(); });
      return;
    }
    var cats = categoriasDoCatalogo_(itens);
    var lista = itens.filter(function (p) {
      if (LOJA.categoria !== "Todos" && p.categoria !== LOJA.categoria) return false;
      if (!LOJA.busca) return true;
      var t = LOJA.busca.toLowerCase();
      return [p.nome, p.codigo, p.sku, p.categoria, p.ca].some(function (c) {
        return String(c || "").toLowerCase().indexOf(t) > -1;
      });
    });

    pintar(
      '<div class="busca-fixa">' +
        '<input type="search" id="catBusca" class="campo" placeholder="Buscar produtos, códigos ou marcas…" value="' + esc(LOJA.busca) + '">' +
        '<div class="chips">' + cats.map(function (c) {
          return '<button class="chip' + (LOJA.categoria === c.nome ? ' on' : '') +
            '" data-cat="' + esc(c.nome) + '">' + esc(c.nome) +
            '<small>' + c.n + '</small></button>';
        }).join("") + '</div>' +
      '</div>' +
      (lista.length
        ? '<div class="prod-grade">' + lista.map(cartaoDoItem_).join("") + '</div>'
        : '<div class="cartao"><b>Nada encontrado</b>' +
          '<p class="ajuda">Nenhum item com esse texto nesta categoria.</p></div>') +
      '<div id="fotoAviso"></div>' +
      '<p class="pequeno" style="text-align:center;margin:14px 0 4px">' +
        lista.length + ' de ' + itens.length + ' item(ns) · lido de <span class="mono">' +
        esc(LOJA.origem) + '</span></p>',
      "catálogo");

    pintarBarraCarrinho();
    fotosDaTela_();          /* [29] as fotos dos itens que estão na tela */
    fotoPintarAviso_();

    var busca = document.getElementById("catBusca");
    if (busca) {
      var tmp = null;
      busca.addEventListener("input", function () {
        clearTimeout(tmp);
        tmp = setTimeout(function () {
          LOJA.busca = busca.value;
          TELAS.catalogo();
          var b2 = document.getElementById("catBusca");
          if (b2) { b2.focus(); b2.value = LOJA.busca; }
        }, 280);
      });
    }
    document.querySelectorAll("[data-cat]").forEach(function (b) {
      b.addEventListener("click", function () {
        LOJA.categoria = b.getAttribute("data-cat");
        TELAS.catalogo();
      });
    });
    document.querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var p = LOJA.itens.filter(function (x) {
          return String(x.id) === b.getAttribute("data-add"); })[0];
        if (!p) return;
        carrinhoAdd(p, 1);
        TELAS.catalogo();
      });
    });
    document.querySelectorAll("[data-abrir]").forEach(function (c) {
      c.addEventListener("click", function () {
        ir("itemDet", c.getAttribute("data-abrir"));
      });
    });
  });
};

/* ---------- a barra do carrinho, presa embaixo ---------- */
function pintarBarraCarrinho() {
  var velha = document.getElementById("barraCarrinho");
  if (velha) velha.parentNode.removeChild(velha);
  if (!carrinhoQtd()) return;
  var d = document.createElement("div");
  d.id = "barraCarrinho";
  d.className = "barra-carrinho";
  d.innerHTML = '<div><b>' + carrinhoQtd() + ' item(ns)</b>' +

  document.body.appendChild(d);
  document.getElementById("irCarrinho").addEventListener("click", function () {
    ir("carrinho");
  });
}
function limparBarraCarrinho() {

  if (v) v.parentNode.removeChild(v);
}

/* ============================================================
 * TELA — DETALHE DO ITEM
 * ============================================================ */

                    '<span>' + (p.emoji ? esc(p.emoji) : '&#9707;') + '</span>'

      '</div>' +
      '<h2>' + esc(p.nome) + '</h2>' +
      '<p class="ajuda mono">' + esc(p.codigo || p.sku || "sem código") + '</p>' +

          : p.disponivel + " " + p.unidade +
            (p.reservado ? " (" + p.reservado + " reservado)" : "")) +
        (p.preco ? linhaDet_("Preço de referência", moedaBR(p.preco)) : "") +
      '</div>' +
      (p.disponivel === 0
        ? '<div class="aviso amarelo"><b>Sem saldo agora</b>O servidor não tem este item ' +
          'disponível. Você pode pedir assim mesmo, e o almoxarifado decide.</div>'
        : '') +
      '<div class="linha" style="margin-top:12px">' +
        '<div class="qtd"><button id="qMenos">&minus;</button>' +
        '<input id="qVal" value="' + (noCarrinho || 1) + '" inputmode="numeric" readonly>' +
        '<button id="qMais">+</button></div>' +
        '<button class="bt laranja pequeno" id="addItem">Adicionar ao carrinho</button>' +
      '</div>' +
    '</div>', "detalhe do item");

  fotosDaTela_();            /* [29] a foto deste item */
  var val = document.getElementById("qVal");
  document.getElementById("qMenos").addEventListener("click", function () {
    val.value = Math.max(1, (Number(val.value) || 1) - 1);
  });
  document.getElementById("qMais").addEventListener("click", function () {
    val.value = (Number(val.value) || 0) + 1;
  });
  document.getElementById("addItem").addEventListener("click", function () {
    carrinhoTirar(p.id);
    carrinhoAdd(p, Number(val.value) || 1);
    ir("carrinho");
  });
};
function linhaDet_(rotulo, valor) {
  return '<div class="det-linha"><span>' + esc(rotulo) + '</span><b>' + esc(valor) + '</b></div>';
}

/* ============================================================
 * TELA — CARRINHO E SOLICITAÇÃO
 * ------------------------------------------------------------
 * O envio usa reservas.criar, que é a MESMA ação que o carrinho do
 * computador usa. O que for enviado daqui cai na mesma central de
 * aprovação de lá — não existe fila separada para o celular.
 * ============================================================ */
TELAS.carrinho = function () {
  CAMPO.abaAtual = "catalogo";
  limparBarraCarrinho();
  if (!CARRINHO.length) {
    pintar('<div class="cartao"><h2>Carrinho vazio</h2>' +
      '<p class="ajuda">Escolha os materiais no catálogo e eles aparecem aqui.</p>' +
      '<button class="bt laranja" data-ir-cat>Abrir o catálogo</button></div>', "carrinho");
    var b = document.querySelector("[data-ir-cat]");
    if (b) b.addEventListener("click", function () { ir("catalogo"); });
    return;
  }
  var quem = lim(CAMPO.usuario && CAMPO.usuario.nome);
  pintar(
    '<div class="cartao">' +
      '<h2>Meu carrinho</h2>' +
      '<p class="ajuda">' + carrinhoQtd() + ' item(ns) · ' + moedaBR(carrinhoTotal()) + '</p>' +
      CARRINHO.map(function (c) {
        return '<div class="car-linha">' +
          '<div class="car-txt"><b>' + esc(c.nome) + '</b>' +
            '<small class="mono">' + esc(c.codigo || "") + '</small></div>' +
          '<div class="qtd"><button data-menos="' + esc(c.id) + '">&minus;</button>' +
          '<input value="' + (Number(c.qtd) || 0) + '" readonly>' +
          '<button data-mais="' + esc(c.id) + '">+</button></div>' +
          '<button class="tirar" data-tirar="' + esc(c.id) + '" aria-label="Tirar">&times;</button>' +
        '</div>';
      }).join("") +
    '</div>' +

    '<div class="cartao">' +
      '<b class="small">PARA ONDE VAI</b>' +
      '<div class="campo" style="margin-top:8px"><label>Obra / Centro de custo</label>' +
        '<input class="campo" id="solObra" placeholder="Ex.: UFN-III" value="' +
        esc(lerGuardado("obra")) + '"></div>' +
      '<div class="campo"><label>Para quem é</label>' +
        '<div id="solPessoaCaixa">' + pessoaEscolhidaHtml_() + '</div></div>' +
      '<div class="campo"><label>Justificativa</label>' +
        '<textarea class="campo" id="solMotivo" rows="3" ' +
        'placeholder="Para que serve este material"></textarea></div>' +
      '<div class="aviso cinza"><b>Nada sai do estoque agora</b>' +
      'Isto é uma solicitação. A baixa só acontece quando o almoxarifado ' +
      'autorizar no ALMOX-PRO.</div>' +
      '<button class="bt laranja" id="enviarSol">Enviar solicitação</button>' +
      '<div id="solSaida"></div>' +
    '</div>', "carrinho");

  document.querySelectorAll("[data-menos]").forEach(function (b) {
    b.addEventListener("click", function () {
      carrinhoMudar(b.getAttribute("data-menos"), -1); TELAS.carrinho(); });
  });
  document.querySelectorAll("[data-mais]").forEach(function (b) {
    b.addEventListener("click", function () {
      carrinhoMudar(b.getAttribute("data-mais"), 1); TELAS.carrinho(); });
  });
  document.querySelectorAll("[data-tirar]").forEach(function (b) {
    b.addEventListener("click", function () {
      carrinhoTirar(b.getAttribute("data-tirar")); TELAS.carrinho(); });
  });
  document.getElementById("enviarSol").addEventListener("click", enviarSolicitacao);
  ligarEscolhaDePessoa_();
  conferirEpiDoCarrinho_();
};

/* ============================================================
 * [29] QUEM VAI RECEBER — DO CADASTRO, NÃO DIGITADO
 * ============================================================ */
var SOL_PESSOA = null;

function pessoaEscolhidaHtml_() {
  if (!SOL_PESSOA) {
    return '<button class="bt vazio" id="solEscolher" style="margin:0">' +
      'Escolher do cadastro</button>';
  }
  return '<div class="pessoa" style="margin:0">' +
    '<div class="retrato">' +
      (SOL_PESSOA.foto ? '<img src="' + esc(SOL_PESSOA.foto) + '" alt="">'
                       : esc((SOL_PESSOA.nome || "?").charAt(0).toUpperCase())) + '</div>' +
    '<div class="item-txt"><span class="nome">' + esc(SOL_PESSOA.nome) + '</span>' +
    '<span class="det mono">mat. ' + esc(SOL_PESSOA.matricula || "—") + '</span>' +
    (SOL_PESSOA.repetido
      ? '<span class="det" style="color:var(--amarelo)">há outro cadastro com este nome</span>'
      : '') +
    '</div>' +
    '<button class="bt vazio pequeno" id="solEscolher" style="margin:0;width:auto">' +
    'Trocar</button></div>';
}

function ligarEscolhaDePessoa_() {
  var b = document.getElementById("solEscolher");
  if (b) b.addEventListener("click", function () { ir("escolherPessoa"); });
}

TELAS.escolherPessoa = function () {
  carregando("Lendo o cadastro de colaboradores…");
  carregarGente(false).then(function (lista) {
    if (!lista.length) {
      pintar('<div class="cartao"><h2>Colaboradores</h2>' +
        '<div class="aviso vermelho"><b>O cadastro não veio</b>' +
        esc(GENTE.erro || "O servidor respondeu vazio.") + '</div>' +
        '<button class="bt vazio" id="pvVoltar">Voltar ao carrinho</button></div>', "para quem");
      document.getElementById("pvVoltar").addEventListener("click", function () { ir("carrinho"); });
      return;
    }
    var repetidos = lista.filter(function (p) { return p.repetido; }).length;
    pintar(
      '<div class="cartao">' +
        '<h2>Para quem é</h2>' +
        '<p class="ajuda">' + lista.length + ' colaborador(es) no cadastro</p>' +
        (repetidos
          ? '<div class="aviso amarelo"><b>' + repetidos + ' cadastro(s) com nome repetido</b>' +
            'O mesmo nome aparece mais de uma vez no cadastro do ALMOX-PRO — normalmente ' +
            'um registro antigo e o atual. Confira a <b>matrícula</b> antes de escolher. ' +
            'Eu não apago nem junto cadastro por conta própria.</div>'
          : '') +
        '<input type="search" class="campo" id="pvBusca" placeholder="Buscar pelo nome ou matrícula…">' +
      '</div>' +
      '<div id="pvLista">' + lista.slice(0, 60).map(linhaDePessoa_).join("") + '</div>', "para quem");

    function redesenhar(t) {
      var f = !t ? lista : lista.filter(function (p) {
        var alvo = (p.nome + " " + p.matricula + " " + p.cargo).toLowerCase();
        return alvo.indexOf(t.toLowerCase()) > -1;
      });
      document.getElementById("pvLista").innerHTML =
        f.length ? f.slice(0, 60).map(linhaDePessoa_).join("")
                 : '<div class="cartao"><b>Ninguém com esse nome</b></div>';
      ligarLinhasDePessoa_();
    }
    var busca = document.getElementById("pvBusca");
    var tmp = null;
    busca.addEventListener("input", function () {
      clearTimeout(tmp);
      tmp = setTimeout(function () { redesenhar(lim(busca.value)); }, 220);
    });
    ligarLinhasDePessoa_();
  });
};

function linhaDePessoa_(p) {
  return '<button class="pessoa" data-pessoa="' + esc(p.id) + '">' +
    '<div class="retrato">' +
      (p.foto ? '<img src="' + esc(p.foto) + '" alt="">'
              : esc((p.nome || "?").charAt(0).toUpperCase())) + '</div>' +
    '<div class="item-txt"><span class="nome">' + esc(p.nome) + '</span>' +
    '<span class="det mono">mat. ' + esc(p.matricula || "—") + '</span>' +
    (lim(p.cargo) ? '<span class="det">' + esc(p.cargo) + '</span>' : '') +
    '</div>' +
    (p.repetido ? '<span class="selo nao">nome repetido</span>' : '') +
    '</button>';
}

function ligarLinhasDePessoa_() {
  document.querySelectorAll("[data-pessoa]").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-pessoa");
      SOL_PESSOA = (GENTE.lista || []).filter(function (p) {
        return String(p.id) === id; })[0] || null;
      LIBERACAO = null;
      ir("carrinho");
    });
  });
}

/* ============================================================
 * [29] A REGRA DO EPI, NA HORA DE PEDIR
 * ============================================================ */
var EPI_TRAVAS = [];

function conferirEpiDoCarrinho_() {
  var caixa = document.getElementById("solSaida");
  if (!caixa) return;
  EPI_TRAVAS = [];
  if (!SOL_PESSOA) {
    caixa.innerHTML = '<div class="aviso cinza"><b>Escolha para quem é</b>' +
      'Com a pessoa escolhida eu confiro a ficha de EPI dela antes de enviar.</div>';
    return;
  }
  if (LIBERACAO) {
    caixa.innerHTML = '<div class="aviso verde"><b>Liberado por ' +
      esc(LIBERACAO.por) + '</b>' + esc(LIBERACAO.motivo) +
      '<br>Vai gravado junto com a solicitação.</div>';
    return;
  }
  caixa.innerHTML = '<div class="aviso cinza">Conferindo a ficha de EPI de ' +
    esc(SOL_PESSOA.nome) + '…</div>';
  epiDaPessoa(SOL_PESSOA).then(function (f) {
    var caixa2 = document.getElementById("solSaida");
    if (!caixa2) return;
    if (!f.ok) {
      caixa2.innerHTML = '<div class="aviso amarelo"><b>Não consegui ler a ficha de EPI</b>' +
        esc(f.mensagem || "o servidor não respondeu") +
        '<br>Sem a ficha eu não sei dizer se ela já tem estes itens. ' +
        'Confira antes de enviar.</div>';
      return;
    }
    EPI_TRAVAS = travasDoEpi_(f.itens, CARRINHO);
    if (!EPI_TRAVAS.length) {
      caixa2.innerHTML = '<div class="aviso verde"><b>Ficha conferida</b>' +
        esc(SOL_PESSOA.nome) + ' não tem nenhum destes itens valendo.</div>';
      return;
    }
    caixa2.innerHTML =
      '<div class="aviso amarelo"><b>' + EPI_TRAVAS.length +
      ' item(ns) travado(s) pela ficha de EPI</b>' +
      EPI_TRAVAS.map(function (t) {
        return '<b>' + esc(t.nome) + '</b> — ' + esc(t.porque); }).join("<br>") +
      '<br><br>Para enviar assim mesmo, alguém precisa liberar.</div>' +
      '<button class="bt vazio" id="pedirLib">Pedir liberação</button>';
    var pl = document.getElementById("pedirLib");
    if (pl) pl.addEventListener("click", function () {
      telaDeLiberacao_(EPI_TRAVAS, function () { ir("carrinho"); });
    });
  });
}

/* o mesmo identificador vai em toda tentativa da MESMA solicitação:
   se a rede cair e ele mandar de novo, o servidor tem como saber que
   é a mesma, e não uma segunda */
var SOL_ID = "";
function enviarSolicitacao() {
  var bt = document.getElementById("enviarSol");
  var saida = document.getElementById("solSaida");
  var obra = lim((document.getElementById("solObra") || {}).value);
  var motivo = lim((document.getElementById("solMotivo") || {}).value);
  var quem = SOL_PESSOA ? SOL_PESSOA.nome : "";

  if (!obra || !quem) {
    saida.innerHTML = '<div class="aviso amarelo"><b>Falta dizer para onde vai</b>' +
      'Preencha a obra e escolha do cadastro para quem é o material.</div>';
    return;
  }
  /* [29] a ficha de EPI trava, e só a liberação destrava */
  if (EPI_TRAVAS.length && !LIBERACAO) {
    saida.innerHTML = '<div class="aviso vermelho"><b>Não enviei</b>' +
      esc(SOL_PESSOA.nome) + ' já tem ' + EPI_TRAVAS.length +
      ' destes itens valendo. Peça a liberação antes — é ela que ' +
      'registra quem autorizou a exceção.</div>' +
      '<button class="bt vazio" id="pedirLib2">Pedir liberação</button>';
    var pl2 = document.getElementById("pedirLib2");
    if (pl2) pl2.addEventListener("click", function () {
      telaDeLiberacao_(EPI_TRAVAS, function () { ir("carrinho"); });
    });
    return;
  }
  guardar("obra", obra);
  if (!SOL_ID) SOL_ID = "CAMPO-" + Date.now() + "-" +
    Math.random().toString(36).slice(2, 7).toUpperCase();

  bt.disabled = true;
  bt.textContent = "Enviando ao servidor…";
  saida.innerHTML = '';

  api("reservas", "criar", {
    solicitante: quem,
    matricula: lim(SOL_PESSOA && SOL_PESSOA.matricula),
    idColaborador: lim(SOL_PESSOA && SOL_PESSOA.id),
    perfilSol: lim(SOL_PESSOA && SOL_PESSOA.cargo),
    pedidoPor: lim(CAMPO.usuario && CAMPO.usuario.nome),
    matriculaPedidoPor: lim(CAMPO.usuario && (CAMPO.usuario.matricula || CAMPO.usuario.id)),
    liberadoPor: LIBERACAO ? LIBERACAO.por : "",
    liberadoMatricula: LIBERACAO ? LIBERACAO.matricula : "",
    motivoLiberacao: LIBERACAO ? LIBERACAO.motivo : "",
    obra: obra,
    centro: obra,
    motivo: motivo,
    obs: "Solicitado pelo ALMOXA CAMPO por " +
      lim(CAMPO.usuario && CAMPO.usuario.nome) +
      (LIBERACAO ? " | LIBERAÇÃO DE EPI por " + LIBERACAO.por +
        (LIBERACAO.matricula ? " (mat. " + LIBERACAO.matricula + ")" : "") +
        ": " + LIBERACAO.motivo +
        " | itens liberados: " + LIBERACAO.itens.join(", ") : ""),
    valor: carrinhoTotal(),
    metodoAuth: "sessao",
    idOperacao: SOL_ID,
    itens: CARRINHO.map(function (c) {
      return { id: c.id, nome: c.nome, codigo: c.codigo,
               qtd: Number(c.qtd) || 0, preco: Number(c.preco) || 0, emoji: c.emoji || "" };
    })
  }).then(function (r) {
    bt.disabled = false;
    bt.textContent = "Enviar solicitação";
    if (!r || !r.ok) {
      saida.innerHTML = '<div class="aviso vermelho"><b>Não foi gravado</b>' +
        esc((r && r.mensagem) || "O servidor recusou.") +
        '<br><br>O carrinho continua aqui. Pode tentar de novo — vai com o ' +
        'mesmo identificador, para não virar duas solicitações.</div>';
      return;
    }
    var prot = lim(r.dados && (r.dados.protocolo || r.dados.id || r.dados.numero));
    CARRINHO = []; carrinhoGravar(); SOL_ID = "";
    LIBERACAO = null; EPI_TRAVAS = [];
    PEDIDOS.lista = null;
    /* [30] NÃO AFIRMO QUE FOI PARA A APROVAÇÃO: eu procuro o
       protocolo na central e digo o que encontrei. */
    saida.innerHTML = '<div class="aviso verde"><b>Solicitação registrada</b>' +
      (prot ? 'Protocolo <span class="mono">' + esc(prot) + '</span>. ' : '') +
      'O servidor confirmou a gravação.</div>' +
      '<div id="solAprov"></div>' +
      '<button class="bt vazio" id="verPedidos">Ver meus pedidos</button>';
    avisoDaAprovacao_(prot, "solAprov");
    var vp = document.getElementById("verPedidos");
    if (vp) vp.addEventListener("click", function () { ir("pedidos"); });
  }, function (e) {
    bt.disabled = false;
    bt.textContent = "Enviar solicitação";
    saida.innerHTML = '<div class="aviso vermelho"><b>A rede falhou</b>' +
      esc(String(e && e.message || e)) +
      '<br><br>Nada foi confirmado. O carrinho continua guardado aqui.</div>';
  });
}

/* ============================================================
 * TELA — FERRAMENTAS, PATRIMÔNIO POR PATRIMÔNIO
 * ------------------------------------------------------------
 * ferramentas.listar devolve uma linha por equipamento, com o
 * número de patrimônio. São dez notebooks: aparecem os dez, cada um
 * com o seu número — não um "notebook" genérico.
 * ============================================================ */
TELAS.ferramentas = function () {
  CAMPO.abaAtual = "ferramentas";
  carregando("Procurando as ferramentas nas três portas do servidor…");
  /* [29] A LISTA VINHA VAZIA porque eu perguntava a UMA porta só. */
  carregarFerramentas().then(function (lista) {
    var livres = lista.filter(function (f) { return f.status === "DISPONIVEL"; });
    var comigo = lista.filter(function (f) { return f.status === "EM_POSSE"; });
    var portas = FERR.portas || [];

    pintar(
      '<div class="cartao">' +
        '<h2>Ferramentas</h2>' +
        '<p class="ajuda">' + lista.length + ' equipamento(s) · ' +
        livres.length + ' disponível(is) · ' + comigo.length + ' em posse de alguém</p>' +
        '<div class="id-linha" style="border:0;padding:0;display:block">' +
          portas.map(function (p) {
            return '<div class="id-estado ' + (p.ok && p.lista.length ? 'sim' : 'nao') + '">' +
              '<span class="id-bola"></span><span class="mono">' + esc(p.porta) + '</span>' +
              ' — ' + (p.ok ? p.lista.length + ' registro(s)'
                            : esc(p.mensagem || 'o servidor não conhece esta porta')) + '</div>';
          }).join("") +
        '</div>' +
      '</div>' +
      (lista.length
        ? lista.map(cartaoDaFerramenta_).join("")
        : '<div class="cartao"><b>Nenhuma das três portas devolveu equipamento</b>' +
          '<p class="ajuda">As ferramentas que você cadastrou estão em algum lugar do ' +
          'ALMOX-PRO. Me mande esta tela que eu digo em qual porta elas moram e ligo ' +
          'a certa.</p></div>'),
      "ferramentas");

    document.querySelectorAll("[data-fer]").forEach(function (b) {
      b.addEventListener("click", function () {
        ir("ferramenta", b.getAttribute("data-fer"));
      });
    });
  });
};

function cartaoDaFerramenta_(f) {
  var st = String(f.status || "").toUpperCase();
  var cor = st === "DISPONIVEL" ? "sim" : "nao";
  var pat = lim(f.patrimonio || f.codigo || f.id);
  return '<button class="pessoa" data-fer="' + esc(pat) + '">' +
    '<div class="retrato"' + (f.sku ? ' data-foto="' + esc(f.sku) + '"' : '') + '>&#9874;</div>' +
    '<div class="item-txt"><span class="nome">' +
      esc(lim(f.nome || f.descricao) || "(sem descrição)") + '</span>' +
    '<span class="det mono">' + esc(pat) + '</span>' +
    (st === "EM_POSSE" && lim(f.com)
      ? '<span class="det">com ' + esc(f.com) + '</span>' : '') +
    (lim(f.origem) ? '<span class="det pequeno mono">' + esc(f.origem) + '</span>' : '') +
    '</div>' +
    '<span class="selo ' + cor + '">' +
      esc(st.replace(/_/g, " ").toLowerCase() || "sem status") + '</span>' +
    '</button>';
}

/* ---------- um equipamento: retirar ou devolver ---------- */
TELAS.ferramenta = function (pat) {
  var f = (FERR.lista || []).filter(function (x) {
    return lim(x.patrimonio || x.codigo || x.id).toUpperCase() ===
           String(pat).toUpperCase(); })[0];
  if (!f) { ir("ferramentas"); return; }
  var st = String(f.status || "").toUpperCase();
  var disponivel = st === "DISPONIVEL";
  var quem = lim(CAMPO.usuario && CAMPO.usuario.nome);

  pintar(
    '<div class="cartao">' +
      '<div class="det-img"><span>&#9874;</span></div>' +
      '<h2>' + esc(lim(f.nome || f.descricao) || "(sem descrição)") + '</h2>' +
      '<p class="ajuda mono">Patrimônio ' + esc(pat) + '</p>' +
      '<div class="det-linhas">' +
        linhaDet_("Situação", st.replace(/_/g, " ").toLowerCase() || "não informada") +
        (lim(f.com) ? linhaDet_("Está com", f.com) : "") +
        (lim(f.obra) ? linhaDet_("Obra", f.obra) : "") +
        (lim(f.condicao) ? linhaDet_("Condição", f.condicao) : "") +
      '</div>' +
      (disponivel
        ? '<div class="campo" style="margin-top:12px"><label>Para quem</label>' +
          '<input class="campo" id="ferQuem" value="' + esc(quem) + '"></div>' +
          '<div class="campo"><label>Para quê</label>' +
          '<textarea class="campo" id="ferObs" rows="2" ' +
          'placeholder="Serviço em que a ferramenta será usada"></textarea></div>' +
          '<button class="bt laranja" id="ferRetirar">Registrar retirada</button>'
        : st === "EM_POSSE"
        ? '<div class="campo" style="margin-top:12px"><label>Condição na devolução</label>' +
          '<select class="campo" id="ferCond">' +
          '<option>Em bom estado</option><option>Com avarias</option></select></div>' +
          '<div class="campo"><label>Observações</label>' +
          '<textarea class="campo" id="ferObs" rows="2"></textarea></div>' +
          '<button class="bt laranja" id="ferDevolver">Registrar devolução</button>'
        : '<div class="aviso amarelo"><b>Este equipamento não está liberado</b>' +
          'Situação no servidor: ' + esc(st.toLowerCase()) + '. A liberação é feita ' +
          'na ferramentaria do ALMOX-PRO.</div>') +
      '<div id="ferSaida"></div>' +
    '</div>', "equipamento");

  var btR = document.getElementById("ferRetirar");
  if (btR) btR.addEventListener("click", function () {
    moverFerramenta_(pat, "retirada", {
      quem: lim((document.getElementById("ferQuem") || {}).value) || quem,
      obs: lim((document.getElementById("ferObs") || {}).value)
    });
  });
  var btD = document.getElementById("ferDevolver");
  if (btD) btD.addEventListener("click", function () {
    var cond = (document.getElementById("ferCond") || {}).value || "";
    moverFerramenta_(pat, "devolucao", {
      quem: quem,
      obs: lim((document.getElementById("ferObs") || {}).value) || cond,
      avaria: /avaria/i.test(cond)
    });
  });
};

function moverFerramenta_(pat, tipo, extra) {
  var saida = document.getElementById("ferSaida");
  saida.innerHTML = '<div class="aviso cinza">Falando com o servidor…</div>';
  var p = { patrimonio: pat, tipo: tipo };
  for (var k in extra) if (extra.hasOwnProperty(k)) p[k] = extra[k];
  api("ferramentas", "movimentar", p).then(function (r) {
    if (!r || !r.ok) {
      saida.innerHTML = '<div class="aviso vermelho"><b>O servidor recusou</b>' +
        esc((r && r.mensagem) || "Nada foi registrado.") + '</div>';
      return;
    }
    FERR.lista = null;
    toast(tipo === "retirada" ? "Retirada registrada no servidor"
                              : "Devolução registrada no servidor");
    saida.innerHTML = '<div class="aviso verde"><b>' +
      (tipo === "retirada" ? "Retirada registrada" : "Devolução registrada") + '</b>' +
      'Patrimônio ' + esc(pat) + '. O registro é o mesmo que a ferramentaria ' +
      'do ALMOX-PRO mostra.</div>' +
      '<button class="bt vazio" id="ferVoltar">Voltar à ferramentaria</button>';
    document.getElementById("ferVoltar").addEventListener("click", function () {
      ir("ferramentas");
    });
  });
}

/* ============================================================
 * TELA — MEUS PEDIDOS
 * ============================================================ */
TELAS.pedidos = function () {
  CAMPO.abaAtual = "pedidos";
  carregando("Buscando os seus pedidos…");
  api("reservas", "listar", {}).then(function (r) {
    if (!r || !r.ok) {
      pintar('<div class="cartao"><h2>Meus pedidos</h2>' + avisoErro(r) + '</div>', "pedidos");
      return;
    }
    PEDIDOS.lista = comoListaCore(r.dados);
    PEDIDOS.quando = Date.now();
    var meus = meusPedidos_(PEDIDOS.lista);
    pintar(
      '<div class="cartao"><h2>Meus pedidos</h2>' +
        '<p class="ajuda">' + meus.length + ' de ' + PEDIDOS.lista.length +
        ' pedido(s) são seus · lido agora do servidor</p></div>' +
      (meus.length
        ? meus.map(cartaoDoPedido_).join("")
        : '<div class="cartao"><b>Nenhum pedido seu</b>' +
          '<p class="ajuda">O servidor devolveu ' + PEDIDOS.lista.length +
          ' pedido(s), mas nenhum no seu nome.</p></div>'), "pedidos");
  });
};

function meusPedidos_(lista) {
  var eu = lim(CAMPO.usuario && CAMPO.usuario.nome).toUpperCase();
  var mat = lim(CAMPO.usuario && (CAMPO.usuario.matricula || CAMPO.usuario.id)).toUpperCase();
  if (!eu && !mat) return lista;
  return lista.filter(function (p) {
    var s = lim(p.solicitante).toUpperCase();
    var m = lim(p.matricula).toUpperCase();
    return (eu && s === eu) || (mat && m === mat);
  });
}

function cartaoDoPedido_(p) {
  var st = String(p.status || "").toUpperCase();
  var cor = /APROV|ENTREG|RETIRAD/.test(st) ? "verde"
          : /RECUS|REJEIT|CANCEL/.test(st) ? "vermelho" : "amarelo";
  var itens = comoListaCore(p.itens);
  return '<div class="cartao ped">' +
    '<div class="ped-topo"><b class="mono">' +
      esc(lim(p.protocolo || p.id || p.numero) || "(sem protocolo)") + '</b>' +
      '<span class="aviso ' + cor + ' selo-st">' +
      esc(st.replace(/_/g, " ").toLowerCase() || "sem status") + '</span></div>' +
    '<div class="pequeno">' + esc(lim(p.obra || p.centro)) +
      (lim(p.quando || p.data || p.criadoEm) ? ' · ' + esc(lim(p.quando || p.data || p.criadoEm)) : '') +
    '</div>' +
    (itens.length
      ? '<div class="pequeno" style="margin-top:6px">' + itens.length + ' item(ns): ' +
        esc(itens.slice(0, 3).map(function (i) { return lim(i.nome || i.descricao); })
          .filter(Boolean).join(", ")) + (itens.length > 3 ? "…" : "") + '</div>'
      : '') +
    (lim(p.motivoRecusa) ? '<div class="aviso vermelho" style="margin-top:8px"><b>Motivo</b>' +
      esc(p.motivoRecusa) + '</div>' : '') +
    '</div>';
}

/* ============================================================
 * TELA — AVISOS
 * ------------------------------------------------------------
 * O ALMOX-PRO ainda não tem uma central de notificações no
 * servidor: não existe rota de notificações em lugar nenhum, e o
 * sistema do computador monta os avisos dele na memória da própria
 * tela. Então aqui os avisos são MONTADOS a partir dos seus pedidos
 * reais, lidos agora. Está escrito na tela — ninguém vai supor um

  CAMPO.abaAtual = "avisos";

    AVISOS.quando = Date.now();
    var naoLidas = AVISOS.lista.filter(function (a) { return !avisoJaLido_(a.chave); });

    pintar(
      '<div class="cartao">' +
        '<h2>Avisos</h2>' +
        '<p class="ajuda">' + naoLidas.length + ' não lido(s) · atualizado agora</p>' +

        '<div class="aviso cinza"><b>De onde vêm estes avisos</b>' +
        'O ALMOX-PRO ainda não tem central de notificações no servidor. ' +
        'Estes avisos são montados a partir dos seus pedidos, lidos agora pela ação ' +
        '<span class="mono">reservas.listar</span>. ' +
        'O "lido" vale só neste aparelho.</div>' +
        (ANDROID.tem
          ? '<button class="bt vazio" id="avisoTeste" style="margin:0">' +
            'Testar o aviso no celular</button><div id="avisoTesteSaida"></div>'
          : '') +
      '</div>' +
      (AVISOS.lista.length
        ? AVISOS.lista.map(function (a) {
            return '<button class="pessoa aviso-linha' +
              (avisoJaLido_(a.chave) ? ' lido' : '') + '" data-aviso="' + esc(a.chave) + '">' +
              '<div class="retrato">' + a.icone + '</div>' +
              '<div class="item-txt"><span class="nome">' + esc(a.titulo) + '</span>' +
              '<span class="det">' + esc(a.texto) + '</span></div>' +
              (avisoJaLido_(a.chave) ? '' : '<span class="bolinha"></span>') +
              '</button>';
          }).join("")
        : '<div class="cartao"><b>Nada novo</b>' +
          '<p class="ajuda">Nenhum pedido seu mudou de situação.</p></div>') +
      (AVISOS.lista.length
        ? '<button class="bt vazio" id="lerTudo">Marcar tudo como lido</button>' : ''),
      "avisos");

    document.querySelectorAll("[data-aviso]").forEach(function (b) {
      b.addEventListener("click", function () {
        avisoMarcarLido_(b.getAttribute("data-aviso"));
        ir("pedidos");
      });
    });
    var lt = document.getElementById("lerTudo");
    if (lt) lt.addEventListener("click", function () {
      AVISOS.lista.forEach(function (a) { avisoMarcarLido_(a.chave); });
      limparAvisosDoCelular_();
      TELAS.avisos();
      pintarSinoBarra();
    });
    var bt = document.getElementById("avisoTeste");
    if (bt) bt.addEventListener("click", testarAvisoNoCelular_);
    ligarBotoesDaVoz_();
    pintarSinoBarra();
  });
};

function avisoDoPedido_(p) {
  var st = String(p.status || "").toUpperCase();
  var prot = lim(p.protocolo || p.id || p.numero);
  if (!prot) return null;
  var titulo, icone;
  if (/APROV/.test(st))        { titulo = "Pedido aprovado";  icone = "&#10003;"; }
  else if (/RECUS|REJEIT/.test(st)) { titulo = "Pedido recusado"; icone = "&times;"; }
  else if (/RETIRAD|ENTREG/.test(st)) { titulo = "Material entregue"; icone = "&#9745;"; }
  else if (/CANCEL/.test(st))  { titulo = "Pedido cancelado"; icone = "&times;"; }
  else                         { titulo = "Pedido aguardando aprovação"; icone = "&#8987;"; }
  return {
    chave: prot + "|" + st,
    titulo: titulo,
    icone: icone,
    texto: prot + (lim(p.obra) ? " · " + lim(p.obra) : "") +
      (lim(p.motivoRecusa) ? " · " + lim(p.motivoRecusa) : "")
  };
}
function avisosLidos_() {
  try { return JSON.parse(lerGuardado("avisosLidos") || "{}") || {}; } catch (e) { return {}; }
}
function avisoJaLido_(chave) { return !!avisosLidos_()[chave]; }
function avisoMarcarLido_(chave) {
  var m = avisosLidos_();
  m[chave] = 1;
  try { guardar("avisosLidos", JSON.stringify(m)); } catch (e) {}
}
/* o número no sino da barra de baixo */
function pintarSinoBarra() {
  var b = document.querySelector('#barra button[data-aba="avisos"] .badge');
  if (!b) return;
  var n = AVISOS.lista.filter(function (a) { return !avisoJaLido_(a.chave); }).length;
  b.textContent = n > 9 ? "9+" : String(n);
  b.style.display = n ? "" : "none";
}

/* ============================================================
 * [PWA \u00b7 16/11] INSTALA\u00c7\u00c3O, CACHE E ATUALIZA\u00c7\u00c3O \u2014 se\u00e7\u00e3o 12
 * ------------------------------------------------------------
 * Este bloco n\u00e3o muda NENHUMA tela existente. Ele s\u00f3 liga o
 * aplicativo aos tr\u00eas arquivos novos que ficam ao lado dele.
 *
 * Tr\u00eas fatos que mandam no desenho daqui:
 *
 * 1. Service worker S\u00d3 existe em https (ou localhost). Aberto da
 *    pasta Downloads, nada disto roda \u2014 e a tela de conex\u00e3o
 *    passa a dizer isso em vez de ficar calada.
 *
 * 2. Trocar a vers\u00e3o embaixo do p\u00e9 de quem est\u00e1 contando um
 *    endere\u00e7o \u00e9 jeito de perder contagem. Ent\u00e3o a vers\u00e3o nova
 *    fica ESPERANDO e quem aperta o bot\u00e3o \u00e9 ele.
 *
 * 3. O que o cofre guarda est\u00e1 escrito no service-worker.js, e a
 *    regra mais importante \u00e9 a do que ele N\u00c3O guarda: resposta do
 *    Core, nunca. Saldo guardado \u00e9 saldo que envelhece.
 * ============================================================ */
var PWA = {
  suportado: false,       /* o navegador tem service worker?        */
  possivel: false,        /* e estamos num endere\u00e7o onde ele roda?  */
  registrado: null,       /* o registro, quando existir             */
  convite: null,          /* o convite de instala\u00e7\u00e3o do Android     */
  instalado: false,       /* est\u00e1 rodando como aplicativo instalado */
  temNovidade: false,     /* h\u00e1 vers\u00e3o nova esperando              */
  cofre: "",              /* o nome do cofre que est\u00e1 atendendo     */
  motivo: ""              /* por que n\u00e3o d\u00e1, quando n\u00e3o d\u00e1         */
};

function pwaInstalado(){
  try{
    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      return true;
    if(navigator.standalone) return true;   /* iPhone */
  }catch(e){}
  return false;
}

function pwaPorQueNaoDa(){
  if(!("serviceWorker" in navigator))
    return "este navegador n\u00e3o tem a pe\u00e7a que guarda o aplicativo no aparelho";
  var p = String(location.protocol||"").toLowerCase();
  if(p === "file:" || p === "content:")
    return "este aplicativo est\u00e1 aberto como arquivo da pasta ("+p+"); "+
           "instalar s\u00f3 funciona quando ele \u00e9 aberto por um endere\u00e7o https";
  if(p !== "https:" && location.hostname !== "localhost" &&
     location.hostname !== "127.0.0.1")
    return "instalar exige https; este endere\u00e7o \u00e9 "+p;
  return "";
}

function ligarPWA(){
  PWA.instalado = pwaInstalado();
  PWA.suportado = ("serviceWorker" in navigator);
  PWA.motivo = pwaPorQueNaoDa();
  PWA.possivel = (PWA.motivo === "");
  if(!PWA.possivel) return;

  try{
    navigator.serviceWorker.register("service-worker.js").then(function(reg){
      PWA.registrado = reg;

      /* vers\u00e3o nova esperando a vez */
      function olharEspera(){
        if(reg.waiting){ PWA.temNovidade = true; pwaAvisarNovidade(); }
      }
      olharEspera();
      reg.addEventListener("updatefound", function(){
        var novo = reg.installing;
        if(!novo) return;
        novo.addEventListener("statechange", function(){
          if(novo.state === "installed" && navigator.serviceWorker.controller){
            PWA.temNovidade = true;
            pwaAvisarNovidade();
          }
        });
      });
    }, function(e){
      PWA.motivo = "o navegador recusou registrar: "+(e && e.message ? e.message : e);
      PWA.possivel = false;
    });

    navigator.serviceWorker.addEventListener("message", function(ev){
      var d = ev && ev.data;
      if(d && d.almoxaSw === "sou") PWA.cofre = lim(d.versao);
    });

    /* quando a troca acontece de fato, a p\u00e1gina recarrega UMA vez */
    var jaTrocou = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(jaTrocou) return;
      jaTrocou = true;
      location.reload();
    });

    /* pergunto ao cofre quem ele \u00e9, para poder mostrar na tela */
    if(navigator.serviceWorker.controller){
      try{ navigator.serviceWorker.controller.postMessage({ almoxaSw:"quem-e-voce" }); }
      catch(e){}
    }
  }catch(e){
    PWA.possivel = false;
    PWA.motivo = "n\u00e3o deu para registrar: "+(e && e.message ? e.message : e);
  }
}

/* o Android avisa quando PODE instalar; eu guardo o convite para
   usar no bot\u00e3o, em vez de deixar o navegador decidir a hora */
window.addEventListener("beforeinstallprompt", function(ev){
  try{ ev.preventDefault(); }catch(e){}
  PWA.convite = ev;
  var b = document.getElementById("pwaInstalar");
  if(b) b.style.display = "";
});

window.addEventListener("appinstalled", function(){
  PWA.convite = null;
  PWA.instalado = true;
});

function pwaInstalar(){
  if(!PWA.convite) return Promise.resolve({ ok:false,
    motivo:"o navegador ainda n\u00e3o ofereceu a instala\u00e7\u00e3o" });
  var c = PWA.convite;
  PWA.convite = null;
  try{ c.prompt(); }catch(e){
    return Promise.resolve({ ok:false, motivo:"o convite expirou; recarregue a p\u00e1gina" });
  }
  return c.userChoice.then(function(r){
    return { ok: (r && r.outcome === "accepted"), escolha: (r && r.outcome) || "" };
  }, function(){ return { ok:false, motivo:"n\u00e3o deu para saber a escolha" }; });
}

function pwaTrocarAgora(){
  if(!PWA.registrado || !PWA.registrado.waiting) return false;
  try{ PWA.registrado.waiting.postMessage({ almoxaSw:"trocar-agora" }); }
  catch(e){ return false; }
  return true;
}

function pwaProcurarAtualizacao(){
  if(!PWA.registrado) return Promise.resolve(false);
  return PWA.registrado.update().then(function(){
    return !!PWA.registrado.waiting;
  }, function(){ return false; });
}

/* a fita de "tem vers\u00e3o nova" \u00e9 discreta: aparece em cima, e n\u00e3o
   rouba a tela de quem est\u00e1 no meio de uma contagem */
function pwaAvisarNovidade(){
  if(document.getElementById("fitaNovidade")) return;
  var f = document.createElement("div");
  f.id = "fitaNovidade";
  f.style.cssText = "position:fixed;left:0;right:0;bottom:62px;z-index:60;"+
    "background:#E8731A;color:#fff;padding:10px 14px;font-size:14px;"+
    "display:flex;gap:10px;align-items:center;justify-content:space-between";
  f.innerHTML = '<span>Vers\u00e3o nova pronta neste aparelho.</span>'+
    '<span><button id="fnAgora" style="background:#fff;color:#8A3D00;border:0;'+
    'border-radius:8px;padding:7px 12px;font-weight:700">Atualizar</button> '+
    '<button id="fnDepois" style="background:transparent;color:#fff;border:0;'+
    'padding:7px 8px">depois</button></span>';
  document.body.appendChild(f);
  document.getElementById("fnAgora").addEventListener("click", function(){
    this.textContent = "trocando\u2026";
    if(!pwaTrocarAgora()) location.reload();
  });
  document.getElementById("fnDepois").addEventListener("click", function(){
    f.parentNode.removeChild(f);
  });
}
