<!-- ===== [PWA] 16/11 · seção 12 do prompt mestre ==============
     Estes três caminhos são RELATIVOS à pasta onde este arquivo
     for publicado. Publique manifest.webmanifest, service-worker.js
     e a pasta icons/ ao lado dele, e o Android passa a oferecer
     "instalar". Se eles não estiverem lá, nada quebra: o
     aplicativo continua abrindo como página comum.
     ============================================================ -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icone-64.png">
<link rel="apple-touch-icon" href="icons/icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALMOXA">
<!--
  ============================================================
  ALMOXA CAMPO — ferramenta auxiliar de foto e assinatura
  ------------------------------------------------------------
  O QUE É   Um arquivo sozinho, feito para o celular. Serve para
            duas coisas que hoje dependem de notebook:
              · tirar a FOTO do colaborador
              · colher a ASSINATURA da entrega de EPI
            e devolver tudo para dentro do ALMOX-PRO.

  NÃO É um segundo sistema. Ele não tem banco próprio, não guarda
  usuário, não duplica permissão. Tudo o que ele faz, faz pela
  MESMA porta /exec do ALMOX-PRO, com a MESMA sessão, usando ações
  que já existem lá:

      auth.login          entrar (usuário e senha de sempre)
      cracha.listar       quem são as pessoas
      cracha.atualizar    gravar a foto no crachá
      epi.fichas          o que a pessoa recebeu
      repo.*              guardar a assinatura no Drive

  A FOTO É UMA SÓ. Ela é gravada no crachá, e é de lá que a ficha
  de EPI e o painel já leem. Não existe segunda cópia.

  A ASSINATURA é gravada no repositório do Drive, no conjunto
  "assinaturas", com a mesma chave que o ALMOX-PRO usa — então o
  que for assinado aqui aparece na ficha impressa lá.

  ISTO NÃO É BIOMETRIA. A assinatura desenhada na tela é registro
  do processo de entrega, igual à assinatura no papel. Não prova
  identidade e não substitui crachá, senha nem digital.
  ============================================================
-->
<style>
:root{
  --fundo:#F4F6FA; --cartao:#FFFFFF; --navy:#0B1E3D; --navy2:#16325C;
  --laranja:#E8731A; --verde:#1FA971; --vermelho:#D64545; --amarelo:#B8860B;
  --texto:#10213B; --texto2:#5A6B85; --linha:#DDE4EE;
  --raio:14px; --sombra:0 2px 10px rgba(16,33,59,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--fundo);color:var(--texto);
  padding-bottom:env(safe-area-inset-bottom);
}
.topo{
  background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;
}
.topo b{font-size:16px;letter-spacing:.3px}
.topo .marca{color:var(--laranja)}
.topo .sub{font-size:11px;opacity:.75;display:block;font-weight:400;letter-spacing:0}
.voltar{
  background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;
  border-radius:9px;font-size:19px;line-height:1;cursor:pointer;flex:none;
}
.sino{margin-left:auto;font-size:11px;opacity:.8;text-align:right;line-height:1.3}
.sino i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7A8CA6;margin-right:5px}
.sino.on i{background:#4ADE80}
.sino.off i{background:#F87171}
.sino em{display:block;font-style:normal;font-size:9.5px;opacity:.55;letter-spacing:.3px}
main{padding:14px;max-width:760px;margin:0 auto}

/* [campo 47 · 15/11] O MAPA 3D VIVE DENTRO DO APLICATIVO
   ------------------------------------------------------------
   Ele disse: "deveria já abrir diretamente do aplicativo, não
   precisa abrir uma tela puxar aberto no sistema". Tinha razão.
   Abrir aba nova tira a pessoa do aplicativo e devolve ela no
   navegador, sem barra de baixo e sem volta.

   Agora o mapa é uma moldura DENTRO da tela. Continua sendo o
   MESMO arquivo publicado no site — não há uma segunda cópia do
   mapa aqui dentro, e portanto não há duas verdades. O que mudou
   é onde ele aparece.                                           */
main.mapa{padding:0;max-width:none}
.moldura3d{position:relative;width:100%;
  height:calc(100vh - var(--altoTopo,56px) - var(--altoBarra,58px));
  min-height:360px;background:#0b1020;overflow:hidden}
.moldura3d iframe{width:100%;height:100%;border:0;display:block;background:#0b1020}
.moldura3d .carregandoMapa{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;
  color:#9fb0d0;font-size:13px;text-align:center;padding:20px;
  background:#0b1020;z-index:2}
.fitaMapa{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;
  gap:8px;padding:8px;background:linear-gradient(transparent,rgba(8,12,24,.92) 40%)}
.fitaMapa .bt{flex:1;margin:0;padding:9px 6px;font-size:12.5px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 3px}
.ajuda{font-size:12.5px;color:var(--texto2);margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin:0 0 5px;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=password],input[type=search],select,textarea{
  width:100%;padding:13px 12px;font-size:16px;border:1px solid var(--linha);
  border-radius:11px;background:#fff;color:var(--texto);font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px}
.campo{margin-bottom:12px}
button{font-family:inherit}
.bt{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 14px;font-size:15.5px;font-weight:600;border:0;border-radius:12px;
  background:var(--navy);color:#fff;cursor:pointer;margin-bottom:9px;
}
.bt:active{transform:translateY(1px)}
.bt[disabled]{opacity:.5;cursor:default}
.bt.laranja{background:var(--laranja)}
.bt.verde{background:var(--verde)}
.bt.vazio{background:#fff;color:var(--navy);border:1.5px solid var(--linha)}
.bt.pequeno{padding:11px 12px;font-size:14px;width:auto;flex:1}
.linha{display:flex;gap:8px}
.aviso{padding:11px 12px;border-radius:11px;font-size:13px;margin-bottom:12px;line-height:1.4}
.aviso b{display:block;margin-bottom:2px}
.cinza{background:#EEF2F7;color:#33465F}
.azul{background:#E8F0FE;color:#1A3A6B}
.verde{background:#E7F7EF;color:#12694A}
.amarelo{background:#FDF4E3;color:#7A5B04}
.vermelho{background:#FDECEC;color:#9B2C2C}
.pessoa{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;
  background:#fff;border:1px solid var(--linha);border-radius:12px;margin-bottom:8px;cursor:pointer;
}
.pessoa:active{background:#F6F8FC}
.retrato{
  width:46px;height:46px;border-radius:11px;flex:none;background:#E3E9F2;color:#5A6B85;
  display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden;
}
.retrato img{width:100%;height:100%;object-fit:cover}
.pessoa .nome{font-weight:600;font-size:14.5px;line-height:1.25}
.pessoa .det{font-size:11.5px;color:var(--texto2)}
.selo{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.selo.sim{background:#E7F7EF;color:#12694A}
.selo.nao{background:#FDF4E3;color:#7A5B04}
.quadro{
  width:100%;height:210px;background:#fff;border:2px dashed var(--linha);
  border-radius:12px;touch-action:none;display:block;
}
video,#cmPrevia{width:100%;border-radius:12px;background:#000;display:block}
.carregando{text-align:center;padding:30px 10px;color:var(--texto2);font-size:13.5px}
.giro{
  width:26px;height:26px;border:3px solid var(--linha);border-top-color:var(--navy);
  border-radius:50%;margin:0 auto 10px;animation:gira .8s linear infinite;
}
@keyframes gira{to{transform:rotate(360deg)}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.pequeno{font-size:12px;color:var(--texto2)}
.papel{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--linha);border-radius:12px;margin-bottom:8px}
.papel .ass{height:38px;max-width:110px;object-fit:contain;background:#fff;border:1px solid var(--linha);border-radius:6px}
.itens{width:100%;border-collapse:collapse;font-size:13px}
.itens-lista{margin-top:4px}
.item-linha{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #F0F3F8}
.item-linha:last-child{border-bottom:0}
.item-txt{flex:1;min-width:0}
.item-txt b{display:block;font-size:13.5px;line-height:1.3}
.item-txt .pequeno{display:block;line-height:1.5}
.item-rec{flex:none;width:92px;text-align:center}
.item-ass{display:block;width:100%;max-height:26px;object-fit:contain;background:#fff;border:1px solid var(--linha);border-radius:5px}
.item-rec .pequeno{display:block;font-size:10px;margin-top:2px}
.item-sem{font-size:10px;color:var(--amarelo);line-height:1.3;display:block}
/* ---------- painel de identidade do colaborador ---------- */
.id-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-top:1px solid #F0F3F8}
.id-esq{min-width:0}
.id-esq b{display:block}
.id-estado{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:2px}
.id-bola{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.id-estado.sim{color:#1C6B34}
.id-estado.sim .id-bola{background:#2E9E52}
.id-estado.nao{color:#8A5A00}
.id-estado.nao .id-bola{background:#E0A42B}
.id-linha .bt{width:auto;margin:0;padding:7px 14px;flex:none}
.id-ass{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:0 0 6px}
.id-veredito{display:flex;align-items:flex-start;gap:9px;margin-top:10px;padding:10px;
  border-radius:10px;line-height:1.4}
.id-veredito .id-bola{margin-top:5px}
.id-veredito.sim{background:#EAF7EE;border:1px solid #BFE3C9;color:#1C6B34}
.id-veredito.sim .id-bola{background:#2E9E52}
.id-veredito.nao{background:#FFF7E6;border:1px solid #F0D79A;color:#8A5A00}
.id-veredito.nao .id-bola{background:#E0A42B}
.item-nota{font-size:9px;color:var(--texto2);margin-left:2px}
.nota-pe{margin:8px 0 0;line-height:1.5;color:var(--texto2)}
.val-faixa{display:flex;flex-direction:column;gap:1px;margin:8px 0 2px;padding:7px 10px;
  border-radius:9px;background:#EAF7EE;border:1px solid #BFE3C9}
.val-faixa b{font-size:11.5px;color:#1C6B34}
.val-faixa span{font-size:10.5px;color:#2F7A46;line-height:1.4}
.val-faixa.pend{background:#FFF7E6;border-color:#F0D79A}
.val-faixa.pend b{color:#8A5A00}
.val-faixa.pend span{color:#99681A}
.itens th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--texto2);padding:6px 4px;border-bottom:1px solid var(--linha)}
.itens td{padding:8px 4px;border-bottom:1px solid #F0F3F8;vertical-align:top}

/* ---------- a folha que vira PDF ---------- */
#folha{display:none}
@media print{
  body>*{display:none!important}
  #folha{display:block!important}
  @page{size:A4 portrait;margin:10mm}
}
.fl{font:11px/1.4 Arial,Helvetica,sans-serif;color:#10213B}
.fl-topo{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid #0B1E3D;padding-bottom:8px;margin-bottom:10px}
.fl-topo h1{font-size:15px;margin:0 0 2px}
.fl-topo .em{font-size:10px;color:#55637A}
.fl-foto{width:74px;height:94px;border:1px solid #C9D3E2;object-fit:cover;flex:none;background:#fff}
.fl-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-bottom:10px}
.fl-cel{border:1px solid #D7DFEC;padding:5px 7px;border-radius:4px}
.fl-cel small{display:block;font-size:8px;text-transform:uppercase;color:#6B7A93;letter-spacing:.4px}
.fl-cel b{font-size:11px}
.fl-tit{background:#0B1E3D;color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;margin:10px 0 6px;letter-spacing:.5px}
.fl-tab{width:100%;border-collapse:collapse;font-size:10px}
.fl-tab th{background:#EEF2F8;text-align:left;padding:4px 5px;border:1px solid #D7DFEC;font-size:9px;text-transform:uppercase}
.fl-tab td{padding:4px 5px;border:1px solid #D7DFEC}
.fl-termo{font-size:9px;line-height:1.45;text-align:justify;color:#33465F;margin:0}
.fl-ass{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fl-bloco{text-align:center}
.fl-img{display:block;margin:0 auto -4px;max-height:42px;max-width:94%;object-fit:contain;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fl-linha{border-top:1px solid #10213B;margin-top:2px;padding-top:3px}
.fl-bloco b{font-size:10px;display:block}
.fl-rec{text-align:center;padding:2px 3px!important}
.fl-rec-ass{display:block;margin:0 auto;max-height:22px;max-width:84px;object-fit:contain;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.fl-rec-vazio{display:block;border-bottom:1px solid #9AA6BC;height:14px;margin:3px 4px 1px}
.fl-estrela{font-size:7.6px;color:#55637A;margin:3px 0 0;line-height:1.4}
.fl-bloco small{font-size:8px;color:#55637A;display:block;line-height:1.3}
.fl-nota{font-size:7.5px;color:#4A5B76;line-height:1.25;margin-top:2px}
.fl-rodape{margin-top:12px;padding-top:5px;border-top:1px solid #D7DFEC;font-size:8px;color:#6B7A93;display:flex;justify-content:space-between}
</style>

<style>
/* ============================================================
   [campo 19] TEMA ESCURO — a referência que ele mandou
   ------------------------------------------------------------
   Fundo quase preto, cartões em azul profundo, números grandes,
   um cartão de destaque em amarelo para o que precisa de atenção,
   e barra de navegação embaixo, ao alcance do polegar.

   DUAS DECISÕES, ditas aqui para não virarem surpresa:

   1. O ACENTO CONTINUA LARANJA. A referência usa índigo e amarelo;
      o laranja é a cor da COESA e do ALMOX-PRO, e o próprio pedido
      manda manter "identidade visual alinhada à COESA". Peguei a
      ESTRUTURA e o escuro da referência, e mantive a cor da casa.
      Se você quiser índigo mesmo, é uma linha: --acento.

   2. A FOLHA IMPRESSA NÃO ESCURECE. Tudo que começa com .fl- e o
      .papel são a ficha que sai na impressora, em papel branco.
      Escurecer ali gastaria tinta e sairia ilegível. Fica clara,
      de propósito.

   Este bloco vem DEPOIS do CSS antigo e só redefine o que precisa.
   Nenhuma classe foi removida — o que já estava testado continua
   achando o que procura.
   ============================================================ */
:root{
  --fundo:#0A0C1C; --cartao:#141834; --cartao2:#1B2048;
  --navy:#0A0C1C; --navy2:#141834;
  --acento:#E8731A;            /* o laranja da COESA */
  --acento-2:#FF8C3A;
  --destaque:#F4D44D;          /* o amarelo do cartão de atenção */
  --texto:#F2F4FF; --texto2:#9AA3C7; --linha:#262C55;
  --verde:#34D399; --vermelho:#F87171; --amarelo:#FBBF24;
  --raio:16px; --sombra:0 6px 20px rgba(0,0,0,.35);
}
body{background:var(--fundo);color:var(--texto);padding-bottom:84px}
.topo{
  background:linear-gradient(180deg,#141834 0%,#0A0C1C 100%);
  border-bottom:1px solid var(--linha);
}
.topo .marca{color:var(--acento)}
.voltar{background:rgba(255,255,255,.08)}
.cartao{
  background:var(--cartao);border:1px solid var(--linha);
  border-radius:var(--raio);box-shadow:var(--sombra);color:var(--texto);
}
.cartao h2{color:var(--texto)}
.pequeno,.ajuda{color:var(--texto2)}
.campo input,.campo select,.campo textarea,input.campo,select.campo,textarea.campo{
  background:#0E1230;border:1px solid var(--linha);color:var(--texto);
}
.campo input::placeholder,input.campo::placeholder{color:#6B749B}
.campo label{color:var(--texto2)}
.bt{border-radius:13px;font-weight:700;letter-spacing:.2px}
.bt.verde{background:var(--acento);border-color:var(--acento);color:#fff}
.bt.vazio{background:transparent;border:1px solid var(--linha);color:var(--texto)}
.bt.laranja{background:var(--acento);border-color:var(--acento);color:#fff}
.aviso{border-radius:13px}
.aviso.cinza{background:#161B3C;color:var(--texto2);border:1px solid var(--linha)}
.aviso.azul{background:#16224A;color:#CBD6FF;border:1px solid #27407E}
.aviso.verde{background:#102E27;color:#8FF0CE;border:1px solid #1C5546}
.aviso.amarelo{background:#2E2710;color:#FFE08A;border:1px solid #5A4A14}
.aviso.vermelho{background:#331218;color:#FFB4B4;border:1px solid #6B2230}
.item-linha,.id-linha{border-color:var(--linha)}
.pessoa{background:var(--cartao);border:1px solid var(--linha);color:var(--texto)}
.retrato{background:#1B2048;color:var(--texto2)}
.selo.sim{background:#102E27;color:#8FF0CE}
.selo.nao{background:#2E2710;color:#FFE08A}
.id-estado.sim{color:#8FF0CE}
.id-estado.nao{color:#FFE08A}
.mono{color:inherit}

/* OS CARTÕES DE NÚMERO da referência */
.grade-ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  border-radius:var(--raio);padding:14px;border:1px solid var(--linha);
  background:var(--cartao2);color:var(--texto);text-align:left;
  display:flex;flex-direction:column;gap:6px;min-height:104px;cursor:pointer;
  font:inherit;
}
.tile b{font-size:15px;line-height:1.2}
.tile small{color:var(--texto2);font-size:11.5px;line-height:1.35}
.tile .n{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.tile.acento{background:var(--acento);border-color:var(--acento);color:#fff}
.tile.acento small{color:rgba(255,255,255,.85)}
.tile.destaque{background:var(--destaque);border-color:var(--destaque);color:#1A1A2E}
.tile.destaque small{color:rgba(26,26,46,.7)}
.tile.claro{background:#D8DBFF;border-color:#D8DBFF;color:#15193A}
.tile.claro small{color:rgba(21,25,58,.65)}
.tile .ic{font-size:20px;line-height:1}

/* A BARRA DE BAIXO, ao alcance do polegar */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:#0E1230;border-top:1px solid var(--linha);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.barra button{
  flex:1;background:none;border:0;color:var(--texto2);font:inherit;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;
  cursor:pointer;border-radius:10px;
}
.barra button .ic{font-size:19px;line-height:1}
.barra button.on{color:var(--acento)}
.barra button.on .ic{transform:translateY(-1px)}

/* [40] A PRÉVIA DO DOCUMENTO NA TELA
   O documento oficial é feito para o papel: o CSS dele esconde tudo
   fora da impressão. No celular, "imprimir" muitas vezes não abre
   nada — então a folha tem de APARECER na tela, do jeito que vai
   sair no papel, antes de qualquer coisa. */
.doc-previa{position:fixed;inset:0;z-index:95;background:#0A0C1C;display:flex;
  flex-direction:column}
.doc-previa-topo{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:#0E1230;border-bottom:1px solid var(--linha)}
.doc-previa-topo b{font-size:14px;flex:1;min-width:0;line-height:1.25}
.doc-previa-topo .bt{margin:0;width:auto;flex:none;padding:9px 12px;font-size:13px}
.doc-previa-folha{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#5A6B85;padding:10px}
.doc-previa-papel{background:#fff;color:#111;margin:0 auto;width:794px;

  <button class="voltar" id="btVoltar" style="display:none" aria-label="Voltar">&#8592;</button>

</div>

<main id="tela"></main>

<nav class="barra" id="barra" style="display:none">
  <button data-aba="inicio"><span class="ic">&#9750;</span>Início</button>
  <button data-aba="catalogo"><span class="ic">&#9707;</span>Catálogo</button>
  <button data-aba="pedidos"><span class="ic">&#9783;</span>Pedidos</button>

  <button data-aba="mais"><span class="ic">&#9776;</span>Mais</button>
</nav>

<div id="folha"></div>

<script>
/* ============================================================
 * A PORTA — a mesma do ALMOX-PRO, nada novo
 * ============================================================ */
var CAMPO = {
  url: "",
  chave: "",
  sessao: null,
  usuario: null,
  pessoas: [],
  pessoa: null,
  ficha: null,
  ultimoErro: null,
  historico: []
};

/* A VERSÃO FICA NA TELA, SEMPRE.
   O celular guarda cada download como um arquivo novo —
   ALMOXA_CAMPO.html, ALMOXA_CAMPO(1).html, (2)... — e abrir o antigo
   por engano é fácil demais. Com a versão à vista, num piscar de olho
   a gente sabe qual arquivo está rodando, em vez de discutir um erro
   que já foi consertado. */
var VERSAO = "campo 56 · 16/11";

var PADRAO_URL = "https://script.google.com/macros/s/AKfycbwWahYJywIsbRGc3t8taMWTXNgLd_1JtFJ93VmGNfAA-bXcgMlUoW6OZszZWEWMULA1/exec";
var LIMITE_FOTO = 45000;   /* o mesmo limite que o crachá já tem */

function esc(v){
  return String(v===undefined||v===null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function lim(v){ return String(v===undefined||v===null?"":v).trim(); }

function guardar(k,v){ try{ localStorage.setItem("campo."+k,v); }catch(e){} }
function lerGuardado(k){ try{ return localStorage.getItem("campo."+k)||""; }catch(e){ return ""; } }
function apagarGuardado(k){ try{ localStorage.removeItem("campo."+k); }catch(e){} }

/* ============================================================
 * [campo 24] O RASCUNHO — SALVAR SOZINHO O QUE ESTA EM ANDAMENTO
 * ------------------------------------------------------------
 * "se eu por acaso fechar, ele vai ser salvado automaticamente a
 *  ultima movimentacao."
 *
 * O que isto faz: guarda no proprio aparelho a nota que esta sendo
 * conferida, ou a entrega de EPI que esta sendo montada, e devolve
 * tudo no lugar quando o aplicativo abre de novo.
 *
 * O que isto NAO faz: lancar no estoque sozinho. Uma nota meio
 * conferida que se lancasse por conta propria somaria saldo errado,
 * e nao haveria como saber depois se o numero veio de uma conferencia
 * ou de um acidente. O rascunho avisa, em letras, que nada foi
 * lancado — quem lanca e ele, com um toque.
 *
 * Tres cuidados que o aparelho impoe:
 *  - FOTO NAO CABE. O espaco do navegador e de poucos megabytes e a
 *    foto de uma folha de nota ocupa mais que isso. Entao as imagens
 *    ficam de fora, e a tela diz que ficaram: a folha volta com os
 *    itens lidos, sem o retrato, e o botao de reler aquela folha
 *    nao aparece.
 *  - ASSINATURA NAO VOLTA. Assinatura e ato, nao e dado de
 *    formulario. Ela e buscada no cadastro na hora de entregar, como
 *    sempre foi.
 *  - CELULAR E COMPARTILHADO. O rascunho guarda de quem ele e, e so
 *    e oferecido para o mesmo login. O de outra pessoa nao aparece.
 * ============================================================ */
var RASCUNHO = { ultimo: "", relogio: null, falhou: "" };

/* ============================================================
 * [campo 25] O SALDO MUDOU — ESQUECER O QUE ESTAVA GUARDADO
 * ------------------------------------------------------------
 * O aplicativo guarda o catálogo em memória para não pedir a lista
 * inteira ao servidor a cada toque. Isso é bom, mas o guardado tinha
 * um defeito: ninguém o jogava fora depois de mexer no estoque.
 * Resultado — e foi o que ele viu — a tela de Consultar saldo
 * mostrava o número novo, porque ela lê na hora, e a tela de entrega
 * de EPI e a busca de item dentro da nota continuavam mostrando o
 * número de antes.
 *
 * Agora toda entrada, toda saída e todo item novo passam por aqui.
 * Quem guarda o catálogo tem de ser avisado quando ele envelhece.
 * ============================================================ */
var ESTOQUE_MUDOU_EM = 0;
function estoqueMudou(){
  ESTOQUE_MUDOU_EM = Date.now();
  CAMPO.catalogo       = null;   /* entrega de EPI */
  CAMPO.catalogoNF     = null;   /* busca de item dentro da nota */
  CAMPO.catalogoFalhou = "";
}

/* tira do que vai ser guardado tudo que e imagem, assinatura ou
   credencial — por tamanho e por seguranca */
function semPeso(v, prof){
  prof = prof || 0;
  if(prof > 8 || v === null || v === undefined) return null;
  if(typeof v === "string"){
    if(v.indexOf("data:") === 0) return "";
    return v.length > 4000 ? v.slice(0,4000) : v;
  }
  if(typeof v === "number" || typeof v === "boolean") return v;
  if(Object.prototype.toString.call(v) === "[object Array]"){
    return v.map(function(x){ return semPeso(x, prof+1); });
  }
  if(typeof v === "object"){
    var fora = {dataURL:1, base64:1, imagem:1, assinatura:1, foto:1,
                fotoURL:1, chave_app:1, chaveApp:1, token:1, senha:1};
    var o = {};
    Object.keys(v).forEach(function(k){
      if(fora[k]) return;
      var x = semPeso(v[k], prof+1);
      if(x !== null && x !== undefined) o[k] = x;
    });
    return o;
  }
  return null;
}

/* o que existe de trabalho em andamento, se existir */
function oQueEstaEmAndamento(){
  var n = CAMPO.nota;
  /* NOTA JA LANCADA NAO E TRABALHO PENDENTE.
     Depois de lançar, a nota continua na memória até ele tocar em
     "lançar outra" — então sem esta linha o relógio gravaria o
     rascunho de novo e na próxima abertura o aplicativo ofereceria
     "continuar" uma nota que já entrou no estoque. Seria a porta
     para lançar duas vezes. */
  if(n && n.lancado) return null;
  if(n && (listaDeItens(n).length || temAlgumCampo(n))){
    return { tipo:"nota", nota: semPeso(n) };
  }
  var car = CAMPO.carrinho || {};
  var skus = Object.keys(car).filter(function(k){ return (car[k]||{}).qtd > 0; });
  if(skus.length){
    return { tipo:"entrega",
             carrinho: semPeso(car),
             pessoa: semPeso({ id: (CAMPO.pessoa||{}).id,
                               colaborador: (CAMPO.pessoa||{}).colaborador,
                               nome: (CAMPO.pessoa||{}).nome,
                               matricula: (CAMPO.pessoa||{}).matricula,
                               cargo: (CAMPO.pessoa||{}).cargo,
                               setor: (CAMPO.pessoa||{}).setor }) };
  }
  return null;
}
function listaDeItens(n){
  return (n && Object.prototype.toString.call(n.itens) === "[object Array]") ? n.itens : [];
}
function temAlgumCampo(n){
  var c = (n && n.campos) || {};
  return !!(lim(c.numero) || lim(c.chave) || lim(c.fornecedor) || lim(c.cnpj));
}

/* grava, e CONFERE que gravou — se o espaco do aparelho nao couber,
   eu quero saber, nao quero prometer um salvamento que nao houve */
function salvarRascunho(){
  var hoje = oQueEstaEmAndamento();
  if(!hoje){ return false; }
  hoje.quando = new Date().toISOString();
  hoje.versao = VERSAO;
  hoje.login  = lerGuardado("user") || "";
  var txt;
  try { txt = JSON.stringify(hoje); } catch(e){ RASCUNHO.falhou = "não consegui montar o rascunho"; return false; }
  if(txt === RASCUNHO.ultimo) return true;      /* nada mudou */
  guardar("rascunho", txt);
  var volta = lerGuardado("rascunho");
  if(volta !== txt){
    /* quase sempre e o espaco do navegador cheio */
    RASCUNHO.falhou = "o espaço do navegador não aceitou o rascunho ("+
      Math.round(txt.length/1024)+" KB)";
    RASCUNHO.ultimo = "";
    return false;
  }
  RASCUNHO.falhou = "";
  RASCUNHO.ultimo = txt;
  RASCUNHO.quando = hoje.quando;
  pintarMarcaDoSalvamento();
  return true;
}

/* [campo 25] A MARCA NA TELA.
   "um botão bem visível que chama de salvamento automático, como a
    gente tem na planilha". A planilha não pergunta: ela diz que
   salvou. Aqui é igual — e quando NÃO salva, diz isso também. */
function textoDaMarca(){
  if(RASCUNHO.falhou){
    return '<span style="color:var(--vermelho,#c1121f)">⚠ não consegui salvar: '+
      esc(RASCUNHO.falhou)+'</span>';
  }
  if(!RASCUNHO.quando) return '<span style="opacity:.7">salvamento automático ligado</span>';
  return '✓ salvo sozinho '+esc(faz(RASCUNHO.quando));
}
function pintarMarcaDoSalvamento(){
  var el = document.getElementById("rasMarca");
  if(el) el.innerHTML = textoDaMarca();
}
function toastDoRascunho_(){
  if(typeof toast === "function") toast("Guardado no aparelho — ainda não lançado");
}
function barraDoSalvamento(){
  return '<div class="cartao" style="padding:8px 12px">'+
    '<div class="fl" style="display:flex;justify-content:space-between;'+
    'align-items:center;gap:8px;flex-wrap:wrap">'+
      '<span class="pequeno" id="rasMarca">'+textoDaMarca()+'</span>'+
      '<button class="bt vazio pequeno" id="rasAgora">Salvar agora</button>'+
    '</div>'+
    '<div class="pequeno" style="margin-top:4px;opacity:.75">Pode sair desta tela: '+
    'o trabalho fica guardado no aparelho e volta na central de operações. '+
    '<b>Salvar aqui não lança no estoque</b> — quem lança é o botão verde.</div>'+
  '</div>';
}
function ligarBotaoDeSalvarAgora(){
  var b = document.getElementById("rasAgora");
  if(!b) return;
  b.addEventListener("click", function(){
    var deu = salvarRascunho();
    b.textContent = deu ? "Salvo" : "Não deu";
    if(deu) toastDoRascunho_();
    pintarMarcaDoSalvamento();
    setTimeout(function(){ if(b) b.textContent = "Salvar agora"; }, 1800);
  });
}
function lerRascunho(){
  var t = lerGuardado("rascunho");
  if(!t) return null;
  var o; try { o = JSON.parse(t); } catch(e){ return null; }
  if(!o || !o.tipo) return null;
  /* celular compartilhado: o rascunho de outro login nao e meu */
  var meu = lerGuardado("user") || "";
  if(lim(o.login) && lim(meu) && lim(o.login) !== lim(meu)) return null;
  return o;
}
function limparRascunho(){
  apagarGuardado("rascunho");
  RASCUNHO.ultimo = "";
  RASCUNHO.falhou = "";
}

/* QUANDO SALVA
   - de 4 em 4 segundos, e so quando algo mudou de verdade;
   - quando o aplicativo sai da frente (trocar de aba, atender uma
     ligacao, apertar o botao de casa) — este e o momento que vale
     no celular, porque "fechar" quase nunca avisa;
   - quando a pagina e descarregada.
   beforeunload nao e confiavel em celular; visibilitychange e. */
function ligarSalvamentoAutomatico(){
  if(RASCUNHO.relogio) return;
  RASCUNHO.relogio = setInterval(function(){ salvarRascunho(); }, 4000);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) salvarRascunho();
  });
  window.addEventListener("pagehide", function(){ salvarRascunho(); });
}

/* quanto tempo faz, em palavras */
function faz(quando){
  var t = Date.parse(quando||"");
  if(!t) return "";
  var seg = Math.max(0, Math.round((Date.now()-t)/1000));
  if(seg < 90) return "há instantes";
  var min = Math.round(seg/60);
  if(min < 60) return "há "+min+" min";
  var h = Math.round(min/60);
  if(h < 24) return "há "+h+" h";
  var d = Math.round(h/24);
  return "há "+d+" dia"+(d>1?"s":"");
}

/**
 * Uma ida ao Core.
 *
 * O CORPO TEM QUE SER O DA PONTE, LETRA POR LETRA.
 * Faltando o cartão de visita  ponte:"ALMOXA"  e o campo  chave,
 * o servidor devolve NAO_E_PONTE e nem olha o resto do pedido —
 * foi o que aconteceu na primeira tentativa no celular. Isto aqui
 * é o mesmo corpo que o ALMOX-PRO monta, sem uma vírgula a menos.
 *
 * A CHAVE VAZIA É A FASE 1 e não pode travar nada. Se o servidor
 * recusar a chave guardada, a gente tenta UMA vez sem chave
 * nenhuma, igual o sistema faz.
 */
/* ============================================================
 * [campo 43 · 15/11] O BOTÃO QUE FICAVA "GRAVANDO NO SERVIDOR…"
 * PARA SEMPRE
 * ------------------------------------------------------------
 * Ele mandou a foto: assinatura desenhada, botão travado em
 * "Gravando no servidor…", recado "Ainda não está salva" — e
 * nada acontecia.
 *
 * A causa: NÃO HAVIA TIMEOUT EM REQUISIÇÃO NENHUMA deste
 * aplicativo. Procurei no arquivo inteiro: zero AbortController,
 * zero corrida contra relógio. Um fetch para o /exec do Apps
 * Script que não responde deixa a promessa pendurada, e como a
 * tela só reabilita o botão dentro do .then(), o botão nunca
 * volta. Isso já era assim no campo 41: não foi o cache.
 *
 * Agora toda requisição tem prazo. Vencido o prazo, a resposta
 * é uma RECUSA CLARA — e recusa clara reabilita o botão e
 * preserva o que foi desenhado. Nunca um "salvo" de mentira:
 * se o prazo venceu, eu NÃO SEI se o servidor gravou, e digo
 * exatamente isso, porque mandar assinar de novo às cegas pode
 * criar duas assinaturas.
 * ============================================================ */
var PRAZO_PADRAO_MS = 45000;   /* o Apps Script é lento, mas não tanto */

function comPrazo(promessa, ms, aoVencer){
  var relogio;
  var corrida = new Promise(function(ok){
    relogio = setTimeout(function(){
      if(typeof aoVencer === "function"){ try{ aoVencer(); }catch(e){} }
      ok({ok:false, codigo:"DEMOROU_DEMAIS", prazoVencido:true,
        mensagem:"O servidor não respondeu em "+Math.round(ms/1000)+" segundos. "+
          "NÃO dá para saber se ele gravou ou não — confira antes de repetir."});
    }, ms);
  });
  return Promise.race([promessa, corrida]).then(function(r){
    clearTimeout(relogio); return r;
  }, function(e){
    clearTimeout(relogio); throw e;
  });
}

function enviarCru(corpo, prazoMs){
  var abortar = null, sinal;
  try{
    if(typeof AbortController === "function"){
      abortar = new AbortController();
      sinal = abortar.signal;
    }
  }catch(e){ abortar = null; }

  var pedido = fetch(CAMPO.url, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(corpo),
    redirect:"follow",
    signal: sinal
  }).then(function(r){ return r.text(); }).then(function(txt){
    try{ return JSON.parse(txt); }
    catch(e){
      if(/accounts\.google\.com/i.test(txt)){
        return {ok:false,codigo:"PRECISA_PUBLICAR",
          mensagem:"O Core pediu login do Google. Publique o app com acesso “Qualquer pessoa”."};
      }
      return {ok:false,codigo:"RESPOSTA_ESTRANHA",
        mensagem:"O endereço respondeu, mas não parece ser o ALMOX-PRO. Confira se termina em /exec."};
    }
  }, function(e){
    CAMPO.ultimoErro = String(e && e.message || e);
    if(/abort/i.test(CAMPO.ultimoErro)){
      return {ok:false, codigo:"DEMOROU_DEMAIS", prazoVencido:true,
        mensagem:"O servidor não respondeu a tempo."};
    }
    return {ok:false,codigo:"SEM_CONEXAO",mensagem:"Não consegui falar com o servidor. "+CAMPO.ultimoErro};
  });

  return comPrazo(pedido, prazoMs || PRAZO_PADRAO_MS, function(){
    /* corta a conexão pendurada, para ela não voltar depois e

/* ============================================================
 * O QUADRO DE DESENHAR — o dedo no celular
 * ============================================================ */
function ligarQuadro(tela){
  var ctx = tela.getContext("2d");
  var tracos = [], atual = null, desenhando = false;
  function medir(){
    var r = tela.getBoundingClientRect();
    var e = window.devicePixelRatio||1;
    tela.width = Math.max(1,Math.round(r.width*e));
    tela.height = Math.max(1,Math.round(r.height*e));
    ctx.setTransform(e,0,0,e,0,0);
    repintar();
  }
  function repintar(){
    var r = tela.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);
    ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#10213B";
    tracos.forEach(function(t){
      if(t.length<2){
        if(t.length===1){ ctx.beginPath(); ctx.arc(t[0].x,t[0].y,1.3,0,6.3); ctx.fillStyle="#10213B"; ctx.fill(); }
        return;
      }
      ctx.beginPath(); ctx.moveTo(t[0].x,t[0].y);
      for(var i=1;i<t.length;i++) ctx.lineTo(t[i].x,t[i].y);
      ctx.stroke();
    });
  }
  function ponto(e){
    var r = tela.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }
  tela.addEventListener("pointerdown",function(e){
    e.preventDefault(); desenhando=true; atual=[ponto(e)]; tracos.push(atual);
    try{ tela.setPointerCapture(e.pointerId); }catch(x){}
    repintar();
  });
  tela.addEventListener("pointermove",function(e){
    if(!desenhando) return; e.preventDefault(); atual.push(ponto(e)); repintar();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(t){
    tela.addEventListener(t,function(e){
      if(!desenhando) return; desenhando=false;
      try{ tela.releasePointerCapture(e.pointerId); }catch(x){}
    });
  });
  window.addEventListener("resize",medir);
  setTimeout(medir,30);
  return {
    temTraco:function(){ return tracos.some(function(t){return t.length>1;}); },
    limpar:function(){ tracos=[]; repintar(); },
    desfazer:function(){ tracos.pop(); repintar(); },
    remedir: medir,
    imagem:function(){
      var f = document.createElement("canvas");
      f.width=600; f.height=200;
      var c=f.getContext("2d");
      c.fillStyle="#FFFFFF"; c.fillRect(0,0,f.width,f.height);
      c.drawImage(tela,0,0,tela.width,tela.height,0,0,f.width,f.height);
      var url=f.toDataURL("image/png");
      if(url.length>LIMITE_FOTO){
        var m=document.createElement("canvas"); m.width=420; m.height=140;
        var c3=m.getContext("2d"); c3.fillStyle="#FFFFFF"; c3.fillRect(0,0,m.width,m.height);
        c3.drawImage(f,0,0,m.width,m.height);
        url=m.toDataURL("image/jpeg",0.7);
      }
      return url;
    }
  };
}

/* ============================================================
 * A FOTO — reduzida até caber nos 45 KB do crachá
 * ============================================================ */
function reduzirFoto(fonte, larguraFonte, alturaFonte){
  var LARG=360, ALT=480;
  var tela=document.createElement("canvas");
  tela.width=LARG; tela.height=ALT;
  var c=tela.getContext("2d");
  c.fillStyle="#FFFFFF"; c.fillRect(0,0,LARG,ALT);
  /* recorta o meio, em pé, sem esticar a cara de ninguém */
  var escala=Math.max(LARG/larguraFonte, ALT/alturaFonte);
  var l=larguraFonte*escala, a=alturaFonte*escala;
  c.drawImage(fonte,(LARG-l)/2,(ALT-a)/2,l,a);
  var q=0.82, url=tela.toDataURL("image/jpeg",q);
  while(url.length>LIMITE_FOTO && q>0.3){
    q-=0.08; url=tela.toDataURL("image/jpeg",q);
  }
  if(url.length>LIMITE_FOTO){
    var m=document.createElement("canvas"); m.width=240; m.height=320;
    var c2=m.getContext("2d"); c2.fillStyle="#FFF"; c2.fillRect(0,0,240,320);
    c2.drawImage(tela,0,0,240,320);
    url=m.toDataURL("image/jpeg",0.6);
  }
  return url;
}

/* ============================================================
 * A CHAVE DA ASSINATURA — a MESMA do ALMOX-PRO

function impressaoDosItens(ids){
  var texto=ids.slice().sort().join("|");
  var n1=5381,n2=52711;
  for(var i=0;i<texto.length;i++){
    var c=texto.charCodeAt(i);
    n1=(n1*33^c)>>>0; n2=(n2*31^c)>>>0;
  }
  return (n1.toString(36)+n2.toString(36)).slice(0,12).toUpperCase();
}

   ficha impressa do ALMOX-PRO — que é justamente o que esta

/* ============================================================
 * A ASSINATURA É DO COLABORADOR, NÃO DA ENTREGA
 * ------------------------------------------------------------
 * A primeira versão guardava uma assinatura por ENTREGA. Isso faz a
 * pessoa assinar de novo a cada EPI que recebe, e espalha a mesma
 * rubrica por dezenas de registros.
 *
 * Agora é como a ficha de assinatura do banco: a pessoa assina UMA
 * vez, aquilo fica no cadastro dela, e cada entrega apenas APONTA
 * para essa assinatura — nunca copia.
 *
 * Dois tipos de registro, no mesmo conjunto "assinaturas":
 *   COLAB:<id>     a assinatura cadastrada da pessoa
 *   ENTREGA:<chave> a confirmação daquela entrega: quando, quem,
 *                   quais itens e QUAL versão da assinatura foi usada
 *
 * O segundo existe por causa do passo 7: a entrega continua tendo
 * data, hora, ficha e histórico próprios. O que não se repete é a
 * imagem.
 * ============================================================ */
/* ONDE A ASSINATURA E A FOTO MORAM.
   Antes eu pedia um conjunto chamado "assinaturas" — e o servidor
   respondia CONJUNTO_DESCONHECIDO, porque esse conjunto não existe
   no repositório dele. Não era para existir: a assinatura e a foto
   são do CADASTRO do colaborador, então vão para "usuarios", que é
   a pasta 13_USUARIOS_PERMISSOES — o mesmo armazenamento oficial
   dos colaboradores, que já existe em qualquer versão instalada.
   A confirmação de cada entrega é outra coisa: é documento assinado,
   e vai para "documentos" (11_DOCUMENTOS_PDFS). Nenhum banco novo,
   nenhum conjunto novo, nada para instalar. */
var CONJUNTO_COLAB   = "usuarios";
var CONJUNTO_ENTREGA = "documentos";
/* nome antigo, mantido para não quebrar nada que ainda o use */
var CONJUNTO_ASS = CONJUNTO_COLAB;

function idDoColaborador(p){
  if(!p) return "";
  var id = lim(p.id);
  if(id) return id;
  var m = chaveMat(p.matricula||p.chave);

}

/* O NOME COMPLETO COMO CHAVE DE BUSCA — NÃO DE GRAVAÇÃO.
   A assinatura continua guardada pelo id do colaborador, que é
   único. O que mora na chave do nome é só um bilhete dizendo
   "a assinatura desta pessoa está em COLAB:U-77". Assim a ficha
   acha a assinatura mesmo quando a matrícula mudou ou quando o id
   não bate. Se dois colaboradores diferentes tiverem o mesmo nome
   completo, o bilhete é marcado como ambíguo e ninguém o usa —
   melhor ficha sem rubrica do que rubrica da pessoa errada. */
function chaveNomeLimpo(v){
  return lim(v).toUpperCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
function chaveDoNome(p){
  var n = chaveNomeLimpo(p && (p.colaborador || p.nome));
  return n ? "COLABNOME:"+n : "";
}

/* ============================================================
 * [campo 42 · 15/11] A ASSINATURA ESTAVA SENDO BUSCADA DE NOVO
 * A CADA TELA — seção 6.3 do prompt
 * ------------------------------------------------------------
 * MEDIDO, não suposto. Rodei o aplicativo contra um Core de
 * mentira que conta cada ida ao servidor, com 700 ms de latência
 * (um /exec de Apps Script costuma levar isso ou mais):
 *
 *   · abrir a pessoa  → 1 leitura da assinatura
 *   · abrir a entrega → outra leitura DA MESMA assinatura
 *   · pedir duas vezes seguidas → duas idas ao servidor:
 *     NÃO EXISTIA CACHE NENHUM.
 *   · o caminho inteiro: 5 idas ao servidor, 9,3 s, 62 KB —
 *     e a imagem da assinatura (≈31 KB) viajava em cada leitura.
 *
 * O que eu NÃO confirmei, e por isso não vou dizer que consertei:
 * a tela NÃO trava durante a espera (contei 43 quadros desenhados
 * enquanto a assinatura carregava). A lentidão é de espera, não
 * de travamento.
 *
 * TRÊS CUIDADOS que este cache respeita, porque errar aqui é pior
 * que a lentidão:
 *
 *  1. A chave é o ID PERMANENTE do colaborador (seção 6.1), nunca
 *     o nome nem a matrícula — matrícula muda, nome repete.
 *  2. Gravar assinatura LÊ ANTES (para não apagar o histórico de
 *     ninguém) e RELÊ DEPOIS (para confirmar). Essas duas leituras
 *     passam POR FORA do cache: ler do cache ali daria uma versão
 *     velha ao bloqueio otimista e uma confirmação falsa.
 *  3. Seção 6.5: assinatura vinda do cache NÃO vale como
 *     confirmação de uma entrega nova. Por isso toda resposta
 *     servida do cache vem marcada com doCache:true, e quem
 *     confirma entrega precisa de assinatura do momento.
 *
 * A imagem fica SÓ na memória desta sessão. Não vai para o
 * localStorage: assinatura é dado pessoal e o aparelho é
 * compartilhado no almoxarifado.
 * ============================================================ */
var ASS_CACHE = {
  porId: {},        /* id permanente -> {quando, resposta} */
  emVoo: {},        /* id permanente -> promessa em andamento */
  validadeMs: 10 * 60 * 1000,
  acertos: 0, buscas: 0
};

function assCacheLer(id){
  if(!id) return null;
  var e = ASS_CACHE.porId[id];
  if(!e) return null;
  if(Date.now() - e.quando > ASS_CACHE.validadeMs){
    delete ASS_CACHE.porId[id];
    return null;
  }
  return e.resposta;
}

function assCacheGuardar(id, resposta){
  if(!id || !resposta || resposta.ok !== true) return resposta;
  ASS_CACHE.porId[id] = { quando: Date.now(), resposta: resposta };
  return resposta;
}

/* chamado SEMPRE que a assinatura muda no servidor */
function assCacheEsquecer(id){
  if(!id){ ASS_CACHE.porId = {}; ASS_CACHE.emVoo = {}; return; }
  delete ASS_CACHE.porId[id];
  delete ASS_CACHE.emVoo[id];
}

/* a cópia que vai para quem pediu é marcada, para ninguém
   confundir "mostrei a rubrica" com "a pessoa assinou agora" */
function assCacheMarcar(resposta, doCache){
  if(!resposta || typeof resposta !== 'object') return resposta;
  var copia = {};
  for(var k in resposta){ if(Object.prototype.hasOwnProperty.call(resposta,k)) copia[k] = resposta[k]; }
  copia.doCache = !!doCache;
  return copia;
}

/**
 * A porta de entrada. Serve do cache quando pode; vai ao servidor
 * quando precisa. opcoes.semCache = true força a ida ao servidor
 * (é o que a gravação usa, nas duas pontas).
 */
function lerAssinaturaCadastrada(pessoa, opcoes){
  opcoes = opcoes || {};
  var id = idDoColaborador(pessoa);
  ASS_CACHE.buscas++;

  if(!opcoes.semCache && id){
    var guardada = assCacheLer(id);
    if(guardada){
      ASS_CACHE.acertos++;
      return Promise.resolve(assCacheMarcar(guardada, true));
    }
    /* duas telas pedindo ao mesmo tempo não fazem duas requisições */
    if(ASS_CACHE.emVoo[id]) return ASS_CACHE.emVoo[id];
  }

  var promessa = lerAssinaturaDoServidor(pessoa).then(function(r){
    if(id){
      delete ASS_CACHE.emVoo[id];
      /* [campo 43] NÃO guardo a leitura pedida com semCache.
         Defeito meu no campo 42: essa leitura é a que a GRAVAÇÃO
         usa, e a gravação mexe no objeto devolvido (empurra a
         assinatura velha para o histórico e põe a nova no lugar).
         Como a cópia era rasa, mexer nela mexia no que estava
         guardado — e o cache passaria a mostrar como cadastrada
         uma assinatura que o servidor talvez nem tenha aceitado. */
      if(!opcoes.semCache) assCacheGuardar(id, r);
    }
    return assCacheMarcar(r, false);
  }, function(e){
    if(id) delete ASS_CACHE.emVoo[id];
    throw e;
  });

  if(!opcoes.semCache && id) ASS_CACHE.emVoo[id] = promessa;
  return promessa;
}

/* a leitura de verdade, que fala com o servidor */
function lerAssinaturaDoServidor(pessoa){
  var chave = chaveDoCadastro(pessoa);
  if(!chave) return Promise.resolve({ok:false, codigo:"SEM_IDENTIDADE",
    mensagem:"Esta pessoa não tem identificador no cadastro."});
  /* 1º: o módulo de identidade no servidor */
  return api("identidade","buscarCompleta", identidadeDaPessoa(pessoa)).then(function(ri){
    if(ri && ri.ok && ri.dados && ri.dados.colaborador){
      IDENT.disponivel = true; IDENT.caminho = "identidade.buscarCompleta";
      var c = ri.dados.colaborador;
      if(!lim(c.assinatura)) return {ok:true, tem:false, chave:lim(ri.dados.chave)||chave, via:IDENT.caminho};
      return {ok:true, tem:true, via:IDENT.caminho,
        dados:normalizarCadastro({
          idColaborador:c.id, nome:c.nome, matricula:c.matricula, cracha:c.cracha,
          assinatura:c.assinatura, imagem:c.assinatura,
          assinaturaEm:c.assinaturaEm, cadastradaEm:c.assinaturaEm,
          assinaturaPor:c.assinaturaPor, cadastradaPor:c.assinaturaPor,
          assinaturaVersao:c.assinaturaVersao, comoIdentificou:c.comoIdentificou,
          natureza:c.natureza, historico:c.historico||[]
        }),
        versao: Number(c.assinaturaVersao)||1, chave: lim(ri.dados.chave)||chave};
    }
    if(ri && ri.ok === false && !semModuloIdentidade(ri) && lim(ri.codigo) !== "SEM_ASSINATURA"){
      IDENT.disponivel = true;
      /* [campo 43] o aviso de prazo vencido tem de ATRAVESSAR esta
         camada. Ele morria aqui, e quem gravava recebia só "não
         consegui ler" — sem saber que foi o relógio, e sem poder
         dizer ao almoxarife se repetir era seguro. */
      return {ok:false, codigo:ri.codigo, mensagem:ri.mensagem, chave:chave,
              prazoVencido: !!ri.prazoVencido, via:"identidade"};
    }
    if(ri && lim(ri.codigo) === "SEM_ASSINATURA"){
      IDENT.disponivel = true; IDENT.caminho = "identidade.buscarCompleta";
      return {ok:true, tem:false, chave:chave, via:IDENT.caminho};
    }
    IDENT.disponivel = false;
    return lerAssinaturaPeloRepositorio(pessoa, chave);
  }, function(){ IDENT.disponivel = false; return lerAssinaturaPeloRepositorio(pessoa, chave); });
}

/* o caminho antigo, enquanto o módulo não estiver publicado */
function lerAssinaturaPeloRepositorio(pessoa, chave){
  IDENT.caminho = "repo.lerRegistro";
  return api("repo","lerRegistro",{conjunto:CONJUNTO_COLAB, id:chave}).then(function(r){
    if(r && r.ok) return {ok:true, tem:true, dados:normalizarCadastro(r.dados), via:IDENT.caminho,
      versao:(r.registro && r.registro.versao)||1, chave:chave};
    if(r && (r.codigo==="NAO_ENCONTRADO" || /não encontr|nao encontr/i.test(r.mensagem||""))){
      return {ok:true, tem:false, chave:chave};
    }
    return {ok:false, codigo:(r&&r.codigo)||"SEM_RESPOSTA",
      prazoVencido: !!(r && r.prazoVencido),
      mensagem:(r&&r.mensagem)||"o repositório não respondeu", chave:chave};
  });
}

/**
 * Grava a assinatura NO CADASTRO da pessoa.
 * Trocar uma assinatura existente guarda a anterior no histórico —
 * nada é perdido, e dá para saber quando mudou e por quê.
 */
/* O registro do colaborador pode ter sido escrito por este aplicativo
   ("imagem", "cadastradaEm") ou pelo resto do sistema ("assinatura",
   "assinaturaAtualizadaEm"). Aqui eu aceito os dois e falo um só
   idioma daqui para dentro — sem reescrever o que está gravado. */
function normalizarCadastro(d){
  d = d || {};
  if(!lim(d.imagem) && lim(d.assinatura)) d.imagem = d.assinatura;
  if(!lim(d.assinatura) && lim(d.imagem)) d.assinatura = d.imagem;
  if(!lim(d.cadastradaEm) && lim(d.assinaturaAtualizadaEm)) d.cadastradaEm = d.assinaturaAtualizadaEm;
  if(!lim(d.cadastradaPor) && lim(d.assinaturaAtualizadaPor)) d.cadastradaPor = d.assinaturaAtualizadaPor;
  if(!lim(d.status) && lim(d.statusAssinatura)) d.status = d.statusAssinatura;
  return d;
}

/* ============================================================
   [campo 17] A FOTO NO CADASTRO CENTRAL DO COLABORADOR
   ------------------------------------------------------------
   A assinatura já morava em COLAB:<id>, no conjunto "usuarios",
   e por isso funcionava para qualquer pessoa. A foto não: ela só
   tinha um endereço, o CRACHÁ. Resultado prático — quem ainda não
   teve crachá emitido não conseguia ter foto, e a tela dizia isso
   como se fosse regra, quando era só o único caminho que existia.

   Ele apontou certo: foto e assinatura são informações separadas,
   e uma não depende da outra nem do crachá.

   Agora a foto vai para o MESMO registro da assinatura, com a
   mesma leitura-antes-de-gravar e o mesmo histórico. O crachá
   continua recebendo a foto quando existe crachá — não tirei nada
   de lugar nenhum, acrescentei o endereço que faltava.
   ============================================================ */
function lerFotoCadastrada(pessoa){
  var chave = chaveDoCadastro(pessoa);
  if(!chave) return Promise.resolve({ok:false, codigo:"SEM_IDENTIDADE", tem:false,
    mensagem:"Esta pessoa não tem identificador no cadastro."});
  return api("repo","lerRegistro",{conjunto:CONJUNTO_COLAB, id:chave}).then(function(r){
    if(!r || !r.ok) return {ok:false, codigo:lim(r&&r.codigo), tem:false,
      mensagem:lim(r&&r.mensagem)};
    var d = normalizarCadastro(r.dados) || {};
    var img = lim(d.foto);
    return {ok:true, tem:!!img, imagem:img, em:lim(d.fotoAtualizadaEm),
      por:lim(d.fotoAtualizadaPor), dados:d,
      versao:(r.registro && r.registro.versao) || 1};
  }, function(e){
    return {ok:false, codigo:"SEM_CONEXAO", tem:false, mensagem:String(e&&e.message||e)};
  });
}

function gravarFotoCadastrada(pessoa, imagem, motivo){
  var chave = chaveDoCadastro(pessoa);
  if(!chave) return Promise.resolve({ok:false, codigo:"SEM_IDENTIDADE",
    mensagem:"Esta pessoa não tem identificador no cadastro — sem ele eu não sei "+
      "em qual registro gravar a foto."});
  if(!lim(imagem)) return Promise.resolve({ok:false, codigo:"SEM_IMAGEM",
    mensagem:"Nenhuma imagem foi escolhida."});

  /* LER ANTES DE GRAVAR, como a assinatura faz. Gravar sem saber o
     que já existe apagaria a assinatura de alguém sem registro. */
  return api("repo","lerRegistro",{conjunto:CONJUNTO_COLAB, id:chave}).then(function(r){
    if(!r || !r.ok){
      return {ok:false, codigo:lim(r&&r.codigo)||"SEM_CONEXAO",
        mensagem:"A foto NÃO foi gravada. Não consegui ler o cadastro antes de gravar, "+
          "e gravar sem saber o que já está lá apagaria a assinatura dela. "+
          "Tente de novo quando a conexão voltar."};
    }
    var tinha = !!(r.dados);
    var d = normalizarCadastro(r.dados) || {
      idColaborador: idDoColaborador(pessoa),
      matricula: lim(pessoa.matricula),
      nome: lim(pessoa.colaborador||pessoa.nome),
      historico: []
    };
    d.historico = d.historico || [];
    /* a foto que estava lá não some: vai para o histórico */
    if(lim(d.foto)){
      d.historico.push({tipo:"FOTO", imagem:d.foto, trocadaEm:new Date().toISOString(),
        valiaDesde:lim(d.fotoAtualizadaEm), motivo:lim(motivo)||"não informado"});
    }
    d.foto = imagem;
    d.fotoAtualizadaEm = new Date().toISOString();
    d.fotoAtualizadaPor = lim(CAMPO.usuario && CAMPO.usuario.nome);
    d.statusFoto = "CADASTRADA";

    var versao = (r.registro && r.registro.versao) || 1;
    return tinha
      ? api("repo","atualizarRegistro",
          {conjunto:CONJUNTO_COLAB, id:chave, dados:d, versaoEsperada:versao})
      : api("repo","criarRegistro",
          {conjunto:CONJUNTO_COLAB, id:chave, dados:d, modulo:"usuarios"});
  }).then(function(r2){
    if(!r2 || !r2.ok) return r2 || {ok:false, mensagem:"sem resposta do servidor"};
    /* [campo 42] a foto mora NO MESMO registro da assinatura. Gravar
       foto muda esse registro, então o que estava guardado morreu. */
    assCacheEsquecer(idDoColaborador(pessoa));
    /* CONFERE RELENDO. "Salvo" só depois de voltar do servidor. */
    return lerFotoCadastrada(pessoa).then(function(depois){
      if(!depois.ok || !depois.tem){
        return {ok:false, codigo:"NAO_VOLTOU",
          mensagem:"O servidor disse que gravou, mas a foto não voltou na releitura. "+
            "Considere NÃO gravada e tente de novo."};
      }
      return {ok:true, dados:{foto:depois.imagem}, mensagem:"Foto gravada no cadastro."};
    });
  });
}

function gravarAssinaturaCadastrada(pessoa, imagem, identificacao, motivo, aoAndar){
  /* [campo 43] a tela precisa saber EM QUE ETAPA parou. Antes
     ficava só "Gravando no servidor…" do começo ao fim, e quando
     travava ninguém sabia se travou lendo, gravando ou conferindo. */
  function andar(texto){
    if(typeof aoAndar === "function"){ try{ aoAndar(texto); }catch(e){} }
  }
  var chave = chaveDoCadastro(pessoa);
  if(!chave) return Promise.resolve({ok:false, codigo:"SEM_IDENTIDADE",
    mensagem:"Esta pessoa não tem identificador no cadastro."});
  if(!imagem) return Promise.resolve({ok:false, codigo:"SEM_TRACO", mensagem:"Nada foi assinado."});

  /* [campo 42] SEM CACHE nesta leitura: aqui eu preciso da versão
     de verdade que está no servidor, senão o bloqueio otimista
     recebe um número velho e alguém perde assinatura. */
  assCacheEsquecer(idDoColaborador(pessoa));
  andar("lendo o cadastro no servidor…");
  return lerAssinaturaCadastrada(pessoa, {semCache:true}).then(function(atual){
    if(!atual.ok){
      /* [campo 43] DOIS casos bem diferentes, e misturar os dois
         assusta à toa ou esconde risco:

         aqui o prazo venceu LENDO, antes de qualquer escrita. Então
         eu SEI que nada foi gravado, e repetir é seguro. O caso
         perigoso — prazo vencido no meio da gravação — está mais
         abaixo e fala outra coisa. */
      return {ok:false, codigo:atual.codigo||"SEM_CONEXAO",
        prazoVencido: !!atual.prazoVencido,
        etapa: "leitura antes de gravar",
        mensagem: atual.prazoVencido
          ? ("O servidor não respondeu a tempo enquanto eu LIA o cadastro. "+
             "Nada foi gravado — nem a assinatura nova, nem o histórico. "+
             "Pode tentar de novo com segurança.")
          : ("A assinatura NÃO foi gravada. Não consegui ler o cadastro antes de gravar, "+
             "e gravar sem saber o que já existe apagaria a assinatura de alguém sem registro. "+
             "Tente de novo quando a conexão voltar. ("+(atual.mensagem||"sem resposta")+")")};
    }

    var registro = atual.tem ? atual.dados : {
      idColaborador: idDoColaborador(pessoa),
      matricula: lim(pessoa.matricula),
      nome: lim(pessoa.colaborador),
      historico: []
    };
    registro.historico = registro.historico || [];

    /* a assinatura que estava lá não some: vai para o histórico */
    if(atual.tem && lim(registro.imagem)){
      registro.historico.push({
        quando: registro.cadastradaEm || "",
        quem: registro.cadastradaPor || "",
        trocadaEm: new Date().toISOString(),
        trocadaPor: lim(CAMPO.usuario && CAMPO.usuario.nome),
        motivo: lim(motivo) || "não informado"
      });
      if(registro.historico.length>20) registro.historico = registro.historico.slice(-20);
    }

    var agora = new Date().toISOString();
    var quem = lim(CAMPO.usuario && CAMPO.usuario.nome);

    registro.imagem = imagem;
    registro.status = "CADASTRADA";
    registro.cadastradaEm = agora;
    registro.cadastradaPor = quem;
    registro.comoIdentificou = lim(identificacao && identificacao.como) || "não informado";
    registro.natureza = "ASSINATURA_DESENHADA_NAO_BIOMETRICA";
    registro.origem = "ALMOXA_CAMPO";
    registro.nome = lim(pessoa.colaborador) || registro.nome;
    registro.matricula = lim(pessoa.matricula) || registro.matricula;

    /* OS NOMES DE CAMPO DO CADASTRO DO COLABORADOR.
       Quem lê este registro de fora do aplicativo procura por
       "assinatura", não por "imagem". Os dois ficam, com o mesmo
       valor: o nome antigo não some (nada que já lê quebra) e o
       nome oficial passa a existir. */
    registro.assinatura = imagem;
    registro.assinaturaAtualizadaEm = agora;
    registro.assinaturaAtualizadaPor = quem;
    registro.statusAssinatura = "CADASTRADA";

    /* 1º: o módulo de identidade. Ele resolve quem é a pessoa no
       cadastro oficial e grava no lugar certo — a decisão é do
       servidor, não deste aplicativo. Só se ele não estiver
       publicado é que eu gravo direto no repositório. */
    var ident = identidadeDaPessoa(pessoa);
    ident.assinatura = imagem;
    ident.comoIdentificou = lim(identificacao && identificacao.como) || "não informado";
    ident.usuarioResponsavel = quem;
    ident.motivo = lim(motivo) || "não informado";
    ident.origem = "ALMOXA_CAMPO";

    andar("gravando a assinatura…");
    var gravacao = api("identidade","salvarAssinatura", ident).then(function(ri){
      /* SÓ É RESPOSTA DO MÓDULO SE ELE SE IDENTIFICAR.
         Um {ok:true} vazio é o Core respondendo qualquer coisa para
         um módulo que ele não conhece — isso não é gravação. */
      if(ri && ri.ok && ri.dados && ri.dados.assinaturaSalva === true){
        IDENT.disponivel = true; IDENT.caminho = "identidade.salvarAssinatura"; return ri; }
      if(ri && ri.ok === false && !semModuloIdentidade(ri)){ IDENT.disponivel = true; return ri; }
      IDENT.disponivel = false; IDENT.caminho = "repo (reserva)";
      return atual.tem
        ? api("repo","atualizarRegistro",{conjunto:CONJUNTO_COLAB, id:chave, dados:registro, versaoEsperada:atual.versao})
        : api("repo","criarRegistro",{conjunto:CONJUNTO_COLAB, id:chave, dados:registro, modulo:"usuarios"});
    }, function(){
      IDENT.disponivel = false; IDENT.caminho = "repo (reserva)";
      return atual.tem
        ? api("repo","atualizarRegistro",{conjunto:CONJUNTO_COLAB, id:chave, dados:registro, versaoEsperada:atual.versao})
        : api("repo","criarRegistro",{conjunto:CONJUNTO_COLAB, id:chave, dados:registro, modulo:"usuarios"});
    });

    return gravacao.then(function(r){
      if(r && r.prazoVencido){
        /* [campo 43] ESTE é o caso perigoso: a escrita saiu daqui e o
           servidor não respondeu. Pode ter gravado. Não minto em
           nenhuma das duas direções. */
        return {ok:false, codigo:"DEMOROU_DEMAIS", prazoVencido:true,
          etapa:"gravação",
          mensagem:"O servidor não respondeu a tempo DEPOIS que eu mandei a "+
            "assinatura. NÃO dá para saber se ele gravou. Abra a pessoa e "+
            "veja se a assinatura apareceu antes de assinar de novo."};
      }
      if(!r || !r.ok){
        return {ok:false, codigo:(r&&r.codigo)||"NAO_CONFIRMOU",
          etapa:"gravação",
          mensagem:"A assinatura NÃO foi gravada. "+((r&&r.mensagem)||"o servidor não confirmou")};
      }
      /* [campo 42] a assinatura mudou: o que estava guardado morreu */
      assCacheEsquecer(idDoColaborador(pessoa));
      andar("conferindo no servidor…");
      /* é o servidor que diz o que ficou gravado — e tem de ser o
         SERVIDOR, não o cache, senão a confirmação é de mentira */
      return lerAssinaturaCadastrada(pessoa, {semCache:true}).then(function(depois){
        if(!depois.ok || !depois.tem || !lim(depois.dados.imagem)){
          return {ok:false, codigo:"NAO_CONFERIU",
            mensagem:"O servidor respondeu que gravou, mas a assinatura não voltou na releitura. "+
              "Considere NÃO gravada e assine de novo."};
        }
        /* o bilhete do nome é um extra: se falhar, a assinatura
           continua gravada e válida. Não derruba a gravação. */
        return apontarPeloNome(pessoa, chave).then(function(){
          return {ok:true, dados:depois.dados, versao:depois.versao};
        }, function(){
          return {ok:true, dados:depois.dados, versao:depois.versao};
        });
      });
    });
  });
}

/* Cria ou atualiza o bilhete do nome. Nunca guarda imagem. */
function apontarPeloNome(pessoa, chaveDestino){
  var chaveN = chaveDoNome(pessoa);
  if(!chaveN || !chaveDestino) return Promise.resolve({ok:true, pulou:true});

  return api("repo","lerRegistro",{conjunto:CONJUNTO_COLAB, id:chaveN}).then(function(r){
    var agora = new Date().toISOString();
    if(r && r.ok && r.dados){
      var d = r.dados;
      var versao = (r.registro && r.registro.versao) || 1;
      if(lim(d.aponta) === chaveDestino && !d.ambiguo){
        d.atualizadoEm = agora;
        return api("repo","atualizarRegistro",
          {conjunto:CONJUNTO_COLAB, id:chaveN, dados:d, versaoEsperada:versao});
      }
      /* outro colaborador já usa este nome completo */
      d.ambiguo = true;
      d.conflitos = d.conflitos || [];
      if(lim(d.aponta) && d.conflitos.indexOf(d.aponta) === -1) d.conflitos.push(d.aponta);
      if(d.conflitos.indexOf(chaveDestino) === -1) d.conflitos.push(chaveDestino);
      d.atualizadoEm = agora;
      return api("repo","atualizarRegistro",
        {conjunto:CONJUNTO_COLAB, id:chaveN, dados:d, versaoEsperada:versao});
    }
    return api("repo","criarRegistro",{conjunto:CONJUNTO_COLAB, id:chaveN, modulo:"usuarios", dados:{
      tipo: "PONTEIRO_DE_NOME",
      nome: lim(pessoa.colaborador || pessoa.nome),
      aponta: chaveDestino,
      ambiguo: false,
      criadoEm: agora,
      criadoPor: lim(CAMPO.usuario && CAMPO.usuario.nome),
      observacao: "Bilhete de busca. A assinatura mora em " + chaveDestino + "."
    }});
  });
}

var TELAS = {};
</script>

TELAS.conexao = function(){
  pintar(
    '<div class="cartao">'+
      '<h2>Onde fica o seu sistema</h2>'+

      if(r.codigo==="NAO_E_PONTE"){

          'Me avise com esta mensagem.</div>';

      }
      sino("on","conectado");

      guardar("chave", CAMPO.chave||"");

  });
};

TELAS.entrar = function(){
  pintar(
    '<div class="cartao">'+
      '<h2>Entrar</h2>'+
      '<p class="ajuda">O mesmo usuário e a mesma senha do ALMOX-PRO. Esta ferramenta não cria login próprio.</p>'+
      '<div class="campo"><label>Usuário</label><input type="text" id="enUser" autocomplete="username" value="'+esc(lerGuardado("user"))+'"></div>'+
      '<div class="campo"><label>Senha</label><input type="password" id="enSenha" autocomplete="current-password"></div>'+
      '<button class="bt laranja" id="enEntrar">Entrar</button>'+
      '<div id="enAviso"></div>'+
    '</div>', "entrar");

  var entrar=function(){
    var b=document.getElementById("enEntrar"), aviso=document.getElementById("enAviso");
    var u=lim(document.getElementById("enUser").value);
    var s=document.getElementById("enSenha").value||"";
    if(!u){ aviso.innerHTML='<div class="aviso amarelo">Falta o usuário.</div>'; return; }
    b.disabled=true; b.textContent="Entrando…";
    api("auth","login",{usuario:u, senha:s, metodo:"senha"}).then(function(r){
      b.disabled=false; b.textContent="Entrar";
      if(!r || !r.ok){ aviso.innerHTML=avisoErro(r); return; }
      CAMPO.sessao = r.dados && r.dados.sessao;
      CAMPO.usuario = (r.dados && (r.dados.usuario||r.dados.user)) || {nome:u};
      if(!CAMPO.sessao || !CAMPO.sessao.token){
        aviso.innerHTML='<div class="aviso vermelho"><b>Entrou, mas sem sessão</b>'+
          'O Core aceitou o login e não devolveu o token da sessão. Sem ele eu não consigo gravar nada.</div>';
        return;
      }
      guardar("user", u);
      sino("on","conectado");
      /* [campo 19] a porta de entrada agora e a central de operacoes,
         nao a lista de gente */
      CAMPO.historico = [];
      ir("inicio");
      conferirAvisosAgora(false);
    });
  };
  document.getElementById("enEntrar").addEventListener("click", entrar);
  document.getElementById("enSenha").addEventListener("keydown", function(e){
    if(e.key==="Enter") entrar();
  });
};

/**
 * A LISTA É O CADASTRO, NÃO OS CRACHÁS.
 *
 * A primeira versão lia só cracha.listar e apareceu "0 pessoa(s)" no
 * celular: quem ainda não teve crachá emitido simplesmente não
 * existia na tela. O cadastro de gente é usuarios.listar — é ele que
 * manda. Os crachás entram por cima, só para trazer a FOTO e o
 * CÓDIGO de quem já tem.
 */
function comoListaCore(d){
  if(Array.isArray(d)) return d;
  if(!d) return [];
  if(typeof d==="object"){
    if(Array.isArray(d.lista)) return d.lista;
    if(Array.isArray(d.itens)) return d.itens;
    if(Array.isArray(d.dados)) return d.dados;
    if(Array.isArray(d.usuarios)) return d.usuarios;
    if(Array.isArray(d.crachas)) return d.crachas;
    var ch=Object.keys(d);
    if(ch.length && ch.every(function(k){ return /^\d+$/.test(k); })){
      return ch.sort(function(a,b){return a-b;}).map(function(k){ return d[k]; });
    }
  }
  return [];
}
TELAS.pessoas = function(){
  carregando("Lendo o cadastro de colaboradores…");
  document.getElementById("subTopo").textContent="colaboradores";

  Promise.all([
    api("usuarios","listar",{}),
    api("cracha","listar",{}).then(function(x){ return x; }, function(){ return {ok:false}; })
  ]).then(function(rs){
    var rU = rs[0], rC = rs[1];
    if(!rU || !rU.ok){
      pintar('<div class="cartao">'+avisoErro(rU)+
        '<button class="bt vazio" onclick="ir(\'pessoas\')">Tentar de novo</button></div>');
      return;
    }
    var usuarios = comoListaCore(rU.dados);
    var crachas  = (rC && rC.ok) ? comoListaCore(rC.dados) : [];

    /* o crachá de cada matrícula: o ATIVO manda, e entre iguais fica
       o que tiver foto */
    var porMat = {};
    crachas.forEach(function(c){
      var m = chaveMat(c.matricula||c.codigo);
      if(!m) return;
      var ativo = /ATIV/i.test(lim(c.status));
      var tem = porMat[m];
      if(!tem || (ativo && !/ATIV/i.test(lim(tem.status))) || (!lim(tem.foto) && lim(c.foto))) porMat[m]=c;
    });

    var lista = usuarios.map(function(u){
      var m = chaveMat(u.matricula||u.login||u.id);
      var c = porMat[m];
      if(c) delete porMat[m];
      return {
        /* o identificador único do cadastro: é por ele que a
           assinatura é guardada (passo 3) */
        id: lim(u.id) || ("MAT:"+m),
        matricula: lim(u.matricula||u.login),
        colaborador: lim(u.nome||u.colaborador),
        cargo: lim(u.cargo||u.funcao),
        setor: lim(u.setor),
        status: lim(u.status||(c&&c.status)),
        codigo: lim(c && c.codigo) || lim(u.cracha||u.crachaNumero),
        foto: lim(c && c.foto) || lim(u.foto||u.crachaFotoUrl),
        temCracha: !!(c && lim(c.codigo))
      };
    });
    /* crachá que não achou dono no cadastro não some da tela */
    Object.keys(porMat).forEach(function(m){
      var c = porMat[m];
      lista.push({
        id: "MAT:"+m,
        matricula: lim(c.matricula), colaborador: lim(c.colaborador||c.nome),
        cargo:"", setor:"", status: lim(c.status),
        codigo: lim(c.codigo), foto: lim(c.foto), temCracha: !!lim(c.codigo),
        soNoCracha: true
      });
    });

    lista.sort(function(a,b){ return a.colaborador.localeCompare(b.colaborador,"pt-BR"); });
    CAMPO.pessoas = lista;
    CAMPO.semCracha = lista.filter(function(p){ return !p.temCracha; }).length;

    function desenhar(filtro){
      var f = lim(filtro).toUpperCase();
      var vistos = {}, fila = [];
      lista.forEach(function(c){
        var mat = lim(c.matricula||c.codigo).toUpperCase();
        var nome = lim(c.colaborador)||"(sem nome)";
        var id = mat || nome;
        if(vistos[id]) return;
        vistos[id]=1;
        if(f && (nome.toUpperCase().indexOf(f)===-1 && mat.indexOf(f)===-1)) return;
        fila.push(c);
      });
      var semFoto = fila.filter(function(c){ return !lim(c.foto); }).length;
      document.getElementById("psLista").innerHTML =
        (fila.length
          ? fila.slice(0,400).map(function(c,k){
              var nome=lim(c.colaborador)||"(sem nome)";
              var foto=lim(c.foto);
              return '<button class="pessoa" data-i="'+k+'">'+
                '<span class="retrato">'+(foto?'<img src="'+esc(foto)+'" alt="">':esc(iniciais(nome)))+'</span>'+
                '<span style="flex:1;min-width:0">'+
                  '<span class="nome">'+esc(nome)+'</span>'+
                  '<span class="det">mat. '+esc(lim(c.matricula)||"—")+
                  (lim(c.codigo)?" · "+esc(c.codigo):" · sem crachá")+'</span></span>'+
                '<span class="selo '+(foto?"sim":"nao")+'">'+(foto?"com foto":"sem foto")+'</span>'+
              '</button>';
            }).join("")
          : '<div class="aviso cinza">'+(f?"Ninguém com esse nome.":"O cadastro voltou vazio. Confira se o seu perfil pode ver os usuários.")+'</div>') +
        (fila.length>400?'<p class="pequeno">Mostrando 400 de '+fila.length+'. Use a busca.</p>':"");
      document.getElementById("psResumo").textContent =
        fila.length+" pessoa(s)"+(semFoto?" · "+semFoto+" sem foto":"")+
        (CAMPO.semCracha?" · "+CAMPO.semCracha+" sem crachá":"");
      Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function(b){
        b.addEventListener("click", function(){
          CAMPO.pessoa = fila[Number(b.getAttribute("data-i"))];
          ir("pessoa");
        });
      });
    }

    pintar(
      '<div class="cartao">'+
        '<div class="campo" style="margin:0"><label>Procurar</label>'+
        '<input type="search" id="psBusca" placeholder="nome ou matrícula"></div>'+
        '<p class="pequeno" id="psResumo" style="margin:8px 0 0"></p>'+
      '</div>'+
      /* [campo 25] cadastrar quem ainda não está no sistema, sem
         precisar de computador — era o pedido */
      '<div class="cartao">'+
        '<h2>Cadastrar colaborador</h2>'+
        '<p class="ajuda">Quem ainda não está no sistema. Vai para o mesmo cadastro '+
        'do computador — não existe cadastro separado no celular.</p>'+
        '<button class="bt laranja" id="psNovo">Cadastrar uma pessoa</button>'+
      '</div>'+
      '<div id="psLista"></div>'+
      /* [campo 14] a porta da area restrita. Fica embaixo da lista
         de proposito: o uso normal do aplicativo e procurar gente,
         nao dar baixa. */
      '<div class="cartao">'+
        '<h2>Conexão com o servidor</h2>'+
        '<p class="ajuda">Quando alguma coisa "não é reconhecida", é aqui que se '+
        'descobre qual módulo falta.</p>'+
        '<button class="bt vazio" id="psModulos">Ver o que o servidor atende</button>'+
      '</div>'+
      '<div class="cartao">'+
        '<h2>Nota fiscal</h2>'+
        '<p class="ajuda">XML da NF-e, PDF ou foto da DANFE. Entra no mesmo estoque do computador.</p>'+
        '<button class="bt verde" id="psNota">Lançar nota fiscal</button>'+
      '</div>'+
      '<div class="cartao">'+
        '<h2>Entrega e Baixa de Equipamentos — TI</h2>'+
        '<p class="ajuda">Area restrita. Pede a senha de novo e quem autoriza e o servidor.</p>'+
        '<button class="bt vazio" id="psTI">Abrir area de TI</button>'+
      '</div>');

    var btNovo = document.getElementById("psNovo");
    if(btNovo) btNovo.addEventListener("click", function(){ ir("novaPessoa"); });

    var btTI = document.getElementById("psTI");
    if(btTI) btTI.addEventListener("click", function(){ ir("tiEntrar"); });
    var btNF = document.getElementById("psNota");
    if(btNF) btNF.addEventListener("click", function(){ CAMPO.nota = null; ir("nota"); });
    var btMd = document.getElementById("psModulos");
    if(btMd) btMd.addEventListener("click", function(){ ir("modulos"); });

    desenhar("");
    document.getElementById("psBusca").addEventListener("input", function(){ desenhar(this.value); });
  });
};
