  function fraseDoEquipamento(itens) {
    itens = lista_(itens);
    if (!itens.length) {
      return { frase: "TIPO ______, MARCA ______, MODELO ______, NUMERO DE SERIE ______, PATRIMÔNIO ______",
        complementar: [] };
    }
    function umItem(i) {
      function forte(rotulo, valor) {
        return rotulo + " <b>" + (esc_(valor) || "______") + "</b>";
      }
      return forte("TIPO", i.tipo || i.categoria || i.descricao) + ", " +
        forte("MARCA", i.marca) + ", " +
        forte("MODELO", i.modelo) + ", " +
        forte("NUMERO DE SERIE", i.numeroSerie) + ", " +
        forte("PATRIMÔNIO", i.patrimonio);
    }
    if (itens.length === 1) {
      return { frase: umItem(itens[0]), complementar: [] };
    }
    /* mais de um: a frase fica com o primeiro e os outros vão na
       folha complementar, com o papel intacto */
    return {
      frase: umItem(itens[0]) + " <b>e mais " + (itens.length - 1) + " equipamento(s)</b> " +
        "relacionados na folha complementar deste Termo",
      complementar: itens.slice(1)
    };
  }

  function trocarCampos(texto, dados) {
    return String(texto || "")
      .replace(/\{\{NOME\}\}/g, dados.nome || "__________________________")
      .replace(/\{\{MATRICULA_CPF\}\}/g, dados.matriculaCpf || "__________________________")
      .replace(/\{\{EQUIPAMENTO\}\}/g, dados.equipamento || "")
      .replace(/\{\{PERIFERICOS\}\}/g, dados.perifericos || "______")
      .replace(/\{\{MATRICULA\}\}/g, dados.matricula || "")
      .replace(/\{\{CPF\}\}/g, dados.cpf || "")
      .replace(/\{\{OBRA\}\}/g, dados.obra || "")
      .replace(/\{\{SETOR\}\}/g, dados.setor || "")
      .replace(/\{\{CARGO\}\}/g, dados.cargo || "");
  }

  /* ============================================================
     O CSS — medidas tiradas do PDF original
     Página A4 596×842 pt = 210×297 mm. O quadro do cabeçalho vai de
     15 mm a 195 mm; o texto do corpo, de 12 mm a 198 mm.
     ============================================================ */
  function TR_CSS() {
    return "" +
      "@media print{body>*{display:none!important}#trImpressao{display:block!important}" +
      "@page{size:A4 portrait;margin:0}}" +
      "#trImpressao{display:none}" +
      ".tr-folha{width:210mm;min-height:297mm;padding:14mm 12mm 12mm;background:#fff;" +
      "font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:10.5pt;color:#000;" +
      "line-height:1.32;position:relative}" +
      ".tr-folha+.tr-folha{page-break-before:always;break-before:page}" +

      /* o quadro do cabeçalho */
      ".tr-cab{width:180mm;margin:0 auto 7mm;border-collapse:collapse;table-layout:fixed}" +
      ".tr-cab td,.tr-cab th{border:0.5pt solid #000;padding:1.2mm 2mm;vertical-align:middle}" +
      ".tr-logo{width:23mm;text-align:center;padding:2mm 1mm!important}" +
      ".tr-logo img{max-width:21mm;max-height:16mm;object-fit:contain}" +
      ".tr-marca{font-weight:800;font-size:13pt;letter-spacing:.3pt;line-height:1}" +
      ".tr-marca small{display:block;font-size:4.5pt;font-weight:600;letter-spacing:.3pt}" +
      ".tr-titulo{text-align:center;font-weight:700;font-size:13pt}" +
      ".tr-rot{font-size:6pt;font-weight:400;letter-spacing:.2pt}" +
      ".tr-assunto{font-weight:700;font-size:9.5pt;line-height:1.25}" +
      ".tr-c1{width:21mm;text-align:center;font-weight:700;font-size:11pt}" +
      ".tr-c2{width:23mm;text-align:center;font-weight:700;font-size:11pt}" +
      ".tr-c3{width:16mm;text-align:center;font-size:11pt}" +

      /* o corpo */
      ".tr-p{text-align:justify;margin:0 0 2.6mm}" +
      ".tr-p.rec{padding-left:8mm}" +
      ".tr-p b{font-weight:700}" +
      ".tr-assina{margin-top:16mm;text-align:center}" +
      ".tr-assina .tr-risco{border-top:0.5pt solid #000;width:168mm;margin:0 auto}" +
      ".tr-assina .tr-rot2{font-size:9.5pt;margin-top:1.5mm}" +
      ".tr-rubrica{height:14mm;display:flex;align-items:flex-end;justify-content:center}" +
      ".tr-rubrica img{max-height:13mm;max-width:70mm;object-fit:contain;" +
      "-webkit-print-color-adjust:exact;print-color-adjust:exact}" +
      ".tr-rubrica .tr-nome{font-size:9.5pt}" +
      ".tr-entregue{margin-top:12mm;text-align:center;font-size:10.5pt}" +
      ".tr-cidade{margin-top:6mm;font-size:10.5pt}" +
      ".tr-cidade b{font-weight:700}" +

      /* a folha complementar */
      ".tr-comp h3{font-size:11pt;margin:0 0 3mm;text-align:center}" +
".tr-comp-tab{width:100%;border-collapse:collapse;font-size:9pt}" +
      ".tr-comp-tab th,.tr-comp-tab td{border:0.5pt solid #000;padding:1.4mm 2mm}" +
      ".tr-comp-tab th{background:#EDEDED;font-size:8pt;text-align:center}" +
      ".tr-comp-tab td.c{text-align:center}" +
      ".tr-comp-tab tr{page-break-inside:avoid;break-inside:avoid}" +
      ".tr-vinculo{font-size:8pt;color:#333;margin-top:4mm;text-align:center}";
  }

  /* O CABECALHO, IGUAL NAS DUAS FOLHAS.
     Cinco colunas, como no papel: logo | assunto | versao | emissao |
     folha. A linha dos rotulos e a do conteudo juntam as duas
     primeiras, porque no original "ASSUNTO" comeca na borda
     esquerda da tabela, por baixo do logo. */
  function cabecalho(t, folha, total, empresa) {
    var logo = lp(empresa && empresa.logo);
    return '<table class="tr-cab"><colgroup>' +
      '<col style="width:23mm"><col style="width:96mm"><col style="width:21mm">' +
      '<col style="width:23mm"><col style="width:17mm"></colgroup>' +
      "<tr>" +
      '<td class="tr-logo">' +
      (logo
        ? '<img src="' + esc_(logo) + '">'
        : '<div class="tr-marca">COESA<small>desde 1974</small></div>') +
      "</td>" +
      '<td class="tr-titulo" colspan="4">' + esc_(t.titulo || "FORMULÁRIO") + "</td>" +
      "</tr><tr>" +
      '<td class="tr-rot" colspan="2">ASSUNTO</td>' +
      '<td class="tr-rot" style="text-align:center">VERSÃO</td>' +
      '<td class="tr-rot" style="text-align:center">EMISSÃO</td>' +
      '<td class="tr-rot" style="text-align:center">FOLHA N°</td>' +
      "</tr><tr>" +
      '<td class="tr-assunto" colspan="2">' + esc_(t.assunto).replace(/\n/g, "<br>") + "</td>" +
      '<td class="tr-c1">' + esc_(t.versao) + "</td>" +
      '<td class="tr-c2">' + esc_(t.emissao) + "</td>" +
      '<td class="tr-c3">' + folha + " / " + total + "</td>" +
      "</tr></table>";
  }

  /* ============================================================
     O DOCUMENTO
     ============================================================ */
  function TR_DOCUMENTO(dados) {
    dados = dados || {};
    var t = Object.assign({}, TERMO_PADRAO, dados.modelo || {});
    var empresa = dados.empresa || {};
    var itens = lista_(dados.itens);
    var eq = fraseDoEquipamento(itens);

    var campos = {
      nome: lp(dados.colaborador) ? "<b>" + esc_(dados.colaborador) + "</b>" : "",
      matriculaCpf: lp(dados.matricula) || lp(dados.cpf)
        ? "<b>" + esc_(lp(dados.matricula) + (lp(dados.cpf) ? " / " + lp(dados.cpf) : "")) + "</b>"
        : "",
      equipamento: eq.frase,
      perifericos: lp(dados.perifericos) || lp(t.periferricosPadrao),
      matricula: lp(dados.matricula), cpf: lp(dados.cpf),
      obra: lp(dados.obra), setor: lp(dados.setor), cargo: lp(dados.cargo)
    };

    /* o texto parte na marca @QUEBRA, como no papel original */
    var antes = [], depois = [], achouQuebra = false;
    lista_(t.clausulas).forEach(function (c) {
      if (lp(c) === "@QUEBRA") { achouQuebra = true; return; }
      (achouQuebra ? depois : antes).push(c);
    });

    function paragrafo(c) {
      var recuado = /^\t/.test(String(c));
      return '<p class="tr-p' + (recuado ? " rec" : "") + '">' +
        trocarCampos(String(c).replace(/^\t+/, ""), campos) + "</p>";
    }

    var totalFolhas = 2 + (eq.complementar.length ? 1 : 0);

    /* ---------- folha 1 ---------- */
    var folha1 = '<div class="tr-folha">' +
      cabecalho(t, 1, totalFolhas, empresa) +
      '<p class="tr-p">' + trocarCampos(t.abertura, campos) + "</p>" +
      '<p class="tr-p">' + trocarCampos(t.compromisso, campos) + "</p>" +
      antes.map(paragrafo).join("") +
      "</div>";

    /* ---------- folha 2 ---------- */
    var rubrica = lp(dados.assinatura);
    var folha2 = '<div class="tr-folha">' +
      cabecalho(t, 2, totalFolhas, empresa) +
      depois.map(paragrafo).join("") +
      '<div class="tr-assina">' +
      '<div class="tr-rubrica">' +
      (rubrica ? '<img src="' + esc_(rubrica) + '">' : "") +
      "</div>" +
      '<div class="tr-risco"></div>' +
      '<div class="tr-rot2">' + esc_(t.rotuloBeneficiario) + "</div>" +
      (lp(dados.colaborador)
        ? '<div class="tr-rot2" style="font-size:9pt">' + esc_(dados.colaborador) +
          (lp(dados.matricula) ? " · Matrícula " + esc_(dados.matricula) : "") + "</div>"
        : "") +
      "</div>" +
      '<p class="tr-entregue">' + esc_(t.entreguePor) + "</p>" +
      '<div class="tr-assina">' +
      '<div class="tr-rubrica">' +
      (lp(dados.assinaturaResponsavel)
        ? '<img src="' + esc_(dados.assinaturaResponsavel) + '">' : "") +
      "</div>" +
      '<div class="tr-risco"></div>' +
      '<div class="tr-rot2">' + esc_(t.rotuloResponsavel) + "</div>" +
      (lp(dados.responsavel)
        ? '<div class="tr-rot2" style="font-size:9pt">' + esc_(dados.responsavel) + "</div>" : "") +
      "</div>" +
      '<p class="tr-cidade">' + esc_(t.cidade) + ", <b>" + esc_(dataPorExtenso(dados.data)) + "</b>.</p>" +
      (lp(dados.numero) || lp(dados.cautela)
        ? '<p class="tr-vinculo">Documento ' + esc_(dados.numero) +
          (lp(dados.cautela) ? " · vinculado à cautela " + esc_(dados.cautela) : "") + "</p>"
        : "") +
      "</div>";

    /* ---------- folha complementar, só se precisar ---------- */
    var folha3 = "";
    if (eq.complementar.length) {
      folha3 = '<div class="tr-folha tr-comp">' +
        cabecalho(t, 3, totalFolhas, empresa) +
        "<h3>FOLHA COMPLEMENTAR — IDENTIFICAÇÃO PATRIMONIAL</h3>" +
        '<p class="tr-p" style="font-size:9.5pt">Relação completa dos equipamentos recebidos pelo ' +
        "beneficiário no Termo " + (esc_(dados.numero) || "") + ", incluindo o descrito na folha 1.</p>" +
        '<table class="tr-comp-tab"><thead><tr>' +
        '<th style="width:9mm">Nº</th><th>TIPO / DESCRIÇÃO</th><th style="width:20mm">MARCA</th>' +
        '<th style="width:22mm">MODELO</th><th style="width:26mm">NUMERO DE SERIE</th>' +
        '<th style="width:24mm">PATRIMÔNIO</th><th style="width:22mm">ETIQUETA COESA</th>' +
        '<th style="width:20mm">NOTA FISCAL</th>' +
        "</tr></thead><tbody>" +
        itens.map(function (i, k) {
          return "<tr>" +
            '<td class="c">' + (k + 1) + "</td>" +
            "<td>" + (esc_(i.tipo || i.descricao) || "&nbsp;") + "</td>" +
            "<td>" + (esc_(i.marca) || "&nbsp;") + "</td>" +
            "<td>" + (esc_(i.modelo) || "&nbsp;") + "</td>" +
            '<td class="c">' + (esc_(i.numeroSerie) || "&nbsp;") + "</td>" +
            '<td class="c">' + (esc_(i.patrimonio) || "&nbsp;") + "</td>" +
            '<td class="c">' + (esc_(i.etiquetaCoesa) || "&nbsp;") + "</td>" +
            '<td class="c">' + (esc_(i.notaFiscal) || "&nbsp;") + "</td>" +
            "</tr>";
        }).join("") + "</tbody></table>" +
        '<div class="tr-assina" style="margin-top:12mm">' +
        '<div class="tr-rubrica">' + (rubrica ? '<img src="' + esc_(rubrica) + '">' : "") + "</div>" +
        '<div class="tr-risco"></div>' +
        '<div class="tr-rot2">' + esc_(t.rotuloBeneficiario) + "</div></div>" +
        "</div>";
    }

    return folha1 + folha2 + folha3;
  }

  function dataPorExtenso(v) {
    var meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    var d;
    if (v instanceof Date) d = v;
    else {
      var m = lp(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
      d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date();
    }
    if (isNaN(d.getTime())) d = new Date();
    var dia = d.getDate();
    return (dia < 10 ? "0" + dia : dia) + " de " + meses[d.getMonth()] + " de " + d.getFullYear();
  }

  /* ============================================================
     IMPRIMIR
     Mesmo caminho da cautela: bloco escondido na própria página,
     revelado só na impressão, para a rubrica em base64 ir junto.
     ============================================================ */
  function TR_IMPRIMIR(dados) {
    var velho = document.getElementById("trImpressao");
    if (velho && velho.parentNode) velho.parentNode.removeChild(velho);
    var estiloVelho = document.getElementById("trEstilo");
    if (estiloVelho && estiloVelho.parentNode) estiloVelho.parentNode.removeChild(estiloVelho);

    var estilo = document.createElement("style");
    estilo.id = "trEstilo";
    estilo.textContent = TR_CSS();
    document.head.appendChild(estilo);

    var caixa = document.createElement("div");
    caixa.id = "trImpressao";
    caixa.innerHTML = TR_DOCUMENTO(dados);
    document.body.appendChild(caixa);
    setTimeout(function () { window.print(); }, 150);
  }

  window.TERMO = {
    padrao: TERMO_PADRAO,
    documento: TR_DOCUMENTO,
    css: TR_CSS,
    imprimir: TR_IMPRIMIR,
    frase: fraseDoEquipamento,
    campos: trocarCampos,
    dataPorExtenso: dataPorExtenso
  };


  /* ============================================================
     O MODELO DO TERMO
     No computador ele pode ser editado e fica gravado no Core. Aqui
     eu começo pelo padrão de fábrica e, se o Core devolver o texto
     gravado, é ele que vale — porque quem manda é o que está
     gravado, não este arquivo.
     ============================================================ */
  var MODELO_GRAVADO = null;

  function modeloAtual() {
    return MODELO_GRAVADO || TERMO_PADRAO;
  }

  function carregarModeloDoCore() {
    return api("cautelacfg", "termo", {}).then(function (r) {
      if (r && r.ok && r.dados && lp(r.dados.assunto)) {
        MODELO_GRAVADO = r.dados;
        return { ok: true, via: "cautelacfg.termo" };
      }
      return { ok: false, mensagem: lp(r && r.mensagem) };
    }, function (e) {
      return { ok: false, mensagem: String(e && e.message || e) };
    });
  }

  function dadosDoTermo(cautela, assinatura) {
    cautela = cautela || {};
    var itens = lista_(cautela.itens).map(function (i) {
      return {
        tipo: lp(i.tipo) || lp(i.categoria) || lp(i.descricao),
        descricao: lp(i.descricao),
        marca: lp(i.marca), modelo: lp(i.modelo),
        numeroSerie: lp(i.numeroSerie),
        patrimonio: lp(i.patrimonio),
        etiquetaCoesa: lp(i.etiquetaCoesa),
        /* a cautela ja guardava NOTA_FISCAL por item; so nao estava
           sendo levada ao documento */
        notaFiscal: lp(i.notaFiscal)
      };
    });
    return {
      modelo: modeloAtual(),
      empresa: empresaAtual(),
      numero: lp(cautela.numeroTermo) || "",
      cautela: lp(cautela.numero),
      colaborador: lp(cautela.colaborador),
      matricula: lp(cautela.matricula),
      cpf: lp(cautela.cpf),
      cargo: lp(cautela.cargo),
      obra: lp(cautela.obra),
      setor: lp(cautela.setorColaborador) || lp(cautela.setor),
      perifericos: lp(cautela.perifericos),
      responsavel: lp(cautela.emitidaPor) || lp(cautela.criadoPor),
      data: lp(cautela.emissao) || lp(cautela.criadoEm),
      assinatura: lp(assinatura),
      itens: itens
    };
  }

  /* ============================================================
     A EMPRESA — a mesma do documento do computador
     ============================================================ */
  function empresaAtual() {
    return { nome: "COESA ENGENHARIA", logo: "", desde: "desde 1974", cnpj: "" };
  }

  window.CAUTELA_CAMPO = {
    documentoCautela: CT_DOCUMENTO,
    cssCautela: CT_CSS,
    imprimirCautela: CT_IMPRIMIR,
    dadosDoTermo: dadosDoTermo,
    modeloAtual: modeloAtual,
    carregarModelo: carregarModeloDoCore,
    empresa: empresaAtual
  };
})();

/* ============================================================
 * [campo 41] OS DOCUMENTOS DO EQUIPAMENTO, DENTRO DA ÁREA DE TI
 * ------------------------------------------------------------
 * Ele procurou o documento na área de TI e não achou: eu tinha
 * posto as cautelas em "Mais", longe de onde o trabalho acontece.
 * Quem está com o notebook na mão e a pessoa esperando não vai
 * caçar menu. Agora, na tela do equipamento, aparecem os dois
 * documentos da cautela daquele patrimônio.
 *
 * Se o patrimônio não estiver em cautela nenhuma, a tela diz isso —
 * em vez de mostrar botão que abriria documento de outra pessoa.
 * ============================================================ */
function documentosDoEquipamento_(patrimonio) {
  var caixa = document.getElementById("tiDocs");
  if (!caixa) return;
  if (!lim(patrimonio)) {
    caixa.innerHTML = '<b class="small">DOCUMENTOS DESTE EQUIPAMENTO</b>' +
      '<p class="ajuda">Este equipamento veio sem número de patrimônio, então não ' +
      'tenho como ligar a uma cautela.</p>';
    return;
  }
  api("cautela", "listar", {}).then(function (r) {
    var c2 = document.getElementById("tiDocs");
    if (!c2) return;
    if (!r || !r.ok) {
      c2.innerHTML = '<b class="small">DOCUMENTOS DESTE EQUIPAMENTO</b>' +
        '<div class="aviso amarelo"><b>Não consegui ler as cautelas</b>' +
        esc(lim(r && r.mensagem) || "o servidor não respondeu") + '</div>';
      return;
    }
    CAUT.lista = comoListaCore(r.dados);
    var alvo = lim(patrimonio).toUpperCase();
    var dele = CAUT.lista.filter(function (c) {
      if (lim(c.status).toUpperCase() === "EXCLUIDA") return false;
      return comoListaCore(c.itens).some(function (i) {
        return [lim(i.patrimonio), lim(i.etiquetaCoesa), lim(i.numeroSerie)]
          .some(function (v) { return v && v.toUpperCase() === alvo; });
      });
    });

    if (!dele.length) {
      c2.innerHTML = '<b class="small">DOCUMENTOS DESTE EQUIPAMENTO</b>' +
        '<div class="aviso amarelo"><b>Este patrimônio não está em nenhuma cautela</b>' +
        'Procurei por <span class="mono">' + esc(patrimonio) + '</span> em ' +
        CAUT.lista.length + ' cautela(s). Sem cautela não há documento para abrir — ' +
        'e eu não vou abrir o de outra pessoa.</div>';
      return;
    }

    /* o mais recente primeiro: é o que vale hoje */
    dele.sort(function (a, b) {
      return String(b.emissao || b.criadoEm || "").localeCompare(
             String(a.emissao || a.criadoEm || ""));
    });
    var c = dele[0];
    c2.innerHTML = '<b class="small">DOCUMENTOS DESTE EQUIPAMENTO</b>' +
      '<p class="ajuda">Cautela <span class="mono">' + esc(lim(c.numero)) + '</span> · ' +
      esc(lim(c.colaborador) || "sem colaborador") +
      (dele.length > 1 ? ' · <b>' + (dele.length - 1) + ' cautela(s) mais antiga(s) ' +
        'com este patrimônio</b>' : '') + '</p>' +
      '<button class="bt vazio" id="tiDocPadrao">Cautela de Equipamentos</button>' +
      '<button class="bt vazio" id="tiDocTermo">Termo de Responsabilidade — TI</button>' +
      '<button class="bt laranja" id="tiDocDois">Gerar os dois</button>' +
      '<div id="cauSaida"></div>';

    document.getElementById("tiDocPadrao").addEventListener("click", function () {
      gerarDocumentoDaCautela_(c, "padrao"); });
    document.getElementById("tiDocTermo").addEventListener("click", function () {
      gerarDocumentoDaCautela_(c, "termo"); });
    document.getElementById("tiDocDois").addEventListener("click", function () {
      gerarDocumentoDaCautela_(c, "dois"); });
  }, function (e) {
    var c3 = document.getElementById("tiDocs");
    if (c3) c3.innerHTML = '<b class="small">DOCUMENTOS DESTE EQUIPAMENTO</b>' +
      '<div class="aviso amarelo"><b>A rede falhou</b>' +
      esc(String(e && e.message || e)) + '</div>';
  });
}

/* os botoes de gerar vivem em telas diferentes; travar so os que
   existirem evita erro quando o documento e aberto pela area de TI */
function travarBotoesDaCautela_(travar) {
  ["cauDocPadrao", "cauDocTermo", "cauDocDois",
   "tiDocPadrao", "tiDocTermo", "tiDocDois"].forEach(function (id) {
    var b = document.getElementById(id);
    if (b) b.disabled = !!travar;
  });
}

/* ============================================================
 * [campo 40] VER O DOCUMENTO, E ASSINAR NA HORA
 * ------------------------------------------------------------
 * DOIS PROBLEMAS QUE ELE VIU, E QUE SÃO O MESMO:
 *
 * 1. "não tô vendo PDF gerado". No celular, dentro do aplicativo,
 *    window.print() muitas vezes não abre nada — o WebView não tem
 *    janela de impressão. O documento era montado e ficava
 *    invisível. Agora a folha APARECE na tela, do tamanho do papel,
 *    e dali é que sai a impressão ou o PDF.
 *
 * 2. "um campo para assinar digitalmente". Se o colaborador não tem
 *    assinatura no cadastro, ele assina ali mesmo, com o dedo, e a
 *    folha é remontada com a assinatura dentro. Fica registrado
 *    quem conferiu a identificação — porque o desenho sozinho não
 *    prova quem assinou, e o sistema não vai dizer que prova.
 * ============================================================ */

var DOCPREV = { aberto: "", html: "", css: "", titulo: "", cautela: null, qual: "" };

function mostrarDocumento_(titulo, css, html, cautela, qual) {
  fecharDocumento_();
  DOCPREV = { aberto: "1", html: html, css: css, titulo: titulo,
              cautela: cautela, qual: qual };

  var caixa = document.createElement("div");
  caixa.className = "doc-previa";
  caixa.id = "docPrevia";
  caixa.innerHTML =
    '<div class="doc-previa-topo">' +
      '<b>' + esc(titulo) + '</b>' +
      '<button class="bt vazio" id="docFechar">Fechar</button>' +
    '</div>' +
    '<div class="doc-previa-folha" id="docFolha">' +
      '<div class="doc-previa-papel" id="docPapel">' + html + '</div>' +
    '</div>' +
    '<div class="doc-previa-pe">' +
      '<div class="linha">' +
        '<button class="bt laranja pequeno" id="docImprimir" style="margin:0">' +
          'Imprimir / salvar PDF</button>' +
        '<button class="bt vazio pequeno" id="docAssinar" style="margin:0">' +
          'Assinar agora</button>' +
      '</div>' +
      '<div id="docAviso"></div>' +
    '</div>';
  document.body.appendChild(caixa);

  var estilo = document.createElement("style");
  estilo.id = "docPreviaEstilo";
  estilo.textContent = css;
  document.head.appendChild(estilo);

  encaixarPapel_();
  document.getElementById("docFechar").addEventListener("click", fecharDocumento_);
  document.getElementById("docImprimir").addEventListener("click", imprimirDocumento_);
  document.getElementById("docAssinar").addEventListener("click", function () {
    assinarDocumentoAgora_();
  });
}

/* a folha tem 794px (A4 a 96dpi); o celular tem menos. Encolho a
   folha para caber na largura, em vez de deixar o texto quebrar —
   assim o que está na tela é o que vai sair no papel. */
function encaixarPapel_() {
  var folha = document.getElementById("docFolha");
  var papel = document.getElementById("docPapel");
  if (!folha || !papel) return;
  var larg = folha.clientWidth - 20;
  var escala = Math.min(1, larg / 794);
  papel.style.transform = "scale(" + escala + ")";
  papel.style.marginBottom = (papel.scrollHeight * (escala - 1)) + "px";
}

function fecharDocumento_() {
  ["docPrevia", "docPreviaEstilo"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
  DOCPREV.aberto = "";
}

function imprimirDocumento_() {
  var aviso = document.getElementById("docAviso");
  /* a folha para a impressão vai para o corpo da página, como o
     documento oficial espera — e sozinha, nunca junto da outra */
  limparFolhasMontadas_();
  var estilo = document.createElement("style");
  estilo.id = DOCPREV.qual === "termo" ? "trEstilo" : "ctEstilo";
  estilo.textContent = DOCPREV.css;
  document.head.appendChild(estilo);
  var caixa = document.createElement("div");
  caixa.id = DOCPREV.qual === "termo" ? "trImpressao" : "ctImpressao";
  caixa.innerHTML = DOCPREV.html;
  document.body.appendChild(caixa);

  var deu = true;
  try {
    if (typeof window.print === "function") window.print();
    else deu = false;
  } catch (e) { deu = false; }

  if (aviso) {
    aviso.innerHTML = deu
      ? '<p class="pequeno">Se a janela de impressão não abrir, o aplicativo do ' +
        'celular não tem impressão. A folha continua aí na tela, e dá para tirar ' +
        'print ou abrir esta mesma tela no computador para imprimir.</p>'
      : '<div class="aviso amarelo"><b>Este aplicativo não imprime</b>' +
        'A folha está montada e aparece aí em cima. Para sair em papel ou em PDF, ' +
        'abra esta cautela no computador.</div>';
  }
}

/* ---------- assinar na hora, com o dedo ---------- */
function assinarDocumentoAgora_() {
  var c = DOCPREV.cautela, qual = DOCPREV.qual;
  if (!c) return;
  fecharDocumento_();
  CAMPO.pessoa = {
    id: lim(c.idColaborador || c.colaboradorId),
    colaborador: lim(c.colaborador), nome: lim(c.colaborador),
    matricula: lim(c.matricula)
  };
  pintar(
    '<div class="cartao">' +
      '<h2>Assinatura de ' + esc(lim(c.colaborador)) + '</h2>' +
      '<p class="ajuda">Cautela ' + esc(lim(c.numero)) + ' · esta assinatura entra ' +
      'no documento e fica no cadastro do colaborador.</p>' +
      '<div class="aviso amarelo"><b>Quem assina aqui é o colaborador</b>' +
      'Entregue o aparelho para <b>' + esc(lim(c.colaborador)) + '</b> assinar. ' +
      'Fica registrado quem conferiu a identificação — o desenho sozinho não ' +
      'prova quem assinou, e eu não vou dizer que prova.</div>' +
      '<div class="campo"><label>Como ele foi identificado</label>' +
        '<select class="campo" id="dsComo">' +
          '<option value="">— escolha —</option>' +
          '<option value="cracha">Passou o crachá agora</option>' +
          '<option value="documento">Apresentou documento com foto</option>' +
          '<option value="conhecido">Conferido na hora pelo responsável</option>' +
        '</select></div>' +
      '<canvas class="quadro" id="dsTela"></canvas>' +
      '<p class="pequeno">Assine com o dedo.</p>' +
      '<div class="linha" style="margin-bottom:10px">' +
        '<button class="bt vazio pequeno" id="dsLimpar" style="margin:0">Limpar</button>' +
        '<button class="bt vazio pequeno" id="dsDesfazer" style="margin:0">Desfazer</button>' +
      '</div>' +
      '<button class="bt laranja" id="dsUsar">Assinar e ver o documento</button>' +
      '<button class="bt vazio" id="dsVoltar">Voltar sem assinar</button>' +
      '<div id="dsAviso"></div>' +
    '</div>', "assinatura");

  var quadro = ligarQuadro(document.getElementById("dsTela"));
  var aviso = document.getElementById("dsAviso");
  setTimeout(quadro.remedir, 150);
  document.getElementById("dsLimpar").addEventListener("click", function () { quadro.limpar(); });
  document.getElementById("dsDesfazer").addEventListener("click", function () { quadro.desfazer(); });
  document.getElementById("dsVoltar").addEventListener("click", function () { ir("cautela", lim(c.numero)); });

  document.getElementById("dsUsar").addEventListener("click", function () {
    var como = lim((document.getElementById("dsComo") || {}).value);
    if (!como) {
      aviso.innerHTML = '<div class="aviso amarelo">Diga como a pessoa foi identificada. ' +
        'Sem isso a assinatura não vale como registro.</div>';
      return;
    }
    if (!quadro.temTraco()) {
      aviso.innerHTML = '<div class="aviso amarelo">O quadro está em branco.</div>';
      return;
    }
    var desenho = quadro.imagem();
    aviso.innerHTML = '<div class="aviso cinza">Guardando no cadastro do colaborador…</div>';
    /* a assinatura vai para o CADASTRO CENTRAL, como as outras —
       não guardo cópia dentro da cautela */
    var guardar = (typeof gravarAssinaturaCadastrada === "function")
      ? gravarAssinaturaCadastrada(CAMPO.pessoa, desenho, "assinada na cautela " +
          lim(c.numero) + " · identificação: " + como)
      : Promise.resolve({ ok: false, mensagem: "não achei onde gravar a assinatura" });

    Promise.resolve(guardar).then(function (r) {
      var guardou = !!(r && r.ok);
      abrirDocumentoDaCautela_(c, qual, desenho, guardou
        ? '<div class="aviso verde"><b>Assinatura gravada no cadastro</b>' +
          'Ela passa a valer para os próximos documentos deste colaborador.</div>'
        : '<div class="aviso amarelo"><b>Assinei o documento, mas não gravei no cadastro</b>' +
          esc(lim(r && r.mensagem) || "o servidor não confirmou") +
          '<br>A assinatura está neste documento; para ficar no cadastro, tente de novo ' +
          'pela tela de assinatura.</div>');
    }, function (e) {
      abrirDocumentoDaCautela_(c, qual, desenho,
        '<div class="aviso amarelo"><b>Assinei o documento, mas não gravei no cadastro</b>' +
        esc(String(e && e.message || e)) + '</div>');
    });
  });
}

/* ============================================================
 * [campo 39] OS EQUIPAMENTOS JÁ CAUTELADOS, NA TELA DA TI
 * ------------------------------------------------------------
 * Em vez de digitar o patrimônio de cabeça, a pessoa escolhe de uma
 * lista do que o servidor diz estar cautelado. Dá para procurar pelo
 * patrimônio, pela série, pela etiqueta, pelo nome do equipamento,
 * pelo colaborador OU pelo número da cautela — porque às vezes o que
 * está na mão é o papel, não a etiqueta.
 *
 * A lista é LEITURA da mesma porta das cautelas (cautela.listar).
 * Não cria nada, não repete entrega, e quando o servidor não
 * responde ela diz isso em vez de aparecer vazia.
 * ============================================================ */
function equipamentosCautelados_(cautelas) {
  var fora = [];
  comoListaCore(cautelas).forEach(function (c) {
    var st = lim(c.status).toUpperCase();
    if (st === "EXCLUIDA") return;          /* cautela cancelada não conta */
    comoListaCore(c.itens).forEach(function (i) {
      var pat = lim(i.patrimonio) || lim(i.etiquetaCoesa) || lim(i.numeroSerie);
      if (!pat) return;                      /* sem identificador não dá para buscar */
      fora.push({
        patrimonio: pat,
        descricao: lim(i.descricao) || lim(i.tipo) || "(sem descrição)",
        serie: lim(i.numeroSerie),
        etiqueta: lim(i.etiquetaCoesa),
        colaborador: lim(c.colaborador),
        matricula: lim(c.matricula),
        cautela: lim(c.numero),
        termo: lim(c.numeroTermo),
        obra: lim(c.obra),
        devolvida: st === "DEVOLVIDA"
      });
    });
  });
  return fora;
}

function linhaDoCautelado_(e) {
  return '<button class="pessoa" data-cauteq="' + esc(e.patrimonio) + '">' +
    '<div class="retrato">&#9881;</div>' +
    '<div class="item-txt"><span class="nome">' + esc(e.descricao) + '</span>' +
    '<span class="det mono">' + esc(e.patrimonio) +
      (e.serie ? ' · série ' + esc(e.serie) : '') + '</span>' +
    '<span class="det">com ' + esc(e.colaborador || "—") +
      ' · cautela ' + esc(e.cautela) + '</span>' +
    '</div>' +
    (e.devolvida ? '<span class="selo nao">devolvida</span>'
                 : '<span class="selo sim">em vigor</span>') +
    '</button>';
}

function pintarCautelados_(aoEscolher) {
  var caixa = document.getElementById("tiCautelados");
  if (!caixa) return;
  api("cautela", "listar", {}).then(function (r) {
    var c2 = document.getElementById("tiCautelados");
    if (!c2) return;
    if (!r || !r.ok) {
      c2.innerHTML = '<b class="small">EQUIPAMENTOS CAUTELADOS</b>' +
        '<div class="aviso amarelo"><b>Não consegui listar</b>' +
        esc(lim(r && r.mensagem) || "o servidor não respondeu as cautelas") +
        '<br>Dá para ler a etiqueta ou digitar o código assim mesmo.</div>';
      return;
    }
    CAUT.lista = comoListaCore(r.dados);
    var todos = equipamentosCautelados_(CAUT.lista);
    if (!todos.length) {
      c2.innerHTML = '<b class="small">EQUIPAMENTOS CAUTELADOS</b>' +
        '<p class="ajuda">O servidor respondeu, mas nenhuma cautela tem equipamento ' +
        'com patrimônio para listar aqui.</p>';
      return;
    }
    c2.innerHTML = '<b class="small">EQUIPAMENTOS CAUTELADOS</b>' +
      '<p class="ajuda">' + todos.length + ' equipamento(s) · toque para abrir, ' +
      'ou procure pelo patrimônio ou pelo número da cautela</p>' +
      '<input type="search" class="campo" id="tiCautBusca" ' +
      'placeholder="Patrimônio, série, equipamento, pessoa ou cautela…">' +
      '<div id="tiCautLista">' + todos.slice(0, 40).map(linhaDoCautelado_).join("") + '</div>';

    function ligar() {
      document.querySelectorAll("[data-cauteq]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (typeof aoEscolher === "function") aoEscolher(b.getAttribute("data-cauteq"));
        });
      });
    }
    function redesenhar(t) {
      var f = !t ? todos : todos.filter(function (e) {
        return [e.patrimonio, e.serie, e.etiqueta, e.descricao, e.colaborador,
                e.matricula, e.cautela, e.termo, e.obra]
          .join(" ").toLowerCase().indexOf(t.toLowerCase()) > -1;
      });
      document.getElementById("tiCautLista").innerHTML = f.length
        ? f.slice(0, 40).map(linhaDoCautelado_).join("")
        : '<div class="aviso cinza" style="margin:8px 0 0">Nenhum equipamento com ' +
          'esse texto. Dá para ler a etiqueta ou digitar o código.</div>';
      ligar();
    }
    var busca = document.getElementById("tiCautBusca");
    var tmp = null;
    if (busca) busca.addEventListener("input", function () {
      clearTimeout(tmp);
      tmp = setTimeout(function () { redesenhar(lim(busca.value)); }, 220);
    });
    ligar();
  }, function (e) {
    var c3 = document.getElementById("tiCautelados");
    if (c3) c3.innerHTML = '<b class="small">EQUIPAMENTOS CAUTELADOS</b>' +
      '<div class="aviso amarelo"><b>A rede falhou</b>' +
      esc(String(e && e.message || e)) + '</div>';
  });
}

/* ============================================================
 * [campo 38] AS TELAS DE CAUTELA NO CELULAR
 * ------------------------------------------------------------
 * A lista vem de cautela.listar — a MESMA porta do computador.
 * Abrir uma cautela mostra DUAS entradas, cada uma com o seu
 * número e o seu botão. Nunca um documento só com os dois dentro.
 *
 * O QUE ESTA TELA NÃO FAZ:
 *   · não cria cautela ao visualizar nem ao imprimir;
 *   · não mexe em estoque, nem repete entrega;
 *   · não carimba assinatura antiga como se fosse de agora;
 *   · não deixa dois cliques gerarem dois documentos.
 * ============================================================ */

var CAUT = { lista: null, quando: 0, erro: "", gerando: "" };

TELAS.cautelas = function () {
  CAMPO.abaAtual = "mais";
  carregando("Lendo as cautelas…");
  api("cautela", "listar", {}).then(function (r) {
    if (!r || !r.ok) {
      CAUT.erro = lim(r && r.mensagem);
      pintar('<div class="cartao"><h2>Cautelas</h2>' + avisoErro(r) +
        '<p class="ajuda">As cautelas são lidas pela ação ' +
        '<span class="mono">cautela.listar</span> — a mesma do computador.</p></div>',
        "cautelas");
      return;
    }
    CAUT.lista = comoListaCore(r.dados);
    CAUT.quando = Date.now();
    CAUT.erro = "";
    var valem = CAUT.lista.filter(function (c) {
      var st = lim(c.status).toUpperCase();
      return st !== "EXCLUIDA" && st !== "DEVOLVIDA";
    });

    pintar(
      '<div class="cartao">' +
        '<h2>Cautelas</h2>' +
        '<p class="ajuda">' + CAUT.lista.length + ' emitida(s) · ' +
        valem.length + ' em vigor</p>' +
        '<input type="search" class="campo" id="cauBusca" ' +
        'placeholder="Buscar por número, colaborador ou patrimônio…">' +
      '</div>' +
      '<div id="cauLista">' + (CAUT.lista.length
        ? CAUT.lista.slice(0, 60).map(cartaoDaCautela_).join("")
        : '<div class="cartao"><b>Nenhuma cautela ainda</b>' +
          '<p class="ajuda">O servidor respondeu, mas a lista veio vazia.</p></div>') +
      '</div>', "cautelas");

    function redesenhar(t) {
      var f = !t ? CAUT.lista : CAUT.lista.filter(function (c) {
        var alvo = [c.numero, c.numeroTermo, c.colaborador, c.matricula, c.obra]
          .join(" ").toLowerCase();
        if (alvo.indexOf(t.toLowerCase()) > -1) return true;
        return comoListaCore(c.itens).some(function (i) {
          return (lim(i.patrimonio) + " " + lim(i.descricao))
            .toLowerCase().indexOf(t.toLowerCase()) > -1;
        });
      });
      document.getElementById("cauLista").innerHTML = f.length
        ? f.slice(0, 60).map(cartaoDaCautela_).join("")
        : '<div class="cartao"><b>Nenhuma cautela com esse texto</b></div>';
      ligarLinhasDeCautela_();
    }
    var busca = document.getElementById("cauBusca");
    var tmp = null;
    busca.addEventListener("input", function () {
      clearTimeout(tmp);
      tmp = setTimeout(function () { redesenhar(lim(busca.value)); }, 240);
    });
    ligarLinhasDeCautela_();
  });
};

function cartaoDaCautela_(c) {
  var st = lim(c.status).toUpperCase();
  var cor = (st === "EXCLUIDA" || st === "DEVOLVIDA") ? "nao" : "sim";
  var itens = comoListaCore(c.itens);
  return '<button class="pessoa" data-cau="' + esc(lim(c.numero)) + '">' +
    '<div class="retrato">&#9871;</div>' +
    '<div class="item-txt"><span class="nome">' +
      esc(lim(c.colaborador) || "(sem colaborador)") + '</span>' +
    '<span class="det mono">' + esc(lim(c.numero)) +
      (lim(c.numeroTermo) ? ' · termo ' + esc(lim(c.numeroTermo)) : '') + '</span>' +
    '<span class="det">' + itens.length + ' equipamento(s)' +
      (lim(c.obra) ? ' · ' + esc(lim(c.obra)) : '') + '</span>' +
    '</div>' +
    '<span class="selo ' + cor + '">' +
      esc(st.replace(/_/g, " ").toLowerCase() || "sem status") + '</span>' +
    '</button>';
}

function ligarLinhasDeCautela_() {
  document.querySelectorAll("[data-cau]").forEach(function (b) {
    b.addEventListener("click", function () {
      ir("cautela", b.getAttribute("data-cau"));
    });
  });
}

/* ============================================================
 * UMA CAUTELA — E OS SEUS DOIS DOCUMENTOS, SEPARADOS
 * ============================================================ */
TELAS.cautela = function (numero) {
  var c = (CAUT.lista || []).filter(function (x) {
    return lim(x.numero) === String(numero); })[0];
  if (!c) { ir("cautelas"); return; }
  var itens = comoListaCore(c.itens);

  pintar(
    '<div class="cartao">' +
      '<h2>Cautela ' + esc(lim(c.numero)) + '</h2>' +
      '<p class="ajuda">' + esc(lim(c.colaborador)) +
        (lim(c.matricula) ? ' · mat. ' + esc(lim(c.matricula)) : '') + '</p>' +
      '<div class="det-linhas">' +
        linhaDet_("Obra / setor", lim(c.obra) + (lim(c.setor) ? " / " + lim(c.setor) : "") || "—") +
        linhaDet_("Emissão", lim(c.emissao || c.criadoEm) || "—") +
        linhaDet_("Situação", lim(c.status) || "—") +
        linhaDet_("Equipamentos", itens.length + "") +
      '</div>' +
    '</div>' +

    (itens.length
      ? '<div class="cartao">' +
          '<b class="small">EQUIPAMENTOS</b>' +
          itens.map(function (i) {
            return '<div class="car-linha">' +
              '<div class="car-txt"><b>' +
                esc(lim(i.descricao) || lim(i.tipo) || "(sem descrição)") + '</b>' +
              '<small class="mono">' +
                esc(lim(i.patrimonio) || lim(i.etiquetaCoesa) || "sem patrimônio") +
                (lim(i.numeroSerie) ? ' · série ' + esc(lim(i.numeroSerie)) : '') +
              '</small></div></div>';
          }).join("") +
        '</div>'
      : '') +

    /* OS DOIS DOCUMENTOS, UM EM CADA LINHA */
    '<div class="cartao">' +
      '<b class="small">DOCUMENTOS DESTA CAUTELA</b>' +
      '<p class="ajuda">Os dois saem com os mesmos dados; cada um tem o seu ' +
      'número e a sua folha.</p>' +

      '<div class="id-linha"><div class="id-esq">' +
        '<b class="small">Cautela de Equipamentos</b>' +
        '<div class="pequeno">modelo COESA · <span class="mono">' +
          esc(lim(c.numero)) + '</span></div></div></div>' +
      '<button class="bt vazio" id="cauDocPadrao">Abrir a Cautela de Equipamentos</button>' +

      '<div class="id-linha"><div class="id-esq">' +
        '<b class="small">Termo de Responsabilidade — TI</b>' +
        '<div class="pequeno">formulário COESA · <span class="mono">' +
          (esc(lim(c.numeroTermo)) || "sem número") + '</span></div></div></div>' +
      '<button class="bt vazio" id="cauDocTermo">Abrir o Termo de TI</button>' +

      '<button class="bt laranja" id="cauDocDois">Gerar os dois documentos</button>' +
      (lim(c.numeroTermo)
        ? '<p class="pequeno">Os dois números já estão gravados nesta cautela. ' +
          'Abrir de novo não cria documento novo.</p>'
        : '<div class="aviso amarelo"><b>Esta cautela não tem número de Termo</b>' +
          'Ela foi gravada antes de o Termo existir. O documento abre assim mesmo; ' +
          'para ganhar número, salve a cautela de novo no computador.</div>') +
      '<div id="cauSaida"></div>' +
    '</div>', "cautela " + lim(c.numero));

  document.getElementById("cauDocPadrao").addEventListener("click", function () {
    gerarDocumentoDaCautela_(c, "padrao");
  });
  document.getElementById("cauDocTermo").addEventListener("click", function () {
    gerarDocumentoDaCautela_(c, "termo");
  });
  document.getElementById("cauDocDois").addEventListener("click", function () {
    gerarDocumentoDaCautela_(c, "dois");
  });
};

/* ============================================================
 * GERAR — com estado visível, sem clique em dobro
 * ------------------------------------------------------------
 * Cada passo aparece na tela: buscando assinatura, montando,
 * abrindo. Erro mostra o motivo e o botão de tentar de novo.
 * Enquanto um documento está sendo montado, outro clique no mesmo
 * botão não começa outra geração.
 * ============================================================ */
function gerarDocumentoDaCautela_(c, qual) {
  var saida = document.getElementById("cauSaida");
  if (!saida) return;
  if (CAUT.gerando) {
    saida.innerHTML = '<div class="aviso amarelo"><b>Já estou montando um documento</b>' +
      'Espere este terminar — dois cliques não geram dois documentos.</div>';
    return;
  }
  CAUT.gerando = qual;
  travarBotoesDaCautela_(true);

  var nome = qual === "termo" ? "o Termo de TI"
           : qual === "dois" ? "os dois documentos"
           : "a Cautela de Equipamentos";
  saida.innerHTML = '<div class="aviso cinza"><b>Preparando ' + esc(nome) + '</b>' +
    'Buscando a assinatura cadastrada do colaborador…</div>';

  var relogio = setTimeout(function () {
    if (CAUT.gerando !== qual) return;
    terminarGeracao_();
    var s2 = document.getElementById("cauSaida");
    if (s2) s2.innerHTML = '<div class="aviso vermelho"><b>Demorou demais</b>' +
      'O servidor não respondeu a tempo. Nada foi gerado e nada foi alterado. ' +
      'Tente de novo.</div>' + botaoDeTentarDeNovo_(qual);
    ligarTentarDeNovo_(c);
  }, 30000);

  assinaturaDaCautela_(c).then(function (rubrica) {
    clearTimeout(relogio);
    if (CAUT.gerando !== qual) return;
    var s2 = document.getElementById("cauSaida");
    var avisoAss = rubrica

    setTimeout(function () {
      try {
        if (qual === "padrao") { abrirCautelaPadrao_(c, rubrica); }
        else if (qual === "termo") { abrirTermoDeTI_(c, rubrica); }
        else {
          /* [40] OS DOIS, UM DE CADA VEZ e cada um na sua folha.

                'Este é o Termo de Responsabilidade de TI, em folha própria.</div>';
            });
          }
        }
        terminarGeracao_();
        var s3 = document.getElementById("cauSaida");
        /* o aviso da assinatura CONTINUA na tela: é ele que explica
           por que a linha saiu em branco, depois do documento aberto */
        if (s3) s3.innerHTML = (CAUT.avisoAssinatura || '') +

}

/* a assinatura do cadastro central, pelo ID — nunca uma cópia
   guardada na cautela */
function assinaturaDaCautela_(c) {
  var pessoa = {
    id: lim(c.idColaborador || c.colaboradorId),
    colaborador: lim(c.colaborador),
    nome: lim(c.colaborador),
    matricula: lim(c.matricula)
  };
  return lerAssinaturaCadastrada(pessoa).then(function (cad) {
    if (cad && cad.ok && cad.tem && cad.dados) {
      return lim(cad.dados.imagem || cad.dados.assinatura);
    }
    return "";
  }, function () { return ""; });
}

/* tira da tela QUALQUER folha que esteja montada. Sem isto, com as
   duas folhas no documento, a impressão sairia com os dois modelos
   no mesmo papel — o erro que esta versão existe para não cometer. */
function limparFolhasMontadas_() {
  ["ctImpressao", "ctEstilo", "trImpressao", "trEstilo"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);

function abrirCautelaPadrao_(c, rubrica) {

  limparFolhasMontadas_();
  var pessoa = {
    nome: lim(c.colaborador), matricula: lim(c.matricula),
    cracha: lim(c.cracha), cargo: lim(c.cargo)
  };
  /* [40] a folha APARECE na tela. No celular a impressão quase nunca
     abre sozinha, e o documento ficava invisível. */

    window.CAUTELA_CAMPO.cssCautela(),

      window.CAUTELA_CAMPO.documentoCautela(c, pessoa, rubrica,

}

function abrirTermoDeTI_(c, rubrica) {
  if (!window.TERMO || !window.TERMO.documento) {

  }

    window.TERMO.css(),

    c, "termo");

/* abrir um documento já com uma assinatura na mão (vinda do quadro) */

}


/* ============================================================
 * [campo 37] ONDE ESTA TELA ESTÁ ABERTA — E A BIOMETRIA
 * ------------------------------------------------------------
 * Isto aqui não é enfeite de diagnóstico: é a explicação de dois
 * problemas que ele viu no aparelho.
 *
 * O ENDEREÇO MANDA. Quando o aplicativo abre o arquivo baixado
 * (file:// ou content://), o Android trata a tela como origem
 * insegura e:
 *   · nega a câmera ao vivo — foi o "Permission denied" da TI;
 *   · não entrega biometria nenhuma (WebAuthn exige https).
 * Servido por https, os dois passam a funcionar. Por isso esta
 * tela mostra o endereço e diz, em letras, o que ele permite.
 *
 * A BIOMETRIA, quando der para usar, prova UMA coisa só: que
 * alguém destravou ESTE aparelho. Ela não diz qual colaborador
 * está ali. Serve para não digitar senha toda hora — não serve
 * para assinar entrega de EPI no lugar da pessoa, e o aplicativo
 * não vai dizer que serve.
 * ============================================================ */

function ondeEstamos_() {
  var url = "", esquema = "";
  try { url = String(location.href || ""); } catch (e) {}
  try { esquema = String(location.protocol || "").replace(":", ""); } catch (e) {}
  var seguro = false;
  try { seguro = !!window.isSecureContext; } catch (e) {}
  return {
    url: url,
    esquema: esquema || "desconhecido",
    seguro: seguro,
    /* a câmera ao vivo só existe em origem segura */
    cameraAoVivo: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    leitorDeCodigo: (typeof window.BarcodeDetector === "function"),
    webauthn: (typeof window.PublicKeyCredential === "function")
  };
}

/* o aparelho tem leitor de digital/rosto que a web consiga usar?
   É uma pergunta assíncrona: o navegador precisa consultar o
   sistema. Enquanto não responde, eu não afirmo nada. */
function bioDisponivel_() {
  try {
    if (typeof window.PublicKeyCredential !== "function") return Promise.resolve(false);
    if (typeof window.PublicKeyCredential
        .isUserVerifyingPlatformAuthenticatorAvailable !== "function") return Promise.resolve(false);
    return window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
      .then(function (v) { return !!v; }, function () { return false; });
  } catch (e) { return Promise.resolve(false); }
}

function bioMotivoDeNaoDar_() {
  var o = ondeEstamos_();
  if (!o.seguro) {
    return "esta tela está aberta como arquivo do aparelho (" + o.esquema + "), " +
      "e o Android só libera biometria em páginas servidas por https.";
  }
  if (!o.webauthn) {
    return "o navegador deste aparelho não tem a parte de biometria (WebAuthn).";
  }
  return "";
}

                         : "este navegador não lê código — por isso o campo de digitar") +

                   : "não disponível nesta origem") +

        esc(motivo || "o aparelho não ofereceu leitor de digital para a web.") + '</div>';
    });
  }
};

/* ============================================================
 * [campo 35] O AVISO FALADO
 * ------------------------------------------------------------
 * O pedido foi: "quando chegar uma notificação nova, ele avisa
 * sozinho". Gravar microfone não faz isso — gravar é o contrário,
 * é ouvir. O que faz o celular FALAR é a voz sintetizada, que o
 * próprio navegador tem (speechSynthesis) e que algumas pontes
 * Android também oferecem.
 *
 * REGRAS QUE VALEM AQUI:
 *   · só fala AVISO NOVO. Reabrir a tela não faz ele repetir.
 *   · na primeira vez não fala nada: senão, ao instalar, o
 *     aparelho sairia narrando vinte pedidos antigos no meio da
 *     obra.
 *   · fala o que está escrito no aviso — nada além. Não resume,
 *     não interpreta, não inventa.
 *   · vem DESLIGADO. Ninguém merece um celular falando sozinho
 *     sem ter pedido. Liga na tela de Avisos e fica guardado.
 *   · onde não há voz nenhuma, a tela diz isso em vez de fingir.
 * ============================================================ */

function vozDoAndroid_() {
  try {
    if (!window.AndroidAPI) return "";
    var nomes = ["speak", "speakText", "textToSpeech", "falar", "tts"];
    for (var i = 0; i < nomes.length; i++) {
      if (typeof window.AndroidAPI[nomes[i]] === "function") return nomes[i];
    }
  } catch (e) {}
  return "";
}
function vozDoNavegador_() {
  try {
    return !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function");
  } catch (e) { return false; }
}
function temVoz_() { return !!vozDoAndroid_() || vozDoNavegador_(); }

function vozLigada_() { return lerGuardado("vozAviso") === "1"; }
function vozLigar_(sim) { guardar("vozAviso", sim ? "1" : "0"); }

/* fala um texto. Devolve "android", "navegador" ou "" — para a tela
   poder dizer por onde saiu, em vez de supor. */
function falar(texto) {
  texto = lim(texto);
  if (!texto) return "";
  var pelaPonte = vozDoAndroid_();
  if (pelaPonte) {
    try { window.AndroidAPI[pelaPonte](texto); return "android"; } catch (e) {}
  }
  if (vozDoNavegador_()) {
    try {
      var f = new window.SpeechSynthesisUtterance(texto);
      f.lang = "pt-BR";
      f.rate = 1;
      window.speechSynthesis.speak(f);
      return "navegador";
    } catch (e) {}
  }
  return "";
}

function pararDeFalar() {
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
}

/* o texto que o celular fala de um aviso: curto, e sem adjetivo */
function textoFaladoDoAviso_(a) {
  if (!a) return "";
  return a.titulo + ". " + a.texto.replace(/\|/g, ", ");
}

function falarAvisosNovos_(novos) {
  if (!vozLigada_() || !novos || !novos.length) return 0;
  var ditos = 0;
  /* mais de três de uma vez vira ruído: fala o número e os dois
     primeiros, que é o que alguém consegue ouvir de pé na obra */
  if (novos.length > 3) {
    falar(novos.length + " avisos novos. " +
          textoFaladoDoAviso_(novos[0]) + " E " + textoFaladoDoAviso_(novos[1]));
    return 2;
  }
  novos.forEach(function (a) {
    if (falar(textoFaladoDoAviso_(a))) ditos++;
  });
  return ditos;
}

function estadoDaVozHtml_() {
  if (!temVoz_()) {
    return '<div class="aviso cinza"><b>Este aparelho não tem voz</b>' +
      'Nem o aplicativo nem o navegador deste celular oferecem leitura em voz alta. ' +
      'Os avisos continuam aparecendo na tela e na barra do celular.</div>';
  }
  var por = vozDoAndroid_() ? "pelo aplicativo Android" : "pelo navegador do aparelho";
  return '<div class="aviso ' + (vozLigada_() ? 'verde' : 'cinza') + '">' +
    '<b>Aviso falado: ' + (vozLigada_() ? 'ligado' : 'desligado') + '</b>' +
    (vozLigada_()
      ? 'Quando um pedido seu mudar de situação, o celular fala o aviso ' + por + '. ' +
        'Só avisos novos — reabrir a tela não faz repetir.'
      : 'Se ligar, o celular fala em voz alta cada aviso novo ' + por + '.') +
    '<div class="fl" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">' +
      '<button class="bt vazio pequeno" id="vozLigar" style="margin:0">' +
        (vozLigada_() ? 'Desligar a voz' : 'Ligar a voz') + '</button>' +
      '<button class="bt vazio pequeno" id="vozTestar" style="margin:0">Ouvir um teste</button>' +
    '</div><div id="vozSaida"></div></div>';
}

function ligarBotoesDaVoz_() {
  var b = document.getElementById("vozLigar");
  if (b) b.addEventListener("click", function () {
    vozLigar_(!vozLigada_());
    if (!vozLigada_()) pararDeFalar();
    TELAS.avisos();
  });
  var t = document.getElementById("vozTestar");
  if (t) t.addEventListener("click", function () {
    var saida = document.getElementById("vozSaida");
    var por = falar("Teste do ALMOXA CAMPO. Se você está ouvindo isto, a voz está funcionando.");
    if (saida) {
      saida.innerHTML = por
        ? '<p class="pequeno" style="margin-top:8px">Falei ' +
          (por === "android" ? "pelo aplicativo" : "pelo navegador") +
          '. Se não ouviu nada, confira o volume e o modo silencioso.</p>'
        : '<div class="aviso amarelo" style="margin-top:8px"><b>Não saiu voz</b>' +
          'Este aparelho não tem leitura em voz alta disponível.</div>';
    }
  });
}

/* ============================================================
 * [campo 34] O QUE O APLICATIVO ANDROID OFERECE
 * ------------------------------------------------------------
 * A mesma ideia da tela "o que o servidor atende", agora do lado
 * do aparelho: em vez de eu supor quais recursos o aplicativo tem,
 * ele PERGUNTA à ponte e mostra a lista. É assim que a gente
 * descobre, sem chute, se existe digital, posição, leitor de
 * código ou qualquer outra coisa que você tenha adicionado.
 * ============================================================ */

/* o que eu sei usar hoje, e para quê serve cada um */
var PONTE_CONHECIDOS = {
  showNotification:      "avisar na barra do celular — JÁ LIGADO nos seus pedidos",
  cancelNotification:    "apagar um aviso da barra — já ligado",
  cancelAllNotifications:"limpar os avisos da barra — já ligado",
  showToast:             "a tarja rápida de confirmação — já ligada",
  capturePhoto:          "tirar foto do colaborador e da nota — JÁ LIGADO",
  compressImage:         "reduzir a foto antes de subir — já ligado",
  startCameraPreview:    "prévia da câmera na tela",
  stopCameraPreview:     "fechar a prévia",
  requestPermission:     "pedir permissão ao Android",
  speak:                 "falar em voz alta — usado no aviso falado",
  startAudioRecording:   "gravar voz — ainda sem lugar para guardar no Core",
  stopAudioRecording:    "parar a gravação",
  getAudioFileBase64:    "ler a gravação para enviar"
};

/* nomes que costumam ser usados para digital/biometria. Eu não
   invento nenhum: só reconheço se existir na ponte do SEU app. */
var PONTE_DIGITAL = ["authenticateBiometric", "biometricAuth", "requestBiometric",
  "authenticateFingerprint", "fingerprintAuth", "autenticarDigital", "biometric",
  "authenticate", "bioAuth"];

function ponteMetodos_() {
  var fora = [];
  try {
    if (!window.AndroidAPI) return fora;
    for (var k in window.AndroidAPI) {
      try { if (typeof window.AndroidAPI[k] === "function") fora.push(k); } catch (e) {}
    }
  } catch (e) {}
  return fora.sort();
}

function ponteTemDigital_() {
  var tem = ponteMetodos_();
  for (var i = 0; i < PONTE_DIGITAL.length; i++) {
    if (tem.indexOf(PONTE_DIGITAL[i]) > -1) return PONTE_DIGITAL[i];
  }
  return "";
}

TELAS.ponte = function () {
  CAMPO.abaAtual = "mais";
  var metodos = ponteMetodos_();
  var digital = ponteTemDigital_();

  pintar(
    '<div class="cartao">' +
      '<h2>O que o aplicativo oferece</h2>' +
      '<p class="ajuda">Isto é do lado do <b>aparelho</b>, não do servidor. ' +
      'É o que o aplicativo Android expõe para esta tela usar.</p>' +

/* ============================================================

function toastTemPonte_() {

}

/* ============================================================
 * [campo 32] A CÂMERA DO APARELHO, PELA PONTE DO ANDROID
 * ------------------------------------------------------------
 * POR QUE ISTO IMPORTA, e não é enfeite: dentro de um WebView o
 * getUserMedia costuma ser BLOQUEADO. É por isso que "abrir a
 * câmera" às vezes não abria nada no celular. A ponte AndroidAPI
 * usa a câmera do próprio aparelho e devolve a foto pronta.
 *
 * ONDE ENTRA — nos dois lugares que já tiravam foto, sem trocar o
 * que funciona:
 *   · a FOTO DO COLABORADOR (câmera frontal)
 *   · a FOTO DA NOTA FISCAL (câmera de trás, uma ou várias folhas)
 *
 * A ORDEM É SEMPRE A MESMA:
 *   1. a ponte do aplicativo, quando existe;
 *   2. a câmera do navegador (getUserMedia), como antes;
 *   3. o seletor de arquivo com "capture", que funciona em tudo.
 * Nenhum caminho antigo foi removido.
 *
 * A FOTO É COMPRIMIDA ANTES DE SUBIR. O crachá tem limite de
 * tamanho, e foto de celular hoje passa fácil de 4 MB. A ponte
 * comprime no próprio aparelho (compressImage); sem ela, continua
 * valendo a redução que o aplicativo já fazia no canvas.
 * ============================================================ */

var CAM = {
  pedidos: {},        /* callbackId -> {resolve, reject, respondido} */
  n: 0,
  previa: false,
  ultimoErro: ""
};

function camTemPonte_() {
  try {
    return !!(window.AndroidAPI && typeof window.AndroidAPI.capturePhoto === "function");
  } catch (e) { return false; }
}
function camTemCompressao_() {
  try {
    return !!(window.AndroidAPI && typeof window.AndroidAPI.compressImage === "function");
  } catch (e) { return false; }
}
function camTemPrevia_() {
  try {
    return !!(window.AndroidAPI && typeof window.AndroidAPI.startCameraPreview === "function");
  } catch (e) { return false; }
}

/* o que cada erro do aplicativo quer dizer, em português de obra */
function camTextoDoErro_(erro) {
  var e = lim(erro).toLowerCase();
  if (e === "permission_denied") return "o Android não deixou usar a câmera. " +
    "Abra os ajustes do aparelho, procure o ALMOXA CAMPO e libere a câmera.";
  if (e === "cancelled") return "a foto foi cancelada no aparelho.";
  if (e === "no_camera_app") return "este aparelho não tem aplicativo de câmera.";
  if (e === "capture_file_missing") return "o aparelho tirou a foto mas não devolveu " +
    "o arquivo. Tente de novo.";
  if (e === "encode_failed") return "o aparelho não conseguiu preparar a imagem.";
  if (e === "camera_permission_not_declared") return "a câmera frontal precisa da " +
    "permissão CAMERA declarada no aplicativo Android.";
  if (e === "front_capture_failed") return "a câmera frontal falhou neste aparelho.";
  if (e === "pro_required") return "a prévia da câmera não está disponível nesta " +
    "versão do aplicativo.";
  return lim(erro) || "não deu certo, e o aparelho não disse o motivo.";
}

/* UM despachante para TODOS os eventos do Android.
   A notificação (campo 31) e a câmera chegam pelo mesmo caminho, e
   as duas formas de entrega — onAndroidEvent e addEventListener —
   trazem o MESMO evento. Por isso cada pedido só é respondido uma
   vez: sem isso, a foto entraria em dobro. */
var ANDROID_OUVINTES = [];
function ouvirDoAndroid(fn) {
  if (typeof fn === "function") ANDROID_OUVINTES.push(fn);
}
function despacharDoAndroid_(evento, dados) {
  for (var i = 0; i < ANDROID_OUVINTES.length; i++) {
    try { ANDROID_OUVINTES[i](evento, dados || {}); } catch (e) {}
  }
}

function ligarPonteDaCamera() {
  /* as duas formas de registro que o aplicativo oferece */
  window.onAndroidEvent = function (evento, dados) {
    despacharDoAndroid_(evento, dados);
  };
  ["cameraResult", "imageCompressResult", "cameraPreviewResult",
   "notificationResult"].forEach(function (nome) {
    try {
      window.addEventListener(nome, function (e) {
        despacharDoAndroid_(nome, (e && e.detail) || {});
      });
    } catch (err) {}
  });

  /* quem responde os pedidos de foto e de compressão */
  ouvirDoAndroid(function (evento, d) {
    if (evento !== "cameraResult" && evento !== "imageCompressResult") return;
    var id = d && d.callbackId;
    var p = CAM.pedidos[id];
    if (!p || p.respondido) return;   /* o mesmo evento chega duas vezes */
    p.respondido = true;
    delete CAM.pedidos[id];
    clearTimeout(p.relogio);
    if (d.success && lim(d.base64)) {
      p.resolve({ base64: d.base64, largura: d.width, altura: d.height, bytes: d.bytes });
    } else {
      CAM.ultimoErro = lim(d.error);
      p.reject(new Error(camTextoDoErro_(d.error)));
    }
  });

  ouvirDoAndroid(function (evento, d) {
    if (evento !== "cameraPreviewResult") return;
    CAM.previa = !!(d && d.active);
    if (d && !d.success) CAM.ultimoErro = lim(d.error);
    var el = document.getElementById("camPreviaEstado");
    if (el) {
      el.innerHTML = (d && d.success)
        ? '<div class="aviso cinza">Prévia ' + (CAM.previa ? "ligada" : "desligada") + '.</div>'
        : '<div class="aviso amarelo"><b>A prévia não abriu</b>' +
          esc(camTextoDoErro_(d && d.error)) + '</div>';
    }
  });
}

/* ---------- tirar a foto, de verdade ---------- */
function camTirarFoto(opcoes) {
  opcoes = opcoes || {};
  if (!camTemPonte_()) {
    return Promise.reject(new Error("a ponte da câmera não existe nesta tela"));
  }
  var id = "foto-" + (++CAM.n) + "-" + Date.now();
  return new Promise(function (resolve, reject) {
    CAM.pedidos[id] = {
      resolve: resolve, reject: reject, respondido: false,
      /* se o aparelho nunca responder, eu não fico esperando para
         sempre com a tela travada num "aguarde" */
      relogio: setTimeout(function () {
        var p = CAM.pedidos[id];
        if (!p || p.respondido) return;
        p.respondido = true;
        delete CAM.pedidos[id];
        reject(new Error("o aparelho não respondeu a câmera em 2 minutos"));
      }, 120000)
    };
    try {
      if (opcoes.frente) window.AndroidAPI.capturePhoto(id, "front");
      else window.AndroidAPI.capturePhoto(id);
    } catch (e) {
      var p = CAM.pedidos[id];
      if (p) { p.respondido = true; clearTimeout(p.relogio); delete CAM.pedidos[id]; }
      reject(new Error(String(e && e.message || e)));
    }
  });
}

/* ---------- comprimir antes de subir ---------- */
function camComprimir(base64, maxLargura, qualidade) {
  /* sem a compressão do aplicativo, a foto segue como veio — e eu
     digo que NÃO comprimi. */
  if (!camTemCompressao_()) {
    return Promise.resolve({ base64: base64, falhou: true, semPonte: true });
  }
  var id = "comp-" + (++CAM.n) + "-" + Date.now();
  return new Promise(function (resolve) {
    CAM.pedidos[id] = {
      /* comprimir é melhoria, não obrigação: se falhar, segue a foto
         original e o aplicativo reduz do jeito antigo */
      resolve: resolve,
      reject: function () { resolve({ base64: base64, falhou: true }); },
      respondido: false,
      relogio: setTimeout(function () {
        var p = CAM.pedidos[id];
        if (!p || p.respondido) return;
        p.respondido = true; delete CAM.pedidos[id];
        resolve({ base64: base64, falhou: true });
      }, 30000)
    };
    try {
      window.AndroidAPI.compressImage(base64, maxLargura || 1280, qualidade || 70, id);
    } catch (e) {
      var p = CAM.pedidos[id];
      if (p) { p.respondido = true; clearTimeout(p.relogio); delete CAM.pedidos[id]; }
      resolve({ base64: base64, falhou: true });
    }
  });
}

/* a foto pronta para subir: tirada e já comprimida */
function camFotoPronta(opcoes) {
  opcoes = opcoes || {};
  return camTirarFoto(opcoes).then(function (r) {
    return camComprimir(r.base64, opcoes.maxLargura || 1280, opcoes.qualidade || 70)
      .then(function (c) {
        return { base64: c.base64 || r.base64, comprimiu: !c.falhou,
                 bytes: c.bytes, largura: c.largura, altura: c.altura };
      });
  });
}

/* ---------- a prévia nativa ---------- */
function camPreviaLigar() {
  if (!camTemPrevia_()) return false;
  try { window.AndroidAPI.startCameraPreview(); return true; } catch (e) { return false; }
}
function camPreviaDesligar() {
  if (!camTemPrevia_()) return false;
  try { window.AndroidAPI.stopCameraPreview(); return true; } catch (e) { return false; }
}


/* ============================================================
 * [campo 31] NOTIFICAÇÃO DE VERDADE NO ANDROID
 * ------------------------------------------------------------
 * Quando o ALMOXA CAMPO roda dentro do aplicativo Android, existe
 * uma ponte chamada AndroidAPI. É ela que faz o aviso aparecer na
 * barra do celular mesmo com a tela desligada — coisa que uma
 * página HTML sozinha não faz.
 *
 * O QUE AVISA: os mesmos avisos da tela, que saem dos SEUS pedidos
 * lidos do servidor (reservas.listar). Nada é inventado para a
 * barra de notificação.
 *
 * O QUE NÃO FAZ:
 *   · não avisa duas vezes o mesmo fato. Cada aviso tem uma chave
 *     (protocolo + situação) e ela fica guardada. Sem isso, cada
 *     atualização encheria a barra do celular com o mesmo pedido.
 *   · não avisa o que você já viu antes de instalar: na primeira
 *     vez, os avisos existentes entram como "já conhecidos", em
 *     silêncio. Senão o aplicativo apitaria 20 vezes ao abrir.
 *   · não inventa permissão. Se o Android negar, a tela diz isso.
 *   · no navegador comum, onde a ponte não existe, ele não finge
 *     que avisou: a tela mostra que a notificação só funciona
 *     dentro do aplicativo.
 * ============================================================ */

var ANDROID = {
  tem: false,
  permissao: "",      /* "" ainda não sei · "ok" · "negada" */
  ultimoErro: "",
  ids: [],            /* o que eu mandei, para poder limpar depois */
  verificado: false
};

function androidTemPonte_() {
  try {
    return !!(window.AndroidAPI && typeof window.AndroidAPI.showNotification === "function");
  } catch (e) { return false; }
}

/* ---------- o que o Android responde, de volta ---------- */
function ligarPonteAndroid() {
  ANDROID.tem = androidTemPonte_();
  if (!ANDROID.tem) return;

  /* [32] o despachante é um só; aqui eu só me inscrevo nele */
  ouvirDoAndroid(function (evento, dados) {
    try {
      if (evento !== "notificationResult") return;
      var d = dados || {};
      if (d.success) {
        ANDROID.permissao = "ok";
        ANDROID.ultimoErro = "";
        if (d.notificationId !== undefined && d.notificationId !== null) {
          ANDROID.ids.push(d.notificationId);
          try { guardar("avisosIds", JSON.stringify(ANDROID.ids.slice(-50))); } catch (e) {}
        }
      } else {
        ANDROID.permissao = (d.error === "permission_denied") ? "negada" : ANDROID.permissao;
        ANDROID.ultimoErro = lim(d.error) || "falhou sem dizer o motivo";
      }
      pintarEstadoDoAviso_();
    } catch (e) { /* a ponte nunca pode derrubar o aplicativo */ }
  });

  try {
    var g = JSON.parse(lerGuardado("avisosIds") || "[]");
    ANDROID.ids = Array.isArray(g) ? g : [];
  } catch (e) { ANDROID.ids = []; }
}

/* ---------- o que já foi avisado na barra do celular ---------- */
function avisosJaNotificados_() {
  try { return JSON.parse(lerGuardado("avisosNotificados") || "{}") || {}; }
  catch (e) { return {}; }
}
function marcarNotificado_(chave) {
  var m = avisosJaNotificados_();
  m[chave] = Date.now();
  /* não deixo a lista crescer para sempre: guardo os 200 últimos */
  var chaves = Object.keys(m);
  if (chaves.length > 200) {
    chaves.sort(function (a, b) { return m[a] - m[b]; })
      .slice(0, chaves.length - 200)
      .forEach(function (k) { delete m[k]; });
  }
  try { guardar("avisosNotificados", JSON.stringify(m)); } catch (e) {}
}

/* ---------- avisar na barra do celular ---------- */
function notificarNoCelular_(novos) {
  if (!ANDROID.tem || !novos.length) return 0;
  var mandados = 0;
  novos.forEach(function (a) {
    try {
      var titulo = "ALMOXA — " + a.titulo;
      var texto = a.texto;
      var detalhe = a.titulo + "\n" + a.texto +
        "\nAbra o ALMOXA CAMPO para ver o pedido.";
      if (window.AndroidAPI.showNotification.length >= 3) {
        window.AndroidAPI.showNotification(titulo, texto, detalhe);
      } else {
        window.AndroidAPI.showNotification(titulo, texto);
      }
      marcarNotificado_(a.chave);
      mandados++;
    } catch (e) {
      ANDROID.ultimoErro = String(e && e.message || e);
    }
  });
  return mandados;
}

/* ---------- a conferência: o que mudou desde a última vez ----------
   Roda ao abrir o aplicativo, ao voltar para ele e de tempo em
   tempo enquanto ele está aberto. É sempre uma LEITURA do servidor;
   nada é gravado. */
var AVISO_RELOGIO = null;
var AVISO_PRIMEIRA = true;

function conferirAvisosAgora(silencioso) {
  if (!CAMPO.sessao || !CAMPO.url) return Promise.resolve(0);
  return api("reservas", "listar", {}).then(function (r) {
    if (!r || !r.ok) {
      AVISOS.erro = lim(r && r.mensagem) || "a leitura dos pedidos não respondeu";
      return 0;
    }
    AVISOS.erro = "";
    var meus = meusPedidos_(comoListaCore(r.dados));
    AVISOS.lista = meus.map(avisoDoPedido_).filter(Boolean);
    AVISOS.quando = Date.now();

    var jaAvisados = avisosJaNotificados_();
    var novos = AVISOS.lista.filter(function (a) { return !jaAvisados[a.chave]; });

    /* PRIMEIRA VEZ: o que já existe não vira apito. Entra como
       conhecido, em silêncio — senão o aplicativo dispara vinte
       notificações de pedidos antigos assim que é instalado. */
    var primeiraVez = !lerGuardado("avisosNotificados");
    if (primeiraVez) {
      novos.forEach(function (a) { marcarNotificado_(a.chave); });
      pintarSinoBarra();
      return 0;
    }
    var mandados = silencioso ? 0 : notificarNoCelular_(novos);
    if (!silencioso) falarAvisosNovos_(novos);   /* [35] e fala, se estiver ligado */
    pintarSinoBarra();
    return mandados;
  }, function () { return 0; });
}

function ligarRelogioDosAvisos() {
  /* de 5 em 5 minutos enquanto o aplicativo está aberto. Mais do que
     isso é gasto de bateria e de cota do servidor para pouca coisa. */
  if (AVISO_RELOGIO) clearInterval(AVISO_RELOGIO);
  AVISO_RELOGIO = setInterval(function () {
    if (document.hidden) return;
    conferirAvisosAgora(false);
  }, 300000);

  /* ao voltar para o aplicativo, confere na hora */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) conferirAvisosAgora(false);
  });
}

/* ---------- o que a tela de Avisos mostra sobre a ponte ---------- */
function estadoDoAvisoHtml_() {
  if (!ANDROID.tem) {
    return '<div class="aviso cinza"><b>Aviso na barra do celular: só dentro do aplicativo</b>' +

/* o botão de teste: manda UM aviso de verdade pela ponte, sem

function testarAvisoNoCelular_() {
  var el = document.getElementById("avisoTesteSaida");

    if (el) el.innerHTML = '<div class="aviso amarelo">Sem o aplicativo Android ' +
