
name: ALMOXA PRO - Sincronizar Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar Core
        run: npm test

      - name: Validar configuração
        run: |
          test -f .clasp.json
          test -f app/appsscript.json
          node -e "const c=require('./.clasp.json'); if (!c.scriptId || c.rootDir !== 'app') process.exit(1)"

      - name: Preparar autenticação Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON não configurado"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Sincronizar Apps Script
        run: npx clasp push --force
