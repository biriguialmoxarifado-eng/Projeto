
name: ALMOXA PRO - Sincronizar Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar Core
        run: npm test

      - name: Validar configuração
        run: |
          test -f .clasp.json
          test -f app/appsscript.json
          node -e "const c=require('./.clasp.json'); if (!c.scriptId || c.rootDir !== 'app') process.exit(1)"

      - name: Preparar autenticação Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON não configurado"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Sincronizar Apps Script
        run: npx clasp push --force

      # O push atualiza o código no editor, mas o /exec continua servindo
      # a versão IMPLANTADA. Sem este passo, nada que sobe chega ao ar:
      # o editor mostra o código novo e o sistema roda o antigo.
      #
      # O id abaixo é o da implantação que já existe — o mesmo trecho que
      # aparece na URL do web app. Usá-lo preserva o endereço; criar uma
      # implantação nova geraria outra URL e quebraria quem já usa.
      - name: Publicar a nova versão
        env:
          DEPLOY_ID: AKfycbwWahYJywIsbRGc3t8taMWTXNgLd_1JtFJ93VmGNfAA-bXcgMlUoW6OZszZWEWMULA1
        run: |
          npx clasp deploy \
            --deploymentId "$DEPLOY_ID" \
            --description "sync $(date -u +%Y-%m-%d\ %H:%M) · ${GITHUB_SHA::8}"
