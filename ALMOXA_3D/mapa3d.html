<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALMOX PRO 3D — Mapa do almoxarifado</title>
<style>
/* ALMOXA 3D · almoxa3d.css · 08/11/2026
   Responsivo de verdade (seção 11): no celular o painel vira
   gaveta de baixo, e a tela 3D fica inteira para o dedo. */
:root{
  --fundo:#EEF1F5; --papel:#FFFFFF; --texto:#1B2430; --texto2:#5A6472;
  --texto3:#8A93A0; --borda:#DDE2E8; --azul:#2F7BE8; --azulEscuro:#1E3A5F;
  --verde:#2E9E5B; --cinza:#9AA3AE; --amarelo:#E8A33D; --vermelho:#D2443B;
  --sombra:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);
  color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
#app{display:flex;height:100%;width:100%}

/* ---------- a cena ---------- */
#cena{position:relative;flex:1;min-width:0}
#tela3d{width:100%;height:100%;display:block;outline:none;touch-action:none}

#barra{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;
  gap:8px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(238,241,245,.96),rgba(238,241,245,0));
  pointer-events:none}
#barra>*{pointer-events:auto}
.marca{font-weight:700;letter-spacing:.02em;color:var(--azulEscuro);margin-right:4px}
.marca small{font-weight:500;color:var(--texto3);display:block;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase}

.btn{border:1px solid var(--borda);background:var(--papel);color:var(--texto2);
  border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;
  box-shadow:var(--sombra);white-space:nowrap}
.btn:hover{border-color:#C3CBD5;color:var(--texto)}
.btn[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:active{transform:translateY(1px)}

/* ---------- legenda ---------- */
#legenda{position:absolute;left:12px;bottom:12px;background:var(--papel);
  border:1px solid var(--borda);border-radius:11px;padding:9px 11px;
  box-shadow:var(--sombra);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--texto2)}
.bolinha{width:11px;height:11px;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- painel ---------- */
#painel{width:330px;flex:none;background:var(--papel);border-left:1px solid var(--borda);
  display:flex;flex-direction:column;overflow:hidden}
#painel h2{margin:0;padding:14px 16px 10px;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--texto3);border-bottom:1px solid var(--borda)}
#corpoPainel{padding:14px 16px;overflow:auto;flex:1}

.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cartao{border:1px solid var(--borda);border-radius:10px;padding:9px 11px}
.cartao b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.cartao span{font-size:11px;color:var(--texto3)}

.barraOcup{height:8px;border-radius:99px;background:#EDF0F4;overflow:hidden;margin:4px 0 14px}
.barraOcup i{display:block;height:100%;background:var(--verde);border-radius:99px}

.linha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px dashed var(--borda);font-size:13px}
.linha:last-child{border-bottom:0}
.linha span{color:var(--texto3)}
.linha b{font-weight:600;text-align:right;word-break:break-word}

.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:700;letter-spacing:.03em;color:#fff}
.vazio{text-align:center;color:var(--texto3);padding:26px 10px;font-size:13px;line-height:1.6}
.aviso{border:1px solid #F0D8A8;background:#FEF8EC;color:#7A5B18;border-radius:10px;
  padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.erro{border-color:#F2C3BF;background:#FDF1F0;color:#8A2B23}

/* ---------- celular e tablet (seção 11) ---------- */
@media (max-width:860px){
  #app{flex-direction:column}
  #painel{width:100%;height:46vh;border-left:0;border-top:1px solid var(--borda);
    border-radius:16px 16px 0 0;margin-top:-16px;box-shadow:0 -6px 24px rgba(16,24,40,.08)}
  #painel h2{padding:12px 16px 8px}
  #legenda{bottom:auto;top:56px;left:12px;right:12px;justify-content:center}
  .numeros{grid-template-columns:repeat(4,1fr)}
  .cartao b{font-size:16px}
}
@media (max-width:420px){
  .numeros{grid-template-columns:repeat(2,1fr)}
  #barra{padding:8px}
  .btn{padding:6px 9px;font-size:12px}
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fundo:#141922; --papel:#1C222C; --texto:#E8ECF1; --texto2:#AEB7C3;
    --texto3:#7C8694; --borda:#2B333F; --azulEscuro:#9BC2F5;
    --sombra:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}

  <div id="cena">
    <canvas id="tela3d" touch-action="none"></canvas>

<!-- ===== Babylon.js · versão fixa, nunca "latest" ============
     Versão travada de propósito: biblioteca que se atualiza
     sozinha quebra sistema em produção sem ninguém ter mexido.
     ========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>

<!-- ===== os quatro arquivos do módulo ======================
     No Apps Script, estas quatro linhas viram o conteúdo dos
     arquivos, colado aqui dentro. Nada mais muda.
     ========================================================= -->
<script>
/* ===== layout3d.js ===== */
/* ============================================================
   ALMOXA 3D · layout3d.js  ·  08/11/2026
   ------------------------------------------------------------
   A MATEMÁTICA DO GALPÃO. Aqui não entra Babylon.

   Esta camada pega as localizações do ALMOX PRO — as mesmas da
   aba ALMOXA_LOCALIZACOES, com rua, estante, prateleira e
   posição — e devolve uma lista de PEÇAS com medida e lugar em
   metros:

       { tipo:'montante', x, y, z, lx, ly, lz, cor, ... }

   O motor 3D só traduz essa lista em malhas. Separar assim tem
   dois motivos concretos:

     1. a conta pode ser testada sem placa de vídeo e sem CDN —
        e foi: a suíte prova_layout3d.js roda em Node;
     2. no dia em que o Babylon for trocado, ou aparecer uma
        visão 2D de impressão, a geometria continua valendo.

   AS MEDIDAS SÃO DE ESTANTE DE VERDADE, em metros. Não é
   quadradinho em tela: é uma estante porta-palete com montante,
   longarina, prateleira e vão de corredor por onde cabe gente.
   ============================================================ */
(function (raiz) {
  'use strict';

  /* ----------------------------------------------------------
     MEDIDAS PADRÃO · metros
     Vieram de estante de almoxarifado comum. Dá para trocar
     passando outras em LAYOUT.montar(locais, { medidas }).
     ---------------------------------------------------------- */
  var MEDIDAS = {
    larguraPosicao: 1.00,   /* frente de uma posição */
    alturaNivel: 0.55,      /* de uma prateleira à outra */
    profundidade: 0.60,     /* o quanto a estante entra */
    montante: 0.06,         /* a coluna de ferro */
    longarina: 0.05,        /* a viga horizontal */
    prateleira: 0.03,       /* a chapa onde o material apoia */
    corredor: 2.40,         /* entre uma rua e outra: cabe empilhadeira */
    vaoEstantes: 0.30,      /* respiro entre estantes da mesma rua */
    peDireito: 0.00,        /* altura livre do chão até a 1ª prateleira */
    folgaPiso: 2.00         /* sobra do piso além das estantes */
  };

  /* ----------------------------------------------------------
     AS CORES · seção 8 da especificação
     Elas NÃO são escolha de gosto: saem do dado oficial. Quem
     pinta de verde é a ocupação, não o programador.
     ---------------------------------------------------------- */
  var CORES = {
    vazia:       '#9AA3AE',   /* cinza  · posição livre */
    ocupada:     '#2E9E5B',   /* verde  · tem material */
    atencao:     '#E8A33D',   /* amarelo· cheia ou quase */
    problema:    '#D2443B',   /* vermelho· bloqueada ou divergente */
    selecionada: '#2F7BE8',   /* azul   · o que o usuário clicou */
    estrutura:   '#5A6472',   /* o ferro da estante */
    piso:        '#E7E9EC',
    faixa:       '#C9CDD3'    /* a pintura do corredor */
  };

  function lp(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }
  function cima(v) { return lp(v).toUpperCase(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /* ----------------------------------------------------------
     A COR DE UMA POSIÇÃO
     ------------------------------------------------------------
     Ordem importa: bloqueio manda sobre lotação, que manda sobre
     ocupação. Uma posição bloqueada com material continua
     vermelha — senão o vermelho some justamente onde ele serve.
     ---------------------------------------------------------- */
  function corDaPosicao(loc) {
    var st = cima(loc && loc.status);
    if (st === 'BLOQUEADA' || st === 'BLOQUEADO' || st === 'DIVERGENCIA' ||
        st === 'DIVERGÊNCIA' || st === 'INTERDITADA') return CORES.problema;

    var cap = num(loc && loc.capacidade);
    var itens = num(loc && (loc.itens !== undefined ? loc.itens : loc.ocupacao));

    if (itens <= 0) return CORES.vazia;
    if (cap > 0 && itens >= cap) return CORES.atencao;   /* lotada: atenção */
    return CORES.ocupada;
  }

  function situacaoDaPosicao(loc) {
    var c = corDaPosicao(loc);
    if (c === CORES.problema) return 'BLOQUEADA';
    if (c === CORES.atencao) return 'LOTADA';
    if (c === CORES.ocupada) return 'OCUPADA';
    return 'VAZIA';
  }

  /* ----------------------------------------------------------
     ORGANIZAR: a lista plana vira árvore rua → estante →
     prateleira → posição. Ordenada, para o galpão não mudar de
     forma a cada carregamento.
     ---------------------------------------------------------- */
  function organizar(locais) {
    var ruas = {};
    var lista = Object.prototype.toString.call(locais) === '[object Array]' ? locais : [];

    for (var i = 0; i < lista.length; i++) {
      var l = lista[i];
      if (!l) continue;
      var nRua = cima(l.rua);
      if (!nRua) continue;
      var nEst = cima(l.estante) || '(sem estante)';
      var nPra = cima(l.prateleira) || '(sem prateleira)';

      if (!ruas[nRua]) ruas[nRua] = { nome: nRua, estantes: {} };
      var R = ruas[nRua];
      if (!R.estantes[nEst]) R.estantes[nEst] = { nome: nEst, prateleiras: {} };
      var E = R.estantes[nEst];
      if (!E.prateleiras[nPra]) E.prateleiras[nPra] = { nome: nPra, posicoes: [] };
      E.prateleiras[nPra].posicoes.push(l);
    }

    function chaves(o) { var a = []; for (var k in o) if (o.hasOwnProperty(k)) a.push(k); a.sort(); return a; }

    return chaves(ruas).map(function (nr) {
      var R = ruas[nr];
      return {
        nome: R.nome,
        estantes: chaves(R.estantes).map(function (ne) {
          var E = R.estantes[ne];
          return {
            nome: E.nome,
            prateleiras: chaves(E.prateleiras).map(function (np) {
              var P = E.prateleiras[np];
              P.posicoes.sort(function (a, b) {
                return cima(a.posicao) < cima(b.posicao) ? -1 : 1;
              });
              return P;
            })
          };
        })
      };
    });
  }

  /* ----------------------------------------------------------
     MONTAR: a árvore vira peças com medida e lugar
     ---------------------------------------------------------- */
  function montar(locais, opcoes) {
    opcoes = opcoes || {};
    var M = {};
    for (var k in MEDIDAS) M[k] = MEDIDAS[k];
    if (opcoes.medidas) for (var k2 in opcoes.medidas) M[k2] = opcoes.medidas[k2];

    var ruas = organizar(locais);
    var pecas = [];
    var indice = {};          /* codigo -> peça da posição, para o clique achar */
    var contagem = { ruas: 0, estantes: 0, prateleiras: 0, posicoes: 0 };
    var maxX = 0, maxZ = 0, maxY = 0;

    var x = M.folgaPiso;      /* caminha pelo eixo X, uma rua depois da outra */

    for (var r = 0; r < ruas.length; r++) {
      var rua = ruas[r];
      contagem.ruas++;
      var xRua = x;
      var larguraRua = M.profundidade;
      var z = M.folgaPiso;    /* dentro da rua, as estantes caminham no Z */

      for (var e = 0; e < rua.estantes.length; e++) {
        var est = rua.estantes[e];
        contagem.estantes++;

        /* quantas posições tem a prateleira mais larga manda na estante */
        var maiorLinha = 1;
        for (var p0 = 0; p0 < est.prateleiras.length; p0++) {
          maiorLinha = Math.max(maiorLinha, est.prateleiras[p0].posicoes.length);
        }
        var compEstante = maiorLinha * M.larguraPosicao;
        var niveis = est.prateleiras.length;
        var alturaEstante = M.peDireito + niveis * M.alturaNivel + M.alturaNivel * 0.4;

        /* --- os montantes: quatro colunas de ferro --- */
        var cantos = [
          [xRua, z], [xRua + M.profundidade, z],
          [xRua, z + compEstante], [xRua + M.profundidade, z + compEstante]
        ];
        for (var c = 0; c < cantos.length; c++) {
          pecas.push({
            tipo: 'montante', id: 'MONT-' + rua.nome + '-' + est.nome + '-' + c,
            x: cantos[c][0], y: alturaEstante / 2, z: cantos[c][1],
            lx: M.montante, ly: alturaEstante, lz: M.montante,
            cor: CORES.estrutura, clicavel: false
          });
        }

        /* --- cada prateleira: chapa + longarinas + posições --- */
        for (var pr = 0; pr < est.prateleiras.length; pr++) {
          var prat = est.prateleiras[pr];
          contagem.prateleiras++;
          var yNivel = M.peDireito + (pr + 1) * M.alturaNivel;

          pecas.push({
            tipo: 'prateleira', id: 'PRAT-' + rua.nome + '-' + est.nome + '-' + prat.nome,
            rotulo: prat.nome,
            x: xRua + M.profundidade / 2, y: yNivel, z: z + compEstante / 2,
            lx: M.profundidade, ly: M.prateleira, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* as duas longarinas da frente e do fundo */
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-F',
            x: xRua, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-T',
            x: xRua + M.profundidade, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* --- as posições: o que o usuário clica --- */
          for (var po = 0; po < prat.posicoes.length; po++) {
            var loc = prat.posicoes[po];
            contagem.posicoes++;
            var zPos = z + po * M.larguraPosicao + M.larguraPosicao / 2;
            var alturaCaixa = M.alturaNivel * 0.66;

            var peca = {
              tipo: 'posicao',
              id: lp(loc.codigo) || (rua.nome + '-' + est.nome + '-' + prat.nome + '-' + cima(loc.posicao)),
              codigo: lp(loc.codigo),
              rua: rua.nome, estante: est.nome,
              prateleira: prat.nome, posicao: cima(loc.posicao),
              x: xRua + M.profundidade / 2,
              y: yNivel + alturaCaixa / 2 + M.prateleira,
              z: zPos,
              lx: M.profundidade * 0.86,
              ly: alturaCaixa,
              lz: M.larguraPosicao * 0.88,
              cor: corDaPosicao(loc),
              situacao: situacaoDaPosicao(loc),
              capacidade: num(loc.capacidade),
              itens: num(loc.itens !== undefined ? loc.itens : loc.ocupacao),
              status: lp(loc.status),
              clicavel: true,
              dado: loc
            };
            pecas.push(peca);
            if (peca.codigo) indice[peca.codigo] = peca;
            maxY = Math.max(maxY, peca.y + peca.ly);
          }
        }

        maxY = Math.max(maxY, alturaEstante);
        z += compEstante + M.vaoEstantes;
      }

      /* a plaquinha da rua, no começo dela */
      pecas.push({
        tipo: 'placaRua', id: 'RUA-' + rua.nome, rotulo: rua.nome,
        x: xRua + M.profundidade / 2, y: 2.4, z: M.folgaPiso / 2,
        lx: 0.6, ly: 0.35, lz: 0.04, cor: CORES.faixa, clicavel: false
      });

      maxZ = Math.max(maxZ, z);
      x += larguraRua + M.corredor;
      maxX = Math.max(maxX, x);
    }

    /* o piso, dimensionado pelo que foi montado */
    var compX = Math.max(6, maxX - M.corredor + M.folgaPiso);
    var compZ = Math.max(6, maxZ + M.folgaPiso);
    pecas.unshift({
      tipo: 'piso', id: 'PISO',
      x: compX / 2, y: 0, z: compZ / 2,
      lx: compX, ly: 0.02, lz: compZ,
      cor: CORES.piso, clicavel: false
    });

    return {
      pecas: pecas,
      indice: indice,
      contagem: contagem,
      galpao: { largura: compX, profundidade: compZ, altura: Math.max(3, maxY + 0.8) },
      medidas: M,
      cores: CORES
    };
  }

  /* ----------------------------------------------------------
     RESUMO: os números do painel, calculados do mesmo dado que
     pinta as cores — para o texto nunca discordar da imagem.
     ---------------------------------------------------------- */
  function resumo(montagem) {
    var r = { total: 0, vazias: 0, ocupadas: 0, lotadas: 0, bloqueadas: 0, ocupacaoPct: 0 };
    if (!montagem || !montagem.pecas) return r;
    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo !== 'posicao') continue;
      r.total++;
      if (p.situacao === 'VAZIA') r.vazias++;
      else if (p.situacao === 'OCUPADA') r.ocupadas++;
      else if (p.situacao === 'LOTADA') r.lotadas++;
      else if (p.situacao === 'BLOQUEADA') r.bloqueadas++;
    }
    var usadas = r.ocupadas + r.lotadas;
    r.ocupacaoPct = r.total ? Math.round(usadas / r.total * 100) : 0;
    return r;
  }

  raiz.LAYOUT3D = {
    MEDIDAS: MEDIDAS,
    CORES: CORES,
    organizar: organizar,
    montar: montar,
    resumo: resumo,
    corDaPosicao: corDaPosicao,
    situacaoDaPosicao: situacaoDaPosicao
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = raiz.LAYOUT3D;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== adaptador.js ===== */
/* ============================================================
   ALMOXA 3D · adaptador.js  ·  08/11/2026
   ------------------------------------------------------------
   O ADAPTADOR MULTIAMBIENTE · seção 5 do adendo.

   Uma aplicação só, dois lugares para rodar:

     · servida pelo Apps Script (/exec) → google.script.run
     · servida pelo GitHub Pages       → HTTPS no /exec

   O resto do módulo 3D não sabe em qual dos dois está. Ele

    versao: '08/11',

     rodando dentro dele e no mesmo endereço. Devolve nada quando

          };

          if (respondeu) return;

            mensagem: 'O Core não respondeu em ' +
              Math.round((opcoes.tempoLimite || A.tempoLimite) / 1000) +

        }, opcoes.tempoLimite || A.tempoLimite);

          'Chame API3D.configurar({ url: "...". }) antes de usar.' }));
    }

    var prazo = new Promise(function (resolve) {

          mensagem: 'O Core não respondeu em ' +

  A.semLocalizacao = function () { return A.chamar('locais', 'semLocalizacao'); };

<script>
/* ===== motor3d.js ===== */
/* ============================================================
   ALMOXA 3D · motor3d.js  ·  08/11/2026
   ------------------------------------------------------------
   O MOTOR BABYLON.

   Este arquivo não calcula nada: ele recebe a lista de peças
   pronta do layout3d.js e transforma em malha. Toda a conta de
   onde fica cada montante e cada posição está lá, e é testada
   em Node sem precisar de placa de vídeo.

   Aqui mora só o que é Babylon de verdade: cena, câmera, luz,
   sombra, material, instância e clique.

   DESEMPENHO · seção 15. Um almoxarifado de 5.000 posições são
   5.000 caixas iguais. Criar 5.000 malhas separadas derruba
   celular. Então as posições são INSTÂNCIAS de um mesmo molde,
   uma por cor: a placa de vídeo desenha milhares de cópias num
   lance só. Montante, longarina e prateleira seguem a mesma
   ideia.
   ============================================================ */
(function (raiz) {
  'use strict';

  var M = {
    nome: 'MOTOR3D',
    versao: '08/11',
    engine: null,
    cena: null,
    camera: null,
    moldes: {},
    instancias: [],
    porCodigo: {},
    selecionada: null,
    corDaSelecionada: null,
    aoSelecionar: null,     /* função que a tela registra */
    pronto: false
  };

  function B() {
    if (typeof BABYLON === 'undefined') {
      throw new Error('O Babylon.js não carregou. Confira a conexão e o endereço da biblioteca.');
    }
    return BABYLON;
  }

  function cor3(hex) {
    return B().Color3.FromHexString(hex || '#888888');
  }

  /* ----------------------------------------------------------
     A CENA
     ---------------------------------------------------------- */
  M.iniciar = function (canvas, opcoes) {
    opcoes = opcoes || {};
    var b = B();

    M.engine = new b.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      /* no celular, metade dos pixels é o suficiente e dobra o fôlego */
      adaptToDeviceRatio: true
    });

    var cena = new b.Scene(M.engine);
    cena.clearColor = b.Color4.FromHexString((opcoes.fundo || '#EEF1F5') + 'FF');
    M.cena = cena;

    /* câmera orbital · seção 1 */
    var cam = new b.ArcRotateCamera('cam',
      -Math.PI / 4, Math.PI / 3.2, 28,
      new b.Vector3(0, 1.2, 0), cena);
    cam.attachControl(canvas, true);
    cam.lowerBetaLimit = 0.12;
    cam.upperBetaLimit = Math.PI / 2.05;   /* não deixa passar por baixo do piso */
    cam.lowerRadiusLimit = 3;
    cam.upperRadiusLimit = 220;
    cam.wheelDeltaPercentage = 0.02;
    cam.pinchDeltaPercentage = 0.02;       /* pinça no celular */
    cam.panningSensibility = 80;
    M.camera = cam;

    /* luz: uma geral e uma direcional que lança sombra */
    var ceu = new b.HemisphericLight('ceu', new b.Vector3(0, 1, 0), cena);
    ceu.intensity = 0.78;
    ceu.groundColor = cor3('#B9C0C9');

    var sol = new b.DirectionalLight('sol', new b.Vector3(-0.5, -1, -0.35), cena);
    sol.position = new b.Vector3(40, 60, 40);
    sol.intensity = 0.65;
    M.sol = sol;

    if (opcoes.sombras !== false) {
      M.sombra = new b.ShadowGenerator(1024, sol);
      M.sombra.useBlurExponentialShadowMap = true;
      M.sombra.blurKernel = 16;
    }

    M.engine.runRenderLoop(function () { cena.render(); });
    raiz.addEventListener('resize', function () { M.engine.resize(); });

    cena.onPointerObservable.add(function (info) {
      if (info.type !== b.PointerEventTypes.POINTERPICK) return;
      var m = info.pickInfo && info.pickInfo.pickedMesh;
      M.clicar(m);
    });

    M.pronto = true;
    return M;
  };

  /* ----------------------------------------------------------
     MATERIAIS E MOLDES
     ---------------------------------------------------------- */
  function material(nome, hex, opcoes) {
    opcoes = opcoes || {};
    var b = B();
    var chave = 'mat:' + nome;
    if (M.moldes[chave]) return M.moldes[chave];
    var mat = new b.StandardMaterial(nome, M.cena);
    mat.diffuseColor = cor3(hex);
    mat.specularColor = cor3(opcoes.brilho || '#2A2A2A');
    if (opcoes.emissivo) mat.emissiveColor = cor3(opcoes.emissivo);
    mat.freeze();
    M.moldes[chave] = mat;
    return mat;
  }

  /** um molde por combinação de tamanho+cor; o resto vira instância */
  function molde(peca) {
    var b = B();
    var chave = [peca.tipo, peca.lx.toFixed(3), peca.ly.toFixed(3),
                 peca.lz.toFixed(3), peca.cor].join('|');
    if (M.moldes[chave]) return M.moldes[chave];

    var caixa = b.MeshBuilder.CreateBox('molde_' + peca.tipo, {
      width: peca.lx, height: peca.ly, depth: peca.lz
    }, M.cena);
    caixa.material = material('m_' + peca.tipo + '_' + peca.cor, peca.cor,
      { brilho: peca.tipo === 'piso' ? '#0A0A0A' : '#303030' });
    caixa.isVisible = false;                 /* o molde não aparece */
    caixa.isPickable = false;
    M.moldes[chave] = caixa;
    return caixa;
  }

  /* ----------------------------------------------------------
     DESENHAR o galpão a partir da montagem do layout3d
     ---------------------------------------------------------- */
  M.desenhar = function (montagem) {
    if (!M.cena) throw new Error('A cena não foi iniciada.');
    var b = B();
    M.limpar();

    var pecas = (montagem && montagem.pecas) || [];
    for (var i = 0; i < pecas.length; i++) {
      var p = pecas[i];
      var base = molde(p);
      var inst = base.createInstance('i_' + p.id);
      inst.position = new b.Vector3(p.x, p.y, p.z);
      inst.isPickable = !!p.clicavel;
      inst.metadata = p;

      if (M.sombra && p.tipo !== 'piso') {
        try { M.sombra.addShadowCaster(inst); } catch (e) { }
      }
      if (p.tipo === 'piso') {
        inst.receiveShadows = true;
      }

      M.instancias.push(inst);
      if (p.tipo === 'posicao' && p.codigo) M.porCodigo[p.codigo] = inst;
    }

    /* enquadra o galpão inteiro na primeira vez */
    var g = (montagem && montagem.galpao) || { largura: 20, profundidade: 20, altura: 4 };
    M.camera.setTarget(new b.Vector3(g.largura / 2, g.altura / 3, g.profundidade / 2));
    M.camera.radius = Math.max(g.largura, g.profundidade) * 1.15 + 8;

    return { instancias: M.instancias.length, moldes: Object.keys(M.moldes).length };
  };

  M.limpar = function () {
    for (var i = 0; i < M.instancias.length; i++) {
      try { M.instancias[i].dispose(); } catch (e) { }
    }
    M.instancias = [];
    M.porCodigo = {};
    M.selecionada = null;
    M.corDaSelecionada = null;
  };

  /* ----------------------------------------------------------
     SELEÇÃO · azul, e devolve a cor de antes ao sair
     ---------------------------------------------------------- */
  M.clicar = function (malha) {
    if (M.selecionada) {
      try { M.selecionada.instancedBuffers = M.selecionada.instancedBuffers; } catch (e) { }
      M.destacar(M.selecionada, false);
      M.selecionada = null;
    }
    if (!malha || !malha.metadata || malha.metadata.tipo !== 'posicao') {
      if (typeof M.aoSelecionar === 'function') M.aoSelecionar(null);
      return null;
    }
    M.selecionada = malha;
    M.destacar(malha, true);
    if (typeof M.aoSelecionar === 'function') M.aoSelecionar(malha.metadata);
    return malha.metadata;
  };

  /** o destaque é uma moldura, não troca de cor: assim o verde
      continua verde e o usuário não perde a leitura da ocupação */
  M.destacar = function (malha, ligado) {
    var b = B();
    if (!M.realce) {
      M.realce = new b.HighlightLayer('realce', M.cena, { blurHorizontalSize: 0.6 });
    }
    try {
      if (ligado) M.realce.addMesh(malha.sourceMesh || malha, cor3('#2F7BE8'));
      else M.realce.removeMesh(malha.sourceMesh || malha);
    } catch (e) { }
  };

  M.selecionarPorCodigo = function (codigo) {
    var m = M.porCodigo[codigo];
    if (!m) return null;
    return M.clicar(m);
  };

  /* ----------------------------------------------------------
     AS VISÕES · seção 8
     ---------------------------------------------------------- */
  M.visao = function (qual, galpao) {
    if (!M.camera) return;
    var g = galpao || { largura: 20, profundidade: 20, altura: 4 };
    var longe = Math.max(g.largura, g.profundidade) * 1.15 + 8;
    var a = { superior: [-Math.PI / 2, 0.02], frontal: [-Math.PI / 2, Math.PI / 2.1],
              lateral: [0, Math.PI / 2.1], perspectiva: [-Math.PI / 4, Math.PI / 3.2] };
    var v = a[qual] || a.perspectiva;
    M.camera.alpha = v[0];
    M.camera.beta = v[1];
    M.camera.radius = longe;
  };

  M.foto = function () {
    try { return M.engine && M.cena ? M.cena.getEngine().getRenderingCanvas().toDataURL() : ''; }
    catch (e) { return ''; }
  };

  M.parar = function () {
    try { M.engine && M.engine.stopRenderLoop(); } catch (e) { }
    try { M.cena && M.cena.dispose(); } catch (e) { }
    try { M.engine && M.engine.dispose(); } catch (e) { }
    M.pronto = false;
  };

  raiz.MOTOR3D = M;
  if (typeof module !== 'undefined' && module.exports) module.exports = M;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== app.js ===== */
/* ============================================================
   ALMOXA 3D · app.js  ·  08/11/2026
   ------------------------------------------------------------
   A AMARRAÇÃO. Pega o dado pelo adaptador, passa pelo layout,
   entrega ao motor e cuida do painel.

   Nenhuma regra de negócio mora aqui — é só costura. Quem
   decide cor é o layout3d, quem decide permissão é o Core.
   ============================================================ */
(function (raiz) {
  'use strict';

  var APP = {
    versao: '08/11',
    montagem: null,
    locais: [],
    carregando: false,
    modoDemo: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ----------------------------------------------------------
     O PAINEL
     ---------------------------------------------------------- */
  var ROTULO = {
    /* o cinza da BOLINHA do mapa é claro de propósito, para a
       posição vazia não competir com o material. Mas na ETIQUETA
       do painel ele leva texto branco em cima — e branco sobre
       #9AA3AE é ilegível. Então a etiqueta usa um cinza escuro:
       mesma leitura, contraste de verdade. */
    VAZIA:      { txt: 'Vazia',     cor: '#6B7482' },
    OCUPADA:    { txt: 'Ocupada',   cor: 'var(--verde)' },
    LOTADA:     { txt: 'Lotada',    cor: 'var(--amarelo)' },
    BLOQUEADA:  { txt: 'Bloqueada', cor: 'var(--vermelho)' }
  };

  APP.pintarResumo = function () {
    var r = raiz.LAYOUT3D.resumo(APP.montagem);
    var amb = raiz.API3D ? raiz.API3D.ambiente() : 'NAVEGADOR';
    var nomeAmb = { APPS_SCRIPT: 'Apps Script', GITHUB_PAGES: 'GitHub Pages' }[amb] || 'navegador';

    var html = '';
    if (APP.modoDemo) {
      html += '<div class="aviso"><b>Galpão de demonstração.</b> ' +
        'O endereço do Core não foi configurado, então estou desenhando um ' +
        'galpão de exemplo para você ver o motor funcionando. ' +
        'Nenhum dado seu foi lido.</div>';
    }

    html +=
      '<div class="numeros">' +
        cartao(r.total, 'posições') +
        cartao(r.ocupadas + r.lotadas, 'com material') +
        cartao(r.vazias, 'vazias') +
        cartao(r.bloqueadas, 'bloqueadas') +
      '</div>' +
      '<div class="linha"><span>Ocupação do galpão</span><b>' + r.ocupacaoPct + '%</b></div>' +
      '<div class="barraOcup"><i style="width:' + r.ocupacaoPct + '%"></i></div>' +
      '<div class="linha"><span>Ruas</span><b>' + APP.montagem.contagem.ruas + '</b></div>' +
      '<div class="linha"><span>Estantes</span><b>' + APP.montagem.contagem.estantes + '</b></div>' +
      '<div class="linha"><span>Prateleiras</span><b>' + APP.montagem.contagem.prateleiras + '</b></div>' +
      '<div class="linha"><span>Medidas do galpão</span><b>' +
        APP.montagem.galpao.largura.toFixed(1) + ' × ' +
        APP.montagem.galpao.profundidade.toFixed(1) + ' m</b></div>' +
      '<div class="linha"><span>Ambiente</span><b>' + nomeAmb + '</b></div>' +
      '<div class="vazio">Clique numa posição do galpão<br>para ver o que está guardado nela.</div>';

    $('corpoPainel').innerHTML = html;
    $('tituloPainel').textContent = 'O galpão';
  };

  function cartao(n, rot) {
    return '<div class="cartao"><b>' + n + '</b><span>' + rot + '</span></div>';
  }

  APP.pintarPosicao = function (p) {
    if (!p) { APP.pintarResumo(); return; }
    var rot = ROTULO[p.situacao] || ROTULO.VAZIA;
    var d = p.dado || {};

    var html =
      '<div class="linha"><span>Endereço</span><b>' + esc(p.codigo || '—') + '</b></div>' +
      '<div class="linha"><span>Situação</span><b><span class="chip" style="background:' +
        rot.cor + '">' + rot.txt + '</span></b></div>' +
      '<div class="linha"><span>Rua</span><b>' + esc(p.rua) + '</b></div>' +
      '<div class="linha"><span>Estante</span><b>' + esc(p.estante) + '</b></div>' +
      '<div class="linha"><span>Prateleira</span><b>' + esc(p.prateleira) + '</b></div>' +
      '<div class="linha"><span>Posição</span><b>' + esc(p.posicao || '(a prateleira inteira)') + '</b></div>' +
      '<div class="linha"><span>Materiais guardados</span><b>' + p.itens + '</b></div>' +
      '<div class="linha"><span>Capacidade</span><b>' +
        (p.capacidade ? p.capacidade : 'não informada') + '</b></div>';

    if (d.observacao) {
      html += '<div class="linha"><span>Observação</span><b>' + esc(d.observacao) + '</b></div>';
    }
    html += '<div class="linha"><span>Chave do QR Code</span><b>ALMOXA:LOC:' +
      esc(p.codigo) + '</b></div>';

    if (p.itens > 0) {
      html += '<div class="vazio">A lista do que está guardado aqui vem do módulo ' +
        'de estoque. Ainda não liguei essa consulta — é o próximo passo.</div>';
    }

    $('corpoPainel').innerHTML = html;
    $('tituloPainel').textContent = 'Posição selecionada';
  };

  /* ----------------------------------------------------------
     CARREGAR
     ---------------------------------------------------------- */
  APP.carregar = function () {
    if (APP.carregando) return Promise.resolve();
    APP.carregando = true;
    $('corpoPainel').innerHTML = '<div class="vazio">Consultando o Core…</div>';

    var api = raiz.API3D;
    var pedido;

    if (api && api.pronto()) {
      APP.modoDemo = false;
      pedido = api.localizacoes();
    } else {
      /* sem Core configurado: desenho um galpão de exemplo em vez de
         deixar a tela preta. E DIGO que é exemplo, no painel. */
      APP.modoDemo = true;
      pedido = Promise.resolve({ ok: true, dados: APP.galpaoDeDemonstracao() });
    }

    return pedido.then(function (r) {
      APP.carregando = false;
      if (!r || !r.ok) {
        /* Quando a recusa é de CHAVE, dizer de onde a chave veio
           — ou que não veio nenhuma — poupa uma ida e volta.
           O valor da chave nunca aparece: só a procedência. */
        var bruta = (r && r.mensagem) || 'o Core não respondeu';
        var msg = esc(bruta);
        var deIdentidade = /chave|sess(ã|a)o|token|permiss|autentic|perfil|login/i.test(bruta);
        var extra = '';
        if (deIdentidade && window.API3D) {
          var e3 = window.API3D.estado();
          extra = '<div class="small" style="margin-top:8px">' +
            (e3.porSistema
              ? 'O mapa falou pela porta do próprio ALMOX PRO (' +
                esc(e3.origemDaPorta) + '), com a sessão que o sistema está ' +
                'usando agora. Se o sistema entra e isto não, quem recusou foi ' +
                'o Core — e o motivo é o texto acima, não o mapa.'
              : '<b>O mapa não está falando pela porta do sistema.</b> ' +
                'Sozinho ele não tem sessão, e sessão não se copia nem se ' +
                'inventa. Abra pelo botão <b>Mapeamento 3D</b> de dentro do ' +
                'ALMOX PRO, já identificado — é de lá que ele herda a entrada.') +
            '</div>';
        }
        $('corpoPainel').innerHTML = '<div class="aviso erro"><b>Não consegui carregar.</b><br>' +
          msg + extra + '</div>';
        return;
      }
      APP.locais = r.dados || [];
      APP.desenhar();
    });
  };

  APP.desenhar = function () {
    APP.montagem = raiz.LAYOUT3D.montar(APP.locais);
    raiz.MOTOR3D.desenhar(APP.montagem);
    APP.pintarResumo();
  };

  /* um galpão pequeno, só para o motor ter o que mostrar */
  APP.galpaoDeDemonstracao = function () {
    var fora = [], ruas = ['A', 'B', 'C'];
    for (var r = 0; r < ruas.length; r++) {
      for (var e = 1; e <= 2; e++) {
        for (var p = 1; p <= 4; p++) {
          for (var o = 0; o < 6; o++) {
            var itens = (r * 7 + e * 3 + p * 2 + o) % 5;
            var cap = 4;
            var st = (r === 2 && p === 1 && o < 2) ? 'BLOQUEADA' : 'DISPONIVEL';
            var est = ruas[r] + '0' + e;
            var pos = String.fromCharCode(65 + o);
            fora.push({
              id: 'DEMO' + r + e + p + o,
              rua: ruas[r], estante: est, prateleira: String(p), posicao: pos,
              codigo: [ruas[r], est, String(p), pos].join('-'),
              capacidade: cap, itens: itens > cap ? cap : itens,
              ocupacao: itens, status: st
            });
          }
        }
      }
    }
    return fora;
  };

  /* ----------------------------------------------------------
     LIGAR TUDO
     ---------------------------------------------------------- */
  APP.iniciar = function (opcoes) {
    opcoes = opcoes || {};
    try {
      raiz.MOTOR3D.iniciar($('tela3d'), { fundo: opcoes.fundo });
    } catch (err) {
      $('corpoPainel').innerHTML = '<div class="aviso erro"><b>O 3D não iniciou.</b><br>' +
        esc(err.message) + '</div>';
      return;
    }

    raiz.MOTOR3D.aoSelecionar = function (p) { APP.pintarPosicao(p); };

    /* os botões de visão */
    var visoes = ['perspectiva', 'superior', 'frontal', 'lateral'];
    visoes.forEach(function (v) {
      var b = $('v_' + v);
      if (!b) return;
      b.addEventListener('click', function () {
        raiz.MOTOR3D.visao(v, APP.montagem && APP.montagem.galpao);
        visoes.forEach(function (o) {
          var bo = $('v_' + o);
          if (bo) bo.setAttribute('aria-pressed', o === v ? 'true' : 'false');
        });
      });
    });
    var rec = $('v_recarregar');
    if (rec) rec.addEventListener('click', function () { APP.carregar(); });

    return APP.carregar();
  };

  raiz.APP3D = APP;
  if (typeof module !== 'undefined' && module.exports) module.exports = APP;

})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* ============================================================
   CONFIGURAÇÃO DE AMBIENTE
   ------------------------------------------------------------
   No Apps Script não precisa de nada: o adaptador acha o
   google.script.run sozinho.

   No GitHub Pages, o endereço do /exec pode vir de três lugares,
   nesta ordem — e nenhum deles é "escrito no código":

     1. ?core=<url> na barra de endereço
     2. o que ficou guardado no navegador de quem já configurou
     3. nada: aí a tela mostra um galpão de DEMONSTRAÇÃO e
        avisa, em vez de ficar preta

   Guardar no navegador é conveniência de quem usa, não fonte
   oficial de nada: quem decide o que pode ser feito é o Core.
   ============================================================ */
(function () {
  function acharUrlDoCore() {
    try {
      var q = new URLSearchParams(location.search).get('core');
      if (q) {
        try { localStorage.setItem('almoxa3d:core', q); } catch (e) {}
        return q;
      }
    } catch (e) {}
    try { return localStorage.getItem('almoxa3d:core') || ''; } catch (e) { return ''; }
  }

  function comecar() {
    if (typeof BABYLON === 'undefined') {
      document.getElementById('corpoPainel').innerHTML =
        '<div class="aviso erro"><b>O Babylon.js não carregou.</b><br>' +
        'Confira a conexão. Se esta página estiver dentro do Apps Script, ' +
        'veja em IMPLANTACAO.md como embutir a biblioteca.</div>';
      return;
    }
    if (window.API3D) {
      window.API3D.configurar({ url: acharUrlDoCore() });
      /* A chave NÃO está escrita aqui e não vem pelo endereço.
         Ela é perguntada ao próprio ALMOX PRO, que é servido
         pelo mesmo endereço que esta página. Se não houver, vai
         vazia: fase 1 não pode bloquear a comunicação, e se o
         Core recusar, quem explica é a resposta dele. */
      window.API3D.herdarChave();
    }
    window.APP3D.iniciar({});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', comecar);
  } else { comecar(); }
})();
</script>
