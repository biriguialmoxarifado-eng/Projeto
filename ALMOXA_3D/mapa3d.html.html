      divisoes: num('cDivisoes', 1),
      larguraCm: num('cLargura', 0),
      profundidadeCm: num('cProfundidade', 0),
      alturaCm: num('cAltura', 0),
      alturasCm: alturasCm,
      vaoModuloCm: num('cVaoModulo', 0),
      vaoEstanteCm: num('cVaoEstante', 0),
      alturaLivreCm: num('cAlturaLivre', 0)
    };

    var p = L.projetar(pedido);
    C.projeto = p;
    C.pintarNiveis();

    if (!p.ok) {
      $('cResultado').innerHTML =
        '<div class="aviso erro" style="margin-top:12px"><b>Falta resolver:</b>' +
        p.erros.map(function (x) { return '<div>· ' + esc(x) + '</div>'; }).join('') +
        '</div>';
      $('cValidacao').innerHTML = '';
      C.ligarGravar(false);
      return p;
    }

    /* desenha pelo mesmo montar() do galpão de verdade: o que ele
       vê aqui é exatamente o que vai existir depois */
    var opcoes = { medidas: p.medidas };
    if (p.geometria.alturasNiveis) opcoes.alturasNiveis = p.geometria.alturasNiveis;
    if (p.geometria.vaoModulo) opcoes.vaoModulo = p.geometria.vaoModulo;
    if (p.geometria.vaoEstantes) opcoes.medidas.vaoEstantes = p.geometria.vaoEstantes;
    var montagem = L.montar(p.locais, opcoes);
    C.montagem = montagem;
    /* [F2] o desenho pode falhar (Babylon ausente, placa fraca) sem
       levar junto a conta e as validações: essas não dependem de
       placa de vídeo, e são elas que impedem endereço errado. */
    try {
      raiz.MOTOR3D.desenhar(montagem);
      C.selo(true);
    } catch (e) {
      C.erroDeDesenho = String(e && e.message || e);
    }

    var comprimento = p.contagem.posicoes / p.contagem.prateleiras * p.medidas.larguraPosicao;
    var alturaM = 0;
    for (var k = 0; k < p.contagem.prateleiras; k++) {
      alturaM += (C.niveis[k] > 0 ? C.niveis[k] / 100 : p.medidas.alturaNivel);
    }
    var primeiro = p.locais[0].codigo;
    var ultimo = p.locais[p.locais.length - 1].codigo;

    $('cResultado').innerHTML =
      '<div class="sep"></div>' +
      '<div class="linha"><span>Módulos</span><b>' + p.contagem.modulos + '</b></div>' +
      '<div class="linha"><span>Divisões que seriam criadas</span><b>' +
        p.contagem.posicoes + '</b></div>' +
      '<div class="linha"><span>Comprimento da estante</span><b>' +
        comprimento.toFixed(2).replace('.', ',') + ' m</b></div>' +
      '<div class="linha"><span>Altura</span><b>' +
        alturaM.toFixed(2).replace('.', ',') + ' m</b></div>' +
      '<div class="linha"><span>Numeração</span><b>' +
        (p.porLetra ? 'letras (A…' + p.nomes[p.nomes.length - 1] + ')'
                    : 'números (01…' + p.nomes[p.nomes.length - 1] + ')') +
        '</b></div>' +
      '<div class="linha"><span>Do primeiro</span><b class="mono">' +
        esc(primeiro) + '</b></div>' +
      '<div class="linha"><span>Ao último</span><b class="mono">' +
        esc(ultimo) + '</b></div>';

    /* [F2] as validações rodam a cada tecla, não só na hora de gravar */
    var v = C.validacao = C.validar(p);
    var hv = '';
    if (v.impedem.length) {
      hv += '<div class="aviso erro" style="margin-top:12px"><b>Impede gravar:</b>' +
        v.impedem.map(function (x) { return '<div>· ' + esc(x) + '</div>'; }).join('') +
        '</div>';
    }
    if (v.avisam.length) {
      hv += '<div class="aviso" style="margin-top:10px"><b>Atenção:</b>' +
        v.avisam.map(function (x) { return '<div>· ' + esc(x) + '</div>'; }).join('') +
        '</div>';
    }
    if (!v.impedem.length && !v.avisam.length) {
      hv += '<div class="aviso" style="margin-top:12px;border-color:#BFE3CC;' +
        'background:#F0FAF4;color:#1E5F3A"><b>As validações passaram.</b> ' +
        'Nenhum código repetido, nenhum conflito com o cadastro e nenhuma ' +
        'posição com material no caminho.</div>';
    }
    $('cValidacao').innerHTML = hv;
    C.ligarGravar(v.pode);
    return p;
  };

  /* o botão de gravar continua desligado nesta fase; o que muda é o
     recado, para ficar claro se o impedimento é a fase ou o projeto */
  C.ligarGravar = function (projetoEstaBom) {
    var b = $('cGravar'), r = $('cRecadoGravar');
    if (!b) return;
    b.disabled = true;
    if (r) {
      r.innerHTML = projetoEstaBom
        ? 'O projeto passou nas validações. Gravar continua desligado <b>nesta ' +
          'fase</b>: criar endereço em produção precisa da sua autorização e de ' +
          'um teste contra o Core.'
        : 'Gravar está desligado. Resolva o que está marcado em vermelho acima — ' +
          'e, mesmo resolvido, a escrita só liga com a sua autorização.';
    }
  };

  /* ------------------------------------------------------------
     [F2] O SELO · "a estrutura projetada não poderá ser confundida
     com uma estrutura já cadastrada no Core" (seção 5)
     ------------------------------------------------------------ */
  C.selo = function (mostrar) {
    var cena = document.getElementById('cena');
    if (!cena) return;
    var el = document.getElementById('selo3d');
    if (!mostrar) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'selo3d';
      cena.appendChild(el);
    }
    el.textContent = 'PROJETO — não está cadastrado';
  };

  /* ------------------------------------------------------------
     [F2] DUPLICAR · seção 5
     ------------------------------------------------------------ */
  C.proximoCodigo = function (codigo) {
    var m = String(codigo || '').match(/^(.*?)(\d+)$/);
    if (!m) return String(codigo || '') + '-2';
    var largura = m[2].length;
    var n = String(Number(m[2]) + 1);
    while (n.length < largura) n = '0' + n;
    return m[1] + n;
  };

  C.duplicar = function () {
    var campo = $('cEstante');
    if (!campo) return;
    campo.value = C.proximoCodigo(campo.value);
    C.atualizar();
  };

  /* ------------------------------------------------------------
     [F2] COMPARAR O PROJETADO COM O CADASTRADO · seção 5
     ------------------------------------------------------------ */
  C.comparar = function () {
    var alvo = $('cComparacao');
    if (!alvo) return;
    var p = C.projeto;
    if (!p || !p.ok) { alvo.innerHTML = ''; return; }

    var reais = (raiz.APP3D && raiz.APP3D.locais) || [];
    if (!reais.length) {
      alvo.innerHTML = '<div class="aviso" style="margin-top:12px">' +
        '<b>Não há cadastro carregado para comparar.</b> ' +
        'O mapa não recebeu nenhum endereço do Core nesta sessão. ' +
        'Comparar com lista vazia diria que está tudo novo, e isso ' +
        'seria falso.</div>';
      return;
    }

    var v = C.validar(p);
    var novos = p.locais.length - v.jaExistem.length;
    var h = '<div class="sep"></div>' +
      '<div class="linha"><span>Projetado</span><b>' + p.locais.length + ' posição(ões)</b></div>' +
      '<div class="linha"><span>Já cadastradas</span><b>' + v.jaExistem.length + '</b></div>' +
      '<div class="linha"><span>Seriam novas</span><b>' + novos + '</b></div>' +
      '<div class="linha"><span>Com material guardado</span><b>' +
        v.comMaterial.length + '</b></div>';

    if (v.comMaterial.length) {
      h += '<div class="aviso erro" style="margin-top:10px"><b>Estas têm material:</b>' +
        v.comMaterial.slice(0, 8).map(function (x) {
          return '<div>· <span class="mono">' + esc(x.codigo) + '</span> — ' +
                 x.itens + ' material(is)</div>';
        }).join('') +
        (v.comMaterial.length > 8 ? '<div>· e mais ' + (v.comMaterial.length - 8) + '</div>' : '') +
        '</div>';
    }
    alvo.innerHTML = h;
  };

  /* ------------------------------------------------------------
     [F2] OS MODOS · seção 5
     ------------------------------------------------------------ */
  C.trocarModo = function (modo) {
    if (!C.MODOS[modo]) return;
    C.modo = modo;

    Array.prototype.forEach.call(
      document.querySelectorAll('#cModos [data-modo]'), function (b) {
        b.setAttribute('aria-pressed',
          b.getAttribute('data-modo') === modo ? 'true' : 'false');
      });

    var aviso = $('cAvisoModo');
    if (modo === 'projeto') {
      if (aviso) aviso.innerHTML = '<b>Modo Projeto.</b> O que aparece no galpão ' +
        'agora é um DESENHO. Nada aqui está cadastrado e nada foi gravado.';
      C.atualizar();
    } else if (modo === 'visualizacao') {
      if (aviso) aviso.innerHTML = '<b>Modo Visualização.</b> O galpão desenhado é ' +
        'o CADASTRADO, como ele está no Core. O formulário continua aberto, mas ' +
        'o que o senhor vê não é o projeto.';
      C.selo(false);
      /* [F2] 14/11 — aqui eu chamava APP3D.desenhar(), que repinta o
         PAINEL inteiro com o resumo do galpão: o formulário sumia,
         bem debaixo de um aviso meu dizendo que ele continuava
         aberto. Agora eu redesenho só a CENA e deixo o painel como
         está. */
      if (raiz.APP3D) {
        if (C.guardado) raiz.APP3D.locais = C.guardado;
        try {
          var reais = raiz.LAYOUT3D.montar(raiz.APP3D.locais || []);
          raiz.MOTOR3D.desenhar(reais);
          C.erroDeDesenho = '';
        } catch (e) {
          C.erroDeDesenho = String((e && e.message) || e);
        }
      }
    } else {
      /* Operação: sai do construtor e volta ao mapa de trabalho */
      C.fechar();
    }
  };

  C.abrir = function () {
    if (C.aberto) return;
    /* guarda o galpão real para voltar sem reconsultar o Core */
    C.guardado = raiz.APP3D ? raiz.APP3D.locais : null;
    C.aberto = true;
    C.modo = 'projeto';

    /* [F2] 14/11 — aqui estava APP.titulo(...), e APP não existe
       neste escopo: o construtor é outro IIFE e só enxerga
       raiz.APP3D. Erro meu, da fase 1; as provas da fase 1 não
       pegaram porque nunca abriam o construtor. */
    if (raiz.APP3D && raiz.APP3D.titulo) raiz.APP3D.titulo('Construir estante');
    $('corpoPainel').innerHTML = C.html();

    var campos = ['cRua', 'cEstante', 'cModulos', 'cPrateleiras', 'cPrimeira',
                  'cDivisoes', 'cLargura', 'cProfundidade', 'cAltura',
                  'cVaoModulo', 'cVaoEstante', 'cAlturaLivre'];
    campos.forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener('input', function () { C.atualizar(); });
      el.addEventListener('change', function () { C.atualizar(); });
    });

    var voltar = $('cVoltar');
    if (voltar) voltar.addEventListener('click', function () { C.fechar(); });

    var dup = $('cDuplicar');
    if (dup) dup.addEventListener('click', function () { C.duplicar(); });

    var cmp = $('cComparar');
    if (cmp) cmp.addEventListener('click', function () { C.comparar(); });

    var mais = $('cNivelMais');
    if (mais) mais.addEventListener('click', function () {
      var el = $('cPrateleiras');
      if (!el) return;
      var q = Number(el.value || 1) + 1;
      if (q > 20) return;
      el.value = q;
      C.atualizar();
    });

    var menos = $('cNivelMenos');
    if (menos) menos.addEventListener('click', function () {
      var el = $('cPrateleiras');
      if (!el) return;
      var q = Number(el.value || 1);
      if (q <= 1) return;
      /* seção 5: só sai nível NÃO UTILIZADO */
      var nome = String(num('cPrimeira', 1) + q - 1);
      var usados = C.nivelEstaUsado(nome);
      var comMaterial = usados.filter(function (u) { return u.itens > 0; });
      if (comMaterial.length) {
        $('cValidacao').innerHTML = '<div class="aviso erro" style="margin-top:12px">' +
          '<b>Não tirei o nível ' + esc(nome) + '.</b> Ele tem ' +
          comMaterial.length + ' posição(ões) com material guardado: ' +
          comMaterial.slice(0, 4).map(function (u) {
            return '<span class="mono">' + esc(u.codigo) + '</span>';
          }).join(', ') +
          '. Posição com material não sai daqui — tem de ser esvaziada no ' +
          'estoque primeiro.</div>';
        return;
      }
      el.value = q - 1;
      C.niveis.length = q - 1;
      C.atualizar();
    });

    Array.prototype.forEach.call(
      document.querySelectorAll('#cModos [data-modo]'), function (b) {
        b.addEventListener('click', function () {
          C.trocarModo(b.getAttribute('data-modo'));
        });
      });

    C.atualizar();
  };

  C.fechar = function () {
    if (!C.aberto) return;
    C.aberto = false;
    C.projeto = null;
    C.modo = 'operacao';
    C.selo(false);

    /* redesenha o galpão REAL, com os dados que já estavam na mão */
    if (raiz.APP3D) {
      if (C.guardado) raiz.APP3D.locais = C.guardado;
      raiz.APP3D.desenhar();
    }
    C.guardado = null;
  };


  C.alternar = function () { C.aberto ? C.fechar() : C.abrir(); };

  raiz.CONSTRUTOR3D = C;
  if (typeof module !== 'undefined' && module.exports) module.exports = C;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== app.js ===== */
/* ============================================================
   ALMOXA 3D · app.js  ·  08/11/2026
   ------------------------------------------------------------
   A AMARRAÇÃO. Pega o dado pelo adaptador, passa pelo layout,
   entrega ao motor e cuida do painel.

   Nenhuma regra de negócio mora aqui — é só costura. Quem
   decide cor é o layout3d, quem decide permissão é o Core.
   ============================================================ */
(function (raiz) {
  'use strict';

  var APP = {
    versao: '6.9.0',
    montagem: null,
    locais: [],
    carregando: false,
    modoDemo: false
  };

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ----------------------------------------------------------
     O PAINEL
     ---------------------------------------------------------- */
  var ROTULO = {
    /* o cinza da BOLINHA do mapa é claro de propósito, para a
       posição vazia não competir com o material. Mas na ETIQUETA
       do painel ele leva texto branco em cima — e branco sobre
       #9AA3AE é ilegível. Então a etiqueta usa um cinza escuro:
       mesma leitura, contraste de verdade. */
    VAZIA:      { txt: 'Vazia',     cor: '#6B7482' },
    OCUPADA:    { txt: 'Ocupada',   cor: 'var(--verde)' },
    LOTADA:     { txt: 'Lotada',    cor: 'var(--amarelo)' },
    BLOQUEADA:  { txt: 'Bloqueada', cor: 'var(--vermelho)' }
  };

  APP.pintarResumo = function () {
    var r = raiz.LAYOUT3D.resumo(APP.montagem);
    var amb = raiz.API3D ? raiz.API3D.ambiente() : 'NAVEGADOR';
    var nomeAmb = { APPS_SCRIPT: 'Apps Script', GITHUB_PAGES: 'GitHub Pages' }[amb] || 'navegador';

    var html = '';
    if (APP.modoDemo) {
      html += '<div class="aviso"><b>Galpão de demonstração.</b> ' +
        'O endereço do Core não foi configurado, então estou desenhando um ' +
        'galpão de exemplo para você ver o motor funcionando. ' +
        'Nenhum dado seu foi lido.</div>';
    }

    if (APP.erroDeDesenho) {
      html += '<div class="aviso erro"><b>Os números estão certos, o desenho não subiu.</b><br>' +
        esc(APP.erroDeDesenho) + '<br><br>O que está abaixo foi calculado a partir ' +
        'dos endereços lidos; o que falhou foi só a parte 3D.</div>';
    }

    html +=
      '<div class="numeros">' +
        cartao(r.total, 'posições') +
        cartao(r.ocupadas + r.lotadas, 'com material') +
        cartao(r.vazias, 'vazias') +
        cartao(r.bloqueadas, 'bloqueadas') +
      '</div>' +
      '<div class="linha"><span>Ocupação do galpão</span><b>' + r.ocupacaoPct + '%</b></div>' +
      '<div class="barraOcup"><i style="width:' + r.ocupacaoPct + '%"></i></div>' +
      '<div class="linha"><span>Ruas</span><b>' + APP.montagem.contagem.ruas + '</b></div>' +
      '<div class="linha"><span>Estantes</span><b>' + APP.montagem.contagem.estantes + '</b></div>' +
      '<div class="linha"><span>Prateleiras</span><b>' + APP.montagem.contagem.prateleiras + '</b></div>' +
      '<div class="linha"><span>Medidas do galpão</span><b>' +
        APP.montagem.galpao.largura.toFixed(1) + ' × ' +
        APP.montagem.galpao.profundidade.toFixed(1) + ' m</b></div>' +
      '<div class="linha"><span>Ambiente</span><b>' + nomeAmb + '</b></div>' +
      APP.htmlDosAvisos() +
      '<div class="vazio">Clique numa posição do galpão<br>para ver o que está guardado nela.</div>';

    $('corpoPainel').innerHTML = html;
    APP.titulo('O galpão');
  };

  function cartao(n, rot) {
    return '<div class="cartao"><b>' + n + '</b><span>' + rot + '</span></div>';
  }

  /* ============================================================
     [TIPO] 15/11 · TIPO DE ARMAZENAMENTO · seção 2.2
     ------------------------------------------------------------
     O Ismael procurou onde escolher se a posição guarda caixa,
     pallet, tambor — e não achou, porque não existia. A forma
     vinha do campo "objeto" do cadastro, e nenhuma tela escrevia
     nesse campo.

     O QUE EU DESCOBRI ANTES DE PROGRAMAR: o locais.salvar do Core
     dele aceita hoje { rua, estante, prateleira, posicao,
     capacidade }. NÃO existe campo de tipo de armazenamento. Então
     eu mando o campo junto, RELEIO, e digo o que aconteceu de
     verdade — se o Core guardou ou se ignorou. Prometer que salvou
     sem conferir seria o pior tipo de botão.
     ============================================================ */
  APP.TIPOS_ARMAZENAMENTO = [
    ['', '— não informado —'],
    ['caixa plástica preta', 'caixa plástica preta'],
    ['caixa plástica vazada', 'caixa plástica vazada (bin)'],
    ['caixa plástica fechada', 'caixa plástica fechada (com tampa)'],
    ['caixa organizadora', 'caixa organizadora'],
    ['caixa de papelão', 'caixa de papelão'],
    ['caixa metálica', 'caixa metálica'],
    ['pallet de madeira', 'pallet de madeira'],
    ['pallet plástico', 'pallet plástico'],
    ['saco', 'sacaria / big bag'],
    ['tambor', 'tambor / bombona'],
    ['bobina', 'bobina / rolo'],
    ['barra', 'tubos e barras'],
    ['ferramenta', 'ferramenta'],
    ['equipamento', 'equipamento'],
    ['material de construção', 'material de construção']
  ];

  APP.tipoDaPosicao = function (p) {
    var d = (p && p.dado) || {};
    return String(d.objeto || d.embalagem || d.tipoObjeto || '');
  };

  APP.htmlDoTipo = function (p) {
    var atual = APP.tipoDaPosicao(p);
    var opcoes = APP.TIPOS_ARMAZENAMENTO.map(function (t) {
      return '<option value="' + esc(t[0]) + '"' +
        (atual === t[0] ? ' selected' : '') + '>' + esc(t[1]) + '</option>';
    }).join('');
    return '<div class="sep"></div>' +
      '<div class="campo"><label for="pTipo">Tipo de armazenamento</label>' +
      '<select id="pTipo">' + opcoes + '</select></div>' +
      '<div class="small" style="margin:-4px 0 8px;color:var(--texto-3)">' +
      'Muda a forma desenhada no mapa: caixa, pallet, tambor, saco, ' +
      'bobina ou barra.</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn" id="pTipoVer">Ver no mapa</button>' +
        '<button class="btn" id="pTipoGravar">Gravar no cadastro</button>' +
      '</div><div id="pTipoRecado"></div>';
  };

  APP.ligarTipo = function (p) {
    var sel = $('pTipo');
    if (!sel) return;

    var ver = $('pTipoVer');
    if (ver) ver.addEventListener('click', function () {
      /* só o desenho, aqui na tela: nada foi gravado */
      var alvo = (APP.locais || []).filter(function (l) {
        return String(l.codigo) === String(p.codigo);
      })[0];
      if (alvo) alvo.objeto = sel.value;
      if (p.dado) p.dado.objeto = sel.value;

      /* 15/11 — APP.desenhar() repinta o painel inteiro e levava o
         recado junto. Redesenho só a CENA e repinto a POSIÇÃO. */
      APP.montagem = raiz.LAYOUT3D.montar(APP.locais || []);
      try { raiz.MOTOR3D.desenhar(APP.montagem); } catch (e) {}
      var nova = APP.montagem.indice[p.codigo];
      if (nova) APP.pintarPosicao(nova);

      var r = $('pTipoRecado');
      if (r) {
        r.innerHTML = '<div class="aviso" style="margin-top:8px">' +
          '<b>Só no desenho.</b> A forma mudou no mapa desta tela. ' +
          'Nada foi gravado no cadastro — para isso, use Gravar.</div>';
      }
      try { raiz.MOTOR3D.selecionarPorCodigo(p.codigo); } catch (e) {}
    });

    var gravar = $('pTipoGravar');
    if (gravar) gravar.addEventListener('click', function () {
      var recado = $('pTipoRecado');
      if (!raiz.API3D || !raiz.API3D.pronto()) {
        if (recado) recado.innerHTML = '<div class="aviso erro" style="margin-top:8px">' +
          'O mapa não está ligado ao Core. Não dá para gravar.</div>';
        return;
      }
      gravar.disabled = true; gravar.textContent = 'Gravando…';
      var escolhido = sel.value;

      raiz.API3D.chamar('locais', 'salvar', {
        rua: p.rua, estante: p.estante,
        prateleira: p.prateleira, posicao: p.posicao,
        capacidade: p.capacidade,
        objeto: escolhido        /* campo que o Core pode ainda não ter */
      }).then(function (r) {
        if (!r || !r.ok) {
          if (recado) recado.innerHTML = '<div class="aviso erro" style="margin-top:8px">' +
            '<b>O Core recusou.</b><br>' + esc((r && r.mensagem) || 'sem resposta') +
            ((r && r.codigo) ? '<div class="small">código: ' + esc(r.codigo) +
              '</div>' : '') + '</div>';
          gravar.disabled = false; gravar.textContent = 'Gravar no cadastro';
          return;
        }
        /* RELER: o Core pode ter aceitado a chamada e ignorado o campo */
        return raiz.API3D.chamar('locais', 'listar', {}).then(function (r2) {
          gravar.disabled = false; gravar.textContent = 'Gravar no cadastro';
          if (!r2 || !r2.ok) {
            if (recado) recado.innerHTML = '<div class="aviso" style="margin-top:8px">' +
              '<b>Gravei, mas não consegui reler para conferir.</b><br>' +
              esc((r2 && r2.mensagem) || 'sem resposta') +
              '<div class="small" style="margin-top:6px">NÃO considere ' +
              'guardado até conferir.</div></div>';
            return;
          }
          var volta = (r2.dados || []).filter(function (l) {
            return String(l.codigo) === String(p.codigo);
          })[0];
          var guardou = volta && String(volta.objeto || volta.embalagem ||
                                        volta.tipoObjeto || '') === escolhido;
          if (guardou) {
            /* 15/11 — aqui eu chamava APP.desenhar(), que repinta o
               PAINEL inteiro: a mensagem de sucesso ia para um
               elemento já destruído e o Ismael nunca a veria, e a
               tela pulava para "O galpão" sem explicar nada.
               Agora redesenho só a CENA e repinto a POSIÇÃO. */
            APP.locais = r2.dados;
            APP.montagem = raiz.LAYOUT3D.montar(APP.locais);
            try { raiz.MOTOR3D.desenhar(APP.montagem); } catch (e) {}
            var nova = APP.montagem.indice[p.codigo];
            if (nova) APP.pintarPosicao(nova);
            var frescor = $('pTipoRecado');
            if (frescor) frescor.innerHTML = '<div class="aviso" style="margin-top:8px;' +
              'border-color:#BFE3CC;background:#F0FAF4;color:#1E5F3A">' +
              '<b>Guardado no cadastro e conferido na releitura.</b></div>';
            try { raiz.MOTOR3D.selecionarPorCodigo(p.codigo); } catch (e) {}
            return;
          }
          if (recado) recado.innerHTML = '<div class="aviso erro" style="margin-top:8px">' +
            '<b>O Core aceitou a gravação, mas NÃO guardou o tipo.</b><br>' +
            'Reli a posição ' + esc(p.codigo) + ' e o campo voltou vazio. ' +
            'O módulo <b>locais</b> do seu Core grava hoje rua, estante, ' +
            'prateleira, posição e capacidade — não tem campo de tipo de ' +
            'armazenamento.' +
            '<div class="small" style="margin-top:6px">Enquanto esse campo ' +
            'não existir no Core, o tipo vale só nesta tela, pelo botão ' +
            '“Ver no mapa”. Não vou dizer que guardei o que não guardou.</div>' +
            '</div>';
        });
      });
    });
  };

  APP.pintarPosicao = function (p) {
    if (!p) { APP.pintarResumo(); return; }
    var rot = ROTULO[p.situacao] || ROTULO.VAZIA;
    var d = p.dado || {};

    var html =
      '<div class="linha"><span>Endereço</span><b>' + esc(p.codigo || '—') + '</b></div>' +
      '<div class="linha"><span>Situação</span><b><span class="chip" style="background:' +
        rot.cor + '">' + rot.txt + '</span></b></div>' +
      '<div class="linha"><span>Rua</span><b>' + esc(p.rua) + '</b></div>' +
      '<div class="linha"><span>Estante</span><b>' + esc(p.estante) + '</b></div>' +
      '<div class="linha"><span>Prateleira</span><b>' + esc(p.prateleira) + '</b></div>' +
      '<div class="linha"><span>Posição</span><b>' + esc(p.posicao || '(a prateleira inteira)') + '</b></div>' +
      '<div class="linha"><span>Materiais guardados</span><b>' + p.itens + '</b></div>' +
      '<div class="linha"><span>Capacidade</span><b>' +
        (p.capacidade ? p.capacidade : 'não informada') + '</b></div>';

    if (d.observacao) {
      html += '<div class="linha"><span>Observação</span><b>' + esc(d.observacao) + '</b></div>';
    }
    html += '<div class="linha"><span>Chave do QR Code</span><b>ALMOXA:LOC:' +
      esc(p.codigo) + '</b></div>';

    /* [F1] seção 4 pede, para a posição selecionada: divisão, saldo
       atual, última movimentação, último inventário, responsável pela
       última conferência e histórico do endereço.

       Eu mostro TODOS, e cada um que ainda não tem fonte aparece
       escrito como não integrado — que é o que a própria seção 4
       manda: "Não mostrar informações inventadas. Se o dado não
       estiver disponível, informar que não está integrado."
       Preencher esses campos com zero ou com traço seria pior:
       passaria por dado. */
    function semFonte(oQue) {
      return '<span class="semfonte">não integrado' +
             (oQue ? ' · ' + oQue : '') + '</span>';
    }
    html +=
      '<div class="linha"><span>Divisão</span><b>' +
        (d.divisao || d.divisão ? esc(d.divisao || d.divisão) : semFonte('')) + '</b></div>' +
      '<div class="linha"><span>Saldo atual</span><b>' +
        semFonte('estoque') + '</b></div>' +
      '<div class="linha"><span>Última movimentação</span><b>' +
        semFonte('movimentações') + '</b></div>' +
      '<div class="linha"><span>Último inventário</span><b>' +
        semFonte('inventário') + '</b></div>' +
      '<div class="linha"><span>Responsável pela conferência</span><b>' +
        semFonte('fase 4') + '</b></div>' +
      '<div class="linha"><span>Histórico do endereço</span><b>' +
        semFonte('fase 4') + '</b></div>';

    if (p.itens > 0) {
      html += '<div class="vazio">Esta posição tem <b>' + p.itens + '</b> material(is) ' +
        'segundo o cadastro de localizações. A lista do que são, com saldo, vem do ' +
        'módulo de estoque — essa consulta é da fase 4 do plano e ainda não existe. ' +
        'O número acima é do cadastro, não uma contagem física.</div>';
    }

    html += APP.htmlDoTipo(p);

    /* [F3] de dentro da posição, o gestor põe o endereço na rota */
    html += '<div class="sep"></div>' +
      '<button class="btn" id="pRota" style="width:100%">' +
      (APP.rota.codigos.indexOf(p.codigo) > -1
        ? '✓ já está na rota — abrir a rota'
        : '+ pôr na rota') + '</button>';

    $('corpoPainel').innerHTML = html;
    APP.titulo('Posição selecionada');

    APP.ligarTipo(p);

    var bR = $('pRota');
    if (bR) bR.addEventListener('click', function () {
      APP.rotaAdicionar(p.codigo);
      APP.pintarRota();
    });
  };

  /* ----------------------------------------------------------
     CARREGAR
     ---------------------------------------------------------- */
  APP.carregar = function () {
    if (APP.carregando) return Promise.resolve();
    APP.carregando = true;
    $('corpoPainel').innerHTML = '<div class="vazio">Consultando o Core…</div>';

    var api = raiz.API3D;
    var pedido;

    APP.conexao('verificando', 'verificando…', 'consultando o Core');

    if (api && api.pronto()) {
      APP.modoDemo = false;
      pedido = api.localizacoes();
    } else {
      /* sem Core configurado: desenho um galpão de exemplo em vez de
         deixar a tela preta. E DIGO que é exemplo, no painel. */
      APP.modoDemo = true;
      pedido = Promise.resolve({ ok: true, dados: APP.galpaoDeDemonstracao() });
    }

    return pedido.then(function (r) {
      APP.carregando = false;
      if (!r || !r.ok) {
        /* Quando a recusa é de CHAVE, dizer de onde a chave veio
           — ou que não veio nenhuma — poupa uma ida e volta.
           O valor da chave nunca aparece: só a procedência. */
        var bruta = (r && r.mensagem) || 'o Core não respondeu';
        var msg = esc(bruta);
        var deIdentidade = /chave|sess(ã|a)o|token|permiss|autentic|perfil|login/i.test(bruta);
        var extra = '';
        if (deIdentidade && window.API3D) {
          var e3 = window.API3D.estado();
          extra = '<div class="small" style="margin-top:8px">' +
            (e3.porSistema
              ? 'O mapa falou pela porta do próprio ALMOX PRO (' +
                esc(e3.origemDaPorta) + '), com a sessão que o sistema está ' +
                'usando agora. Se o sistema entra e isto não, quem recusou foi ' +
                'o Core — e o motivo é o texto acima, não o mapa.'
              : '<b>O mapa não está falando pela porta do sistema.</b> ' +
                'Sozinho ele não tem sessão, e sessão não se copia nem se ' +
                'inventa. Abra pelo botão <b>Mapeamento 3D</b> de dentro do ' +
                'ALMOX PRO, já identificado — é de lá que ele herda a entrada.') +
            '</div>';
        }
        /* [15/11] "Failed to fetch" é recado de navegador, não de
           almoxarifado. Quando o mapa é aberto do celular, pelo
           ALMOXA CAMPO, o endereço do Core veio em ?core= — e a
           falha quase sempre é uma destas três. Digo quais são,
           em vez de repassar o erro cru e deixar ele adivinhando. */
        var semRede = /failed to fetch|networkerror|load failed|não respondeu/i.test(bruta);
        if (semRede) {
          var veioDaUrl = '';
          try {
            veioDaUrl = new URLSearchParams(location.search).get('core') || '';
          } catch (eU) { veioDaUrl = ''; }
          extra += '<div class="small" style="margin-top:8px">' +
            '<b>O navegador nem chegou a falar com o servidor.</b> ' +
            'Isso costuma ser uma destas três coisas:' +
            '<br>1. o aparelho está sem internet;' +
            '<br>2. o endereço /exec está errado ou foi trocado;' +
            '<br>3. a implantação não está publicada como ' +
            '<b>Qualquer pessoa</b>, e aí o Google pede login e o mapa ' +
            'não tem como responder.' +
            (veioDaUrl
              ? '<br><br>O endereço que chegou aqui foi:<br><span class="mono">' +
                esc(veioDaUrl) + '</span>'
              : '') +
            '</div>';
        }
        $('corpoPainel').innerHTML = '<div class="aviso erro"><b>Não consegui carregar.</b><br>' +
          msg + extra + '</div>';
        APP.conexao('caido', 'Core recusou', bruta);
        return;
      }
      APP.locais = r.dados || [];

      /* [F1] só agora o indicador pode dizer "ligado": houve leitura
         e ela voltou. Antes disso ele fica em "verificando". */
      if (APP.modoDemo) {
        APP.conexao('demo', 'demonstração',
          'O endereço do Core não foi configurado: o galpão desenhado é de exemplo.');
      } else {
        APP.conexao('ligado', APP.locais.length + ' endereços',
          'O Core respondeu com ' + APP.locais.length + ' endereço(s).');
      }

      APP.desenhar();
    });
  };

  APP.desenhar = function () {
    APP.montagem = raiz.LAYOUT3D.montar(APP.locais);
    /* confere ANTES de desenhar: o que o mapa não consegue mostrar
       é justamente o que precisa aparecer escrito. */
    APP.conferencia = raiz.LAYOUT3D.conferir(APP.locais);
    /* [F2] 14/11 — o desenho pode falhar sem derrubar o resto.
       A conta, a conferência e o painel não dependem de placa de
       vídeo. A falha NÃO é engolida: fica guardada em
       APP.erroDeDesenho e escrita no painel. */
    APP.erroDeDesenho = '';
    try {
      raiz.MOTOR3D.desenhar(APP.montagem);
    } catch (e) {
      APP.erroDeDesenho = String((e && e.message) || e);
    }
    APP.pintarResumo();
    /* [F3] a planta de cima vem da mesma montagem do 3D: os dois
       não têm como discordar */
    var mm = $('minimapa');
    if (mm && !mm.hidden) APP.pintarMinimapa(APP.rotaCalculada());
  };

  /* ------------------------------------------------------------
     OS AVISOS · mostrar, nunca consertar

     Regra dele, e a certa: "Não tente corrigir dados históricos
     automaticamente." Então aqui não há botão de arrumar. Há o
     que está torto, onde está, e o que conferir no almoxarifado.
     ------------------------------------------------------------ */
  var NOME_AVISO = {
    SUMIU:       'não aparece no mapa',
    REPETIDO:    'código repetido',
    SEM_CODIGO:  'sem código',
    DESALINHADO: 'código não bate',
    DOIS_NIVEIS: 'dois níveis de endereço'
  };

  APP.htmlDosAvisos = function () {
    var c = APP.conferencia;
    if (!c || !c.quantos) return '';

    var linhas = c.avisos.slice(0, 12).map(function (a) {
      return '<div class="linha" style="display:block;padding:6px 0">' +
        '<b>' + esc(a.titulo) + '</b>' +
        '<div class="small" style="color:var(--texto-2);line-height:1.5">' +
          esc(a.detalhe) + '</div>' +
      '</div>';
    }).join('');

    var sobra = c.quantos - Math.min(c.quantos, 12);

    return '<div class="aviso" style="margin-top:14px">' +
      '<b>' + c.quantos + ' ' +
        (c.quantos === 1 ? 'coisa para conferir' : 'coisas para conferir') +
        ' no cadastro</b>' +
      linhas +
      (sobra ? '<div class="small">… e mais ' + sobra + '.</div>' : '') +
      '<div class="small" style="margin-top:10px;color:var(--texto-2);line-height:1.5">' +
        'Nada foi alterado. O mapa só enxerga o que o Core devolveu — ' +
        'a varredura completa da ocupação é no servidor, pelo ' +
        '<b>ENDERECO_CONFERIR</b>.' +
      '</div>' +
    '</div>';
  };

  /* um galpão pequeno, só para o motor ter o que mostrar */
  APP.galpaoDeDemonstracao = function () {
    var fora = [], ruas = ['A', 'B', 'C'];
    for (var r = 0; r < ruas.length; r++) {
      for (var e = 1; e <= 2; e++) {
        for (var p = 1; p <= 4; p++) {
          for (var o = 0; o < 6; o++) {
            var itens = (r * 7 + e * 3 + p * 2 + o) % 5;
            var cap = 4;
            var st = (r === 2 && p === 1 && o < 2) ? 'BLOQUEADA' : 'DISPONIVEL';
            var est = ruas[r] + '0' + e;
            var pos = String.fromCharCode(65 + o);
            fora.push({
              id: 'DEMO' + r + e + p + o,
              rua: ruas[r], estante: est, prateleira: String(p), posicao: pos,
              codigo: [ruas[r], est, String(p), pos].join('-'),
              capacidade: cap, itens: itens > cap ? cap : itens,
              ocupacao: itens, status: st
            });
          }
        }
      }
    }
    return fora;
  };

  /* ----------------------------------------------------------
     LIGAR TUDO
     ---------------------------------------------------------- */
  /* ============================================================
     [F3] FASE 3 · 14/11 · MAPA OPERACIONAL · seção 6
     ------------------------------------------------------------
     O gestor escolhe endereços no galpão e monta uma sequência de
     trabalho. Nesta primeira versão a ordem é dele — a otimização
     automática a própria seção 6 deixa para depois.

     ONDE A ROTA MORA, e isto precisa estar claro: na MEMÓRIA desta
     página, enquanto ela está aberta. O Core não tem serviço de
     rota nem de atividade — eu procurei, e os módulos que existem
     são locais, inventario, estoque, patrimonio, ferramentaria,
     ocorrencias e transferencias. Inventar endpoint é proibido
     pela regra 2, item 10. Então a rota não é gravada, e a tela
     diz isso em vez de deixar o gestor pensar que ficou salva.
     Gravar rota é fase 4, junto com as atividades.
     ============================================================ */

  APP.rota = { codigos: [], estados: {}, ocorrencias: {},
               tipo: 'separacao', responsavel: '',
               responsavelId: '', responsavelMatricula: '' };

  APP.TIPOS_ROTA = [
    ['separacao',   'Separação de materiais'],
    ['inventario',  'Inventário'],
    ['conferencia', 'Conferência'],
    ['recebimento', 'Recebimento'],
    ['auditoria',   'Auditoria'],
    ['inspecao',    'Inspeção da ferramentaria']
  ];

  /* ============================================================
     [COLAB] 15/11 · O RESPONSÁVEL VEM DO CADASTRO
     ------------------------------------------------------------
     "Não utilizar campo de texto livre como identificação oficial
     do responsável. Integrar com o cadastro de usuários e
     funcionários já existente. Não duplicar cadastros."

     O módulo "usuarios" já existe no Core do Ismael — o sistema o
     chama em 63 lugares. Então eu LEIO dele. Não crio cadastro,
     não peço foto de novo, não invento endpoint.

     Se o Core recusar a leitura, a tela diz isso e cai para texto
     livre AVISANDO que aquilo não é identificação oficial. Falha
     de leitura não é prova de que não há cadastro.
     ============================================================ */
  APP.colaboradores = { lista: null, erro: null, lendo: false };

  APP.carregarColaboradores = function () {
    if (APP.colaboradores.lista || APP.colaboradores.lendo) {
      return Promise.resolve(APP.colaboradores);
    }
    if (!raiz.API3D || !raiz.API3D.pronto()) {
      APP.colaboradores.erro = { mensagem: 'o mapa não está ligado ao Core' };
      return Promise.resolve(APP.colaboradores);
    }
    APP.colaboradores.lendo = true;
    return raiz.API3D.chamar('usuarios', 'listar', {}).then(function (r) {
      APP.colaboradores.lendo = false;
      if (!r || !r.ok) {
        APP.colaboradores.erro = r || { mensagem: 'sem resposta' };
        APP.colaboradores.lista = null;
        return APP.colaboradores;
      }
      var crus = r.dados || [];
      /* os campos são os que o próprio ALMOX PRO lê desses registros:
         nome, matricula, cargo, setor. Não invento nenhum. */
      APP.colaboradores.lista = crus.map(function (u) {
        return {
          id: String(u.id || u.matricula || u.usuario || u.email || ''),
          nome: String(u.nome || u.usuario || '').trim(),
          matricula: String(u.matricula || '').trim(),
          cargo: String(u.cargo || '').trim(),
          setor: String(u.setor || '').trim(),
          situacao: String(u.situacao || u.status || '').trim()
        };
      }).filter(function (u) { return !!u.nome; });
      APP.colaboradores.erro = null;
      return APP.colaboradores;
    });
  };

  APP.htmlDoResponsavel = function () {
    var c = APP.colaboradores;

    if (c.lista && c.lista.length) {
      var opcoes = ['<option value="">— escolha o responsável —</option>'];
      for (var i = 0; i < c.lista.length; i++) {
        var u = c.lista[i];
        var rotulo = u.nome + (u.matricula ? ' · ' + u.matricula : '') +
                     (u.cargo ? ' · ' + u.cargo : '');
        opcoes.push('<option value="' + esc(u.id) + '"' +
          (APP.rota.responsavelId === u.id ? ' selected' : '') + '>' +
          esc(rotulo) + '</option>');
      }
      return '<div class="campo"><label for="rResp">Responsável</label>' +
        '<select id="rResp">' + opcoes.join('') + '</select></div>' +
        '<div class="small" style="margin:-4px 0 10px;color:var(--texto-3)">' +
        c.lista.length + ' colaborador(es) lidos do cadastro do ALMOX PRO. ' +
        'Nenhum cadastro foi duplicado aqui.</div>';
    }

    if (c.erro) {
      return '<div class="aviso erro"><b>Não consegui ler o cadastro de ' +
        'colaboradores.</b><br>' + esc(c.erro.mensagem || 'sem resposta') +
        '<div class="small" style="margin-top:6px">Isto NÃO quer dizer que ' +
        'não há colaboradores: quer dizer que não consegui ler. Enquanto ' +
        'isso o campo abaixo é texto livre — e texto livre <b>não é ' +
        'identificação oficial</b>.</div></div>' +
        '<div class="campo"><label for="rRespLivre">Responsável (texto livre)</label>' +
        '<input id="rRespLivre" type="text" autocomplete="off" ' +
        'value="' + esc(APP.rota.responsavel) + '"></div>';
    }

    return '<div class="campo"><label>Responsável</label>' +
      '<div class="small" style="color:var(--texto-3)">lendo o cadastro…</div></div>';
  };

  APP.rotaCalculada = function () {
    if (!APP.montagem) return null;
    return raiz.LAYOUT3D.rota(APP.montagem, APP.rota.codigos,
                              { estados: APP.rota.estados });
  };

  APP.redesenharRota = function () {
    var r = APP.rotaCalculada();
    try {
      if (r && r.ok) raiz.MOTOR3D.desenharRota(r);
      else raiz.MOTOR3D.limparRota();
    } catch (e) { APP.erroDeDesenho = String((e && e.message) || e); }
    APP.pintarMinimapa(r);
    return r;
  };

  APP.rotaAdicionar = function (codigo) {
    var c = String(codigo || '').trim();
    if (!c) return;
    if (APP.rota.codigos.indexOf(c) > -1) return;   /* não repete ponto */
    APP.rota.codigos.push(c);
    if (APP.modoRota) APP.pintarRota();
    else APP.redesenharRota();
  };

  APP.rotaRemover = function (i) {
    APP.rota.codigos.splice(i, 1);
    APP.pintarRota();
  };

  APP.rotaMover = function (i, passo) {
    var j = i + passo;
    if (j < 0 || j >= APP.rota.codigos.length) return;
    var t = APP.rota.codigos[i];
    APP.rota.codigos[i] = APP.rota.codigos[j];
    APP.rota.codigos[j] = t;
    APP.pintarRota();
  };

  APP.rotaLimpar = function () {
    APP.rota.codigos = [];
    APP.rota.estados = {};
    APP.rota.ocorrencias = {};
    APP.pintarRota();
  };

  /* ------------------------------------------------------------
     O PAINEL DA ROTA
     ------------------------------------------------------------ */
  APP.pintarRota = function () {
    APP.modoRota = true;
    APP.titulo('Rota de trabalho');
    /* busca o cadastro de colaboradores na primeira vez e repinta */
    if (!APP.colaboradores.lista && !APP.colaboradores.erro &&
        !APP.colaboradores.lendo) {
      APP.carregarColaboradores().then(function () {
        if (APP.modoRota) APP.pintarRota();
      });
    }

    var r = APP.redesenharRota();
    var h = '';

    /* [15/11] ESTE RECADO ESTAVA VENCIDO, e foi ele que confundiu.
       Dizia "o Core ainda não tem serviço de rota nem de atividade" —
       verdade quando foi escrito, mentira depois que o motor de rotas
       entrou no AP_INVENTARIO.gs. Ele olhou os dois botões e não
       soube qual era o certo, com razão: um deles mentia.

       Agora os dois dizem o que são, e um aponta para o outro. */
    h += '<div class="aviso azul" style="margin:0 0 12px">' +
      '<b>Isto é um caminho para VOCÊ seguir agora.</b> ' +
      'Ele vive nesta tela: serve para montar a ordem de uma separação e ' +
      'enxergar o trajeto no galpão. Fechar a página perde a sequência, e ' +
      'ele NÃO vai para o celular de ninguém.' +
      '<div class="small" style="margin-top:6px">Para <b>distribuir trabalho ' +
      'a uma pessoa</b> — escolher ruas, estantes e níveis, pôr um ' +
      'responsável e publicar no servidor — use <b>Frente de serviço</b>. ' +
      'O que sai de lá aparece em <b>Minhas atividades</b> no ALMOXA CAMPO.' +
      '</div></div>';

    h += '<div class="campo"><label for="rTipo">Tipo da rota</label>' +
      '<select id="rTipo">' +
      APP.TIPOS_ROTA.map(function (t) {
        return '<option value="' + t[0] + '"' +
          (APP.rota.tipo === t[0] ? ' selected' : '') + '>' + esc(t[1]) + '</option>';
      }).join('') +
      '</select></div>';

    h += APP.htmlDoResponsavel();

    h += '<div class="sep"></div>';

    if (!APP.rota.codigos.length) {
      h += '<div class="vazio">Nenhum endereço na rota.<br>' +
        'Clique numa posição do galpão e use <b>+ pôr na rota</b>, ' +
        'ou procure pelo campo de busca.</div>';
    } else {
      if (r && r.naoAchados.length) {
        h += '<div class="aviso erro"><b>Fora do galpão desenhado:</b> ' +
          r.naoAchados.map(esc).join(', ') +
          '. Esses não entram na sequência — e eu não apago da sua lista ' +
          'sem o senhor mandar.</div>';
      }
      if (r && r.ok) {
        h += '<div class="linha"><span>Pontos</span><b>' + r.pontos.length + '</b></div>' +
          '<div class="linha"><span>Caminho pelos corredores</span><b>' +
          String(r.distancia).replace('.', ',') + ' m</b></div>' +
          '<div class="linha"><span>Concluídos</span><b>' +
          r.pontos.filter(function (p) { return p.estado === 'CONCLUIDO'; }).length +
          ' de ' + r.pontos.length + '</b></div>';
      }

      h += '<div style="margin-top:10px">';
      for (var i = 0; i < APP.rota.codigos.length; i++) {
        var cod = APP.rota.codigos[i];
        var pt = r && r.pontos.filter(function (x) { return x.codigo === cod; })[0];
        var est = (APP.rota.estados[cod] || (i === 0 ? 'ATUAL' : 'PENDENTE')).toUpperCase();
        var info = raiz.LAYOUT3D.ESTADOS_ROTA[est] || raiz.LAYOUT3D.ESTADOS_ROTA.PENDENTE;
        var oc = APP.rota.ocorrencias[cod];

        h += '<div class="pontoRota" data-cod="' + esc(cod) + '">' +
          '<div class="pr-topo">' +
            '<span class="pr-num" style="background:' + info.cor + '">' +
              (pt ? pt.ordem : '—') + '</span>' +
            '<b class="mono">' + esc(cod) + '</b>' +
            '<span class="pr-acoes">' +
              '<button class="btn" data-sobe="' + i + '" title="Subir">↑</button>' +
              '<button class="btn" data-desce="' + i + '" title="Descer">↓</button>' +
              '<button class="btn" data-tira="' + i + '" title="Tirar da rota">×</button>' +
            '</span>' +
          '</div>' +
          '<div class="pr-linha">' +
            '<select data-estado="' + esc(cod) + '">' +
              ['ATUAL', 'CONCLUIDO', 'PENDENTE', 'DIVERGENCIA', 'SEMATIVIDADE']
                .map(function (e) {
                  return '<option value="' + e + '"' + (est === e ? ' selected' : '') +
                    '>' + esc(raiz.LAYOUT3D.ESTADOS_ROTA[e].texto) + '</option>';
                }).join('') +
            '</select>' +
            '<button class="btn" data-ocorre="' + esc(cod) + '">' +
              (oc ? 'ver ocorrência' : '+ ocorrência') + '</button>' +
          '</div>' +
          (oc ? APP.cartaoOcorrencia(cod, oc) : '') +
        '</div>';
      }
      h += '</div>';

      h += '<div class="sep"></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn" id="rOtimizar">Otimizar sequência</button>' +
          '<button class="btn" id="rLimpar">Limpar a rota</button>' +
          '<button class="btn" id="rSair">Voltar ao galpão</button>' +
        '</div>';
    }

    if (!APP.rota.codigos.length) {
      h += '<div class="sep"></div><button class="btn" id="rSair">Voltar ao galpão</button>';
    }

    $('corpoPainel').innerHTML = h;
    APP.ligarPainelDaRota();
  };

  /* ------------------------------------------------------------
     [F3] CARTÃO DE OCORRÊNCIA · seção 11
     ------------------------------------------------------------ */
  APP.TIPOS_OCORRENCIA = ['Material danificado', 'Endereço sem etiqueta',
    'Material em endereço errado', 'Posição bloqueada', 'Divergência de quantidade',
    'Outro'];

  APP.cartaoOcorrencia = function (codigo, oc) {
    return '<div class="cartaoOc">' +
      '<div class="oc-tit">⚠ ' + esc(oc.tipo || 'Ocorrência') + '</div>' +
      '<div class="linha"><span>Endereço</span><b class="mono">' + esc(codigo) + '</b></div>' +
      '<div class="linha"><span>Quem registrou</span><b>' +
        esc(oc.quem || APP.rota.responsavel || 'não informado') + '</b></div>' +
      '<div class="linha"><span>Quando</span><b>' + esc(oc.quando || '') + '</b></div>' +
      (oc.observacao ? '<div class="linha"><span>Observação</span><b>' +
        esc(oc.observacao) + '</b></div>' : '') +
      '<div class="small" style="margin-top:6px;color:var(--texto-3)">' +
        'Registrada nesta tela. Enviar ao módulo de ocorrências do Core ' +
        'depende do serviço de atividade — fase 4.</div>' +
      '<div style="margin-top:8px"><button class="btn" data-tiraOc="' + esc(codigo) + '">' +
        'Tirar a ocorrência</button></div>' +
    '</div>';
  };

  APP.abrirOcorrencia = function (codigo) {
    var alvo = document.querySelector('.pontoRota[data-cod="' + codigo + '"]');
    if (!alvo) return;
    if (alvo.querySelector('.formOc')) return;
    var form = document.createElement('div');
    form.className = 'formOc';
    form.innerHTML =
      '<div class="campo"><label>Tipo</label><select data-oc-tipo>' +
        APP.TIPOS_OCORRENCIA.map(function (t) {
          return '<option>' + esc(t) + '</option>';
        }).join('') + '</select></div>' +
      '<div class="campo"><label>Observação</label>' +
        '<input type="text" data-oc-obs placeholder="o que o senhor viu"></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn" data-oc-salva>Registrar</button>' +
        '<button class="btn" data-oc-cancela>Cancelar</button></div>';
    alvo.appendChild(form);

    form.querySelector('[data-oc-cancela]').addEventListener('click', function () {
      form.remove();
    });
    form.querySelector('[data-oc-salva]').addEventListener('click', function () {
      var agora = new Date();
      APP.rota.ocorrencias[codigo] = {
        tipo: form.querySelector('[data-oc-tipo]').value,
        observacao: form.querySelector('[data-oc-obs]').value,
        quem: APP.rota.responsavel,
        quando: agora.toLocaleString('pt-BR')
      };
      /* ocorrência marca o ponto em vermelho — seção 6 */
      APP.rota.estados[codigo] = 'DIVERGENCIA';
      APP.pintarRota();
    });
  };

  APP.ligarPainelDaRota = function () {
    var cx = $('corpoPainel');
    if (!cx) return;

    var tipo = $('rTipo');
    if (tipo) tipo.addEventListener('change', function () {
      APP.rota.tipo = tipo.value;
    });
    var resp = $('rResp');
    if (resp) resp.addEventListener('change', function () {
      var u = (APP.colaboradores.lista || []).filter(function (x) {
        return x.id === resp.value;
      })[0];
      APP.rota.responsavelId = resp.value;
      APP.rota.responsavel = u ? u.nome : '';
      APP.rota.responsavelMatricula = u ? u.matricula : '';
    });

    var respLivre = $('rRespLivre');
    if (respLivre) respLivre.addEventListener('input', function () {
      APP.rota.responsavel = respLivre.value;
      APP.rota.responsavelId = '';        /* texto livre não tem id oficial */
    });

    Array.prototype.forEach.call(cx.querySelectorAll('[data-sobe]'), function (b) {
      b.addEventListener('click', function () {
        APP.rotaMover(Number(b.getAttribute('data-sobe')), -1);
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('[data-desce]'), function (b) {
      b.addEventListener('click', function () {
        APP.rotaMover(Number(b.getAttribute('data-desce')), 1);
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('[data-tira]'), function (b) {
      b.addEventListener('click', function () {
        APP.rotaRemover(Number(b.getAttribute('data-tira')));
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('[data-estado]'), function (sel) {
      sel.addEventListener('change', function () {
        APP.rota.estados[sel.getAttribute('data-estado')] = sel.value;
        APP.pintarRota();
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('[data-ocorre]'), function (b) {
      b.addEventListener('click', function () {
        APP.abrirOcorrencia(b.getAttribute('data-ocorre'));
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('[data-tiraOc]'), function (b) {
      b.addEventListener('click', function () {
        var c = b.getAttribute('data-tiraOc');
        delete APP.rota.ocorrencias[c];
        if (APP.rota.estados[c] === 'DIVERGENCIA') APP.rota.estados[c] = 'PENDENTE';
        APP.pintarRota();
      });
    });
    Array.prototype.forEach.call(cx.querySelectorAll('.pontoRota .mono'), function (el) {
      el.addEventListener('click', function () {
        var c = el.parentNode.parentNode.getAttribute('data-cod');
        try { raiz.MOTOR3D.selecionarPorCodigo(c); } catch (e) {}
      });
    });

    /* [F6] seção 6, segunda parte: a otimização automática */
    var otm = $('rOtimizar');
    if (otm) otm.addEventListener('click', function () {
      var o = raiz.LAYOUT3D.otimizarRota(APP.montagem, APP.rota.codigos);
      APP.rota.codigos = o.ordem.slice();
      APP.pintarRota();
      var cx = $('corpoPainel');
      if (!cx) return;
      cx.insertAdjacentHTML('afterbegin', o.melhorou
        ? '<div class="aviso" style="border-color:#BFE3CC;background:#F0FAF4;' +
          'color:#1E5F3A"><b>Sequência reordenada.</b> O caminho caiu de ' +
          String(o.distanciaAntes).replace('.', ',') + ' m para ' +
          String(o.distanciaDepois).replace('.', ',') + ' m — ' +
          String(o.economia).replace('.', ',') + ' m a menos, pelos corredores.</div>'
        : '<div class="aviso"><b>Não mexi na sua ordem.</b> ' +
          esc(o.erros.join(' · ') || 'a conta não encontrou caminho melhor') +
          '</div>');
    });

    var limpar = $('rLimpar');
    if (limpar) limpar.addEventListener('click', function () { APP.rotaLimpar(); });
    var sair = $('rSair');
    if (sair) sair.addEventListener('click', function () {
      APP.modoRota = false;
      APP.pintarResumo();
    });
  };

  /* ------------------------------------------------------------
     [F3] MINIMAPA 2D · seção 11
     Planta de cima, em SVG. Desenhado da mesma conta do 3D, então
     os dois nunca discordam. Clicar sincroniza com a cena.
     ------------------------------------------------------------ */
  APP.pintarMinimapa = function (rota) {
    var caixa = $('minimapa');
    if (!caixa) return;
    if (!APP.montagem) { caixa.innerHTML = ''; return; }

    var pl = raiz.LAYOUT3D.planta(APP.montagem);
    if (!pl.ok) {
      caixa.innerHTML = '<div class="mini-vazio">sem galpão</div>';
      return;
    }

    var L = pl.largura, P = pl.profundidade;
    var sv = '<svg viewBox="0 0 ' + L.toFixed(2) + ' ' + P.toFixed(2) + '" ' +
      'preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="Planta do galpão vista de cima">';

    sv += '<rect x="0" y="0" width="' + L + '" height="' + P + '" fill="#F4F6F8"/>';

    for (var e = 0; e < pl.estantes.length; e++) {
      var es = pl.estantes[e];
      sv += '<rect x="' + es.x.toFixed(2) + '" y="' + es.z.toFixed(2) +
        '" width="' + es.lx.toFixed(2) + '" height="' + es.lz.toFixed(2) +
        '" fill="#C9CDD3" opacity=".55"/>';
    }

    for (var i = 0; i < pl.posicoes.length; i++) {
      var po = pl.posicoes[i];
      sv += '<circle data-cod="' + esc(po.codigo) + '" cx="' + po.x.toFixed(2) +
        '" cy="' + po.z.toFixed(2) + '" r="0.18" fill="' + po.cor + '"/>';
    }

    if (rota && rota.ok && rota.caminho.length > 1) {
      sv += '<polyline points="' +
        rota.caminho.map(function (c) {
          return c.x.toFixed(2) + ',' + c.z.toFixed(2);
        }).join(' ') +
        '" fill="none" stroke="#2F7BE8" stroke-width="0.14" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>';
      for (var k = 0; k < rota.pontos.length; k++) {
        var pt = rota.pontos[k];
        sv += '<circle cx="' + pt.acesso.x.toFixed(2) + '" cy="' +
          pt.acesso.z.toFixed(2) + '" r="0.34" fill="' + pt.cor +
          '" stroke="#fff" stroke-width="0.08"/>';
        sv += '<text x="' + pt.acesso.x.toFixed(2) + '" y="' +
          (pt.acesso.z + 0.16).toFixed(2) + '" font-size="0.42" fill="#fff" ' +
          'text-anchor="middle" font-weight="700">' + pt.ordem + '</text>';
      }
    }

    sv += '</svg>';
    caixa.innerHTML = sv;

    Array.prototype.forEach.call(caixa.querySelectorAll('[data-cod]'), function (c) {
      c.addEventListener('click', function () {
        try { raiz.MOTOR3D.selecionarPorCodigo(c.getAttribute('data-cod')); } catch (e) {}
      });
    });
  };

  /* ============================================================
     [F4] FASE 4 · 14/11 · INVENTÁRIO MÓVEL POR ENDEREÇO
     ------------------------------------------------------------
     Seções 7, 8 e 9. Esta tela NÃO decide nada: ela pergunta ao
     módulo invmovel do Core (AP_INVENTARIO.gs) e mostra a
     resposta. Quem valida o QR, quem compara saldo e quem
     confirma é o Core — seção 12: "Não confiar em informações de
     usuário ou permissões enviadas apenas pelo navegador" e
     "Nunca mostrar uma operação como concluída oficialmente antes
     da confirmação do Core".

     O MÓDULO CHAMA-SE invmovel, não inventario. O "inventario" já
     existe no Core dele e cinco telas dependem dele.

     SOBRE O LEITOR DE QR: uso o BarcodeDetector do próprio
     navegador quando ele existe (Chrome e a maioria dos
     coletores). Quando não existe, aparece o campo para digitar o
     código. Não simulo leitura, não finjo leitor conectado e não
     carrego biblioteca de fora.
     ============================================================ */

  APP.inv = { atividade: null, posicaoAtual: '', ultimoQr: '',
              operacaoId: '', lendo: false, leitor: null };

  /* [F4+] 15/11 — o Ismael decidiu NÃO instalar o AP_INVENTARIO.gs.

     Sem esse arquivo no Core, o módulo "invmovel" não existe, e o
     roteador responde com um código cru de módulo desconhecido. Isso
     na tela parece defeito, e não é: é uma peça que ele escolheu não
     colocar. Então eu reconheço essa resposta e digo o que ela é, em
     português — sem fingir que funciona e sem parecer quebrado.

     Nada mais do mapa depende disto: galpão, construtor, rota,
     ferramentaria, calor, indicadores de ocupação e relatório
     continuam inteiros. */
  APP.SEM_MODULO = { MODULO_DESCONHECIDO: 1, MODULO_NAO_ENCONTRADO: 1,
                     ACAO_DESCONHECIDA: 1, MODULO_INEXISTENTE: 1 };

  APP.ehModuloAusente = function (r) {
    if (!r || r.ok) return false;
    if (APP.SEM_MODULO[r.codigo]) return true;
    return /m(ó|o)dulo .*(desconhecid|n(ã|a)o existe|n(ã|a)o encontrad)/i
      .test(String(r.mensagem || ''));
  };

  APP.avisoSemInventario = function () {
    return '<div class="aviso"><b>O inventário móvel não está instalado no Core.</b>' +
      '<br>Ele precisa do arquivo <b>AP_INVENTARIO.gs</b> no Apps Script, e o ' +
      'senhor decidiu não instalar. Então esta parte fica parada — não é ' +
      'defeito, é peça que não foi colocada.' +
      '<div class="small" style="margin-top:8px">O resto do mapa não depende ' +
      'disto: galpão, construtor de estantes, rota, ferramentaria, mapa de ' +
      'calor e relatório continuam funcionando.</div></div>';
  };

  APP.invChamar = function (acao, payload) {
    if (!raiz.API3D || !raiz.API3D.pronto()) {
      return Promise.resolve({ ok: false, codigo: 'SEM_CORE',
        mensagem: 'O mapa não está ligado ao Core. Abra pelo botão Mapeamento 3D ' +
                  'de dentro do ALMOX PRO, já identificado.' });
    }
    return raiz.API3D.chamar('invmovel', acao, payload || {}).then(function (r) {
      if (APP.ehModuloAusente(r)) {
        r.__semModulo = true;
      }
      return r;
    });
  };

  /* um id de operação por conferência, para a mesma contagem mandada
     duas vezes não virar duas linhas (seção 12, idempotência) */
  APP.novaOperacao = function () {
    var d = new Date();
    APP.inv.operacaoId = 'OP-' + d.getTime() + '-' +
      Math.floor(Math.random() * 10000);
    return APP.inv.operacaoId;
  };

  APP.invErro = function (r, oQue) {
    return '<div class="aviso erro"><b>Não consegui ' + esc(oQue) + '.</b><br>' +
      esc((r && r.mensagem) || 'o Core não respondeu') +
      ((r && r.codigo) ? '<div class="small" style="margin-top:6px">código: ' +
        esc(r.codigo) + '</div>' : '') + '</div>';
  };

  /* ------------------------------------------------------------
     ETAPA 2 · as atividades do funcionário
     ------------------------------------------------------------ */
  /* ============================================================
     [RAST] 15/11 · RASTREIO POR COLABORADOR · seção 8
     ------------------------------------------------------------
     "Para quando a pessoa quiser saber onde ele tá, o que ele tá
     fazendo, conseguir visualizar rastreio."

     O que esta tela mostra, e é importante ser exato:

       · ONDE ELE ESTEVE — cada endereço que ele conferiu, com a
         hora. Isso é registro de operação, e existe.
       · O QUE ELE FEZ — contagens, divergências, atividades.
       · QUANDO — a linha do tempo, evento por evento.

     O que ela NÃO mostra, e eu não vou fingir que mostra: onde a
     pessoa está AGORA. Isso seria GPS, e GPS exige o aplicativo no
     celular dela, autorização dela e um serviço que guarde a
     posição. Nada disso existe hoje. O último endereço lido é o
     mais perto disso que o sistema sabe de verdade — e é assim
     que a tela chama: "última posição conferida", não
     "localização atual".
     ============================================================ */
  APP.rastreio = { quem: '', painel: null, eventos: null, erro: null };

  APP.pintarRastreio = function () {
    APP.modoRastreio = true;
    APP.titulo('Rastreio');

    if (!APP.colaboradores.lista && !APP.colaboradores.erro &&
        !APP.colaboradores.lendo) {
      $('corpoPainel').innerHTML = '<div class="vazio">Lendo o cadastro…</div>';
      APP.carregarColaboradores().then(function () {
        if (APP.modoRastreio) APP.pintarRastreio();
      });
      return;
    }

    var h = '';
    var c = APP.colaboradores;

    if (c.lista && c.lista.length) {
      h += '<div class="campo"><label for="rsQuem">Colaborador</label>' +
        '<select id="rsQuem"><option value="">— escolha —</option>' +
        c.lista.map(function (u) {
          return '<option value="' + esc(u.nome) + '"' +
            (APP.rastreio.quem === u.nome ? ' selected' : '') + '>' +
            esc(u.nome + (u.matricula ? ' · ' + u.matricula : '')) + '</option>';
        }).join('') + '</select></div>';
    } else {
      h += '<div class="aviso erro"><b>Não consegui ler o cadastro.</b><br>' +
        esc((c.erro && c.erro.mensagem) || 'sem resposta') +
        '<div class="small" style="margin-top:6px">Sem o cadastro eu não ' +
        'tenho a lista de quem rastrear.</div></div>';
    }

    h += '<div id="rsCorpo"></div>' +
      '<div class="sep"></div><button class="btn" id="rsSair">Voltar ao galpão</button>';

    $('corpoPainel').innerHTML = h;

    var sel = $('rsQuem');
    if (sel) sel.addEventListener('change', function () {
      APP.rastreio.quem = sel.value;
      APP.carregarRastreio();
    });
    var sair = $('rsSair');
    if (sair) sair.addEventListener('click', function () {
      APP.modoRastreio = false;
      APP.pintarResumo();
    });

    if (APP.rastreio.quem) APP.carregarRastreio();
  };

  APP.carregarRastreio = function () {
    var cx = $('rsCorpo');
    if (!cx) return;
    if (!APP.rastreio.quem) { cx.innerHTML = ''; return; }
    cx.innerHTML = '<div class="vazio">Lendo o que ele fez…</div>';

    var quem = APP.rastreio.quem;
    Promise.all([
      APP.invChamar('painelFuncionario', { quem: quem }),
      APP.invChamar('linhaDoTempo', { quem: quem })
    ]).then(function (r) {
      var painel = r[0], tempo = r[1];

      if (painel.__semModulo || tempo.__semModulo) {
        cx.innerHTML = APP.avisoSemInventario();
        return;
      }
      if (!painel.ok && !tempo.ok) {
        cx.innerHTML = '<div class="aviso erro"><b>Não consegui ler o rastreio.</b><br>' +
          esc(painel.mensagem || tempo.mensagem || 'sem resposta') +
          '<div class="small" style="margin-top:6px">Isto NÃO quer dizer que ' +
          'ele não fez nada: quer dizer que não consegui ler.</div></div>';
        return;
      }

      var h = '';
      if (painel.ok) {
        var d = painel.dados;
        h += '<div class="numeros">' +
          cartao(d.posicoesConferidas, 'posições') +
          cartao(d.atividades, 'atividades') +
          cartao(d.conferidas, 'sem divergência') +
          cartao(d.divergencias, 'divergências') +
        '</div>';
        if (d.semSaldoParaComparar) {
          h += '<div class="aviso">' + d.semSaldoParaComparar + ' conferência(s) ' +
            'sem saldo para comparar — não entram como “conferido”.</div>';
        }
        h += '<div class="small" style="margin-bottom:10px;color:var(--texto-3)">' +
          esc(painel.observacao || '') + '</div>';
      }

      var eventos = (tempo.ok && tempo.dados) || [];
      /* o último endereço que ele leu: é o mais perto de "onde ele
         está" que o sistema sabe de verdade */
      var ultimo = null;
      for (var i = eventos.length - 1; i >= 0; i--) {
        if (eventos[i].codigo) { ultimo = eventos[i]; break; }
      }
      h += '<div class="sep"></div>' +
        '<div class="linha"><span>Última posição conferida</span><b class="mono">' +
          (ultimo ? esc(ultimo.codigo) : '—') + '</b></div>' +
        '<div class="linha"><span>Quando</span><b>' +
          (ultimo ? esc(ultimo.quando) : '—') + '</b></div>' +
        '<div class="small" style="margin:4px 0 10px;color:var(--texto-3)">' +
        'Isto é onde ele <b>esteve</b>, não onde ele está agora. ' +
        'Localização ao vivo exigiria GPS pelo aplicativo, com autorização ' +
        'dele — e isso não existe no sistema hoje.</div>';

      if (ultimo) {
        h += '<button class="btn" id="rsVerNoMapa" style="width:100%">' +
          'Ver essa posição no mapa</button>';
      }

      if (!eventos.length) {
        h += '<div class="vazio">Nenhum evento registrado para ' +
          esc(quem) + '.</div>';
      } else {
        h += '<div class="sep"></div><b style="font-size:12.5px">Linha do tempo</b>' +
          '<div class="tempo">';
        for (var k = eventos.length - 1; k >= 0 && k > eventos.length - 41; k--) {
          var e = eventos[k];
          h += '<div class="tempoItem">' +
            '<div class="tempoHora">' + esc(e.quando) + '</div>' +
            '<div class="tempoTexto"><b>' + esc(e.evento) + '</b>' +
              (e.codigo ? ' · <span class="mono">' + esc(e.codigo) + '</span>' : '') +
              (e.detalhe ? '<div class="small">' + esc(e.detalhe) + '</div>' : '') +
            '</div></div>';
        }
        h += '</div>';
        if (eventos.length > 40) {
          h += '<div class="small">mostrando os 40 mais recentes de ' +
            eventos.length + '</div>';
        }
      }

      cx.innerHTML = h;

      var ver = $('rsVerNoMapa');
      if (ver && ultimo) ver.addEventListener('click', function () {
        try { raiz.MOTOR3D.selecionarPorCodigo(ultimo.codigo); } catch (e) {}
      });
    });
  };

  /* ============================================================
     [FRENTE] 15/11 · CENTRAL DE ATIVIDADES E ROTAS — módulo 01,
     seção 3
     ------------------------------------------------------------
     Ele perguntou: "como que eu vou conseguir criar uma frente de
     serviço para pessoa?". A resposta honesta era: não dá — o
     motor de rotas existia no Core, mas não havia tela nenhuma
     para usá-lo. Só por API, na mão.

     Esta tela mora AQUI, no mapa, e não no sistema, por um motivo
     prático: o que ele quer escolher é rua, estante e nível — e
     isso ele já está vendo desenhado na frente dele. A lista de
     endereços é a MESMA que o mapa carregou do Core; não há um
     segundo cadastro de endereço em lugar nenhum.

     O que ela faz, em ordem:
       1. ele marca as ruas, as estantes e os níveis;
       2. a tela mostra quantas posições isso dá, na hora;
       3. ele escolhe o colaborador, do cadastro de verdade;
       4. decide como dividir em rotas;
       5. publica — e aí o Core cria a atividade e as rotas.

     O que ela NÃO faz: inventar endereço, inventar colaborador,
     e dizer "publicado" antes do Core confirmar cada gravação.
     ============================================================ */

  APP.frente = { ruas: {}, estantes: {}, niveis: {}, divisao: 'rua' };

  /* a árvore sai dos endereços que o mapa já tem — não de um
     cadastro paralelo */
  APP.arvoreDeEnderecos = function () {
    var locais = APP.locais || [];
    var ruas = {};
    for (var i = 0; i < locais.length; i++) {
      var L = locais[i];
      var rua = String(L.rua || '').trim();
      var est = String(L.estante || '').trim();
      var pra = String(L.prateleira || '').trim();
      if (!rua) continue;
      if (!ruas[rua]) ruas[rua] = { estantes: {}, quantas: 0 };
      ruas[rua].quantas++;
      if (!ruas[rua].estantes[est]) ruas[rua].estantes[est] = { niveis: {}, quantas: 0 };
      ruas[rua].estantes[est].quantas++;
      if (!ruas[rua].estantes[est].niveis[pra]) ruas[rua].estantes[est].niveis[pra] = 0;
      ruas[rua].estantes[est].niveis[pra]++;
    }
    return ruas;
  };

  /* quais posições o que ele marcou cobre, agora */
  APP.posicoesDaFrente = function () {
    var f = APP.frente, locais = APP.locais || [], fora = [];
    var temRua = false, temEst = false, temNiv = false, k;
    for (k in f.ruas) if (f.ruas[k]) temRua = true;
    for (k in f.estantes) if (f.estantes[k]) temEst = true;
    for (k in f.niveis) if (f.niveis[k]) temNiv = true;

    for (var i = 0; i < locais.length; i++) {
      var L = locais[i];
      var rua = String(L.rua || '').trim();
      var est = String(L.estante || '').trim();
      var pra = String(L.prateleira || '').trim();
      var codigo = String(L.codigo || '').trim();
      if (!codigo) continue;
      if (temRua && !f.ruas[rua]) continue;
      if (temEst && !f.estantes[rua + '|' + est]) continue;
      if (temNiv && !f.niveis[pra]) continue;
      if (!temRua && !temEst && !temNiv) continue;   /* nada marcado = nada */
      fora.push({ codigo: codigo, rua: rua, estante: est, prateleira: pra });
    }
    return fora;
  };

  APP.pintarFrente = function () {
    APP.titulo('Frente de serviço');
    var ruas = APP.arvoreDeEnderecos();
    var nomesDeRua = [];
    for (var r in ruas) if (ruas.hasOwnProperty(r)) nomesDeRua.push(r);
    nomesDeRua.sort();

    if (!nomesDeRua.length) {
      $('corpoPainel').innerHTML =
        '<div class="aviso erro"><b>Não há endereço carregado.</b><br>' +
        'A frente de serviço sai dos endereços que o mapa leu do Core. ' +
        'Sem eles eu não tenho o que distribuir — e não vou inventar rua ' +
        'nenhuma.</div>' +
        '<div class="sep"></div><button class="btn" id="frSair">Voltar ao galpão</button>';
      APP.ligarSairFrente();
      return;
    }

    /* níveis existentes, juntando todas as ruas */
    var niveis = {}, nv;
    for (var ra in ruas) {
      for (var e in ruas[ra].estantes) {
        for (nv in ruas[ra].estantes[e].niveis) niveis[nv] = 1;
      }
    }
    var nomesDeNivel = [];
    for (nv in niveis) if (niveis.hasOwnProperty(nv)) nomesDeNivel.push(nv);
    nomesDeNivel.sort();

    var h = '<div class="aviso verde" style="margin:0 0 12px">' +
      '<b>Isto vai para o celular da pessoa.</b> ' +
      'Marque onde ela vai trabalhar, escolha o responsável e publique: o ' +
      'serviço aparece em <b>Minhas atividades</b> no ALMOXA CAMPO dela.' +
      '<div class="small" style="margin-top:6px">Se o que você quer é só ' +
      'traçar um caminho para seguir agora, sem mandar para ninguém, use ' +
      '<b>Caminho na tela</b>.</div></div>' +
      '<div class="small" style="margin-bottom:10px">' +
      'Desmarcar é o jeito de tirar: se a madeira fica na estante 03 e ela ' +
      'não entra nesta frente, deixe a 03 desmarcada.</div>';

    /* ---- ruas ---- */
    h += '<div class="linha"><span>1 · Ruas</span>' +
      '<b><button class="btn pequeno" id="frTodasRuas">marcar todas</button></b></div>' +
      '<div id="frRuas" style="margin:6px 0 12px">';
    for (var i = 0; i < nomesDeRua.length; i++) {
      var R = nomesDeRua[i];
      h += '<label class="opcao"><input type="checkbox" data-rua="' + esc(R) + '"' +
        (APP.frente.ruas[R] ? ' checked' : '') + '> Rua ' + esc(R) +
        ' <span class="small">(' + ruas[R].quantas + ' posições)</span></label>';
    }
    h += '</div>';

    /* ---- estantes das ruas marcadas ---- */
    h += '<div class="linha"><span>2 · Estantes</span><b id="frQtdEst">—</b></div>' +
      '<div id="frEstantes" style="margin:6px 0 12px"></div>';

    /* ---- níveis ---- */
    h += '<div class="linha"><span>3 · Níveis</span>' +
      '<b><button class="btn pequeno" id="frTodosNiveis">marcar todos</button></b></div>' +
      '<div id="frNiveis" style="margin:6px 0 12px">';
    for (var n = 0; n < nomesDeNivel.length; n++) {
      var N = nomesDeNivel[n];
      h += '<label class="opcao"><input type="checkbox" data-nivel="' + esc(N) + '"' +
        (APP.frente.niveis[N] ? ' checked' : '') + '> Nível ' + esc(N) + '</label>';
    }
    h += '</div>';

    h += '<div class="aviso azul" id="frConta">Marque pelo menos uma rua.</div>';

    /* ---- quem vai fazer ---- */
    h += '<div class="sep"></div>' +
      '<div class="linha"><span>4 · Quem vai fazer</span><b></b></div>' +
      '<div id="frQuem"><div class="vazio">Lendo o cadastro de colaboradores…</div></div>';

    /* ---- como dividir ---- */
    h += '<div class="linha"><span>5 · Como dividir</span><b></b></div>' +
      '<select id="frDivisao" class="campo">' +
      '<option value="rua">uma rota por rua</option>' +
      '<option value="estante">uma rota por estante</option>' +
      '<option value="unica">tudo numa rota só</option>' +
      '</select>';

    h += '<div class="campo"><label for="frPrazo">Prazo</label>' +
      '<input type="date" id="frPrazo"></div>' +
      '<div class="campo"><label for="frPrioridade">Prioridade</label>' +
      '<select id="frPrioridade">' +
      '<option value="NORMAL">normal</option>' +
      '<option value="ALTA">alta</option>' +
      '<option value="URGENTE">urgente</option>' +
      '<option value="BAIXA">baixa</option></select></div>' +
      '<div class="campo"><label for="frInstrucoes">Instruções para quem vai executar</label>' +
      '<input type="text" id="frInstrucoes" placeholder="opcional"></div>';

    h += '<div class="sep"></div>' +
      '<button class="btn primario" id="frPublicar">Publicar a frente de serviço</button>' +
      '<div id="frRecado"></div>' +
      '<div class="sep"></div><button class="btn" id="frSair">Voltar ao galpão</button>';

    $('corpoPainel').innerHTML = h;

    APP.ligarFrente(ruas, nomesDeRua, nomesDeNivel);
    APP.ligarSairFrente();
  };

  APP.ligarSairFrente = function () {
    var b = $('frSair');
    if (b) b.addEventListener('click', function () {
      APP.modoFrente = false;
      var bt = $('v_frente');
      if (bt) bt.setAttribute('aria-pressed', 'false');
      APP.pintarResumo();
    });
  };

  APP.ligarFrente = function (ruas, nomesDeRua, nomesDeNivel) {
    function redesenharEstantes() {
      var alvo = $('frEstantes');
      if (!alvo) return;
      var marcadas = [], r;
      for (r in APP.frente.ruas) if (APP.frente.ruas[r]) marcadas.push(r);
      marcadas.sort();
      if (!marcadas.length) {
        alvo.innerHTML = '<div class="small">Marque uma rua primeiro.</div>';
        $('frQtdEst').textContent = '—';
        return;
      }
      var html = '', quantas = 0;
      for (var i = 0; i < marcadas.length; i++) {
        var R = marcadas[i], ests = [];
        for (var e in ruas[R].estantes) if (ruas[R].estantes.hasOwnProperty(e)) ests.push(e);
        ests.sort();
        html += '<div class="small" style="margin-top:6px">Rua ' + esc(R) + '</div>';
        for (var j = 0; j < ests.length; j++) {
          var chave = R + '|' + ests[j];
          quantas++;
          html += '<label class="opcao"><input type="checkbox" data-est="' + esc(chave) + '"' +
            (APP.frente.estantes[chave] ? ' checked' : '') + '> Estante ' + esc(ests[j]) +
            ' <span class="small">(' + ruas[R].estantes[ests[j]].quantas + ')</span></label>';
        }
      }
      alvo.innerHTML = html;
      $('frQtdEst').textContent = quantas + ' disponível(is)';
      alvo.querySelectorAll('[data-est]').forEach(function (c) {
        c.addEventListener('change', function () {
          APP.frente.estantes[c.getAttribute('data-est')] = c.checked;
          contar();
        });
      });
    }

    function contar() {
      var lista = APP.posicoesDaFrente();
      var el = $('frConta');
      if (!el) return;
      if (!lista.length) {
        el.className = 'aviso azul';
        el.innerHTML = 'Nada marcado ainda — nenhuma posição entra.';
        return;
      }
      /* quantas rotas isso daria, do jeito escolhido */
      var sel = $('frDivisao');
      var modo = sel ? sel.value : 'rua';
      var grupos = {};
      for (var i = 0; i < lista.length; i++) {
        var k = modo === 'rua' ? lista[i].rua
              : modo === 'estante' ? (lista[i].rua + ' / ' + lista[i].estante)
              : 'tudo';
        grupos[k] = (grupos[k] || 0) + 1;
      }
      var nomes = [];
      for (var g in grupos) if (grupos.hasOwnProperty(g)) nomes.push(g + ' (' + grupos[g] + ')');
      el.className = 'aviso verde';
      el.innerHTML = '<b>' + lista.length + ' posição(ões) selecionada(s)</b>' +
        '<div class="small" style="margin-top:4px">viraria(m) ' + nomes.length +
        ' rota(s): ' + esc(nomes.join(' · ')) + '</div>';
    }

    $('frRuas').querySelectorAll('[data-rua]').forEach(function (c) {
      c.addEventListener('change', function () {
        var R = c.getAttribute('data-rua');
        APP.frente.ruas[R] = c.checked;
        if (!c.checked) {
          for (var k in APP.frente.estantes) {
            if (k.indexOf(R + '|') === 0) APP.frente.estantes[k] = false;
          }
        }
        redesenharEstantes();
        contar();
      });
    });
    $('frNiveis').querySelectorAll('[data-nivel]').forEach(function (c) {
      c.addEventListener('change', function () {
        APP.frente.niveis[c.getAttribute('data-nivel')] = c.checked;
        contar();
      });
    });
    var bt = $('frTodasRuas');
    if (bt) bt.addEventListener('click', function () {
      for (var i = 0; i < nomesDeRua.length; i++) APP.frente.ruas[nomesDeRua[i]] = true;
      APP.pintarFrente();
    });
    var bn = $('frTodosNiveis');
    if (bn) bn.addEventListener('click', function () {
      for (var i = 0; i < nomesDeNivel.length; i++) APP.frente.niveis[nomesDeNivel[i]] = true;
      APP.pintarFrente();
    });
    var sd = $('frDivisao');
    if (sd) sd.addEventListener('change', function () {
      APP.frente.divisao = sd.value; contar();
    });

    redesenharEstantes();
    contar();

    /* o colaborador vem do cadastro de verdade */
    APP.carregarColaboradores().then(function (c) {
      var alvo = $('frQuem');
      if (!alvo) return;
      if (!c.lista || !c.lista.length) {
        alvo.innerHTML = '<div class="aviso amarelo"><b>Não consegui ler o cadastro ' +
          'de colaboradores.</b><br>' +
          esc((c.erro && c.erro.mensagem) || 'sem resposta') +
