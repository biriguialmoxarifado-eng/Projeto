          '<br>Não vou deixar digitar um nome solto aqui: a atividade precisa ' +
          'apontar para a pessoa do cadastro, senão ela não aparece no celular ' +
          'de ninguém.</div>';
        return;
      }
      var opc = '<option value="">— escolha —</option>';
      for (var i = 0; i < c.lista.length; i++) {
        var u = c.lista[i];
        opc += '<option value="' + esc(u.id) + '" data-nome="' + esc(u.nome) + '">' +
          esc(u.nome) + (u.cargo ? ' — ' + esc(u.cargo) : '') + '</option>';
      }
      alvo.innerHTML = '<select id="frColaborador" class="campo">' + opc + '</select>';
    });

    var bp = $('frPublicar');
    if (bp) bp.addEventListener('click', function () { APP.publicarFrente(bp); });
  };

  APP.publicarFrente = function (botao) {
    var recado = $('frRecado');
    var lista = APP.posicoesDaFrente();
    if (!lista.length) {
      recado.innerHTML = '<div class="aviso amarelo">Nada selecionado. ' +
        'Marque pelo menos uma rua.</div>';
      return;
    }
    var sel = $('frColaborador');
    var id = sel ? sel.value : '';
    var nome = sel && sel.selectedOptions[0]
      ? sel.selectedOptions[0].getAttribute('data-nome') : '';
    if (!id || !nome) {
      recado.innerHTML = '<div class="aviso amarelo">Falta escolher quem vai fazer. ' +
        'Sem dono a frente não aparece no celular de ninguém.</div>';
      return;
    }

    var modo = ($('frDivisao') || {}).value || 'rua';
    var prazo = ($('frPrazo') || {}).value || '';
    var prioridade = ($('frPrioridade') || {}).value || 'NORMAL';
    var instrucoes = ($('frInstrucoes') || {}).value || '';

    var grupos = {}, ordem = [];
    for (var i = 0; i < lista.length; i++) {
      var k = modo === 'rua' ? ('Rua ' + lista[i].rua)
            : modo === 'estante' ? ('Rua ' + lista[i].rua + ' · estante ' + lista[i].estante)
            : 'Frente completa';
      if (!grupos[k]) { grupos[k] = []; ordem.push(k); }
      grupos[k].push(lista[i].codigo);
    }

    botao.disabled = true;
    botao.textContent = 'Publicando…';
    recado.innerHTML = '<div class="aviso cinza">Criando a atividade no Core. ' +
      'Ainda <b>não</b> está publicada.</div>';

    var todas = [];
    for (var g = 0; g < ordem.length; g++) todas = todas.concat(grupos[ordem[g]]);

    APP.invChamar('criarAtividade', {
      tipo: modo === 'unica' ? 'RUA' : 'RUA',
      posicoes: todas,
      responsavel: nome, responsavelId: id,
      prazo: prazo, prioridade: prioridade,
      instrucoes: instrucoes
    }).then(function (r) {
      if (!r || !r.ok) {
        botao.disabled = false;
        botao.textContent = 'Publicar a frente de serviço';
        recado.innerHTML = (r && r.__semModulo)
          ? APP.avisoSemInventario()
          : '<div class="aviso erro"><b>A atividade NÃO foi criada.</b><br>' +
            esc((r && r.mensagem) || 'o Core não respondeu') + '</div>';
        return;
      }
      var atividadeId = (r.dados && r.dados.id) || '';
      recado.innerHTML = '<div class="aviso cinza">Atividade ' + esc(atividadeId) +
        ' criada. Publicando as rotas…</div>';

      var feitas = [], falhas = [], pos = 0;
      function proxima() {
        if (pos >= ordem.length) return terminar();
        var nomeRota = ordem[pos];
        var codigos = grupos[nomeRota];
        pos++;
        APP.invChamar('criarRota', {
          atividadeId: atividadeId,
          nome: nomeRota,
          ordem: pos,
          posicoes: codigos,
          responsavel: nome, responsavelId: id,
          prioridade: prioridade, prazo: prazo
        }).then(function (rr) {
          if (rr && rr.ok) feitas.push(nomeRota + ' (' + codigos.length + ')');
          else falhas.push(nomeRota + ': ' +
            ((rr && rr.mensagem) || 'sem resposta'));
          proxima();
        });
      }
      function terminar() {
        botao.disabled = false;
        botao.textContent = 'Publicar a frente de serviço';
        var ok = feitas.length && !falhas.length;
        recado.innerHTML =
          '<div class="aviso ' + (ok ? 'verde' : 'amarelo') + '">' +
          '<b>' + (ok ? 'Frente publicada.' : 'Publicada em parte.') + '</b>' +
          '<div class="small" style="margin-top:6px">Atividade <b>' +
          esc(atividadeId) + '</b> para <b>' + esc(nome) + '</b>.<br>' +
          'Rotas criadas: ' + (feitas.length ? esc(feitas.join(' · ')) : 'nenhuma') +
          (falhas.length
            ? '<br><b>Falharam:</b> ' + esc(falhas.join(' · '))
            : '') +
          '</div>' +
          (ok ? '<div class="small" style="margin-top:8px">' +
            'No celular, ' + esc(nome) + ' abre o <b>ALMOXA CAMPO</b> e toca em ' +
            '<b>Minhas atividades</b> na tela inicial. As rotas aparecem lá ' +
            'sozinhas — ele não precisa pedir nada a ninguém.</div>' : '') +
          '</div>' +
          (ok ? '<div id="frConferindo" class="small">Conferindo o que o ' +
            'celular dele vai enxergar…</div>' : '');

        /* [15/11] NÃO basta o Core dizer "gravei". Eu releio pela MESMA
           porta que o celular dele usa, com a sessão dele, e mostro o
           que voltou. Se aqui aparecer e no celular não, o problema
           deixou de ser a publicação — e isso já é meio caminho. */
        if (ok) APP.conferirNoCelularDele(id, nome, atividadeId);
      }
      proxima();
    });
  };

  /* ============================================================
     [ACOMP] 15/11 · PAINEL DE ACOMPANHAMENTO — módulo 01, seção 10
     ------------------------------------------------------------
     "eu deveria mostrar também quando a pessoa entrar na atividade,
      ela já vai aparecer aqui para mim ver se a pessoa iniciou"

     É isto: o gestor olha a tela e sabe em que pé está cada um,
     sem telefonar para ninguém.

     De onde sai cada número, para ninguém achar que é estimativa:
       · "começou" é a hora que o próprio Core gravou quando a
         pessoa tocou em começar no celular (iniciadaEm);
       · "feitas" e "faltam" são contados das CONTAGENS gravadas,
         não de um contador à parte que poderia divergir;
       · a situação é calculada do que está gravado, e por isso uma
         rota que ninguém tocou aparece como NOVA, e não como
         "em andamento" só porque foi distribuída.

     NÃO há GPS aqui. "Último endereço conferido" é o último que a
     pessoa registrou — não é onde ela está agora, e a tela diz isso
     com todas as letras.
     ============================================================ */

  APP.pintarAcompanhamento = function () {
    APP.titulo('Acompanhamento');
    $('corpoPainel').innerHTML = '<div class="vazio">Lendo o que foi distribuído…</div>';

    APP.invChamar('listarRotas', {}).then(function (r) {
      if (!r.ok) {
        $('corpoPainel').innerHTML =
          (r.__semModulo ? APP.avisoSemInventario() : APP.invErro(r, 'ler as rotas')) +
          '<div class="sep"></div><button class="btn" id="acSair">Voltar ao galpão</button>';
        APP.ligarSairAcomp();
        return;
      }

      var rotas = r.dados || [];
      if (!rotas.length) {
        $('corpoPainel').innerHTML =
          '<div class="vazio">Nenhuma rota distribuída ainda.<br>' +
          'Use <b>Frente de serviço</b> para montar a primeira.</div>' +
          '<div class="sep"></div><button class="btn" id="acSair">Voltar ao galpão</button>';
        APP.ligarSairAcomp();
        return;
      }

      /* agrupa por pessoa: é assim que o gestor pensa */
      var porPessoa = {}, ordem = [];
      for (var i = 0; i < rotas.length; i++) {
        var x = rotas[i];
        var quem = String(x.responsavel || '(sem dono)').trim();
        if (!porPessoa[quem]) { porPessoa[quem] = []; ordem.push(quem); }
        porPessoa[quem].push(x);
      }
      ordem.sort();

      /* o retrato geral, antes do detalhe */
      var total = rotas.length, iniciadas = 0, concluidas = 0,
          comDiv = 0, naoComecaram = 0, locais = 0, feitos = 0;
      for (var k = 0; k < rotas.length; k++) {
        var R = rotas[k], st = String(R.statusCalculado || '').toUpperCase();
        var pg = R.progresso || {};
        locais += Number(pg.quantas) || 0;
        feitos += Number(pg.feitas) || 0;
        if (String(R.iniciadaEm || '').trim()) iniciadas++; else naoComecaram++;
        if (st === 'CONCLUIDA' || st === 'AGUARDANDO_APROVACAO') concluidas++;
        if (st === 'COM_DIVERGENCIA') comDiv++;
      }

      var h = '<div class="numeros">' +
        APP.cartaoNumero(total, 'rotas') +
        APP.cartaoNumero(iniciadas, 'começaram') +
        APP.cartaoNumero(naoComecaram, 'não começaram') +
        APP.cartaoNumero(comDiv, 'com divergência') +
        '</div>' +
        '<div class="linha"><span>Locais conferidos</span><b>' +
        feitos + ' de ' + locais + '</b></div>';

      h += '<div class="sep"></div>';

      for (var p = 0; p < ordem.length; p++) {
        var quem2 = ordem[p], minhas = porPessoa[quem2];
        var feitasP = 0, totalP = 0, comecouAlguma = false, ultimo = '';
        for (var m = 0; m < minhas.length; m++) {
          var g = minhas[m].progresso || {};
          feitasP += Number(g.feitas) || 0;
          totalP += Number(g.quantas) || 0;
          if (String(minhas[m].iniciadaEm || '').trim()) {
            comecouAlguma = true;
            if (String(minhas[m].iniciadaEm) > ultimo) ultimo = String(minhas[m].iniciadaEm);
          }
        }

        h += '<div class="cartao" style="margin-bottom:10px">' +
          '<div class="linha"><span style="font-weight:700;font-size:14px">' +
          esc(quem2) + '</span>' +
          '<span>' + (comecouAlguma
            ? '<span class="pino verde">começou</span>'
            : '<span class="pino cinza">ainda não começou</span>') + '</span></div>' +
          '<div class="small">' + minhas.length + ' rota(s) · ' +
          feitasP + ' de ' + totalP + ' locais conferidos' +
          (ultimo ? ' · começou às ' + esc(ultimo) : '') + '</div>';

        for (var n = 0; n < minhas.length; n++) {
          var Rx = minhas[n], pgx = Rx.progresso || {};
          var stx = String(Rx.statusCalculado || '').toUpperCase();
          var cor = stx === 'CONCLUIDA' ? 'verde'
                  : stx === 'COM_DIVERGENCIA' ? 'vermelho'
                  : stx === 'EM_ANDAMENTO' ? 'amarelo'
                  : stx === 'AGUARDANDO_APROVACAO' ? 'azul' : 'cinza';
          h += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--borda)">' +
            '<div class="linha"><span>' + esc(Rx.nome) + '</span>' +
            '<span class="pino ' + cor + '">' +
            esc(stx.replace(/_/g, ' ').toLowerCase()) + '</span></div>' +
            '<div class="small">' +
            (Number(pgx.feitas) || 0) + ' de ' + (Number(pgx.quantas) || 0) +
            ' locais · ' + (Number(Rx.porcento) || 0) + '%' +
            /* [ACOMP] nada de <b> aqui: dentro do cartão o <b> é
               título e sai do tamanho de um número grande */
            (Number(pgx.divergencias)
              ? ' · <span style="color:#8A2B23;font-weight:700">' +
                pgx.divergencias + ' divergência(s)</span>' : '') +
            (String(Rx.prazo || '').trim() ? ' · prazo ' + esc(Rx.prazo) : '') +
            '</div>';

          if (pgx.faltamQuais && pgx.faltamQuais.length) {
            var mostra = pgx.faltamQuais.slice(0, 6).join(', ');
            h += '<div class="small" style="opacity:.75">falta: ' + esc(mostra) +
              (pgx.faltamQuais.length > 6
                ? ' e mais ' + (pgx.faltamQuais.length - 6) : '') + '</div>';
          }
          h += '</div>';
        }
        h += '</div>';
      }

      h += '<div class="aviso azul"><b>O que estes números são</b>' +
        '"Começou" é a hora que o Core gravou quando a pessoa tocou em começar ' +
        'no celular. "Conferidos" sai das contagens gravadas, uma a uma. ' +
        'Não há GPS: eu sei o que foi registrado, não onde a pessoa está agora.' +
        '</div>';

      h += '<div class="sep"></div>' +
        '<button class="btn" id="acAtualizar">Atualizar</button> ' +
        '<button class="btn" id="acSair">Voltar ao galpão</button>';

      $('corpoPainel').innerHTML = h;
      var ba = $('acAtualizar');
      if (ba) ba.addEventListener('click', function () { APP.pintarAcompanhamento(); });
      APP.ligarSairAcomp();
    });
  };

  APP.cartaoNumero = function (n, rotulo) {
    return '<div class="cartao"><b>' + n + '</b><small>' + esc(rotulo) + '</small></div>';
  };

  APP.ligarSairAcomp = function () {
    var b = $('acSair');

  /* relê pela porta do celular: listarRotas filtrado pela atividade,
     e confere se o responsável gravado é mesmo quem foi escolhido */
  APP.conferirNoCelularDele = function (idPessoa, nomePessoa, atividadeId) {
    APP.invChamar('listarRotas', { atividadeId: atividadeId }).then(function (r) {
      var el = $('frConferindo');
      if (!el) return;
      if (!r || !r.ok) {
        el.innerHTML = '<div class="aviso amarelo"><b>Publiquei, mas não ' +
          'consegui reler para conferir.</b>' + esc((r && r.mensagem) || '') +
          '<div class="small">Abra <b>Acompanhar</b> para ver o estado atual.</div>' +
          '</div>';
        return;
      }
      var rotas = r.dados || [];
      var dela = [];
      for (var i = 0; i < rotas.length; i++) {
        var x = rotas[i];
        var meu = (idPessoa && String(x.responsavelId || '').trim() === String(idPessoa)) ||
          (nomePessoa && String(x.responsavel || '').trim().toUpperCase() ===
            String(nomePessoa).trim().toUpperCase());
        if (meu) dela.push(x);
      }
      if (!dela.length) {
        el.innerHTML = '<div class="aviso erro"><b>Gravou, mas no nome de ' +
          'outra pessoa.</b> Reli as rotas da atividade ' + esc(atividadeId) +
          ' e nenhuma está com ' + esc(nomePessoa) + '. Assim ela NÃO vai ' +
          'aparecer no celular dele.</div>';
        return;
      }
      var locais = 0;
      for (var k = 0; k < dela.length; k++) {
        locais += Number((dela[k].progresso || {}).quantas) || 0;
      }
      el.innerHTML = '<div class="aviso verde"><b>Conferido na volta.</b> ' +
        'Reli pela mesma porta que o celular dele usa: ' + dela.length +
        ' rota(s) com ' + locais + ' local(is), no nome de ' + esc(nomePessoa) + '.' +
        '<div class="small" style="margin-top:6px">Se mesmo assim não ' +
        'aparecer no ALMOXA CAMPO, o problema não é a publicação: é a ' +
        'sessão do celular (ele precisa entrar como ' + esc(nomePessoa) +
        ') ou a implantação do Core, que pode estar servindo código antigo.' +
        '</div></div>';
    });
  };

  APP.pintarAtividade = function () {
    var d = APP.inv.atividade;
    if (!d) return APP.pintarInventario();
    var a = d.atividade;
    APP.titulo('Atividade de inventário');

    var feitas = {};
    (d.contagens || []).forEach(function (c) { feitas[c.codigo] = c; });

    var h =
      '<div class="linha"><span>Tipo</span><b>' + esc(a.tipo) + '</b></div>' +
      '<div class="linha"><span>Situação</span><b>' + esc(a.status) + '</b></div>' +
      '<div class="linha"><span>Responsável</span><b>' + esc(a.responsavel) + '</b></div>' +
      (a.prazo ? '<div class="linha"><span>Prazo</span><b>' + esc(a.prazo) + '</b></div>' : '') +
      '<div class="linha"><span>Conferidas</span><b>' + d.feitas + ' de ' +
        d.posicoes.length + '</b></div>' +
      '<div class="barraOcup"><i style="width:' +
        (d.posicoes.length ? Math.round(d.feitas / d.posicoes.length * 100) : 0) +
        '%"></i></div>' +
      (d.divergencias
        ? '<div class="aviso erro"><b>' + d.divergencias + ' divergência(s).</b> ' +
          'O ajuste de saldo não acontece aqui: segue o fluxo de aprovação do ' +
          'ALMOX PRO.</div>'
        : '');

    h += '<div class="sep"></div>' +
      '<button class="btn primario" id="iLer" style="width:100%">' +
      '▣ Ler o QR da posição</button>' +
      '<div id="iLeitor"></div>';

    h += '<div class="sep"></div><div style="margin-top:4px">';
    for (var i = 0; i < d.posicoes.length; i++) {
      var cod = d.posicoes[i];
      var c = feitas[cod];
      var cor = !c ? '#9AA3AE'
        : (String(c.resultado).indexOf('DIVERGENCIA') === 0 ? '#D2443B'
        : (c.resultado === 'CONFERIDO' ? '#2E9E5B' : '#E8A33D'));
      h += '<div class="posInv" data-pos="' + esc(cod) + '">' +
        '<i style="background:' + cor + '"></i>' +
        '<b class="mono">' + esc(cod) + '</b>' +
        '<span>' + (c ? esc(c.resultado) : 'não conferida') + '</span>' +
      '</div>';
    }
    h += '</div>';

    h += '<div class="sep"></div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="iVoltar">Minhas atividades</button>' +

        (d.completa ? '' : ' disabled title="faltam posições"') + '>' +
        'Confirmar no Core</button>' +
      '<button class="btn" id="iTempo">Linha do tempo</button>' +
    '</div>' +
    (d.completa
      ? '<div class="small" style="margin-top:8px;color:var(--texto-3)">' +

      : '<div class="small" style="margin-top:8px;color:var(--texto-3)">' +
        'Faltam ' + d.faltam + ' posição(ões). O Core recusa confirmar o que ' +
        'ninguém conferiu — e faz bem.</div>');

    $('corpoPainel').innerHTML = h;

  };

  APP.ligarAtividade = function () {

  /* ------------------------------------------------------------
     ETAPA 3 · O LEITOR DE QR
     Usa o BarcodeDetector do navegador. Se não houver, campo para
     digitar. NUNCA finjo leitura.
     ------------------------------------------------------------ */
  APP.temLeitorNativo = function () {
    return typeof window !== 'undefined' && 'BarcodeDetector' in window;
  };

  APP.abrirLeitor = function () {
    var caixa = $('iLeitor');
    if (!caixa) return;
    if (APP.inv.lendo) { APP.pararLeitor(); return; }

    if (!APP.temLeitorNativo()) {
      caixa.innerHTML =
        '<div class="aviso" style="margin-top:10px">' +
        '<b>Este navegador não tem leitor de código.</b> ' +
        'Não vou simular leitura: digite o código da etiqueta.</div>' +
        '<div class="campo"><label for="iManual">Código da posição</label>' +
        '<input id="iManual" type="text" autocomplete="off" ' +
        'placeholder="A-01-1-A ou ALMOXA:LOC:A-01-1-A"></div>' +
        '<button class="btn" id="iManualOk">Validar no Core</button>';
      var ok = $('iManualOk');
      if (ok) ok.addEventListener('click', function () {
        var v = $('iManual') ? $('iManual').value : '';
        APP.validarLeitura(v);
      });
      return;
    }

    caixa.innerHTML =
      '<div class="leitorCx"><video id="iVideo" playsinline muted></video>' +
      '<div class="leitorMira"></div></div>' +
      '<div class="small" style="margin-top:6px;color:var(--texto-3)">' +
      'Aponte para a etiqueta da posição. Quem decide se o código vale é o Core.</div>' +
      '<button class="btn" id="iParar" style="margin-top:8px">Parar o leitor</button>';

    var parar = $('iParar');
    if (parar) parar.addEventListener('click', function () { APP.pararLeitor(); });

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function (fluxo) {
        APP.inv.fluxo = fluxo;
        var v = $('iVideo');
        if (!v) return;
        v.srcObject = fluxo;
        v.play();
        APP.inv.lendo = true;
        var det = new window.BarcodeDetector({ formats: ['qr_code', 'code_128'] });
        APP.inv.leitor = setInterval(function () {
          if (!APP.inv.lendo) return;
          det.detect(v).then(function (achados) {
            if (!achados || !achados.length) return;
            var valor = achados[0].rawValue;
            if (!valor || valor === APP.inv.ultimoQr) return;
            APP.inv.ultimoQr = valor;
            APP.pararLeitor();
            APP.validarLeitura(valor);
          }).catch(function () {});
        }, 320);
      })
      .catch(function (e) {
        caixa.innerHTML = '<div class="aviso erro" style="margin-top:10px">' +
          '<b>Não consegui abrir a câmera.</b><br>' + esc(String(e && e.message || e)) +
          '<br><br>Digite o código da etiqueta abaixo.</div>' +
          '<div class="campo"><input id="iManual" type="text" ' +
          'placeholder="A-01-1-A"></div>' +
          '<button class="btn" id="iManualOk">Validar no Core</button>';
        var ok2 = $('iManualOk');
        if (ok2) ok2.addEventListener('click', function () {
          APP.validarLeitura($('iManual') ? $('iManual').value : '');
        });
      });
  };

  APP.pararLeitor = function () {
    APP.inv.lendo = false;
    if (APP.inv.leitor) { clearInterval(APP.inv.leitor); APP.inv.leitor = null; }
    if (APP.inv.fluxo) {
      try {
        APP.inv.fluxo.getTracks().forEach(function (t) { t.stop(); });
      } catch (e) {}
      APP.inv.fluxo = null;
    }
  };

  /* quem valida é o Core. A tela só mostra o que ele responder. */
  APP.validarLeitura = function (valor) {
    var caixa = $('iLeitor');
    if (!caixa) return;
    if (!String(valor || '').trim()) {
      caixa.innerHTML = '<div class="aviso erro" style="margin-top:10px">' +
        'Não veio nada do leitor.</div>';
      return;
    }
    caixa.innerHTML = '<div class="vazio">Validando no Core…</div>';
    APP.invChamar('validarQr', {
      atividadeId: APP.inv.atividade.atividade.id,
      qr: valor,
      esperado: APP.inv.posicaoAtual || ''
    }).then(function (r) {
      if (!r.ok) {
        caixa.innerHTML = APP.invErro(r, 'validar esta leitura') +
          '<button class="btn" id="iLer2">Ler outra vez</button>';
        var b = $('iLer2');
        if (b) b.addEventListener('click', function () { APP.abrirLeitor(); });
        return;
      }
      APP.pintarConferencia(r.dados, valor);
    });
  };

  /* ------------------------------------------------------------
     ETAPA 4 · A CONFERÊNCIA FÍSICA
     ------------------------------------------------------------ */
  APP.RESULTADOS_CAMPO = [
    ['', 'comparar pela quantidade'],
    ['POSICAO_VAZIA', 'posição vazia'],
    ['POSICAO_BLOQUEADA', 'posição bloqueada'],
    ['MATERIAL_DANIFICADO', 'material danificado'],
    ['MATERIAL_NAO_CADASTRADO', 'material não cadastrado'],
    ['MATERIAL_ENDERECO_INCORRETO', 'material em endereço errado']
  ];

  APP.pintarConferencia = function (d, qrCru) {
    var caixa = $('iLeitor');
    if (!caixa) return;
    APP.novaOperacao();
    APP.inv.posicaoAtual = d.codigo;

    var h = '<div class="confCx">' +
      '<div class="linha"><span>Endereço validado</span><b class="mono">' +
        esc(d.codigo) + '</b></div>' +
      '<div class="linha"><span>Posição na atividade</span><b>' +
        d.posicaoNaAtividade + ' de ' + d.totalDaAtividade + '</b></div>';

    if (d.saldoConhecido) {
      h += '<div class="linha"><span>Saldo no sistema</span><b>' +
        esc(String(d.saldoSistema)) + '</b></div>';
    } else {
      h += '<div class="aviso"><b>Sem saldo para comparar.</b> ' +
        esc(d.porQueSemSaldo) + '<br>A conferência será gravada, mas o ' +
        'resultado NÃO vai dizer "conferido": vai dizer que não houve com o ' +
        'que comparar.</div>';
    }

    if (d.jaConferida) {
      h += '<div class="aviso"><b>Esta posição já foi conferida nesta atividade.</b> ' +
        'Registrar de novo cria uma segunda contagem, e as duas ficam no ' +
        'histórico.</div>';
    }

    h += '<div class="campo"><label for="iQtd">Quantidade encontrada</label>' +
      '<input id="iQtd" type="number" min="0" step="any" inputmode="decimal"></div>' +
      '<div class="campo"><label for="iSit">Situação de campo</label>' +
      '<select id="iSit">' +
      APP.RESULTADOS_CAMPO.map(function (x) {
        return '<option value="' + x[0] + '">' + esc(x[1]) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="campo"><label for="iObs">Observação</label>' +
      '<input id="iObs" type="text" placeholder="o que o senhor viu"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn primario" id="iGravar">Registrar no Core</button>' +
        '<button class="btn" id="iCancelar">Cancelar</button>' +
      '</div>' +
      '<div class="small" style="margin-top:8px;color:var(--texto-3)">' +
      'Só aparece como registrado depois que o Core confirmar a gravação.</div>' +
    '</div>';

    caixa.innerHTML = h;

    var gravar = $('iGravar');
    if (gravar) gravar.addEventListener('click', function () {
      gravar.disabled = true;
      gravar.textContent = 'Registrando…';
      var qtd = $('iQtd') ? $('iQtd').value : '';
      APP.invChamar('registrarContagem', {
        atividadeId: APP.inv.atividade.atividade.id,
        qr: qrCru,
        codigo: d.codigo,
        qtdEncontrada: qtd === '' ? null : Number(qtd),
        resultado: $('iSit') ? $('iSit').value : '',
        observacao: $('iObs') ? $('iObs').value : '',
        operacaoId: APP.inv.operacaoId
      }).then(function (r) {
        if (!r.ok) {
          caixa.insertAdjacentHTML('beforeend', APP.invErro(r, 'registrar a contagem'));
          gravar.disabled = false;
          gravar.textContent = 'Registrar no Core';
          return;
        }
        caixa.innerHTML = '<div class="aviso" style="border-color:#BFE3CC;' +
          'background:#F0FAF4;color:#1E5F3A"><b>Gravado e confirmado pelo Core.</b><br>' +
          'Resultado: ' + esc(r.resultado || r.dados.resultado) +
          (r.repetida ? '<br>(esta operação já tinha sido registrada; não dupliquei)' : '') +
          '</div>';
        APP.inv.posicaoAtual = '';
        APP.abrirAtividade(APP.inv.atividade.atividade.id);
      });
    });

    var cancelar = $('iCancelar');
    if (cancelar) cancelar.addEventListener('click', function () {
      APP.inv.posicaoAtual = '';
      caixa.innerHTML = '';
    });
  };

  /* ------------------------------------------------------------
     SEÇÃO 8 · a linha do tempo
     ------------------------------------------------------------ */
  APP.pintarLinhaDoTempo = function (filtro) {
    $('corpoPainel').innerHTML = '<div class="vazio">Lendo o histórico…</div>';
    APP.titulo('Linha do tempo');
    APP.invChamar('linhaDoTempo', filtro).then(function (r) {
      var h = '';
      if (!r.ok) {
        h = APP.invErro(r, 'ler a linha do tempo');
      } else if (!r.dados.length) {
        h = '<div class="vazio">Nenhum evento registrado ainda<br>para ' +
          esc(filtro.codigo || filtro.quem || filtro.atividadeId) + '.</div>';
      } else {
        h = '<div class="linha"><span>Eventos</span><b>' + r.dados.length + '</b></div>' +
          '<div class="tempo">';
        for (var i = 0; i < r.dados.length; i++) {
          var e = r.dados[i];
          h += '<div class="tempoItem">' +
            '<div class="tempoHora">' + esc(e.quando) + '</div>' +
            '<div class="tempoTexto"><b>' + esc(e.evento) + '</b>' +
              (e.codigo ? ' · <span class="mono">' + esc(e.codigo) + '</span>' : '') +
              (e.detalhe ? '<div class="small">' + esc(e.detalhe) + '</div>' : '') +
              '<div class="small" style="color:var(--texto-3)">' + esc(e.quem) + '</div>' +
            '</div></div>';
        }
        h += '</div>';
      }
      h += '<div class="sep"></div><button class="btn" id="iVoltaAtv">Voltar</button>';
      $('corpoPainel').innerHTML = h;
      var b = $('iVoltaAtv');
      if (b) b.addEventListener('click', function () {
        if (APP.inv.atividade) APP.pintarAtividade();
        else APP.pintarInventario();
      });
    });
  };

  /* ============================================================
     [F5] FASE 5 · 14/11 · FERRAMENTARIA 3D · seções 3 e 10
     ------------------------------------------------------------
     SERVIÇOS PRÓPRIOS, como a seção 3 manda: "cada ambiente deverá
     possuir seus próprios serviços, permissões, cadastros e regras
     de negócio. Não misturar estoque de materiais com controle
     patrimonial de ferramentas."

     O QUE EU NÃO ESCREVI, DE PROPÓSITO: nenhum módulo novo no
     Core. O ALMOX PRO já tem "ferramentas" com listar, movimentar
     e historico, e é ele que manda aqui. O contrato do movimentar
     eu LI no index.html dele:

         { patrimonio, tipo, quem, obs, avaria }
         tipo ∈ retirada · devolucao · transferencia ·
                liberacao · bloqueio

     Nenhum campo desse payload é invenção minha.

     ATENÇÃO AO MÓDULO "manutencao": ele existe no Core, mas é
     manutenção do SISTEMA — backup, restaurar, registrar versão.
     Não é manutenção de equipamento. Não encosto nele.
     ============================================================ */

  APP.ferr = { lista: null, mapa: null, filtro: '', erro: null, carregando: false };

  APP.ferrChamar = function (acao, payload) {
    if (!raiz.API3D || !raiz.API3D.pronto()) {
      return Promise.resolve({ ok: false, codigo: 'SEM_CORE',
        mensagem: 'O mapa não está ligado ao Core. Abra pelo botão Mapeamento 3D ' +
                  'de dentro do ALMOX PRO, já identificado.' });
    }
    return raiz.API3D.chamar('ferramentas', acao, payload || {});
  };

  APP.carregarFerramentaria = function () {
    APP.ferr.carregando = true;
    APP.ferr.erro = null;
    return APP.ferrChamar('listar', {}).then(function (r) {
      APP.ferr.carregando = false;
      if (!r.ok) {
        APP.ferr.erro = r;
        APP.ferr.lista = null;
        /* lista vazia aqui diria "não há ferramenta", e o que houve
           foi uma recusa. São coisas diferentes. */
        return r;
      }
      APP.ferr.lista = r.dados || [];
      APP.ferr.mapa = raiz.LAYOUT3D.ferramentasPorPosicao(
        APP.ferr.lista, APP.locais || []);
      return r;
    });
  };

  /* pinta o galpão com as cores do EQUIPAMENTO, não da ocupação */
  APP.desenharFerramentaria = function () {
    if (!APP.locais) return;
    var mapa = APP.ferr.mapa;
    var montagem = raiz.LAYOUT3D.montar(APP.locais, {
      corDe: function (loc) {
        return raiz.LAYOUT3D.corDaPosicaoNaFerramentaria(mapa, loc.codigo);
      }
    });
    APP.montagem = montagem;
    try {
      raiz.MOTOR3D.desenhar(montagem);
      APP.erroDeDesenho = '';
    } catch (e) {
      APP.erroDeDesenho = String((e && e.message) || e);
    }
    var mm = $('minimapa');
    if (mm && !mm.hidden) APP.pintarMinimapa(null);
  };

  /* ------------------------------------------------------------
     O PAINEL DA FERRAMENTARIA
     ------------------------------------------------------------ */
  APP.ESTADOS_FER = [
    ['', 'todas'],
    ['DISPONIVEL', 'disponíveis'],
    ['EM_POSSE', 'emprestadas'],
    ['MANUTENCAO', 'em manutenção'],
    ['BLOQUEADA', 'bloqueadas'],
    ['NAO_LOCALIZADA', 'não localizadas']
  ];

  APP.pintarFerramentaria = function () {
    APP.modoFerr = true;
    APP.titulo('Ferramentaria');
    $('corpoPainel').innerHTML = '<div class="vazio">Lendo a ferramentaria…</div>';

    APP.carregarFerramentaria().then(function () {
      if (APP.ferr.erro) {
        $('corpoPainel').innerHTML =
          '<div class="aviso erro"><b>Não consegui ler a ferramentaria.</b><br>' +
          esc(APP.ferr.erro.mensagem || 'o Core não respondeu') +
          (APP.ferr.erro.codigo ? '<div class="small" style="margin-top:6px">código: ' +
            esc(APP.ferr.erro.codigo) + '</div>' : '') +
          '</div>' +
          '<div class="small" style="margin-top:8px">Isto NÃO quer dizer que não ' +
          'há ferramentas: quer dizer que o Core recusou. São coisas diferentes.</div>' +
          '<div class="sep"></div><button class="btn" id="fSair">Voltar ao almoxarifado</button>';
        APP.ligarSairFerr();
        return;
      }
      APP.desenharFerramentaria();
      APP.pintarListaFerr();
    });
  };

  APP.pintarListaFerr = function () {
    var m = APP.ferr.mapa || { contagem: {}, naoLocalizadas: [] };
    var c = m.contagem || {};
    var lista = APP.ferr.lista || [];
    var CF = raiz.LAYOUT3D.CORES_FERRAMENTARIA;

    var h = '<div class="numeros">' +
      cartao(c.DISPONIVEL || 0, 'disponíveis') +
      cartao(c.EM_POSSE || 0, 'emprestadas') +
      cartao(c.MANUTENCAO || 0, 'em manutenção') +
      cartao(c.BLOQUEADA || 0, 'bloqueadas') +
    '</div>';

    if (c.NAO_LOCALIZADA) {
      h += '<div class="aviso"><b>' + c.NAO_LOCALIZADA + ' ferramenta(s) sem ' +
        'endereço no mapa.</b> Hoje o cadastro de localização liga posição a ' +
        'SKU, não a patrimônio — então há ferramenta que o mapa não tem onde ' +
        'colocar. Elas aparecem na lista, marcadas em cinza.</div>';
    }
    if (c.DESCONHECIDO) {
      h += '<div class="aviso erro"><b>' + c.DESCONHECIDO + ' com situação que eu ' +
        'não conheço.</b> Apareceu status novo no Core. Não chutei para ' +
        '“disponível”: ficou marcado como desconhecido.</div>';
    }

    h += '<div class="campo"><label for="fFiltro">Mostrar</label>' +
      '<select id="fFiltro">' +
      APP.ESTADOS_FER.map(function (e) {
        return '<option value="' + e[0] + '"' +
          (APP.ferr.filtro === e[0] ? ' selected' : '') + '>' + esc(e[1]) + '</option>';
      }).join('') + '</select></div>';

    var naoLoc = {};
    (m.naoLocalizadas || []).forEach(function (x) {
      naoLoc[String(x.ferramenta.patrimonio)] = x.porQue;
    });

    var mostradas = lista.filter(function (f) {
      if (!APP.ferr.filtro) return true;
      if (APP.ferr.filtro === 'NAO_LOCALIZADA') {
        return naoLoc[String(f.patrimonio)] !== undefined;
      }
      return raiz.LAYOUT3D.estadoDaFerramenta(f) === APP.ferr.filtro;
    });

    h += '<div class="linha"><span>Mostrando</span><b>' + mostradas.length +
      ' de ' + lista.length + '</b></div><div style="margin-top:8px">';

    for (var i = 0; i < mostradas.length && i < 60; i++) {
      var f = mostradas[i];
      var est = raiz.LAYOUT3D.estadoDaFerramenta(f);
      var semEndereco = naoLoc[String(f.patrimonio)] !== undefined;
      var cor = semEndereco ? CF.NAO_LOCALIZADA : (CF[est] || '#8A93A0');
      h += '<div class="ferCartao" data-fer="' + esc(f.patrimonio) + '">' +
        '<div class="fer-topo"><i style="background:' + cor + '"></i>' +
          '<b class="mono">' + esc(f.patrimonio) + '</b>' +
          '<span>' + esc(est.replace('_', ' ').toLowerCase()) + '</span></div>' +
        '<div class="fer-nome">' + esc(f.nome || '(sem nome)') + '</div>' +
        '<div class="small">' + esc(f.codigo || '') +
          (f.categoria ? ' · ' + esc(f.categoria) : '') + '</div>' +
        (f.com ? '<div class="linha"><span>Com</span><b>' + esc(f.com) + '</b></div>' : '') +
        (f.desde ? '<div class="linha"><span>Desde</span><b>' + esc(f.desde) + '</b></div>' : '') +
        (f.motivo ? '<div class="linha"><span>Motivo</span><b>' + esc(f.motivo) + '</b></div>' : '') +
        (semEndereco ? '<div class="small" style="color:var(--texto-3);margin-top:4px">' +
          'sem endereço: ' + esc(naoLoc[String(f.patrimonio)]) + '</div>' : '') +
      '</div>';
    }
    if (mostradas.length > 60) {
      h += '<div class="small">mostrando as 60 primeiras de ' + mostradas.length + '</div>';
    }
    h += '</div>';

    h += '<div class="sep"></div><button class="btn" id="fSair">' +
      'Voltar ao almoxarifado</button>';

    $('corpoPainel').innerHTML = h;

    var fil = $('fFiltro');
    if (fil) fil.addEventListener('change', function () {
      APP.ferr.filtro = fil.value;
      APP.pintarListaFerr();
    });
    Array.prototype.forEach.call(
      $('corpoPainel').querySelectorAll('[data-fer]'), function (el) {
        el.addEventListener('click', function () {
          APP.pintarFerramenta(el.getAttribute('data-fer'));
        });
      });
    APP.ligarSairFerr();
  };

  APP.ligarSairFerr = function () {
    var b = $('fSair');
    if (b) b.addEventListener('click', function () {
      APP.modoFerr = false;
      var bf = $('amb_ferr'), ba = $('amb_almox');
      if (bf) bf.setAttribute('aria-pressed', 'false');
      if (ba) ba.setAttribute('aria-pressed', 'true');
      APP.desenhar();
    });
  };

  /* ------------------------------------------------------------
     A FICHA DE UMA FERRAMENTA · seção 10
     ------------------------------------------------------------ */
  APP.pintarFerramenta = function (patrimonio) {
    var lista = APP.ferr.lista || [];
    var f = lista.filter(function (x) {
      return String(x.patrimonio) === String(patrimonio);
    })[0];
    if (!f) return APP.pintarListaFerr();
    APP.ferr.atual = f;
    APP.titulo('Ferramenta');

    var est = raiz.LAYOUT3D.estadoDaFerramenta(f);
    var CF = raiz.LAYOUT3D.CORES_FERRAMENTARIA;

    function semFonte(oQue) {
      return '<span class="semfonte">não integrado' + (oQue ? ' · ' + oQue : '') + '</span>';
    }

    var h =
      '<div class="linha"><span>Patrimônio</span><b class="mono">' +
        esc(f.patrimonio) + '</b></div>' +
      '<div class="linha"><span>Nome</span><b>' + esc(f.nome || '—') + '</b></div>' +
      '<div class="linha"><span>Situação</span><b><span class="chip" style="background:' +
        (CF[est] || '#8A93A0') + '">' + esc(est.replace('_', ' ')) + '</span></b></div>' +
      '<div class="linha"><span>Código</span><b class="mono">' +
        esc(f.codigo || '—') + '</b></div>' +
      '<div class="linha"><span>Categoria</span><b>' + esc(f.categoria || '—') + '</b></div>' +
      /* seção 10 pede estes. O ferramentas.listar do Core não os
         devolve hoje — então ficam escritos como não integrados, e
         não preenchidos com traço fingindo dado. */
      '<div class="linha"><span>Número de série</span><b>' +
        (f.serie || f.numeroSerie ? esc(f.serie || f.numeroSerie) : semFonte('')) + '</b></div>' +
      '<div class="linha"><span>Estado de conservação</span><b>' +
        (f.conservacao ? esc(f.conservacao) : semFonte('')) + '</b></div>' +
      '<div class="linha"><span>Responsável atual</span><b>' +
        (f.com ? esc(f.com) : (est === 'EM_POSSE' ? semFonte('') : 'na ferramentaria')) +
        '</b></div>' +
      '<div class="linha"><span>Data de retirada</span><b>' +
        (f.desde ? esc(f.desde) : semFonte('')) + '</b></div>' +
      '<div class="linha"><span>Previsão de devolução</span><b>' +
        (f.previsao || f.previsaoDevolucao
          ? esc(f.previsao || f.previsaoDevolucao) : semFonte('')) + '</b></div>' +
      (f.motivo ? '<div class="linha"><span>Motivo</span><b>' +
        esc(f.motivo) + '</b></div>' : '');

    /* as operações da seção 10, nas que o Core aceita de verdade */
    h += '<div class="sep"></div><div class="opsFer">';
    if (est === 'DISPONIVEL') {
      h += '<button class="btn primario" data-op="retirada">Registrar retirada</button>';
    }
    if (est === 'EM_POSSE') {
      h += '<button class="btn primario" data-op="devolucao">Registrar devolução</button>' +
           '<button class="btn" data-op="transferencia">Transferir</button>';
    }
    if (est === 'BLOQUEADA' || est === 'MANUTENCAO') {
      h += '<button class="btn" data-op="liberacao">Liberar equipamento</button>';
    }
    if (est !== 'BLOQUEADA') {
      h += '<button class="btn" data-op="bloqueio">Bloquear equipamento</button>';
    }
    h += '<button class="btn" id="fHist">Histórico</button>';
    h += '</div><div id="fForm"></div>';

    h += '<div class="small" style="margin-top:10px;color:var(--texto-3)">' +
      'Conferir ferramenta, identificar avaria e solicitar manutenção entram ' +
      'como observação da movimentação — é o que o Core aceita hoje. Não ' +
      'inventei ação que ele não tem.</div>';

    h += '<div class="sep"></div><button class="btn" id="fVoltar">Voltar à lista</button>';

    $('corpoPainel').innerHTML = h;

    Array.prototype.forEach.call(
      $('corpoPainel').querySelectorAll('[data-op]'), function (b) {
        b.addEventListener('click', function () {
          APP.formOperacao(f, b.getAttribute('data-op'));
        });
      });
    var hist = $('fHist');
    if (hist) hist.addEventListener('click', function () {
      APP.pintarHistoricoFer(f.patrimonio);
    });
    var volta = $('fVoltar');
    if (volta) volta.addEventListener('click', function () { APP.pintarListaFerr(); });
  };

  APP.ROTULO_OP = {
    retirada: 'Registrar retirada', devolucao: 'Registrar devolução',
    transferencia: 'Transferir', liberacao: 'Liberar equipamento',
    bloqueio: 'Bloquear equipamento'
  };

  APP.CONDICOES = ['Boa', 'Com desgaste', 'Avaria leve', 'Avaria grave',
                   'Precisa de manutenção', 'Precisa de calibração'];

  APP.formOperacao = function (f, tipo) {
    var cx = $('fForm');
    if (!cx) return;
    var h = '<div class="confCx">' +
      '<div class="linha"><span>Operação</span><b>' +
        esc(APP.ROTULO_OP[tipo] || tipo) + '</b></div>' +
      '<div class="linha"><span>Patrimônio</span><b class="mono">' +
        esc(f.patrimonio) + '</b></div>';

    if (tipo === 'retirada' || tipo === 'transferencia') {
      h += '<div class="campo"><label for="fQuem">Para quem</label>' +
        '<input id="fQuem" type="text" autocomplete="off" ' +
        'placeholder="nome de quem fica com a ferramenta"></div>';
    }
    if (tipo === 'devolucao' || tipo === 'liberacao') {
      h += '<div class="campo"><label for="fCond">Condição</label>' +
        '<select id="fCond">' + APP.CONDICOES.map(function (c) {
          return '<option>' + esc(c) + '</option>';
        }).join('') + '</select></div>';
    }
    h += '<div class="campo"><label for="fObs">Observação</label>' +
      '<input id="fObs" type="text" placeholder="o que precisa ficar registrado"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn primario" id="fOk">Enviar ao Core</button>' +
        '<button class="btn" id="fCancela">Cancelar</button></div>' +
      '<div class="small" style="margin-top:8px;color:var(--texto-3)">' +
      'Só aparece como feito depois que o Core confirmar.</div>' +
    '</div>';
    cx.innerHTML = h;

    var cancelar = $('fCancela');
    if (cancelar) cancelar.addEventListener('click', function () { cx.innerHTML = ''; });

    var ok = $('fOk');
    if (ok) ok.addEventListener('click', function () {
      ok.disabled = true;
      ok.textContent = 'Enviando…';
      var cond = $('fCond') ? $('fCond').value : '';
      var obs = $('fObs') ? $('fObs').value : '';
      /* o payload é o do próprio sistema dele, lido do index.html */
      var pedido = {
        patrimonio: f.patrimonio,
        tipo: tipo,
        quem: $('fQuem') ? $('fQuem').value : '',
        obs: obs || cond,
        avaria: /Avaria grave/.test(cond)
      };
      APP.ferrChamar('movimentar', pedido).then(function (r) {
        if (!r || !r.ok) {
          cx.insertAdjacentHTML('beforeend',
            '<div class="aviso erro"><b>O Core recusou.</b><br>' +
            esc((r && r.mensagem) || 'sem resposta') +

  /* ============================================================
     [F6] FASE 6 · 14/11 · INTELIGÊNCIA E INDICADORES
     ------------------------------------------------------------
     Mapa de calor, visão explodida, rota otimizada, painel de
     indicadores, modo de apresentação e exportação.

     Os números de ocupação saem da MESMA montagem que pinta o 3D.
     Os de produtividade saem do módulo invmovel, que é onde as
     conferências ficam. Nenhum número é estimado: o que não tem
     fonte aparece escrito como não integrado.
     ============================================================ */

  /* ============================================================
     [V] VERSÃO E PUBLICAÇÃO · seção 2 do prompt de 15/11
     ------------------------------------------------------------
     A QUEIXA: "a versão atualizada não está sendo exibida no
     computador, que continua abrindo uma versão anterior".

     A CAUSA, que eu encontrei olhando o arquivo: não havia NADA
     na tela dizendo qual versão estava rodando. As camadas diziam
     "08/11" por dentro e o título dizia outra coisa. Sem carimbo
     visível, não há como saber se o que abriu é o novo ou o
     velho — e o GitHub Pages serve do cache por bastante tempo.

     O que entra aqui:
       · a versão e a data, SEMPRE visíveis na barra;
       · o ambiente: produção, demonstração ou local;
       · um verificador que busca o PRÓPRIO arquivo no servidor,
         furando o cache, e compara a versão de lá com a que está
         rodando. Se forem diferentes, avisa que a tela está
         velha e oferece recarregar limpo;
       · a conferência entre as camadas: se layout, adaptador,
         motor, construtor e app não forem da mesma versão, isso
         aparece — é o sintoma de meio arquivo atualizado.

     O que NÃO entra: nenhuma promessa de que publicar deu certo.
     Salvar o arquivo não é publicar, e publicar não é o
     navegador ter recebido.
     ============================================================ */
  APP.VERSAO = '6.9.0';
  APP.COMPILADO = '2026-11-15';
  APP.CARIMBO = 'ALMOXA 3D ' + APP.VERSAO + ' · ' + APP.COMPILADO;

  APP.ambienteDePublicacao = function () {
    var onde = '';
    try { onde = String(location.href || ''); } catch (e) {}
    if (/^file:/.test(onde)) return { chave: 'LOCAL', texto: 'arquivo local' };
    if (/127\.0\.0\.1|localhost/.test(onde)) return { chave: 'LOCAL', texto: 'local' };
    if (/\/exec/.test(onde)) return { chave: 'PRODUCAO', texto: 'Apps Script' };
    if (/github\.io/.test(onde)) return { chave: 'PRODUCAO', texto: 'GitHub Pages' };
    return { chave: 'DESCONHECIDO', texto: 'origem desconhecida' };
  };

  /* as cinco camadas têm de ser da mesma safra */
  APP.conferirCamadas = function () {
    var v = {
      layout: raiz.LAYOUT3D && raiz.LAYOUT3D.VERSAO,
      adaptador: raiz.API3D && raiz.API3D.versao,
      motor: raiz.MOTOR3D && raiz.MOTOR3D.versao,
      construtor: raiz.CONSTRUTOR3D && raiz.CONSTRUTOR3D.versao,
      app: APP.VERSAO
    };
    var faltando = [];
    for (var k in v) if (v.hasOwnProperty(k) && !v[k]) faltando.push(k);
    return { versoes: v, faltando: faltando };
  };

  /* busca o próprio arquivo no servidor furando o cache e compara.
     É a única maneira honesta de saber se a tela está velha: não
     adianta eu dizer "está atualizado" só porque a constante aqui
     dentro diz isso — essa constante veio junto com o arquivo
     velho, se ele for o velho. */
  APP.verificarAtualizacao = function () {
    var alvo = '';
    try {
      alvo = String(location.href).split('#')[0].split('?')[0] +
             '?semcache=' + Date.now();
    } catch (e) {
      return Promise.resolve({ ok: false, motivo: 'não sei o meu próprio endereço' });
    }
    if (/^file:/.test(alvo)) {
      return Promise.resolve({ ok: false,
        motivo: 'arquivo aberto direto do disco: não há servidor para comparar' });
    }
    return fetch(alvo, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('o servidor respondeu ' + r.status);
        return r.text();
      })
      .then(function (texto) {
        var m = texto.match(/APP\.VERSAO\s*=\s*'([^']+)'/);
        var d = texto.match(/APP\.COMPILADO\s*=\s*'([^']+)'/);
        if (!m) {
          return { ok: false,
            motivo: 'baixei o arquivo mas não achei a versão dentro dele' };
        }
        return { ok: true, noServidor: m[1], compiladoNoServidor: d ? d[1] : '',
                 rodando: APP.VERSAO,
                 igual: m[1] === APP.VERSAO };
      })
      .catch(function (e) {
        return { ok: false, motivo: String((e && e.message) || e) };
      });
  };

  APP.recarregarLimpo = function () {
    try {
      var base = String(location.href).split('#')[0].split('?')[0];
      location.replace(base + '?v=' + Date.now());
    } catch (e) {
      try { location.reload(true); } catch (e2) {}
    }
  };

  APP.pintarVersao = function () {
    var el = $('v_versao');
    if (!el) return;
    var amb = APP.ambienteDePublicacao();

      '<div class="linha"><span>Compilada em</span><b>' + esc(APP.COMPILADO) + '</b></div>' +
      '<div class="linha"><span>Ambiente</span><b>' + esc(amb.texto) + '</b></div>' +
      '<div class="linha"><span>Endereço</span><b class="mono peq" ' +
        'style="word-break:break-all">' + esc(String(location.href).split('?')[0]) +
        '</b></div>';

    h += '<div class="sep"></div><b style="font-size:12.5px">As cinco camadas</b>' +
      '<div style="margin-top:6px">';
    for (var k in c.versoes) if (c.versoes.hasOwnProperty(k)) {

        esc(c.faltando.join(', ')) + '. Como o arquivo é um só, isso não quer ' +

    }

    h += '<div class="sep"></div>' +
      '<div id="vResultado"><div class="small" style="color:var(--texto-3)">' +
      'O botão abaixo baixa este mesmo arquivo do servidor, furando o cache, ' +
      'e compara a versão de lá com a que está rodando aqui. É a única ' +
      'maneira de saber se a tela está velha.</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
        '<button class="btn primario" id="vVerificar">Verificar atualização</button>' +
        '<button class="btn" id="vRecarregar">Recarregar limpo</button>' +

    var bv = $('vVerificar');
    if (bv) bv.addEventListener('click', function () {

      APP.verificarAtualizacao().then(function (r) {

        if (!r.ok) {
          cx.innerHTML = '<div class="aviso"><b>Não consegui comparar.</b><br>' +
            esc(r.motivo) + '<div class="small" style="margin-top:6px">Isto NÃO ' +

          return;
        }
        cx.innerHTML = r.igual
          ? '<div class="aviso" style="border-color:#BFE3CC;background:#F0FAF4;' +
            'color:#1E5F3A"><b>Esta é a versão que está no servidor.</b><br>' +
            'rodando ' + esc(r.rodando) + ' · no servidor ' + esc(r.noServidor) +
            '</div>'
          : '<div class="aviso erro"><b>A tela está velha.</b><br>' +
            'O servidor tem a versão <b>' + esc(r.noServidor) + '</b>' +
            (r.compiladoNoServidor ? ' (de ' + esc(r.compiladoNoServidor) + ')' : '') +
            ' e aqui está rodando a <b>' + esc(r.rodando) + '</b>.<br>' +
            'Use “Recarregar limpo”.</div>';
      });
    });

    var br = $('vRecarregar');
    if (br) br.addEventListener('click', function () { APP.recarregarLimpo(); });

    var bs = $('vSair');
    if (bs) bs.addEventListener('click', function () { APP.pintarResumo(); });
  };

          (r.codigo ? '<div class="small">código: ' + esc(r.codigo) + '</div>' : '') +

  APP.montarRelatorio = function () {
    var c = raiz.LAYOUT3D.calor(raiz.LAYOUT3D.montar(APP.locais || []));
    var agora = new Date();
    var L = [];
    L.push('ALMOX PRO 3D — relatório de ocupação');
    L.push('Gerado em ' + agora.toLocaleString('pt-BR'));
    L.push('');
    if (!c.ok) {
      L.push('Não há posições desenhadas. Nada a relatar.');
    } else {
      L.push('GALPÃO');
      L.push('posições;' + c.galpao.total);
      L.push('com material;' + c.galpao.ocupadas);
      L.push('vazias;' + c.galpao.vazias);
      L.push('bloqueadas;' + c.galpao.bloqueadas);
      L.push('ocupacao_pct;' + c.galpao.ocupacaoPct);
      L.push('');
      L.push('POR RUA');
      L.push('rua;total;uteis;ocupadas;vazias;bloqueadas;ocupacao_pct;faixa');
      for (var i = 0; i < c.ruas.length; i++) {
        var r = c.ruas[i];
        L.push([r.nome, r.total, r.uteis, r.ocupadas, r.vazias, r.bloqueadas,
                r.ocupacaoPct, r.faixa].join(';'));
      }
      L.push('');
      L.push('POR ESTANTE');
      L.push('estante;total;uteis;ocupadas;vazias;bloqueadas;ocupacao_pct;faixa');
      for (var e = 0; e < c.estantes.length; e++) {
        var es = c.estantes[e];
        L.push([es.nome, es.total, es.uteis, es.ocupadas, es.vazias, es.bloqueadas,
                es.ocupacaoPct, es.faixa].join(';'));
      }
    }
    L.push('');
    L.push('A ocupação exclui as posições bloqueadas do denominador.');
    L.push('Números calculados dos mesmos endereços que desenham o mapa.');
    return L.join('\n');
  };

  APP.baixar = function (nome, conteudo, tipo) {
    try {
      var b = new Blob([conteudo], { type: tipo || 'text/plain;charset=utf-8' });
      var u = URL.createObjectURL(b);
      var a = document.createElement('a');
      a.href = u; a.download = nome;
      document.body.appendChild(a); a.click();
      setTimeout(function () {
        document.body.removeChild(a); URL.revokeObjectURL(u);
      }, 400);
      return true;
    } catch (e) { return false; }
  };

  APP.ligarIndicadores = function () {
    var rel = $('indRelatorio');
    if (rel) rel.addEventListener('click', function () {
      var d = new Date();
      var nome = 'almoxa3d-ocupacao-' + d.getFullYear() +
        ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.csv';
      if (!APP.baixar(nome, APP.montarRelatorio(), 'text/csv;charset=utf-8')) {
        rel.insertAdjacentHTML('afterend',
          '<div class="aviso erro">Não consegui gerar o arquivo neste navegador.</div>');
      }
    });

    var foto = $('indFoto');
    if (foto) foto.addEventListener('click', function () {
      var dados = '';
      try { dados = raiz.MOTOR3D.foto(); } catch (e) { dados = ''; }
      if (!dados) {
        foto.insertAdjacentHTML('afterend',
          '<div class="aviso erro" style="margin-top:8px"><b>Não consegui a imagem.</b> ' +
          'O 3D precisa estar desenhado para virar foto. Não vou salvar ' +
          'arquivo vazio.</div>');
        return;
      }
      var a = document.createElement('a');
      a.href = dados; a.download = 'almoxa3d-galpao.png';
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); }, 400);
    });

    var sair = $('indSair');
    if (sair) sair.addEventListener('click', function () {
      APP.modoIndicadores = false;
      APP.pintarResumo();
    });
  };

  /* ------------------------------------------------------------
     MODO DE APRESENTAÇÃO · seção 11
     ------------------------------------------------------------ */
  APP.apresentar = function (ligar) {
    APP.vista.apresentando = !!ligar;
    var app = $('app');
    if (!app) return;
    if (ligar) app.classList.add('apresentando');
    else app.classList.remove('apresentando');
    var b = $('v_apresentar');
    if (b) {
      b.setAttribute('aria-pressed', ligar ? 'true' : 'false');
      b.textContent = ligar ? 'Sair da apresentação' : 'Apresentar';
    }
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
  };

  APP.iniciar = function (opcoes) {
    opcoes = opcoes || {};

    /* [F1] 14/11 — a casca liga ANTES do motor.

       Antes, se o Babylon não carregasse (CDN fora do ar, coletor sem
       rede, proxy da obra barrando o jsdelivr), o return aqui embaixo
       matava a tela inteira: barra, painel e busca nem chegavam a ser
       ligados. Para um módulo que precisa rodar em coletor, isso é
       tela preta por causa de um arquivo de fora.

       Agora os controles de tela ligam primeiro. Se o motor falhar, o
       que morre é o 3D — e aparece escrito o porquê. O resto continua
       de pé. */
    APP.ligarControlesDaFase1();

    try {
      raiz.MOTOR3D.iniciar($('tela3d'), { fundo: opcoes.fundo });
    } catch (err) {
      APP.motorCaiu = true;
      APP.conexao('caido', '3D não iniciou', String(err && err.message || err));
      $('corpoPainel').innerHTML = '<div class="aviso erro"><b>O 3D não iniciou.</b><br>' +
        esc(err && err.message ? err.message : String(err)) +
        '<br><br>O desenho do galpão depende do Babylon.js, que é carregado da ' +
        'internet. O resto da tela continua funcionando.</div>';
      return;
    }

    raiz.MOTOR3D.aoSelecionar = function (p) { APP.pintarPosicao(p); };

    /* os botões de visão */
    var visoes = ['perspectiva', 'superior', 'frontal', 'lateral'];
    visoes.forEach(function (v) {
      var b = $('v_' + v);
      if (!b) return;
      b.addEventListener('click', function () {
        raiz.MOTOR3D.visao(v, APP.montagem && APP.montagem.galpao);
        visoes.forEach(function (o) {
          var bo = $('v_' + o);
          if (bo) bo.setAttribute('aria-pressed', o === v ? 'true' : 'false');
        });
      });
    });
    var rec = $('v_recarregar');
    if (rec) rec.addEventListener('click', function () { APP.carregar(); });

    /* o construtor de galpão · seção 4, etapa 1 */
    var con = $('v_construir');
    if (con && raiz.CONSTRUTOR3D) {
      con.addEventListener('click', function () {
        raiz.CONSTRUTOR3D.alternar();
        con.setAttribute('aria-pressed', raiz.CONSTRUTOR3D.aberto ? 'true' : 'false');
        con.textContent = raiz.CONSTRUTOR3D.aberto ? 'Fechar construtor' : 'Construir estante';
      });
    }

    /* ========================================================
       [F1] FASE 1 · 14/11 · os controles novos da barra.
       Nenhum deles conversa com o Core: são tela. A busca anda
       no que APP.montagem já tem na memória.
       Ligados lá em cima, antes do motor, de propósito.
       ======================================================== */

    return APP.carregar();
  };


  /* ----------------------------------------------------------
     [F1] BUSCA · seção 4 "Pesquisa de endereço, código ou material"

     Procura nas posições JÁ carregadas. Não cria consulta nova ao
     Core: o prompt proíbe inventar endpoint, e nesta fase não há
     endpoint de busca para chamar. Materiais ainda não entram na
     busca porque a lista do que está guardado em cada posição
     ainda não é lida de lugar nenhum — e procurar no que eu não
     tenho seria prometer resultado vazio como se fosse resposta.
     ---------------------------------------------------------- */
  APP.posicoesCarregadas = function () {
    var m = APP.montagem;
    if (!m) return [];
    if (Object.prototype.toString.call(m.posicoes) === '[object Array]') return m.posicoes;
    return (m.pecas || []).filter(function (p) { return p && p.codigo; });
  };

  APP.buscar = function (termo) {
    var t = String(termo || '').trim().toUpperCase();
    if (!t) return [];
    var achados = [];
    var lista = APP.posicoesCarregadas();
    for (var i = 0; i < lista.length && achados.length < 40; i++) {
      var p = lista[i];
      var alvo = [p.codigo, p.rua, p.estante, p.prateleira, p.posicao]
        .map(function (v) { return v == null ? '' : String(v).toUpperCase(); })
        .join(' ');
      if (alvo.indexOf(t) > -1) achados.push(p);
    }
    return achados;
  };

  APP.pintarAchados = function (termo, achados) {
    var conta = $('v_buscaConta');
    if (conta) {
      if (!termo) { conta.hidden = true; }
      else { conta.hidden = false; conta.textContent = achados.length; }
    }
    if (!termo) { APP.pintarResumo(); return; }

    var html = '<div class="linha"><span>Procurei por</span><b>' + esc(termo) + '</b></div>';
    if (!achados.length) {
      html += '<div class="vazio">Nenhum endereço carregado casa com isso.<br>' +
        'A busca olha os ' + APP.posicoesCarregadas().length +
        ' endereços que estão desenhados agora.</div>';
    } else {
      html += '<div class="linha"><span>Encontrei</span><b>' + achados.length +
        ' endereço(s)</b></div><div style="margin-top:10px">';
      for (var i = 0; i < achados.length; i++) {
        var p = achados[i];
        html += '<div class="achado" data-ir="' + esc(p.codigo) + '">' +
          '<b>' + esc(p.codigo) + '</b>' +
          '<span>rua ' + esc(p.rua) + ' · est ' + esc(p.estante) +
          ' · prat ' + esc(p.prateleira) + '</span></div>';
      }
      html += '</div>';
    }
    $('corpoPainel').innerHTML = html;
    APP.titulo('Busca');

    Array.prototype.forEach.call(
      $('corpoPainel').querySelectorAll('[data-ir]'), function (el) {
        el.addEventListener('click', function () {
          var cod = el.getAttribute('data-ir');
          try { raiz.MOTOR3D.selecionarPorCodigo(cod); } catch (e) {}
        });
      });
  };

  /* ----------------------------------------------------------
     [F1] INDICADOR DE CONEXÃO · seção 4

     Mostra o estado de verdade do adaptador. Quatro estados, e
     nenhum deles é otimista por conta própria: "verificando" só
     vira "ligado" depois de uma leitura que deu certo.
     ---------------------------------------------------------- */
  /* [F1] o <h2> do painel agora tem o botão de recolher dentro.
     textContent apagaria o botão junto — então troco só o texto. */
  APP.titulo = function (txt) {
    var h = $('tituloPainel');
    if (!h) return;
    var no = h.firstChild;
    if (no && no.nodeType === 3) no.nodeValue = txt;
    else h.insertBefore(document.createTextNode(txt), h.firstChild);
  };

  APP.conexao = function (estado, texto, dica) {
    var el = $('v_conexao');
    if (!el) return;
    el.className = 'pino ' + estado;
    var b = el.querySelector('b');
    if (b) b.textContent = texto;
    el.setAttribute('title', dica || texto);
  };

  APP.ligarControlesDaFase1 = function () {
    /* busca */
    var cx = $('v_busca');
    if (cx) {
      var relogio = null;
      cx.addEventListener('input', function () {
        clearTimeout(relogio);
        relogio = setTimeout(function () {
          var t = cx.value;
          APP.pintarAchados(t, APP.buscar(t));
        }, 160);
      });
      cx.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { cx.value = ''; APP.pintarAchados('', []); }
      });
    }

    /* tela cheia · seção 4 */
    var tc = $('v_telacheia');
    if (tc) {
      tc.addEventListener('click', function () {
        var d = document, el = d.documentElement;
        try {
          if (!d.fullscreenElement && !d.webkitFullscreenElement) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          } else {
            (d.exitFullscreen || d.webkitExitFullscreen).call(d);
          }
        } catch (e) {}
      });
      document.addEventListener('fullscreenchange', function () {
        var cheia = !!document.fullscreenElement;
        tc.setAttribute('aria-pressed', cheia ? 'true' : 'false');
        tc.textContent = cheia ? 'Sair da tela cheia' : 'Tela cheia';
      });
    }

    /* painel recolhível · seção 4 */
    var app = $('app'), fechar = $('v_fecharPainel'), puxar = $('puxador');
    function mostrarPainel(mostrar) {
      if (!app) return;
      if (mostrar) app.classList.remove('painel-fechado');
      else app.classList.add('painel-fechado');
      if (puxar) puxar.setAttribute('aria-expanded', mostrar ? 'true' : 'false');
      /* o Babylon precisa saber que a área mudou de tamanho */
      try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    }
    if (fechar) fechar.addEventListener('click', function () { mostrarPainel(false); });
    if (puxar) puxar.addEventListener('click', function () { mostrarPainel(true); });

    /* [F3] rota e minimapa */
    var br = $('v_rota');
    if (br) br.addEventListener('click', function () {
      if (APP.modoRota) { APP.modoRota = false; br.setAttribute('aria-pressed', 'false');
                          APP.pintarResumo(); }
      else { br.setAttribute('aria-pressed', 'true'); APP.pintarRota(); }
    });

    var bm = $('v_minimapa');
    if (bm) bm.addEventListener('click', function () {
      var el = $('minimapa');
      if (!el) return;
      el.hidden = !el.hidden;
      bm.setAttribute('aria-pressed', el.hidden ? 'false' : 'true');
      if (!el.hidden) APP.pintarMinimapa(APP.rotaCalculada());
    });

    /* [G] 15/11 · qualidade gráfica. Trocar o nível derruba o cache
       de geometria e redesenha com o MESMO dado — nenhuma informação
       muda, só quanto detalhe cada peça tem. */
    var bq = $('v_qualidade');
    if (bq) {
      try {
        /* [15/11] o celular entra em qualidade média porque o ALMOXA
           CAMPO abre o mapa com ?qualidade=medio. A URL manda na
           primeira vez; depois vale o que o próprio usuário escolheu
           aqui, que fica guardado no aparelho. */
        var daUrl = '';
        try { daUrl = new URLSearchParams(location.search).get('qualidade') || ''; }
        catch (e0) { daUrl = ''; }
        var guardada = raiz.localStorage && raiz.localStorage.getItem('almoxa3d:qualidade');
        var escolhida = guardada || daUrl;
        if (escolhida && raiz.MOTOR3D && raiz.MOTOR3D.definirQualidade(escolhida)) {
          bq.value = escolhida;
          if (daUrl && !guardada) {
            try { raiz.localStorage.setItem('almoxa3d:qualidade', escolhida); } catch (e1) {}
          }
        } else if (raiz.MOTOR3D) {
          bq.value = raiz.MOTOR3D.qualidade;
        }
      } catch (e) { if (raiz.MOTOR3D) bq.value = raiz.MOTOR3D.qualidade; }

      bq.addEventListener('change', function () {
        if (!raiz.MOTOR3D || !raiz.MOTOR3D.definirQualidade(bq.value)) {
          bq.value = raiz.MOTOR3D ? raiz.MOTOR3D.qualidade : 'alto';
          return;
        }
        try {
          if (raiz.localStorage)
            raiz.localStorage.setItem('almoxa3d:qualidade', bq.value);
        } catch (e2) {}
        if (APP.montagem && raiz.MOTOR3D.desenhar) {
          raiz.MOTOR3D.desenhar(APP.montagem);
        }
      });
    }

    /* [V] a versão fica sempre na barra, e clicar abre o painel */
    APP.pintarVersao();
    var bver = $('v_versao');
    if (bver) bver.addEventListener('click', function () { APP.pintarPublicacao(); });

    /* [RAST] rastreio por colaborador */
    var brs = $('v_rastreio');
    if (brs) brs.addEventListener('click', function () {
      if (APP.modoRastreio) {
        APP.modoRastreio = false;
        brs.setAttribute('aria-pressed', 'false');
        APP.pintarResumo();
      } else {
        brs.setAttribute('aria-pressed', 'true');
        APP.pintarRastreio();
      }
    });

    /* [F6] calor, explodir, indicadores, apresentação */
    var bc = $('v_calor');
    if (bc) bc.addEventListener('click', function () {
      APP.vista.calor = !APP.vista.calor;
      bc.setAttribute('aria-pressed', APP.vista.calor ? 'true' : 'false');
      APP.redesenharComVista();
      if (APP.vista.calor && !APP.modoIndicadores) APP.pintarIndicadores();
    });

    var be = $('v_explodir');
    if (be) be.addEventListener('click', function () {
      APP.vista.explodida = APP.vista.explodida > 0 ? 0 : 1;
      be.setAttribute('aria-pressed', APP.vista.explodida ? 'true' : 'false');
      APP.redesenharComVista();
    });

    var bind = $('v_indicadores');
    if (bind) bind.addEventListener('click', function () { APP.pintarIndicadores(); });

    var bap = $('v_apresentar');
    if (bap) bap.addEventListener('click', function () {
      APP.apresentar(!APP.vista.apresentando);
    });

    /* [F4] inventário móvel */
    var bf = $('v_frente');
    if (bf) bf.addEventListener('click', function () {
      if (APP.modoFrente) {
        APP.modoFrente = false;
        bf.setAttribute('aria-pressed', 'false');
        APP.pintarResumo();
      } else {
        APP.modoFrente = true;
        bf.setAttribute('aria-pressed', 'true');
        APP.pintarFrente();
      }
    });

    var ba2 = $('v_acomp');
    if (ba2) ba2.addEventListener('click', function () {
      if (APP.modoAcomp) {
        APP.modoAcomp = false;
        ba2.setAttribute('aria-pressed', 'false');
        APP.pintarResumo();
      } else {
        APP.modoAcomp = true;
        ba2.setAttribute('aria-pressed', 'true');
        APP.pintarAcompanhamento();
      }
    });

    var bi = $('v_inv');
    if (bi) bi.addEventListener('click', function () {
      if (APP.modoInv) {
        APP.modoInv = false; APP.pararLeitor();
        bi.setAttribute('aria-pressed', 'false');
        APP.pintarResumo();
      } else {
        bi.setAttribute('aria-pressed', 'true');
        APP.pintarInventario();
      }
    });

    /* [F5] o seletor de ambiente agora troca de verdade */
    var ferr = $('amb_ferr'), almox = $('amb_almox');
    if (ferr) ferr.addEventListener('click', function () {
      ferr.setAttribute('aria-pressed', 'true');
      if (almox) almox.setAttribute('aria-pressed', 'false');
      APP.modoRota = false; APP.modoInv = false;
      APP.pararLeitor();
      APP.pintarFerramentaria();
    });
    if (almox) almox.addEventListener('click', function () {
      almox.setAttribute('aria-pressed', 'true');
      if (ferr) ferr.setAttribute('aria-pressed', 'false');
      APP.modoFerr = false;
      APP.desenhar();
    });
  };

  raiz.APP3D = APP;
  if (typeof module !== 'undefined' && module.exports) module.exports = APP;

})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* ============================================================
   CONFIGURAÇÃO DE AMBIENTE
   ------------------------------------------------------------
   No Apps Script não precisa de nada: o adaptador acha o
   google.script.run sozinho.

   No GitHub Pages, o endereço do /exec pode vir de três lugares,
   nesta ordem — e nenhum deles é "escrito no código":

     1. ?core=<url> na barra de endereço
     2. o que ficou guardado no navegador de quem já configurou
     3. nada: aí a tela mostra um galpão de DEMONSTRAÇÃO e
        avisa, em vez de ficar preta

   Guardar no navegador é conveniência de quem usa, não fonte
   oficial de nada: quem decide o que pode ser feito é o Core.
   ============================================================ */
(function () {
  function acharUrlDoCore() {
    try {
      var q = new URLSearchParams(location.search).get('core');
      if (q) {
        try { localStorage.setItem('almoxa3d:core', q); } catch (e) {}
        return q;
      }
    } catch (e) {}
    try { return localStorage.getItem('almoxa3d:core') || ''; } catch (e) { return ''; }
  }

  /* [EMBUTIDO] o aplicativo abre o mapa com &embutido=1 */
  (function () {
    try {
      if (new URLSearchParams(location.search).get('embutido') === '1') {
        document.body.classList.add('embutido');
      }
    } catch (e) {}
  })();

  /* [EMBUTIDO] 15/11 · O MAPA DIZ "CHEGUEI"
     ------------------------------------------------------------
     Quando o ALMOXA CAMPO mostra esta página dentro dele, ele não
     consegue olhar aqui para dentro — página de outro endereço não
     se deixa ler, e ainda bem. O evento "load" da moldura não serve
     de sinal: o navegador dispara ele TAMBÉM quando mostra a
     própria página de erro. Era assim que o aplicativo achava que
     tinha carregado quando não tinha.

     Então eu aviso. Uma linha, sem segredo nenhum dentro. */
  (function () {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ almoxa3d: 'pronto' }, '*');
      }
    } catch (e) {}
  })();

  function comecar() {
    if (typeof BABYLON === 'undefined') {
      /* [F1] 14/11 — a biblioteca de fora não derruba a tela toda.

         Antes esta guarda devolvia aqui e pronto: barra, busca e
         painel nunca eram ligados, e a página virava um aviso só.
         O Babylon é o DESENHO; a casca não depende dele. Então
         ligo a casca, aviso o que falta, e paro só o 3D. */
      try { window.APP3D.ligarControlesDaFase1(); } catch (e) {}
      try {
        window.APP3D.conexao('caido', '3D não iniciou',
          'o Babylon.js não carregou nesta máquina');
      } catch (e) {}
      document.getElementById('corpoPainel').innerHTML =
        '<div class="aviso erro"><b>O Babylon.js não carregou.</b><br>' +
        'Confira a conexão. Se esta página estiver dentro do Apps Script, ' +
        'veja em IMPLANTACAO.md como embutir a biblioteca.' +
        '<br><br>O desenho do galpão depende dessa biblioteca, que vem da ' +
        'internet. O resto da tela continua funcionando.</div>';
      return;
    }
    if (window.API3D) {
      window.API3D.configurar({ url: acharUrlDoCore() });
      /* A chave NÃO está escrita aqui e não vem pelo endereço.
         Ela é perguntada ao próprio ALMOX PRO, que é servido
         pelo mesmo endereço que esta página. Se não houver, vai
         vazia: fase 1 não pode bloquear a comunicação, e se o
         Core recusar, quem explica é a resposta dele. */
      window.API3D.herdarChave();
    }
    window.APP3D.iniciar({});
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', comecar);
  } else { comecar(); }
})();
</script>
