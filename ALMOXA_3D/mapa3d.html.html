      if (typeof location !== 'undefined' && /github\.io$/i.test(location.hostname)) {
        return 'GITHUB_PAGES';
      }
    } catch (e) { }
    return 'NAVEGADOR';
  };

  A.configurar = function (opcoes) {
    opcoes = opcoes || {};
    if (opcoes.url !== undefined) A.url = String(opcoes.url || '').trim();
    if (opcoes.chave !== undefined) {
      A.chave = String(opcoes.chave || '').trim();
      A.origemDaChave = A.chave ? 'informada na configuração' : 'nenhuma (fase 1)';
    }
    if (opcoes.sessao !== undefined) A.sessao = opcoes.sessao;
    if (opcoes.tempoLimite) A.tempoLimite = Number(opcoes.tempoLimite) || A.tempoLimite;
    return A.estado();
  };

  A.estado = function () {
    return {
      ambiente: A.ambiente(),
      temUrl: !!A.url,
      temChave: !!A.chave,           /* se TEM, não QUAL. */
      origemDaChave: A.origemDaChave,
      porSistema: A.temPortaDoSistema(),
      origemDaPorta: A.origemDaPorta,
      pronto: A.pronto(),
      chamadas: A.chamadas,
      falhas: A.falhas
    };
  };

  /* ------------------------------------------------------------
     PERGUNTAR AO SISTEMA QUAL É A CHAVE

     Três lugares, nesta ordem, e todos do MESMO endereço — se o
     mapa estiver noutro domínio, o navegador barra e a função
     devolve vazio, que é o certo. Nenhum deles é "escrito no
     código" e nenhum deles é criado por este módulo: os três
     pertencem ao ALMOX PRO, que continua sendo o dono da chave.
     ------------------------------------------------------------ */
  A.chaveDoSistema = function () {
    /* 1 · dentro do quadro do sistema: pergunta direto a ele.
           É o valor VIVO, o mesmo que ele está usando agora. */
    try {
      if (window.parent && window.parent !== window &&
          window.parent.API && window.parent.API.PONTE) {
        var k = String(window.parent.API.PONTE.chave || '').trim();
        if (k) return { chave: k, origem: 'o sistema, pelo quadro' };
      }
    } catch (e) { /* origem diferente: o navegador barrou, e tudo bem */ }

    /* 2 · aberto em tela cheia a partir do sistema */
    try {
      if (window.opener && window.opener.API && window.opener.API.PONTE) {
        var o = String(window.opener.API.PONTE.chave || '').trim();
        if (o) return { chave: o, origem: 'o sistema, pela aba de origem' };
      }
    } catch (e) {}

    /* 3 · o depósito que o PRÓPRIO ALMOX PRO mantém neste
           navegador. Só leitura: este módulo nunca escreve aqui. */
    try {
      var g = String(localStorage.getItem('almoxa_app_chave_digitada') || '').trim();
      if (g) return { chave: g, origem: 'a que foi digitada neste navegador' };
    } catch (e) {}

    return { chave: '', origem: 'nenhuma (fase 1)' };
  };

  /* ------------------------------------------------------------
     A PORTA DO SISTEMA

     Devolve a função de chamada do ALMOX PRO, quando o mapa está
     rodando dentro dele e no mesmo endereço. Devolve nada quando
     não está — e aí o mapa usa o caminho próprio, que é o de
     sempre e continua valendo para o Apps Script.

     Note que NÃO se copia sessão, perfil nem obra para cá. Não
     se lê token nenhum. Pede-se ao sistema que faça a chamada
     dele; o que trafega é o resultado.
     ------------------------------------------------------------ */
  /* ============================================================
     [PONTE] 15/11 · O MAPA DENTRO DO APLICATIVO NÃO TINHA SESSÃO
     ------------------------------------------------------------
     Quando o ALMOXA CAMPO mostra este mapa numa moldura, as duas
     páginas são de origens diferentes. O mapa NÃO consegue alcançar
     o API do aplicativo (o navegador barra, e ainda bem), então
     ele caía no caminho de fora: montar o próprio envelope com o
     endereço do /exec e NENHUMA SESSÃO. Resultado: o galpão dele
     não carregava dentro do aplicativo.

     A saída não é mandar a sessão para cá — isso seria uma segunda
     sessão, e token em página de outro domínio é exatamente o que
     não se faz. A saída é o mapa PEDIR, e quem executa ser o
     aplicativo, com a sessão que ele já tem autenticada.

     Cada pedido leva um número. A resposta volta com o mesmo
     número, pela mesma janela. O mapa não guarda credencial
     nenhuma, não sabe o token, e não tem como saber.
     ============================================================ */
  A.ponte = { ligada: false, proximo: 1, esperando: {}, origemPai: '' };

  A.ligarPonte = function () {
    if (A.ponte.ligada) return true;
    var embutido = false;
    try {
      embutido = new URLSearchParams(location.search).get('embutido') === '1';
    } catch (e) { embutido = false; }
    if (!embutido) return false;
    try { if (!window.parent || window.parent === window) return false; }
    catch (e2) { return false; }

    window.addEventListener('message', function (ev) {
      var d = ev && ev.data;
      if (!d || d.almoxa3d !== 'resposta') return;
      /* só aceito resposta da janela que me mostrou */
      try { if (ev.source !== window.parent) return; } catch (e3) { return; }
      var espera = A.ponte.esperando[d.id];
      if (!espera) return;
      delete A.ponte.esperando[d.id];
      clearTimeout(espera.relogio);
      espera.entregar(d.r);
    });

    A.ponte.ligada = true;
    A.origemDaPorta = 'o aplicativo, pela ponte';
    return true;
  };

  A.pedirPelaPonte = function (modulo, acao, payload) {
    return new Promise(function (resolve) {
      var id = 'p' + (A.ponte.proximo++) + '-' + Date.now();
      var relogio = setTimeout(function () {
        delete A.ponte.esperando[id];
        resolve({ ok: false, codigo: 'PONTE_SEM_RESPOSTA',
          mensagem: 'O aplicativo não respondeu ao pedido ' +
            modulo + '.' + acao + ' em 45 segundos.' });
      }, 45000);
      A.ponte.esperando[id] = { relogio: relogio, entregar: resolve };
      try {
        window.parent.postMessage({ almoxa3d: 'pedido', id: id,
          modulo: modulo, acao: acao, payload: payload || {} }, '*');
      } catch (e) {
        clearTimeout(relogio);
        delete A.ponte.esperando[id];
        resolve({ ok: false, codigo: 'PONTE_FECHADA',
          mensagem: 'Não consegui falar com o aplicativo: ' +
            ((e && e.message) || e) });
      }
    });
  };

  A.portaDoSistema = function () {
    /* a ponte vem ANTES: dentro do aplicativo ela é a única porta
       com sessão de verdade */
    if (A.ligarPonte()) {
      return function (modulo, acao, payload) {
        return A.pedirPelaPonte(modulo, acao, payload);
      };
    }

    var janelas = [];
    try { if (window.parent && window.parent !== window) janelas.push(window.parent); } catch (e) {}
    try { if (window.opener) janelas.push(window.opener); } catch (e) {}

    for (var i = 0; i < janelas.length; i++) {
      try {
        var j = janelas[i];
        if (j && j.API && typeof j.API.call === 'function') {
          A.origemDaPorta = i === 0 ? 'o sistema, pelo quadro' : 'o sistema, pela aba de origem';
          return function (modulo, acao, payload) {
            return j.API.call(modulo, acao, payload);
          };
        }
      } catch (e) { /* origem diferente: o navegador barra, e está certo */ }
    }
    A.origemDaPorta = 'própria';
    return null;
  };

  /** o mapa consegue falar pela porta do sistema? */
  A.temPortaDoSistema = function () { return !!A.portaDoSistema(); };

  /** pega a chave do sistema e passa a usá-la. Devolve só se achou. */
  A.herdarChave = function () {
    var r = A.chaveDoSistema();
    A.chave = r.chave;
    A.origemDaChave = r.origem;
    return !!r.chave;
  };

  /** dá para falar com o Core daqui? */
  A.pronto = function () {
    if (A.temPortaDoSistema()) return true;
    var amb = A.ambiente();
    if (amb === 'APPS_SCRIPT') return true;
    return !!A.url;
  };

  function envelope(modulo, acao, payload) {
    return {
      ponte: 'ALMOXA',
      /* a chave vem do sistema, em tempo de execução. Vazia é
         fase 1 — e fase 1 não pode bloquear a comunicação. */
      chave: A.chave || '',
      modulo: modulo,
      acao: acao,
      payload: payload || {},
      sessao: A.sessao || null,
      origem: 'ALMOXA_3D'
    };
  }

  /* ----------------------------------------------------------
     A CHAMADA
     ---------------------------------------------------------- */
  A.chamar = function (modulo, acao, payload, opcoes) {
    opcoes = opcoes || {};
    var amb = A.ambiente();
    A.chamadas++;
    var comecou = Date.now();

    function fim(r) {
      A.ultima = { modulo: modulo, acao: acao, ambiente: amb,
                   ms: Date.now() - comecou, ok: !!(r && r.ok) };
      if (!r || !r.ok) A.falhas++;
      return r;
    }

    /* ----------------------------------------------------------
       PELA PORTA DO SISTEMA · o jeito certo, e o primeiro a tentar

       Eu estava montando um envelope por fora e preenchendo campo
       por campo: chave, depois sessão, depois perfil, depois obra.
       Cada recusa do Core me fazia copiar mais um pedaço do
       sistema para cá. Isso é construir uma SEGUNDA porta de
       entrada — e a regra dele é clara: não duplicar
       autenticação, sessão, usuários nem permissões.

       O ALMOX PRO já tem uma porta que funciona, com a sessão do
       Ismael, o perfil, a obra, a chave e o prazo dele. O mapa é
       servido pelo mesmo endereço, então pode simplesmente BATER
       NAQUELA PORTA em vez de abrir uma ao lado.

       Assim não existe segunda sessão para ficar fora de sincronia,
       e quem continua decidendo tudo é o Core.
       ---------------------------------------------------------- */
    var doSistema = A.portaDoSistema();
    if (doSistema && !opcoes.semSistema) {
      return Promise.resolve()
        .then(function () { return doSistema(modulo, acao, payload || {}); })
        .then(function (r) { return fim(A.entender(r)); })
        .catch(function (e) {
          return fim({ ok: false, codigo: 'ERRO_SISTEMA',
            mensagem: 'A porta do sistema recusou: ' + ((e && e.message) || e) });
        });
    }

    if (amb === 'APPS_SCRIPT') {
      return new Promise(function (resolve) {
        var respondeu = false;
        var relogio = setTimeout(function () {
          if (respondeu) return;
          respondeu = true;
          resolve(fim({ ok: false, codigo: 'TEMPO',
            mensagem: 'O Core não respondeu em ' +
              Math.round((opcoes.tempoLimite || A.tempoLimite) / 1000) +
              ' segundos (' + modulo + '.' + acao + ').' }));
        }, opcoes.tempoLimite || A.tempoLimite);

        try {
          google.script.run
            .withSuccessHandler(function (t) {
              if (respondeu) return; respondeu = true; clearTimeout(relogio);
              resolve(fim(A.entender(t)));
            })
            .withFailureHandler(function (e) {
              if (respondeu) return; respondeu = true; clearTimeout(relogio);
              resolve(fim({ ok: false, codigo: 'ERRO_GAS',
                mensagem: (e && e.message) || 'o Apps Script recusou a chamada' }));
            })
            .APIX_atender_(JSON.stringify(envelope(modulo, acao, payload)));
        } catch (e) {
          respondeu = true; clearTimeout(relogio);
          resolve(fim({ ok: false, codigo: 'ERRO_GAS', mensagem: String(e && e.message) }));
        }
      });
    }

    /* fora do Apps Script: HTTPS no mesmo /exec */
    if (!A.url) {
      return Promise.resolve(fim({ ok: false, codigo: 'SEM_URL',
        mensagem: 'O endereço do Core não foi configurado. ' +
          'Chame API3D.configurar({ url: "...". }) antes de usar.' }));
    }

    var corta = null;
    var prazo = new Promise(function (resolve) {
      corta = setTimeout(function () {
        resolve(fim({ ok: false, codigo: 'TEMPO',
          mensagem: 'O Core não respondeu em ' +
            Math.round((opcoes.tempoLimite || A.tempoLimite) / 1000) + ' segundos.' }));
      }, opcoes.tempoLimite || A.tempoLimite);
    });

    var ida = fetch(A.url, {
      method: 'POST',
      /* text/plain evita o pedido de verificação prévia do CORS,
         que o Apps Script não responde. É o mesmo caminho que o
         ALMOX PRO já usa hoje no GitHub Pages. */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(envelope(modulo, acao, payload))
    }).then(function (res) {
      return res.text();
    }).then(function (txt) {
      clearTimeout(corta);
      return fim(A.entender(txt));
    }).catch(function (e) {
      clearTimeout(corta);
      return fim({ ok: false, codigo: 'REDE',
        mensagem: (e && e.message) || 'não consegui falar com o Core' });
    });

    return Promise.race([ida, prazo]);
  };

  /** a resposta pode vir como texto ou como objeto; entendo as duas */
  A.entender = function (t) {
    if (t === null || t === undefined) {
      return { ok: false, codigo: 'VAZIO', mensagem: 'o Core respondeu nada' };
    }
    if (typeof t === 'object') return t;
    try {
      var o = JSON.parse(t);
      return (o && typeof o === 'object') ? o
        : { ok: false, codigo: 'FORMATO', mensagem: 'resposta em formato inesperado' };
    } catch (e) {
      return { ok: false, codigo: 'FORMATO',
        mensagem: 'não entendi a resposta do Core',
        bruto: String(t).slice(0, 300) };
    }
  };

  /* ----------------------------------------------------------
     OS PEDIDOS QUE O 3D FAZ
     ------------------------------------------------------------
     Só ações que eu confirmei existirem no Core em 08/11, lendo
     o código do AP_Modulo_locais. Não invento ação.
     ---------------------------------------------------------- */
  A.localizacoes = function () { return A.chamar('locais', 'listar'); };
  A.semLocalizacao = function () { return A.chamar('locais', 'semLocalizacao'); };

  /* ------------------------------------------------------------
     [12/11] VINCULAR ESTAVA APAGANDO O ENDEREÇO

     Eu mandava { sku, codigo }. A rota lê { sku, localId } e
     grava assim:

         item.localId = p.localId || null;
         item.localizacao = local ? localTexto(local) : "";

     Com "codigo" no lugar de "localId", o localId chegava
     indefinido, virava null — e a rota respondia ok:true tendo
     APAGADO o endereço do item. Falha que responde "deu certo" é
     pior do que falha que responde erro.

     Agora: só localId, e vazio é RECUSADO aqui mesmo. Desfazer o
     vínculo passou a ter função própria, para nunca acontecer
     por descuido.

     O código ("A-A01-1-B") não vira localId por adivinhação: quem
     tem a lista de locais é o app, e é lá que a tradução é feita.
     ------------------------------------------------------------ */
  A.vincular = function (sku, localId) {
    var s = String(sku || '').trim();
    var l = String(localId || '').trim();
    if (!s) {
      return Promise.resolve({ ok: false, codigo: 'SEM_SKU',
        mensagem: 'Vincular sem o código do item não é possível.' });
    }
    if (!l) {
      return Promise.resolve({ ok: false, codigo: 'SEM_LOCAL',
        mensagem: 'Vincular sem o identificador da localização apagaria o ' +
          'endereço do item. Se a intenção é tirar o item do endereço, ' +
          'use API3D.desvincular(sku).' });
    }
    return A.chamar('locais', 'vincular', { sku: s, localId: l });
  };

  /** tirar o item do endereço — de propósito, nunca por descuido */
  A.desvincular = function (sku) {
    var s = String(sku || '').trim();
    if (!s) {
      return Promise.resolve({ ok: false, codigo: 'SEM_SKU',
        mensagem: 'Desvincular sem o código do item não é possível.' });
    }
    return A.chamar('locais', 'vincular', { sku: s, localId: null });
  };

  /* ------------------------------------------------------------
     [12/11] estoque.item LÊ "id", NÃO "sku"

     A rota procura por x.id === p.id, x.codigo === p.id ou
     x.sku === p.id. Mandando { sku } o p.id ficava indefinido e
     a resposta era sempre ITEM_NAO_ENCONTRADO.

     Mando os dois nomes: id é o que esta rota lê, sku é o nome
     do campo. Nenhum dos dois é inventado.
     ------------------------------------------------------------ */
  A.item = function (sku) {
    return A.chamar('itens', 'obter', { id: sku, sku: sku });
  };
  A.estoqueDoItem = function (sku) {
    return A.chamar('estoque', 'item', { id: sku, sku: sku });
  };

  /* ------------------------------------------------------------
     [12/11] criarFaixa SAIU

     Eu oferecia A.criarFaixa('locais','criarFaixa'). Fui procurar
     essa ação no sistema e ela não existe: nem nas chamadas do
     HTML, nem na camada de simulação. Ninguém chamava, e oferecer
     uma porta que não abre só faz alguém bater nela um dia.

     As ações de locais que eu CONFIRMEI: listar, salvar, excluir,
     vincular, semLocalizacao. Criar faixa de endereços, quando a
     gente for fazer, sai de locais.salvar em sequência — ou de
     uma ação nova que o Core precise ganhar, e aí eu peço antes.
     ------------------------------------------------------------ */
  A.salvarLocal = function (d) { return A.chamar('locais', 'salvar', d || {}); };

  raiz.API3D = A;
  if (typeof module !== 'undefined' && module.exports) module.exports = A;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== motor3d.js ===== */
/* ============================================================
   ALMOXA 3D · motor3d.js  ·  08/11/2026
   ------------------------------------------------------------
   O MOTOR BABYLON.

   Este arquivo não calcula nada: ele recebe a lista de peças
   pronta do layout3d.js e transforma em malha. Toda a conta de
   onde fica cada montante e cada posição está lá, e é testada
   em Node sem precisar de placa de vídeo.

   Aqui mora só o que é Babylon de verdade: cena, câmera, luz,
   sombra, material, instância e clique.

   DESEMPENHO · seção 15. Um almoxarifado de 5.000 posições são
   5.000 caixas iguais. Criar 5.000 malhas separadas derruba
   celular. Então as posições são INSTÂNCIAS de um mesmo molde,
   uma por cor: a placa de vídeo desenha milhares de cópias num
   lance só. Montante, longarina e prateleira seguem a mesma
   ideia.
   ============================================================ */
(function (raiz) {
  'use strict';

  var M = {
    nome: 'MOTOR3D',
    versao: '6.9.0',
    engine: null,
    cena: null,
    camera: null,
    moldes: {},
    instancias: [],
    porCodigo: {},
    selecionada: null,
    corDaSelecionada: null,
    aoSelecionar: null,     /* função que a tela registra */
    pronto: false
  };

  function B() {
    if (typeof BABYLON === 'undefined') {
      throw new Error('O Babylon.js não carregou. Confira a conexão e o endereço da biblioteca.');
    }
    return BABYLON;
  }

  function cor3(hex) {
    return B().Color3.FromHexString(hex || '#888888');
  }

  /* ----------------------------------------------------------
     A CENA
     ---------------------------------------------------------- */
  M.iniciar = function (canvas, opcoes) {
    opcoes = opcoes || {};
    var b = B();

    M.engine = new b.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      /* no celular, metade dos pixels é o suficiente e dobra o fôlego */
      adaptToDeviceRatio: true
    });

    var cena = new b.Scene(M.engine);
    cena.clearColor = b.Color4.FromHexString((opcoes.fundo || '#EEF1F5') + 'FF');
    M.cena = cena;

    /* câmera orbital · seção 1 */
    var cam = new b.ArcRotateCamera('cam',
      -Math.PI / 4, Math.PI / 3.2, 28,
      new b.Vector3(0, 1.2, 0), cena);
    cam.attachControl(canvas, true);
    cam.lowerBetaLimit = 0.12;
    cam.upperBetaLimit = Math.PI / 2.05;   /* não deixa passar por baixo do piso */
    cam.lowerRadiusLimit = 3;
    cam.upperRadiusLimit = 220;
    cam.wheelDeltaPercentage = 0.02;
    cam.pinchDeltaPercentage = 0.02;       /* pinça no celular */
    cam.panningSensibility = 80;
    M.camera = cam;

    /* luz: uma geral e uma direcional que lança sombra */
    /* [T] LUZ DE GALPÃO · seção 6: "iluminação ambiente, sombras
       suaves, reflexos controlados".

       Três luzes, como num galpão de verdade: a geral, que vem do
       teto; o sol que entra de um lado e lança a sombra; e uma de
       preenchimento do lado oposto, fraca, só para o lado escuro da
       estante não virar um borrão preto. */
    var ceu = new b.HemisphericLight('ceu', new b.Vector3(0, 1, 0), cena);
    ceu.intensity = 0.62;
    ceu.diffuse = cor3('#FFFFFF');
    ceu.groundColor = cor3('#AFB7C2');
    ceu.specular = cor3('#4A4A4A');

    var sol = new b.DirectionalLight('sol', new b.Vector3(-0.5, -1, -0.35), cena);
    sol.position = new b.Vector3(40, 60, 40);
    sol.intensity = 0.72;
    sol.specular = cor3('#6A6A6A');
    M.sol = sol;

    var lado = new b.DirectionalLight('preenche', new b.Vector3(0.6, -0.45, 0.5), cena);
    lado.intensity = 0.26;
    lado.specular = cor3('#202020');
    M.preenche = lado;

    /* a luz ambiente faz o ambientColor dos materiais valer */
    cena.ambientColor = cor3('#6E7682');

    if (opcoes.sombras !== false) {
      M.sombra = new b.ShadowGenerator(1024, sol);
      M.sombra.useBlurExponentialShadowMap = true;
      M.sombra.blurKernel = 32;          /* mais suave que antes */
      M.sombra.darkness = 0.42;          /* sombra de galpão não é preta */
      M.sombra.bias = 0.0008;
    }

    M.engine.runRenderLoop(function () { cena.render(); });
    raiz.addEventListener('resize', function () { M.engine.resize(); });

    cena.onPointerObservable.add(function (info) {
      if (info.type !== b.PointerEventTypes.POINTERPICK) return;
      var m = info.pickInfo && info.pickInfo.pickedMesh;
      M.clicar(m);
    });

    M.pronto = true;
    return M;
  };

  /* ----------------------------------------------------------
     MATERIAIS E MOLDES
     ---------------------------------------------------------- */
  /* [R] 15/11 — ACABAMENTO.
     Antes todo material tinha o mesmo brilho chapado, e o galpão
     ficava com cara de papel. Agora cada tipo de peça tem o
     acabamento do material que ele representa: ferro reflete um
     pouco, papelão não reflete quase nada, plástico reflete mais.
     É a mesma geometria — muda só como a luz pega. */
  /* ============================================================
     [T] 15/11 · TEXTURAS DESENHADAS EM CÓDIGO · seção 6
     ------------------------------------------------------------
     "Materiais com aparência física... madeira, plástico, papelão,
     sacaria... Evitar aparência de blocos geométricos genéricos."

     Textura de verdade é arquivo de imagem, e arquivo de imagem é
     dependência de fora. Este módulo é UM arquivo só, de propósito
     — um arquivo que depende de outros cinco é um arquivo que uma
     renomeação derruba, e isso já aconteceu aqui.

     Então as texturas são DESENHADAS: um canvas pequeno, pintado
     por código, virando textura do Babylon. Veia de madeira,
     canelado de papelão, trama de ráfia, chapa de metal escovado e
     o piso industrial com junta. Nada vem de fora, nada pode
     faltar, e cada uma é criada UMA vez e reaproveitada.
     ============================================================ */
  M.texturas = {};

  function pintura(nome, tamanho, pintar) {
    if (M.texturas[nome]) return M.texturas[nome];
    var b = B();
    var t;
    try {
      t = new b.DynamicTexture('tx_' + nome,
        { width: tamanho, height: tamanho }, M.cena, true);
      var c = t.getContext();
      if (!c) { M.texturas[nome] = null; return null; }
      pintar(c, tamanho);
      t.update(false);
      t.wrapU = b.Texture.WRAP_ADDRESSMODE;
      t.wrapV = b.Texture.WRAP_ADDRESSMODE;
    } catch (e) {
      /* sem canvas (ou navegador antigo) o módulo continua: fica
         sem textura, com a cor chapada de antes. Não quebra. */
      M.texturas[nome] = null;
      return null;
    }
    M.texturas[nome] = t;
    return t;
  }

  function ruido(c, n, w, alpha, cor) {
    for (var i = 0; i < n; i++) {
      c.fillStyle = cor || ('rgba(0,0,0,' + alpha + ')');
      c.fillRect(Math.random() * w, Math.random() * w,
                 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
  }

  var PINTURAS = {
    /* madeira de pallet: tábuas com veio */
    madeira: function (c, w) {
      c.fillStyle = '#C9A571'; c.fillRect(0, 0, w, w);
      for (var i = 0; i < 70; i++) {
        c.strokeStyle = 'rgba(120,88,48,' + (0.05 + Math.random() * 0.12) + ')';
        c.lineWidth = 1 + Math.random() * 2;
        c.beginPath();
        var y = Math.random() * w;
        c.moveTo(0, y);
        c.bezierCurveTo(w * 0.3, y + (Math.random() - 0.5) * 8,
                        w * 0.6, y + (Math.random() - 0.5) * 8, w, y);
        c.stroke();
      }
      /* as frestas entre as tábuas */
      c.fillStyle = 'rgba(90,65,35,.55)';
      for (var t = 1; t < 4; t++) c.fillRect(0, (w / 4) * t - 1, w, 2);
      ruido(c, 180, w, 0.05);
    },

    /* papelão: kraft com canelado e vinco do meio */
    papelao: function (c, w) {
      c.fillStyle = '#C8A077'; c.fillRect(0, 0, w, w);
      for (var i = 0; i < w; i += 4) {
        c.fillStyle = 'rgba(150,110,70,.16)';
        c.fillRect(i, 0, 2, w);
      }
      c.fillStyle = 'rgba(120,85,50,.5)';
      c.fillRect(0, w / 2 - 1, w, 2);          /* a junta das abas */
      ruido(c, 220, w, 0.06);
    },

    /* plástico: liso, com nervuras verticais e brilho */
    plastico: function (c, w) {
      c.fillStyle = '#E8EBEE'; c.fillRect(0, 0, w, w);
      for (var i = 8; i < w; i += 16) {
        c.fillStyle = 'rgba(0,0,0,.06)'; c.fillRect(i, 6, 3, w - 12);
        c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(i + 3, 6, 1, w - 12);
      }
      c.strokeStyle = 'rgba(0,0,0,.10)'; c.lineWidth = 3;
      c.strokeRect(4, 4, w - 8, w - 8);        /* a borda da caixa */
    },

    /* metal escovado */
    metal: function (c, w) {
      c.fillStyle = '#B7BDC5'; c.fillRect(0, 0, w, w);
      for (var i = 0; i < 400; i++) {
        c.strokeStyle = 'rgba(255,255,255,' + (0.03 + Math.random() * 0.07) + ')';
        c.lineWidth = 1;
        var y = Math.random() * w;
        c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + (Math.random() - 0.5) * 2);
        c.stroke();
      }
    },

    /* ráfia de saco: trama cruzada */
    rafia: function (c, w) {
      c.fillStyle = '#DED6C2'; c.fillRect(0, 0, w, w);
      for (var i = 0; i < w; i += 5) {
        c.fillStyle = 'rgba(150,140,115,.30)';
        c.fillRect(i, 0, 2, w);
        c.fillRect(0, i, w, 2);
      }
      ruido(c, 160, w, 0.05);
    },

    /* ferro pintado da estante: casca de laranja */
    ferro: function (c, w) {
      c.fillStyle = '#5A6472'; c.fillRect(0, 0, w, w);
      ruido(c, 500, w, 0.07);
      ruido(c, 300, w, 0, 'rgba(255,255,255,.05)');
    },

    /* piso industrial: concreto com junta serrada */
    piso: function (c, w) {
      c.fillStyle = '#E4E7EA'; c.fillRect(0, 0, w, w);
      ruido(c, 900, w, 0.035);
      c.strokeStyle = 'rgba(120,130,142,.40)'; c.lineWidth = 2;
      c.strokeRect(0, 0, w, w);                /* a junta do painel */
      c.strokeStyle = 'rgba(120,130,142,.14)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, w / 2); c.lineTo(w, w / 2);
      c.moveTo(w / 2, 0); c.lineTo(w / 2, w); c.stroke();
    }
  };

  function textura(nome, lado) {
    if (!PINTURAS[nome]) return null;
    return pintura(nome, lado || 128, PINTURAS[nome]);
  }

  var ACABAMENTO = {
    piso:       { brilho: '#0A0A0A', ambiente: '#FFFFFF', textura: 'piso',
                  repete: 10, dureza: 8 },
    estrutura:  { brilho: '#5A6472', ambiente: '#9AA3AE', textura: 'ferro' },
    montante:   { brilho: '#5A6472', ambiente: '#9AA3AE', textura: 'ferro' },
    longarina:  { brilho: '#5A6472', ambiente: '#9AA3AE', textura: 'ferro' },
    prateleira: { brilho: '#3A4350', ambiente: '#AAB2BD', textura: 'metal',
                  dureza: 64 },
    posicao:    { brilho: '#2E3238', ambiente: '#FFFFFF', textura: 'papelao' },
    pallet:     { brilho: '#14100A', ambiente: '#C8B28A', textura: 'madeira',
                  dureza: 12 },
    tambor:     { brilho: '#7A8290', ambiente: '#FFFFFF', textura: 'metal',
                  dureza: 96 },
    saco:       { brilho: '#0C0C0C', ambiente: '#E8E4DA', textura: 'rafia',
                  dureza: 6 },
    bobina:     { brilho: '#3A3A3A', ambiente: '#D8D2C4', textura: 'madeira',
                  dureza: 20 },
    barra:      { brilho: '#9AA3AE', ambiente: '#FFFFFF', textura: 'metal',
                  dureza: 110 },
    placaRua:   { brilho: '#1A1A1A', ambiente: '#FFFFFF' }
  };

  function material(nome, hex, opcoes) {
    opcoes = opcoes || {};
    var b = B();
    var chave = 'mat:' + nome;
    if (M.moldes[chave]) return M.moldes[chave];
    var mat = new b.StandardMaterial(nome, M.cena);
    mat.diffuseColor = cor3(hex);
    mat.specularColor = cor3(opcoes.brilho || '#2A2A2A');
    mat.specularPower = opcoes.dureza || 48;
    if (opcoes.ambiente) mat.ambientColor = cor3(opcoes.ambiente);
    if (opcoes.emissivo) mat.emissiveColor = cor3(opcoes.emissivo);

    /* [T] a textura entra como relevo da cor, não no lugar dela: a
       cor continua sendo a que o layout calculou — é ela que diz se
       a posição está vazia, ocupada ou bloqueada, e trocá-la por uma
       imagem faria o mapa parar de informar. */
    if (opcoes.textura) {
      var tx = textura(opcoes.textura);
      if (tx) {
        mat.diffuseTexture = tx;
        mat.useAlphaFromDiffuseTexture = false;
        if (opcoes.repete) {
          tx.uScale = opcoes.repete;
          tx.vScale = opcoes.repete;
        }
      }
    }
    mat.freeze();
    M.moldes[chave] = mat;
    return mat;
  }

  /** um molde por combinação de tamanho+cor; o resto vira instância */
  /* [R] BIBLIOTECA DE OBJETOS · seção 3 do prompt de 15/11

     O que está guardado numa posição nem sempre é uma caixa: pode
     ser pallet, tambor ou saco. A FORMA vem do dado — do campo
     "objeto" ou "embalagem" do cadastro de localização. Quando o
     cadastro não diz, fica caixa, que é o caso comum.

     NÃO invento o tipo a partir da quantidade nem do nome do
     material: isso seria desenhar uma informação que ninguém
     cadastrou, e aí o mapa passaria a afirmar coisas. Sem o campo,
     caixa. */
  /* ============================================================
     [G] 15/11 · BIBLIOTECA DE MODELOS 3D — seção 4 do prompt

     Antes havia 6 formas e TUDO que não casava caía em "caixa":
     papelão, metálica e organizadora apareciam como o mesmo bloco.
     Agora cada tipo tem geometria própria, montada de peças e
     fundida numa malha só (MergeMeshes com multi-material) para
     continuar instanciável — o galpão tem centenas de posições, e
     instância é o que segura o quadro.

     REGRA QUE NÃO MUDA: a cor de ocupação continua mandando no
     CORPO da peça, porque ela é dado do sistema. O tipo controla a
     FORMA e a cor dos DETALHES (borda, ripa, pé, flange, aba) —
     que é onde o olho reconhece o objeto sem perder a leitura de
     ocupação.
     ============================================================ */

  /* qualidade gráfica: quanto detalhe cada modelo recebe.
     'baixo' volta ao bloco único, para máquina fraca e TV. */
  M.qualidade = 'alto';
  M.QUALIDADES = ['baixo', 'medio', 'alto'];
  M.definirQualidade = function (q) {
    if (M.QUALIDADES.indexOf(String(q)) < 0) return false;
    if (M.qualidade === q) return true;
    M.qualidade = String(q);
    /* o cache de moldes mora no mesmo mapa dos materiais ("mat:") e
       das placas ("placa:"). Só a GEOMETRIA depende da qualidade,
       então derrubo só ela — material recriado à toa vaza memória. */
    var fica = {};
    for (var k in M.moldes) {
      if (!Object.prototype.hasOwnProperty.call(M.moldes, k)) continue;
      if (k.indexOf('mat:') === 0 || k.indexOf('placa:') === 0) fica[k] = M.moldes[k];
      else if (M.moldes[k] && M.moldes[k].dispose) {
        try { M.moldes[k].dispose(); } catch (e) {}
      }
    }
    M.moldes = fica;
    return true;
  };
  function detalhado() { return M.qualidade === 'alto'; }
  function medioOuMais() { return M.qualidade !== 'baixo'; }

  /* tons naturais de cada tipo — usados SÓ nos detalhes */
  var TOM_DO_TIPO = {
    caixaPreta:     '#17181C',
    caixaVazada:    '#1E242B',
    caixaFechada:   '#20242A',
    papelao:        '#8A6A43',
    metalica:       '#98A1A9',
    paleteMadeira:  '#A9793F',
    paletePlastico: '#2E3B45',
    tambor:         '#27384B',
    bigBag:         '#CFC8B8',
    bobina:         '#5A4639',
    barra:          '#8C929A',
    caixa:          '#6B726F'
  };

  /* --------- ferramenta miúda de montagem --------- */
  function cx(b, nome, w, h, d, x, y, z) {
    var m = b.MeshBuilder.CreateBox(nome, {
      width:  Math.max(Number(w) || 0, 0.004),
      height: Math.max(Number(h) || 0, 0.004),
      depth:  Math.max(Number(d) || 0, 0.004) }, M.cena);
    m.position.x = x || 0; m.position.y = y || 0; m.position.z = z || 0;
    return m;
  }
  function cil(b, nome, diam, alt, lados, x, y, z) {
    var m = b.MeshBuilder.CreateCylinder(nome, {
      diameter: Math.max(Number(diam) || 0, 0.004),
      height:   Math.max(Number(alt) || 0, 0.004),
      tessellation: lados || 14 }, M.cena);
    m.position.x = x || 0; m.position.y = y || 0; m.position.z = z || 0;
    return m;
  }

  /* --------- 1, 2 · CAIXA PLÁSTICA ABERTA (preta e vazada)

     O modelo prioritário do prompt. NÃO é um bloco: é um caixote
     de parede fina, com piso, quatro paredes, borda superior
     reforçada, cantos arredondados e ripas de reforço. O topo fica
     aberto, então dá para ver o interior e a espessura da parede. */
  function caixaAberta(b, p, vazada) {
    var corpo = [], det = [];
    var esp = Math.min(p.lx, p.lz) * 0.075;
    var baseY = -p.ly / 2;
    var hPar = p.ly - esp;

    corpo.push(cx(b, 'piso', p.lx - esp * 0.6, esp, p.lz - esp * 0.6,
      0, baseY + esp / 2, 0));

    if (!medioOuMais()) {
      return { corpo: corpo.concat([cx(b, 'bloco', p.lx, p.ly, p.lz, 0, 0, 0)]),
               detalhe: det };
    }

    if (!vazada) {
      corpo.push(cx(b, 'pFrente', p.lx - esp * 2, hPar, esp,
        0, baseY + esp + hPar / 2,  (p.lz - esp) / 2));
      corpo.push(cx(b, 'pFundo',  p.lx - esp * 2, hPar, esp,
        0, baseY + esp + hPar / 2, -(p.lz - esp) / 2));
      corpo.push(cx(b, 'pEsq', esp, hPar, p.lz - esp * 2,
        -(p.lx - esp) / 2, baseY + esp + hPar / 2, 0));
      corpo.push(cx(b, 'pDir', esp, hPar, p.lz - esp * 2,
         (p.lx - esp) / 2, baseY + esp + hPar / 2, 0));
    } else {
      /* parede vazada: ripas horizontais com vão entre elas */
      var n = 3, hR = hPar / (n * 2 - 1);
      for (var i = 0; i < n; i++) {
        var yy = baseY + esp + hR / 2 + i * hR * 2;
        corpo.push(cx(b, 'rF' + i, p.lx - esp * 2, hR, esp, 0, yy,  (p.lz - esp) / 2));
        corpo.push(cx(b, 'rT' + i, p.lx - esp * 2, hR, esp, 0, yy, -(p.lz - esp) / 2));
        corpo.push(cx(b, 'rE' + i, esp, hR, p.lz - esp * 2, -(p.lx - esp) / 2, yy, 0));
        corpo.push(cx(b, 'rD' + i, esp, hR, p.lz - esp * 2,  (p.lx - esp) / 2, yy, 0));
      }
    }

    /* borda superior reforçada — mais grossa que a parede */
    var hB = p.ly * 0.085, yB = p.ly / 2 - hB / 2, eB = esp * 1.9;
    det.push(cx(b, 'bF', p.lx, hB, eB, 0, yB,  (p.lz - eB) / 2));
    det.push(cx(b, 'bT', p.lx, hB, eB, 0, yB, -(p.lz - eB) / 2));
    det.push(cx(b, 'bE', eB, hB, p.lz - eB * 2, -(p.lx - eB) / 2, yB, 0));
    det.push(cx(b, 'bD', eB, hB, p.lz - eB * 2,  (p.lx - eB) / 2, yB, 0));

    if (!detalhado()) return { corpo: corpo, detalhe: det };

    /* cantos arredondados: um cilindro em cada quina vertical */
    var dC = esp * 2.4, quinas = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    for (var q = 0; q < quinas.length; q++) {
      det.push(cil(b, 'quina' + q, dC, p.ly, 10,
        quinas[q][0] * (p.lx / 2 - dC / 2.5), 0,
        quinas[q][1] * (p.lz / 2 - dC / 2.5)));
    }
    /* ripas verticais de reforço nas duas faces longas */
    for (var r = 0; r < 2; r++) {
      var xx = (-0.5 + (r + 0.5) / 2) * (p.lx * 0.62);
      det.push(cx(b, 'vF' + r, esp * 0.9, p.ly * 0.66, esp * 0.6,
        xx, -p.ly * 0.08,  p.lz / 2));
      det.push(cx(b, 'vT' + r, esp * 0.9, p.ly * 0.66, esp * 0.6,
        xx, -p.ly * 0.08, -p.lz / 2));
    }
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 3 · CAIXA PLÁSTICA FECHADA: corpo + tampa com aba --------- */
  function caixaFechada(b, p) {
    var corpo = [], det = [];
    var hTampa = p.ly * 0.12;
    corpo.push(cx(b, 'corpo', p.lx * 0.97, p.ly - hTampa, p.lz * 0.97,
      0, -hTampa / 2, 0));
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    det.push(cx(b, 'tampa', p.lx, hTampa, p.lz, 0, p.ly / 2 - hTampa / 2, 0));
    var eB = Math.min(p.lx, p.lz) * 0.07;
    det.push(cx(b, 'abaF', p.lx, hTampa * 0.55, eB,
      0, p.ly / 2 - hTampa, (p.lz - eB) / 2));
    det.push(cx(b, 'abaT', p.lx, hTampa * 0.55, eB,
      0, p.ly / 2 - hTampa, -(p.lz - eB) / 2));
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    /* trava de fecho nas duas pontas */
    det.push(cx(b, 'trava1', p.lx * 0.16, hTampa * 0.9, eB * 1.4,
      -p.lx * 0.3, p.ly / 2 - hTampa * 1.1, p.lz / 2));
    det.push(cx(b, 'trava2', p.lx * 0.16, hTampa * 0.9, eB * 1.4,
       p.lx * 0.3, p.ly / 2 - hTampa * 1.1, p.lz / 2));
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 4 · CAIXA DE PAPELÃO: abas no topo e fita --------- */
  function caixaPapelao(b, p) {
    var corpo = [], det = [];
    corpo.push(cx(b, 'corpo', p.lx, p.ly * 0.94, p.lz, 0, -p.ly * 0.03, 0));
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    var hAba = p.ly * 0.06;
    /* duas abas que se encontram no meio, levemente levantadas */
    var a1 = cx(b, 'aba1', p.lx, hAba, p.lz * 0.52,
      0, p.ly / 2 - hAba / 2, -p.lz * 0.24);
    var a2 = cx(b, 'aba2', p.lx, hAba, p.lz * 0.52,
      0, p.ly / 2 - hAba / 2,  p.lz * 0.24);
    if (detalhado()) { a1.rotation.x = -0.05; a2.rotation.x = 0.05; }
    det.push(a1); det.push(a2);
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    /* fita de vedação atravessando a junta */
    det.push(cx(b, 'fita', p.lx * 0.22, hAba * 0.5, p.lz,
      0, p.ly / 2 + hAba * 0.15, 0));
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 5 · CAIXA METÁLICA: cantoneiras e puxá --------- */
  function caixaMetalica(b, p) {
    var corpo = [], det = [];
    corpo.push(cx(b, 'corpo', p.lx * 0.96, p.ly * 0.9, p.lz * 0.96, 0, -p.ly * 0.05, 0));
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    var e = Math.min(p.lx, p.lz) * 0.06;
    det.push(cx(b, 'tampo', p.lx, p.ly * 0.1, p.lz, 0, p.ly * 0.45, 0));
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    /* cantoneiras em L nas quatro quinas */
    var qs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    for (var q = 0; q < qs.length; q++) {
      det.push(cx(b, 'cantA' + q, e * 2.2, p.ly * 0.9, e,
        qs[q][0] * (p.lx / 2 - e * 1.1), -p.ly * 0.05, qs[q][1] * (p.lz / 2 - e / 2)));
      det.push(cx(b, 'cantB' + q, e, p.ly * 0.9, e * 2.2,
        qs[q][0] * (p.lx / 2 - e / 2), -p.ly * 0.05, qs[q][1] * (p.lz / 2 - e * 1.1)));
    }
    /* puxadores laterais */
    det.push(cx(b, 'puxE', e, p.ly * 0.1, p.lz * 0.34, -p.lx / 2, 0, 0));
    det.push(cx(b, 'puxD', e, p.ly * 0.1, p.lz * 0.34,  p.lx / 2, 0, 0));
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 6 · PALETE DE MADEIRA: tábuas separadas, com vão --------- */
  function paleteMadeira(b, p) {
    var corpo = [], det = [];
    var hPal = p.ly * 0.26;                     /* altura do estrado */
    var baseY = -p.ly / 2;
    var eT = hPal * 0.26;                       /* espessura da tábua */

    /* a carga em cima: ESSA leva a cor de ocupação */
    corpo.push(cx(b, 'carga', p.lx * 0.92, p.ly - hPal, p.lz * 0.92,
      0, baseY + hPal + (p.ly - hPal) / 2, 0));

    if (!medioOuMais()) {
      det.push(cx(b, 'estrado', p.lx, hPal, p.lz, 0, baseY + hPal / 2, 0));
      return { corpo: corpo, detalhe: det };
    }

    /* tábuas de cima, uma a uma, com vão entre elas */
    var n = detalhado() ? 5 : 3;
    for (var i = 0; i < n; i++) {
      var zz = (-0.5 + (i + 0.5) / n) * p.lz;
      det.push(cx(b, 'tab' + i, p.lx, eT, (p.lz / n) * 0.72,
        0, baseY + hPal - eT / 2, zz));
    }
    /* longarinas no meio */
    for (var j = 0; j < 3; j++) {
      var xx = (-0.5 + (j + 0.5) / 3) * p.lx;
      det.push(cx(b, 'long' + j, p.lx * 0.1, hPal - eT * 2, p.lz,
        xx, baseY + hPal / 2, 0));
    }
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    /* tábuas de baixo */
    for (var k = 0; k < 3; k++) {
      var z2 = (-0.5 + (k + 0.5) / 3) * p.lz;
      det.push(cx(b, 'baixo' + k, p.lx, eT, (p.lz / 3) * 0.55,
        0, baseY + eT / 2, z2));
    }
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 7 · PALETE PLÁSTICO: estrado inteiriço e nove pés --------- */
  function paletePlastico(b, p) {
    var corpo = [], det = [];
    var hPal = p.ly * 0.22, baseY = -p.ly / 2;
    var hPe = hPal * 0.6, hDeck = hPal - hPe;

    corpo.push(cx(b, 'carga', p.lx * 0.92, p.ly - hPal, p.lz * 0.92,
      0, baseY + hPal + (p.ly - hPal) / 2, 0));
    det.push(cx(b, 'deck', p.lx, hDeck, p.lz, 0, baseY + hPe + hDeck / 2, 0));
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    var passos = [-1, 0, 1];
    for (var a = 0; a < 3; a++) {
      for (var c = 0; c < 3; c++) {
        det.push(cx(b, 'pe' + a + c, p.lx * 0.17, hPe, p.lz * 0.17,
          passos[a] * (p.lx * 0.37), baseY + hPe / 2, passos[c] * (p.lz * 0.37)));
      }
    }
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 8 · TAMBOR E BOMBONA: anéis de rolagem e tampa --------- */
  function tambor(b, p) {
    var corpo = [], det = [];
    var d = Math.min(p.lx, p.lz) * 0.92;
    corpo.push(cil(b, 'casco', d, p.ly, 16, 0, 0, 0));
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    det.push(cil(b, 'aro1', d * 1.05, p.ly * 0.07, 16, 0,  p.ly * 0.22, 0));
    det.push(cil(b, 'aro2', d * 1.05, p.ly * 0.07, 16, 0, -p.ly * 0.22, 0));
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    det.push(cil(b, 'tampo', d * 1.02, p.ly * 0.06, 16, 0, p.ly / 2 - p.ly * 0.03, 0));
    det.push(cil(b, 'bujao', d * 0.18, p.ly * 0.05, 8,
      d * 0.25, p.ly / 2 + p.ly * 0.005, 0));
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 9 · SACO E BIG BAG: corpo cônico e alças --------- */
  function bigBag(b, p) {
    var corpo = [], det = [];
    var m = b.MeshBuilder.CreateCylinder('saco', {
      diameterTop: Math.min(p.lx, p.lz) * 0.78,
      diameterBottom: Math.min(p.lx, p.lz) * 0.98,
      height: p.ly * 0.9, tessellation: 12 }, M.cena);
    m.position.y = -p.ly * 0.05;
    corpo.push(m);
    if (!detalhado()) return { corpo: corpo, detalhe: det };

    /* [G2] 15/11, depois do catálogo: as alças estavam em
       x = 0.26·lx, mas o topo do saco tem raio 0.195·lx. Elas
       nasciam FORA do saco e apareciam como cubinhos soltos no ar
       — dá para ver na primeira foto do galpão. Agora ficam dentro
       do raio do topo e descem o bastante para encostar nele. */
    var rTopo = Math.min(p.lx, p.lz) * 0.78 / 2;
    var topoY = -p.ly * 0.05 + p.ly * 0.9 / 2;
    var hAlca = p.ly * 0.14;
    var qs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    for (var q = 0; q < qs.length; q++) {
      det.push(cx(b, 'alca' + q, p.lx * 0.055, hAlca, p.lz * 0.055,
        qs[q][0] * rTopo * 0.62, topoY + hAlca * 0.22, qs[q][1] * rTopo * 0.62));
    }
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 10 · BOBINA E CARRETEL: flanges e núcleo, deitada --------- */
  function bobina(b, p) {
    var corpo = [], det = [];
    var dFl = Math.min(p.ly, p.lz) * 0.96;
    var larg = p.lx * 0.86;

    var rolo = cil(b, 'rolo', dFl * 0.78, larg * 0.84, 18, 0, 0, 0);
    rolo.rotation.z = Math.PI / 2;
    corpo.push(rolo);
    if (!medioOuMais()) return { corpo: corpo, detalhe: det };

    var f1 = cil(b, 'flange1', dFl, larg * 0.08, 18, -larg / 2, 0, 0);
    var f2 = cil(b, 'flange2', dFl, larg * 0.08, 18,  larg / 2, 0, 0);
    f1.rotation.z = Math.PI / 2; f2.rotation.z = Math.PI / 2;
    det.push(f1); det.push(f2);
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    var nuc = cil(b, 'nucleo', dFl * 0.22, larg * 1.04, 12, 0, 0, 0);
    nuc.rotation.z = Math.PI / 2;
    det.push(nuc);
    return { corpo: corpo, detalhe: det };
  }

  /* --------- 11 · BARRAS, TUBOS E PERFIS: feixe amarrado --------- */
  function feixeDeBarras(b, p) {
    var corpo = [], det = [];
    if (!medioOuMais()) {
      corpo.push(cx(b, 'feixe', p.lx * 0.94, p.ly * 0.4, p.lz * 0.86, 0, -p.ly * 0.3, 0));
      return { corpo: corpo, detalhe: det };
    }
    var d = Math.min(p.ly, p.lz) * 0.26;
    var linhas = detalhado() ? 2 : 1, porLinha = detalhado() ? 4 : 3;
    for (var L = 0; L < linhas; L++) {
      for (var i = 0; i < porLinha; i++) {
        var zz = (-0.5 + (i + 0.5) / porLinha) * (p.lz * 0.82);
        var yy = -p.ly / 2 + d / 2 + L * d * 0.92;
        var t = cil(b, 'barra' + L + i, d, p.lx * 0.94, 10, 0, yy, zz);
        t.rotation.z = Math.PI / 2;
        corpo.push(t);
      }
    }
    if (!detalhado()) return { corpo: corpo, detalhe: det };
    /* [G2] duas cintas de amarração. Antes eram mais altas e mais
       fundas que o próprio feixe e apareciam como chapas soltas na
       frente dele; agora abraçam o feixe, como cinta de verdade. */
    var altoFeixe = d * linhas * 0.92, meioFeixe = -p.ly / 2 + altoFeixe / 2;
    det.push(cx(b, 'cinta1', p.lx * 0.035, altoFeixe * 1.12, p.lz * 0.86,
      -p.lx * 0.24, meioFeixe, 0));
    det.push(cx(b, 'cinta2', p.lx * 0.035, altoFeixe * 1.12, p.lz * 0.86,
       p.lx * 0.24, meioFeixe, 0));
    return { corpo: corpo, detalhe: det };
  }

  /* bloco simples — o que as peças que não são posição usam */
  function blocoSimples(b, p) {
    return { corpo: [cx(b, 'bloco', p.lx, p.ly, p.lz, 0, 0, 0)], detalhe: [] };
  }

  var FORMAS = {
    caixa:          function (b, p) { return blocoSimples(b, p); },
    caixaPreta:     function (b, p) { return caixaAberta(b, p, false); },
    caixaVazada:    function (b, p) { return caixaAberta(b, p, true); },
    caixaFechada:   function (b, p) { return caixaFechada(b, p); },
    papelao:        function (b, p) { return caixaPapelao(b, p); },
    metalica:       function (b, p) { return caixaMetalica(b, p); },
    paleteMadeira:  function (b, p) { return paleteMadeira(b, p); },
    paletePlastico: function (b, p) { return paletePlastico(b, p); },
    tambor:         function (b, p) { return tambor(b, p); },
    bigBag:         function (b, p) { return bigBag(b, p); },
    bobina:         function (b, p) { return bobina(b, p); },
    barra:          function (b, p) { return feixeDeBarras(b, p); }
  };
  /* nomes antigos continuam valendo: nada que já chamava quebra */
  FORMAS.pallet = FORMAS.paleteMadeira;
  FORMAS.saco   = FORMAS.bigBag;

  M.FORMAS = FORMAS;
  M.TOM_DO_TIPO = TOM_DO_TIPO;

  /* ------------------------------------------------------------
     De que tipo é esta posição? Sai do cadastro, dos mesmos
     campos de sempre (objeto / embalagem / tipoObjeto). NÃO é
     deduzido da quantidade nem inventado.
     ------------------------------------------------------------ */
  function formaDaPeca(peca) {
    if (peca.tipo !== 'posicao') return 'caixa';
    var d = peca.dado || {};
    var bruto = d.objeto || d.embalagem || d.tipoObjeto || '';
    var t = String(bruto === null || bruto === undefined ? '' : bruto)
              .trim().toLowerCase();
    if (!t) return 'caixa';

    var ePalete = t.indexOf('palete') > -1 || t.indexOf('pallet') > -1 ||
                  t.indexOf('palet') > -1;
    if (ePalete) {
      return (t.indexOf('plástic') > -1 || t.indexOf('plastic') > -1)
        ? 'paletePlastico' : 'paleteMadeira';
    }
    if (t.indexOf('tambor') > -1 || t.indexOf('bombona') > -1 ||
        t.indexOf('balde') > -1 || t.indexOf('barril') > -1) return 'tambor';
    if (t.indexOf('saco') > -1 || t.indexOf('saca') > -1 ||
        t.indexOf('big bag') > -1 || t.indexOf('bigbag') > -1) return 'bigBag';
    if (t.indexOf('bobina') > -1 || t.indexOf('rolo') > -1 ||
        t.indexOf('carretel') > -1) return 'bobina';
    if (t.indexOf('barra') > -1 || t.indexOf('tubo') > -1 ||
        t.indexOf('perfil') > -1 || t.indexOf('vergalh') > -1 ||
        t.indexOf('eletroduto') > -1) return 'barra';
    if (t.indexOf('papelão') > -1 || t.indexOf('papelao') > -1 ||
        t.indexOf('caixa de papel') > -1) return 'papelao';
    if (t.indexOf('metálic') > -1 || t.indexOf('metalic') > -1 ||
        t.indexOf('aço') > -1 || t.indexOf('ferro') > -1) return 'metalica';
    if (t.indexOf('vazad') > -1 || t.indexOf('vazia') > -1 ||
        t.indexOf('ventilad') > -1 || t.indexOf('furad') > -1) return 'caixaVazada';
    if (t.indexOf('fechad') > -1 || t.indexOf('tampa') > -1 ||
        t.indexOf('organizadora') > -1 || t.indexOf('herm') > -1) return 'caixaFechada';
    if (t.indexOf('pret') > -1) return 'caixaPreta';
    /* "caixa plástica" sem mais nada é o caixote preto do almoxarifado */
    if (t.indexOf('plástic') > -1 || t.indexOf('plastic') > -1 ||
        t.indexOf('caixa') > -1 || t.indexOf('gaveta') > -1) return 'caixaPreta';
    return 'caixa';
  }
  M.formaDaPeca = formaDaPeca;

  /* [T] A PLACA DA RUA, COM A LETRA ESCRITA · seção 6
     "Identificação visual das ruas. Etiquetas e placas de endereço."
     Até aqui a placa era um retângulo cinza que não dizia nada.
     Cada rua ganha a sua, com a letra pintada — e como são poucas
     ruas, uma textura por placa não pesa. */
  function placaDeRua(peca) {
    var b = B();
    var chave = 'placa:' + peca.rotulo;
    if (M.moldes[chave]) return M.moldes[chave];

    /* [P2] 15/11, 16h — A PLACA, QUARTA TENTATIVA, E ESTA EU MEDI.

       Histórico das três que falharam, para ninguém repetir:
         1. CAIXA: a textura ia nas seis faces, o verso saía
            espelhado — "A AUЯ".
         2. BILLBOARD: achei que girar com a câmera resolveria.
            Não resolveu, e ele viu de novo.
         3. Plano DOUBLESIDE com backUVs espelhada em x. Parecia o
            jeito canônico, mas o texto saiu de CABEÇA PARA BAIXO,
            e ele viu pela terceira vez.

       O erro das três foi o mesmo: eu deduzia a orientação em vez
       de olhar. Desta vez renderizei sete variantes com uma marca
       vermelha no canto superior esquerdo da textura e fotografei
       cada uma pela frente e pelo verso. O que as fotos mostraram:

         a) A DynamicTexture chega com o V invertido: o canvas
            desenha com y para baixo e o plano lê v para cima.
            Sem vScale = -1 o texto sai de cabeça para baixo.
            ESSA era a causa do que ele reclamou duas vezes.
         b) DOUBLESIDE com backUVs espelhada acerta UMA face e
            erra a outra, qualquer que seja a combinação.

       A construção que leu certo DOS DOIS LADOS na foto é a mesma
       de uma placa de rua de verdade: DUAS CHAPAS costas com
       costas, cada uma com a sua face para fora, fundidas numa
       malha só para continuar instanciável. Nenhuma UV espelhada,
       nada a deduzir — cada face é uma frente.                   */
    var chapaA = b.MeshBuilder.CreatePlane('placa_' + peca.rotulo + '_a',
      { width: peca.lx, height: peca.ly }, M.cena);
    var chapaB = b.MeshBuilder.CreatePlane('placa_' + peca.rotulo + '_b',
      { width: peca.lx, height: peca.ly }, M.cena);
    chapaB.rotation.y = Math.PI;

    var mat = new b.StandardMaterial('m_placa_' + peca.rotulo, M.cena);
    mat.diffuseColor = cor3('#1E3A5F');
    mat.specularColor = cor3('#101010');
    try {
      var t = new b.DynamicTexture('tx_placa_' + peca.rotulo,
        { width: 256, height: 128 }, M.cena, true);
      var c = t.getContext();
      if (c) {
        c.fillStyle = '#1E3A5F'; c.fillRect(0, 0, 256, 128);
        c.fillStyle = '#FFFFFF';
        c.fillRect(6, 6, 244, 4); c.fillRect(6, 118, 244, 4);
        c.font = 'bold 78px system-ui, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('RUA ' + String(peca.rotulo), 128, 68);
        t.update(false);
        /* [P2] o V invertido: medido na foto, não deduzido */
        t.vScale = -1;
        t.vOffset = 1;
        mat.diffuseTexture = t;
        mat.emissiveColor = cor3('#3A4A5F');
      }
    } catch (e) {}
    mat.freeze();            /* a placa nunca muda depois de pintada */
    chapaA.material = mat;
    chapaB.material = mat;

    var placa = b.Mesh.MergeMeshes([chapaA, chapaB], true, true,
      undefined, false, false);
    if (!placa) {            /* se a fusão falhar, NÃO fico sem placa */
      placa = chapaA;
      try { chapaB.dispose(); } catch (e2) {}
    }
    placa.name = 'placa_' + peca.rotulo;
    placa.material = mat;
    placa.isVisible = false;
    placa.isPickable = false;
    M.moldes[chave] = placa;
    return placa;
  }

  function molde(peca) {
    var b = B();
    if (peca.tipo === 'placaRua' && peca.rotulo) return placaDeRua(peca);
    var forma = formaDaPeca(peca);
    var chave = [peca.tipo, forma, peca.lx.toFixed(3), peca.ly.toFixed(3),
                 peca.lz.toFixed(3), peca.cor, M.qualidade].join('|');
    if (M.moldes[chave]) return M.moldes[chave];

    var fab = FORMAS[forma] || FORMAS.caixa;
    var partes = fab(b, peca);

    /* compatibilidade: forma antiga que devolvia UMA malha */
    if (partes && partes.getClassName) partes = { corpo: [partes], detalhe: [] };
    if (!partes || !partes.corpo || !partes.corpo.length) {
      partes = { corpo: [b.MeshBuilder.CreateBox('f_bloco',
        { width: peca.lx, height: peca.ly, depth: peca.lz }, M.cena)], detalhe: [] };
    }

    var acab = ACABAMENTO[peca.tipo] || {};
    if (peca.tipo === 'posicao' && forma !== 'caixa') {
      acab = ACABAMENTO[forma] || acab;
    }

    /* o CORPO leva a cor de ocupação — dado do sistema, não aparência */
    var matCorpo = material('m_' + peca.tipo + '_' + forma + '_' + peca.cor,
      peca.cor, acab);
    var i;
    for (i = 0; i < partes.corpo.length; i++) partes.corpo[i].material = matCorpo;

    /* o DETALHE leva o tom natural do tipo: é ele que faz a caixa
       preta parecer caixa preta sem apagar a leitura de ocupação */
    var todas = partes.corpo.slice();
    if (partes.detalhe && partes.detalhe.length) {
      var matDet = material('m_det_' + forma, TOM_DO_TIPO[forma] || '#6B726F', acab);
      for (i = 0; i < partes.detalhe.length; i++) {
        partes.detalhe[i].material = matDet;
        todas.push(partes.detalhe[i]);
      }
    }

    var corpo;
    if (todas.length === 1) {
      corpo = todas[0];
    } else {
      /* funde tudo numa malha só, preservando os dois materiais, para
         a peça continuar instanciável (centenas de posições) */
      corpo = b.Mesh.MergeMeshes(todas, true, true, undefined, false, true);
      if (!corpo) {
        /* se a fusão falhar eu NÃO deixo a tela sem peça */
        corpo = b.MeshBuilder.CreateBox('f_bloco',
          { width: peca.lx, height: peca.ly, depth: peca.lz }, M.cena);
        corpo.material = matCorpo;
      }
    }
    corpo.name = 'molde_' + peca.tipo + '_' + forma;
    corpo.isVisible = false;                 /* o molde não aparece */
    corpo.isPickable = false;
    M.moldes[chave] = corpo;
    return corpo;
  }

  /* ----------------------------------------------------------
     DESENHAR o galpão a partir da montagem do layout3d
     ---------------------------------------------------------- */
  M.desenhar = function (montagem) {
    if (!M.cena) throw new Error('A cena não foi iniciada.');
    var b = B();
    M.limpar();
    M.limparRota();   /* [F3] rota velha não fica sobre galpão novo */

    var pecas = (montagem && montagem.pecas) || [];
    for (var i = 0; i < pecas.length; i++) {
      var p = pecas[i];
      var base = molde(p);
      var inst = base.createInstance('i_' + p.id);
      inst.position = new b.Vector3(p.x, p.y, p.z);
      inst.isPickable = !!p.clicavel;
      inst.metadata = p;
      /* [P] a placa NÃO gira: duas faces, cada uma com a sua UV */

      if (M.sombra && p.tipo !== 'piso') {
        try { M.sombra.addShadowCaster(inst); } catch (e) { }
      }
      if (p.tipo === 'piso') {
        inst.receiveShadows = true;
      }

      M.instancias.push(inst);
      if (p.tipo === 'posicao' && p.codigo) M.porCodigo[p.codigo] = inst;
    }

    /* Guarda a montagem: é dela que sai o enquadramento, e é ela
       que a troca de visão reusa. Antes a câmera mirava no meio
       de um galpão suposto; agora mira no que existe. */
    M.montagem = montagem;
    M.enquadrar();

    return { instancias: M.instancias.length, moldes: Object.keys(M.moldes).length };
  };

  /* ============================================================
     [F3] DESENHAR A ROTA · seção 6
     ------------------------------------------------------------
     A rota é CONTA do layout3d; aqui só vira linha e marcador.
     As peças da rota ficam numa lista própria, separada das do
     galpão, para apagar a rota sem redesenhar o galpão inteiro.
     ============================================================ */
  M.pecasDaRota = [];

  M.limparRota = function () {
    for (var i = 0; i < M.pecasDaRota.length; i++) {
      try { M.pecasDaRota[i].dispose(); } catch (e) {}
    }
    M.pecasDaRota = [];
  };

  M.desenharRota = function (rota) {
    if (!M.cena) throw new Error('A cena não foi iniciada.');
    var b = B();
    M.limparRota();
    if (!rota || !rota.ok) return;

    /* a linha do caminho, rente ao piso */
    if (rota.caminho && rota.caminho.length > 1) {
      var pontos = rota.caminho.map(function (c) {
        return new b.Vector3(c.x, 0.06, c.z);
      });
      var linha = b.MeshBuilder.CreateLines('rota_linha', { points: pontos }, M.cena);
      linha.color = b.Color3.FromHexString('#2F7BE8');
      linha.isPickable = false;
      M.pecasDaRota.push(linha);
    }

    /* um marcador numerado em cada ponto, na cor do estado */
    for (var i = 0; i < (rota.pontos || []).length; i++) {
      var pt = rota.pontos[i];
      var pino = b.MeshBuilder.CreateCylinder('rota_pino_' + i,
        { diameter: 0.34, height: 0.9, tessellation: 12 }, M.cena);
      pino.position = new b.Vector3(pt.acesso.x, 0.45, pt.acesso.z);
      pino.isPickable = false;
      var mt = new b.StandardMaterial('rota_mat_' + i, M.cena);
      mt.diffuseColor = b.Color3.FromHexString(pt.cor);
      mt.emissiveColor = b.Color3.FromHexString(pt.cor).scale(0.35);
      pino.material = mt;
      M.pecasDaRota.push(pino, mt);

      /* o número do ponto, escrito numa plaquinha */
      try {
        var placa = b.MeshBuilder.CreatePlane('rota_num_' + i,
          { width: 0.5, height: 0.5 }, M.cena);
        placa.position = new b.Vector3(pt.acesso.x, 1.08, pt.acesso.z);
        placa.billboardMode = b.Mesh.BILLBOARDMODE_ALL;
        placa.isPickable = false;
        var tex = new b.DynamicTexture('rota_tex_' + i,
          { width: 128, height: 128 }, M.cena, true);
        tex.hasAlpha = true;
        tex.drawText(String(pt.ordem), null, 96, 'bold 86px system-ui',
          '#FFFFFF', 'transparent', true);
        var mp = new b.StandardMaterial('rota_matnum_' + i, M.cena);
        mp.diffuseTexture = tex;
        mp.opacityTexture = tex;
        mp.emissiveColor = new b.Color3(1, 1, 1);
        mp.backFaceCulling = false;
        placa.material = mp;
        M.pecasDaRota.push(placa, tex, mp);
      } catch (e) {}
    }
  };

  M.limpar = function () {
    for (var i = 0; i < M.instancias.length; i++) {
      try { M.instancias[i].dispose(); } catch (e) { }
    }
    M.instancias = [];
    M.porCodigo = {};
    M.selecionada = null;
    M.corDaSelecionada = null;
    /* a montagem sai junto: enquadrar pelo galpão anterior seria
       mirar numa estante que já não está mais na cena */
    M.montagem = null;
  };

  /* ----------------------------------------------------------
     SELEÇÃO · azul, e devolve a cor de antes ao sair
     ---------------------------------------------------------- */
  M.clicar = function (malha) {
    if (M.selecionada) {
      try { M.selecionada.instancedBuffers = M.selecionada.instancedBuffers; } catch (e) { }
      M.destacar(M.selecionada, false);
      M.selecionada = null;
    }
    if (!malha || !malha.metadata || malha.metadata.tipo !== 'posicao') {
      if (typeof M.aoSelecionar === 'function') M.aoSelecionar(null);
      return null;
    }
    M.selecionada = malha;
    M.destacar(malha, true);
    if (typeof M.aoSelecionar === 'function') M.aoSelecionar(malha.metadata);
    return malha.metadata;
  };

  /** o destaque é uma moldura, não troca de cor: assim o verde
      continua verde e o usuário não perde a leitura da ocupação */
  M.destacar = function (malha, ligado) {
    var b = B();
    if (!M.realce) {
      M.realce = new b.HighlightLayer('realce', M.cena, { blurHorizontalSize: 0.6 });
    }
    try {
      if (ligado) M.realce.addMesh(malha.sourceMesh || malha, cor3('#2F7BE8'));
      else M.realce.removeMesh(malha.sourceMesh || malha);
    } catch (e) { }
  };

  M.selecionarPorCodigo = function (codigo) {
    var m = M.porCodigo[codigo];
    if (!m) return null;
    return M.clicar(m);
  };

  /* ----------------------------------------------------------
     AS VISÕES · seção 8
     ---------------------------------------------------------- */
  /* ------------------------------------------------------------
     ENQUADRAR · põe a câmera onde cabe o que foi desenhado

     A conta mora no layout3d, que é matemática pura e tem prova
     própria. Aqui só se aplica o resultado no Babylon — assim o
     enquadramento continua verificável sem placa de vídeo.
     ------------------------------------------------------------ */
  M.enquadrar = function (opcoes) {
    if (!M.camera || !raiz.LAYOUT3D || !raiz.LAYOUT3D.enquadramento) return null;
    var b = B();
    opcoes = opcoes || {};

    /* a proporção real da tela: numa tela deitada quem aperta é
       a altura, e é isso que a conta precisa saber */
    var aspecto = opcoes.aspecto;
    if (!aspecto) {
      try { aspecto = M.engine.getAspectRatio(M.camera); } catch (e) {}
    }
    var fov = opcoes.fov || M.camera.fov || 0.8;

    var e = raiz.LAYOUT3D.enquadramento(M.montagem,
      { fov: fov, aspecto: aspecto, folga: opcoes.folga, piso: !!opcoes.piso });

    M.camera.setTarget(new b.Vector3(e.alvo.x, e.alvo.y, e.alvo.z));
    M.camera.radius = e.raio;
    /* o limite de aproximação acompanha o tamanho: num galpão
       de uma estante, 3 metros já é longe demais */
    M.camera.lowerRadiusLimit = Math.min(3, e.raio * 0.35);
    M.ultimoEnquadre = e;
    return e;
  };

  M.visao = function (qual, galpao) {
    if (!M.camera) return;
    var a = { superior: [-Math.PI / 2, 0.02], frontal: [-Math.PI / 2, Math.PI / 2.1],
              lateral: [0, Math.PI / 2.1], perspectiva: [-Math.PI / 4, Math.PI / 3.2] };
    var v = a[qual] || a.perspectiva;
    M.camera.alpha = v[0];
    M.camera.beta = v[1];
    /* a distância sai do enquadramento, igual em todas as visões:
       trocar de ângulo não é motivo para perder o galpão de vista */
    if (!M.enquadrar()) {
      var g = galpao || { largura: 20, profundidade: 20, altura: 4 };
      M.camera.radius = Math.max(g.largura, g.profundidade) * 1.15 + 8;
    }
  };

  M.foto = function () {
    try { return M.engine && M.cena ? M.cena.getEngine().getRenderingCanvas().toDataURL() : ''; }
    catch (e) { return ''; }
  };

  M.parar = function () {
    try { M.engine && M.engine.stopRenderLoop(); } catch (e) { }
    try { M.cena && M.cena.dispose(); } catch (e) { }
    try { M.engine && M.engine.dispose(); } catch (e) { }
    M.pronto = false;
  };

  raiz.MOTOR3D = M;
  if (typeof module !== 'undefined' && module.exports) module.exports = M;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== construtor.js ===== */
/* ============================================================
   ALMOXA 3D · construtor.js · 08/11/2026
   ------------------------------------------------------------
   O CONSTRUTOR DE GALPÃO — seção 4 do documento dele.

   ETAPA 1, E SÓ A ETAPA 1: desenhar no papel.

   Esta tela monta a estante que o Ismael digitar e DESENHA, para
   ele conferir no 3D antes de qualquer coisa chegar na planilha.
   Não existe gravação aqui. O botão de gravar está desligado de
   propósito, com o motivo escrito na tela — a seção 10 do
   documento dele manda pedir autorização antes de cada etapa, e
   endereço gravado errado arrasta produto vinculado junto.

   Duas decisões dele, de 08/11, que estão amarradas no código:

     · UM SKU POR DIVISÃO. Cada box guarda um item só, então a
       capacidade nasce 1 e não há lista dentro do box.
     · LETRA ATÉ 26, NÚMERO DEPOIS. E por prateleira inteira,
       nunca metade letra e metade número.

   A conta toda mora no layout3d, que é matemática pura e tem
   prova rodando sem navegador. Aqui é só a tela.
   ============================================================ */
(function (raiz) {
  'use strict';

  var C = {
    nome: 'CONSTRUTOR3D',
    versao: '6.9.0',
    aberto: false,
    projeto: null,
    /* o galpão real fica guardado enquanto o projeto está na tela,
       para voltar sem precisar consultar o Core de novo */
    guardado: null
  };

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(id, padrao) {
    var el = $(id);
    if (!el) return padrao;
    var n = Number(String(el.value).replace(',', '.'));
    return isFinite(n) ? n : padrao;
  }
  function txt(id) { var el = $(id); return el ? String(el.value || '').trim() : ''; }

  /* ------------------------------------------------------------
     O FORMULÁRIO
     ------------------------------------------------------------ */
  /* ============================================================
     [F2] FASE 2 · 14/11 · CONSTRUTOR PROFISSIONAL · seção 5
     ------------------------------------------------------------
     O que entrou, item por item do prompt:
       · quantidade de módulos, distância entre módulos
       · altura individual de cada nível, além da altura padrão
       · distância entre estantes e altura livre do galpão
       · duplicar estante
       · adicionar nível e remover nível NÃO UTILIZADO
       · comparar o projetado com o que já está cadastrado
       · modos Projeto, Visualização e Operação
       · validações antes de gravar: código duplicado, endereço
         conflitante, dimensão inválida e posição já utilizada

     O QUE ELE NÃO FAZ, e é de propósito: não grava. A gravação
     cria endereço em produção e endereço leva produto vinculado
     junto. A seção 5 manda validar ANTES de gravar; validar é o
     que esta fase entrega. Ligar a escrita é decisão do Ismael,
     e vai precisar de teste contra o Core de verdade.
     ============================================================ */

  C.MODOS = { projeto: 'Projeto', visualizacao: 'Visualização', operacao: 'Operação' };
  C.modo = 'projeto';
  C.niveis = [];          /* altura em cm de cada nível, quando informada */

  C.html = function () {
    return '' +
    '<div class="construtor">' +

      '<div class="grupo" id="cModos" role="group" aria-label="Modo" ' +
           'style="margin-bottom:12px;width:100%">' +
        '<button class="btn" data-modo="projeto" aria-pressed="true">Projeto</button>' +
        '<button class="btn" data-modo="visualizacao" aria-pressed="false">Visualização</button>' +
        '<button class="btn" data-modo="operacao" aria-pressed="false">Operação</button>' +
      '</div>' +

      '<div class="aviso" id="cAvisoModo" style="margin:0 0 12px">' +
        '<b>Modo Projeto.</b> O que aparece no galpão agora é um DESENHO. ' +
        'Nada aqui está cadastrado e nada foi gravado.' +
      '</div>' +

      '<div class="campo2">' +
        '<div class="campo">' +
          '<label for="cRua">Rua</label>' +
          '<input id="cRua" type="text" value="A" maxlength="12" autocomplete="off">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cEstante">Estante</label>' +
          '<input id="cEstante" type="text" value="A01" maxlength="16" autocomplete="off">' +
        '</div>' +
      '</div>' +

      '<div class="campo3">' +
        '<div class="campo">' +
          '<label for="cModulos">Módulos</label>' +
          '<input id="cModulos" type="number" min="1" max="30" value="1">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cPrateleiras">Prateleiras</label>' +
          '<input id="cPrateleiras" type="number" min="1" max="20" value="1">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cPrimeira">Do nível</label>' +
          '<input id="cPrimeira" type="number" min="1" max="99" value="1">' +
        '</div>' +
      '</div>' +

      '<div class="campo">' +
        '<label for="cDivisoes">Divisões por prateleira, em cada módulo</label>' +
        '<input id="cDivisoes" type="number" min="1" max="200" value="20">' +
      '</div>' +

      '<div class="sep"></div>' +
      '<div class="small" style="margin-bottom:8px;color:var(--texto-2)">' +
        'As medidas são de trena, em centímetros. É o que decide se a estante ' +
        'sai do tamanho certo no desenho.' +
      '</div>' +

      '<div class="campo3">' +
        '<div class="campo">' +
          '<label for="cLargura">Largura da divisão</label>' +
          '<input id="cLargura" type="number" min="5" max="400" value="30">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cProfundidade">Profundidade</label>' +
          '<input id="cProfundidade" type="number" min="10" max="200" value="60">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cAltura">Altura do nível</label>' +
          '<input id="cAltura" type="number" min="10" max="300" value="55">' +
        '</div>' +
      '</div>' +

      '<div class="campo3">' +
        '<div class="campo">' +
          '<label for="cVaoModulo">Entre módulos</label>' +
          '<input id="cVaoModulo" type="number" min="0" max="200" value="0">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cVaoEstante">Entre estantes</label>' +
          '<input id="cVaoEstante" type="number" min="0" max="500" value="0">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="cAlturaLivre">Pé-direito do galpão</label>' +
          '<input id="cAlturaLivre" type="number" min="0" max="3000" value="0">' +
        '</div>' +
      '</div>' +
      '<div class="small" style="margin:-4px 0 10px;color:var(--texto-3)">' +
        'Zero quer dizer “não informado”: o desenho segue com a medida que ' +
        'já usava. Não invento medida que o senhor não deu.' +
      '</div>' +

      '<div class="sep"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;' +
           'gap:8px;margin-bottom:8px">' +
        '<b style="font-size:12.5px">Altura de cada nível</b>' +
        '<span style="display:flex;gap:6px">' +
          '<button class="btn" id="cNivelMais" title="Acrescentar um nível">+ nível</button>' +
          '<button class="btn" id="cNivelMenos" title="Tirar o último nível">− nível</button>' +
        '</span>' +
      '</div>' +
      '<div id="cNiveis"></div>' +

      '<div id="cResultado"></div>' +
      '<div id="cValidacao"></div>' +
      '<div id="cComparacao"></div>' +

      '<div class="sep"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn" id="cVoltar">Voltar ao galpão real</button>' +
        '<button class="btn" id="cDuplicar" title="Mesma estante, código seguinte">' +
          'Duplicar estante</button>' +
        '<button class="btn" id="cComparar">Comparar com o cadastrado</button>' +
        '<button class="btn" id="cGravar" disabled>Gravar no Core</button>' +
      '</div>' +
      '<div class="small" id="cRecadoGravar" style="margin-top:8px;' +
           'color:var(--texto-3);line-height:1.5">' +
        'Gravar continua desligado nesta fase. As validações já rodam e dizem ' +
        'o que aconteceria. Ligar a escrita cria endereço em produção, e ' +
        'endereço leva produto vinculado junto: isso vai depender da sua ' +
        'autorização e de um teste contra o Core.' +
      '</div>' +

    '</div>';
  };

  /* ------------------------------------------------------------
     [F2] OS NÍVEIS · altura individual, seção 5
     ------------------------------------------------------------ */
  C.pintarNiveis = function () {
    var alvo = $('cNiveis');
    if (!alvo) return;
    var quantos = num('cPrateleiras', 1);
    var padrao = num('cAltura', 55);
    var primeiro = num('cPrimeira', 1);

    while (C.niveis.length < quantos) C.niveis.push(0);
    if (C.niveis.length > quantos) C.niveis.length = quantos;

    /* [F2] 14/11 — NÃO reconstruir os campos a cada tecla.

       Eu refazia o innerHTML em toda atualização, e atualização
       acontece a cada tecla. O campo era destruído no meio da
       digitação: quem digitasse "40" perdia o "0" e o cursor
       pulava fora. Agora, se a quantidade de níveis não mudou,
       eu só atualizo o texto ao lado e deixo os campos em paz. */
    var jaTem = alvo.querySelectorAll('[data-nivel]');
    if (jaTem.length === quantos) {
      for (var j = 0; j < quantos; j++) {
        var dica = alvo.querySelectorAll('[data-dica]')[j];
        if (dica) {
          dica.textContent = C.niveis[j] > 0 ? C.niveis[j] + ' cm'
                                             : 'usa o padrão: ' + padrao + ' cm';
        }
        var rot = alvo.querySelectorAll('label')[j];
        if (rot) rot.textContent = 'Nível ' + (primeiro + j);
      }
      return;
    }

    var h = '';
    for (var i = 0; i < quantos; i++) {
      h += '<div class="campo2" style="align-items:end;margin-bottom:6px">' +
        '<div class="campo" style="margin:0">' +
          '<label for="cNivel' + i + '">Nível ' + (primeiro + i) + '</label>' +
          '<input id="cNivel' + i + '" type="number" min="0" max="400" ' +
            'data-nivel="' + i + '" value="' + (C.niveis[i] || 0) + '">' +
        '</div>' +
        '<div class="small" data-dica="' + i + '" ' +
             'style="padding-bottom:8px;color:var(--texto-3)">' +
          (C.niveis[i] > 0 ? C.niveis[i] + ' cm'
                           : 'usa o padrão: ' + padrao + ' cm') +
        '</div>' +
      '</div>';
    }
    alvo.innerHTML = h;

    Array.prototype.forEach.call(alvo.querySelectorAll('[data-nivel]'), function (el) {
      el.addEventListener('input', function () {
        C.niveis[Number(el.getAttribute('data-nivel'))] = Number(el.value) || 0;
        C.atualizar();
      });
    });
  };

  /* Remover nível: seção 5 diz "Remover níveis AINDA NÃO UTILIZADOS",
     e a seção 5 de novo: "Nenhuma posição com saldo ou histórico
     poderá ser removida automaticamente". Então antes de tirar, eu
     olho o cadastro e recuso se houver material lá. */
  C.nivelEstaUsado = function (nomeDoNivel) {
    var reais = (raiz.APP3D && raiz.APP3D.locais) || [];
    var rua = txt('cRua').toUpperCase(), est = txt('cEstante').toUpperCase();
    var achados = [];
    for (var i = 0; i < reais.length; i++) {
      var r = reais[i];
      if (String(r.rua || '').toUpperCase() !== rua) continue;
      if (String(r.estante || '').toUpperCase() !== est) continue;
      if (String(r.prateleira || '') !== String(nomeDoNivel)) continue;
      var qtd = Number(r.itens || (r.ocupacao || []).length || 0);
      achados.push({ codigo: r.codigo, itens: qtd });
    }
    return achados;
  };

  /* ------------------------------------------------------------
     [F2] VALIDAÇÕES · seção 5, antes de gravar
     ------------------------------------------------------------ */
  C.validar = function (projeto) {
    var impedem = [], avisam = [];
    if (!projeto || !projeto.ok) {
      return { pode: false, impedem: (projeto && projeto.erros) || ['projeto inválido'],
               avisam: [], jaExistem: [], comMaterial: [] };
    }

    /* 1 · dimensões inválidas */
    var larg = num('cLargura', 0), prof = num('cProfundidade', 0), alt = num('cAltura', 0);
    if (larg <= 0) impedem.push('A largura da divisão precisa ser maior que zero.');
    if (prof <= 0) impedem.push('A profundidade precisa ser maior que zero.');
    if (alt <= 0) impedem.push('A altura do nível precisa ser maior que zero.');
    for (var n = 0; n < C.niveis.length; n++) {
      if (C.niveis[n] < 0) impedem.push('O nível ' + (n + 1) + ' está com altura negativa.');
    }

    /* altura total contra o pé-direito do galpão */
    var livre = num('cAlturaLivre', 0);
    var somaCm = 0;
    for (var k = 0; k < projeto.contagem.prateleiras; k++) {
      somaCm += (C.niveis[k] > 0 ? C.niveis[k] : alt);
    }
    if (livre > 0 && somaCm > livre) {
      impedem.push('A estante fica com ' + (somaCm / 100).toFixed(2).replace('.', ',') +
        ' m e o pé-direito informado é ' + (livre / 100).toFixed(2).replace('.', ',') +
        ' m. Não cabe.');
    }

    /* 2 · código duplicado dentro do próprio projeto */
    var vistos = {}, duplicados = [];
    for (var i = 0; i < projeto.locais.length; i++) {
      var c = projeto.locais[i].codigo;
      if (vistos[c]) { if (duplicados.indexOf(c) === -1) duplicados.push(c); }
      vistos[c] = 1;
    }
    if (duplicados.length) {
      impedem.push('Código repetido dentro do próprio projeto: ' +
        duplicados.slice(0, 5).join(', ') +
        (duplicados.length > 5 ? ' e mais ' + (duplicados.length - 5) : '') + '.');
    }

    /* 3 e 4 · conflito com o que já está cadastrado, e posição já usada */
    var reais = (raiz.APP3D && raiz.APP3D.locais) || [];
    var porCodigo = {};
    for (var r = 0; r < reais.length; r++) {
      var cod = String(reais[r].codigo || '').toUpperCase();
      if (cod) porCodigo[cod] = reais[r];
    }
    var jaExistem = [], comMaterial = [];
    for (var j = 0; j < projeto.locais.length; j++) {
      var achado = porCodigo[String(projeto.locais[j].codigo).toUpperCase()];
      if (!achado) continue;
      jaExistem.push(projeto.locais[j].codigo);
      var qtd = Number(achado.itens || (achado.ocupacao || []).length || 0);
      if (qtd > 0) comMaterial.push({ codigo: projeto.locais[j].codigo, itens: qtd });
    }
    if (comMaterial.length) {
      impedem.push(comMaterial.length + ' posição(ões) deste projeto JÁ EXISTEM e têm ' +
        'material guardado. Gravar por cima mexeria em endereço com produto vinculado.');
    } else if (jaExistem.length) {
      avisam.push(jaExistem.length + ' posição(ões) já existem no cadastro, vazias. ' +
        'Gravar não criaria endereço novo para elas.');
    }

    return { pode: impedem.length === 0, impedem: impedem, avisam: avisam,
             jaExistem: jaExistem, comMaterial: comMaterial,
             alturaTotalCm: somaCm };
  };

  /* ------------------------------------------------------------
     DESENHAR O PROJETO · mesmo caminho do galpão real
     ------------------------------------------------------------ */
  C.atualizar = function () {
    var L = raiz.LAYOUT3D;
    var alturasCm = C.niveis.slice();
    var pedido = {
      rua: txt('cRua'),
      estante: txt('cEstante'),
      modulos: num('cModulos', 1),
      prateleiras: num('cPrateleiras', 1),
      primeiraPrateleira: num('cPrimeira', 1),
