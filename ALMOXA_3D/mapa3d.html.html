<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALMOX PRO 3D 6.5.0 · 15/11</title>
<style>
/* ALMOXA 3D · almoxa3d.css · 08/11/2026
   Responsivo de verdade (seção 11): no celular o painel vira
   gaveta de baixo, e a tela 3D fica inteira para o dedo. */
:root{
  --fundo:#EEF1F5; --papel:#FFFFFF; --texto:#1B2430; --texto2:#5A6472;
  --texto3:#8A93A0; --borda:#DDE2E8; --azul:#2F7BE8; --azulEscuro:#1E3A5F;
  --verde:#2E9E5B; --cinza:#9AA3AE; --amarelo:#E8A33D; --vermelho:#D2443B;
  --sombra:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);
  color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
#app{display:flex;height:100%;width:100%}

/* ---------- a cena ---------- */
#cena{position:relative;flex:1;min-width:0}
#tela3d{width:100%;height:100%;display:block;outline:none;touch-action:none}

#barra{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;
  gap:8px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(238,241,245,.96),rgba(238,241,245,0));
  pointer-events:none}
#barra>*{pointer-events:auto}
.marca{font-weight:700;letter-spacing:.02em;color:var(--azulEscuro);margin-right:4px}
.marca small{font-weight:500;color:var(--texto3);display:block;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase}

.btn{border:1px solid var(--borda);background:var(--papel);color:var(--texto2);
  border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;
  box-shadow:var(--sombra);white-space:nowrap}
.btn:hover{border-color:#C3CBD5;color:var(--texto)}
.btn[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:active{transform:translateY(1px)}

/* ---------- legenda ---------- */
#legenda{position:absolute;left:12px;bottom:12px;background:var(--papel);
  border:1px solid var(--borda);border-radius:11px;padding:9px 11px;
  box-shadow:var(--sombra);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--texto2)}
.bolinha{width:11px;height:11px;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- painel ---------- */
#painel{width:330px;flex:none;background:var(--papel);border-left:1px solid var(--borda);
  display:flex;flex-direction:column;overflow:hidden}
#painel h2{margin:0;padding:14px 16px 10px;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--texto3);border-bottom:1px solid var(--borda)}
#corpoPainel{padding:14px 16px;overflow:auto;flex:1}

.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cartao{border:1px solid var(--borda);border-radius:10px;padding:9px 11px}
.cartao b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.cartao span{font-size:11px;color:var(--texto3)}

.barraOcup{height:8px;border-radius:99px;background:#EDF0F4;overflow:hidden;margin:4px 0 14px}
.barraOcup i{display:block;height:100%;background:var(--verde);border-radius:99px}

.linha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px dashed var(--borda);font-size:13px}
.linha:last-child{border-bottom:0}
.linha span{color:var(--texto3)}
.linha b{font-weight:600;text-align:right;word-break:break-word}

.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:700;letter-spacing:.03em;color:#fff}
.vazio{text-align:center;color:var(--texto3);padding:26px 10px;font-size:13px;line-height:1.6}
.aviso{border:1px solid #F0D8A8;background:#FEF8EC;color:#7A5B18;border-radius:10px;
  padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.erro{border-color:#F2C3BF;background:#FDF1F0;color:#8A2B23}

/* [FRENTE] 15/11 — estas variantes eram usadas na marcação e não
   tinham regra nenhuma: todo aviso saía cor de âmbar, inclusive o
   que dizia "deu certo". Agora cada um tem a sua cor. */
.aviso.azul{border-color:#BBD3F2;background:#F1F6FD;color:#1C4E8F}
.aviso.cinza{border-color:#D9DEE6;background:#F6F8FA;color:#4A5568}
.aviso.verde{border-color:#B6DCC4;background:#F1FAF4;color:#1F6B41}
.aviso.amarelo{border-color:#F0D8A8;background:#FEF8EC;color:#7A5B18}

/* a lista de marcar rua, estante e nível */
.opcao{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:4px 0;
  border:1px solid var(--linha,#E3E7EE);border-radius:9px;cursor:pointer;
  font-size:13px;background:#fff}
.opcao:hover{background:#F6F8FA}
.opcao input{width:17px;height:17px;flex:0 0 auto;margin:0}
.btn.pequeno{padding:3px 9px;font-size:11.5px;border-radius:7px}

/* ============================================================
   [F1] FASE 1 · 14/11 · estabilização visual
   Nada aqui muda geometria, cor de ocupação ou endereçamento:
   é só a casca. As cores das bolinhas continuam vindo das
   CORES do layout3d, que a prova compara peça por peça.
   ============================================================ */

/* grupos de botões: as visões viram um bloco só, em vez de
   quatro botões soltos disputando espaço com o resto */
.grupo{display:inline-flex;background:var(--papel);border:1px solid var(--borda);
  border-radius:10px;box-shadow:var(--sombra);overflow:hidden}
.grupo .btn{border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--borda)}
.grupo .btn:last-child{border-right:0}
.grupo .btn[disabled]{opacity:.55;cursor:not-allowed}
.grupo .btn[disabled]:hover{color:var(--texto2);border-color:var(--borda)}
.selo{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;
  background:var(--borda);color:var(--texto3);font-size:9.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}

/* busca */
.busca{position:relative;display:inline-flex;align-items:center}
.busca input{border:1px solid var(--borda);background:var(--papel);color:var(--texto);
  border-radius:10px;padding:7px 11px;font-size:12.5px;box-shadow:var(--sombra);
  width:220px;max-width:38vw;font-family:inherit}
.busca input:focus{outline:2px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
.busca .conta{position:absolute;right:8px;font-size:11px;color:var(--texto3);
  background:var(--papel);padding:0 3px;pointer-events:none}

/* indicador de conexão: o estado é posto pelo app, nunca chutado */
.pino{display:inline-flex;align-items:center;gap:6px;background:var(--papel);
  border:1px solid var(--borda);border-radius:99px;padding:5px 11px 5px 9px;
  font-size:11.5px;color:var(--texto2);box-shadow:var(--sombra);white-space:nowrap}
.pino i{width:8px;height:8px;border-radius:99px;background:var(--cinza);flex:none}
.pino b{font-weight:600}
.pino.ligado i{background:var(--verde)}
.pino.demo i{background:var(--amarelo)}
.pino.caido i{background:var(--vermelho)}
.pino.verificando i{background:var(--cinza);animation:pisca 1.1s ease-in-out infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}

/* painel recolhível */
#painel h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
#v_fecharPainel{border:0;background:transparent;color:var(--texto3);cursor:pointer;
  font-size:19px;line-height:1;padding:0 2px;border-radius:7px}
#v_fecharPainel:hover{color:var(--texto);background:var(--borda)}
#app.painel-fechado #painel{display:none}
#puxador{display:none}
#app.painel-fechado #puxador{display:block;position:absolute;top:50%;right:0;
  transform:translateY(-50%);width:26px;height:64px;border:1px solid var(--borda);
  border-right:0;border-radius:10px 0 0 10px;background:var(--papel);cursor:pointer;
  box-shadow:var(--sombra);z-index:5}
#app.painel-fechado #puxador::after{content:"‹";display:block;font-size:19px;
  color:var(--texto3);line-height:62px;text-align:center}

/* um endereço que a busca achou */
.achado{border:1px solid var(--borda);border-radius:9px;padding:8px 10px;margin-bottom:6px;
  display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;
  font-size:12.5px;background:var(--papel)}
.achado:hover{border-color:var(--azul)}
.achado b{font-variant-numeric:tabular-nums}
.achado span{color:var(--texto3);font-size:11px}

/* dado que ainda não tem fonte. Seção 4: "Se o dado não estiver
   disponível, informar que não está integrado." Fica cinza e
   escrito, nunca preenchido com número de enfeite. */
.semfonte{color:var(--texto3);font-weight:500;font-style:italic;font-size:12px}

/* [F2] o selo de PROJETO sobre a cena. A estrutura projetada não
   pode ser confundida com a cadastrada (seção 5), e cor eu não
   posso mudar: as cores de ocupação são regra preservada. Então
   o aviso é escrito, por cima da cena. */
#selo3d{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(232,163,61,.94);color:#3A2708;font-weight:800;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;padding:7px 16px;border-radius:99px;
  pointer-events:none;z-index:4;white-space:nowrap;
  box-shadow:0 2px 10px rgba(16,24,40,.22)}
@media (max-width:420px){ #selo3d{font-size:10px;padding:5px 11px} }

/* ============================================================
   [F3] FASE 3 · rota, cartões de ocorrência e minimapa 2D
   ============================================================ */
.pontoRota{border:1px solid var(--borda);border-radius:10px;padding:9px 10px;
  margin-bottom:8px;background:var(--papel)}
.pr-topo{display:flex;align-items:center;gap:8px}
.pr-num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:99px;color:#fff;font-size:11.5px;
  font-weight:800;flex:none}
.pr-topo b{flex:1;cursor:pointer;font-size:12.5px}
.pr-topo b:hover{text-decoration:underline}
.pr-acoes{display:flex;gap:4px}
.pr-acoes .btn{padding:3px 7px;font-size:11px;box-shadow:none}
.pr-linha{display:flex;gap:6px;margin-top:7px;align-items:center}
.pr-linha select{flex:1;border:1px solid var(--borda);border-radius:8px;
  padding:5px 7px;font-size:12px;background:var(--papel);color:var(--texto);
  font-family:inherit}
.pr-linha .btn{padding:5px 9px;font-size:11.5px;box-shadow:none}

.cartaoOc{margin-top:9px;border:1px solid #F0C9C4;background:#FDF4F3;
  border-radius:9px;padding:9px 10px}
.oc-tit{font-weight:800;font-size:12px;color:#8A2B23;margin-bottom:5px;
  letter-spacing:.02em}
.cartaoOc .linha{border-bottom-color:#F0D8D4;font-size:12px;padding:5px 0}
.formOc{margin-top:9px;border:1px dashed var(--borda);border-radius:9px;padding:9px 10px}
.formOc .campo{margin-bottom:7px}
.formOc select,.formOc input{width:100%;border:1px solid var(--borda);
  border-radius:8px;padding:6px 8px;font-size:12px;background:var(--papel);
  color:var(--texto);font-family:inherit}

/* o minimapa: planta de cima, canto da cena */
#minimapa{position:absolute;right:12px;bottom:12px;width:230px;height:170px;
  background:var(--papel);border:1px solid var(--borda);border-radius:11px;
  box-shadow:var(--sombra);padding:6px;z-index:5;overflow:hidden}
#minimapa svg{width:100%;height:100%;display:block}
#minimapa [data-cod]{cursor:pointer}
#minimapa [data-cod]:hover{stroke:#1B2430;stroke-width:.1}
.mini-vazio{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--texto3);font-size:11.5px}
@media (max-width:860px){
  #minimapa{width:150px;height:112px;right:8px;bottom:8px}
}

/* ============================================================
   [F4] FASE 4 · inventário móvel
   ============================================================ */
.atvCartao{border:1px solid var(--borda);border-radius:10px;padding:10px 11px;
  margin-bottom:8px;cursor:pointer;background:var(--papel)}
.atvCartao:hover{border-color:var(--azul)}
.atv-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-bottom:4px}
.chipAtv{font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 8px;
  border-radius:99px;background:var(--borda);color:var(--texto2);text-transform:uppercase}
.chipAtv.aberta{background:#FEF2DC;color:#7A5B18}
.chipAtv.em_execucao{background:#E2EEFC;color:#1E3A5F}
.chipAtv.confirmada{background:#E6F6EC;color:#1E5F3A}
.chipAtv.cancelada{background:#F3F4F6;color:#8A93A0}

.posInv{display:flex;align-items:center;gap:8px;padding:7px 2px;
  border-bottom:1px dashed var(--borda);cursor:pointer;font-size:12.5px}
.posInv:hover b{text-decoration:underline}
.posInv i{width:9px;height:9px;border-radius:99px;flex:none}
.posInv b{flex:1}
.posInv span{color:var(--texto3);font-size:11px;text-align:right}

.leitorCx{position:relative;margin-top:10px;border-radius:11px;overflow:hidden;
  background:#000;aspect-ratio:4/3}
.leitorCx video{width:100%;height:100%;object-fit:cover;display:block}
.leitorMira{position:absolute;inset:18% 14%;border:2px solid rgba(255,255,255,.9);
  border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}

.confCx{margin-top:10px;border:1px solid var(--borda);border-radius:11px;
  padding:11px;background:var(--papel)}
.confCx .campo{margin-bottom:8px}
.confCx input,.confCx select{width:100%;border:1px solid var(--borda);
  border-radius:8px;padding:7px 9px;font-size:13px;background:var(--papel);
  color:var(--texto);font-family:inherit}
.btn.primario{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.primario:hover{background:#2468C9;color:#fff}

.tempo{margin-top:10px}
.tempoItem{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--borda)}
.tempoHora{font-size:10.5px;color:var(--texto3);white-space:nowrap;
  font-variant-numeric:tabular-nums;padding-top:2px}
.tempoTexto{flex:1;font-size:12.5px}

/* ============================================================
   [F5] FASE 5 · ferramentaria
   ============================================================ */
.ferCartao{border:1px solid var(--borda);border-radius:10px;padding:9px 10px;
  margin-bottom:7px;cursor:pointer;background:var(--papel)}
.ferCartao:hover{border-color:var(--azul)}
.fer-topo{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.fer-topo i{width:9px;height:9px;border-radius:99px;flex:none}
.fer-topo b{flex:1;font-size:12px}
.fer-topo span{font-size:10.5px;color:var(--texto3);text-transform:uppercase;
  letter-spacing:.03em}
.fer-nome{font-size:13px;font-weight:600;margin-bottom:2px}
.ferCartao .linha{padding:4px 0;font-size:12px;border-bottom:0}
.opsFer{display:flex;gap:7px;flex-wrap:wrap}
.opsFer .btn{flex:1;min-width:46%}

/* ============================================================
   [F6] FASE 6 · indicadores e apresentação
   ============================================================ */
.indLinha{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.indNome{font-size:12px;color:var(--texto2);width:66px;flex:none}
.indBarra{flex:1;height:9px;border-radius:99px;background:#EDF0F4;overflow:hidden}
.indBarra i{display:block;height:100%;border-radius:99px}
.indLinha b{font-size:12px;width:40px;text-align:right;
  font-variant-numeric:tabular-nums}

/* modo de apresentação: some tudo, fica o galpão */
#app.apresentando #painel{display:none}
#app.apresentando #puxador{display:none}
#app.apresentando #barra{opacity:0;pointer-events:none;transition:opacity .2s}
#app.apresentando #cena:hover #barra{opacity:1;pointer-events:auto}
#app.apresentando #minimapa{display:none}

/* [V] o carimbo de versão, sempre visível */
/* [ACOMP] 15/11 — etiquetas de situação no painel de acompanhamento.
   O .pino existente colore uma bolinha filha; estas colorem o texto. */
.pino.verde{background:#EDF9F1;border-color:#B6DCC4;color:#1F6B41}
.pino.amarelo{background:#FEF8EC;border-color:#F0D8A8;color:#7A5B18}
.pino.vermelho{background:#FDF1F0;border-color:#F2C3BF;color:#8A2B23}
.pino.azul{background:#F1F6FD;border-color:#BBD3F2;color:#1C4E8F}
.pino.cinza{background:#F6F8FA;border-color:#D9DEE6;color:#4A5568}

.pino.versao{cursor:pointer;font-variant-numeric:tabular-nums;font-weight:700;
  letter-spacing:.02em}
.pino.versao::before{content:"v";opacity:.5;margin-right:1px;font-weight:600}
.pino.versao.producao{border-color:#BFE3CC;color:#1E5F3A}
.pino.versao.local{border-color:#F0D8A8;color:#7A5B18}
.pino.versao.desconhecido{border-color:#F2C3BF;color:#8A2B23}
.peq{font-size:11px}

/* ---------- celular e tablet (seção 11) ---------- */
@media (max-width:860px){
  #app{flex-direction:column}
  #painel{width:100%;height:46vh;border-left:0;border-top:1px solid var(--borda);
    border-radius:16px 16px 0 0;margin-top:-16px;box-shadow:0 -6px 24px rgba(16,24,40,.08)}
  #painel h2{padding:12px 16px 8px}
  #legenda{bottom:auto;top:56px;left:12px;right:12px;justify-content:center}
  .numeros{grid-template-columns:repeat(4,1fr)}
  .cartao b{font-size:16px}
}
@media (max-width:420px){
  .numeros{grid-template-columns:repeat(2,1fr)}
  #barra{padding:8px}
  .btn{padding:6px 9px;font-size:12px}
}
/* [F1] tablet e coletor: a barra rola na horizontal em vez de
   empilhar e comer a cena */
@media (max-width:1100px){
  #barra{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  #barra::-webkit-scrollbar{display:none}
  #barra>*{flex:none}
  .busca input{width:170px}
}
/* [EMBUTIDO] 15/11 — quando o ALMOXA CAMPO mostra o mapa dentro
   dele, a barra de cima do aplicativo já diz onde a pessoa está.
   Repetir "ALMOX PRO 3D" aqui só come altura, que é justamente o
   que falta num celular. */
body.embutido .marca{display:none}
body.embutido #barra{padding:6px 8px}
body.embutido #legenda{display:none}

@media (max-width:860px){
  .marca small{display:none}
  .busca input{width:140px}
  /* no celular o painel é gaveta: a alça fica embaixo, não ao lado */
  #app.painel-fechado #puxador{top:auto;bottom:0;right:50%;transform:translateX(50%);
    width:92px;height:22px;border:1px solid var(--borda);border-bottom:0;
    border-radius:12px 12px 0 0}
  #app.painel-fechado #puxador::after{content:"⌃";line-height:20px}
}
/* coletor de dados e telas muito baixas: o painel não pode comer
   a cena inteira */
@media (max-height:520px) and (max-width:860px){
  #painel{height:58vh}
  #legenda{display:none}
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fundo:#141922; --papel:#1C222C; --texto:#E8ECF1; --texto2:#AEB7C3;
    --texto3:#7C8694; --borda:#2B333F; --azulEscuro:#9BC2F5;
    --sombra:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}

/* ============================================================
   CONSTRUTOR DE ESTANTE · 08/11
   ============================================================ */
.construtor .campo { margin-bottom: 10px; }
.construtor label {
  display: block; font-size: 11px; letter-spacing: .3px;
  text-transform: uppercase; color: var(--texto-3); margin-bottom: 4px;
}
.construtor input {
  width: 100%; box-sizing: border-box;
  padding: 8px 10px; font-size: 14px; font-family: inherit;
  color: var(--texto-1); background: #fff;
  border: 1px solid var(--borda); border-radius: 6px;
}
.construtor input:focus {
  outline: none; border-color: #2F7BE8;
  box-shadow: 0 0 0 3px rgba(47,123,232,.14);
}
.construtor .campo2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.construtor .campo3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.construtor .sep { height: 1px; background: var(--borda); margin: 14px 0; }
.construtor .codigos { display: flex; flex-wrap: wrap; gap: 4px; }
.construtor .cod {

<!-- ===== Babylon.js · versão fixa, nunca "latest" ============

<!-- ===== os quatro arquivos do módulo ======================
     No Apps Script, estas quatro linhas viram o conteúdo dos
     arquivos, colado aqui dentro. Nada mais muda.
     ========================================================= -->
<script>
/* ===== layout3d.js ===== */
/* ============================================================
   ALMOXA 3D · layout3d.js  ·  08/11/2026
   ------------------------------------------------------------
   A MATEMÁTICA DO GALPÃO. Aqui não entra Babylon.

   Esta camada pega as localizações do ALMOX PRO — as mesmas da
   aba ALMOXA_LOCALIZACOES, com rua, estante, prateleira e
   posição — e devolve uma lista de PEÇAS com medida e lugar em
   metros:

       { tipo:'montante', x, y, z, lx, ly, lz, cor, ... }

   O motor 3D só traduz essa lista em malhas. Separar assim tem
   dois motivos concretos:

     1. a conta pode ser testada sem placa de vídeo e sem CDN —
        e foi: a suíte prova_layout3d.js roda em Node;
     2. no dia em que o Babylon for trocado, ou aparecer uma
        visão 2D de impressão, a geometria continua valendo.

   AS MEDIDAS SÃO DE ESTANTE DE VERDADE, em metros. Não é
   quadradinho em tela: é uma estante porta-palete com montante,
   longarina, prateleira e vão de corredor por onde cabe gente.
   ============================================================ */
(function (raiz) {
  'use strict';

  /* ----------------------------------------------------------
     MEDIDAS PADRÃO · metros
     Vieram de estante de almoxarifado comum. Dá para trocar
     passando outras em LAYOUT.montar(locais, { medidas }).
     ---------------------------------------------------------- */
  var MEDIDAS = {
    larguraPosicao: 1.00,   /* frente de uma posição */
    alturaNivel: 0.55,      /* de uma prateleira à outra */
    profundidade: 0.60,     /* o quanto a estante entra */
    montante: 0.06,         /* a coluna de ferro */
    longarina: 0.05,        /* a viga horizontal */
    prateleira: 0.03,       /* a chapa onde o material apoia */
    corredor: 2.40,         /* entre uma rua e outra: cabe empilhadeira */
    vaoEstantes: 0.30,      /* respiro entre estantes da mesma rua */
    peDireito: 0.00,        /* altura livre do chão até a 1ª prateleira */
    folgaPiso: 2.00         /* sobra do piso além das estantes */
  };

  /* ----------------------------------------------------------
     AS CORES · seção 8 da especificação
     Elas NÃO são escolha de gosto: saem do dado oficial. Quem
     pinta de verde é a ocupação, não o programador.
     ---------------------------------------------------------- */
  var CORES = {
    vazia:       '#9AA3AE',   /* cinza  · posição livre */
    ocupada:     '#2E9E5B',   /* verde  · tem material */
    atencao:     '#E8A33D',   /* amarelo· cheia ou quase */
    problema:    '#D2443B',   /* vermelho· bloqueada ou divergente */
    selecionada: '#2F7BE8',   /* azul   · o que o usuário clicou */
    estrutura:   '#5A6472',   /* o ferro da estante */
    piso:        '#E7E9EC',
    faixa:       '#C9CDD3'    /* a pintura do corredor */
  };

  function lp(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }
  function cima(v) { return lp(v).toUpperCase(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /* ----------------------------------------------------------
     A COR DE UMA POSIÇÃO
     ------------------------------------------------------------
     Ordem importa: bloqueio manda sobre lotação, que manda sobre
     ocupação. Uma posição bloqueada com material continua
     vermelha — senão o vermelho some justamente onde ele serve.
     ---------------------------------------------------------- */
  /* ------------------------------------------------------------
     [12/11] DOIS ERROS QUE DEIXAVAM O MAPA MENTIR

     1. Eu lia loc.status. A rota locais.listar não devolve
        "status": devolve "situacao". Então a leitura dava sempre
        vazia e NENHUMA posição ficava vermelha, nunca.

     2. Eu comparava loc.itens com a capacidade. Mas "itens" é a
        CONTAGEM DE SKUs DIFERENTES guardados ali, e capacidade é
        de quantidade. Quem mede quantidade é "ocupacao" — a soma
        do saldo —, e o próprio sistema já entrega "percentual"
        calculado. Comparar contagem de SKU com capacidade de
        quantidade pintava de amarelo posição vazia e deixava
        verde posição lotada.

     Agora: o bloqueio sai de qualquer um dos dois campos, e a
     lotação sai do percentual do sistema quando ele vem. Onde o
     dado não vier, a conta antiga continua valendo — por isso as
     provas de 08/11 seguem passando.
     ------------------------------------------------------------ */
  var BLOQUEIO = /^(BLOQUEAD|DIVERG|INTERDIT|INATIV|DESATIV)/;

  function corDaPosicao(loc) {
    if (!loc) return CORES.vazia;

    /* os DOIS campos, cada um por si. Escrever
       (loc.status || loc.situacao) deixava um "status" qualquer
       — um 'DISPONIVEL' velho, por exemplo — tapar a situacao
       de verdade, que era onde o bloqueio estava escrito. */
    if (BLOQUEIO.test(cima(loc.status))) return CORES.problema;
    if (BLOQUEIO.test(cima(loc.situacao))) return CORES.problema;
    if (loc.bloqueada === true || loc.ativo === false) return CORES.problema;

    var cap = num(loc.capacidade);

    /* quanto material está guardado ali */
    var qtd = (loc.ocupacao !== undefined && loc.ocupacao !== null)
      ? num(loc.ocupacao)
      : num(loc.itens);

    /* quantos SKUs diferentes — serve só para saber se está vazia */
    var skus = (loc.itens !== undefined && loc.itens !== null)
      ? num(loc.itens) : qtd;

    if (qtd <= 0 && skus <= 0) return CORES.vazia;

    /* o sistema já calcula o percentual: quando vier, mando nele */
    var pct = (loc.percentual !== undefined && loc.percentual !== null)
      ? num(loc.percentual)
      : (cap > 0 ? (qtd / cap) * 100 : 0);

    if (cap > 0 && pct >= 100) return CORES.atencao;   /* lotada */
    return CORES.ocupada;
  }

  function situacaoDaPosicao(loc) {
    var c = corDaPosicao(loc);
    if (c === CORES.problema) return 'BLOQUEADA';
    if (c === CORES.atencao) return 'LOTADA';
    if (c === CORES.ocupada) return 'OCUPADA';
    return 'VAZIA';
  }

  /* ----------------------------------------------------------
     ORGANIZAR: a lista plana vira árvore rua → estante →
     prateleira → posição. Ordenada, para o galpão não mudar de
     forma a cada carregamento.
     ---------------------------------------------------------- */
  function organizar(locais) {
    var ruas = {};
    var lista = Object.prototype.toString.call(locais) === '[object Array]' ? locais : [];

    for (var i = 0; i < lista.length; i++) {
      var l = lista[i];
      if (!l) continue;
      var nRua = cima(l.rua);
      if (!nRua) continue;
      var nEst = cima(l.estante) || '(sem estante)';
      var nPra = cima(l.prateleira) || '(sem prateleira)';

      if (!ruas[nRua]) ruas[nRua] = { nome: nRua, estantes: {} };
      var R = ruas[nRua];
      if (!R.estantes[nEst]) R.estantes[nEst] = { nome: nEst, prateleiras: {} };
      var E = R.estantes[nEst];
      if (!E.prateleiras[nPra]) E.prateleiras[nPra] = { nome: nPra, posicoes: [] };
      E.prateleiras[nPra].posicoes.push(l);
    }

    function chaves(o) { var a = []; for (var k in o) if (o.hasOwnProperty(k)) a.push(k); a.sort(); return a; }

    return chaves(ruas).map(function (nr) {
      var R = ruas[nr];
      return {
        nome: R.nome,
        estantes: chaves(R.estantes).map(function (ne) {
          var E = R.estantes[ne];
          return {
            nome: E.nome,
            prateleiras: chaves(E.prateleiras).map(function (np) {
              var P = E.prateleiras[np];
              P.posicoes.sort(function (a, b) {
                return cima(a.posicao) < cima(b.posicao) ? -1 : 1;
              });
              return P;
            })
          };
        })
      };
    });
  }

  /* ----------------------------------------------------------
     MONTAR: a árvore vira peças com medida e lugar
     ---------------------------------------------------------- */
  function montar(locais, opcoes) {
    opcoes = opcoes || {};
    var M = {};
    for (var k in MEDIDAS) M[k] = MEDIDAS[k];
    if (opcoes.medidas) for (var k2 in opcoes.medidas) M[k2] = opcoes.medidas[k2];

    /* ========================================================
       [F2] FASE 2 · 14/11 · altura por nível e vão entre módulos.

       ADITIVO E COM GUARDA, de propósito. Sem opcoes.alturasNiveis
       e sem opcoes.vaoModulo, cada conta abaixo dá exatamente o
       mesmo número de antes — e a prova compara peça por peça com
       o arquivo de 12/11 para garantir isso. A regra 3 do prompt
       manda preservar a matemática do LAYOUT3D: preservar não é
       deixar congelado, é não mudar o que já existia.
       ======================================================== */
    var alturas = null;
    if (Object.prototype.toString.call(opcoes.alturasNiveis) === '[object Array]' &&
        opcoes.alturasNiveis.length) {
      alturas = opcoes.alturasNiveis;
    }
    var vaoModulo = num(opcoes.vaoModulo) > 0 ? num(opcoes.vaoModulo) : 0;

    /* a altura de um vão: a do nível, quando informada */
    function alturaDoVao(i) {
      if (!alturas) return M.alturaNivel;
      var a = num(alturas[i]);
      return a > 0 ? a : M.alturaNivel;
    }
    /* a altura em que a chapa do nível i fica */
    function topoDoNivel(i) {
      if (!alturas) return M.peDireito + (i + 1) * M.alturaNivel;
      var y = M.peDireito;
      for (var k = 0; k <= i; k++) y += alturaDoVao(k);
      return y;
    }
    /* quantos vãos de módulo já passaram antes desta posição */
    function recuoDoModulo(loc, ordem) {
      if (!vaoModulo) return 0;
      var m = num(loc && loc.__modulo);
      if (m > 0) return m * vaoModulo;
      return 0;
    }

    var ruas = organizar(locais);
    var pecas = [];
    var indice = {};          /* codigo -> peça da posição, para o clique achar */
    var contagem = { ruas: 0, estantes: 0, prateleiras: 0, posicoes: 0 };
    var maxX = 0, maxZ = 0, maxY = 0;

    var x = M.folgaPiso;      /* caminha pelo eixo X, uma rua depois da outra */

    for (var r = 0; r < ruas.length; r++) {
      var rua = ruas[r];
      contagem.ruas++;
      var xRua = x;
      var larguraRua = M.profundidade;
      var z = M.folgaPiso;    /* dentro da rua, as estantes caminham no Z */

      for (var e = 0; e < rua.estantes.length; e++) {
        var est = rua.estantes[e];
        contagem.estantes++;

        /* quantas posições tem a prateleira mais larga manda na estante */
        var maiorLinha = 1;
        for (var p0 = 0; p0 < est.prateleiras.length; p0++) {
          maiorLinha = Math.max(maiorLinha, est.prateleiras[p0].posicoes.length);
        }
        var compEstante = maiorLinha * M.larguraPosicao;
        if (vaoModulo) {
          /* quantos vãos cabem dentro desta estante */
          var maiorModulo = 0;
          for (var pm = 0; pm < est.prateleiras.length; pm++) {
            var poss = est.prateleiras[pm].posicoes;
            for (var qm = 0; qm < poss.length; qm++) {
              maiorModulo = Math.max(maiorModulo, num(poss[qm].__modulo));
            }
          }
          compEstante += maiorModulo * vaoModulo;
        }
        var niveis = est.prateleiras.length;
        var alturaEstante = topoDoNivel(niveis - 1) + alturaDoVao(niveis - 1) * 0.4;

        /* --- os montantes: quatro colunas de ferro --- */
        var cantos = [
          [xRua, z], [xRua + M.profundidade, z],
          [xRua, z + compEstante], [xRua + M.profundidade, z + compEstante]
        ];
        for (var c = 0; c < cantos.length; c++) {
          pecas.push({
            tipo: 'montante', id: 'MONT-' + rua.nome + '-' + est.nome + '-' + c,
            x: cantos[c][0], y: alturaEstante / 2, z: cantos[c][1],
            lx: M.montante, ly: alturaEstante, lz: M.montante,
            cor: CORES.estrutura, clicavel: false
          });
        }

        /* --- cada prateleira: chapa + longarinas + posições --- */
        for (var pr = 0; pr < est.prateleiras.length; pr++) {
          var prat = est.prateleiras[pr];
          contagem.prateleiras++;
          var yNivel = topoDoNivel(pr);

          pecas.push({
            tipo: 'prateleira', id: 'PRAT-' + rua.nome + '-' + est.nome + '-' + prat.nome,
            rotulo: prat.nome,
            x: xRua + M.profundidade / 2, y: yNivel, z: z + compEstante / 2,
            lx: M.profundidade, ly: M.prateleira, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* as duas longarinas da frente e do fundo */
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-F',
            x: xRua, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });
          pecas.push({
            tipo: 'longarina', id: 'LONG-' + rua.nome + '-' + est.nome + '-' + prat.nome + '-T',
            x: xRua + M.profundidade, y: yNivel - M.prateleira, z: z + compEstante / 2,
            lx: M.longarina, ly: M.longarina, lz: compEstante,
            cor: CORES.estrutura, clicavel: false
          });

          /* --- as posições: o que o usuário clica --- */
          for (var po = 0; po < prat.posicoes.length; po++) {
            var loc = prat.posicoes[po];
            contagem.posicoes++;
            var zPos = z + po * M.larguraPosicao + M.larguraPosicao / 2 +
                       recuoDoModulo(loc, po);
            var alturaCaixa = alturaDoVao(pr) * 0.66;

            var peca = {
              tipo: 'posicao',
              id: lp(loc.codigo) || (rua.nome + '-' + est.nome + '-' + prat.nome + '-' + cima(loc.posicao)),
              codigo: lp(loc.codigo),
              rua: rua.nome, estante: est.nome,
              prateleira: prat.nome, posicao: cima(loc.posicao),
              x: xRua + M.profundidade / 2,
              y: yNivel + alturaCaixa / 2 + M.prateleira,
              z: zPos,
              lx: M.profundidade * 0.86,
              ly: alturaCaixa,
              lz: M.larguraPosicao * 0.88,
              /* [F5] o ambiente da Ferramentaria pinta pelo estado do
                 EQUIPAMENTO, nao pela ocupacao do material. Sem
                 opcoes.corDe, a conta e a mesma de sempre. */
              cor: (opcoes.corDe ? opcoes.corDe(loc) : corDaPosicao(loc)),
              situacao: (opcoes.situacaoDe
                           ? opcoes.situacaoDe(loc) : situacaoDaPosicao(loc)),
              capacidade: num(loc.capacidade),
              itens: num(loc.itens !== undefined ? loc.itens : loc.ocupacao),
              status: lp(loc.status),
              clicavel: true,
              dado: loc
            };
            pecas.push(peca);
            if (peca.codigo) indice[peca.codigo] = peca;
            maxY = Math.max(maxY, peca.y + peca.ly);
          }
        }

        maxY = Math.max(maxY, alturaEstante);
        z += compEstante + M.vaoEstantes;
      }

      /* a plaquinha da rua, no começo dela */
      pecas.push({
        tipo: 'placaRua', id: 'RUA-' + rua.nome, rotulo: rua.nome,
        x: xRua + M.profundidade / 2, y: 2.4, z: M.folgaPiso / 2,
        lx: 0.6, ly: 0.35, lz: 0.04, cor: CORES.faixa, clicavel: false
      });

      maxZ = Math.max(maxZ, z);
      x += larguraRua + M.corredor;
      maxX = Math.max(maxX, x);
    }

    /* o piso, dimensionado pelo que foi montado */
    var compX = Math.max(6, maxX - M.corredor + M.folgaPiso);
    var compZ = Math.max(6, maxZ + M.folgaPiso);
    pecas.unshift({
      tipo: 'piso', id: 'PISO',
      x: compX / 2, y: 0, z: compZ / 2,
      lx: compX, ly: 0.02, lz: compZ,
      cor: CORES.piso, clicavel: false
    });

    return {
      pecas: pecas,
      indice: indice,
      contagem: contagem,
      galpao: { largura: compX, profundidade: compZ, altura: Math.max(3, maxY + 0.8) },
      medidas: M,
      cores: CORES
    };
  }

  /* ============================================================
     [F6] FASE 6 · 14/11 · INTELIGÊNCIA E INDICADORES
     ------------------------------------------------------------
     Mapa de calor, rota otimizada e visão explodida. Tudo aqui é
     conta: roda em Node, sem placa de vídeo, e por isso pode ser
     provado. O motor só pinta o que estas funções devolvem.
     ============================================================ */

  /* ---------- MAPA DE CALOR · seção 11 ----------
     Ocupação por rua e por estante, calculada das MESMAS posições
     que pintam o 3D — para o número nunca discordar da imagem.
     Posição bloqueada NÃO entra como ocupada: ela é um terceiro
     caso, e somar as duas esconderia justamente o problema. */
  function calor(montagem) {
    var saida = { ok: false, ruas: [], estantes: [], galpao: null,
                  faixas: FAIXAS_CALOR };
    if (!montagem || !montagem.pecas) return saida;

    var porRua = {}, porEstante = {};
    var total = 0, ocupadas = 0, vazias = 0, bloqueadas = 0;

    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo !== 'posicao') continue;
      total++;
      var r = lp(p.rua), e = r + ' · ' + lp(p.estante);
      if (!porRua[r]) porRua[r] = { nome: r, total: 0, ocupadas: 0, vazias: 0,
                                    bloqueadas: 0, lotadas: 0 };
      if (!porEstante[e]) porEstante[e] = { nome: e, rua: r, estante: lp(p.estante),
                                            total: 0, ocupadas: 0, vazias: 0,
                                            bloqueadas: 0, lotadas: 0 };
      porRua[r].total++; porEstante[e].total++;

      var sit = lp(p.situacao);
      if (sit === 'BLOQUEADA') {
        bloqueadas++; porRua[r].bloqueadas++; porEstante[e].bloqueadas++;
      } else if (sit === 'VAZIA') {
        vazias++; porRua[r].vazias++; porEstante[e].vazias++;
      } else {
        ocupadas++; porRua[r].ocupadas++; porEstante[e].ocupadas++;
        if (sit === 'LOTADA') { porRua[r].lotadas++; porEstante[e].lotadas++; }
      }
    }
    if (!total) return saida;

    function fechar(o) {
      /* a conta de ocupação exclui as bloqueadas do denominador:
         posição bloqueada não está disponível para guardar nada,
         então contá-la como "vazia" inflaria o espaço livre. */
      var uteis = o.total - o.bloqueadas;
      o.ocupacaoPct = uteis > 0 ? Math.round(o.ocupadas / uteis * 100) : 0;
      o.uteis = uteis;
      o.faixa = faixaDoCalor(o.ocupacaoPct);
      o.cor = FAIXAS_CALOR[o.faixa].cor;
      return o;
    }

    for (var k in porRua) if (porRua.hasOwnProperty(k)) saida.ruas.push(fechar(porRua[k]));
    for (var k2 in porEstante) if (porEstante.hasOwnProperty(k2)) {
      saida.estantes.push(fechar(porEstante[k2]));
    }
    saida.ruas.sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });
    saida.estantes.sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });

    saida.galpao = fechar({ nome: 'galpão', total: total, ocupadas: ocupadas,
                            vazias: vazias, bloqueadas: bloqueadas, lotadas: 0 });
    saida.ok = true;
    return saida;
  }

  var FAIXAS_CALOR = {
    VAZIO:     { ate: 10,  cor: '#E3F0E8', texto: 'quase vazia' },
    FOLGADO:   { ate: 40,  cor: '#9ED4B3', texto: 'folgada' },
    MEIO:      { ate: 70,  cor: '#E8C65A', texto: 'pela metade' },
    APERTADO:  { ate: 90,  cor: '#E8923D', texto: 'apertada' },
    LOTADO:    { ate: 100, cor: '#D2443B', texto: 'lotada' }
  };

  function faixaDoCalor(pct) {
    if (pct <= FAIXAS_CALOR.VAZIO.ate) return 'VAZIO';
    if (pct <= FAIXAS_CALOR.FOLGADO.ate) return 'FOLGADO';
    if (pct <= FAIXAS_CALOR.MEIO.ate) return 'MEIO';
    if (pct <= FAIXAS_CALOR.APERTADO.ate) return 'APERTADO';
    return 'LOTADO';
  }

  /* a cor de calor de uma posição vem da ESTANTE dela: o calor é
     da região, não da gaveta. */
  function corDoCalor(mapaDeCalor, loc) {
    if (!mapaDeCalor || !mapaDeCalor.ok) return CORES.vazia || '#9AA3AE';
    var alvo = cima(lp(loc.rua)) + ' · ' + cima(lp(loc.estante));
    for (var i = 0; i < mapaDeCalor.estantes.length; i++) {
      if (cima(mapaDeCalor.estantes[i].nome) === alvo) {
        return mapaDeCalor.estantes[i].cor;
      }
    }
    return '#E9ECEF';
  }

  /* ---------- ROTA OTIMIZADA · seção 6, segunda parte ----------
     "Na primeira versão, permitir que o gestor monte a rota
      manualmente. Posteriormente, desenvolver otimização
      automática da sequência."

     Vizinho mais próximo, medindo pela MESMA distância de
     corredor que a rota usa — não em linha reta, que passaria por
     cima das estantes.

     A REGRA DE OURO: se a minha conta não melhorar a ordem do
     gestor, eu devolvo a ordem DELE. Mexer na sequência de alguém
     para deixar igual ou pior é só mexer. */
  function distanciaEntre(montagem, mapa, a, b) {
    var pa = montagem.indice[a], pb = montagem.indice[b];
    if (!pa || !pb) return Infinity;
    var ca = mapa.ruas[lp(pa.rua)], cb = mapa.ruas[lp(pb.rua)];
    if (!ca || !cb) return Infinity;
    if (lp(pa.rua) === lp(pb.rua)) return Math.abs(pa.z - pb.z);
    /* ruas diferentes: desce até a travessa, atravessa, sobe */
    return Math.abs(pa.z - mapa.travessaZ) +
           Math.abs(ca.x - cb.x) +
           Math.abs(mapa.travessaZ - pb.z);
  }

  function otimizarRota(montagem, codigos) {
    var saida = { ok: false, ordem: [], original: [], melhorou: false,
                  distanciaAntes: 0, distanciaDepois: 0, erros: [] };
    var lista = Object.prototype.toString.call(codigos) === '[object Array]'
      ? codigos.slice() : [];
    saida.original = lista.slice();

    if (lista.length < 3) {
      /* com dois pontos não há o que reordenar, e dizer que
         otimizei seria conversa */
      saida.ordem = lista.slice();
      saida.erros.push(lista.length < 2
        ? 'com menos de dois pontos não há sequência para otimizar'
        : 'com dois pontos a ordem já é a única possível');
      saida.ok = lista.length > 0;
      return saida;
    }
    if (!montagem || !montagem.indice) {
      saida.erros.push('não há galpão montado para medir distância');
      saida.ordem = lista.slice();
      return saida;
    }

    var mapa = corredores(montagem);
    if (!mapa.ok) {
      saida.erros.push('não achei os corredores do galpão');
      saida.ordem = lista.slice();
      return saida;
    }

    /* os que o galpão não tem ficam FORA da conta, mas voltam no
       fim da lista: não sou eu que vou sumir com endereço dele */
    var validos = [], fora = [];
    for (var i = 0; i < lista.length; i++) {
      if (montagem.indice[lp(lista[i])]) validos.push(lp(lista[i]));
      else fora.push(lista[i]);
    }
    if (validos.length < 3) {
      saida.ordem = lista.slice();
      saida.erros.push('menos de três endereços existem no galpão desenhado');
      saida.ok = true;
      return saida;
    }

    function medir(ordem) {
      var d = 0;
      for (var k = 1; k < ordem.length; k++) {
        var passo = distanciaEntre(montagem, mapa, ordem[k - 1], ordem[k]);
        if (!isFinite(passo)) return Infinity;
        d += passo;
      }
      return d;
    }

    /* vizinho mais próximo, partindo do primeiro ponto do gestor —
       ele costuma começar por onde está */
    var restantes = validos.slice(1);
    var ordem = [validos[0]];
    while (restantes.length) {
      var atual = ordem[ordem.length - 1];
      var melhor = 0, melhorD = Infinity;
      for (var r = 0; r < restantes.length; r++) {
        var d = distanciaEntre(montagem, mapa, atual, restantes[r]);
        if (d < melhorD) { melhorD = d; melhor = r; }
      }
      ordem.push(restantes[melhor]);
      restantes.splice(melhor, 1);
    }

    var antes = medir(validos), depois = medir(ordem);
    saida.distanciaAntes = Math.round(antes * 100) / 100;
    saida.distanciaDepois = Math.round(depois * 100) / 100;

    if (depois < antes - 1e-9) {
      saida.melhorou = true;
      saida.ordem = ordem.concat(fora);
      saida.economia = Math.round((antes - depois) * 100) / 100;
    } else {
      /* não melhorou: devolvo a ordem do gestor, intacta */
      saida.melhorou = false;
      saida.ordem = lista.slice();
      saida.distanciaDepois = saida.distanciaAntes;
      saida.erros.push('a ordem que o senhor montou já é tão boa quanto a minha');
    }
    saida.foraDoGalpao = fora;
    saida.ok = true;
    return saida;
  }

  /* ---------- VISÃO EXPLODIDA · seção 11 ----------
     Separa os níveis no eixo vertical, para dar para olhar dentro
     da estante. É só desenho: nenhum endereço muda. */
  function explodir(montagem, fator) {
    var f = num(fator);
    if (!montagem || !montagem.pecas) return montagem;
    if (!(f > 0)) return montagem;   /* sem fator, devolve o mesmo */

    var copia = { pecas: [], indice: {}, contagem: montagem.contagem,
                  galpao: null, medidas: montagem.medidas, cores: montagem.cores };
    var alturaNivel = (montagem.medidas && montagem.medidas.alturaNivel) || 0.55;
    var maisAlto = 0;

    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i], c = {};
      for (var k in p) if (p.hasOwnProperty(k)) c[k] = p[k];
      if (p.tipo !== 'piso' && p.tipo !== 'montante') {
        /* o indice do nivel: o primeiro e ZERO e nao sobe. A chapa
           da prateleira fica exatamente em n*alturaNivel, a caixa
           um pouco acima e a longarina um pouco abaixo — dividir
           por alturaNivel e arredondar junta as tres no mesmo
           nivel, que e o que precisa acontecer para a estante nao
           se desmontar na visao explodida. */
        var nivel = Math.max(0, Math.round(p.y / alturaNivel) - 1);
        c.y = p.y + nivel * alturaNivel * f;
      }
      maisAlto = Math.max(maisAlto, c.y + (c.ly || 0));
      copia.pecas.push(c);
      if (c.tipo === 'posicao' && c.codigo) copia.indice[c.codigo] = c;
    }
    copia.galpao = { largura: montagem.galpao.largura,
                     profundidade: montagem.galpao.profundidade,
                     altura: Math.max(montagem.galpao.altura, maisAlto + 0.8) };
    copia.explodida = true;
    return copia;
  }

  /* ============================================================
     [F5] FASE 5 · 14/11 · AMBIENTE B — FERRAMENTARIA
     ------------------------------------------------------------
     Secao 10. Os cinco estados que o prompt pede, com os nomes de
     status que o Core do Ismael JA usa — eu li no index.html dele,
     nao inventei: DISPONIVEL, EM_POSSE, MANUTENCAO, BLOQUEADA.

     "Nao localizada" e o quinto, e nao e enfeite: hoje o
     locais.vincular liga posicao a SKU, nao a patrimonio. Logo ha
     ferramenta que o mapa nao tem como colocar em lugar nenhum. Em
     vez de espalhar no chao, ela fica marcada como nao localizada.
     ============================================================ */
  var CORES_FERRAMENTARIA = {
    DISPONIVEL:     '#2E9E5B',
    EM_POSSE:       '#2F7BE8',
    MANUTENCAO:     '#E8A33D',
    BLOQUEADA:      '#D2443B',
    NAO_LOCALIZADA: '#9AA3AE'
  };

  /* status desconhecido NAO vira "disponivel": vira DESCONHECIDO, e
     quem olhar sabe que apareceu coisa nova. */
  function estadoDaFerramenta(f) {
    var st = cima(lp(f && (f.status !== undefined ? f.status : f.situacao)))
             .replace(/[^A-Z]/g, '');
    if (st === 'DISPONIVEL' || st === 'DISPONVEL') return 'DISPONIVEL';
    if (st === 'EMPOSSE' || st === 'EMPRESTADA' || st === 'EMPRESTADO') return 'EM_POSSE';
    if (st === 'MANUTENCAO' || st === 'MANUTENO') return 'MANUTENCAO';
    if (st === 'BLOQUEADA' || st === 'BLOQUEADO') return 'BLOQUEADA';
    return 'DESCONHECIDO';
  }

  function corDaFerramenta(f) {
    var e = estadoDaFerramenta(f);
    return CORES_FERRAMENTARIA[e] || '#8A93A0';
  }

  /* junta as ferramentas com o cadastro de enderecos. A ligacao e
     pelo CODIGO do item, que e o que o modulo locais entende. Quem
     nao casar fica como nao localizada — com o motivo escrito. */
  function ferramentasPorPosicao(ferramentas, locais) {
    var saida = { porCodigo: {}, naoLocalizadas: [], contagem: {
      DISPONIVEL: 0, EM_POSSE: 0, MANUTENCAO: 0, BLOQUEADA: 0,
      NAO_LOCALIZADA: 0, DESCONHECIDO: 0 } };

    var fs = Object.prototype.toString.call(ferramentas) === '[object Array]'
      ? ferramentas : [];
    var ls = Object.prototype.toString.call(locais) === '[object Array]'
      ? locais : [];

    var porSku = {};
    for (var i = 0; i < ls.length; i++) {
      var l = ls[i];
      var chaves = [];
      if (lp(l.sku)) chaves.push(cima(l.sku));
      if (lp(l.codigoItem)) chaves.push(cima(l.codigoItem));
      if (Object.prototype.toString.call(l.ocupacao) === '[object Array]') {
        for (var o = 0; o < l.ocupacao.length; o++) {
          var oc = l.ocupacao[o];
          var k = cima(lp(oc && (oc.sku || oc.codigo || oc)));
          if (k) chaves.push(k);
        }
      }
      for (var c = 0; c < chaves.length; c++) {
        if (!porSku[chaves[c]]) porSku[chaves[c]] = [];
        porSku[chaves[c]].push(l);
      }
    }

    for (var f = 0; f < fs.length; f++) {
      var fer = fs[f];
      var est = estadoDaFerramenta(fer);
      var chave = cima(lp(fer.codigo) || lp(fer.sku) || '');
      var onde = chave ? porSku[chave] : null;

      if (!onde || !onde.length) {
        saida.naoLocalizadas.push({
          ferramenta: fer, estado: est,
          porQue: chave
            ? 'o codigo ' + chave + ' nao esta vinculado a nenhum endereco'
            : 'esta ferramenta nao traz codigo para ligar a um endereco'
        });
        saida.contagem.NAO_LOCALIZADA++;
        continue;
      }
      for (var w = 0; w < onde.length; w++) {
        var cod = lp(onde[w].codigo);
        if (!cod) continue;
        if (!saida.porCodigo[cod]) saida.porCodigo[cod] = [];
        saida.porCodigo[cod].push({ ferramenta: fer, estado: est });
      }
      if (saida.contagem[est] !== undefined) saida.contagem[est]++;
      else saida.contagem.DESCONHECIDO++;
    }
    return saida;
  }

  /* a cor de uma POSICAO no ambiente da ferramentaria: manda o
     estado mais grave guardado nela. Bloqueada manda sobre
     manutencao, que manda sobre emprestada. */
  var GRAVIDADE_FER = ['BLOQUEADA', 'MANUTENCAO', 'EM_POSSE', 'DISPONIVEL'];

  function corDaPosicaoNaFerramentaria(mapa, codigo) {
    var aqui = mapa && mapa.porCodigo && mapa.porCodigo[codigo];
    if (!aqui || !aqui.length) return CORES_FERRAMENTARIA.NAO_LOCALIZADA;
    for (var g = 0; g < GRAVIDADE_FER.length; g++) {
      for (var i = 0; i < aqui.length; i++) {
        if (aqui[i].estado === GRAVIDADE_FER[g]) {
          return CORES_FERRAMENTARIA[GRAVIDADE_FER[g]];
        }
      }
    }
    return '#8A93A0';
  }

  /* ============================================================
     [F3] FASE 3 · 14/11 · ROTAS QUE RESPEITAM OS CORREDORES
     ------------------------------------------------------------
     Seção 6: "A rota deverá respeitar os corredores e caminhos
     cadastrados no galpão. Não criar caminhos atravessando
     estantes ou estruturas físicas."

     Ligar dois pontos com uma reta seria atravessar ferro. Então
     aqui a conta é feita pela planta:

       · cada rua é alcançada pelo CORREDOR que corre ao lado dela;
       · andar no sentido do comprimento só acontece DENTRO de um
         corredor;
       · mudar de corredor só acontece na TRAVESSA da frente, que
         é a faixa de piso antes da primeira estante;
       · o caminho PARA no corredor, de frente para a posição. O
         último palmo — a mão alcançando a prateleira — não é
         caminho, e desenhar como caminho seria desenhar alguém
         atravessando a estante.

     Isto é conta, não desenho: mora aqui porque pode ser provada
     em Node, sem placa de vídeo, e foi.
     ============================================================ */

  /* onde passa o corredor de cada rua, e onde fica a travessa */
  function corredores(montagem) {
    var saida = { ruas: {}, ordem: [], travessaZ: 0, largura: 0, ok: false };
    if (!montagem || !montagem.pecas) return saida;
    var M = montagem.medidas || MEDIDAS;

    /* o x de cada rua sai das próprias posições desenhadas */
    var xDaRua = {};
    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo !== 'posicao') continue;
      var r = lp(p.rua);
      /* a posição fica no meio da profundidade da estante */
      var xEstante = p.x - M.profundidade / 2;
      if (xDaRua[r] === undefined || xEstante < xDaRua[r]) xDaRua[r] = xEstante;
    }

    var nomes = [];
    for (var k in xDaRua) if (xDaRua.hasOwnProperty(k)) nomes.push(k);
    nomes.sort(function (a, b) { return xDaRua[a] - xDaRua[b]; });

    for (var n = 0; n < nomes.length; n++) {
      /* o corredor corre rente à rua, do lado de quem chega */
      var xCorredor = xDaRua[nomes[n]] - M.corredor / 2;
      if (xCorredor < 0) xCorredor = Math.max(0.2, xDaRua[nomes[n]] / 2);
      saida.ruas[nomes[n]] = { x: xCorredor, xEstante: xDaRua[nomes[n]] };
      saida.ordem.push(nomes[n]);
    }

    /* a travessa fica na faixa de piso antes da primeira estante */
    saida.travessaZ = M.folgaPiso / 2;
    saida.largura = M.corredor;
    saida.ok = nomes.length > 0;
    return saida;
  }

  /* o ponto do corredor de onde se alcança uma posição */
  function acessoDaPosicao(montagem, peca, mapa) {
    var r = lp(peca.rua);
    var c = mapa.ruas[r];
    if (!c) return null;
    return { x: c.x, z: peca.z, rua: r };
  }

  function distanciaDe(pontos) {
    var d = 0;
    for (var i = 1; i < pontos.length; i++) {
      d += Math.abs(pontos[i].x - pontos[i - 1].x) +
           Math.abs(pontos[i].z - pontos[i - 1].z);
    }
    return Math.round(d * 100) / 100;
  }

  /* junta pontos repetidos em sequência: dois pontos iguais não
     são um trecho de caminho */
  function limparCaminho(pontos) {
    var saida = [];
    for (var i = 0; i < pontos.length; i++) {
      var a = pontos[i], b = saida[saida.length - 1];
      if (b && Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.z - b.z) < 1e-9) continue;
      saida.push(a);
    }
    return saida;
  }

  /* ESTADOS de um ponto da rota · seção 6 */
  var ESTADOS_ROTA = {
    ATUAL:      { cor: '#2F7BE8', texto: 'ponto atual' },
    CONCLUIDO:  { cor: '#2E9E5B', texto: 'concluído' },
    PENDENTE:   { cor: '#E8A33D', texto: 'pendente' },
    DIVERGENCIA:{ cor: '#D2443B', texto: 'divergência' },
    SEMATIVIDADE:{ cor: '#9AA3AE', texto: 'sem atividade' }
  };

  /* ------------------------------------------------------------
     A ROTA.  codigos = os endereços, na ordem que o gestor montou.
     ------------------------------------------------------------ */
  function rota(montagem, codigos, opcoes) {
    opcoes = opcoes || {};
    var saida = { ok: false, pontos: [], caminho: [], distancia: 0,
                  erros: [], naoAchados: [] };
    if (!montagem || !montagem.indice) {
      saida.erros.push('Não há galpão montado para traçar rota.');
      return saida;
    }
    var lista = Object.prototype.toString.call(codigos) === '[object Array]' ? codigos : [];
    if (!lista.length) {
      saida.erros.push('A rota está vazia: escolha pelo menos um endereço.');
      return saida;
    }

    var mapa = corredores(montagem);
    if (!mapa.ok) {
      saida.erros.push('Não consegui achar os corredores: o galpão não tem posições.');
      return saida;
    }

    var estados = opcoes.estados || {};
    var caminho = [], anterior = null;

    for (var i = 0; i < lista.length; i++) {
      var cod = lp(lista[i]);
      var peca = montagem.indice[cod];
      if (!peca) {
        /* endereço que não existe no galpão NÃO vira ponto mudo:
           entra na lista de não achados e aparece escrito */
        saida.naoAchados.push(cod);
        continue;
      }
      var acesso = acessoDaPosicao(montagem, peca, mapa);
      if (!acesso) { saida.naoAchados.push(cod); continue; }

      if (!anterior) {
        caminho.push({ x: acesso.x, z: mapa.travessaZ });
        caminho.push({ x: acesso.x, z: acesso.z });
      } else if (anterior.rua === acesso.rua) {
        /* mesma rua: anda pelo corredor dela */
        caminho.push({ x: acesso.x, z: acesso.z });
      } else {
        /* rua diferente: volta à travessa, atravessa, e entra */
        caminho.push({ x: anterior.x, z: mapa.travessaZ });
        caminho.push({ x: acesso.x, z: mapa.travessaZ });
        caminho.push({ x: acesso.x, z: acesso.z });
      }

      var est = lp(estados[cod]).toUpperCase() ||
                (i === 0 ? 'ATUAL' : 'PENDENTE');
      if (!ESTADOS_ROTA[est]) est = 'PENDENTE';

      saida.pontos.push({
        ordem: saida.pontos.length + 1,
        codigo: cod,
        rua: peca.rua, estante: peca.estante,
        prateleira: peca.prateleira, posicao: peca.posicao,
        posicaoNoGalpao: { x: peca.x, y: peca.y, z: peca.z },
        acesso: { x: acesso.x, y: 0.05, z: acesso.z },
        estado: est,
        cor: ESTADOS_ROTA[est].cor,
        situacao: peca.situacao,
        itens: peca.itens
      });
      anterior = acesso;
    }

    if (!saida.pontos.length) {
      saida.erros.push('Nenhum dos endereços da rota existe no galpão desenhado.');
      return saida;
    }

    saida.caminho = limparCaminho(caminho);
    saida.distancia = distanciaDe(saida.caminho);
    saida.travessaZ = mapa.travessaZ;
    saida.corredores = mapa;
    saida.ok = true;
    return saida;
  }

  /* ------------------------------------------------------------
     [F3] A PLANTA DE CIMA · o minimapa 2D, seção 11
     Devolve retângulos em metros. Quem desenha é a tela; a conta
     é aqui, e por isso pode ser provada.
     ------------------------------------------------------------ */
  function planta(montagem) {
    var saida = { ok: false, largura: 0, profundidade: 0,
                  estantes: [], posicoes: [], corredores: [] };
    if (!montagem || !montagem.pecas) return saida;
    var M = montagem.medidas || MEDIDAS;
    saida.largura = montagem.galpao.largura;
    saida.profundidade = montagem.galpao.profundidade;

    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo === 'prateleira') {
        saida.estantes.push({ x: p.x - p.lx / 2, z: p.z - p.lz / 2,
                              lx: p.lx, lz: p.lz,
                              id: p.id });
      } else if (p.tipo === 'posicao') {
        saida.posicoes.push({ codigo: p.codigo, x: p.x, z: p.z,
                              cor: p.cor, situacao: p.situacao,
                              rua: p.rua, estante: p.estante });
      }
    }

    var mapa = corredores(montagem);
    for (var r = 0; r < mapa.ordem.length; r++) {
      var c = mapa.ruas[mapa.ordem[r]];
      saida.corredores.push({ rua: mapa.ordem[r], x: c.x,
                              largura: mapa.largura });
    }
    saida.travessaZ = mapa.travessaZ;
    saida.ok = saida.posicoes.length > 0;
    return saida;
  }

  /* ----------------------------------------------------------
     RESUMO: os números do painel, calculados do mesmo dado que
     pinta as cores — para o texto nunca discordar da imagem.
     ---------------------------------------------------------- */
  function resumo(montagem) {
    var r = { total: 0, vazias: 0, ocupadas: 0, lotadas: 0, bloqueadas: 0, ocupacaoPct: 0 };
    if (!montagem || !montagem.pecas) return r;
    for (var i = 0; i < montagem.pecas.length; i++) {
      var p = montagem.pecas[i];
      if (p.tipo !== 'posicao') continue;
      r.total++;
      if (p.situacao === 'VAZIA') r.vazias++;
      else if (p.situacao === 'OCUPADA') r.ocupadas++;
      else if (p.situacao === 'LOTADA') r.lotadas++;
      else if (p.situacao === 'BLOQUEADA') r.bloqueadas++;
    }
    var usadas = r.ocupadas + r.lotadas;
    r.ocupacaoPct = r.total ? Math.round(usadas / r.total * 100) : 0;
    return r;
  }

  /* ============================================================
     ENQUADRAMENTO · 08/11, à noite

     A primeira vez que o galpão do Ismael apareceu na tela, ele
     apareceu minúsculo e fora de centro. A câmera mirava no meio
     de um galpão de 20×20 metros que NÃO existe: o cadastro de
     localizações dele tem uma estante. A mira era um palpite.

     Agora a conta sai do que foi realmente montado. É matemática
     pura — nenhuma linha de Babylon — justamente para poder ser
     provada sem placa de vídeo, com 2 posições e com 2.000.
     ============================================================ */

  /** a caixa que contém as peças. O piso fica de fora: ele é
      grande por definição e puxaria a câmera para longe. */
  function caixaDe(montagem, incluirPiso) {
    var pecas = (montagem && montagem.pecas) || [];
    var min = null, max = null;

    for (var i = 0; i < pecas.length; i++) {
      var p = pecas[i];
      if (!incluirPiso && p.tipo === 'piso') continue;
      if (typeof p.x !== 'number' || typeof p.y !== 'number' || typeof p.z !== 'number') continue;

      var hx = Math.abs(p.lx || 0) / 2,
          hy = Math.abs(p.ly || 0) / 2,
          hz = Math.abs(p.lz || 0) / 2;

      if (!min) {
        min = { x: p.x - hx, y: p.y - hy, z: p.z - hz };
        max = { x: p.x + hx, y: p.y + hy, z: p.z + hz };
        continue;
      }
      if (p.x - hx < min.x) min.x = p.x - hx;
      if (p.y - hy < min.y) min.y = p.y - hy;
      if (p.z - hz < min.z) min.z = p.z - hz;
      if (p.x + hx > max.x) max.x = p.x + hx;
      if (p.y + hy > max.y) max.y = p.y + hy;
      if (p.z + hz > max.z) max.z = p.z + hz;
    }

    if (!min) return { vazia: true, min: null, max: null,
                       centro: { x: 0, y: 0, z: 0 },
                       tamanho: { x: 0, y: 0, z: 0 } };

    return {
      vazia: false, min: min, max: max,
      centro: { x: (min.x + max.x) / 2, y: (min.y + max.y) / 2, z: (min.z + max.z) / 2 },
      tamanho: { x: max.x - min.x, y: max.y - min.y, z: max.z - min.z }
    };
  }

  /**
   * Onde a câmera deve mirar e a que distância, para caber tudo.
   *
   *   montagem  o que montar() devolveu
   *   opcoes    { fov, aspecto, folga, minimo, maximo, piso }
   *
   * Devolve { alvo:{x,y,z}, raio, caixa, vazio }.
   *
   * A distância sai da trigonometria do campo de visão, não de
   * um número escolhido no olho: metade da altura dividida pela
   * tangente de meio-fov é a distância em que aquela altura ocupa
   * a tela inteira. A largura entra dividida pela proporção da
   * tela, porque numa tela deitada quem aperta é a altura.
   */
  function enquadramento(montagem, opcoes) {
    opcoes = opcoes || {};
    var fov     = opcoes.fov > 0 ? opcoes.fov : 0.8;     /* o padrão do Babylon */
    var aspecto = opcoes.aspecto > 0 ? opcoes.aspecto : 1.6;
    var folga   = opcoes.folga > 0 ? opcoes.folga : 1.25;
    var minimo  = opcoes.minimo > 0 ? opcoes.minimo : 6;
    var maximo  = opcoes.maximo > 0 ? opcoes.maximo : 220;

    var cx = caixaDe(montagem, !!opcoes.piso);

    /* nada montado: mira no chão, perto. Não inventa galpão. */
    if (cx.vazia) {
      return { alvo: { x: 0, y: 1, z: 0 }, raio: minimo * 2, caixa: cx, vazio: true };
    }

    var meiaAltura = cx.tamanho.y / 2;
    var meiaLargura = Math.max(cx.tamanho.x, cx.tamanho.z) / 2;
    var t = Math.tan(fov / 2);

    var porAltura  = meiaAltura / t;
    var porLargura = meiaLargura / (t * aspecto);
    var raio = Math.max(porAltura, porLargura) * folga;

    /* uma estante sozinha é baixa e estreita: sem um mínimo, a
       câmera entraria dentro dela. */
    if (raio < minimo) raio = minimo;
    if (raio > maximo) raio = maximo;

    return {
      /* mira um pouco acima do meio: o olho procura a prateleira,
         não o pé da estante */
      alvo: { x: cx.centro.x, y: cx.centro.y + cx.tamanho.y * 0.08, z: cx.centro.z },
      raio: raio,
      caixa: cx,
      vazio: false
    };
  }

  /* ============================================================
     CONFERIR · o que está torto no cadastro de localizações

     Três regras que valem aqui e não se negociam:

       1. NADA é corrigido. Dado histórico não se mexe sozinho —
          é regra dele, e é a regra certa. Aqui só se mostra.
       2. Só se confere o que o Core DEVOLVEU. O mapa não lê a
          planilha e não inventa consulta que não existe. A
          varredura completa da ALMOXA_OCUPACAO é do lado de lá,
          no ENDERECO_CONFERIR.
       3. Linha torta aparece na tela. Hoje a linha sem rua é
          descartada em silêncio pelo organizar() — ela some do
          mapa e ninguém fica sabendo. Isso acaba aqui.
     ============================================================ */
  function conferir(locais) {
    var lista = Object.prototype.toString.call(locais) === '[object Array]' ? locais : [];
    var avisos = [];
    var vistos = {};        /* código -> quantas vezes */
    var prateleirasComPosicao = {};
    var usadasComoEndereco = [];

    function anotar(tipo, titulo, detalhe, linha) {
      avisos.push({ tipo: tipo, titulo: titulo, detalhe: detalhe, linha: linha });
    }

    for (var i = 0; i < lista.length; i++) {
      var l = lista[i] || {};
      var cod = lp(l.codigo);
      var rua = cima(l.rua), est = cima(l.estante),
          pra = cima(l.prateleira), pos = cima(l.posicao);

      /* 1 · sem rua, o organizar() joga fora sem dizer nada */
      if (!rua) {
        anotar('SUMIU',
          'Localização sem rua não aparece no mapa',
          'O desenho é organizado por rua. Sem ela, esta linha é ' +
          'descartada — e até agora isso acontecia em silêncio.',
          l);
        continue;
      }

      /* 2 · código repetido: duas posições disputando o mesmo QR */
      if (cod) {
        vistos[cod] = (vistos[cod] || 0) + 1;
        if (vistos[cod] === 2) {
          anotar('REPETIDO',
            'Código repetido: ' + cod,
            'Duas localizações com o mesmo código. O QR levaria a ' +
            'uma delas, e não há como saber a qual.',
            l);
        }
      } else {
        anotar('SEM_CODIGO',
          'Posição sem código',
          'Sem código não há etiqueta nem QR: ' +
          [rua, est, pra, pos].filter(Boolean).join(' · '),
          l);
      }

      /* 3 · o código não bate com os campos (desalinhamento) */
      if (cod && rua && est) {
        var partes = cod.split('-');
        if (partes.length >= 2 && cima(partes[0]) !== rua) {
          anotar('DESALINHADO',
            'O código não combina com a rua: ' + cod,
            'O código começa com "' + partes[0] + '" mas a linha diz ' +
            'que a rua é "' + rua + '". Um dos dois está errado — e eu ' +
            'não sei qual, então não mexo em nenhum.',
            l);
        }
      }

      /* 4 · prateleira e posição disputando o mesmo endereço */
      var chavePra = [rua, est, pra].join('|');
      if (pos) prateleirasComPosicao[chavePra] = true;
      else usadasComoEndereco.push({ chave: chavePra, linha: l, codigo: cod });
    }

    /* 5 · a prateleira virou endereço E tem posições embaixo dela.
       É o caso do A-A01-1 x A-A01-1-A: material guardado em dois
       níveis do mesmo lugar, e o saldo some entre eles. */
    for (var u = 0; u < usadasComoEndereco.length; u++) {
      var uu = usadasComoEndereco[u];
      if (prateleirasComPosicao[uu.chave]) {
        anotar('DOIS_NIVEIS',
          'Prateleira e posição são endereço ao mesmo tempo' +
            (uu.codigo ? ': ' + uu.codigo : ''),
          'Esta prateleira guarda material direto, mas também tem ' +
          'posições cadastradas dentro dela. Guardar nos dois níveis ' +
          'faz o saldo se perder entre eles. Confira no almoxarifado ' +
          'qual é o nível real antes de mudar qualquer coisa.',
          uu.linha);
      }
    }

    return {
      total: lista.length,
      avisos: avisos,
      quantos: avisos.length,
      porTipo: (function () {
        var c = {};
        for (var k = 0; k < avisos.length; k++) c[avisos[k].tipo] = (c[avisos[k].tipo] || 0) + 1;
        return c;
      })()
    };
  }

  /* ============================================================
     COMO SE CHAMAM AS DIVISÕES · decidido pelo Ismael em 08/11

       até 26 divisões  →  A, B, C … Z
       mais que isso    →  01, 02, 03 … NN

     A regra é por PRATELEIRA inteira, não por divisão. Uma
     prateleira de 30 não vira "A…Z, 27, 28, 29, 30": vira
     01…30, tudo igual. Metade com letra e metade com número é
     o tipo de coisa que ninguém lê certo no rádio às 7 da manhã.

     E isto aqui é definitivo na prática: depois que a etiqueta
     está colada na estante, mudar a numeração é reetiquetar o
     galpão inteiro. Por isso a conta mora aqui, com prova, e
     não espalhada dentro de uma tela.
     ============================================================ */
  var LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function nomesDePosicao(quantas) {
    var n = Math.floor(Number(quantas) || 0);
    if (n < 1) return [];
    var fora = [];
    if (n <= LETRAS.length) {
      for (var i = 0; i < n; i++) fora.push(LETRAS.charAt(i));
      return fora;
    }
    /* passou de 26: número em TODAS, com zero à esquerda para
       ordenar direito em qualquer lugar que ordene como texto */
    var casas = String(n).length;
    for (var k = 1; k <= n; k++) {
      var s = String(k);
      while (s.length < casas) s = '0' + s;
      fora.push(s);
    }
    return fora;
  }

  /* ============================================================
     PROJETAR · o que o construtor vai criar, antes de criar

     Recebe o que a pessoa digitou e devolve a LISTA de posições
     que sairiam disso — no mesmo formato que o Core devolve, de
     propósito: assim o mesmo montar() desenha o projeto e o
     galpão real, e o que ela vê na tela é o que vai ser gravado.

     Nada aqui grava. Nada aqui fala com o Core. É papel e lápis.
     ============================================================ */
  function projetar(pedido) {
    pedido = pedido || {};
    var rua  = cima(pedido.rua);
    var est  = cima(pedido.estante);
    var nPra = Math.floor(Number(pedido.prateleiras) || 0);
    var nPos = Math.floor(Number(pedido.divisoes) || 0);

    var erros = [];
    if (!rua) erros.push('Falta o nome da rua.');
    if (!est) erros.push('Falta o nome da estante.');
    if (nPra < 1) erros.push('A estante precisa de pelo menos uma prateleira.');
    if (nPos < 1) erros.push('A prateleira precisa de pelo menos uma divisão.');
    if (nPra > 20) erros.push('Mais de 20 prateleiras numa estante só: confira se não é outra estante.');
    if (nPos > 200) erros.push('Mais de 200 divisões numa prateleira só: confira a conta.');
    if (erros.length) return { ok: false, erros: erros, locais: [], contagem: { posicoes: 0 } };

    /* ========================================================
       [F2] MÓDULOS · seção 5 "Quantidade de módulos"

       DECISÃO, declarada para poder ser contestada: um módulo é
       um vão da estante — o corpo entre dois pares de montantes.
       Dois módulos de 10 divisões são 20 divisões NUMERADAS EM
       SEQUÊNCIA na mesma estante, com um respiro de ferro entre
       eles no desenho.

       Por que assim: a regra 2, item 4, manda preservar o
       endereçamento Rua · Estante · Prateleira · Posição. Dar ao
       módulo um nível próprio criaria um quinto nível de endereço
       e quebraria todo código já impresso em etiqueta. Se o certo
       para a obra for uma estante por módulo, é só cadastrar
       A-01, A-02 — e aí o módulo volta a ser 1.
       ======================================================== */
    var nMod = Math.floor(Number(pedido.modulos) || 1);
    if (nMod < 1) nMod = 1;
    if (nMod > 30) {
      return { ok: false, locais: [], contagem: { posicoes: 0 },
               erros: ['Mais de 30 módulos numa estante só: confira se não são ruas diferentes.'] };
    }
    var porModulo = nPos;
    var totalPos = nPos * nMod;
    if (totalPos > 200) {
      return { ok: false, locais: [], contagem: { posicoes: 0 },
               erros: ['' + nMod + ' módulo(s) × ' + nPos + ' divisões dá ' + totalPos +
                       ' posições numa estante só. O limite é 200.'] };
    }

    /* o primeiro nível de prateleira é o 1, como ele já usa */
    var primeira = Math.floor(Number(pedido.primeiraPrateleira) || 1);
    var nomes = nomesDePosicao(totalPos);
    var locais = [];

    for (var p = 0; p < nPra; p++) {
      var nomePra = String(primeira + p);
      for (var d = 0; d < totalPos; d++) {
        var local = {
          rua: rua,
          estante: est,
          prateleira: nomePra,
          posicao: nomes[d],
          codigo: [rua, est, nomePra, nomes[d]].join('-'),
          /* um SKU por divisão — decisão dele, 08/11 */
          capacidade: 1,
          ocupacao: [],
          status: 'DISPONIVEL',
          /* marca de projeto: nada disto existe no Core ainda */
          __projeto: true
        };
        /* só marca o módulo quando há mais de um: assim o desenho de
           uma estante comum continua idêntico ao de antes */
        if (nMod > 1) local.__modulo = Math.floor(d / porModulo);
        locais.push(local);
      }
    }

    return {
      ok: true,
      erros: [],
      locais: locais,
      nomes: nomes,
      porLetra: nPos <= LETRAS.length,
      contagem: { prateleiras: nPra, divisoes: nPos, posicoes: locais.length,
                   modulos: nMod, divisoesPorModulo: porModulo },
      medidas: medidasDe(pedido),
      /* [F2] as medidas que o desenho precisa, separadas das do
         endereço. Vazias quando o formulário não pediu nada novo. */
      geometria: geometriaDe(pedido, nPra)
    };
  }

  /** as medidas em metros, a partir do que foi digitado em cm */
  /* [F2] seção 5: altura individual dos níveis, distância entre
     módulos, distância entre estantes, altura livre do galpão.
     Tudo em centímetros no formulário, metros aqui. O que não for
     informado NÃO vira padrão inventado: fica fora, e o desenho
     segue com a medida que já usava. */
  function geometriaDe(pedido, quantosNiveis) {
    pedido = pedido || {};
    function m(v) { var n = Number(v); return (isFinite(n) && n > 0) ? n / 100 : 0; }
    var g = {};

    var lista = pedido.alturasCm;
    if (Object.prototype.toString.call(lista) === '[object Array]' && lista.length) {
      var alturas = [], algumaVale = false;
      for (var i = 0; i < quantosNiveis; i++) {
        var a = m(lista[i]);
        alturas.push(a);
        if (a > 0) algumaVale = true;
      }
      if (algumaVale) g.alturasNiveis = alturas;
    }
    if (m(pedido.vaoModuloCm))   g.vaoModulo   = m(pedido.vaoModuloCm);
    if (m(pedido.vaoEstanteCm))  g.vaoEstantes = m(pedido.vaoEstanteCm);
    if (m(pedido.peDireitoCm))   g.peDireito   = m(pedido.peDireitoCm);
    if (m(pedido.alturaLivreCm)) g.alturaLivre = m(pedido.alturaLivreCm);
    return g;
  }

  function medidasDe(pedido) {
    function cm(v, padrao) {
      var n = Number(v);
      return (isFinite(n) && n > 0) ? n / 100 : padrao;
    }
    return {
      larguraPosicao: cm(pedido && pedido.larguraCm, MEDIDAS.larguraPosicao),
      profundidade:   cm(pedido && pedido.profundidadeCm, MEDIDAS.profundidade),
      alturaNivel:    cm(pedido && pedido.alturaCm, MEDIDAS.alturaNivel)
    };
  }

  raiz.LAYOUT3D = {
    VERSAO: '6.9.0',
    MEDIDAS: MEDIDAS,
    CORES: CORES,
    organizar: organizar,
    montar: montar,
    resumo: resumo,
    corDaPosicao: corDaPosicao,
    situacaoDaPosicao: situacaoDaPosicao,
    caixaDe: caixaDe,
    enquadramento: enquadramento,
    conferir: conferir,
    nomesDePosicao: nomesDePosicao,
    projetar: projetar,
    /* [F3] acrescentados em 14/11. Nada foi tirado daqui. */
    corredores: corredores,
    rota: rota,
    planta: planta,
    ESTADOS_ROTA: ESTADOS_ROTA,
    /* [F5] acrescentados em 14/11. Nada foi tirado daqui. */
    CORES_FERRAMENTARIA: CORES_FERRAMENTARIA,
    estadoDaFerramenta: estadoDaFerramenta,
    corDaFerramenta: corDaFerramenta,
    ferramentasPorPosicao: ferramentasPorPosicao,
    corDaPosicaoNaFerramentaria: corDaPosicaoNaFerramentaria,
    /* [F6] acrescentados em 14/11. Nada foi tirado daqui. */
    calor: calor,
    corDoCalor: corDoCalor,
    FAIXAS_CALOR: FAIXAS_CALOR,
    otimizarRota: otimizarRota,
    explodir: explodir
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = raiz.LAYOUT3D;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== adaptador.js ===== */
/* ============================================================
   ALMOXA 3D · adaptador.js  ·  08/11/2026
   ------------------------------------------------------------
   O ADAPTADOR MULTIAMBIENTE · seção 5 do adendo.

   Uma aplicação só, dois lugares para rodar:

     · servida pelo Apps Script (/exec) → google.script.run
     · servida pelo GitHub Pages       → HTTPS no /exec

   O resto do módulo 3D não sabe em qual dos dois está. Ele
   chama API3D.chamar('locais','listar') e pronto. É assim que
   a regra de negócio não se duplica entre ambientes, que é o
   que a seção 5 pede.

   O CONTRATO é o mesmo que o ALMOX PRO já usa hoje — eu não
   inventei endpoint nenhum:

       { ponte:'ALMOXA', chave:'', modulo, acao, payload,
         sessao, perfil, obra, origem }

   SEGURANÇA. Seção 3: "não colocar senhas, tokens privados ou
   credenciais dentro do código público". Este arquivo vai para
   o GitHub, então ele NÃO guarda chave nenhuma. A URL do /exec
   não é segredo — ela é endereço, e quem decide o que pode ser
   feito é o Core, do lado de lá. Identidade e permissão
   continuam sendo decisão do Core, nunca do navegador.

   ------------------------------------------------------------
   A CHAVE DE APLICATIVO · 08/11, à tarde

   O Core do Ismael EXIGE chave. O sistema principal manda a
   dele e passa; o mapa mandava vazia e levava "não confere".

   Como o mapa passou a conseguir a chave, e o que foi recusado:

     RECUSADO · escrever a chave aqui no arquivo. Isto vai para
       um GitHub público. Seção 3 proíbe, e com razão.
     RECUSADO · mandar a chave no endereço (?chave=…). Ficaria
       na barra, no histórico do navegador e em todo link que
       alguém copiasse. Endereço é endereço; chave não é.
     RECUSADO · mexer no Core para ele parar de exigir chave.
       Afrouxar a tranca para a minha peça caber é o contrário
       de consertar.

     FEITO · o mapa é servido pelo MESMO endereço do sistema
       (biriguialmoxarifado-eng.github.io). Mesma origem quer
       dizer que o mapa pode perguntar ao próprio sistema qual
       é a chave que ele está usando AGORA — pelo window.parent
       quando está no quadro, e pelo armazenamento que o próprio
       ALMOX PRO já mantém quando está em tela cheia.

   A chave fica só na memória, enquanto a página está aberta.
   Este módulo NÃO cria depósito de chave, NÃO grava a chave em
   lugar nenhum e NÃO inventa uma segunda fonte: a fonte continua
   sendo a do sistema. Sem chave, manda vazio e mostra o que o
   Core responder — nunca finge que deu certo.
   ============================================================ */
(function (raiz) {
  'use strict';

  var A = {
    nome: 'API3D',
    versao: '6.9.0',
    url: '',              /* a do /exec, quando rodando fora do Apps Script */
    chave: '',            /* SÓ na memória. Nunca escrita, nunca gravada. */
    origemDaChave: 'nenhuma (fase 1)',
    origemDaPorta: 'própria',
    sessao: null,
    tempoLimite: 20000,
    chamadas: 0,
    falhas: 0,
    ultima: null
  };

  /* ----------------------------------------------------------
     ONDE ESTOU
     ------------------------------------------------------------
     google.script.run só existe quando a página foi servida
     pelo próprio Apps Script. É a prova mais honesta de
     ambiente que existe: ou o objeto está lá, ou não está.
     ---------------------------------------------------------- */
  A.ambiente = function () {
    try {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return 'APPS_SCRIPT';
      }
    } catch (e) { }
    try {
